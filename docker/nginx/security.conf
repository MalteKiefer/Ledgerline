# Overrides the serversideup base image's /etc/nginx/server-opts.d/security.conf.
#
# The base file emits X-Frame-Options / X-Content-Type-Options / Referrer-Policy
# / Strict-Transport-Security via nginx `add_header`. Our app already sets ALL of
# these (and the CSP, COOP, CORP, Permissions-Policy) from ONE place —
# App\Http\Middleware\SecurityHeaders — with the app's intended values
# (X-Frame-Options: DENY, HSTS only under TLS, etc.). nginx `add_header` APPENDS,
# so keeping the base ones produced duplicate headers and, for X-Frame-Options,
# two conflicting values (SAMEORIGIN + DENY → browser "conflicting headers"
# warning). We therefore drop the nginx-level security headers entirely and let
# the middleware own them (single source of truth), while KEEPING the base file's
# hardening `location` blocks (dotfile + sensitive-extension denial).
#
# This file is included at SERVER context (site-opts.d/http.conf.template ends
# with `include /etc/nginx/server-opts.d/*.conf;` inside the server block), so
# only http/server-valid directives may live here. It sorts LAST among the
# server-opts.d includes (00-assets, 00-dav, performance, security), so the
# asset/dav locations above match first; only sensitive paths fall through to
# the deny blocks below. `server_tokens off` is set at http context via the
# NGINX_SERVER_TOKENS env (see docker-compose.yml app service), not here.

# ------------------------------------------------------------------------------
# | Request limits / slow-loris hardening (internet-facing via NetBird+Caddy)  |
# ------------------------------------------------------------------------------
# The base image sets only `keepalive_timeout 65` (http) and the env-driven
# `client_max_body_size` (NGINX_CLIENT_MAX_BODY_SIZE=560M, MUST stay >= the app's
# 550 MB max upload / PHP post_max_size / Caddy request_body — do NOT lower it
# here; it is intentionally left to the env so uploads keep working). The
# defaults for the header/body/send timeouts (60s) and header buffers (4 8k) are
# made explicit and tightened where safe, to bound slow-client resource holding
# now that the app is reachable from the public internet. Requests are fully
# buffered by the upstream proxy, so headers arrive fast → a short header timeout
# is safe. Body/send timeouts stay generous so large (multi-hundred-MB) uploads
# and streamed downloads over slow links are not aborted mid-transfer.
client_header_timeout       15s;   # slow-loris on request headers
client_body_timeout         60s;   # per-read window; generous for 550 MB uploads
send_timeout                60s;   # per-write window; generous for large downloads
keepalive_timeout           30s;   # bound idle keep-alive hold (base was 65s)
large_client_header_buffers 4 8k;  # cap total request-header memory at 32 KiB/conn

# ------------------------------------------------------------------------------
# | File Access Restrictions                                                   |
# ------------------------------------------------------------------------------

# Block access to hidden files and directories (dotfiles) EXCEPT /.well-known/
# (RFC 8615: ACME, security.txt, …). This already denies /.env, /.git, etc.
location ~ /\.(?!well-known) {
    deny all;
}

# Block access to files that may expose sensitive information. Superset of the
# base H5BP list, extended (internet-facing) with credential/key/db/config
# extensions that must never be served even if one is mistakenly placed under the
# public docroot. NOTE: deliberately does NOT include .json/.map/.wasm/.mjs/
# .webmanifest so Vite build assets, source maps and the PWA manifest keep
# working (those are served by the earlier performance.conf asset location).
location ~* (?:#.*#|~|\.(?:bak|old|orig|save|conf|config|dist|inc|ini|log|sh|sql|sqlite|sqlite3|db|env|yml|yaml|toml|lock|pem|key|crt|cer|p12|pfx|sw[op]))$ {
    deny all;
}
