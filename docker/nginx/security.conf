# Overrides the serversideup base image's /etc/nginx/server-opts.d/security.conf.
#
# The base file emits X-Frame-Options / X-Content-Type-Options / Referrer-Policy
# / Strict-Transport-Security via nginx `add_header`. Our app already sets ALL of
# these (and the CSP, COOP, CORP, Permissions-Policy) from ONE place —
# App\Http\Middleware\SecurityHeaders — with the app's intended values
# (X-Frame-Options: DENY, HSTS only under TLS, etc.). nginx `add_header` APPENDS,
# so keeping the base ones produced duplicate headers and, for X-Frame-Options,
# two conflicting values (SAMEORIGIN + DENY → browser "conflicting headers"
# warning). We therefore drop the nginx-level security headers entirely and let
# the middleware own them (single source of truth), while KEEPING the base file's
# hardening `location` blocks (dotfile + sensitive-extension denial).

# Block access to hidden files and directories (dotfiles) EXCEPT /.well-known/
# (RFC 8615: ACME, security.txt, …).
location ~ /\.(?!well-known) {
    deny all;
}

# Block access to files that may expose sensitive information.
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
