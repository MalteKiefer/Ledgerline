; Ledgerline PHP settings for the FrankenPHP + Octane runtime. The old
; serversideup base took these via PHP_* env vars; FrankenPHP reads php.ini, so
; they are baked here (memory_limit is additionally overridable per service via
; the PHP_MEMORY_LIMIT env → conf.d/zz-runtime.ini, see entrypoint.sh).

memory_limit = 512M
post_max_size = 560M
upload_max_filesize = 550M
max_execution_time = 120
expose_php = Off

; OPcache tuned for a long-lived Octane worker: the app code is immutable inside
; the image, so timestamp validation is off (never re-stats files on each hit).
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
