  /files/folders:
    get:
      tags: [Files]
      operationId: filesFolders
      summary: All folders
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Folders., content: { application/json: { schema: { type: object, properties: { folders: { type: array, items: { $ref: "#/components/schemas/FileFolder" } } } } } } }
