openapi: 3.1.0
info:
  title: Ledgerline API
  version: 1.721.0
  license:
    name: Proprietary
  description: >
    Plaintext-relational personal cloud API for the Ledgerline mobile client.

    **Architecture:** every module is a relational table exposed over per-record
    REST (soft-delete trash + optimistic-concurrency `version`). ALL user content is
    plaintext at rest since v1.516.0 — confidentiality at rest is an infrastructure
    concern (LUKS full-disk encryption + encrypted backups). Only OPERATIONAL SECRETS
    (SMTP / backup / Paperless credentials, backup passphrases) remain encrypted at
    rest via the Laravel `encrypted` cast (APP_KEY) and are never serialised into any
    response. The client sends and receives plaintext over TLS. Binary files (invoice
    PDFs, receipts) are stored as plaintext bytes and streamed by id. (The former
    zero-knowledge / vault / sealed-store model was fully removed in the v1.5xx pivot.)

    **Authentication:** obtain a Sanctum bearer token via the device pairing
    exchange (QR code scan + owner approval in the web UI), then include it as
    `Authorization: Bearer <token>` on every request. All routes except the two
    pairing endpoints require the `device` Sanctum ability. Sanctum's absolute
    token lifetime is shortened to 60 days for the internet-facing deployment
    (v1.562.0); re-pair / re-login to renew (idle + remote-wipe revocation apply
    on top). Login also requires a verified email address before a bearer is
    minted (403 `{status:"verify-email"}`), and a blocked account fails auth
    generically (no enumeration).

    **Rate limiting (enforced, v1.562.0):** since the app is served publicly via
    the NetBird proxy (`https://home.pinlo.me`), the former LAN-only no-op
    throttling was reversed — every throttled route now genuinely returns
    **429** with a `Retry-After` header. Named web limiters: login 5/min,
    two-factor challenge 5/min (TOTP is no longer online-brute-forceable),
    fortify 20/min, auth-pair 30/min, dav 120/min, share-unlock 10/min, invite
    10/min. The `/api/v1` endpoints carry inline per-minute throttles (e.g.
    `/auth/login` 10/min, the `/auth/{reset,forgot,register}` broker routes
    6/min, `/invite/*` 20/min, `/file-share/*/unlock` 10/min, `/files/zip`
    120/min); handle 429 by backing off for `Retry-After` seconds.

    **Web-only surfaces (intentionally no /api/v1 twin):** per-user Paperless
    CONFIGURATION (URL/token/enabled + connection test) and the workspace-admin
    settings — notification channels (mail/ntfy/webhook) edit/update/test, system
    settings + error resolution, the `max_connected_devices` security setting, and
    the self-registration toggle — are managed in the web UI only. (Backup, users,
    groups, security-log and the company profile ARE mirrored on the API.)

    **Forced 2FA (workspace policy):** when an admin enables `force_2fa`, EVERY
    authenticated `/api/v1` request from an account without a confirmed second
    factor returns **403** `{status:"two_factor_required"}` (see the
    `TwoFactorRequired` response), except the enrollment/escape endpoints
    (`/me`, `/auth/logout`, `/preferences`, `/locale`, `/theme`,
    `/user/two-factor*`). Clients should route the user to 2FA enrollment on
    that status. This is a workspace-wide gate applied by middleware, not a
    per-operation flag.

    **Response security headers (v1.562.0):** responses carry a tightened header
    set for the internet-facing deployment — `Content-Security-Policy` with
    `frame-ancestors 'self'` + `X-Frame-Options: SAMEORIGIN` (framing default
    reversed from `*`), a broadened `Permissions-Policy` denylist, and stripped
    `Server`/`X-Powered-By`. These are transport headers, not JSON — clients need
    no changes.

servers:
  - url: /api/v1
    description: Current stable API base path

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Device pairing exchange and session management
  - name: Passkeys
    description: >
      WebAuthn passkeys / hardware security keys (YubiKey, Nitrokey, platform
      authenticators) via web-auth/webauthn-lib. Public login pair mints a
      device bearer token; management endpoints require the authenticated user
      plus a current-password step-up to register. Public-key only at rest
      (none-attestation).
  - name: GallerySharing
    description: >
      Public album share links (token, optional password/expiry, allow_download
      gate) + internal cross-user shares (an album or the whole gallery, viewer-
      only). Public /gallery-share/{token} routes are unauthenticated (the token
      is the credential); a password gate is carried by a stateless grant.
  - name: Me/Device
    description: Authenticated user info, avatar, and device heartbeat
  - name: Finance
  - name: Files
    description: >
      Plaintext-relational finance (pivot). Invoices, bank transactions, payment
      methods, business partners, cost projects and receipt categories as
      owner-scoped rows. ALL finance columns are plaintext at rest since v1.516.0
      (only operational secrets — SMTP/backup/Paperless credentials — remain
      encrypted); confidentiality at rest is an infrastructure concern (LUKS +
      encrypted backups). Amounts/dates/numbers drive stats + GoBD. Invoice numbering
      is server-authoritative (POST /finance/invoices/{invoice}/finalize, atomic
      per-year). PDF + receipt files are plaintext blobs on disk. Every mutating
      route is owner-scoped and gated by the finance module (403 when disabled); the
      per-record update routes use optimistic `version` concurrency (409 on
      conflict). OCR (POST /invoices/ocr) and the company profile (/company) sit
      alongside.
  - name: Devices
    description: Connected device listing, revocation, and remote-wipe management
  - name: Notifications
    description: In-app notification bell — list recent items, mark read
  - name: Account
    description: GDPR data export, account deletion, and session revocation
  - name: Preferences
    description: User preferences — locale and colour-scheme
  - name: Groups
    description: >
      Admin group management (requires the admin role on top of the device token).
      A group is a reusable limit template (files/gallery quota + device cap) plus a
      shareable flag; membership is many-to-many. Limits and membership are non-secret
      metadata.
  - name: Company
    description: >
      Per-user company profile and invoice defaults (the Finance module's business
      identity + numbering/appearance settings). This is the user's OWN business
      identity that prints on every invoice — non-secret, served in the clear like the
      avatar (it is the business's own identity, never customer data).
      The invoice records, payment methods and imported bank transactions themselves
      live in the relational finance tables (see the Finance tag).
  - name: Status
    description: Application availability / health check (the site-root /up up-check).
  - name: TwoFactor
    description: >
      Self-service TOTP two-factor + app-password management for a paired device
      (Sanctum bearer). Mirrors the web Fortify flow, which is browser-only.
  - name: DevicePairings
    description: >
      Owner-side device pairing: an already-paired device generates a code, polls
      it, and approves/rejects the new device's claim. Owner-scoped.
  - name: Users
    description: >
      Admin user management (requires the admin role on top of the device token —
      `can:manage-global-settings`). No credentials (password hashes, 2FA secrets)
      are ever returned. Non-admins get 403.
  - name: Crypto
    description: >
      Shared encryption keyring (profile-level, not mail-gated): the user's own
      PGP/S-MIME keys (managed via the same MailKeyController as /mail/keys — the
      /crypto/keys ops are identical) plus saved recipients (other people's public
      keys/certs) plus configured HKP keyservers, used to search for recipient
      keys, import/refresh them, and publish/check-presence of the user's own
      PGP keys. Drives the Files module's encrypt/decrypt.
  - name: Backup
    description: >
      Admin backup management (admin role + device token). Credential hygiene is
      enforced: destination `config` (cloud credentials) and job `passphrase` are
      NEVER present in any response. A database job with encrypt=false is refused
      (422) — a DB dump contains all data (plaintext) plus the encrypted operational
      secrets, and must never leave the box unencrypted.
  - name: SecurityLog
    description: >
      Admin, read-only, metadata-only audit trail (admin role + device token). Rows
      never contain tokens/keys/ciphertext.
  - name: SecurityPortal
    description: >
      Admin security portal (admin role + device token): verbose HTTP request log
      with CSV/JSON export, IP block-list CRUD, per-user block toggle, and a
      cross-user session/device overview.
  - name: Paperless
    description: >
      Per-user Paperless-ngx integration: cached term quick-picks, live term
      creation, cache sync, and document forwarding. `POST /paperless/documents` is
      a transient-cleartext boundary (like POST /invoices/ocr): the client posts the
      raw document bytes, the server forwards them to the user's own Paperless
      instance and stores/logs nothing. Per-user Paperless CONFIGURATION (URL / token
      / enabled flag) is managed via GET/PUT /paperless/config + POST
      /paperless/config/test; the API token is never returned (has_token bool).
  - name: Settings
    description: >
      Admin workspace settings (requires the admin role on top of the device token —
      `can:manage-global-settings`): outgoing notifications (SMTP/NTFY/webhook) with a
      test send, the paired-device cap, the Files upload/orphan-grace limits, and the
      read-only System/maintenance overview. Operative secrets (SMTP password, ntfy
      token, webhook secret) are NEVER returned — a GET reports has_* booleans and a
      blank submission preserves the stored secret. Non-admins get 403.
  - name: Contacts
    description: >
      CardDAV-backed contacts module (address books + contacts + groups +
      duplicate detection), plaintext-relational. The same guard-agnostic
      controllers back the web routes; these `/api/v1` mirrors are gated by
      `module:contacts` on top of device auth. Blade-only screens
      (index/create/edit/view) are not exposed. `GET /contacts/data` returns
      `{contacts, books, groups}`; `GET /contacts/{id}` returns the full parsed
      vCard (fn, org, emails/phones/urls/addresses, note, group_ids). Owner-scope
      is enforced controller-side; avatar bytes stream from `/contacts/{id}/avatar`.
  - name: Servers
    description: >
      Agentless server monitoring over plain SSH. A server row holds the
      connection (host/port/user) plus the credential, which is encrypted at rest
      and never serialised. The target's host key is pinned: `POST /servers/test`
      reports the fingerprint it saw, the user confirms it, and `POST /servers`
      requires that value — trust-on-first-use is an explicit step, not something
      the server does silently. Collection runs in the queue (`POST
      /servers/{id}/refresh` returns 202 and the snapshot appears in a later
      index/show); the only endpoint that opens an SSH session inline is the
      connection test, which uses tight interactive timeouts. The transport is
      the OpenSSH client, not a PHP SSH library: a hardened sshd may offer only
      post-quantum key exchange (mlkem768x25519-sha256,
      sntrup761x25519-sha512@openssh.com), which no pure-PHP implementation
      speaks. Consequently authentication is key-only — OpenSSH takes no password
      without a terminal — and `POST /servers/keypair` generates one for the user.
      Gated by `module:servers` on top of device auth and owner-scoped.
  - name: Notes
    description: >
      Notes module (plaintext-relational, Markdown). A nested folder tree + notes
      with a plaintext Markdown body, tags, pin/favorite, optimistic `version`
      (→ 409) and a soft-delete recycle bin. The same guard-agnostic
      `NotesController` backs the web routes; these `/api/v1` mirrors are gated by
      `module:notes` on top of device auth. `GET /notes/data` returns
      `{folders, notes, tags}` (notes without body); `GET /notes/{id}` returns the
      full note incl. body. Search uses the Postgres GIN index (title+body).
      Owner-scope is enforced controller-side.
  - name: Gallery
    description: >
      Gallery module (plaintext-relational, phase 1). Photos as owner-scoped rows;
      bytes live plaintext on the files disk under `gallery/{uuid}`. The same
      guard-agnostic `GalleryController` backs the web routes; these `/api/v1`
      mirrors are gated by `module:gallery` on top of device auth. Whole + chunked
      upload (image MIME allow-list), server-side WebP thumbnails, sandboxed
      originals, favorite and a soft-delete recycle bin. Combined files+gallery
      storage counts against `files.quota_mb` (413 on exceed). Owner-scope is
      enforced controller-side.
  - name: Calendar
    description: >
      CalDAV-backed calendar module (calendars + events), plaintext-relational.
      The same guard-agnostic controllers back the web routes; these `/api/v1`
      mirrors are gated by `module:calendar` on top of device auth. The Blade/SPA
      entry (index) is not exposed. `GET /calendar/data` returns
      `{calendars, settings}`; `GET /calendar/events?from=&to=` returns
      recurrence-expanded occurrences; `GET /calendar/events/{id}` returns the
      full parsed VEVENT editor shape + etag. Optimistic concurrency is the
      DAV-native etag (409 on mismatch). Owner-scope is enforced controller-side.
      CalDAV itself is served over the unified `/dav` Sabre endpoint (HTTP Basic,
      not `/api/v1`) — the same surface as CardDAV, absent from this document.
  - name: Geo
    description: >
      App-generic forward geocoding (address autocomplete). Server-proxied to
      OpenStreetMap Nominatim through the SSRF-guarded outbound client
      (rate-limited, cached); the query + coordinates are never logged and the
      response is `no-store`. Authenticated (device auth on `/api/v1`) but NOT
      module-gated — both the calendar event editor and the contacts map preview
      use it. A query shorter than 3 chars returns an empty list without an
      upstream call.
  - name: Mail
    description: >
      Plaintext-relational IMAP mail archive (Phase 1). Per-user IMAP accounts
      (the password is the only encrypted-at-rest secret, never serialised) are
      synced pull-only + read-only-origin via mbsync into an immutable archive:
      the server parses each message into denormalised envelope columns + a
      plaintext body + server-sanitised HTML + a full-text search column, and
      stores the raw `.eml` bytes plaintext on the files disk (served sandboxed by
      id). Gated by `module:mail` on top of device auth; owner-scoped (404, never
      403, on a foreign id). Messages are IMMUTABLE — only `seen`/`trashed_at`
      toggle; there is no edit or hard-delete endpoint. Deleting an ACCOUNT keeps
      its archived mail; only a full GDPR user purge removes everything.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >
        First-party Sanctum token with ability `device`. Obtained via the
        pairing exchange. Include as `Authorization: Bearer <token>`.

  responses:
    Unauthorized:
      description: Unauthenticated — missing, invalid, or expired bearer token.
    Forbidden:
      description: >
        Forbidden — the Sanctum token lacks the required `device` ability, the
        Finance module is disabled for this account (module:finance gate), or (on
        admin routes) the caller is not an admin (manage-global-settings).
    TwoFactorRequired:
      description: >
        Two-factor enrollment required. When the workspace has `force_2fa`
        enabled (admin security policy), EVERY authenticated `/api/v1` request
        from an account without a confirmed second factor returns this, EXCEPT
        the enrollment/escape endpoints (`/me`, `/auth/logout`, `/preferences`,
        `/locale`, `/theme`, `/user/two-factor*`). Enroll a second factor to
        clear it. Body `status` is `two_factor_required` (distinct from the
        generic Forbidden). Enforced by the EnsureTwoFactorEnrolled middleware.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [two_factor_required] }
              message: { type: string }
    NotFound:
      description: Not found, or not owned by the caller (owner-scoped; existence is not leaked).
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    VersionConflict:
      description: >
        Optimistic-concurrency conflict — the stored `version` no longer matches the
        `version` sent. Re-fetch the row, merge, and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VersionConflict" }
    RateLimited:
      description: >
        Too many requests — the route's per-minute rate limit was exceeded.
        Rate limiting is genuinely enforced again on the internet-facing
        deployment (v1.562.0); it was inert under the former LAN-only build.
        Back off and retry after the `Retry-After` interval.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (standard throttle header).
          schema: { type: integer }

  schemas:
    GalleryPublicShare:
      type: object
      properties:
        id: { type: integer }
        album_id: { type: integer }
        album: { type: [string, "null"] }
        token: { type: string }
        has_password: { type: boolean }
        allow_download: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
    GalleryInternalShare:
      type: object
      properties:
        id: { type: integer }
        album_id: { type: [integer, "null"] }
        album: { type: [string, "null"] }
        recipient: { type: [string, "null"] }
        scope: { type: string, enum: [album, library] }
    GallerySharedWithMe:
      type: object
      properties:
        id: { type: integer }
        scope: { type: string, enum: [album, library] }
        name: { type: [string, "null"] }
        owner: { type: [string, "null"] }
        count: { type: integer }
        cover: { type: [integer, "null"] }
    GallerySharedPhoto:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        media_type: { type: string, enum: [image, video] }
        taken_at: { type: [string, "null"], format: date-time }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
    WebauthnCredential:
      type: object
      description: A registered passkey / hardware key (public-key only, owner-scoped).
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
    ValidationError:
      type: object
      description: >
        Laravel validation-failure body (HTTP 422). `errors` maps each failed field
        to its messages.
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    MailSignatureInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        html: { type: [string, "null"], description: "Sanitized rich HTML signature." }
        account_ids: { type: array, items: { type: integer } }
        default_account_ids: { type: array, items: { type: integer }, description: "Subset of account_ids made default for those accounts." }
    VersionConflict:
      type: object
      description: >
        Optimistic-concurrency conflict body. `version` is the current stored
        version the client should rebase onto.
      required: [error, version]
      properties:
        error: { type: string, enum: [version_conflict] }
        version: { type: integer }
    FinanceError:
      type: object
      description: "Business-rule rejection body: a machine-readable `error` code (HTTP 422)."
      required: [error]
      properties:
        error: { type: string }
    TransactionReceipt:
      type: object
      description: >
        A receipt entry embedded in a bank transaction's `receipts[]`. File receipts
        are created only via POST /finance/transactions/{transaction}/receipts;
        `blob_path` is the SERVER-owned on-disk path (never accepted from the client).
        Fileless entries (invoice links / Eigenbeleg metadata) may be added via the
        transaction PUT.
      required: [id, name, kind, tags, locked, trashed]
      properties:
        id: { type: string, description: "UUID assigned server-side." }
        blob_path: { type: [string, "null"], description: "Server-owned storage path under invoices/ (read-only; response only)." }
        name: { type: string }
        mime: { type: [string, "null"] }
        kind: { type: string, example: receipt, description: "e.g. receipt | invoice | eigenbeleg." }
        category: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        contactId: { type: [string, "null"] }
        partnerId: { type: [integer, "null"] }
        vat: { type: [string, "null"] }
        locked: { type: boolean, description: "A locked receipt (e.g. an auto-linked invoice) cannot be deleted." }
        trashed: { type: boolean }

    WebDavAccess:
      type: object
      description: >
        WebDAV mount access status. The password is stored hashed and never returned.
      required: [enabled, username, url]
      properties:
        enabled: { type: boolean, description: "Whether an app-specific WebDAV password is set." }
        username: { type: string, description: "The username to authenticate with (the account email)." }
        url: { type: string, format: uri, description: "The WebDAV mount URL (…/dav/)." }

    PaperlessConfig:
      type: object
      description: >
        Per-user Paperless connection config. The API token is never returned;
        `has_token` reports whether one is stored.
      required: [paperless_enabled, paperless_url, has_token, counts]
      properties:
        paperless_enabled: { type: boolean }
        paperless_url: { type: [string, "null"], format: uri }
        has_token: { type: boolean }
        counts:
          type: object
          required: [tag, document_type, correspondent]
          properties:
            tag: { type: integer }
            document_type: { type: integer }
            correspondent: { type: integer }

    NotificationConfig:
      type: object
      description: >
        Workspace notification config with secrets masked. Secret values
        (smtp_password / ntfy_token / webhook_secret) are represented only by
        has_* booleans and are never returned.
      required:
        [mail_enabled, has_smtp_password, ntfy_enabled, has_ntfy_token, webhook_enabled, has_webhook_secret]
      properties:
        mail_enabled: { type: boolean }
        smtp_host: { type: [string, "null"] }
        smtp_port: { type: [integer, "null"] }
        smtp_encryption: { type: [string, "null"], enum: [tls, ssl, null] }
        smtp_username: { type: [string, "null"] }
        smtp_from_address: { type: [string, "null"], format: email }
        smtp_from_name: { type: [string, "null"] }
        has_smtp_password: { type: boolean }
        ntfy_enabled: { type: boolean }
        ntfy_url: { type: [string, "null"], format: uri }
        ntfy_topic: { type: [string, "null"] }
        has_ntfy_token: { type: boolean }
        webhook_enabled: { type: boolean }
        webhook_url: { type: [string, "null"], format: uri }
        has_webhook_secret: { type: boolean }
    NotificationConfigWrite:
      type: object
      description: >
        Notification config update. Only submitted fields are persisted. Secret
        fields (smtp_password/ntfy_token/webhook_secret) preserve the stored value
        when omitted or blank.
      properties:
        mail_enabled: { type: boolean }
        smtp_host: { type: [string, "null"], maxLength: 255, description: "SSRF-guarded (v1.562.0): a host resolving to a link-local / cloud-metadata / internal range is rejected with 422 (parity with ntfy_url/webhook_url)." }
        smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        smtp_encryption: { type: [string, "null"], enum: [tls, ssl, null] }
        smtp_username: { type: [string, "null"], maxLength: 255 }
        smtp_password: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }
        smtp_from_address: { type: [string, "null"], format: email, maxLength: 255 }
        smtp_from_name: { type: [string, "null"], maxLength: 255 }
        ntfy_enabled: { type: boolean }
        ntfy_url: { type: [string, "null"], format: uri, maxLength: 255 }
        ntfy_topic: { type: [string, "null"], maxLength: 255 }
        ntfy_token: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }
        webhook_enabled: { type: boolean }
        webhook_url: { type: [string, "null"], format: uri, maxLength: 255 }
        webhook_secret: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }

    FilesLimits:
      type: object
      description: "Workspace Files limits (admin override, or the config default)."
      required: [files_max_upload_mb, files_blob_orphan_grace_hours]
      properties:
        files_max_upload_mb: { type: integer }
        files_blob_orphan_grace_hours: { type: integer }

    SecurityPolicy:
      type: object
      description: "Workspace security policy: device cap, password policy and force-2FA."
      properties:
        max_connected_devices: { type: integer }
        pw_min_length: { type: [integer, "null"] }
        pw_require_mixed_case: { type: boolean }
        pw_require_numbers: { type: boolean }
        pw_require_symbols: { type: boolean }
        pw_check_breaches: { type: boolean }
        force_2fa: { type: boolean }

    SystemOverview:
      type: object
      description: "Read-only operational overview (metadata only — no secrets)."
      required: [tasks, status, trend, errors, audit]
      properties:
        tasks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              expression: { type: string }
              lastAt: { type: [string, "null"] }
              lastOk: { type: [boolean, "null"] }
        status:
          type: object
          description: "SystemStatus snapshot (version/queue/storage/errors/backup/scheduler/disk)."
          additionalProperties: true
        trend:
          type: object
          description: "Storage trend over ~30 days ({points, deltaBytes, deltaDays})."
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              level: { type: [string, "null"] }
              exception: { type: [string, "null"] }
              message: { type: [string, "null"] }
              file: { type: [string, "null"] }
              line: { type: [integer, "null"] }
              count: { type: integer }
              first_seen_at: { type: [string, "null"] }
              last_seen_at: { type: [string, "null"] }
              resolved_at: { type: [string, "null"] }
        audit:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              action: { type: string }
              actor: { type: [string, "null"] }
              ip: { type: [string, "null"] }
              meta: { type: [object, "null"], additionalProperties: true }
              created_at: { type: [string, "null"] }

    CompanyProfile:
      type: object
      description: >
        Per-user company profile + invoice defaults (the business identity that prints
        on invoices). Non-secret. All fields are optional; on PUT, only the fields sent
        are updated. `has_logo` is read-only (response only).
      properties:
        company_name: { type: [string, "null"], maxLength: 200 }
        company_address: { type: [string, "null"], maxLength: 1000 }
        company_email: { type: [string, "null"], format: email, maxLength: 200 }
        company_phone: { type: [string, "null"], maxLength: 100 }
        company_tax_id: { type: [string, "null"], maxLength: 100 }
        company_vat_id: { type: [string, "null"], maxLength: 100 }
        company_iban: { type: [string, "null"], maxLength: 60 }
        company_bic: { type: [string, "null"], maxLength: 20 }
        company_bank_name: { type: [string, "null"], maxLength: 200 }
        invoice_number_format: { type: [string, "null"], maxLength: 40, description: "e.g. YYYY-NNNN. Locked client-side once the current year has invoices (GoBD)." }
        invoice_next_number: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "Numbering floor; the actual next number is derived per year from the invoices." }
        invoice_default_vat_rate: { type: [number, "null"], minimum: 0, maximum: 100 }
        small_business: { type: boolean, description: "§19 Kleinunternehmer — when true, invoices show no VAT and the VAT return reports zero output VAT." }
        invoice_payment_terms_days: { type: [integer, "null"], minimum: 0, maximum: 365 }
        invoice_footer_text: { type: [string, "null"], maxLength: 2000 }
        invoice_accent_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_heading_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_template: { type: [string, "null"], enum: [editorial, modern, elegant, klassisch, schlicht] }
        invoice_payment_methods: { type: [string, "null"], maxLength: 500 }
        invoice_payment_terms_text: { type: [string, "null"], maxLength: 1000 }
        company_website: { type: [string, "null"], maxLength: 255 }
        company_contacts: { type: array, maxItems: 20, items: { type: object, properties: { name: { type: [string, "null"] }, role: { type: [string, "null"] }, email: { type: [string, "null"] }, phone: { type: [string, "null"] } } } }
        invoice_font: { type: [string, "null"], maxLength: 80 }
        invoice_vat_ist: { type: boolean, description: "Ist-Versteuerung (cash-basis VAT) toggle." }
        has_logo: { type: boolean, readOnly: true, description: "Whether a company logo is stored (GET /company/logo)." }

    Calendar:
      type: object
      description: A CalDAV calendar collection, owner-scoped.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        uri: { type: string }
        color: { type: [string, "null"], description: "#RRGGBB or #RRGGBBAA (Apple CALENDAR-COLOR)." }
        kind: { type: string, enum: [normal, holidays, school_holidays, birthdays], description: "normal = editable; holidays/school_holidays/birthdays = generated + read-only." }
        component: { type: string, enum: [VEVENT, VTODO], description: "Collection component type: VEVENT = event calendar, VTODO = task list (Apple Reminders / Tasks.org)." }
        country: { type: [string, "null"], description: "ISO 3166-1 alpha-2 (holiday kinds), remembered for regenerate. e.g. DE." }
        subdivision: { type: [string, "null"], description: "OpenHolidays subdivision code (holiday kinds), e.g. DE-BY; null = national." }
        owned: { type: boolean }

    CalendarOccurrence:
      type: object
      description: >
        A concrete occurrence of an event within the queried [from,to] window
        (recurring masters emit one per occurrence). id/uid identify the master
        for edit; color echoes the parent calendar for rendering. Times are UTC.
      properties:
        id: { type: string, format: uuid }
        calendar: { type: string, format: uuid }
        uid: { type: string }
        summary: { type: [string, "null"] }
        location: { type: [string, "null"] }
        description: { type: [string, "null"] }
        geo_lat: { type: [number, "null"], description: "Picked location latitude (-90..90); null if none set." }
        geo_lon: { type: [number, "null"], description: "Picked location longitude (-180..180); null if none set." }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        all_day: { type: boolean }
        status: { type: [string, "null"], enum: [CONFIRMED, TENTATIVE, CANCELLED, null] }
        recurring: { type: boolean }
        color: { type: [string, "null"] }

    CalendarEvent:
      type: object
      description: The full parsed VEVENT editor shape plus ids + etag.
      properties:
        id: { type: string, format: uuid }
        calendar: { type: string, format: uuid }
        uid: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        description: { type: [string, "null"] }
        location: { type: [string, "null"] }
        geo_lat: { type: [number, "null"], description: "Picked location latitude (-90..90); null if none set." }
        geo_lon: { type: [number, "null"], description: "Picked location longitude (-180..180); null if none set." }
        dtstart: { type: [string, "null"], format: date-time }
        dtend: { type: [string, "null"], format: date-time }
        all_day: { type: boolean }
        rrule: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [CONFIRMED, TENTATIVE, CANCELLED, null] }
        alarm_minutes_before: { type: [integer, "null"], minimum: 0, maximum: 40320, description: "Minutes before start of the DISPLAY VALARM reminder; null if none." }
        sequence: { type: integer }
        etag: { type: string }

    CalendarEventInput:
      type: object
      required: [dtstart]
      properties:
        calendar_id: { type: string, format: uuid, description: "Required on create." }
        summary: { type: [string, "null"], maxLength: 255 }
        description: { type: [string, "null"], maxLength: 5000 }
        location: { type: [string, "null"], maxLength: 255 }
        geo_lat: { type: [number, "null"], minimum: -90, maximum: 90, description: "Picked location latitude; stored as VEVENT GEO. Emitted only with geo_lon." }
        geo_lon: { type: [number, "null"], minimum: -180, maximum: 180, description: "Picked location longitude; stored as VEVENT GEO. Emitted only with geo_lat." }
        dtstart: { type: string, format: date-time }
        dtend: { type: [string, "null"], format: date-time, description: "after_or_equal dtstart." }
        all_day: { type: boolean }
        rrule: { type: [string, "null"], maxLength: 255, description: "iCalendar RRULE; validated by parsing." }
        status: { type: [string, "null"], enum: [CONFIRMED, TENTATIVE, CANCELLED, null] }
        alarm_minutes_before: { type: [integer, "null"], minimum: 0, maximum: 40320, description: "Emits a relative VALARM (-PTnM) this many minutes before start." }
        etag: { type: [string, "null"], description: "Optional optimistic-concurrency token on update (409 on mismatch)." }

    CalendarTodo:
      type: object
      description: >
        A task (VTODO) in a task-list calendar (component=VTODO). The raw VTODO ICS
        is authoritative; these are the denormalised fields the SPA renders. Times
        are UTC. `next_due` is only present when the list is requested with
        `expand=1` (the next upcoming occurrence of a recurring task).
      properties:
        id: { type: string, format: uuid }
        calendar: { type: string, format: uuid, description: "Owning task-list calendar id." }
        uid: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        description: { type: [string, "null"] }
        status: { type: string, enum: [NEEDS-ACTION, IN-PROCESS, COMPLETED, CANCELLED] }
        priority: { type: [integer, "null"], minimum: 0, maximum: 9, description: "0/absent = none; 1-4 high, 5 medium, 6-9 low." }
        percent_complete: { type: [integer, "null"], minimum: 0, maximum: 100 }
        alarm_minutes_before: { type: [integer, "null"], minimum: 0, maximum: 40320, description: "Minutes before DUE of the DISPLAY VALARM reminder; null if none." }
        due: { type: [string, "null"], format: date-time }
        dtstart: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        all_day: { type: boolean }
        rrule: { type: [string, "null"] }
        categories: { type: array, items: { type: string } }
        related_to: { type: [string, "null"], description: "Parent task UID (subtasks)." }
        sequence: { type: integer }
        sort_order: { type: integer, description: "Manual ordering within the list." }
        color: { type: [string, "null"], description: "Echoes the owning calendar's colour." }
        etag: { type: string }
        next_due: { type: [string, "null"], format: date-time, description: "Only when expand=1: next upcoming occurrence." }

    CalendarTodoInput:
      type: object
      properties:
        calendar_id: { type: string, format: uuid, description: "Required on create; must be a VTODO (task-list) calendar." }
        summary: { type: [string, "null"], maxLength: 255 }
        description: { type: [string, "null"], maxLength: 5000 }
        dtstart: { type: [string, "null"], format: date-time }
        due: { type: [string, "null"], format: date-time }
        completed: { type: [string, "null"], format: date-time }
        all_day: { type: boolean }
        status: { type: [string, "null"], enum: [NEEDS-ACTION, IN-PROCESS, COMPLETED, CANCELLED, null] }
        priority: { type: [integer, "null"], minimum: 0, maximum: 9 }
        percent_complete: { type: [integer, "null"], minimum: 0, maximum: 100 }
        rrule: { type: [string, "null"], maxLength: 255, description: "iCalendar RRULE; validated by parsing." }
        categories: { type: [array, "null"], items: { type: string, maxLength: 100 }, maxItems: 100 }
        related_to: { type: [string, "null"], maxLength: 255 }
        alarm_minutes_before: { type: [integer, "null"], minimum: 0, maximum: 40320, description: "Emits a relative VALARM (-PTnM) this many minutes before DUE." }
        etag: { type: [string, "null"], description: "Optional optimistic-concurrency token on update (409 on mismatch)." }

    CalendarSettings:
      type: object
      properties:
        default_view: { type: string, enum: [month, week, agenda] }
        week_start: { type: integer, enum: [0, 1], description: "0=Sunday, 1=Monday." }

    CalendarImportResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }

    EtagConflict:
      type: object
      description: DAV-native optimistic-concurrency conflict; re-fetch and retry.
      properties:
        error: { type: string, enum: [etag_conflict] }
        etag: { type: string, description: "The current stored etag." }

    Group:
      type: object
      description: >
        A user group: a reusable limit template plus a shareable flag. Limits are
        nullable (null = the group sets no cap for that dimension). Non-secret
        metadata.
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        max_connected_devices: { type: [integer, "null"], description: "Device cap (null = no group cap)." }
        shareable: { type: boolean, description: "Members may offer this group as a share target." }
        modules:
          type: [array, "null"]
          description: >
            Allow-list of enabled module keys for members of this group (null = all
            modules). A member's effective modules are the union across their groups
            (a group with null grants all); a per-user allow-list overrides. Enforced
            server-side and surfaced at /me as user.modules.
          items: { type: string, enum: [finance, files, contacts, calendar, mail] }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              email: { type: string }

    DisplayPreferences:
      type: object
      description: >
        Global, non-secret DISPLAY preferences — measurement units + 12/24h clock.
        Presentation only; the stored data is unchanged (canonical metres/kg/°C/mg-dL). Returned in
        GET /me and set via POST /preferences; the client applies them to its own
        rendering (distances/elevations convert from canonical metres, times honour
        the clock format). Canonical storage is unchanged (metres, kg, °C, mg/dL).
      properties:
        distance: { type: string, enum: [km, mi] }
        elevation: { type: string, enum: [m, ft] }
        weight: { type: string, enum: [kg, lb] }
        temp: { type: string, enum: [c, f] }
        glucose: { type: string, enum: [mgdl, mmoll] }
        time_format: { type: string, enum: [24h, 12h] }
        timezone: { type: [string, "null"], description: "Hard IANA timezone override (e.g. Europe/Berlin); null follows the browser/system zone." }
        date_format: { type: string, enum: [system, dmy, dmy_dot, mdy, ymd], description: "Date-format preset; 'system' uses the locale's regional format." }
        mail_load_remote: { type: boolean, deprecated: true, description: "Deprecated and ignored: remote mail content is controlled per message." }
        mail_signature: { type: [string, "null"], description: "Signature appended to outgoing mail; blank clears it to null." }
        notifications:
          type: object
          description: "Per-category push prefs, keyed by notification category (e.g. task/event/birthday/invoice). Absent category = push enabled."
          additionalProperties:
            type: object
            properties:
              push: { type: boolean, description: "false suppresses push for this category (the centre row is still created)." }

    MeUser:
      type: object
      description: >
        The authenticated user's profile. Returned as the `user` object by GET /me
        and by POST /auth/pair/collect (when `status: approved`). All fields are
        non-secret metadata — no credentials (password hash, 2FA secret) are included.
      required: [id, name, email, locale, groups, modules, has_avatar, two_factor, preferences, theme]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        locale:
          type: string
          description: "The user's UI locale (one of the configured languages, e.g. en, de, ru)."
        groups:
          type: array
          description: >
            Derived from the first-party role: `["admin"]` for admins, `[]` otherwise.
            The historical claim shape is kept so existing mobile clients need no
            change — there is no separate `role` field.
          items: { type: string }
        modules:
          type: array
          description: >
            The application module keys this account may use (per-user / per-group
            toggles). A native client should hide the tabs for modules NOT listed
            here; the API also enforces it — a disabled module's store endpoints
            return 403.
          items: { type: string, enum: [finance, files, contacts, calendar, mail] }
        has_avatar:
          type: boolean
          description: "Whether a non-secret avatar is stored. True → fetch it via GET /api/v1/avatar (Bearer)."
        two_factor:
          type: boolean
          description: "Whether TOTP two-factor authentication is confirmed for the account."
        preferences:
          allOf:
            - $ref: "#/components/schemas/DisplayPreferences"
          description: "Non-secret display preferences (units + 12/24h clock); set via POST /api/v1/preferences."
        theme:
          type: string
          enum: [light, dark, system]
          description: "Current UI theme (set via POST /api/v1/theme)."

    OkResponse:
      type: object
      description: Acknowledgement response.
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    NoteFolder:
      type: object
      description: A folder in the notes tree (plaintext-relational, owner-scoped).
      properties:
        id: { type: integer }
        parent_id: { type: [integer, "null"] }
        name: { type: string }
        color: { type: [string, "null"] }
        position: { type: integer }
        version: { type: integer, description: Optimistic-concurrency counter. }
    NoteFolderInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 500 }
        parent_id: { type: [integer, "null"], description: Owner's folder id; a cycle is rejected 422. }
        color: { type: [string, "null"], maxLength: 32 }
        position: { type: integer }
    NoteRow:
      type: object
      description: Lightweight note row (list view — no body).
      properties:
        id: { type: integer }
        note_folder_id: { type: [integer, "null"] }
        title: { type: string }
        tags: { type: array, items: { type: string } }
        pinned: { type: boolean }
        favorite: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    Note:
      type: object
      description: A full note (editor view) — the plaintext Markdown body is included.
      properties:
        id: { type: integer }
        note_folder_id: { type: [integer, "null"] }
        title: { type: string }
        body: { type: string, description: Plaintext Markdown; rendered client-side (sanitised). }
        tags: { type: array, items: { type: string } }
        pinned: { type: boolean }
        favorite: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
        backlinks:
          type: array
          description: Notes that link to this one (present on show/store/update).
          items: { $ref: "#/components/schemas/NoteBacklink" }
        attachments:
          type: array
          description: File/image attachments (present on show).
          items: { $ref: "#/components/schemas/NoteAttachment" }
    NoteAttachment:
      type: object
      description: A file/image attached to a note (bytes served sandboxed via .../raw).
      properties:
        id: { type: integer }
        name: { type: string }
        mime: { type: [string, "null"] }
        size: { type: integer }
    NoteBacklink:
      type: object
      description: A note linking to the current one, with a short body snippet.
      properties:
        id: { type: integer }
        title: { type: string }
        snippet: { type: string }
    NoteInput:
      type: object
      properties:
        title: { type: [string, "null"], maxLength: 500 }
        body: { type: [string, "null"], description: Plaintext Markdown. }
        tags: { type: array, items: { type: string, maxLength: 100 }, maxItems: 100 }
        pinned: { type: boolean }
        favorite: { type: boolean }
        note_folder_id: { type: [integer, "null"], description: Owner's folder id. }

    Invoice:
      type: object
      description: >
        Invoice (relational table invoices). All columns are plaintext at rest since
        v1.516.0 (confidentiality is an infra concern: LUKS + encrypted backups).
        customer/lines/versions are JSON columns; money + number/date drive stats +
        GoBD numbering. number/seq/year/type=credit_note/cancels_invoice_id/pdf_path/
        version/version_seq are server-managed and never mass-assigned via CRUD.
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        number: { type: [string, "null"] }
        seq: { type: [integer, "null"] }
        year: { type: [integer, "null"] }
        status: { type: string, enum: [draft, final, sent, paid] }
        type: { type: string, enum: [invoice, credit_note], description: "Document kind. A credit note (Storno/Gutschrift) reverses a finalized invoice and carries its own GoBD number." }
        cancels_invoice_id: { type: [integer, "null"], description: "For a credit note, the id of the invoice it cancels (server-set, never mass-assigned)." }
        issue_date: { type: [string, "null"] }
        due_date: { type: [string, "null"] }
        currency: { type: string }
        vat_rate: { type: [string, "null"] }
        gross: { type: [string, "null"] }
        net: { type: [string, "null"] }
        vat: { type: [string, "null"] }
        discount_type: { type: [string, "null"], enum: [percent, amount, null], description: "Global invoice-level discount kind (Rabatt) on the net taxable base." }
        discount_value: { type: [string, "null"], description: "Discount value: a percentage when discount_type=percent, else an absolute amount." }
        skonto_percent: { type: [string, "null"], description: "Early-payment Skonto percentage printed on the invoice." }
        skonto_days: { type: [integer, "null"], description: "Early-payment Skonto window in days from the issue date." }
        imported: { type: boolean }
        paid_at: { type: [string, "null"], format: date-time }
        sent_at: { type: [string, "null"], format: date-time, description: "When the invoice PDF was emailed to the customer." }
        reminded_at: { type: [string, "null"], format: date-time, description: "When a payment reminder (dunning) was last sent." }
        reminder_count: { type: integer, description: "Dunning level (Mahnstufe) — how many customer reminders have gone out." }
        payment_account: { type: [string, "null"] }
        partner_id: { type: [integer, "null"] }
        pdf_path: { type: [string, "null"] }
        customer: { type: [object, "null"], additionalProperties: true, description: "Denormalised customer snapshot (nullable). May carry `invoiceEmail` (dedicated Rechnungs-E-Mail, preferred over `email` when emailing/dunning) alongside name/attn/address/email/vatId/partnerId." }
        lines: { type: [array, "null"], items: { type: object, additionalProperties: true } }
        note: { type: [string, "null"] }
        versions:
          type: [array, "null"]
          description: "GoBD correction trail. Pass a version's `seq` as `version_seq` to the PDF ops to read/attach that version's own PDF."
          items:
            type: object
            properties:
              seq: { type: integer, description: "Version sequence — pass as version_seq to the PDF ops." }
              label: { type: [string, "null"] }
              pdf: { type: [string, "null"], description: "Stored blob path of this version's own PDF (read-only)." }
            additionalProperties: true
        version_seq: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinancePartner:
      type: object
      description: "Geschäftspartner (relational finance_partners). All columns plaintext at rest since v1.516.0."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        name: { type: string }
        category: { type: [string, "null"] }
        kind: { type: [string, "null"] }
        url: { type: [string, "null"] }
        logo: { type: [string, "null"] }
        note: { type: [string, "null"] }
        address: { type: [string, "null"] }
        email: { type: [string, "null"] }
        invoice_email: { type: [string, "null"], description: "Dedicated invoice email (Rechnungs-E-Mail); invoices are sent here when set, else the general email." }
        phone: { type: [string, "null"] }
        vat_id: { type: [string, "null"] }
        contacts: { type: array, items: { type: object, additionalProperties: true } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    PaymentMethod:
      type: object
      description: "Payment method (relational payment_methods; all columns plaintext since v1.516.0)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        name: { type: string }
        holder: { type: [string, "null"] }
        note: { type: [string, "null"] }
        business: { type: boolean }
        url: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        bank: { type: [string, "null"] }
        account_no: { type: [string, "null"] }
        card_number: { type: [string, "null"] }
        card_network: { type: [string, "null"] }
        card_expiry: { type: [string, "null"] }
        paypal_email: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinanceProject:
      type: object
      description: "Cost project (relational finance_projects, nestable via parent_id)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        parent_id: { type: [integer, "null"] }
        name: { type: string }
        kind: { type: string, enum: [business, private] }
        note: { type: [string, "null"] }
        expenses: { type: [array, "null"], items: { type: object, additionalProperties: true }, description: "Manual hand-entered spend rows (nullable)." }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinanceCategory:
      type: object
      description: "Receipt category (relational finance_categories, unique per user; no soft deletes)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        name: { type: string }
        color: { type: [string, "null"], description: "Hex colour #RRGGBB, or null.", example: "#7066f5" }
        icon: { type: [string, "null"], description: "Monochrome icon name (heroicons-outline), or null.", example: "hashtag" }
        account_no: { type: [string, "null"], description: "Owner-entered Sachkonto/chart-of-accounts code (e.g. SKR03/04) for this category, or null. Free text — the server never assigns or validates a specific number.", example: "4930" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    VatReturn:
      type: object
      description: "VAT advance return (Umsatzsteuer-Voranmeldung) figures for a year."
      required: [year, net, vat, gross, count, byRate, quarters]
      properties:
        year: { type: integer }
        net: { type: number }
        vat: { type: number }
        gross: { type: number }
        count: { type: integer }
        byRate:
          type: array
          items:
            type: object
            properties: { rate: { type: number }, net: { type: number }, vat: { type: number } }
        quarters:
          type: array
          items:
            type: object
            properties: { q: { type: integer }, net: { type: number }, vat: { type: number } }

    FinanceKpis:
      type: object
      description: "Headline revenue KPIs for a year incl. year-over-year net growth."
      required: [year, net, count, avg, customers, prevNet]
      properties:
        year: { type: integer }
        net: { type: number }
        count: { type: integer }
        avg: { type: number }
        customers: { type: integer }
        prevNet: { type: number }
        growthPct: { type: [number, "null"] }

    RevenueByCustomer:
      type: object
      description: "Net/gross revenue for one customer in a year."
      properties:
        name: { type: string }
        net: { type: number }
        gross: { type: number }
        count: { type: integer }

    InvoiceAging:
      type: object
      description: >
        Aging of OPEN invoices (status='sent', not trashed) bucketed by days past
        the due date vs today: current (not yet due / no due date), 1-30, 31-60,
        60+. Read-only; each bucket carries count + gross sum + the invoice list.
      required: [buckets, openCount, openGross]
      properties:
        openCount: { type: integer }
        openGross: { type: number }
        buckets:
          type: object
          properties:
            current: { $ref: "#/components/schemas/AgingBucket" }
            "1_30": { $ref: "#/components/schemas/AgingBucket" }
            "31_60": { $ref: "#/components/schemas/AgingBucket" }
            "60_plus": { $ref: "#/components/schemas/AgingBucket" }

    AgingBucket:
      type: object
      required: [count, gross, invoices]
      properties:
        count: { type: integer }
        gross: { type: number }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              number: { type: [string, "null"] }
              customer: { type: string }
              gross: { type: number }
              due_date: { type: [string, "null"] }
              days_overdue: { type: integer }

    AccountVatSummary:
      type: object
      description: "VAT summary of one account's transactions: output/input VAT + payable, by rate."
      required: [income, expense, outputVat, inputVat, payable, privateSum, undecided]
      properties:
        income: { type: array, items: { type: object, properties: { rate: { type: string }, net: { type: number }, vat: { type: number } } } }
        expense: { type: array, items: { type: object, properties: { rate: { type: string }, net: { type: number }, vat: { type: number } } } }
        outputVat: { type: number }
        inputVat: { type: number }
        payable: { type: number }
        privateSum: { type: number }
        undecided: { type: integer }

    VatAdvanceReturn:
      type: object
      description: >
        Unified USt-Voranmeldung: output VAT (from realized invoices) minus input
        VAT / Vorsteuer (from ALL of the user's bank transactions) = payable
        (Zahllast), for a year and optional quarter. For a §19 Kleinunternehmer
        outputVat is 0 (turnover reported as net = gross) and payable = −inputVat.
      required: [year, quarter, net, outputVat, inputVat, payable, byRate, small_business]
      properties:
        year: { type: integer }
        quarter: { type: [integer, "null"], minimum: 1, maximum: 4, description: "1–4, or null for the full year." }
        net: { type: number, description: "Net turnover for the period (output side)." }
        outputVat: { type: number, description: "VAT collected on sales." }
        inputVat: { type: number, description: "Vorsteuer paid on expenses." }
        payable: { type: number, description: "outputVat − inputVat (Zahllast)." }
        byRate:
          type: array
          items:
            type: object
            properties:
              rate: { type: number }
              outputNet: { type: number }
              outputVat: { type: number }
              inputNet: { type: number }
              inputVat: { type: number }
        small_business: { type: boolean }

    EuerReport:
      type: object
      description: >
        Simplified EÜR (Einnahmenüberschussrechnung): income − expenses = profit
        for a year. Income = realized invoices by issue_date (net, or gross for a
        §19 KU) grouped by customer; expenses = that year's expense bank
        transactions (excluding private movements) + FinanceProject manual
        expenses, grouped by VAT/expense category. Not the full Anlage-EÜR form.
      required: [year, income, expenses, profit, small_business]
      properties:
        year: { type: integer }
        income:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items:
                type: object
                properties: { name: { type: string }, amount: { type: number } }
        expenses:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items:
                type: object
                properties: { name: { type: string }, amount: { type: number } }
        profit: { type: number }
        small_business: { type: boolean }

    DuplicateGroup:
      type: object
      description: "A suspected-duplicate group (read-only). `ids` are the row ids sharing `key` for `reason`."
      required: [reason, key, ids]
      properties:
        reason: { type: string }
        key: { type: string }
        ids: { type: array, items: { type: integer } }

    NumberGapGroup:
      type: object
      description: "A run of missing invoice numbers within one numbering regime (read-only, never mutates a row). `group` is `year:YYYY` for YYYY-NNNN numbers (reset per calendar year) or the literal `sequence` for every other format (bare integers, R-NNNNN, …), which is treated as one continuous ordinal sequence across all years."
      required: [group, missing, min, max, count]
      properties:
        group: { type: string, example: "year:2025" }
        missing: { type: array, items: { type: string }, description: "The missing numbers, formatted like the group's highest-numbered sample." }
        min: { type: string, description: "Lowest number observed in this group." }
        max: { type: string, description: "Highest number observed in this group." }
        count: { type: integer }

    FinanceReceipt:
      type: object
      description: "Standalone receipt (relational finance_receipts) — a receipt document WITHOUT a bank transaction (\"Fremdbeleg\"). Bytes plaintext on the files disk; blob_path/size/sig server-owned. Optional bank_transaction_id links it to a booking, or — for a split payment (one receipt settled by several separate charges) — linked_transaction_ids links it to all of them instead; the two are mutually exclusive."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        bank_transaction_id: { type: integer, nullable: true, description: "Optional link to a bank booking (the common single-charge case)." }
        linked_transaction_ids: { type: array, items: { type: integer }, nullable: true, description: "Split-payment link: this receipt's total was debited as several separate bank transactions, e.g. one INWX invoice settled by two charges a week apart. Mutually exclusive with bank_transaction_id — setting one server-side clears the other." }
        finance_project_id: { type: integer, nullable: true }
        blob_path: { type: string, description: "Server-owned storage path (files disk)." }
        name: { type: string }
        mime: { type: string, nullable: true }
        size: { type: integer }
        sig: { type: string, nullable: true, description: "Content dedup signature." }
        kind: { type: string }
        category: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        vat: { type: string, nullable: true }
        amount: { type: number, format: double, nullable: true, description: "Gross total (editable, prefilled by OCR recognition)." }
        currency: { type: string, nullable: true, description: "ISO 4217 code (EUR/USD/GBP/CHF), uppercased server-side; editable, prefilled by OCR recognition. Display/reference only — amount is never converted." }
        date: { type: string, format: date, nullable: true, description: "Document date (editable, prefilled by OCR recognition)." }
        order_ref: { type: string, nullable: true, description: "Merchant-printed payment/order reference (e.g. Amazon's \"Zahlungsreferenznummer\") — the strongest signal for grouping several receipts that settle as one charge." }
        doc_number: { type: string, nullable: true, description: "Recognised invoice/receipt number — display + de-dup signal for accidental re-uploads." }
        note: { type: string, nullable: true }
        partner_id: { type: integer, nullable: true }
        ocr: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }

    ReceiptMatchGroup:
      type: object
      description: "A suggested link between one or more unlinked standalone receipts and one unlinked bank transaction (read-only, never mutates a row) — covers the case a single charge is settled by several receipts (e.g. Amazon splitting an order into multiple shipment invoices). The client applies an accepted group by PUTing bank_transaction_id on each listed receipt."
      required: [transaction_id, receipt_ids, reason, total]
      properties:
        transaction_id: { type: integer }
        receipt_ids: { type: array, items: { type: integer }, description: "One or more receipts summing to `total`." }
        reason: { type: string, enum: [order_ref, exact, sum], description: "order_ref = receipts share a merchant-printed payment reference; exact = one receipt matches the amount to the cent; sum = a bounded subset-sum of nearby receipts matches the amount." }
        total: { type: number, format: double }
    ReceiptDuplicate:
      type: object
      description: "An accidental re-upload of the same receipt document (same order_ref/doc_number + amount as an earlier upload), excluded from ReceiptMatchGroup sums so it is never double-counted."
      required: [receipt_id, duplicate_of]
      properties:
        receipt_id: { type: integer }
        duplicate_of: { type: integer, description: "The earlier-uploaded receipt this one duplicates." }
    SplitPaymentGroup:
      type: object
      description: "The inverse of ReceiptMatchGroup: one unlinked standalone receipt whose amount matches no SINGLE unlinked transaction, but a bounded subset-sum of several does (e.g. one INWX invoice billed as one document but debited as two separate charges a week apart). Read-only, never mutates a row. The client applies an accepted group by PUTing linked_transaction_ids on the receipt."
      required: [receipt_id, transaction_ids, reason, total]
      properties:
        receipt_id: { type: integer }
        transaction_ids: { type: array, items: { type: integer }, description: "Two or more transactions summing to `total`." }
        reason: { type: string, enum: [sum], description: "Always sum — a single matching transaction is already handled elsewhere (the client's own auto-pick on upload), so this only ever fires for a combination." }
        total: { type: number, format: double }

    FileFolder:
      type: object
      description: "A folder in the plaintext file tree (file_folders). Owner-scoped; parent_id forms the nested tree."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        parent_id: { type: integer, nullable: true }
        name: { type: string }
        version: { type: integer }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    FileActivity:
      type: object
      description: "One Files activity-feed entry (owner-scoped). `actor` is the display name of whoever performed it, or the upload-link label for anonymous external uploads."
      properties:
        id: { type: integer }
        action: { type: string, enum: [upload, external_upload, rename, move, version, trash, restore, delete, share] }
        file_id: { type: integer, nullable: true }
        file_name: { type: string, nullable: true }
        file_folder_id: { type: integer, nullable: true }
        actor: { type: string, nullable: true }
        meta: { type: object, nullable: true, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Server:
      type: object
      description: "A monitored server. Credentials are never serialised — neither the password nor the private key appears in any response."
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        auth_type: { type: string, enum: [key] }
        group: { type: [string, "null"] }
        note: { type: [string, "null"] }
        enabled: { type: boolean }
        restricted_key: { type: boolean, description: "The key on the target is limited to a forced command." }
        account_created: { type: [boolean, "null"], description: "Whether the guided setup created the account on the target. Drives which removal instructions are shown. Null for rows created before the field existed — the answer is genuinely unknown, not false." }
        monitor_ports:
          type: array
          description: "Extra TCP ports checked every few minutes. The SSH port is always checked and is deliberately not listed here."
          items:
            type: object
            properties:
              port: { type: integer, minimum: 1, maximum: 65535 }
              label: { type: [string, "null"] }
        disk_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99, description: "Filesystem share that triggers a notification. Null uses the built-in 90. Adjustable because 90 is right for a system disk and nonsense for an archive that lives at 95 — and a threshold nobody can move is one people learn to ignore." }
        mem_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99, description: "Memory share that triggers a notification. Null uses the built-in 95." }
        temp_alert_c: { type: [integer, "null"], minimum: 40, maximum: 120, description: "Hottest-sensor temperature that triggers a notification. Null uses the built-in 85." }
        host_fingerprint: { type: [string, "null"], description: "Pinned host key fingerprint, OpenSSH form: SHA256 plus 43 base64 characters." }
        status:
          type: [object, "null"]
          description: "The newest collection run, successful or not. Null until the first probe."
          properties:
            ok: { type: boolean }
            error: { type: [string, "null"], description: "Machine-readable reason (unsafe_host, ssh_missing, no_host_key, fingerprint_mismatch, no_credentials, auth_failed, connection_refused, timeout, unreachable, no_common_algorithms, unexpected_output) or a short quote of ssh's own stderr." }
            collected_at: { type: string, format: date-time }
            duration_ms: { type: integer }
        facts: { $ref: "#/components/schemas/ServerFacts" }
    ServerFacts:
      type: [object, "null"]
      description: "The parsed snapshot from the last successful probe. Every section is optional: a host without systemd or docker simply omits it."
      properties:
        role:
          type: object
          description: >
            What the machine is for, derived from installed services and running
            container images. Both sources on purpose: on a modern host the
            services are containers, and reading only systemd units would call a
            machine running Postfix, Dovecot and Rspamd in containers "just a
            Docker host" - true, and useless. A container is judged by its
            image, never its name: one called "mail" running nginx is a web
            server. `services` lists only what is installed, and carries
            `installed` separately from `active`, because "installed but
            stopped" and "not installed" are different answers that
            `systemctl is-active` reports identically.
          properties:
            roles:
              type: array
              items: { type: string, enum: [mail, web, database, virtualisation, containers, storage, dns, media, identity, monitoring] }
            platform:
              type: [string, "null"]
              description: "A distribution that is a role in itself: proxmox, truenas, opnsense, openmediavault."
            services:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  installed: { type: boolean }
                  active: { type: boolean }
                  source: { type: string }
        storage:
          type: array
          description: >
            The physical disks, as opposed to the filesystems on them. `health`
            is three-valued: `unknown` means the host could not tell us -
            smartmontools absent, or a RAID controller hiding the members behind
            one volume - and that is not the same as healthy. Reallocated and
            pending sectors are the two figures that actually predict a failure.
          items:
            type: object
            properties:
              name: { type: string }
              size_b: { type: integer }
              rotational: { type: boolean }
              model: { type: string }
              health:
                type: string
                enum: [ok, failing, unreadable, unsupported, virtual, unknown]
                description: >
                  "unknown" means smartmontools is absent; "unreadable" means a
                  controller would not pass SMART through; "virtual" means there
                  is no drive to ask, because the guest is looking at a disk the
                  hypervisor made up. Only the middle one is worth chasing.
              temp_c: { type: [number, "null"] }
              hours: { type: [integer, "null"] }
              reallocated: { type: [integer, "null"] }
              pending: { type: [integer, "null"] }
        arrays:
          type: array
          description: "Software RAID and ZFS pools. A degraded array keeps working right up until the second disk goes, which is why it carries its own flag."
          items:
            type: object
            properties:
              kind: { type: string }
              name: { type: string }
              state: { type: string }
              detail: { type: string }
              degraded: { type: boolean }
        sensors:
          type: array
          description: "Temperatures read from /sys/class/hwmon rather than through lm-sensors, which is missing more often than it is present."
          items:
            type: object
            properties:
              chip: { type: string }
              label: { type: string }
              temp_c: { type: number }
        timers:
          type: object
          description: "Scheduled work. Failed services are reported elsewhere; a failed timer is invisible, and that is where backups and certificate renewal live."
          properties:
            units:
              type: array
              items:
                type: object
                properties:
                  unit: { type: string }
                  next: { type: string, description: "Empty when the timer is not scheduled to run again, which is a real state." }
                  last: { type: string }
                  activates: { type: string }
            failed:
              type: array
              items: { type: string }
        backup_tools:
          type: array
          description: "Backup tools present on the host. Only that: the probe can see a binary, and claiming when it last ran would be a guess about somebody's data."
          items: { type: string }
        logins:
          type: array
          items:
            type: object
            properties:
              user: { type: string }
              from: { type: string, description: "Empty for a console login, which has no origin address." }
              when: { type: string }
        failed_logins:
          type: [integer, "null"]
          description: "Null where lastb is unavailable. \"Could not look\" and \"nobody tried\" are opposite answers."
        hostname: { type: [string, "null"] }
        os:
          type: object
          properties:
            name: { type: [string, "null"] }
            id: { type: [string, "null"] }
            version: { type: [string, "null"] }
        kernel: { type: [string, "null"] }
        arch: { type: [string, "null"] }
        uptime_s: { type: [integer, "null"] }
        load: { type: array, items: { type: number }, description: "1/5/15-minute averages." }
        cpu:
          type: object
          properties:
            cores: { type: [integer, "null"] }
            model: { type: [string, "null"] }
            used_pct: { type: [number, "null"], description: "Busy time as a percentage, from two /proc/stat samples one second apart. Null when only one sample arrived — a single read gives the average since boot, which never moves. Not the same thing as load, which is queue length." }
        mem:
          type: object
          properties:
            total_kb: { type: [integer, "null"] }
            available_kb: { type: [integer, "null"] }
            used_pct: { type: [number, "null"] }
            swap_total_kb: { type: [integer, "null"] }
            swap_used_kb: { type: [integer, "null"] }
        disks:
          type: array
          items:
            type: object
            properties:
              fs: { type: string }
              mount: { type: string }
              size_kb: { type: integer }
              used_kb: { type: integer }
              avail_kb: { type: integer }
              used_pct: { type: number }
        disk_max_pct: { type: [number, "null"], description: "The fullest filesystem — what the list view's status dot uses." }
        reboot_required: { type: boolean }
        failed_units: { type: array, items: { type: string } }
        ports: { type: array, items: { type: string } }
        containers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string }
        updates: { type: [integer, "null"], description: "Pending package updates. Null where no supported package manager answered — NOT zero, which would read as fully patched." }
        addresses:
          type: array
          description: "Global IPv4 addresses, one entry per interface, formatted as interface then CIDR, e.g. eth0 192.168.3.200/24."
          items: { type: string }
        virt: { type: [string, "null"], description: "Hypervisor or container runtime as systemd-detect-virt names it. Null on bare metal, where it reports none." }
        boot_at: { type: [string, "null"], format: date-time, description: "Boot time from /proc/stat btime. Absolute, so it stays correct between two collection runs, unlike an uptime span." }
        sessions:
          type: array
          description: "Lines from who(1): who is logged in, from where, since when."
          items: { type: string }
        processes:
          type: array
          description: "The largest processes by resident memory. Deliberately not CPU: a quarter-hourly snapshot cannot say anything honest about instantaneous CPU load."
          items:
            type: object
            properties:
              name: { type: string }
              rss_kb: { type: integer }
        temp_c: { type: [number, "null"], description: "First thermal zone in degrees Celsius. Absent on most virtual machines." }
    ServerInput:
      type: object
      description: "Connection parameters. A blank secret on update keeps the stored one. host_fingerprint is required on create and must be the value a prior /servers/test reported."
      required: [name, host, username, host_fingerprint]
      properties:
        name: { type: string, maxLength: 255 }
        host: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        username: { type: string, maxLength: 64, description: "Preferably an unprivileged account — the probe needs no privilege. `root` is accepted (some hosts have no other account) but the UI warns that such a key hands over the whole machine if stolen." }
        auth_type: { type: string, enum: [key], description: "Key only; password authentication is not offered." }
        private_key: { type: string, maxLength: 16384 }
        passphrase: { type: string, maxLength: 1024 }
        host_fingerprint: { type: string, pattern: "^SHA256:[A-Za-z0-9+/]{43}$" }
        keypair_token: { type: string, maxLength: 64, description: "Redeems a key generated by /servers/keypair instead of sending a private key. A pasted private_key wins over it; both blank keeps the stored secret on update." }
        group: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
        restricted_key: { type: boolean }
        account_created: { type: boolean, description: "Set by the create dialog: true when the setup commands created the account, false when an existing account was reused." }
        monitor_ports:
          type: array
          maxItems: 20
          description: "Extra TCP ports to watch. Capped because the list is checked every few minutes; duplicates are dropped server-side."
          items:
            type: object
            required: [port]
            properties:
              port: { type: integer, minimum: 1, maximum: 65535 }
              label: { type: [string, "null"], maxLength: 40 }
        disk_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99, description: "Send null or omit to fall back to the default." }
        mem_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99 }
        temp_alert_c: { type: [integer, "null"], minimum: 40, maximum: 120 }
    ServerCheckSeries:
      type: object
      description: "Reachability history for one thing being checked: the ping, or one TCP port."
      properties:
        kind: { type: string, enum: [icmp, tcp] }
        port: { type: [integer, "null"], description: "Null for ICMP." }
        label: { type: [string, "null"], description: "'SSH' for the port that is always checked, the owner's label otherwise." }
        uptime_pct: { type: number, description: "Successful checks over the requested window, not since forever. Always present: a series exists only because at least one check produced it." }
        samples: { type: integer }
        last:
          type: [object, "null"]
          properties:
            ok: { type: boolean }
            ms: { type: [integer, "null"] }
            error: { type: [string, "null"], description: "refused, timeout, unreachable, no_reply, unsafe_host or failed." }
            t: { type: string, format: date-time }
        points:
          type: array
          items:
            type: object
            properties:
              t: { type: string, format: date-time }
              ms: { type: [integer, "null"] }
              ok: { type: boolean }
    ServerProbeResult:
      type: object
      description: "Outcome of an inline connection test. The fingerprint is reported even on failure, so a mismatch can be inspected."
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"] }
        fingerprint: { type: [string, "null"] }
        facts: { $ref: "#/components/schemas/ServerFacts" }
        duration_ms: { type: integer }
    StorageMount:
      type: object
      description: "An external storage mount (S3/SFTP). Credentials are never serialized."
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [s3, sftp] }
        read_only: { type: boolean }
    StorageMountInput:
      type: object
      description: "Mount config. secret/password blank on update keeps the stored value."
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [s3, sftp] }
        read_only: { type: boolean }
        region: { type: string }
        bucket: { type: string }
        key: { type: string }
        secret: { type: string }
        endpoint: { type: string }
        use_path_style: { type: boolean }
        path_prefix: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        private_key: { type: string }
        host_fingerprint: { type: string }
        root: { type: string }
    MountEntry:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        size: { type: [integer, "null"] }
        last_modified: { type: [integer, "null"] }
    FileEntry:
      type: object
      description: "A file (files table). Bytes live plaintext on the files disk at storage_path; this row holds metadata. search_text is never serialized."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        file_folder_id: { type: integer, nullable: true }
        name: { type: string }
        mime: { type: string, nullable: true }
        size: { type: integer }
        storage_path: { type: string }
        sha256: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        note: { type: string, nullable: true }
        favorite: { type: boolean }
        labels: { type: array, items: { $ref: "#/components/schemas/FileLabel" }, description: "Eager-loaded on /files/data, /files/trash, /files/search, and the setFileLabels response." }
        version: { type: integer }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    GalleryPhoto:
      type: object
      description: "A gallery photo (gallery_photos). Bytes live plaintext on the files disk under gallery/{uuid}; this row holds metadata. Serialized without bytes/storage_path."
      properties:
        id: { type: integer }
        name: { type: string }
        mime: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        size: { type: integer }
        favorite: { type: boolean }
        thumb: { type: boolean, description: "Whether the WebP thumbnail is ready (generated off the web path by a worker). While false the client shows a spinner and reloads." }
        preview: { type: boolean, description: "Whether the browser-viewable full-size WebP preview is ready (the original may be HEIC, which browsers cannot render); the lightbox uses /gallery/{photo}/preview." }
        motion: { type: boolean, description: "Whether a Live Photo motion clip is attached (served at /gallery/{photo}/motion)." }
        media_type: { type: string, enum: [image, video], description: "Videos are processed on the worker (ffprobe + poster + web MP4)." }
        status: { type: string, enum: [ready, processing, failed], description: "Video processing state; the client shows a gray 'processing' tile until ready." }
        duration: { type: integer, nullable: true, description: "Video duration in seconds." }
        rotation: { type: integer, enum: [0, 90, 180, 270], description: "Clockwise display rotation; non-invasive (original bytes untouched)." }
        flip_h: { type: boolean, description: "Horizontal mirror; non-invasive." }
        archived: { type: boolean, description: "Hidden from the main timeline (still shown in albums + Archive view)." }
        taken_at: { type: string, format: date-time, nullable: true, description: "EXIF capture date (falls back to created_at for ordering); editable." }
        camera: { type: string, nullable: true }
        place: { type: string, nullable: true, description: "Human location label (from OSM autocomplete)." }
        lat: { type: number, format: float, nullable: true }
        lng: { type: number, format: float, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }
    GalleryAlbum:
      type: object
      description: "A gallery album (gallery_albums). Groups photos via the pivot; count is the photo count, cover_photo_id an optional cover."
      properties:
        id: { type: integer }
        name: { type: string }
        count: { type: integer }
        cover_photo_id: { type: integer, nullable: true }
        version: { type: integer }
    GalleryPerson:
      type: object
      description: "A face-recognition person: an auto-grouped cluster of detected faces (biometric, opt-in). name is null until the owner names it; contact_id optionally links the person to an address-book contact (naming from the address book); cover_face_id points at the crop shown as the person's avatar; count is the visible-face count."
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        contact_id: { type: string, nullable: true, description: "Linked address-book contact UUID, or null." }
        count: { type: integer }
        cover_face_id: { type: integer, nullable: true }
    GalleryFace:
      type: object
      description: "A detected face in a photo (gallery_faces). box is [x1,y1,x2,y2] normalised 0..1; the crop is served at /gallery/faces/{id}/crop. The 512-dim embedding is server-only (never serialized)."
      properties:
        id: { type: integer }
        person_id: { type: integer, nullable: true }
        person_name: { type: string, nullable: true }
        box: { type: array, items: { type: number, format: float }, minItems: 4, maxItems: 4 }
        score: { type: number, format: float }
        crop: { type: boolean, description: "Whether a crop thumbnail exists." }
    FolderShareOwnerView:
      type: object
      description: "Owner-visible cross-user share (folder_shares): the shared target (a folder subtree OR a single file — exactly one is set) plus its member roster. Returned by the owner-side index/store/updateMember."
      properties:
        id: { type: integer }
        kind: { type: string, enum: [file, folder], description: "Whether this share targets a single file or a folder subtree." }
        file_folder_id: { type: integer, nullable: true, description: "The shared folder id (null for a file share)." }
        folder_name: { type: string, nullable: true, description: "Name of the shared folder (null for a file share or if it was trashed)." }
        file_id: { type: integer, nullable: true, description: "The shared file id (null for a folder share)." }
        file_name: { type: string, nullable: true, description: "Name of the shared file (null for a folder share or if it was trashed)." }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, description: "folder_share_members row id." }
              user_id: { type: integer }
              name: { type: string, nullable: true }
              email: { type: string, nullable: true }
              role: { type: string, enum: [viewer, editor] }
    SharedWithMeItem:
      type: object
      description: "A folder OR file shared WITH the authenticated user (member side): the shared target, the caller's role, and the owner. `kind` selects whether folder_name or file_name is populated."
      properties:
        id: { type: integer, description: "folder_shares row id." }
        kind: { type: string, enum: [file, folder] }
        folder_name: { type: string, description: "Present for a folder share." }
        file_name: { type: string, description: "Present for a file share." }
        role: { type: string, enum: [viewer, editor] }
        owner:
          type: object
          properties:
            id: { type: integer, nullable: true }
            name: { type: string, nullable: true }
            email: { type: string, nullable: true }
    FileShare:
      type: object
      description: "A public share link (file_shares) to a file or folder subtree; optional password gate + expiry. Never serializes the password hash."
      properties:
        id: { type: integer }
        token: { type: string }
        kind: { type: string, enum: [file, folder] }
        file_id: { type: integer, nullable: true }
        file_folder_id: { type: integer, nullable: true }
        needs_password: { type: boolean }
        allow_download: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
    FileUploadLink:
      type: object
      description: "A public inbound upload link (file_upload_links): external people upload INTO the owner's folder (write-only). The token is the capability."
      properties:
        id: { type: integer }
        token: { type: string }
        label: { type: [string, "null"] }
        file_folder_id: { type: [integer, "null"] }
        folder_name: { type: [string, "null"] }
        needs_password: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
    FileLabel:
      type: object
      description: "A coloured, user-defined label (file_labels). Many-to-many with files."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        color: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    FileVersion:
      type: object
      description: "A previous revision of a file (file_versions). Bytes at storage_path; kept up to the per-user cap."
      properties:
        id: { type: integer }
        file_id: { type: integer }
        storage_path: { type: string }
        size: { type: integer }
        mime: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    StorageUsage:
      type: object
      description: "Combined Files (incl. version history) + Gallery storage usage vs. the one shared workspace-wide quota — both modules draw from a single cap."
      properties:
        used: { type: integer, description: "Bytes occupied (Files + Gallery, incl. trashed) — what the quota applies to." }
        files: { type: integer, description: "The Files share of it (incl. version history)." }
        gallery: { type: integer, description: "The Gallery share of it (photos and videos)." }
        quota: { type: integer, nullable: true, description: "Byte cap, or null when unlimited." }
    BankTransaction:
      type: object
      description: "Bank-statement line (relational bank_transactions). All columns plaintext at rest since v1.516.0. Amount/date/vat_cat drive stats + VAT."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        payment_method_id: { type: integer }
        date: { type: string }
        amount: { type: string }
        vat_cat: { type: [string, "null"] }
        sig: { type: [string, "null"] }
        invoice_id: { type: [integer, "null"] }
        invoice_number: { type: [string, "null"] }
        finance_project_id: { type: [integer, "null"] }
        counterparty: { type: [string, "null"] }
        counterparty_iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        purpose: { type: [string, "null"] }
        booking_text: { type: [string, "null"] }
        eref: { type: [string, "null"] }
        receipts: { type: [array, "null"], items: { $ref: "#/components/schemas/TransactionReceipt" } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    InvoiceInput:
      type: object
      description: >
        Invoice create/update body. On create `name` defaults apply
        (status=draft, type=invoice, currency=EUR); `number` is optional (self-issued
        invoices are numbered server-side via /finalize). On update every field is
        optional (send only what changes) and `version` drives optimistic concurrency.
        Server-managed fields (seq/year/cancels_invoice_id/pdf_path/version) are never
        accepted here.
      properties:
        number: { type: [string, "null"], maxLength: 64 }
        status: { type: string, enum: [draft, final, sent, paid] }
        type: { type: string, enum: [invoice, credit_note] }
        issue_date: { type: [string, "null"], format: date }
        due_date: { type: [string, "null"], format: date }
        currency: { type: string, maxLength: 8 }
        vat_rate: { type: [number, "null"] }
        gross: { type: [number, "null"] }
        net: { type: [number, "null"] }
        vat: { type: [number, "null"] }
        discount_type: { type: [string, "null"], enum: [percent, amount, null] }
        discount_value: { type: [number, "null"], minimum: 0 }
        skonto_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        skonto_days: { type: [integer, "null"], minimum: 0, maximum: 3650 }
        imported: { type: boolean }
        paid_at: { type: [string, "null"], format: date }
        payment_account: { type: [string, "null"], maxLength: 200 }
        partner_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted partner." }
        customer: { type: [object, "null"], additionalProperties: true }
        lines: { type: [array, "null"], maxItems: 1000, items: { type: object, additionalProperties: true } }
        note: { type: [string, "null"], maxLength: 100000 }
        versions: { type: [array, "null"], maxItems: 1000, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: expected row version for optimistic concurrency (409 on mismatch)." }

    PartnerInput:
      type: object
      description: "Business-partner create/update body. `name` is required on create. `version` (update only) drives optimistic concurrency."
      properties:
        name: { type: string, maxLength: 300 }
        category: { type: [string, "null"], maxLength: 120 }
        kind: { type: [string, "null"], maxLength: 16 }
        url: { type: [string, "null"], maxLength: 2000 }
        logo: { type: [string, "null"], maxLength: 2000 }
        note: { type: [string, "null"], maxLength: 100000 }
        address: { type: [string, "null"], maxLength: 2000 }
        email: { type: [string, "null"], maxLength: 320 }
        invoice_email: { type: [string, "null"], format: email, maxLength: 320 }
        phone: { type: [string, "null"], maxLength: 100 }
        vat_id: { type: [string, "null"], maxLength: 64 }
        contacts: { type: [array, "null"], maxItems: 200, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    PaymentMethodInput:
      type: object
      description: "Payment-method create/update body. `type` + `name` are required on create. `version` (update only) drives optimistic concurrency."
      properties:
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        name: { type: string, maxLength: 200 }
        holder: { type: [string, "null"], maxLength: 200 }
        note: { type: [string, "null"], maxLength: 20000 }
        business: { type: boolean }
        url: { type: [string, "null"], maxLength: 2000 }
        icon: { type: [string, "null"], maxLength: 200000, description: "Data-URI or URL of a small bank/brand icon." }
        iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        bank: { type: [string, "null"], maxLength: 200 }
        account_no: { type: [string, "null"], maxLength: 64 }
        card_number: { type: [string, "null"], maxLength: 40 }
        card_network: { type: [string, "null"], maxLength: 40 }
        card_expiry: { type: [string, "null"], maxLength: 16 }
        paypal_email: { type: [string, "null"], maxLength: 320 }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    ProjectInput:
      type: object
      description: "Cost-project create/update body. `name` is required on create. `version` (update only) drives optimistic concurrency."
      properties:
        name: { type: string, maxLength: 300 }
        parent_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted project." }
        kind: { type: string, enum: [business, private] }
        note: { type: [string, "null"], maxLength: 100000 }
        expenses: { type: [array, "null"], maxItems: 5000, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    CategoryInput:
      type: object
      required: [name]
      description: "Receipt-category create/update body (name/colour/icon/account_no — a full replace, not just a rename)."
      properties:
        name: { type: string, maxLength: 160, description: "Unique per user (the current category id is ignored on update)." }
        color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$", example: "#7066f5" }
        icon: { type: [string, "null"], maxLength: 40, description: "Monochrome heroicons-outline name from the fixed allowlist (FinanceController::CATEGORY_ICONS), e.g. hashtag/tag/banknotes." }
        account_no: { type: [string, "null"], maxLength: 40, description: "Owner-entered Sachkonto/chart-of-accounts code, free text.", example: "4930" }

    TransactionInput:
      type: object
      description: "Bank-transaction create/update body. `payment_method_id` + `date` + `amount` are required on create. `version` (update only) drives optimistic concurrency."
      properties:
        payment_method_id: { type: integer, description: "Must be an existing, owned, non-deleted payment method." }
        date: { type: string, format: date }
        amount: { type: number }
        vat_cat: { type: [string, "null"], maxLength: 16 }
        sig: { type: [string, "null"], maxLength: 80, description: "Dedup signature." }
        invoice_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted invoice." }
        invoice_number: { type: [string, "null"], maxLength: 64 }
        finance_project_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted project." }
        counterparty: { type: [string, "null"], maxLength: 2000 }
        counterparty_iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        purpose: { type: [string, "null"], maxLength: 4000 }
        booking_text: { type: [string, "null"], maxLength: 2000 }
        eref: { type: [string, "null"], maxLength: 200 }
        receipts:
          type: [array, "null"]
          maxItems: 200
          description: "Metadata + fileless (invoice-link/Eigenbeleg) entries only; a client-supplied blob_path is always dropped — real file receipts are created via the receipts endpoint."
          items: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    TransactionBulkRow:
      type: object
      required: [date, amount]
      description: "One parsed bank-statement line for POST /finance/transactions/bulk. Deduplicated by `sig`."
      properties:
        date: { type: string, format: date }
        amount: { type: number }
        sig: { type: [string, "null"], maxLength: 80 }
        vat_cat: { type: [string, "null"], maxLength: 16 }
        counterparty: { type: [string, "null"], maxLength: 2000 }
        counterparty_iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        purpose: { type: [string, "null"], maxLength: 4000 }
        booking_text: { type: [string, "null"], maxLength: 2000 }
        eref: { type: [string, "null"], maxLength: 200 }

    UserSettings:
      type: object
      description: "Per-user non-display settings (file version cap)."
      properties:
        file_max_versions: { type: integer, minimum: 1, maximum: 200 }

    AdminUser:
      type: object
      description: "Admin view of a user. Never includes password hashes or 2FA secrets."
      required: [id, name, email, role, verified, two_factor]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        max_connected_devices: { type: [integer, "null"] }
        modules: { type: [array, "null"], items: { type: string } }
        groups: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        verified: { type: boolean }
        two_factor: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }

    AdminUserWrite:
      type: object
      description: "User create/update body. role/quotas/modules are privilege fields (never mass-assigned server-side)."
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, user] }
        password: { type: string, minLength: 12, description: "Create only (prohibited on update); omit to trigger a reset mail." }
        max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
        modules: { type: [array, "null"], items: { type: string, enum: [finance, files, contacts, calendar, mail] } }
        modules_marker: { type: string, enum: ['set'], description: "Send with an (empty) modules[] to set an explicit list rather than 'no change'." }
        groups: { type: [array, "null"], items: { type: integer } }

    PaperlessTerm:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: "Paperless numeric id." }
        name: { type: string }
        color: { type: [string, "null"] }

    SecurityLogEntry:
      type: object
      description: "One append-only audit entry. Metadata only — never tokens/keys/ciphertext."
      properties:
        at: { type: [string, "null"], format: date-time }
        user_id: { type: [integer, "null"] }
        actor: { type: [string, "null"], description: "Display name at query time." }
        action: { type: string, example: device.evicted, description: "Dot-namespaced event id." }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        meta: { type: [object, "null"], additionalProperties: true }

    RequestLogEntry:
      type: object
      description: "One HTTP request-trail row (admin, metadata only)."
      required: [id, method, path, status]
      properties:
        id: { type: integer }
        time: { type: [string, "null"], format: date-time }
        ip: { type: [string, "null"] }
        method: { type: string, example: GET }
        path: { type: string, example: /api/v1/files }
        status: { type: integer, example: 200 }
        user:
          type: [object, "null"]
          properties: { id: { type: integer }, name: { type: string } }
        user_agent: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"] }

    BlockedIp:
      type: object
      description: "One entry in the IP/CIDR block-list."
      required: [id, cidr]
      properties:
        id: { type: integer }
        cidr: { type: string, example: 203.0.113.0/24 }
        reason: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }

    SessionsOverview:
      type: object
      description: "Cross-user active web sessions + device tokens (admin)."
      properties:
        web:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [web] }
              user_id: { type: integer }
              ip: { type: [string, "null"] }
              user_agent: { type: [string, "null"] }
              last_activity: { type: [string, "null"], format: date-time }
        devices:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [device] }
              user_id: { type: integer }
              name: { type: [string, "null"] }
              ip: { type: [string, "null"] }
              last_used_at: { type: [string, "null"], description: "Raw DB timestamp string (Y-m-d H:i:s), not strict ISO-8601." }

    BackupDestinationSummary:
      type: object
      description: "Safe public shape — credentials (`config`) intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }

    BackupDestinationWrite:
      type: object
      required: [name, driver]
      description: >
        Create/update body for a backup destination. Only the keys relevant to the
        chosen `driver` are stored: s3/b2 → bucket/region/key/secret/endpoint/
        use_path_style/path; sftp → host/port/username/password/host_fingerprint/path;
        webdav → base_uri/username/password/path. On update, a blank `secret` or
        `password` keeps the stored value. Credentials are stored encrypted (config
        cast) and are NEVER returned in any response.
      properties:
        name: { type: string, maxLength: 120 }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }
        bucket: { type: string, maxLength: 255, description: "s3/b2." }
        region: { type: string, maxLength: 64, description: "s3/b2." }
        key: { type: string, maxLength: 255, description: "s3/b2 access key id." }
        secret: { type: string, maxLength: 255, description: "s3/b2 secret (blank on update keeps stored)." }
        endpoint: { type: string, maxLength: 255, format: uri, description: "s3/b2 custom endpoint. SSRF-guarded (SafeUrl)." }
        use_path_style: { type: boolean, description: "s3/b2 path-style addressing." }
        host: { type: string, maxLength: 255, description: "sftp host. SSRF-guarded (SafeHost); link-local/metadata rejected (422)." }
        port: { type: integer, minimum: 1, maximum: 65535, description: "sftp port." }
        username: { type: string, maxLength: 255, description: "sftp/webdav." }
        password: { type: string, maxLength: 255, description: "sftp/webdav (blank on update keeps stored)." }
        host_fingerprint: { type: string, maxLength: 255, description: "sftp host key fingerprint." }
        base_uri: { type: string, maxLength: 255, format: uri, description: "webdav base URL. SSRF-guarded (SafeUrl); link-local/metadata rejected (422)." }
        path: { type: string, maxLength: 255, description: "Optional sub-path prefix at the destination." }

    BackupJobSummary:
      type: object
      description: "Safe public shape — `passphrase` intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        source: { type: string, enum: [database, invoices, files, gallery, mail, notes, avatars], description: "Legacy single-source column (= sources[0])." }
        sources: { type: array, items: { type: string, enum: [database, invoices, files, gallery, mail, notes, avatars] }, description: "All sources this job backs up." }
        mode: { type: string, enum: [full, incremental] }
        destination_id: { type: integer }
        cron: { type: string }
        retention: { type: integer }
        keep_daily: { type: integer }
        keep_weekly: { type: integer }
        keep_monthly: { type: integer }
        encrypt: { type: boolean }
        notify_channels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"] }
        statistics: { type: object, additionalProperties: true }

    BackupJobWrite:
      type: object
      required: [name, sources, backup_destination_id, cron, keep_daily]
      description: "A job backs up one or more sources at once into a timestamped batch, in full or incremental mode, rotated with grandfather-father-son retention. Encryption is recommended (a DB dump is cleartext PII) but optional; 422 only if encrypt=true without an available passphrase. Blank passphrase keeps the stored value on update."
      properties:
        name: { type: string, maxLength: 120 }
        sources: { type: array, minItems: 1, items: { type: string, enum: [database, invoices, files, gallery, mail, notes, avatars] }, description: "What to back up. database = full DB dump; invoices = invoice PDFs + receipts; files = the Files module blobs." }
        source: { type: [string, "null"], enum: [database, invoices, files, gallery, mail, notes, avatars], description: "Legacy single-source column, kept in sync with sources[0]. Optional." }
        mode: { type: string, enum: [full, incremental], description: "incremental only re-uploads blob sources (files/invoices) changed since the last run; the DB dump is always full." }
        backup_destination_id: { type: integer, description: "Must reference an existing backup destination." }
        cron: { type: string, maxLength: 64, description: "A valid cron expression." }
        retention: { type: [integer, "null"], minimum: 1, maximum: 9999, description: "Legacy flat retention; superseded by keep_daily. Kept in sync." }
        keep_daily: { type: integer, minimum: 0, maximum: 9999, description: "GFS son tier: keep the newest N batches." }
        keep_weekly: { type: [integer, "null"], minimum: 0, maximum: 9999, description: "GFS father tier: keep one batch per week for N weeks." }
        keep_monthly: { type: [integer, "null"], minimum: 0, maximum: 9999, description: "GFS grandfather tier: keep one batch per month for N months." }
        encrypt: { type: boolean }
        passphrase: { type: [string, "null"], minLength: 12, maxLength: 255, description: "Encryption passphrase. Required when encrypt=true and no env passphrase is set. Blank on update keeps stored. Never returned." }
        notify_channels: { type: array, items: { type: string, enum: [desktop, mail, ntfy, webhook] } }
        enabled: { type: boolean }

    BackupRunSummary:
      type: object
      description: "A recent backup run (the exact shape returned by GET /backup/runs)."
      properties:
        id: { type: integer }
        job: { type: [string, "null"], description: "Job name, or null if the job was deleted." }
        status: { type: string, description: "e.g. running | success | failed | cancelled." }
        message: { type: [string, "null"] }
        log: { type: [string, "null"] }
        startedIso: { type: [string, "null"], format: date-time }
        startedHuman: { type: [string, "null"], description: "Relative start time (e.g. '3 hours ago')." }
        size: { type: [string, "null"], description: "Human-readable total batch size (e.g. '4.2 MB'), or null." }
        archives:
          type: array
          description: "One entry per source backed up in this run. The database is a point-in-time dump (downloadable/verifiable/decryptable/restorable via `?source=database`); blob sources are a living MIRROR (delta-synced, no single archive) — restorable in-place but not downloadable/verifiable individually."
          items:
            type: object
            properties:
              source: { type: string, enum: [database, invoices, files, gallery, mail, notes, avatars] }
              encrypted: { type: boolean, description: "Bytes are encrypted (.enc / per-file) — verify/decrypt/restore need the passphrase." }
              mirror: { type: boolean, description: "Blob source stored as a living mirror (true) vs. a DB point-in-time dump (false)." }
              downloadable: { type: boolean, description: "Only the DB dump is a downloadable/verifiable archive; mirror sources are not." }
              restorable: { type: boolean, description: "Blob sources restore in-place from the mirror; the database cannot (use artisan backup:restore-db)." }
        cancellable: { type: boolean }
        cancelling: { type: boolean, description: "A graceful cancel has been requested and is pending." }
        verifyStatus: { type: [string, "null"] }
        verifyMessage: { type: [string, "null"] }
        verifiedHuman: { type: [string, "null"], description: "Relative time of the last verification." }

    MailAddress:
      type: object
      properties:
        name: { type: [string, "null"] }
        email: { type: string }
      required: [email]

    MailAccount:
      type: object
      description: An IMAP mail account. The password is never serialised.
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        encryption: { type: string, enum: [ssl, tls, starttls, none] }
        folders: { type: [array, "null"], items: { type: string }, description: "Sync allow-list; null = all folders." }
        backfill_since: { type: [string, "null"], format: date }
        delete_after_import: { type: boolean }
        skip_spam: { type: boolean }
        enabled: { type: boolean }
        sync_interval_minutes: { type: [integer, "null"], description: "Per-account override; null = workspace default." }
        smtp_host: { type: [string, "null"], description: "Outgoing SMTP for compose/reply/forward (opt-in)." }
        smtp_port: { type: [integer, "null"] }
        smtp_username: { type: [string, "null"] }
        smtp_encryption: { type: [string, "null"], enum: [ssl, tls, starttls, none, null] }
        from_name: { type: [string, "null"] }
        from_email: { type: [string, "null"] }
        has_smtp_password: { type: boolean, description: "The SMTP password itself is NEVER returned; this flags whether one is stored." }
        status: { type: string, enum: [idle, syncing, error] }
        last_error: { type: [string, "null"] }
        last_synced_at: { type: [string, "null"], format: date-time }
        message_count: { type: integer }
      required: [id, name, host, port, username, encryption, enabled, status]

    MailMessage:
      type: object
      description: >
        An archived message. `index` returns the envelope fields; `show` adds
        text_body/html/references/reply_to/headers_raw/attachments. Immutable —
        only seen/trashed toggle.
      properties:
        id: { type: string, format: uuid, description: "Also the raw-blob key (GET /mail/raw/{id})." }
        account_id: { type: [integer, "null"], description: "null once the source account was deleted." }
        folder: { type: string }
        message_id: { type: [string, "null"] }
        in_reply_to: { type: [string, "null"] }
        references: { type: [string, "null"] }
        thread_id: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        from_name: { type: [string, "null"] }
        from_email: { type: [string, "null"] }
        to: { type: array, items: { $ref: '#/components/schemas/MailAddress' } }
        cc: { type: array, items: { $ref: '#/components/schemas/MailAddress' } }
        reply_to: { type: [string, "null"] }
        date: { type: [string, "null"], format: date-time, description: "The message's own Date header." }
        size: { type: integer }
        has_attachment: { type: boolean }
        attachment_count: { type: integer }
        seen: { type: boolean }
        trashed: { type: boolean }
        spam: { type: boolean }
        spf: { type: [string, "null"] }
        dkim: { type: [string, "null"] }
        dmarc: { type: [string, "null"] }
        encrypted_type: { type: [string, "null"], enum: [pgp, smime, null], description: "Set in a later phase." }
        decrypt_status: { type: [string, "null"], enum: [ok, nokey, fail, null] }
        created_at: { type: [string, "null"], format: date-time, description: "Archived-at (hour-snapped)." }
        text_body: { type: [string, "null"], description: "show only." }
        html: { type: [string, "null"], description: "Server-sanitised HTML (show only)." }
        headers_raw: { type: [string, "null"], description: "Raw RFC822 header block (show only)." }
        attachments: { type: array, description: "show only.", items: { $ref: '#/components/schemas/MailAttachment' } }
        labels: { type: array, items: { $ref: '#/components/schemas/MailLabel' } }
      required: [id, folder, size, seen, trashed]

    MailLabel:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string }
        message_count: { type: integer, description: "index only." }
      required: [id, name, color]

    MailRule:
      type: object
      description: "A sieve-lite ingest rule (matched at ingest)."
      properties:
        id: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        match:
          type: object
          properties:
            from: { type: [string, "null"] }
            to: { type: [string, "null"] }
            subject: { type: [string, "null"] }
            folder: { type: [string, "null"] }
            has_attachment: { type: [boolean, "null"] }
        action:
          type: object
          properties:
            add_label: { type: [integer, "null"] }
            mark_read: { type: [boolean, "null"] }
            trash: { type: [boolean, "null"] }
            skip: { type: [boolean, "null"] }
      required: [id, name, enabled, priority]

    MailSavedSearch:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        filters: { type: object, additionalProperties: true }
      required: [id, name]

    MailAttachment:
      type: object
      description: >
        One decoded MIME attachment part of an archived message. Bytes are served
        sandboxed via GET /mail/attachments/{id}/raw; inline=true marks cid:
        images referenced by the HTML body.
      properties:
        id: { type: string, format: uuid }
        filename: { type: [string, "null"] }
        content_type: { type: [string, "null"] }
        size: { type: integer }
        inline: { type: boolean }
      required: [id, size, inline]

    MailKeyIdentity:
      type: object
      description: >
        One user id on a key — for PGP, parsed from the raw OpenPGP uid string
        ("Name (Comment) <email>", every part optional); for S/MIME, the
        certificate's subject CN/emailAddress (or its first SAN rfc822Name).
      properties:
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        comment: { type: [string, "null"] }

    MailKey:
      type: object
      description: >
        A user's PGP / S-MIME decryption key — PUBLIC material only. The private
        key + passphrase are stored encrypted and are never serialised. Metadata
        (algorithm/key_length/curve/issuer/serial/valid_from/identities) is
        parsed once at import/generate time from the key/certificate itself —
        for a key imported before this metadata existed, these fields are null
        until the key is re-imported.
      properties:
        id: { type: integer }
        type: { type: string, enum: [pgp, smime] }
        label: { type: string }
        key_fingerprint: { type: [string, "null"] }
        key_id: { type: [string, "null"] }
        public_key: { type: [string, "null"] }
        identities: { type: [array, "null"], items: { $ref: '#/components/schemas/MailKeyIdentity' } }
        has_cert: { type: boolean }
        cert_pem:
          type: [string, "null"]
          description: "S/MIME only — the certificate PEM (public half; never the private key)."
        algorithm:
          type: [string, "null"]
          description: "e.g. RSA / ECDSA / EdDSA / ECDH (pgp) / RSA / EC (smime)."
        key_length: { type: [integer, "null"], description: "Bits, for RSA/DSA keys." }
        curve: { type: [string, "null"], description: "ECC curve name, for elliptic-curve keys." }
        issuer: { type: [string, "null"], description: "S/MIME only — the certificate issuer DN (self-signed → same as the subject)." }
        serial: { type: [string, "null"], description: "S/MIME only — the certificate serial number (hex)." }
        valid_from: { type: [string, "null"], format: date-time, description: "PGP key creation date, or S/MIME certificate notBefore." }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
      required: [id, type, label, has_cert]

    MailKeyGenerateRequest:
      type: object
      description: >
        Server-side key generation options. PGP fields (algorithm/key_length/
        curve/signing_subkey) apply to type=pgp; type=smime always produces a
        self-signed RSA cert+key (key_length applies). A passphrase, when set,
        protects the generated private key (PGP: gpg protection; S-MIME: the key
        PEM is encrypted with it). Private material is never returned.
      properties:
        type: { type: string, enum: [pgp, smime] }
        label: { type: string, maxLength: 200 }
        passphrase:
          type: [string, "null"]
          description: "Optional. Empty = passphrase-less key (warned client-side)."
        expire_years:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: "Key validity in years; omit for no expiry (PGP) / 2y default (S-MIME)."
        identities:
          type: array
          minItems: 1
          maxItems: 20
          description: "User IDs; the first is the primary UID. PGP supports many; S-MIME uses the first."
          items:
            type: object
            properties:
              name: { type: [string, "null"], maxLength: 200 }
              email: { type: string, format: email, maxLength: 254 }
              comment: { type: [string, "null"], maxLength: 200 }
            required: [email]
        algorithm:
          type: [string, "null"]
          enum: [rsa, ecc, null]
          description: "PGP only. Default ecc (EdDSA ed25519 + ECDH cv25519)."
        key_length:
          type: [integer, "null"]
          enum: [2048, 3072, 4096, null]
          description: "RSA key length in bits (PGP algorithm=rsa, or S-MIME). Default 3072."
        curve:
          type: [string, "null"]
          enum: [ed25519, nistp256, nistp384, nistp521, brainpoolP256r1, brainpoolP384r1, brainpoolP512r1, null]
          description: "PGP algorithm=ecc curve. Default ed25519. NIST/brainpool require gpg support."
        signing_subkey:
          type: [boolean, "null"]
          description: "PGP only. Add a separate signing subkey alongside the encryption subkey."
      required: [type, label, identities]

    CryptoRecipient:
      type: object
      description: >
        Someone else's public key/certificate, saved to encrypt data for them
        (the Files module "encrypt to" picker). Public material only — never a
        private key. May have been imported manually or fetched from a
        keyserver (key_server_id set); refreshed_at tracks the last successful
        re-fetch from that server.
      properties:
        id: { type: integer }
        type: { type: string, enum: [pgp, smime] }
        label: { type: string }
        fingerprint: { type: [string, "null"] }
        key_id: { type: [string, "null"] }
        public_key: { type: [string, "null"] }
        cert_pem: { type: [string, "null"] }
        key_server_id: { type: [integer, "null"], description: "The keyserver this recipient was imported/refreshed from, if any." }
        refreshed_at: { type: [string, "null"], format: date-time }
      required: [id, type, label]

    KeyServer:
      type: object
      description: "An HKP keyserver configured by the user, used to search for / publish / refresh PGP public keys. Owner-scoped."
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 500 }
        enabled: { type: boolean }
      required: [id, name, url, enabled]

    KeyserverCandidate:
      type: object
      description: "One PGP key found by an HKP keyserver search (op=index) — not yet imported."
      properties:
        server_id: { type: integer }
        server_name: { type: string }
        key_id: { type: string, description: "Long (16-hex) or fingerprint (40-hex) key identifier, used to fetch/import the full key." }
        fingerprint: { type: [string, "null"] }
        algorithm: { type: [string, "null"] }
        bits: { type: [integer, "null"] }
        created_at: { type: [integer, "null"], description: "Unix timestamp." }
        expires_at: { type: [integer, "null"], description: "Unix timestamp." }
        revoked: { type: boolean }
        uids:
          type: array
          items: { $ref: '#/components/schemas/MailKeyIdentity' }
      required: [server_id, server_name, key_id, revoked, uids]

    KeyserverPresenceResult:
      type: object
      description: "Whether one of the user's own PGP keys was found (by exact re-derived fingerprint match, not just a server-reported label) on a configured keyserver."
      properties:
        server_id: { type: integer }
        server_name: { type: string }
        present: { type: boolean }
      required: [server_id, server_name, present]

    MailLog:
      type: object
      properties:
        id: { type: integer }
        level: { type: string, enum: [info, warn, error] }
        event: { type: string }
        folder: { type: [string, "null"] }
        message: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
      required: [id, level, event]

paths:

  /auth/login:
    post:
      tags: [Auth]
      operationId: spaLogin
      summary: Browser login (email+password+optional 2FA) to a bearer token
      security: []
      description: >
        Backend-agnostic login: validates credentials (and TOTP/recovery code
        when 2FA is confirmed) and returns a device-scoped Sanctum bearer token.
        On a 2FA-required account with no/invalid code, returns 422 with
        {two_factor: true}. Native clients that send `install_id` (+ device_name/
        app_version/os_version) are registered as a real device — same as QR
        pairing — so they appear under "Connected devices" (revoke/wipe/heartbeat)
        and re-login on the same install_id replaces the previous device row.
        The account must have a verified email before a bearer is minted — an
        unverified account returns 403 {status:"verify-email"} (v1.562.0). A
        blocked account fails with the same generic 422 as bad credentials (no
        enumeration). Throttled at 10 req/min → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                code: { type: [string, "null"] }
                recovery_code: { type: [string, "null"] }
                device_name: { type: [string, "null"], description: "Device label (native) or 'web' default." }
                install_id: { type: [string, "null"], description: "Stable app install id — presence marks a native device; enables device registration + dedup." }
                app_version: { type: [string, "null"] }
                os_version: { type: [string, "null"] }
      responses:
        "200":
          description: Token + user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "403":
          description: >
            Email not verified — no bearer is minted until the address is verified.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: verify-email } } }
        "422":
          description: >
            Invalid credentials (also returned generically for a blocked account,
            no enumeration), or {two_factor:true} when a 2FA code is required.
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: spaLogout
      summary: Revoke the current bearer token
      responses:
        "200": { description: OK. }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/passkey/options:
    post:
      tags: [Passkeys]
      operationId: passkeyLoginOptions
      summary: Passwordless sign-in — WebAuthn assertion options
      security: []
      description: >
        Public. Returns a one-time challenge (`options`, standard WebAuthn
        PublicKeyCredentialRequestOptionsJSON) plus an opaque `handle` that binds
        the challenge for /auth/passkey/verify. Feed `options` to
        navigator.credentials.get(). Throttled 30/min.
      responses:
        "200":
          description: Request options + handle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle: { type: string }
                  options: { type: object, additionalProperties: true }
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/passkey/verify:
    post:
      tags: [Passkeys]
      operationId: passkeyLoginVerify
      summary: Passwordless sign-in — verify assertion, mint a bearer token
      security: []
      description: >
        Public. Verifies the authenticator assertion against the cached
        challenge and mints a device-scoped Sanctum bearer token. 422
        {message:"passkey_failed"} on any invalid/expired assertion; 403
        {status:"verify-email"} for an unverified account; 403
        {message:"blocked"} for a blocked account. Throttled 30/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, credential]
              properties:
                handle: { type: string }
                credential: { type: object, additionalProperties: true, description: "Serialized PublicKeyCredential (assertion) as returned by the webauthn browser helper." }
      responses:
        "200":
          description: Token + user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "403": { description: "Email not verified or account blocked." }
        "422": { description: "Assertion invalid/expired." }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Contacts module (module:contacts + device auth). Mirrors the web routes.
  # --------------------------------------------------------------------------
  /contacts/data:
    get:
      tags: [Contacts]
      operationId: contactsData
      summary: List contacts + address books + groups
      parameters:
        - { name: book, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: group, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: favorites, in: query, required: false, schema: { type: boolean } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Contacts snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts: { type: array, items: { type: object } }
                  books: { type: array, items: { type: object } }
                  groups: { type: array, items: { type: object } }
                  settings: { type: object, properties: { sort: { type: string, enum: [first_name, last_name] }, display_format: { type: string, enum: [first_last, last_first] } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /contacts/sources:
    get:
      tags: [Contacts]
      operationId: contactSyncSourcesIndex
      summary: List external CardDAV replicas and recent immutable recovery versions
      responses:
        "200": { description: Replica configuration without credentials., content: { application/json: { schema: { type: object, properties: { sources: { type: array, items: { type: object } }, versions: { type: array, items: { type: object } } } } } } }
    post:
      tags: [Contacts]
      operationId: contactSyncSourcesStore
      summary: Add a Ledgerline-first external CardDAV replica
      description: >
        The endpoint must clear the outbound SSRF guard. Plain http is accepted
        only for a host that resolves inside the local network; an external
        endpoint has to be https, since basic-auth credentials and pushed vCards
        would otherwise cross the internet in the clear (422). Every request the
        sync makes afterwards stays on this origin: a redirect or an absolute
        href that leaves it aborts the sync rather than forwarding credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address_book_id, provider]
              properties:
                name: { type: string }
                address_book_id: { type: string, format: uuid }
                provider: { type: string, enum: [carddav, icloud, google] }
                endpoint: { type: string, format: uri, description: "Required for CardDAV/iCloud; Google uses discovery by default." }
                username: { type: string }
                password: { type: string, writeOnly: true }
                oauth_client_id: { type: string, writeOnly: true }
                oauth_client_secret: { type: string, writeOnly: true }
                propagate_deletes: { type: boolean, default: true }
      responses:
        "201": { description: Replica saved; Google response contains an authorization URL., content: { application/json: { schema: { type: object } } } }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/sources/{source}/sync:
    post:
      tags: [Contacts]
      operationId: contactSyncSourcesSync
      summary: Queue an immediate CardDAV reconciliation
      parameters: [{ name: source, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Queued. }
        "403": { $ref: '#/components/responses/Forbidden' }
  /contacts/sources/{source}:
    delete:
      tags: [Contacts]
      operationId: contactSyncSourcesDestroy
      summary: Remove replica credentials without deleting local contacts or versions
      parameters: [{ name: source, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Removed. }
        "403": { $ref: '#/components/responses/Forbidden' }
  /contacts/versions/{version}/restore:
    post:
      tags: [Contacts]
      operationId: contactVersionsRestore
      summary: Restore an immutable contact vCard version locally and queue its replicas
      parameters: [{ name: version, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Restored., content: { application/json: { schema: { type: object, properties: { contact_id: { type: string, format: uuid } } } } } }
        "403": { $ref: '#/components/responses/Forbidden' }
  /contacts:
    post:
      tags: [Contacts]
      operationId: contactsStore
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [book_id], properties: { book_id: { type: string }, fn: { type: string }, first_name: { type: string }, last_name: { type: string }, org: { type: string }, emails: { type: array, items: { type: object } }, phones: { type: array, items: { type: object } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/{contact}:
    get:
      tags: [Contacts]
      operationId: contactsShow
      summary: Full parsed vCard detail
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Contact detail (parsed vCard + id/book/group_ids)., content: { application/json: { schema: { type: object } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Contacts]
      operationId: contactsUpdate
      summary: Update a contact
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: "Rich editor payload: book_id, fn, first_name, last_name, org, title, nickname, bday, anniversaries[], note, emails[], phones[], urls[], addresses[], related[], custom_fields[], favorite, group_ids[]." } } } }
      responses:
        "200": { description: Updated. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Contacts]
      operationId: contactsDestroy
      summary: Delete a contact
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /contacts/{contact}/favorite:
    patch:
      tags: [Contacts]
      operationId: contactsFavorite
      summary: Toggle the favorite star
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [favorite], properties: { favorite: { type: boolean } } } } } }
      responses:
        "200": { description: OK., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, favorite: { type: boolean } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /contacts/{contact}/avatar:
    get:
      tags: [Contacts]
      operationId: contactsAvatar
      summary: Stream the contact avatar (sandboxed)
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Image bytes., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Contacts]
      operationId: contactsAvatarUpload
      summary: Upload/replace the contact avatar
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { avatar: { type: string, format: binary } } } } } }
      responses:
        "200": { description: Stored., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, avatar: { type: [string, "null"] } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/bulk-destroy:
    delete:
      tags: [Contacts]
      operationId: contactsBulkDestroy
      summary: Delete multiple contacts
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /contacts/import:
    post:
      tags: [Contacts]
      operationId: contactsImport
      summary: Import a VCF file
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary }, book_id: { type: string } } } } } }
      responses:
        "200": { description: Import summary., content: { application/json: { schema: { type: object, properties: { created: { type: integer }, updated: { type: integer }, skipped: { type: integer } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/export:
    get:
      tags: [Contacts]
      operationId: contactsExport
      summary: Export contacts as VCF
      responses:
        "200": { description: VCF file., content: { text/vcard: { schema: { type: string } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /contacts/shares:
    get:
      tags: [Contacts]
      operationId: contactsShares
      summary: List the current user's address-book shares (owner side)
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Owner's shares., content: { application/json: { schema: { type: object, properties: { shares: { type: array, items: { type: object, properties: { id: { type: integer }, book_id: { type: string }, book: { type: [string, "null"] }, recipient: { type: [string, "null"] } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Contacts]
      operationId: contactsShareStore
      summary: Share an address book with a registered user (viewer, by email)
      description: "Unified 422 for unknown recipient AND self-share (no enumeration)."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, book_id], properties: { email: { type: string, format: email }, book_id: { type: string } } } } } }
      responses:
        "201": { description: Shared. }
        "200": { description: Already shared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Unknown recipient or self-share. }
  /contacts/shares/{share}:
    delete:
      tags: [Contacts]
      operationId: contactsShareDestroy
      summary: Revoke an address-book share
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /contacts/shared-with-me:
    get:
      tags: [Contacts]
      operationId: contactsSharedWithMe
      summary: Address books shared TO the current user
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Shares with me., content: { application/json: { schema: { type: object, properties: { shares: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: [string, "null"] }, owner: { type: [string, "null"] }, count: { type: integer } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /contacts/shared-with-me/{share}:
    get:
      tags: [Contacts]
      operationId: contactsSharedBrowse
      summary: Read-only contacts of a shared address book
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Contacts., content: { application/json: { schema: { type: object, properties: { name: { type: [string, "null"] }, contacts: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /contacts/birthday-feed:
    get:
      tags: [Contacts]
      operationId: contactsBirthdayFeed
      summary: Birthday .ics feed status + subscribe URL
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Status., content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, url: { type: [string, "null"] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Contacts]
      operationId: contactsBirthdayFeedEnable
      summary: Enable (or rotate) the birthday feed token
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Enabled., content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, url: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Contacts]
      operationId: contactsBirthdayFeedDisable
      summary: Disable the birthday feed
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /contacts/birthdays/{token}.ics:
    get:
      tags: [Contacts]
      operationId: contactsBirthdaysIcs
      summary: Public subscribeable birthday calendar (token = capability)
      description: "Unauthenticated iCalendar feed of the owner's contacts' birthdays (yearly all-day events). The path lives at the app root (not under /api/v1)."
      security: []
      servers: [ { url: / } ]
      parameters: [ { name: token, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: text/calendar feed. }
        "404": { description: Unknown/disabled token. }
  /contacts/suggest:
    get:
      tags: [Contacts]
      operationId: contactsSuggest
      summary: Autocomplete suggestions
      parameters: [{ name: q, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Suggestions. }
  /contacts/{contact}/geo:
    get:
      tags: [Contacts]
      operationId: contactsGeo
      summary: Geocode a contact address for the map preview
      parameters:
        - { name: contact, in: path, required: true, schema: { type: string } }
        - { name: address, in: query, required: false, schema: { type: integer, default: 0 }, description: "Which postal address to geocode (index)." }
      responses:
        "200": { description: Geocoder match., content: { application/json: { schema: { type: object, properties: { display: { type: [string, "null"] }, lat: { type: [number, "null"] }, lon: { type: [number, "null"] } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /contacts/settings:
    post:
      tags: [Contacts]
      operationId: contactsSettings
      summary: Update contacts view settings (sort/display)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sort, display_format], properties: { sort: { type: string, enum: [first_name, last_name] }, display_format: { type: string, enum: [first_last, last_first] } } } } } }
      responses:
        "200": { description: Saved. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/duplicates/data:
    get:
      tags: [Contacts]
      operationId: contactsDuplicatesData
      summary: Duplicate candidate groups
      responses:
        "200": { description: Duplicate groups. }
  /contacts/duplicates/merge:
    post:
      tags: [Contacts]
      operationId: contactsDuplicatesMerge
      summary: Merge a duplicate set
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [primary_id, ids], properties: { primary_id: { type: string }, ids: { type: array, minItems: 2, items: { type: string } } } } } } }
      responses:
        "200": { description: Merged. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/duplicates/dismiss:
    post:
      tags: [Contacts]
      operationId: contactsDuplicatesDismiss
      summary: Dismiss a duplicate suggestion
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, minItems: 2, items: { type: string } } } } } } }
      responses:
        "200": { description: Dismissed. }
  /address-books:
    post:
      tags: [Contacts]
      operationId: addressBooksStore
      summary: Create an address book
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        "201": { description: Created. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /address-books/{addressBook}:
    put:
      tags: [Contacts]
      operationId: addressBooksUpdate
      summary: Rename an address book
      parameters: [{ name: addressBook, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses:
        "200": { description: Updated. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contacts]
      operationId: addressBooksDestroy
      summary: Delete an address book
      parameters: [{ name: addressBook, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /contact-groups:
    post:
      tags: [Contacts]
      operationId: contactGroupsStore
      summary: Create a contact group
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        "201": { description: Created. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contact-groups/{group}:
    delete:
      tags: [Contacts]
      operationId: contactGroupsDestroy
      summary: Delete a contact group
      parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------------------
  # Geo (address autocomplete — app-generic, authenticated, not module-gated)
  # --------------------------------------------------------------------------

  /geo/search:
    get:
      tags: [Geo]
      operationId: geoSearch
      summary: Forward-geocode an address / place (autocomplete)
      description: >
        Server-proxied Nominatim forward geocode. Returns up to 8 candidate
        matches with coordinates for a location autocomplete + mini-map marker.
        A query shorter than 3 characters returns an empty list without hitting
        the upstream. Response is `no-store`; the query is never logged.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: "Free-text address or place. < 3 chars → empty results." }
      responses:
        "200":
          description: Candidate matches (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      properties:
                        display: { type: string, description: "Human-readable place name." }
                        lat: { type: number, description: "Latitude." }
                        lon: { type: number, description: "Longitude." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Notes (plaintext-relational Markdown, module:notes)
  # --------------------------------------------------------------------------

  /notes/data:
    get:
      tags: [Notes]
      operationId: notesData
      summary: Folder tree + note list + tag aggregate
      description: Notes are returned without their body (lightweight list). Owner-scoped.
      responses:
        "200":
          description: Notes data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders: { type: array, items: { $ref: "#/components/schemas/NoteFolder" } }
                  notes: { type: array, items: { $ref: "#/components/schemas/NoteRow" } }
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        count: { type: integer }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled. }
  /notes/trash:
    get:
      tags: [Notes]
      operationId: notesTrash
      summary: Trashed notes + folders
      responses:
        "200":
          description: Recycle bin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes: { type: array, items: { $ref: "#/components/schemas/NoteRow" } }
                  folders: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        "401": { description: Unauthenticated. }
  /notes/search:
    get:
      tags: [Notes]
      operationId: notesSearch
      summary: Full-text search over title + body
      description: Postgres GIN full-text (title+body) with a sqlite LIKE fallback. Owner-scoped, capped at 100. Throttle 120/min.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching notes (without body).
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes: { type: array, items: { $ref: "#/components/schemas/NoteRow" } }
        "401": { description: Unauthenticated. }
  /notes:
    post:
      tags: [Notes]
      operationId: notesStore
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: Created note (with body).
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: "#/components/schemas/Note" }
        "401": { description: Unauthenticated. }
        "422": { description: Validation error. }
  /notes/{note}:
    get:
      tags: [Notes]
      operationId: notesShow
      summary: Full note (with body) for the editor
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Note with body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: "#/components/schemas/Note" }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
    put:
      tags: [Notes]
      operationId: notesUpdate
      summary: Update a note (optimistic)
      description: Send `version` for optimistic concurrency; a stale version returns 409.
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/NoteInput" }
                - type: object
                  properties: { version: { type: integer } }
      responses:
        "200":
          description: Updated note.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: "#/components/schemas/Note" }
        "409":
          description: Version conflict.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [version_conflict] }
                  version: { type: integer }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
    delete:
      tags: [Notes]
      operationId: notesDestroy
      summary: Move a note to trash (soft-delete)
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Trashed., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /notes/{note}/backlinks:
    get:
      tags: [Notes]
      operationId: notesBacklinks
      summary: Notes that link to this one (wikilink backlinks)
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Backlinks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backlinks: { type: array, items: { $ref: "#/components/schemas/NoteBacklink" } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /notes/{note}/export:
    get:
      tags: [Notes]
      operationId: notesExport
      summary: Download a note as a Markdown file
      description: Streams the note as `text/markdown` (YAML frontmatter with title/tags + body).
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Markdown file.
          content:
            text/markdown:
              schema: { type: string }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /notes/{note}/attachments:
    post:
      tags: [Notes]
      operationId: notesAttach
      summary: Attach a file/image to a note
      description: MIME allowlist pdf/jpg/jpeg/png/webp/gif + video mp4/webm/mov/m4v (no svg/html). Images + video embed inline; pdf attaches as a link. Throttle 120/min.
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string }
      responses:
        "201":
          description: Attachment metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: "#/components/schemas/NoteAttachment" }
        "401": { description: Unauthenticated. }
        "422": { description: Validation error. }
  /notes/{note}/attachments/from:
    post:
      tags: [Notes]
      operationId: notesAttachFrom
      summary: Embed an existing Files/Gallery image or video into a note
      description: >
        Copies the bytes of an owner-scoped Files file or Gallery photo into a note
        attachment (image/* or video/* only), so the note stays self-contained and
        reuses the sandboxed attachment raw endpoint. Throttle 120/min.
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, id]
              properties:
                source: { type: string, enum: [file, gallery] }
                id: { type: integer, description: FileEntry or GalleryPhoto id (owner-scoped) }
      responses:
        "201":
          description: Attachment metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: "#/components/schemas/NoteAttachment" }
        "401": { description: Unauthenticated. }
        "404": { description: Source not found / not owned. }
        "422": { description: Not an image/video, or validation error. }
  /notes/{note}/attachments/{attachment}/raw:
    get:
      tags: [Notes]
      operationId: notesAttachmentRaw
      summary: Stream an attachment (sandboxed)
      description: "Served with nosniff + a sandbox CSP (default-src none). Throttle 3000/min."
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
        - { name: attachment, in: path, required: true, schema: { type: integer } }
        - { name: download, in: query, required: false, schema: { type: boolean } }
      responses:
        "200": { description: Attachment bytes. }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /notes/{note}/attachments/{attachment}:
    delete:
      tags: [Notes]
      operationId: notesAttachmentDestroy
      summary: Delete an attachment
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
        - { name: attachment, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /notes/{note}/favorite:
    patch:
      tags: [Notes]
      operationId: notesFavorite
      summary: Toggle favorite
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { favorite: { type: boolean } } }
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
  /notes/{note}/pin:
    patch:
      tags: [Notes]
      operationId: notesPin
      summary: Toggle pinned
      parameters:
        - { name: note, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { pinned: { type: boolean } } }
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
  /notes/{id}/restore:
    post:
      tags: [Notes]
      operationId: notesRestore
      summary: Restore a trashed note
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Restored., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
  /notes/{id}/force:
    delete:
      tags: [Notes]
      operationId: notesForceDelete
      summary: Permanently delete a trashed note
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
  /notes/folders:
    post:
      tags: [Notes]
      operationId: notesFolderStore
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteFolderInput" }
      responses:
        "201":
          description: Created folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder: { $ref: "#/components/schemas/NoteFolder" }
        "401": { description: Unauthenticated. }
        "422": { description: Validation error. }
  /notes/folders/{folder}:
    put:
      tags: [Notes]
      operationId: notesFolderUpdate
      summary: Rename / recolor / move a folder (optimistic)
      parameters:
        - { name: folder, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/NoteFolderInput" }
                - type: object
                  properties: { version: { type: integer } }
      responses:
        "200":
          description: Updated folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder: { $ref: "#/components/schemas/NoteFolder" }
        "409": { description: Version conflict. }
        "422": { description: Validation error / cycle. }
        "401": { description: Unauthenticated. }
    delete:
      tags: [Notes]
      operationId: notesFolderDestroy
      summary: Delete a folder + its subtree (to trash)
      parameters:
        - { name: folder, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Trashed., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
  /notes/folders/{id}/restore:
    post:
      tags: [Notes]
      operationId: notesFolderRestore
      summary: Restore a trashed folder subtree
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Restored., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }

  # --------------------------------------------------------------------------
  # Calendar (CalDAV-backed, module:calendar)
  # --------------------------------------------------------------------------

  /calendar/data:
    get:
      tags: [Calendar]
      operationId: calendarData
      summary: List calendars + view settings
      responses:
        "200":
          description: Calendar snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendars: { type: array, items: { $ref: '#/components/schemas/Calendar' } }
                  settings: { $ref: '#/components/schemas/CalendarSettings' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /calendar/holiday-countries:
    get:
      tags: [Calendar]
      operationId: calendarHolidayCountries
      summary: OpenHolidays country list (proxied + cached) for the special-calendar dialog
      description: >
        Server-proxied OpenHolidays `/Countries` (SSRF-guarded, cached ~1 day) so
        the SPA can populate the country select under CSP connect-src 'self'. Names
        are in the current UI language. An upstream failure degrades to an empty list.
      responses:
        "200":
          description: Country list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        isoCode: { type: string, description: "ISO 3166-1 alpha-2, e.g. DE." }
                        name: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/holiday-subdivisions:
    get:
      tags: [Calendar]
      operationId: calendarHolidaySubdivisions
      summary: OpenHolidays subdivisions (regions / Bundesländer) for a country
      description: >
        Server-proxied OpenHolidays `/Subdivisions?countryIsoCode=..` (SSRF-guarded,
        cached ~1 day). German Bundesländer come back as DE-BW, DE-BY, … An upstream
        failure degrades to an empty list.
      parameters:
        - { name: country, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z-]{2,8}$' }, description: "ISO 3166-1 alpha-2, e.g. DE." }
      responses:
        "200":
          description: Subdivision list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subdivisions:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, description: "OpenHolidays subdivision code, e.g. DE-BY." }
                        name: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/events:
    get:
      tags: [Calendar]
      operationId: calendarEvents
      summary: Recurrence-expanded occurrences in a date range
      description: >
        The requested `to − from` window is capped at 400 days to bound
        recurrence-expansion cost (v1.562.0); a wider span is rejected with
        422 {error:"range_too_large"}.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: calendar, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Occurrences overlapping [from,to].
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/CalendarOccurrence' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422":
          description: >
            Request validation failed (standard body), OR the from..to window
            exceeds the 400-day cap → { error: "range_too_large" }.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - type: object
                    required: [error]
                    properties:
                      error: { type: string, enum: [range_too_large] }
        "429": { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Calendar]
      operationId: calendarEventsStore
      summary: Create an event
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEventInput' } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/events/{event}:
    get:
      tags: [Calendar]
      operationId: calendarEventsShow
      summary: Full parsed VEVENT detail
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Event detail., content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEvent' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Calendar]
      operationId: calendarEventsUpdate
      summary: Update an event (etag optimistic concurrency)
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEventInput' } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, etag: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Etag conflict., content: { application/json: { schema: { $ref: '#/components/schemas/EtagConflict' } } } }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Calendar]
      operationId: calendarEventsDestroy
      summary: Delete an event
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/events/{event}/exclude:
    post:
      tags: [Calendar]
      operationId: calendarEventsExclude
      summary: Delete a single occurrence of a recurring event (EXDATE)
      description: Adds an EXDATE to the master VEVENT so the given occurrence drops out; the series is untouched.
      security: [ { bearerAuth: [] } ]
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [start], properties: { start: { type: string, format: date-time, description: "The occurrence's start (RECURRENCE-ID) to exclude." } } } } } }
      responses:
        "200": { description: Excluded., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, etag: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /calendar/events/{event}/occurrence:
    put:
      tags: [Calendar]
      operationId: calendarEventsOverrideOccurrence
      summary: Edit a single occurrence of a recurring event (RECURRENCE-ID override)
      description: Adds/replaces a detached VEVENT with the master's UID + a RECURRENCE-ID, carrying the edited fields for just that instance.
      security: [ { bearerAuth: [] } ]
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CalendarEventInput'
                - type: object
                  required: [recurrence_id]
                  properties:
                    recurrence_id: { type: string, format: date-time, description: "The occurrence's original start to override." }
      responses:
        "200": { description: Overridden., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, etag: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /calendar/import:
    post:
      tags: [Calendar]
      operationId: calendarImport
      summary: Import an ICS file (dedupe by UID)
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary }, calendar_id: { type: string } } } } } }
      responses:
        "200": { description: Import summary., content: { application/json: { schema: { $ref: '#/components/schemas/CalendarImportResult' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/export:
    get:
      tags: [Calendar]
      operationId: calendarExport
      summary: Export events as one ICS
      parameters: [{ name: calendar, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: ICS file., content: { text/calendar: { schema: { type: string } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /calendar/settings:
    post:
      tags: [Calendar]
      operationId: calendarSettings
      summary: Update calendar view settings (default view / week start)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSettings' } } } }
      responses:
        "200": { description: Saved. }
        "422": { $ref: '#/components/responses/ValidationError' }
  /calendar/events/{event}/rsvp:
    post:
      tags: [Calendar]
      operationId: calendarRsvp
      summary: RSVP to an event you are an attendee of (sets your PARTSTAT + iMIP REPLY)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: event, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ACCEPTED, DECLINED, TENTATIVE] } } } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Not an attendee of this event. }
  /calendar/imip:
    post:
      tags: [Calendar]
      operationId: calendarImipIngest
      summary: Ingest a received iMIP payload (REQUEST/REPLY/CANCEL)
      description: "Applies a received iCalendar meeting message to the caller's calendars: REQUEST creates/updates the invitation, REPLY updates an attendee's PARTSTAT on the organizer's event, CANCEL marks the event cancelled. The mail archive also does this automatically for received text/calendar parts."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ics], properties: { ics: { type: string } } } } } }
      responses:
        "200": { description: Processed., content: { application/json: { schema: { type: object, properties: { method: { type: [string,"null"] }, action: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /calendar/free-busy:
    get:
      tags: [Calendar]
      operationId: calendarFreeBusy
      summary: Merged busy intervals across the caller's readable calendars
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: from, in: query, required: true, schema: { type: string } }, { name: to, in: query, required: true, schema: { type: string } } ]
      responses:
        "200": { description: Busy., content: { application/json: { schema: { type: object, properties: { busy: { type: array, items: { type: object, properties: { start: { type: string }, end: { type: string } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Range too large. }
  /calendar/slots:
    post:
      tags: [Calendar]
      operationId: calendarSlots
      summary: Find common free slots for the caller and named local attendees
      description: "Attendee availability comes from calendars they have shared with the caller; attendees with no shared calendar are returned in unknown_attendees."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from, to, duration_min], properties: { from: { type: string }, to: { type: string }, duration_min: { type: integer, minimum: 5, maximum: 1440 }, day_start: { type: integer, minimum: 0, maximum: 23 }, day_end: { type: integer, minimum: 1, maximum: 24 }, attendees: { type: array, items: { type: string, format: email } } } } } } }
      responses:
        "200": { description: Slots., content: { application/json: { schema: { type: object, properties: { slots: { type: array, items: { type: object, properties: { start: { type: string }, end: { type: string } } } }, unknown_attendees: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /calendar/shares:
    get:
      tags: [Calendar]
      operationId: calendarShares
      summary: Calendar shares the current user has granted
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Shares., content: { application/json: { schema: { type: object, properties: { shares: { type: array, items: { type: object, properties: { id: { type: integer }, calendar_id: { type: string }, calendar: { type: [string,"null"] }, recipient: { type: [string,"null"] }, role: { type: string } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Calendar]
      operationId: calendarShareStore
      summary: Share a calendar with a registered user (viewer/editor)
      description: "Recipient resolved by exact email. Unified 422 for unknown user AND self-share (no enumeration). role=editor lets the recipient create/edit events."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [calendar_id, email], properties: { calendar_id: { type: string }, email: { type: string, format: email }, role: { type: string, enum: [viewer, editor] } } } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, id: { type: integer } } } } } }
        "200": { description: Role updated (already shared). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Unknown recipient or self-share. }
  /calendar/shares/{share}:
    delete:
      tags: [Calendar]
      operationId: calendarShareDestroy
      summary: Revoke a calendar share
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendars:
    post:
      tags: [Calendar]
      operationId: calendarsStore
      summary: Create a calendar (event calendar by default, or a VTODO task list)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, color: { type: string }, component: { type: string, enum: [VEVENT, VTODO], description: "VTODO = task list; omit/VEVENT = event calendar." } } } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /calendars/{calendar}:
    put:
      tags: [Calendar]
      operationId: calendarsUpdate
      summary: Update a calendar (name/color/description/timezone)
      parameters: [{ name: calendar, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, color: { type: string }, description: { type: string }, timezone: { type: string } } } } } }
      responses:
        "200": { description: Updated. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Calendar]
      operationId: calendarsDestroy
      summary: Delete a calendar (422 on the last one)
      parameters: [{ name: calendar, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { description: Cannot delete the last calendar. }
  /calendars/special:
    post:
      tags: [Calendar]
      operationId: calendarsStoreSpecial
      summary: Create a special (generated, read-only) calendar and populate it
      description: >
        Creates a calendar of kind `holidays` (public holidays for a country +
        optional region), `school_holidays` (Ferien, multi-day ranges) or
        `birthdays` (from the owner's contacts) and generates its events. The
        holiday kinds pull from the OpenHolidays API for the given `country`
        (default DE) + optional `subdivision`, falling back to locally-computed
        German national holidays if the API is unreachable and the calendar is DE
        with no subdivision. `country`/`subdivision` are ignored for `birthdays`
        and are persisted so a later regenerate re-queries the same region. Events
        are server-generated and not user-editable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                name: { type: [string, "null"], maxLength: 255, description: "Optional; the SPA sends a predefined name. If omitted/empty the server derives a default from kind (+ country/subdivision)." }
                color: { type: [string, "null"], maxLength: 9 }
                kind: { type: string, enum: [holidays, school_holidays, birthdays] }
                country: { type: [string, "null"], description: "ISO 3166-1 alpha-2 (holiday kinds). Default DE.", pattern: '^[A-Za-z-]{2,8}$' }
                subdivision: { type: [string, "null"], description: "OpenHolidays subdivision code (holiday kinds), e.g. DE-BY; omit for national.", pattern: '^[A-Za-z0-9-]{2,16}$' }
      responses:
        "201": { description: Created + populated., content: { application/json: { schema: { type: object, properties: { id: { type: string }, created: { type: integer, description: "Number of events generated." } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendars/{calendar}/regenerate:
    post:
      tags: [Calendar]
      operationId: calendarsRegenerate
      summary: Rebuild a special calendar's generated events from the current source
      parameters: [{ name: calendar, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Regenerated., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, created: { type: integer } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { description: Not a special calendar. }
        "429": { $ref: '#/components/responses/RateLimited' }

  # Tasks (VTODO). Owner-scoped; live only in a task-list calendar (component=VTODO).
  # Completing a recurring task rolls its DUE/DTSTART forward; optimistic concurrency
  # is the DAV-native etag (409). Sync over CalDAV alongside these REST endpoints.
  /calendar/todos:
    get:
      tags: [Calendar]
      operationId: calendarTodos
      summary: List tasks (optionally by calendar / status / due), owner-scoped
      parameters:
        - { name: calendar_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string }, description: "One of NEEDS-ACTION/IN-PROCESS/COMPLETED/CANCELLED, or `open` (not completed/cancelled)." }
        - { name: due_before, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: expand, in: query, required: false, schema: { type: boolean }, description: "Include next_due (next upcoming occurrence)." }
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  todos: { type: array, items: { $ref: '#/components/schemas/CalendarTodo' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Calendar]
      operationId: calendarTodosStore
      summary: Create a task
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarTodoInput' } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/todos/export:
    get:
      tags: [Calendar]
      operationId: calendarTodosExport
      summary: Export tasks (or one task list) as an .ics download
      parameters: [{ name: calendar_id, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: ICS file., content: { text/calendar: { schema: { type: string } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /calendar/todos/import:
    post:
      tags: [Calendar]
      operationId: calendarTodosImport
      summary: Import an .ics (one or many VTODOs) into a task list; dedupe by UID
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file, calendar_id], properties: { file: { type: string, format: binary }, calendar_id: { type: string } } } } } }
      responses:
        "200": { description: Import counts., content: { application/json: { schema: { $ref: '#/components/schemas/CalendarImportResult' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/todos/reorder:
    post:
      tags: [Calendar]
      operationId: calendarTodosReorder
      summary: Persist a manual task ordering (own tasks only)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [order], properties: { order: { type: array, maxItems: 5000, items: { type: string, format: uuid } } } } } } }
      responses:
        "200": { description: Saved. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/todos/{todo}:
    get:
      tags: [Calendar]
      operationId: calendarTodosShow
      summary: Full parsed task (editor shape) + etag
      parameters: [{ name: todo, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Task editor data., content: { application/json: { schema: { $ref: '#/components/schemas/CalendarTodo' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Calendar]
      operationId: calendarTodosUpdate
      summary: Update a task (409 on stale etag)
      parameters: [{ name: todo, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarTodoInput' } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, etag: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Stale etag., content: { application/json: { schema: { $ref: '#/components/schemas/EtagConflict' } } } }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Calendar]
      operationId: calendarTodosDestroy
      summary: Delete a task (logs a CalDAV tombstone)
      parameters: [{ name: todo, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/todos/{todo}/complete:
    post:
      tags: [Calendar]
      operationId: calendarTodosComplete
      summary: Complete a task (recurring → roll DUE forward; else mark COMPLETED)
      parameters: [{ name: todo, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Completed (or rolled to next occurrence).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  rolled: { type: boolean, description: "true = a recurring task advanced to its next occurrence (stays NEEDS-ACTION)." }
                  todo: { $ref: '#/components/schemas/CalendarTodo' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/todos/{todo}/uncomplete:
    post:
      tags: [Calendar]
      operationId: calendarTodosUncomplete
      summary: Re-open a task (STATUS=NEEDS-ACTION, PERCENT-COMPLETE=0, drop COMPLETED)
      parameters: [{ name: todo, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Re-opened., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, todo: { $ref: '#/components/schemas/CalendarTodo' } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Health check (app up-check) — NOT under /api/v1; served at the site root.
  # --------------------------------------------------------------------------

  /up:
    servers:
      - url: /
        description: Site root (this endpoint lives above the /api/v1 base path).
    get:
      tags: [Status]
      operationId: healthUp
      summary: Application health check (up-check)
      description: >
        Laravel's framework health endpoint at the site ROOT (`/up`, not
        `/api/v1/up`). Unauthenticated, unthrottled. Returns HTTP 200 while the
        application booted cleanly (runs the framework health checks) and a 500
        otherwise. Apps poll it to confirm the server is reachable and healthy
        before/independently of API calls. The body is a small HTML page — clients
        should treat the STATUS CODE as the signal, not the body.
      security: []
      responses:
        "200":
          description: Application is up and healthy.
          content:
            text/html:
              schema:
                type: string
        "429":
          description: Too Many Requests — a fronting reverse proxy may throttle excessive polling.
        "500":
          description: Application is unhealthy (a health check threw).

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------

  /auth/pair:
    post:
      tags: [Auth]
      operationId: authPair
      summary: Claim a pairing code (public)
      description: >
        The mobile app scans a QR code from the user's web profile and claims the
        one-time code here. Moves the pairing to pending-approval status. No bearer
        token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_name]
              properties:
                code:
                  type: string
                  description: One-time pairing code from the QR.
                device_name:
                  type: string
                  maxLength: 60
                  description: Human-readable device name shown in the web UI.
      responses:
        "200":
          description: Code claimed; waiting for owner approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
        "410":
          description: Code not found, expired, or in the wrong state (Gone).
        "422":
          description: Validation error (missing/invalid fields).
        "429":
          description: Rate limit exceeded.

  /auth/pair/collect:
    post:
      tags: [Auth]
      operationId: authCollect
      summary: Poll for pairing approval (public)
      description: >
        Poll with the same code. Returns `status: pending` until the owner approves
        the device in the web UI, then returns the Sanctum bearer token exactly once.
        No bearer token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The same one-time pairing code.
                install_id:
                  type: string
                  maxLength: 64
                  description: >
                    Optional device-local random id (NOT a secret) that lets the
                    server audit trail be correlated with the client's own
                    diagnostic log. Stored on the token; echoed in device audit meta.
                app_version:
                  type: string
                  maxLength: 32
                  description: Optional client app version reported at pairing (non-secret).
                os_version:
                  type: string
                  maxLength: 32
                  description: Optional client OS version reported at pairing (non-secret).
      responses:
        "200":
          description: Pending or approved.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [pending]
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [approved]
                      token:
                        type: string
                        description: Sanctum bearer token for subsequent API calls.
                      user:
                        $ref: "#/components/schemas/MeUser"
        "410":
          description: Code not found, expired, rejected, or already consumed (Gone).
        "429":
          description: Rate limit exceeded.

  /auth/session:
    delete:
      tags: [Auth]
      operationId: authDestroy
      summary: Revoke the current bearer token
      description: >
        Deletes the Sanctum token authenticating this request (logout / remote wipe
        acknowledgement). Throttle: none (uses general API throttle).
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Me / Device
  # --------------------------------------------------------------------------

  /search:
    get:
      tags: [Me/Device]
      operationId: globalSearch
      summary: Search across all enabled modules
      description: >
        One query across Files (content + OCR), Notes, Gallery (filename + photo OCR),
        Contacts, Mail, Calendar and Finance. Owner-scoped and module-gated
        (only modules the user has enabled are searched). Min 2 chars. Throttle 120/min.
      parameters: [ { name: q, in: query, required: true, schema: { type: string } } ]
      responses:
        "200":
          description: Grouped results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  q: { type: string }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        module: { type: string, enum: [files, notes, gallery, contacts, mail, calendar, finance] }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              title: { type: string }
                              subtitle: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/reindex:
    post:
      tags: [Me/Device]
      operationId: meReindex
      summary: Reindex the caller's own content (queued)
      description: Re-extract file text/OCR + gallery photo OCR for the current user. Queued. Throttle 6/min.
      responses:
        "200": { description: Queued., content: { application/json: { schema: { type: object, properties: { queued: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/reindex:
    post:
      tags: [Admin]
      operationId: adminReindex
      summary: Reindex ALL users' content (queued, admin)
      description: Re-extract file text/OCR + gallery photo OCR for every user. can:manage-global-settings. Queued. Throttle 3/min.
      responses:
        "200": { description: Queued., content: { application/json: { schema: { type: object, properties: { queued: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me:
    get:
      tags: [Me/Device]
      operationId: meShow
      summary: Authenticated user info
      description: >
        Returns the authenticated user's profile, a `wipe` flag that signals the
        owner has requested a remote wipe of this token, and the combined
        Files+Gallery storage usage snapshot. No throttle beyond the default API
        rate.
      responses:
        "200":
          description: User payload.
          content:
            application/json:
              schema:
                type: object
                required: [user, wipe, usage]
                properties:
                  user:
                    $ref: "#/components/schemas/MeUser"
                  wipe:
                    type: boolean
                    description: >
                      Kill switch. If true, the owner has requested a remote wipe of
                      this token — the client should erase its local data and log out.
                  usage:
                    $ref: "#/components/schemas/StorageUsage"
        "401":
          description: Unauthenticated.

  /avatar:
    get:
      tags: [Me/Device]
      operationId: avatarShow
      summary: Stream the authenticated user's avatar
      description: >
        Streams the user's stored avatar image (a non-secret profile image).
        Returns 404 if no avatar is stored. Throttle: 120 req/min.
      responses:
        "200":
          description: Avatar image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated.
        "404":
          description: No avatar stored.
        "429":
          description: Rate limit exceeded.
    post:
      tags: [Me/Device]
      operationId: avatarStore
      summary: Upload / replace the authenticated user's avatar
      description: >
        Uploads an avatar image (multipart, field `avatar`; jpeg/png/webp/gif,
        max 10 MiB). Re-encoded server-side to a square 512×512 JPEG (metadata
        stripped); the previous avatar is deleted. Non-secret profile image.
        Throttle 60/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  has_avatar: { type: boolean }
        "422": { description: Not a valid image / too large. }
        "429": { description: Rate limit exceeded. }
    delete:
      tags: [Me/Device]
      operationId: avatarDestroy
      summary: Remove the authenticated user's avatar
      description: Deletes the stored avatar. Throttle 60/min.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  has_avatar: { type: boolean }
        "429": { description: Rate limit exceeded. }

  /device/push-endpoint:
    post:
      tags: [Me/Device]
      operationId: devicePushEndpointStore
      summary: Register the per-device UnifiedPush endpoint
      description: >
        Stores an HTTPS push endpoint (a UnifiedPush/ntfy topic URL) on the calling
        device token; SendPushJob POSTs notification payloads there. Stored encrypted.
        Validated as https + a resolvable, non-link-local/metadata host (SSRF guard).
        Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri, maxLength: 2048, description: "https URL of the push endpoint." }
      responses:
        "200": { description: Registered., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { description: "Invalid or disallowed endpoint (not https / blocked host)." }
        "429": { description: Rate limit exceeded. }
    delete:
      tags: [Me/Device]
      operationId: devicePushEndpointDestroy
      summary: Clear the per-device push endpoint
      description: Removes the push endpoint from the calling device token (push disabled). Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Cleared., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { description: Rate limit exceeded. }

  /device/heartbeat:
    post:
      tags: [Me/Device]
      operationId: deviceHeartbeat
      summary: Record device sync activity
      description: >
        CLI/background clients call this to record whether they are currently syncing.
        Returns the remote-wipe flag so any heartbeat also delivers the kill switch.
        Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [idle, syncing]
                  description: Current sync state of the client.
                detail:
                  type: [string, "null"]
                  maxLength: 160
                  description: Optional human-readable detail string shown in the devices list.
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [wipe]
                properties:
                  wipe:
                    type: boolean
                    description: >
                      If true the owner has requested a remote wipe of this token.
                      The client should erase its local data and log out.
        "422":
          description: Validation error (state not in allowed enum).
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Site-icon proxy (bank logos / partner favicons for the Finance module)
  # --------------------------------------------------------------------------

  /passwords/icon:
    get:
      tags: [Company]
      operationId: passwordsIcon
      summary: Fetch favicon/BIMI for a domain
      description: >
        Returns a data URI (base64-encoded image) for the best available icon for
        the given domain (favicon → BIMI). The fetch goes through the server's SSRF
        guard; the result is returned as a data URI. The domain is not persisted.
        Throttle: 1200 req/min.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          description: Domain to look up (e.g. "github.com").
      responses:
        "200":
          description: Icon data URI or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  icon:
                    type: [string, "null"]
                    description: Data URI (e.g. "data:image/png;base64,...") or null if none found.
        "429":
          description: Rate limit exceeded.
  # --------------------------------------------------------------------------
  # Devices
  # --------------------------------------------------------------------------

  /devices:
    get:
      tags: [Devices]
      operationId: devicesIndex
      summary: List the caller's connected devices
      description: >
        Returns all Sanctum tokens (connected devices) for the authenticated user,
        most-recently-used first. Includes live sync state, last-used time, the app/OS
        build + a short install id (non-secret client correlation), and whether a
        remote wipe has been requested. No per-route throttle beyond default.
      responses:
        "200":
          description: List of connected devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Sanctum token ID.
                        current:
                          type: boolean
                          description: >
                            True for the token making this request, so a client can
                            refuse to revoke or wipe itself. Always false for
                            session-auth (web) callers.
                        name:
                          type: string
                          description: Human-readable device name.
                        meta:
                          type: string
                          description: >
                            Formatted string combining IP address and last-used time
                            (e.g. "192.168.1.1 · last used 3 hours ago").
                        ip:
                          type: [string, "null"]
                          description: Last-seen IP address of the device (non-secret; owner-only).
                        last_used_at:
                          type: [string, "null"]
                          format: date-time
                          description: ISO-8601 timestamp of the device's last API request.
                        created_at:
                          type: [string, "null"]
                          format: date-time
                          description: ISO-8601 timestamp when this device token was minted (connected).
                        expires_at:
                          type: [string, "null"]
                          format: date-time
                          description: ISO-8601 absolute expiry of the token (Sanctum lifetime), or null.
                        os_version:
                          type: [string, "null"]
                          description: Reported OS version (structured; also folded into `version`).
                        app_version:
                          type: [string, "null"]
                          description: Reported app build (structured; also folded into `version`).
                        abilities:
                          type: array
                          items: { type: string }
                          description: Sanctum abilities granted to this token (e.g. ["device"]).
                        version:
                          type: [string, "null"]
                          description: Non-secret app/OS build (e.g. "iOS 18.2 · 1.5.0"), when reported.
                        installId:
                          type: [string, "null"]
                          description: >
                            Last 6 chars of the device's non-secret install id — helps the
                            owner distinguish devices. Re-pairing the same install id
                            supersedes the previous token (device.superseded) rather than
                            stacking a duplicate row.
                        syncing:
                          type: boolean
                          description: >
                            True when the device reported syncing state within the last
                            3 minutes.
                        syncDetail:
                          type: [string, "null"]
                          description: Short detail string from the last heartbeat (syncing only).
                        syncSeen:
                          type: [string, "null"]
                          description: Human-readable time since the last heartbeat was received.
                        wipeRequested:
                          type: boolean
                          description: True when the owner has flagged this device for remote wipe.
                        pushHost:
                          type: [string, "null"]
                          description: >
                            Scheme+host of this device's registered push endpoint
                            (e.g. https://ntfy.sh), or null if none. The topic path is
                            never emitted (it is the push capability).
        "401":
          description: Unauthenticated.

  /devices/{token}/push:
    delete:
      tags: [Devices]
      operationId: devicesRevokePush
      summary: Clear a device's push endpoint
      description: >
        Removes the stored push endpoint from the given device token so the server
        stops POSTing notifications there. Owner-scoped. Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device whose push endpoint to clear.
      responses:
        "200":
          description: Push endpoint cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /devices/{token}:
    delete:
      tags: [Devices]
      operationId: devicesRevoke
      summary: Revoke a paired device
      description: >
        Deletes the Sanctum token for the given device, immediately revoking its
        access. Owner-scoped (can only revoke own tokens). Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to revoke.
      responses:
        "200":
          description: Device revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /devices/{token}/wipe:
    post:
      tags: [Devices]
      operationId: devicesWipe
      summary: Request a remote wipe for a device
      description: >
        Flags the device's Sanctum token with a wipe request. The token remains
        valid so the device can fetch the flag on its next heartbeat and self-erase.
        Owner-scoped. Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to wipe.
      responses:
        "200":
          description: Wipe flag set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Notifications
  # --------------------------------------------------------------------------

  /notifications:
    get:
      tags: [Notifications]
      operationId: notificationsIndex
      summary: List recent notifications
      description: >
        Returns up to 30 recent in-app notifications for the authenticated user,
        with an unread count. Supports ETag-based conditional requests — if the
        client sends If-None-Match matching the current ETag the server returns
        304 Not Modified with no body, skipping the row fetch entirely.
        No per-route throttle beyond default.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag value from a previous response. Returns 304 if unchanged.
      responses:
        "200":
          description: Notification list with unread count.
          headers:
            ETag:
              description: >
                Opaque change-signature derived from the newest id, total count,
                latest update time, and unread count. Send back as If-None-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [unread, items]
                properties:
                  unread:
                    type: integer
                    description: Count of unread notifications.
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, level, category, title, read, at]
                      properties:
                        id:
                          type: integer
                        level:
                          type: string
                          description: Severity level (e.g. info, warning, error).
                        category:
                          type: string
                          description: Category (non-null; defaults to "general").
                        title:
                          type: string
                        body:
                          type: [string, "null"]
                        read:
                          type: boolean
                        at:
                          type: [string, "null"]
                          format: date-time
        "304":
          description: Not Modified — ETag matched, no payload.
        "401":
          description: Unauthenticated.

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      operationId: notificationsMarkRead
      summary: Mark a single notification as read
      description: >
        Sets read_at to now for the given notification. Owner-scoped (403 if the
        notification belongs to another user). No per-route throttle.
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: integer
          description: Notification ID.
      responses:
        "200":
          description: Marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Notification does not belong to the caller.
        "404":
          description: Notification not found.

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: notificationsMarkAllRead
      summary: Mark all notifications as read
      description: >
        Sets read_at to now on all unread notifications for the authenticated
        user. Idempotent. No per-route throttle.
      responses:
        "200":
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Account (GDPR export, deletion, web-session revocation)
  # --------------------------------------------------------------------------

  /account/export:
    get:
      tags: [Account]
      operationId: accountExport
      summary: GDPR data export (streamed zip)
      description: >
        Streams a zip file containing the user's data as JSON, one file per data
        module. Coverage was completed in v1.562.0 to satisfy GDPR Art.15 — it now
        also includes calendar, mail (message rows + labels/rules/saved-searches),
        file/folder shares, and the finance payment-methods/partners/projects, on
        top of the previous account info, settings and finance data. Data only — no
        blob bytes. The zip is generated on the fly and not stored server-side.
        Throttle: 6 req/min.
      responses:
        "200":
          description: Zip archive streamed to the client.
          content:
            application/zip:
              schema:
                type: string
                format: binary
                description: >
                  ledgerline-export-{timestamp}.zip containing one JSON file per
                  data module.
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /account:
    delete:
      tags: [Account]
      operationId: accountDestroy
      summary: Permanently delete the account (GDPR erasure)
      description: >
        Permanently purges the account and all owned data (all rows deleted, all
        stored files removed). The presented bearer token is revoked after deletion.
        Requires the user's email as a confirmation
        string to prevent accidental deletion. No per-route throttle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: >
                    Must equal the authenticated user's email address exactly.
                    Returns 422 on mismatch.
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    example: true
        "422":
          description: Confirmation string does not match the user's email.
        "401":
          description: Unauthenticated.

  /account/sessions/{id}:
    delete:
      tags: [Account]
      operationId: accountSessionsRevoke
      summary: Revoke another active web session
      description: >
        Deletes the given web session row for the authenticated user. Cannot revoke
        the caller's own current session. Idempotent (missing or already-deleted
        session is a no-op). No per-route throttle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Session ID to revoke.
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  /account/sessions:
    get:
      tags: [Account]
      operationId: accountSessionsIndex
      summary: List active web sessions
      description: >
        The caller's active web (browser) sessions, newest first. Only populated when
        the server uses the database session driver (empty array otherwise). `current`
        flags the caller's own session and is never true on a token request. No secret
        values.
      responses:
        "200":
          description: Session list.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, ip, user_agent, last_active, current]
                      properties:
                        id: { type: string }
                        ip: { type: [string, "null"] }
                        user_agent: { type: [string, "null"] }
                        last_active: { type: integer, description: "Unix timestamp of last activity." }
                        current: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/webdav:
    get:
      tags: [Account]
      operationId: accountWebdavShow
      summary: WebDAV mount access status
      description: >
        Whether an app-specific WebDAV password is set, plus the mount URL and the
        username (the account email) to use. The password itself is stored hashed and
        is never returned.
      responses:
        "200":
          description: WebDAV access status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDavAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      operationId: accountWebdavUpdate
      summary: Set the WebDAV mount password
      description: >
        Sets the caller's app-specific WebDAV password (min 12 chars), stored hashed.
        Distinct from the login password; revocable. Throttle: 20 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webdav_password]
              properties:
                webdav_password: { type: string, minLength: 12, maxLength: 255 }
      responses:
        "200":
          description: Password set — returns the updated access status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDavAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Account]
      operationId: accountWebdavDestroy
      summary: Clear the WebDAV mount password
      description: "Removes the app-specific WebDAV password (disables WebDAV access). Throttle: 20 req/min."
      responses:
        "200":
          description: Password cleared — returns the updated access status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDavAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --------------------------------------------------------------------------
  # Preferences
  # --------------------------------------------------------------------------

  /locale:
    post:
      tags: [Preferences]
      operationId: localeUpdate
      summary: Update the UI language
      description: >
        Persists the chosen locale on the user's profile and (for web requests) in
        the session. The locale must be one of the values configured in
        config/locales.php. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  description: BCP 47 locale code (e.g. "en", "de"). Must be in the supported list.
      responses:
        "200":
          description: Locale updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, locale]
                properties:
                  ok:
                    type: boolean
                    example: true
                  locale:
                    type: string
                    description: The locale that was set.
        "422":
          description: Unsupported locale value.
        "401":
          description: Unauthenticated.

  /theme:
    post:
      tags: [Preferences]
      operationId: themeUpdate
      summary: Update the colour scheme preference
      description: >
        Persists the user's chosen colour scheme. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme:
                  type: string
                  enum: [light, dark, system]
                  description: Colour scheme preference.
      responses:
        "200":
          description: Theme updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, theme]
                properties:
                  ok:
                    type: boolean
                    example: true
                  theme:
                    type: string
                    enum: [light, dark, system]
        "422":
          description: Invalid theme value.
        "401":
          description: Unauthenticated.

  /preferences:
    post:
      tags: [Preferences]
      operationId: preferencesUpdate
      summary: Update global display preferences (units + clock format)
      description: >
        Persists the user's non-secret DISPLAY preferences — measurement units and
        12/24h clock. These are presentation choices only (the underlying data stays
        stored data is unchanged); the client applies them to its own rendering. Every field is
        optional; only the sent fields change. Mirrored in GET /me.preferences. No
        per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                distance:
                  type: string
                  enum: [km, mi]
                elevation:
                  type: string
                  enum: [m, ft]
                weight:
                  type: string
                  enum: [kg, lb]
                temp:
                  type: string
                  enum: [c, f]
                glucose:
                  type: string
                  enum: [mgdl, mmoll]
                time_format:
                  type: string
                  enum: [24h, 12h]
                timezone:
                  type: [string, "null"]
                  description: "IANA timezone override; empty string clears it (follow the browser)."
                date_format:
                  type: string
                  enum: [system, dmy, dmy_dot, mdy, ymd]
                mail_load_remote:
                  type: boolean
                  deprecated: true
                  description: "Deprecated and ignored: remote mail content is controlled per message."
                mail_signature:
                  type: [string, "null"]
                  maxLength: 5000
                notifications:
                  type: object
                  description: "Per-category push prefs (merged): { \"<category>\": { \"push\": bool } }."
                  additionalProperties:
                    type: object
                    properties:
                      push: { type: boolean }
      responses:
        "200":
          description: Preferences updated; returns the full preference set.
          content:
            application/json:
              schema:
                type: object
                required: [ok, preferences]
                properties:
                  ok:
                    type: boolean
                    example: true
                  preferences:
                    $ref: "#/components/schemas/DisplayPreferences"
        "422":
          description: Invalid preference value.
        "401":
          description: Unauthenticated.

  /groups:
    get:
      tags: [Groups]
      operationId: groupsIndex
      summary: List all groups (admin)
      description: >
        Returns every group with its limits, shareable flag and members. Requires the
        admin role (manage-global-settings) on top of the device token.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Groups]
      operationId: groupsStore
      summary: Create a group (admin)
      description: "Throttle: 60 req/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [finance, files, contacts, calendar, mail] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
                  description: User ids to set as members.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /groups/{group}:
    put:
      tags: [Groups]
      operationId: groupsUpdate
      summary: Update a group and sync its members (admin)
      description: "Members is the full set — an omitted/empty array clears membership. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [finance, files, contacts, calendar, mail] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Groups]
      operationId: groupsDestroy
      summary: Delete a group (admin)
      description: "Members keep their accounts; the group's limits stop applying. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/data:
    get:
      tags: [Finance]
      operationId: financeData
      summary: All finance data (invoices, partners, payment methods, projects, categories, transactions)
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Finance snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
                  partners: { type: array, items: { $ref: "#/components/schemas/FinancePartner" } }
                  paymentMethods: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } }
                  projects: { type: array, items: { $ref: "#/components/schemas/FinanceProject" } }
                  financeCategories: { type: array, items: { $ref: "#/components/schemas/FinanceCategory" } }
                  transactions: { type: array, items: { $ref: "#/components/schemas/BankTransaction" } }
                  standaloneReceipts: { type: array, items: { $ref: "#/components/schemas/FinanceReceipt" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/reports:
    get:
      tags: [Finance]
      operationId: financeReports
      summary: Server-side VAT return + revenue statistics for a year (read-only)
      description: >
        Authoritative server-computed finance analytics (the client consumes
        these instead of computing in-browser): VAT advance return, revenue
        KPIs, revenue by customer, and monthly revenue for the requested year,
        plus the current-year VAT for the dashboard and the list of years with
        realized invoices. Read-only; never mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: Analytics for the year.
          content:
            application/json:
              schema:
                type: object
                required: [year, years, currentVat, vat, kpis, customers, months, aging]
                properties:
                  year: { type: integer }
                  years: { type: array, items: { type: integer } }
                  currentVat: { $ref: "#/components/schemas/VatReturn" }
                  vat: { $ref: "#/components/schemas/VatReturn" }
                  kpis: { $ref: "#/components/schemas/FinanceKpis" }
                  customers: { type: array, items: { $ref: "#/components/schemas/RevenueByCustomer" } }
                  months:
                    type: array
                    items:
                      type: object
                      properties: { month: { type: integer }, net: { type: number } }
                  aging: { $ref: "#/components/schemas/InvoiceAging" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/account-vat:
    get:
      tags: [Finance]
      operationId: financeAccountVat
      summary: VAT summary of one payment account's transactions for a year (read-only)
      description: >
        Summarises output VAT, input VAT (Vorsteuer) and the resulting payable for a
        single payment account's transactions in a year, broken down by rate.
        Read-only; never mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer }, description: "Payment-method (account) id." }
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: Account VAT summary (output/input VAT, payable, by rate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountVatSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/vat-advance:
    get:
      tags: [Finance]
      operationId: financeVatAdvance
      summary: Unified USt-Voranmeldung — output − input VAT = payable (read-only)
      description: >
        Server-authoritative combined VAT advance return: output VAT from realized
        invoices minus input VAT (Vorsteuer) from all of the user's bank
        transactions, for a year and optional quarter, yielding a single payable
        (Zahllast). §19 Kleinunternehmer → output VAT is zero. Read-only; never
        mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
        - { name: quarter, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 4 }, description: "Optional quarter 1–4; omit for the full year." }
      responses:
        "200":
          description: The unified VAT advance return.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatAdvanceReturn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/euer:
    get:
      tags: [Finance]
      operationId: financeEuer
      summary: Simplified EÜR — income − expenses = profit (read-only)
      description: >
        Server-computed simplified Einnahmenüberschussrechnung for a year: income
        (realized invoices) minus expenses (expense bank transactions + project
        manual expenses) = profit, grouped by category. Read-only; never mutates a
        finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: The EÜR report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EuerReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/duplicates:
    get:
      tags: [Finance]
      operationId: financeDuplicates
      summary: Suspected duplicate invoices + transactions (read-only)
      description: >
        Read-only duplicate detection. Reports suspect groups only (same
        number, or same date+amount+customer for invoices; same EREF, or same
        date+amount+counterparty+purpose for transactions) — never deletes or
        merges anything. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suspect groups.
          content:
            application/json:
              schema:
                type: object
                required: [invoices, transactions]
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/DuplicateGroup" } }
                  transactions: { type: array, items: { $ref: "#/components/schemas/DuplicateGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/number-gaps:
    get:
      tags: [Finance]
      operationId: financeNumberGaps
      summary: GoBD invoice-numbering gap report (read-only)
      description: >
        Read-only report of missing invoice numbers, grouped by numbering
        regime (YYYY-NNNN resets per year; every other format is one
        continuous ordinal sequence across all years). Reports only — never
        deletes, merges, or renumbers anything; the owner decides whether a
        gap is a still-unimported historical invoice or a real numbering
        problem. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Groups with missing numbers (empty array when the numbering is gapless).
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/NumberGapGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipt-matches:
    get:
      tags: [Finance]
      operationId: financeReceiptMatches
      summary: Suggested receipt<->transaction links (read-only)
      description: >
        Read-only suggestions for linking unlinked standalone receipts to
        unlinked bank transactions, in both directions. groups: one charge
        settled by SEVERAL receipts (e.g. Amazon splitting an order into
        multiple shipment invoices that are charged together) — deterministic
        and cent-exact: receipts sharing a merchant-printed payment/order
        reference are summed first, then a single exact-amount receipt, then
        a bounded subset-sum (<=4 receipts) within a date window of the
        transaction. splitPayments: the inverse — one receipt whose total was
        actually debited as SEVERAL separate charges (e.g. one INWX invoice
        billed as one document but settled by two transactions a week apart)
        — a bounded subset-sum (<=4 transactions) within a date window of the
        receipt. Accidental re-uploads of the same document are de-duplicated
        before matching and reported separately. Never mutates a row — the
        client applies an accepted `groups` entry by PUTing
        bank_transaction_id on each listed receipt, and an accepted
        `splitPayments` entry by PUTing linked_transaction_ids on the receipt
        (both via PUT /finance/receipts/{receipt}). Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suggested groups (both directions) + de-duplicated receipts (all empty arrays when there is nothing to suggest).
          content:
            application/json:
              schema:
                type: object
                required: [groups, duplicates, splitPayments]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/ReceiptMatchGroup" } }
                  duplicates: { type: array, items: { $ref: "#/components/schemas/ReceiptDuplicate" } }
                  splitPayments: { type: array, items: { $ref: "#/components/schemas/SplitPaymentGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/category-suggestions:
    get:
      tags: [Finance]
      operationId: financeCategorySuggestions
      summary: Merchant-based category suggestions for uncategorised transactions (read-only)
      description: >
        Read-only merchant->category suggestions derived from the taught
        category on each business partner (the partner list doubles as the rule
        store). Suggests only — the client decides whether to apply; the server
        never writes a category onto a transaction. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suggestions for transactions with no category yet.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [tx_id, merchant, suggested_category]
                      properties:
                        tx_id: { type: integer }
                        merchant: { type: string }
                        suggested_category: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/trash:
    get:
      tags: [Finance]
      operationId: financeTrash
      summary: Trashed finance rows
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Trashed sets — same keys as /finance/data EXCEPT financeCategories (hard-deleted, not trashable) and standaloneReceipts (not surfaced in trash), each an array of soft-deleted rows.", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/invoices:
    post:
      tags: [Finance]
      operationId: financeInvoiceStore
      summary: Create an invoice
      description: "Create an owner-scoped invoice row. On create status/type/currency default (draft/invoice/EUR); self-issued invoices are numbered server-side later via /finalize. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceInput" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}:
    put:
      tags: [Finance]
      operationId: financeInvoiceUpdate
      summary: Update an invoice (optimistic concurrency)
      description: "Per-row update; send `version` for optimistic concurrency (409 on mismatch). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceInput" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422":
          description: >
            Standard Laravel validation body ({ message, errors }) OR a GoBD business
            rejection — a numbered invoice cannot revert to draft ({ error: status_draft_blocked }),
            or a paid invoice cannot revert to an earlier status ({ error: status_paid_locked };
            paid is terminal, a correction goes through /storno instead).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - allOf:
                      - $ref: "#/components/schemas/FinanceError"
                      - properties: { error: { enum: [status_draft_blocked, status_paid_locked] } }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeInvoiceDestroy
      summary: Soft-delete an invoice
      description: "Move the invoice to trash (soft delete). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{id}/restore:
    post:
      tags: [Finance]
      operationId: financeInvoiceRestore
      summary: Restore a trashed invoice
      description: "Restore a soft-deleted invoice (404 if no trashed invoice with that id is owned by the caller). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Restored., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Cannot restore — the invoice number is now used by a live invoice ({ error: number_conflict })."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - properties: { error: { enum: [number_conflict] } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeInvoiceForce
      summary: Permanently delete a trashed invoice
      description: "Permanently delete a trashed invoice and its stored PDF blobs. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/finalize:
    post:
      tags: [Finance]
      operationId: financeInvoiceFinalize
      summary: Assign the GoBD invoice number (atomic, per-year, idempotent)
      description: "Server-authoritative GoBD numbering: locks the year's numbered rows, takes max(seq)+1 (never below the configured floor), writes it atomically. Idempotent — an already-numbered invoice is returned unchanged. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Numbered invoice., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Numbering race could not be resolved after retries — retriable. Body { error: number_conflict } (NOT a version conflict)."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - properties: { error: { enum: [number_conflict] } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/email:
    post:
      tags: [Finance]
      operationId: financeInvoiceEmail
      summary: Email a finalized invoice's stored PDF to the customer
      description: >
        Sends the invoice's stored PDF (pdf_path) to the customer over the user's OWN
        company SMTP (settings.company company_smtp_*), deliberately independent of
        the workspace notification SMTP. Only finalized invoices (status sent|paid or
        already numbered) may be sent. Stamps sent_at without bumping the optimistic
        version. Throttled 10/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email, description: "Recipient email; falls back to the customer snapshot email." }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sent_at]
                properties:
                  ok: { type: boolean }
                  sent_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Business rejection with a machine-readable `error` code (one of
            not_finalized, no_pdf, no_recipient, no_smtp) — OR, for an invalid `to`
            address, the standard Laravel validation body { message, errors }.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - $ref: "#/components/schemas/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/storno:
    post:
      tags: [Finance]
      operationId: financeInvoiceStorno
      summary: Cancel a finalized invoice with a credit note (Storno / Gutschrift)
      description: >
        Creates a NEW invoice with type=credit_note, cancels_invoice_id set to the
        original, the same customer/partner, the original lines with NEGATED
        amounts and the same discount terms — so it exactly reverses the original's
        net/VAT/gross. The credit note runs the same GoBD numbering path (its own
        number). The original invoice is never edited or deleted (its cancelled
        state is derived). Only a finalized (sent|paid or numbered), non-credit-note,
        not-already-cancelled invoice can be cancelled. Throttled 30/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      responses:
        "201":
          description: The created credit note.
          content:
            application/json:
              schema:
                type: object
                required: [invoice]
                properties:
                  invoice: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Cannot cancel — `error` is one of not_finalized, already_cancelled, already_credit_note."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - properties: { error: { enum: [not_finalized, already_cancelled, already_credit_note] } }
        "409":
          description: "Credit-note numbering race could not be resolved — retriable. Body { error: number_conflict }."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - properties: { error: { enum: [number_conflict] } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/dun:
    post:
      tags: [Finance]
      operationId: financeInvoiceDun
      summary: Send the customer a payment reminder (Mahnung) for an overdue invoice
      description: >
        Sends a dunning email (with the stored PDF attached) to the customer over
        the user's OWN company SMTP. Only overdue invoices (status=sent AND
        due_date < today) with a recipient + PDF may be dunned. Increments the
        dunning level (reminder_count) and stamps reminded_at (does not bump the
        optimistic version). Distinct from the owner-facing invoices:remind command.
        Throttled 10/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email, description: "Recipient email; falls back to the customer snapshot email." }
      responses:
        "200":
          description: Reminder sent.
          content:
            application/json:
              schema:
                type: object
                required: [ok, level, reminded_at]
                properties:
                  ok: { type: boolean }
                  level: { type: integer, description: "The new dunning level (Mahnstufe)." }
                  reminded_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Business rejection with a machine-readable `error` code (one of
            not_overdue, no_pdf, no_recipient, no_smtp) — OR, for an invalid `to`
            address, the standard Laravel validation body { message, errors }.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - $ref: "#/components/schemas/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/pdf:
    post:
      tags: [Finance]
      operationId: financeInvoicePdfUpload
      summary: Attach/replace the invoice PDF (multipart)
      description: >
        Upload a PDF blob (max files.max_upload_mb). Without `version_seq` it becomes
        the invoice's current pdf_path. With `version_seq` it is attached to that
        versions[] entry's own PDF (GoBD per-version correction trail) and pdf_path is
        left untouched; if no such version exists the upload is discarded and the
        invoice is returned unchanged. Throttle 1200/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "PDF blob (max files.max_upload_mb)." }
                version_seq: { type: integer, minimum: 1, description: "Attach to this versions[].seq entry instead of the main pdf_path." }
      responses:
        "200": { description: Updated invoice., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [Finance]
      operationId: financeInvoicePdf
      summary: Stream the invoice PDF
      description: >
        Streams the invoice's PDF inline (sandboxed). With `version_seq` it streams
        that GoBD version's own stored PDF instead of the current one (404 if that
        version has no PDF). Throttle 3000/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: integer } }
        - { name: version_seq, in: query, required: false, schema: { type: integer, minimum: 1 }, description: "Stream this versions[].seq entry's own PDF instead of the current invoice PDF." }
        - { name: download, in: query, required: false, schema: { type: boolean }, description: "true → Content-Disposition: attachment; default inline." }
      responses:
        "200": { description: PDF bytes., content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners:
    post:
      tags: [Finance]
      operationId: financePartnerStore
      summary: Create a business partner
      description: "`name` is required. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerInput" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, required: [partner], properties: { partner: { $ref: "#/components/schemas/FinancePartner" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners/{partner}:
    put:
      tags: [Finance]
      operationId: financePartnerUpdate
      summary: Update a partner (optimistic concurrency)
      description: "Send `version` for optimistic concurrency (409 on mismatch). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: partner, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerInput" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, required: [partner], properties: { partner: { $ref: "#/components/schemas/FinancePartner" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financePartnerDestroy
      summary: Soft-delete a partner
      description: "Move the partner to trash. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: partner, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners/{id}/restore:
    post:
      tags: [Finance]
      operationId: financePartnerRestore
      summary: Restore a partner
      description: "Restore a soft-deleted partner. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Restored., content: { application/json: { schema: { type: object, required: [partner], properties: { partner: { $ref: "#/components/schemas/FinancePartner" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners/{id}/force:
    delete:
      tags: [Finance]
      operationId: financePartnerForce
      summary: Permanently delete a partner
      description: "Permanently delete a trashed partner. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/payment-methods:
    post:
      tags: [Finance]
      operationId: financePaymentStore
      summary: Create a payment method
      description: "`type` + `name` are required. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
