        template, accent/heading colours). Non-secret — served in the clear. `has_logo`
        indicates whether a company logo is stored (fetch it at /company/logo).
      responses:
        "200":
          description: The company profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: "#/components/schemas/CompanyProfile" }
        "401": { description: Unauthenticated. }
    put:
      tags: [Company]
      operationId: companyUpdate
      summary: Update the caller's company profile
      description: >
        Update any subset of the company/invoice fields. Send JSON, or multipart to
        also set a raster `logo` (png/jpg/gif/webp, ≤2 MB; inline SVG is rejected as a
        stored-XSS vector) or `remove_logo=true`. Throttle 60/min.
      requestBody:
