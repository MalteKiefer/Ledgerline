      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { parent_id: { type: integer, nullable: true } } } } } }
      responses:
        "200": { description: Moved., content: { application/json: { schema: { type: object, properties: { folder: { $ref: "#/components/schemas/FileFolder" } } } } } }
