    get: { tags: [Files], operationId: sharedWithMeIndex, summary: List folders shared with me, security: [ { bearerAuth: [] } ], responses: { "200": { description: Grants., content: { application/json: { schema: { type: object, required: [shares], properties: { shares: { type: array, items: { type: object, properties: { id: { type: integer }, folder_name: { type: string }, role: { type: string, enum: [viewer, editor] }, owner: { type: object, properties: { id: { type: integer }, name: { type: [string, "null"] }, email: { type: [string, "null"] } } } } } } } } } } }, "401": { description: Unauthenticated. } } }
  /shared-with-me/{share}:
    get: { tags: [Files], operationId: sharedWithMeBrowse, summary: Browse the shared folder subtree, description: "Folders + files in the shared folder's whole subtree, owner-scoped. Non-member → 404.", security: [ { bearerAuth: [] } ], parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ], responses: { "200": { description: Subtree., content: { application/json: { schema: { type: object, required: [share_id, role, root_id, folders, files], properties: { share_id: { type: integer }, role: { type: string, enum: [viewer, editor, owner] }, root_id: { type: integer }, folders: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, parent_id: { type: [integer, "null"] } } } }, files: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, mime: { type: [string, "null"] }, size: { type: integer }, file_folder_id: { type: [integer, "null"] }, updated_at: { type: [string, "null"], format: date-time } } } } } } } } }, "401": { description: Unauthenticated. }, "404": { description: Not a member / share gone. } } }
  /shared-with-me/{share}/files/{file}/raw:
    get: { tags: [Files], operationId: sharedWithMeRaw, summary: Stream a shared file's bytes, description: "Throttle 3000/min. Viewer + editor. Sandboxed, nosniff. ?download=1 forces attachment; outside the subtree → 404.", security: [ { bearerAuth: [] } ], parameters: [ { name: share, in: path, required: true, schema: { type: integer } }, { name: file, in: path, required: true, schema: { type: integer } }, { name: download, in: query, required: false, schema: { type: boolean } } ], responses: { "200": { description: File bytes., content: { application/octet-stream: { schema: { type: string, format: binary } } } }, "401": { description: Unauthenticated. }, "404": { description: Not found / outside the subtree. } } }
  /shared-with-me/{share}/upload:
    post: { tags: [Files], operationId: sharedWithMeUpload, summary: Upload a file into the shared subtree (editor), description: "Throttle 1200/min. Editor only (403 for a viewer). The file is owned by the SHARE OWNER; quota hits the owner (413 when exceeded).", security: [ { bearerAuth: [] } ], parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ], requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, file_folder_id: { type: [integer, "null"] }, name: { type: [string, "null"] } } } } } }, responses: { "201": { description: Uploaded., content: { application/json: { schema: { type: object, properties: { file: { type: object, additionalProperties: true } } } } } }, "401": { description: Unauthenticated. }, "403": { description: Not an editor. }, "404": { description: Target folder outside the subtree. }, "413": { description: "Owner quota exceeded.", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } } } }
  /shared-with-me/{share}/files/{file}:
    put: { tags: [Files], operationId: sharedWithMeRename, summary: Rename a shared file (editor), description: "Throttle 600/min. Editor only.", security: [ { bearerAuth: [] } ], parameters: [ { name: share, in: path, required: true, schema: { type: integer } }, { name: file, in: path, required: true, schema: { type: integer } } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 500 } } } } } }, responses: { "200": { description: Renamed., content: { application/json: { schema: { type: object, properties: { file: { type: object, additionalProperties: true } } } } } }, "401": { description: Unauthenticated. }, "403": { description: Not an editor. }, "404": { description: Not found / outside the subtree. } } }
    delete: { tags: [Files], operationId: sharedWithMeDestroy, summary: Delete a shared file (editor), description: "Throttle 600/min. Editor only; soft-delete.", security: [ { bearerAuth: [] } ], parameters: [ { name: share, in: path, required: true, schema: { type: integer } }, { name: file, in: path, required: true, schema: { type: integer } } ], responses: { "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }, "401": { description: Unauthenticated. }, "403": { description: Not an editor. }, "404": { description: Not found / outside the subtree. } } }

  # --------------------------------------------------------------------------
  # Gallery
  # --------------------------------------------------------------------------

  /gallery/reverse:
    get:
      tags: [Gallery]
      operationId: galleryReverse
      summary: Reverse-geocode coordinates to a place name
      description: >
        Looks up a human-readable place name for the given latitude/longitude. The
        query passes through the server only (client CSP forbids third-party calls)
        and is not persisted. Throttle: 60 req/min.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Latitude in decimal degrees.
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Longitude in decimal degrees.
      responses:
        "200":
          description: Reverse-geocoded place.
          content:
            application/json:
              schema:
                type: object
                properties:
                  place:
                    type: [string, "null"]
                  address:
                    type: object
                    description: >
                      Structured address components (key→value strings). ALWAYS a JSON
                      object — empty ({}) when nothing resolved, never a [] array.
                    additionalProperties: { type: string }
        "422":
          description: Coordinates out of range.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Explore (plaintext-relational GPS tracks + couplings + settings)
  # --------------------------------------------------------------------------

  /explore/data:
    get:
      tags: [Explore]
      operationId: exploreData
      summary: Read tracks, couplings and settings
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Explore snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [tracks, couplings, settings]
                properties:
                  tracks: { type: array, items: { $ref: "#/components/schemas/ExploreTrack" } }
                  couplings: { type: array, items: { $ref: "#/components/schemas/ExploreCoupling" } }
                  settings: { $ref: "#/components/schemas/ExploreSettings" }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
  /explore/trash:
    get:
      tags: [Explore]
      operationId: exploreTrash
      summary: List soft-deleted tracks
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Trashed tracks.
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                properties:
                  tracks: { type: array, items: { $ref: "#/components/schemas/ExploreTrack" } }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
  /explore/tracks:
    post:
      tags: [Explore]
      operationId: exploreTrackStore
      summary: Create a track
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source_format, points, stats]
              properties:
                name: { type: string }
                source_format: { type: string, enum: [recorded, imported, planned] }
                points:
                  type: array
                  items:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      ele: { type: [number, "null"] }
                      t: { type: [number, "null"] }
                stats: { type: object }
                note: { type: [string, "null"] }
                imported_at: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Track created.
          content: { application/json: { schema: { type: object, properties: { track: { $ref: "#/components/schemas/ExploreTrack" } } } } }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
        "422": { description: Validation failed. }
  /explore/tracks/{track}:
    put:
      tags: [Explore]
      operationId: exploreTrackUpdate
      summary: Edit a track (optimistic concurrency)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: track, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name: { type: string }
                source_format: { type: string, enum: [recorded, imported, planned] }
                points:
                  type: array
                  items:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      ele: { type: [number, "null"] }
                      t: { type: [number, "null"] }
                stats: { type: object }
                note: { type: [string, "null"] }
                imported_at: { type: [string, "null"], format: date-time }
                version: { type: integer }
      responses:
        "200":
          description: Updated track.
          content: { application/json: { schema: { type: object, properties: { track: { $ref: "#/components/schemas/ExploreTrack" } } } } }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
        "404": { description: Not found. }
        "409":
          description: Version conflict.
          content: { application/json: { schema: { type: object, properties: { error: { type: string, example: version_conflict }, version: { type: integer } } } } }
    delete:
      tags: [Explore]
      operationId: exploreTrackDestroy
      summary: Soft-delete a track (move to trash)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: track, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Trashed., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /explore/tracks/{track}/restore:
    post:
      tags: [Explore]
      operationId: exploreTrackRestore
      summary: Restore a soft-deleted track
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: track, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Restored track., content: { application/json: { schema: { type: object, properties: { track: { $ref: "#/components/schemas/ExploreTrack" } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /explore/tracks/{track}/force:
    delete:
      tags: [Explore]
      operationId: exploreTrackForceDestroy
      summary: Permanently delete a track
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: track, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Permanently deleted., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /explore/tracks/{track}/file:
    post:
      tags: [Explore]
      operationId: exploreTrackFileUpload
      summary: Attach the raw track file (gpx/kml/kmz/tcx/fit)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: track, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Raw track file (gpx/kml/kmz/tcx/fit). }
      responses:
        "200": { description: Stored track file., content: { application/json: { schema: { type: object, properties: { track: { $ref: "#/components/schemas/ExploreTrack" } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
        "422": { description: Validation failed. }
    get:
      tags: [Explore]
      operationId: exploreTrackFileDownload
      summary: Download the raw track file
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: track, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Raw track file bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Unauthenticated. }
        "404": { description: Not found or no file attached. }
  /explore/couplings:
    post:
      tags: [Explore]
      operationId: exploreCouplingStore
      summary: Couple a photo to a track (upsert by photo)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo_id, explore_track_id]
              properties:
                photo_id: { type: string }
                explore_track_id: { type: integer }
                lat: { type: [number, "null"] }
                lng: { type: [number, "null"] }
                source: { type: [string, "null"] }
      responses:
        "200": { description: Coupling stored., content: { application/json: { schema: { type: object, properties: { coupling: { $ref: "#/components/schemas/ExploreCoupling" } } } } } }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
        "422": { description: Validation failed. }
    delete:
      tags: [Explore]
      operationId: exploreCouplingDestroy
      summary: Remove a photo coupling
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo_id]
              properties:
                photo_id: { type: string }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found. }
  /explore/settings:
    put:
      tags: [Explore]
      operationId: exploreSettingsSave
      summary: Update coupling tolerances
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coupling_time_tolerance_s, coupling_distance_tolerance_m]
              properties:
                coupling_time_tolerance_s: { type: integer }
                coupling_distance_tolerance_m: { type: integer }
      responses:
        "200": { description: Saved settings., content: { application/json: { schema: { type: object, properties: { settings: { $ref: "#/components/schemas/ExploreSettings" } } } } } }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
        "422": { description: Validation failed. }

  # --------------------------------------------------------------------------
  # Maps (Explore tour-planner auto-routing)
  # --------------------------------------------------------------------------

  /maps/route:
    get:
      tags: [Maps]
      operationId: mapsRoute
      summary: Snap tour waypoints to a real path/road route
      description: >
        Snaps an ordered list of clicked waypoints onto real paths/roads via a
        routing upstream and returns the snapped geometry plus total
        distance/duration. Engine-dependent (server config maps.route_engine):
        the default OSRM engine fills geometry/distanceM/durationS and leaves
        elevation/ascentM/descentM/surfaces null; a self-hosted GraphHopper engine
        additionally returns the elevation profile, ascent/descent and an OSM
        surface breakdown. User-initiated, opt-in egress (same class as
        /gallery/geocode); the client CSP forbids third-party calls so this goes
        through the server. The upstream host comes from server config, never from
        request input. Coordinates are never logged or persisted. When the
        upstream is unset/unreachable or no route exists, a clean 200 with
        geometry:null (and all other fields null) is returned so the client falls
        back to straight lines. Throttle: 180 req/min.
      parameters:
        - name: points
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
          description: >
            Ordered waypoints as "lat,lng;lat,lng;…" (2..100 points, each within
            coordinate range).
      responses:
        "200":
          description: Snapped route, or geometry:null when routing is unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  geometry:
                    type: [array, "null"]
                    description: Ordered [lat, lng] pairs of the snapped route; null on fallback.
                    items:
                      type: array
                      items:
                        type: number
                      minItems: 2
                      maxItems: 2
                  distanceM:
                    type: [number, "null"]
                    description: Total route distance in metres; null on fallback.
                  durationS:
                    type: [number, "null"]
                    description: Estimated route duration in seconds; null on fallback.
                  elevation:
                    type: [array, "null"]
                    description: >
                      Elevation profile: cumulative distance (metres) vs elevation
                      (metres above sea level), downsampled to ~256 points. Populated
                      only by the GraphHopper engine; null for OSRM/fallback.
                    items:
                      type: object
                      properties:
                        distM:
                          type: number
                          description: Cumulative distance along the route in metres.
                        eleM:
                          type: number
                          description: Elevation in metres above sea level.
                  ascentM:
                    type: [number, "null"]
                    description: >
                      Total climb in metres (GraphHopper only); null for OSRM/fallback.
                  descentM:
                    type: [number, "null"]
                    description: >
                      Total descent in metres (GraphHopper only); null for OSRM/fallback.
                  surfaces:
                    type: [array, "null"]
                    description: >
                      OSM surface breakdown — distance per surface value, sorted
                      descending by distance (GraphHopper only); null for OSRM/fallback.
                    items:
                      type: object
                      properties:
                        surface:
                          type: string
                          description: OSM surface tag value (e.g. asphalt, gravel, ground).
                        distM:
                          type: number
                          description: Total distance on this surface in metres.
        "422":
          description: Missing/invalid points, or not between 2 and 25 waypoints.
        "429":
          description: Rate limit exceeded.

  /maps/resolve:
    get:
      tags: [Maps]
      operationId: mapsResolve
      summary: Resolve a Google-Maps short link to coordinates
      description: >
        Resolves a Google-Maps short link (maps.app.goo.gl / goo.gl / g.co) to
        the { lat, lng } it points at, for the Explore search box. Follows the
        redirect chain (max 6 hops) and extracts the coordinates from the final
        URL or page body. User-initiated, opt-in egress (same class as
        /gallery/geocode): the short link is the only thing sent outbound, and
        only to Google hosts (allow-list re-checked on every hop); a redirect off
        Google is refused. Every hop is SSRF-guarded (link-local/metadata refused,
        IP pinned against DNS-rebinding, redirects walked manually). The link and
        resolved coordinates are never logged or persisted. On any failure
        (non-Google host, no coordinates, unreachable) a clean 200 with
        lat:null,lng:null is returned. Throttle 30 req/min.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
          description: The Google-Maps short link to resolve.
      responses:
        "200":
          description: Coordinates, or lat:null,lng:null when the link cannot be resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lat:
                    type: [number, "null"]
                    description: Latitude, or null when unresolved.
                  lng:
                    type: [number, "null"]
                    description: Longitude, or null when unresolved.
        "422":
          description: Missing or invalid url.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Site-icon proxy (favicon/BIMI — used by Finance for bank logos / partner favicons)
  # --------------------------------------------------------------------------

  /passwords/icon:
    get:
      tags: [Company]
      operationId: passwordsIcon
      summary: Fetch favicon/BIMI for a domain
      description: >
        Returns a data URI (base64-encoded image) for the best available icon for
        the given domain (favicon → BIMI). The fetch goes through the server's SSRF
        guard; the result is returned as a data URI. The domain is not persisted.
        Throttle: 1200 req/min.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          description: Domain to look up (e.g. "github.com").
      responses:
        "200":
          description: Icon data URI or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  icon:
                    type: [string, "null"]
                    description: Data URI (e.g. "data:image/png;base64,...") or null if none found.
        "429":
          description: Rate limit exceeded.
  # --------------------------------------------------------------------------
  # Devices
  # --------------------------------------------------------------------------

  /devices:
    get:
      tags: [Devices]
      operationId: devicesIndex
      summary: List the caller's connected devices
      description: >
        Returns all Sanctum tokens (connected devices) for the authenticated user,
        most-recently-used first. Includes live sync state, last-used time, the app/OS
        build + a short install id (non-secret client correlation), and whether a
        remote wipe has been requested. No per-route throttle beyond default.
      responses:
        "200":
          description: List of connected devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Sanctum token ID.
                        current:
                          type: boolean
                          description: >
                            True for the token making this request, so a client can
                            refuse to revoke or wipe itself. Always false for
                            session-auth (web) callers.
                        name:
                          type: string
                          description: Human-readable device name.
                        meta:
                          type: string
                          description: >
                            Formatted string combining IP address and last-used time
                            (e.g. "192.168.1.1 · last used 3 hours ago").
                        version:
                          type: [string, "null"]
                          description: Non-secret app/OS build (e.g. "iOS 18.2 · 1.5.0"), when reported.
                        installId:
                          type: [string, "null"]
                          description: >
                            Last 6 chars of the device's non-secret install id — helps the
                            owner distinguish devices. Re-pairing the same install id
                            supersedes the previous token (device.superseded) rather than
                            stacking a duplicate row.
                        syncing:
                          type: boolean
                          description: >
                            True when the device reported syncing state within the last
                            3 minutes.
                        syncDetail:
                          type: [string, "null"]
                          description: Short detail string from the last heartbeat (syncing only).
                        syncSeen:
                          type: [string, "null"]
                          description: Human-readable time since the last heartbeat was received.
                        wipeRequested:
                          type: boolean
                          description: True when the owner has flagged this device for remote wipe.
        "401":
          description: Unauthenticated.

  /devices/{token}:
    delete:
      tags: [Devices]
      operationId: devicesRevoke
      summary: Revoke a paired device
      description: >
        Deletes the Sanctum token for the given device, immediately revoking its
        access. Owner-scoped (can only revoke own tokens). Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to revoke.
      responses:
        "200":
          description: Device revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /devices/{token}/wipe:
    post:
      tags: [Devices]
      operationId: devicesWipe
      summary: Request a remote wipe for a device
      description: >
        Flags the device's Sanctum token with a wipe request. The token remains
        valid so the device can fetch the flag on its next heartbeat and self-erase.
        Owner-scoped. Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to wipe.
      responses:
        "200":
          description: Wipe flag set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Notifications
  # --------------------------------------------------------------------------

  /notifications:
    get:
      tags: [Notifications]
      operationId: notificationsIndex
      summary: List recent notifications
      description: >
        Returns up to 30 recent in-app notifications for the authenticated user,
        with an unread count. Supports ETag-based conditional requests — if the
        client sends If-None-Match matching the current ETag the server returns
        304 Not Modified with no body, skipping the row fetch entirely.
        No per-route throttle beyond default.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag value from a previous response. Returns 304 if unchanged.
      responses:
        "200":
          description: Notification list with unread count.
          headers:
            ETag:
              description: >
                Opaque change-signature derived from the newest id, total count,
                latest update time, and unread count. Send back as If-None-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [unread, items]
                properties:
                  unread:
                    type: integer
                    description: Count of unread notifications.
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, level, category, title, read, at]
                      properties:
                        id:
                          type: integer
                        level:
                          type: string
                          description: Severity level (e.g. info, warning, error).
                        category:
                          type: string
                          description: Category (non-null; defaults to "general").
                        title:
                          type: string
                        body:
                          type: [string, "null"]
                        read:
                          type: boolean
                        at:
                          type: [string, "null"]
                          format: date-time
        "304":
          description: Not Modified — ETag matched, no payload.
        "401":
          description: Unauthenticated.

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      operationId: notificationsMarkRead
      summary: Mark a single notification as read
      description: >
        Sets read_at to now for the given notification. Owner-scoped (403 if the
        notification belongs to another user). No per-route throttle.
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: integer
          description: Notification ID.
      responses:
        "200":
          description: Marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Notification does not belong to the caller.
        "404":
          description: Notification not found.

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: notificationsMarkAllRead
      summary: Mark all notifications as read
      description: >
        Sets read_at to now on all unread notifications for the authenticated
        user. Idempotent. No per-route throttle.
      responses:
        "200":
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Gallery (additional: geocode + share management)
  # --------------------------------------------------------------------------

  /gallery/geocode:
    get:
      tags: [Gallery]
      operationId: galleryGeocode
      summary: Forward-geocode a place query to coordinates
      description: >
        Looks up candidate coordinates for a free-text place query using Nominatim.
        The query passes through the server only (client CSP forbids third-party
        calls) and is not persisted. Returns up to 6 results. Throttle: 60 req/min.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 256
          description: Free-text place query (e.g. "Berlin, Germany").
      responses:
        "200":
          description: Geocoding results.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        display:
                          type: string
                          description: Human-readable place name.
                        lat:
                          type: number
                          description: Latitude in decimal degrees.
                        lng:
                          type: number
                          description: Longitude in decimal degrees.
        "422":
          description: Missing or invalid query parameter.
        "429":
          description: Rate limit exceeded.

  /account/export:
    get:
      tags: [Account]
      operationId: accountExport
      summary: GDPR data export (streamed zip)
      description: >
        Streams a zip file containing the user's data as JSON files (one per module:
        notes, todos, bookmarks, invoices, account info, etc.). Data only — no
        blob bytes. The zip is generated on the fly and not stored server-side.
        Throttle: 6 req/min.
      responses:
        "200":
          description: Zip archive streamed to the client.
          content:
            application/zip:
              schema:
                type: string
                format: binary
                description: >
                  ledgerline-export-{timestamp}.zip containing one JSON file per
                  data module.
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /account:
    delete:
      tags: [Account]
      operationId: accountDestroy
      summary: Permanently delete the account (GDPR erasure)
      description: >
        Permanently purges the account and all owned data (crypto-shred: vault key
        is discarded, all blobs deleted, all records deleted). The presented bearer
        token is revoked after deletion. Requires the user's email as a confirmation
        string to prevent accidental deletion. No per-route throttle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: >
                    Must equal the authenticated user's email address exactly.
                    Returns 422 on mismatch.
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    example: true
        "422":
          description: Confirmation string does not match the user's email.
        "401":
          description: Unauthenticated.

  /account/sessions/{id}:
    delete:
      tags: [Account]
      operationId: accountSessionsRevoke
      summary: Revoke another active web session
      description: >
        Deletes the given web session row for the authenticated user. Cannot revoke
        the caller's own current session. Idempotent (missing or already-deleted
        session is a no-op). No per-route throttle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Session ID to revoke.
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Preferences
  # --------------------------------------------------------------------------

  /locale:
    post:
      tags: [Preferences]
      operationId: localeUpdate
      summary: Update the UI language
      description: >
        Persists the chosen locale on the user's profile and (for web requests) in
        the session. The locale must be one of the values configured in
        config/locales.php. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  description: BCP 47 locale code (e.g. "en", "de"). Must be in the supported list.
      responses:
        "200":
          description: Locale updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, locale]
                properties:
                  ok:
                    type: boolean
                    example: true
                  locale:
                    type: string
                    description: The locale that was set.
        "422":
          description: Unsupported locale value.
        "401":
          description: Unauthenticated.

  /theme:
    post:
      tags: [Preferences]
      operationId: themeUpdate
      summary: Update the colour scheme preference
      description: >
        Persists the user's chosen colour scheme. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme:
                  type: string
                  enum: [light, dark, system]
                  description: Colour scheme preference.
      responses:
        "200":
          description: Theme updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, theme]
                properties:
                  ok:
                    type: boolean
                    example: true
                  theme:
                    type: string
                    enum: [light, dark, system]
        "422":
          description: Invalid theme value.
        "401":
          description: Unauthenticated.

  /preferences:
    post:
      tags: [Preferences]
      operationId: preferencesUpdate
      summary: Update global display preferences (units + clock format)
      description: >
        Persists the user's non-secret DISPLAY preferences — measurement units and
        12/24h clock. These are presentation choices only (the underlying data stays
        zero-knowledge); the client applies them to its own rendering. Every field is
        optional; only the sent fields change. Mirrored in GET /me.preferences. No
        per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                distance:
                  type: string
                  enum: [km, mi]
                elevation:
                  type: string
                  enum: [m, ft]
                weight:
                  type: string
                  enum: [kg, lb]
                temp:
                  type: string
                  enum: [c, f]
                glucose:
                  type: string
                  enum: [mgdl, mmoll]
                time_format:
                  type: string
                  enum: [24h, 12h]
      responses:
        "200":
          description: Preferences updated; returns the full preference set.
          content:
            application/json:
              schema:
                type: object
                required: [ok, preferences]
                properties:
                  ok:
                    type: boolean
                    example: true
                  preferences:
                    $ref: "#/components/schemas/DisplayPreferences"
        "422":
          description: Invalid preference value.
        "401":
          description: Unauthenticated.

  /groups:
    get:
      tags: [Groups]
      operationId: groupsIndex
      summary: List all groups (admin)
      description: >
        Returns every group with its limits, shareable flag and members. Requires the
        admin role (manage-global-settings) on top of the device token.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "403":
          description: Not an admin.
    post:
      tags: [Groups]
      operationId: groupsStore
      summary: Create a group (admin)
      description: "Throttle: 60 req/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                files_quota_mb: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "MB; omit / 0 / null = no group cap." }
                gallery_quota_mb: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "MB; omit / 0 / null = no group cap." }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [dashboard, files, gallery, notes, todos, bookmarks, finance, health, explore] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
                  description: User ids to set as members.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "403":
          description: Not an admin.
        "422":
          description: Validation error (e.g. duplicate name).

  /groups/{group}:
    put:
      tags: [Groups]
      operationId: groupsUpdate
      summary: Update a group and sync its members (admin)
      description: "Members is the full set — an omitted/empty array clears membership. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                files_quota_mb: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "MB; omit / 0 / null = no group cap." }
                gallery_quota_mb: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "MB; omit / 0 / null = no group cap." }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [dashboard, files, gallery, notes, todos, bookmarks, finance, health, explore] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "403":
          description: Not an admin.
        "422":
          description: Validation error.
    delete:
      tags: [Groups]
      operationId: groupsDestroy
      summary: Delete a group (admin)
      description: "Members keep their accounts; the group's limits stop applying. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted.
        "403":
          description: Not an admin.

  /finance/data:
