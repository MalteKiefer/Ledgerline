        "422": { $ref: "#/components/responses/FinanceV2InvoiceUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeV2InvoicesDestroy
      summary: Delete a draft-only invoice using optimistic version CAS
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
