                    version: { type: integer, description: "Expected current version for optimistic concurrency." }
      responses:
        "200":
          description: Bookmark updated.
          content:
            application/json:
              schema:
                type: object
                required: [bookmark]
                properties:
                  bookmark: { $ref: "#/components/schemas/BookmarkRecord" }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
        "404": { description: Not found or not owned by caller. }
        "409":
          description: Version conflict — re-read and retry with a fresh version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordVersionConflict" }
        "422":
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
    delete:
      tags: [Bookmarks]
      operationId: bookmarksDestroy
