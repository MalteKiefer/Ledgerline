      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 0 }, source_revision_id: { type: [integer, "null"], minimum: 1 } } } } } }
      responses:
        "201": { description: "Duplicate draft created.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Quote' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version, idempotency, or workflow conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2QuoteConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2QuoteUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance-v2/quotes/{quote}/conversions/invoice:
