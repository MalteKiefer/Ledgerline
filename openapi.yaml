        "403": { description: Module disabled for this account. }
    put:
      tags: [Store]
      operationId: notesStoreSave
      summary: Write the sealed sharded notes root
      description: >
        Optimistic concurrency (409 on stale version) + shard-reference integrity
        guard: send the full shard-ref list; the server rejects (422 missing_shard)
        a root pointing at a shard blob with no ledger row. Throttle 120/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciphertext, version]
