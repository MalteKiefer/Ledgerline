      summary: Send an invoice PDF by e-mail through the user's own invoice SMTP
      description: >
        Sends the invoice PDF as an e-mail attachment via the per-user dedicated
        invoice SMTP server (configured on the web Company settings; separate from
        the workspace notification SMTP). The PDF is generated CLIENT-side and posted
        transiently — the server stores nothing and logs no content (a deliberate,
