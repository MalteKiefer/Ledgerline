      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, expected_revision_id], properties: { version: { type: integer, minimum: 0 }, expected_revision_id: { type: integer, minimum: 1 } } } } } }
      responses:
        "200": { description: "Accepted or idempotently replayed.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Quote' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version, revision, idempotency, or workflow conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2QuoteConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2QuoteUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

