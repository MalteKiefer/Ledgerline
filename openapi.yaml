openapi: 3.1.0
info:
  title: Ledgerline API
  version: 1.521.0
  license:
    name: Proprietary
  description: >
    Plaintext-relational personal cloud API for the Ledgerline mobile client.

    **Architecture:** every module is a relational table exposed over per-record
    REST (soft-delete trash + optimistic-concurrency `version`). Sensitive columns
    are encrypted at rest server-side (Laravel `encrypted` cast, APP_KEY) and
    returned decrypted over TLS — the client sends/receives plaintext. Binary files
    (documents, photos, receipts) are stored as plaintext bytes and streamed by id.
    (The former zero-knowledge/vault/sealed-store model was fully removed in the
    v1.5xx pivot.)

    **Authentication:** obtain a Sanctum bearer token via the device pairing
    exchange (QR code scan + owner approval in the web UI), then include it as
    `Authorization: Bearer <token>` on every request. All routes except the two
    pairing endpoints require the `device` Sanctum ability.

servers:
  - url: /api/v1
    description: Current stable API base path

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Device pairing exchange and session management
  - name: Me/Device
    description: Authenticated user info, avatar, and device heartbeat
  - name: Notes
    description: >
      Plaintext-relational notes (Phase 1 pivot away from the sealed store). Per-record
      REST CRUD with soft-delete/trash and optimistic-concurrency `version`. Owner-scoped;
      requires the `module:notes` gate on top of the device token.
  - name: Todos
    description: >
      Plaintext-relational to-do lists and tasks (Phase 1 pivot away from the sealed
      store). Per-record REST CRUD with soft-delete/trash and optimistic-concurrency
      `version`. Owner-scoped; requires the `module:todos` gate on top of the device token.
  - name: Bookmarks
    description: >
      Plaintext-relational bookmarks and nestable folders (Phase 1 pivot away from the
      sealed store). Per-record REST CRUD with soft-delete/trash and optimistic-concurrency
      `version`. Owner-scoped; requires the `module:bookmarks` gate on top of the device token.
  - name: Files
    description: Plaintext-relational personal files + folders (rows), raw byte download, version history, trash, and multipart upload
  - name: Gallery
    description: >
      Plaintext-relational gallery (pivot). Photos + albums as owner-scoped rows;
      original bytes + server-generated thumb/medium/motion renditions are streamed
      by id (raw/thumb/medium/motion). EXIF/pHash extracted server-side. Public share
      links serve plaintext bytes at /gallery-share/{token} (web). CLIP semantic search
      + face/people detection are deferred (server-ML re-add later).
  - name: Explore
    description: >
      Plaintext-relational GPS tracks + photo couplings + settings (pivot). Track
      point lists + notes are encrypted at rest; raw track files are plaintext blobs
      on disk. Track parsing (GPX/KML/TCX/FIT) is client-side.
  - name: Health
    description: >
      Plaintext-relational health tracking (pivot). Profile + measurements + fasts as
      owner-scoped rows; sensitive values (v/v2/note, birthdate, weight_goal_kg) are
      encrypted at rest (APP_KEY). Charts, unit conversion and doctor export are
      client-side. One active fast per user is DB-enforced.
  - name: Finance
    description: >
      Plaintext-relational finance (pivot). Invoices, bank transactions, payment
      methods, business partners, cost projects and receipt categories as
      owner-scoped rows; sensitive PII (IBAN/cards, bank counterparty/purpose,
      invoice customer/lines, partner contact PII) is encrypted at rest (APP_KEY),
      while amounts/dates/numbers stay plaintext for stats + GoBD. Invoice numbering
      is server-authoritative (POST /finance/invoices/{id}/finalize, atomic per-year).
      PDF + receipt files are plaintext blobs on disk. OCR (/invoices/ocr) and the
      company profile (/company) are unchanged.
  - name: Maps
    description: >
      Explore tour-planner auto-routing. Server-side proxy to an OSRM-compatible
      router that snaps clicked waypoints onto real paths/roads. A user-initiated,
      opt-in boundary crossing (same class as gallery geocoding); coordinates are
      never logged or persisted.
  - name: Devices
    description: Connected device listing, revocation, and remote-wipe management
  - name: Notifications
    description: In-app notification bell — list recent items, mark read
  - name: Account
    description: GDPR data export, account deletion, and session revocation
  - name: Preferences
    description: User preferences — locale and colour-scheme
  - name: Groups
    description: >
      Admin group management (requires the admin role on top of the device token).
      A group is a reusable limit template (files/gallery quota + device cap) plus a
      shareable flag; membership is many-to-many. Limits and membership are non-secret
      metadata — zero-knowledge is unaffected.
  - name: Company
    description: >
      Per-user company profile and invoice defaults (the Finance module's business
      identity + numbering/appearance settings). This is the user's OWN business
      identity that prints on every invoice — non-secret, served in the clear like the
      avatar (never customer data, which stays zero-knowledge in the invoices store).
      The invoice records, payment methods and imported bank transactions themselves
      live in the relational finance tables (see the Finance tag).
  - name: Status
    description: Application availability / health check (the site-root /up up-check).
  - name: TwoFactor
    description: >
      Self-service TOTP two-factor + app-password management for a paired device
      (Sanctum bearer). Mirrors the web Fortify flow, which is browser-only.
  - name: DevicePairings
    description: >
      Owner-side device pairing: an already-paired device generates a code, polls
      it, and approves/rejects the new device's claim. Owner-scoped.
  - name: Users
    description: >
      Admin user management (requires the admin role on top of the device token —
      `can:manage-global-settings`). No credentials (password hashes, 2FA secrets)
      are ever returned. Non-admins get 403.
  - name: Backup
    description: >
      Admin backup management (admin role + device token). Credential hygiene is
      enforced: destination `config` (cloud credentials) and job `passphrase` are
      NEVER present in any response. A database job with encrypt=false is refused
      (422) — a DB dump carries wrapped vault keys and must never leave unencrypted.
  - name: SecurityLog
    description: >
      Admin, read-only, metadata-only audit trail (admin role + device token). Rows
      never contain tokens/keys/ciphertext.
  - name: Paperless
    description: >
      Per-user Paperless-ngx integration: cached term quick-picks, live term
      creation, cache sync, and document forwarding. `POST /paperless/documents` is
      a transient-cleartext boundary (like /gallery/process + /invoices/ocr): the
      client posts decrypted bytes, the server forwards them to the user's own
      Paperless and stores/logs nothing.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >
        First-party Sanctum token with ability `device`. Obtained via the
        pairing exchange. Include as `Authorization: Bearer <token>`.

  schemas:
    CompanyProfile:
      type: object
      description: >
        Per-user company profile + invoice defaults (the business identity that prints
        on invoices). Non-secret. All fields are optional; on PUT, only the fields sent
        are updated. `has_logo` is read-only (response only).
      properties:
        company_name: { type: [string, "null"], maxLength: 200 }
        company_address: { type: [string, "null"], maxLength: 1000 }
        company_email: { type: [string, "null"], format: email, maxLength: 200 }
        company_phone: { type: [string, "null"], maxLength: 100 }
        company_tax_id: { type: [string, "null"], maxLength: 100 }
        company_vat_id: { type: [string, "null"], maxLength: 100 }
        company_iban: { type: [string, "null"], maxLength: 60 }
        company_bic: { type: [string, "null"], maxLength: 20 }
        company_bank_name: { type: [string, "null"], maxLength: 200 }
        invoice_number_format: { type: [string, "null"], maxLength: 40, description: "e.g. YYYY-NNNN. Locked client-side once the current year has invoices (GoBD)." }
        invoice_next_number: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "Numbering floor; the actual next number is derived per year from the invoices." }
        invoice_default_vat_rate: { type: [number, "null"], minimum: 0, maximum: 100 }
        invoice_payment_terms_days: { type: [integer, "null"], minimum: 0, maximum: 365 }
        invoice_footer_text: { type: [string, "null"], maxLength: 2000 }
        invoice_accent_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_heading_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_template: { type: [string, "null"], enum: [editorial, modern, elegant, klassisch] }
        invoice_payment_methods: { type: [string, "null"], maxLength: 500 }
        invoice_payment_terms_text: { type: [string, "null"], maxLength: 1000 }
        has_logo: { type: boolean, readOnly: true, description: "Whether a company logo is stored (GET /company/logo)." }

    Group:
      type: object
      description: >
        A user group: a reusable limit template plus a shareable flag. Limits are
        nullable (null = the group sets no cap for that dimension). Non-secret
        metadata — zero-knowledge is unaffected.
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        files_quota_mb: { type: [integer, "null"], description: "Files quota in MB (null = no group cap)." }
        gallery_quota_mb: { type: [integer, "null"], description: "Gallery quota in MB (null = no group cap)." }
        max_connected_devices: { type: [integer, "null"], description: "Device cap (null = no group cap)." }
        shareable: { type: boolean, description: "Members may offer this group as a share target." }
        modules:
          type: [array, "null"]
          description: >
            Allow-list of enabled module keys for members of this group (null = all
            modules). A member's effective modules are the union across their groups
            (a group with null grants all); a per-user allow-list overrides. Enforced
            server-side and surfaced at /me as user.modules.
          items: { type: string, enum: [dashboard, files, gallery, notes, todos, bookmarks, finance, health, explore] }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              email: { type: string }

    DisplayPreferences:
      type: object
      description: >
        Global, non-secret DISPLAY preferences — measurement units + 12/24h clock.
        Presentation only; the underlying data stays zero-knowledge. Returned in
        GET /me and set via POST /preferences; the client applies them to its own
        rendering (distances/elevations convert from canonical metres, times honour
        the clock format). Canonical storage is unchanged (metres, kg, °C, mg/dL).
      properties:
        distance: { type: string, enum: [km, mi] }
        elevation: { type: string, enum: [m, ft] }
        weight: { type: string, enum: [kg, lb] }
        temp: { type: string, enum: [c, f] }
        glucose: { type: string, enum: [mgdl, mmoll] }
        time_format: { type: string, enum: [24h, 12h] }

    MeUser:
      type: object
      description: >
        The authenticated user's profile. Returned as the `user` object by GET /me
        and by POST /auth/pair/collect (when `status: approved`). All fields are
        non-secret metadata — zero-knowledge vault data is never included.
      required: [id, name, email, locale, groups, modules, has_avatar, preferences]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        locale:
          type: string
          description: "The user's UI locale (one of the configured languages, e.g. en, de, ru)."
        groups:
          type: array
          description: >
            Derived from the first-party role: `["admin"]` for admins, `[]` otherwise.
            The historical claim shape is kept so existing mobile clients need no
            change — there is no separate `role` field.
          items: { type: string }
        modules:
          type: array
          description: >
            The application module keys this account may use (per-user / per-group
            toggles). A native client should hide the tabs for modules NOT listed
            here; the API also enforces it — a disabled module's store endpoints
            return 403.
          items: { type: string, enum: [dashboard, files, gallery, notes, todos, bookmarks, finance, health, explore] }
        has_avatar:
          type: boolean
          description: "Whether a non-secret avatar is stored. True → fetch it via GET /api/v1/avatar (Bearer)."
        preferences:
          allOf:
            - $ref: "#/components/schemas/DisplayPreferences"
          description: "Non-secret display preferences (units + 12/24h clock); set via POST /api/v1/preferences."
        theme:
          type: string
          enum: [light, dark, system]
          description: "Current UI theme (set via POST /api/v1/theme)."

    HealthFast:
      type: object
      description: >
        One intermittent-fasting record (relational table health_fasts, plaintext
        pivot; `note` encrypted at rest). Exactly one active fast per user is
        DB-enforced (partial unique index WHERE end_at IS NULL) — POST /health/fasts
        returns 409 active_fast_exists if one is already running. The active fast is
        the row with end_at null. target_hours is the fasting window (e.g. 16 for 16:8).
      required: [id, start_at, target_hours]
      properties:
        id: { type: integer }
        start_at: { type: string, format: date-time }
        end_at: { type: [string, "null"], format: date-time, description: "null while running (the active fast)." }
        target_hours: { type: integer, description: "Fasting window in hours." }
        note: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExploreTrack:
      type: object
      description: >
        One GPS track (plaintext-relational row). The point list + note are
        encrypted at rest (APP_KEY); everything else is plaintext. Parsing
        (GPX/KML/TCX/FIT) happens client-side. A raw track file, if attached, is a
        plaintext blob on disk referenced by blob_path.
      required: [id, name, source_format, points, stats, version, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        source_format:
          type: string
          enum: [recorded, imported, planned]
          description: recorded = live on-device GPS; imported = parsed file; planned = planner.
        points:
          type: array
          description: Ordered track points (encrypted at rest).
          items:
            type: object
            required: [lat, lng]
            properties:
              lat: { type: number }
              lng: { type: number }
              ele: { type: [number, "null"] }
              t: { type: [number, "null"] }
        stats:
          type: object
          description: >
            Free-form client-computed aggregates (distanceM, durationS,
            durationMovingS, ascentM, descentM, surfaces, …).
        note: { type: [string, "null"] }
        blob_path: { type: [string, "null"], description: "Disk path of the attached raw track file, if any." }
        imported_at: { type: [string, "null"], format: date-time }
        version: { type: integer, description: Optimistic-concurrency counter. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    ExploreCoupling:
      type: object
      description: Photo↔track coupling (plaintext-relational row).
      required: [id, explore_track_id, photo_id]
      properties:
        id: { type: integer }
        explore_track_id: { type: integer }
        photo_id: { type: string }
        lat: { type: [number, "null"] }
        lng: { type: [number, "null"] }
        source: { type: [string, "null"] }

    ExploreSettings:
      type: object
      description: Photo↔track coupling tolerances (plaintext-relational row).
      required: [id, coupling_time_tolerance_s, coupling_distance_tolerance_m]
      properties:
        id: { type: integer }
        coupling_time_tolerance_s: { type: integer, example: 3600 }
        coupling_distance_tolerance_m: { type: integer, example: 100 }

    OkResponse:
      type: object
      description: Acknowledgement response.
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    ValidationError:
      type: object
      description: Standard Laravel 422 validation error.
      required: [message]
      properties:
        message: { type: string }
        errors:
          type: object
          description: Field name → list of validation messages.
          additionalProperties:
            type: array
            items: { type: string }

    RecordVersionConflict:
      type: object
      description: >
        409 Conflict on a plaintext-relational record update (notes/todos/bookmarks)
        when the sent `version` is stale. Carries the current server version so the
        caller can re-read and retry.
      required: [error, version]
      properties:
        error:
          type: string
          enum: [version_conflict]
        version:
          type: integer
          description: Current server-side record version.

    NoteWrite:
      type: object
      description: Create/update body for a note (tag Notes).
      properties:
        title: { type: string, maxLength: 500 }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        pinned: { type: boolean }

    TodoWrite:
      type: object
      description: Create/update body for a task (tag Todos).
      properties:
        title: { type: string, maxLength: 500 }
        todo_list_id: { type: integer, description: "Owning list id, or omit/null for the inbox." }
        priority: { type: string }
        tags: { type: array, items: { type: string } }
        due: { type: string, format: date-time }
        url: { type: string, description: "http(s) only; a non-http(s) value is dropped server-side." }

    BookmarkFolderWrite:
      type: object
      description: Create/update body for a bookmark folder (tag Bookmarks).
      properties:
        name: { type: string, maxLength: 200 }
        parent_id: { type: integer }
        color: { type: string, maxLength: 32 }
        icon: { type: string, maxLength: 32 }

    BookmarkWrite:
      type: object
      description: Create/update body for a bookmark (tag Bookmarks).
      properties:
        url: { type: string, format: uri, maxLength: 2000, description: "http(s) only." }
        title: { type: string, maxLength: 500, description: "Defaults to the URL host when omitted." }
        bookmark_folder_id: { type: integer }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        favorite: { type: boolean }
        read_later: { type: boolean }
        read: { type: boolean }

    UsageResponse:
      type: object
      description: Current storage usage vs quota for the caller's scope.
      required: [used, quota]
      properties:
        used:
          type: integer
          description: Bytes currently stored.
          example: 104857600
        quota:
          type: integer
          description: >
            Maximum bytes allowed. `0` means unlimited (the server returns the
            integer 0, never null, for an uncapped module). Note this differs from
            GET /me `usage.quota`, which uses null for unlimited.
          minimum: 0
          example: 10737418240

    NoteRecord:
      type: object
      description: >
        One note row (plaintext-relational, tag Notes). Integer PK, snake_case
        columns as the server returns them. `version` is the optimistic-concurrency
        counter; `deleted_at` non-null means the note is trashed.
      required: [id, title, pinned, version]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: [string, "null"], description: "Markdown body (rendered client-side)." }
        tags: { type: [array, "null"], items: { type: string } }
        pinned: { type: boolean }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time, description: "Non-null = trashed (soft-deleted)." }

    TodoList:
      type: object
      description: >
        A named to-do list (plaintext-relational, tag Todos). Deleting a list sets
        member tasks' todo_list_id=null via FK (tasks are not deleted).
      required: [id, name, version]
      properties:
        id: { type: integer }
        name: { type: string }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    TodoRecord:
      type: object
      description: >
        One task row (plaintext-relational, tag Todos). `version` is the
        optimistic-concurrency counter; `deleted_at` non-null means trashed.
      required: [id, title, marked, done, version]
      properties:
        id: { type: integer }
        todo_list_id: { type: [integer, "null"], description: "Owning TodoList.id, or null = inbox." }
        title: { type: string }
        priority: { type: [string, "null"], description: "e.g. high/normal/low." }
        marked: { type: boolean, description: "Starred/flagged." }
        done: { type: boolean }
        tags: { type: [array, "null"], items: { type: string } }
        due: { type: [string, "null"], format: date-time }
        url: { type: [string, "null"], description: "http(s) only (sanitised server-side; non-http(s) dropped)." }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time, description: "Non-null = trashed (soft-deleted)." }

    BookmarkFolder:
      type: object
      description: >
        Nestable bookmark folder (plaintext-relational, tag Bookmarks). `parent_id`
        nests folders; `icon` is an opaque icon-name string (web maps it to an SVG;
        native may ignore).
      required: [id, name]
      properties:
        id: { type: integer }
        parent_id: { type: [integer, "null"] }
        name: { type: string }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    BookmarkRecord:
      type: object
      description: >
        One bookmark row (plaintext-relational, tag Bookmarks). `version` is the
        optimistic-concurrency counter; `deleted_at` non-null means trashed.
      required: [id, title, url, favorite, read_later, read, version]
      properties:
        id: { type: integer }
        bookmark_folder_id: { type: [integer, "null"], description: "Owning BookmarkFolder.id, or null = root." }
        title: { type: string }
        url: { type: string, format: uri }
        description: { type: [string, "null"] }
        tags: { type: [array, "null"], items: { type: string } }
        favorite: { type: boolean }
        read_later: { type: boolean }
        read: { type: boolean }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time, description: "Non-null = trashed (soft-deleted)." }

    HealthProfile:
      type: object
      description: "Personal health profile (relational table health_profiles; birthdate + weight_goal_kg encrypted at rest). Units come from UserSettings, not here."
      properties:
        id: { type: integer }
        birthdate: { type: [string, "null"], description: "YYYY-MM-DD." }
        height_cm: { type: [integer, "null"] }
        sex: { type: [string, "null"], description: "male | female | other | null." }
        weight_goal_kg: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HealthEntry:
      type: object
      description: "One measurement (relational table health_entries; v/v2/note encrypted at rest, stored canonical kg/mmHg/bpm/%/°C/mg-dL as strings). Display conversion is client-only."
      required: [id, metric, v, ts]
      properties:
        id: { type: integer }
        metric: { type: string, enum: [weight, bp, pulse, spo2, temp, glucose] }
        v: { type: string, description: "Primary value (canonical unit), decrypted." }
        v2: { type: [string, "null"], description: "Diastolic mmHg for metric=bp; null otherwise." }
        ts: { type: string, format: date-time }
        note: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Invoice:
      type: object
      description: "Invoice (relational table invoices; customer/lines/note/versions encrypted at rest). Money + number/date plaintext for stats/GoBD."
      properties:
        id: { type: integer }
        number: { type: [string, "null"] }
        seq: { type: [integer, "null"] }
        year: { type: [integer, "null"] }
        status: { type: string, enum: [draft, sent, paid] }
        issue_date: { type: [string, "null"] }
        due_date: { type: [string, "null"] }
        currency: { type: string }
        vat_rate: { type: [string, "null"] }
        gross: { type: [string, "null"] }
        net: { type: [string, "null"] }
        vat: { type: [string, "null"] }
        imported: { type: boolean }
        paid_at: { type: [string, "null"], format: date-time }
        payment_account: { type: [string, "null"] }
        partner_id: { type: [integer, "null"] }
        pdf_path: { type: [string, "null"] }
        customer: { type: object, additionalProperties: true }
        lines: { type: array, items: { type: object, additionalProperties: true } }
        note: { type: [string, "null"] }
        versions: { type: array, items: { type: object, additionalProperties: true } }
        version_seq: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinancePartner:
      type: object
      description: "Geschäftspartner (relational finance_partners; address/email/phone/vat_id/contacts encrypted at rest)."
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: [string, "null"] }
        kind: { type: [string, "null"] }
        url: { type: [string, "null"] }
        logo: { type: [string, "null"] }
        note: { type: [string, "null"] }
        address: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        vat_id: { type: [string, "null"] }
        contacts: { type: array, items: { type: object, additionalProperties: true } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    PaymentMethod:
      type: object
      description: "Payment method (relational payment_methods; all columns plaintext since v1.516.0)."
      properties:
        id: { type: integer }
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        name: { type: string }
        holder: { type: [string, "null"] }
        note: { type: [string, "null"] }
        business: { type: boolean }
        url: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        bank: { type: [string, "null"] }
        account_no: { type: [string, "null"] }
        card_number: { type: [string, "null"] }
        card_network: { type: [string, "null"] }
        card_expiry: { type: [string, "null"] }
        paypal_email: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinanceProject:
      type: object
      description: "Cost project (relational finance_projects, nestable via parent_id)."
      properties:
        id: { type: integer }
        parent_id: { type: [integer, "null"] }
        name: { type: string }
        kind: { type: string, description: "business | private" }
        note: { type: [string, "null"] }
        expenses: { type: array, items: { type: object, additionalProperties: true } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinanceCategory:
      type: object
      description: "Receipt category (relational finance_categories)."
      properties:
        id: { type: integer }
        name: { type: string }

    BankTransaction:
      type: object
      description: "Bank-statement line (relational bank_transactions; counterparty/iban/bic/purpose/booking_text/eref/receipts encrypted at rest). Amount/date/vat_cat plaintext for stats."
      properties:
        id: { type: integer }
        payment_method_id: { type: integer }
        date: { type: string }
        amount: { type: string }
        vat_cat: { type: [string, "null"] }
        sig: { type: [string, "null"] }
        invoice_id: { type: [integer, "null"] }
        invoice_number: { type: [string, "null"] }
        finance_project_id: { type: [integer, "null"] }
        counterparty: { type: [string, "null"] }
        counterparty_iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        purpose: { type: [string, "null"] }
        booking_text: { type: [string, "null"] }
        eref: { type: [string, "null"] }
        receipts: { type: array, items: { type: object, additionalProperties: true } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GalleryPhoto:
      type: object
      description: "A photo/video (relational table gallery_photos, plaintext pivot). Bytes + renditions are served by id via the render endpoints (raw/thumb/medium/motion); paths are not exposed. Faces/CLIP deferred."
      properties:
        id: { type: integer }
        kind: { type: string, enum: [image, video] }
        mime: { type: string }
        size: { type: integer }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        taken_at: { type: [string, "null"], format: date-time }
        lat: { type: [number, "null"] }
        lng: { type: [number, "null"] }
        camera: { type: [string, "null"] }
        phash: { type: [integer, "null"] }
        favorite: { type: boolean }
        description: { type: [string, "null"] }
        exif: { type: [object, "null"], additionalProperties: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    GalleryAlbum:
      type: object
      description: "A photo album (relational gallery_albums; photos via the gallery_album_photo pivot)."
      properties:
        id: { type: integer }
        name: { type: string }
        cover_photo_id: { type: [integer, "null"] }
        photo_ids: { type: array, items: { type: integer } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GalleryPerson:
      type: object
      description: "A person = a cluster of detected faces (relational gallery_people). Auto-grouped by CLIP/face-embedding cosine similarity; nameable."
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        cover_face_id: { type: [integer, "null"] }
        face_count: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GalleryFace:
      type: object
      description: "One detected face in a photo (relational gallery_faces). Crop bytes at /gallery/faces/{id}/crop; the embedding is server-only (pgvector), never serialised."
      properties:
        id: { type: integer }
        gallery_photo_id: { type: integer }
        gallery_person_id: { type: [integer, "null"] }
        score: { type: number }
        box: { type: array, items: { type: number }, description: "Normalised [x, y, w, h] 0..1." }
        crop_path: { type: [string, "null"] }
        hidden: { type: boolean }

    GalleryShare:
      type: object
      description: "A public gallery share link (relational gallery_shares; plaintext bytes served at /gallery-share/{token})."
      properties:
        id: { type: integer }
        token: { type: string }
        kind: { type: string, enum: [album, photo] }
        gallery_album_id: { type: [integer, "null"] }
        gallery_photo_id: { type: [integer, "null"] }
        allow_download: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        has_password: { type: boolean }
        version: { type: integer }

    FileEntry:
      type: object
      description: >
        One file in the plaintext-relational Files core (pivot). Bytes are plaintext
        on the file disk; download via GET /files/entries/{file}/raw. Prior revisions
        are in FileVersion (GET /files/entries/{file}/versions).
      required: [id, name, size, version]
      properties:
        id: { type: integer }
        file_folder_id: { type: [integer, "null"], description: "Owning folder, or null = root." }
        name: { type: string }
        mime: { type: [string, "null"] }
        size: { type: integer }
        sha256: { type: [string, "null"] }
        tags: { type: [array, "null"], items: { type: string } }
        note: { type: [string, "null"] }
        favorite: { type: boolean }
        version: { type: integer, description: "Optimistic-concurrency counter for metadata updates." }
        indexed_at: { type: [string, "null"], format: date-time, description: "When the content text index was last built (null = not yet indexed). The extracted search_text itself is server-only and never serialized." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-trashed." }

    FileVersion:
      type: object
      description: "A prior revision of a file's bytes. Capped by the user's file_max_versions setting."
      required: [id, size]
      properties:
        id: { type: integer }
        file_id: { type: integer }
        size: { type: integer }
        mime: { type: [string, "null"] }
        sha256: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    FileFolder:
      type: object
      description: "A folder in the plaintext-relational Files core (self-referential tree)."
      required: [id, name, version]
      properties:
        id: { type: integer }
        parent_id: { type: [integer, "null"], description: "Parent folder, or null = root." }
        name: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FileShare:
      type: object
      description: >
        A public Files share link (relational file_shares). A shared file or a
        shared folder subtree; plaintext bytes are served at /file-share/{token}
        (web, unauthenticated) with an optional rate-limited password gate — no
        fragment key. The owner-side response never includes the password hash.
        Public consumption routes (web-only, not counted in this API surface):
        GET /file-share/{token} (meta), POST /file-share/{token}/unlock,
        GET /file-share/{token}/manifest, GET /file-share/{token}/file/{file}/raw.
      required: [id, token, kind, allow_download, version]
      properties:
        id: { type: integer }
        token: { type: string }
        kind: { type: string, enum: [file, folder] }
        file_id: { type: [integer, "null"] }
        file_folder_id: { type: [integer, "null"] }
        needs_password: { type: boolean }
        allow_download: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        version: { type: integer }

    FolderShareMember:
      type: object
      description: A recipient of a cross-user folder share, at a role.
      required: [id, user_id, role]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        role: { type: string, enum: [viewer, editor] }
    FolderShare:
      type: object
      description: >
        A cross-user plaintext folder share (owner side). The owner grants other
        registered users access to one of their own folders (and its whole subtree)
        at a role held on the members roster. Plaintext-relational (folder_shares);
        confidentiality-at-rest is infra (LUKS + encrypted backups). Recipients are
        resolved by exact email only — unified 422 for "no such user" and self-share
        (no directory enumeration).
      required: [id, file_folder_id, members]
      properties:
        id: { type: integer }
        file_folder_id: { type: integer }
        folder_name: { type: [string, "null"] }
        members: { type: array, items: { $ref: "#/components/schemas/FolderShareMember" } }

    UserSettings:
      type: object
      description: "Per-user non-display settings (file version cap)."
      properties:
        file_max_versions: { type: integer, minimum: 1, maximum: 200 }

    AdminUser:
      type: object
      description: "Admin view of a user. Never includes password hashes or 2FA secrets."
      required: [id, name, email, role, verified, two_factor, usage]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        files_quota_mb: { type: [integer, "null"] }
        gallery_quota_mb: { type: [integer, "null"] }
        max_connected_devices: { type: [integer, "null"] }
        modules: { type: [array, "null"], items: { type: string } }
        groups: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        verified: { type: boolean }
        two_factor: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        usage: { type: object, required: [used], properties: { used: { type: integer }, quota: { type: [integer, "null"] } } }

    AdminUserWrite:
      type: object
      description: "User create/update body. role/quotas/modules are privilege fields (never mass-assigned server-side)."
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, user] }
        password: { type: string, minLength: 12, description: "Create only (prohibited on update); omit to trigger a reset mail." }
        files_quota_mb: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        gallery_quota_mb: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
        modules: { type: [array, "null"], items: { type: string, enum: [dashboard, files, gallery, notes, todos, bookmarks, finance, health, explore] } }
        modules_marker: { type: string, enum: ['set'], description: "Send with an (empty) modules[] to set an explicit list rather than 'no change'." }
        groups: { type: [array, "null"], items: { type: integer } }

    PaperlessTerm:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: "Paperless numeric id." }
        name: { type: string }
        color: { type: [string, "null"] }

    SecurityLogEntry:
      type: object
      description: "One append-only audit entry. Metadata only — never tokens/keys/ciphertext."
      properties:
        at: { type: [string, "null"], format: date-time }
        user_id: { type: [integer, "null"] }
        actor: { type: [string, "null"], description: "Display name at query time." }
        action: { type: string, example: device.evicted, description: "Dot-namespaced event id." }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        meta: { type: [object, "null"], additionalProperties: true }

    BackupDestinationSummary:
      type: object
      description: "Safe public shape — credentials (`config`) intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }

    BackupDestinationWrite:
      type: object
      required: [name, driver]
      description: "Blank secret fields (secret/password/private_key) keep the stored value on update."
      properties:
        name: { type: string }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }
        bucket: { type: string }
        region: { type: string }
        key: { type: string }
        secret: { type: string }
        endpoint: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        private_key: { type: string }
        path: { type: string }
        url: { type: string }

    BackupJobSummary:
      type: object
      description: "Safe public shape — `passphrase` intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        source: { type: string, enum: [database, files, gallery] }
        mode: { type: string }
        destination_id: { type: integer }
        cron: { type: string }
        retention: { type: integer }
        encrypt: { type: boolean }
        notify_channels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"] }
        statistics: { type: object, additionalProperties: true }

    BackupJobWrite:
      type: object
      required: [name, source, backup_destination_id, cron, retention]
      description: "source=database requires encrypt=true (422 otherwise). Blank passphrase keeps the stored value on update."
      properties:
        name: { type: string }
        source: { type: string, enum: [database, files, gallery] }
        mode: { type: string }
        backup_destination_id: { type: integer }
        cron: { type: string }
        retention: { type: integer, minimum: 1 }
        encrypt: { type: boolean }
        passphrase: { type: string }
        notify_channels: { type: array, items: { type: string } }
        enabled: { type: boolean }

    BackupRunSummary:
      type: object
      properties:
        id: { type: integer }
        job: { type: string }
        status: { type: string }
        startedIso: { type: [string, "null"], format: date-time }
        finishedIso: { type: [string, "null"], format: date-time }
        durationSeconds: { type: [number, "null"] }
        size: { type: [string, "null"] }
        filename: { type: [string, "null"] }
        downloadable: { type: boolean }
        encrypted: { type: boolean }
        cancellable: { type: boolean }
        verifiable: { type: boolean }
        cancelRequested: { type: boolean }
        error: { type: [string, "null"] }

paths:

  # --------------------------------------------------------------------------
  # Health check (app up-check) — NOT under /api/v1; served at the site root.
  # --------------------------------------------------------------------------

  /up:
    servers:
      - url: /
        description: Site root (this endpoint lives above the /api/v1 base path).
    get:
      tags: [Status]
      operationId: healthUp
      summary: Application health check (up-check)
      description: >
        Laravel's framework health endpoint at the site ROOT (`/up`, not
        `/api/v1/up`). Unauthenticated, unthrottled. Returns HTTP 200 while the
        application booted cleanly (runs the framework health checks) and a 500
        otherwise. Apps poll it to confirm the server is reachable and healthy
        before/independently of API calls. The body is a small HTML page — clients
        should treat the STATUS CODE as the signal, not the body.
      security: []
      responses:
        "200":
          description: Application is up and healthy.
          content:
            text/html:
              schema:
                type: string
        "429":
          description: Too Many Requests — a fronting reverse proxy may throttle excessive polling.
        "500":
          description: Application is unhealthy (a health check threw).

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------

  /auth/pair:
    post:
      tags: [Auth]
      operationId: authPair
      summary: Claim a pairing code (public)
      description: >
        The mobile app scans a QR code from the user's web profile and claims the
        one-time code here. Moves the pairing to pending-approval status. No bearer
        token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_name]
              properties:
                code:
                  type: string
                  description: One-time pairing code from the QR.
                device_name:
                  type: string
                  maxLength: 60
                  description: Human-readable device name shown in the web UI.
      responses:
        "200":
          description: Code claimed; waiting for owner approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
        "410":
          description: Code not found, expired, or in the wrong state (Gone).
        "422":
          description: Validation error (missing/invalid fields).
        "429":
          description: Rate limit exceeded.

  /auth/pair/collect:
    post:
      tags: [Auth]
      operationId: authCollect
      summary: Poll for pairing approval (public)
      description: >
        Poll with the same code. Returns `status: pending` until the owner approves
        the device in the web UI, then returns the Sanctum bearer token exactly once.
        No bearer token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The same one-time pairing code.
                install_id:
                  type: string
                  maxLength: 64
                  description: >
                    Optional device-local random id (NOT a secret) that lets the
                    server audit trail be correlated with the client's own
                    diagnostic log. Stored on the token; echoed in device audit meta.
                app_version:
                  type: string
                  maxLength: 32
                  description: Optional client app version reported at pairing (non-secret).
                os_version:
                  type: string
                  maxLength: 32
                  description: Optional client OS version reported at pairing (non-secret).
      responses:
        "200":
          description: Pending or approved.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [pending]
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [approved]
                      token:
                        type: string
                        description: Sanctum bearer token for subsequent API calls.
                      user:
                        $ref: "#/components/schemas/MeUser"
        "410":
          description: Code not found, expired, rejected, or already consumed (Gone).
        "429":
          description: Rate limit exceeded.

  /auth/session:
    delete:
      tags: [Auth]
      operationId: authDestroy
      summary: Revoke the current bearer token
      description: >
        Deletes the Sanctum token authenticating this request (logout / remote wipe
        acknowledgement). Throttle: none (uses general API throttle).
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Me / Device
  # --------------------------------------------------------------------------

  /me:
    get:
      tags: [Me/Device]
      operationId: meShow
      summary: Authenticated user info and storage usage
      description: >
        Returns the authenticated user's profile, aggregate storage usage (files +
        gallery bytes), and a `wipe` flag that signals the owner has requested a
        remote wipe of this token. No throttle beyond the default API rate.
      responses:
        "200":
          description: User payload.
          content:
            application/json:
              schema:
                type: object
                required: [user, usage, wipe]
                properties:
                  user:
                    $ref: "#/components/schemas/MeUser"
                  usage:
                    type: object
                    required: [files, gallery, quota]
                    properties:
                      files:
                        type: integer
                        description: Total file blob bytes used by this account.
                      gallery:
                        type: integer
                        description: Total gallery blob bytes used by this account.
                      quota:
                        type: [integer, "null"]
                        description: >
                          Combined storage limit in bytes (effective files quota +
                          gallery quota). Null = unlimited — returned whenever either
                          dimension is unlimited (0), since the pool then has no finite
                          cap. Lets a client render a used/limit ring against files+gallery.
                  wipe:
                    type: boolean
                    description: >
                      Kill switch. If true, the owner has requested a remote wipe of
                      this token — the client should erase local vault data and log out.
        "401":
          description: Unauthenticated.

  /avatar:
    get:
      tags: [Me/Device]
      operationId: avatarShow
      summary: Stream the authenticated user's avatar
      description: >
        Streams the user's stored avatar image. Not zero-knowledge (a non-secret
        profile image). Returns 404 if no avatar is stored. Throttle: 120 req/min.
      responses:
        "200":
          description: Avatar image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated.
        "404":
          description: No avatar stored.
        "429":
          description: Rate limit exceeded.

  /device/heartbeat:
    post:
      tags: [Me/Device]
      operationId: deviceHeartbeat
      summary: Record device sync activity
      description: >
        CLI/background clients call this to record whether they are currently syncing.
        Returns the remote-wipe flag so any heartbeat also delivers the kill switch.
        Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [idle, syncing]
                  description: Current sync state of the client.
                detail:
                  type: [string, "null"]
                  maxLength: 160
                  description: Optional human-readable detail string shown in the devices list.
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [wipe]
                properties:
                  wipe:
                    type: boolean
                    description: >
                      If true the owner has requested a remote wipe of this token.
                      The client should erase local vault data and log out.
        "422":
          description: Validation error (state not in allowed enum).
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Vault (KDF material + wrapped vault key)
  # --------------------------------------------------------------------------

  /files/entries:
    get:
      tags: [Files]
      operationId: filesEntriesIndex
      summary: List files, folders, and storage usage
      description: >
        Returns the caller's non-trashed folders + files plus storage usage
        (used/quota bytes; used = current file bytes + all version bytes).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Files listing.
          content:
            application/json:
              schema:
                type: object
