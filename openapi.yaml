      responses:
        "200":
          description: Photo list.
          content:
            application/json:
              schema: { type: object, properties: { name: { type: [string, "null"] }, photos: { type: array, items: { $ref: '#/components/schemas/GallerySharedPhoto' } }, can_contribute: { type: boolean } } }
