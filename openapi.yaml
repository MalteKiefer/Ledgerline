      summary: Convert an accepted exact immutable quote revision to an invoice draft
      parameters:
        - { name: quote, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, expected_revision_id], properties: { version: { type: integer, minimum: 0 }, expected_revision_id: { type: integer, minimum: 1 } } } } } }
      responses:
        "201": { description: "Invoice draft target created.", content: { application/json: { schema: { type: object, additionalProperties: false, required: [target_reference, target_id], properties: { target_reference: { type: string }, target_id: { type: [integer, "null"] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
