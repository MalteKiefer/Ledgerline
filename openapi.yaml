        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/shared-with-me/{share}/upload:
    post:
      tags: [GallerySharing]
      operationId: gallerySharedUpload
      summary: Contribute a photo to a collaborative album (editor share)
      description: "Only for an editor share of a specific album. The uploaded photo lands under the album OWNER, joins the album, and counts against the owner's quota. 403 if the share is viewer-only; 413 over the owner's quota; 415 for a non-image/video."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        "201": { description: Contributed., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, photo: { $ref: '#/components/schemas/GalleryPhoto' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Over the owner's storage quota. }
        "415": { description: Unsupported media type. }
