openapi: 3.1.0
info:
  title: Ledgerline API
  version: 1.539.31
  description: >
    Zero-knowledge personal cloud API for the Ledgerline mobile client.

    **Zero-knowledge architecture:** all content payloads (ciphertext fields,
    sealed manifests, blob bodies) are opaque to the server — the server stores
    and returns ciphertext only and never reads or derives plaintext content.
    The vault key and all decryption happen exclusively in the client.

    **Authentication:** obtain a Sanctum bearer token via the device pairing
    exchange (QR code scan + owner approval in the web UI), then include it as
    `Authorization: Bearer <token>` on every request. All routes except the two
    pairing endpoints require the `device` Sanctum ability.

servers:
  - url: /api/v1
    description: Current stable API base path

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Device pairing exchange and session management
  - name: Me/Device
    description: Authenticated user info, avatar, and device heartbeat
  - name: Store
    description: >
      Opaque zero-knowledge per-module sealed stores (Store v3 split). Each module
      (notes, todos, bookmarks, contacts, invoices, passwords, health, sharing) owns
      its OWN sealed row, so a write to one module never re-seals the others. These
      modules have NO per-record REST endpoints (that would break zero-knowledge);
      their full CRUD is: read the module store (GET /store/{module}), mutate the
      decrypted object client-side, and write it back (PUT /store/{module}) with
      optimistic concurrency. The files tree has its own sharded sealed store
      (GET/PUT /files/store, tag Files). Only binary blobs (contact avatars,
      file/gallery bytes) have their own endpoints; the records that reference them
      live in these stores.


      DECRYPTED shapes (schemas) per module — a native client builds these from the
      decrypted object; the server never sees them. Preserve unknown keys on write.
        • notes → {v:3, notes:[NoteRecord]} (sharded /notes/store)
        • todos → {v:3, todos:[TodoRecord], todoLists:[TodoList]}
        • bookmarks → {v:3, bookmarks:[BookmarkRecord], bookmarkFolders:[BookmarkFolder]}
        • contacts → {v:3, contacts:[ContactRecord]} (sharded /contacts/store, + avatar blobs; record shards reuse the contact_blobs ledger)
        • passwords → PasswordsStoreModel {secrets:[SecretItem], secretFolders:[PersonalVault], pwVaultMigrated} (sharded /passwords/store)
        • invoices → {invoices:[InvoiceRecord], transactions:[InvoiceTransaction], paymentMethods:[PaymentMethod], projects:[FinanceProject], partners:[FinancePartner], financeCategories:[FinanceCategory]} (sharded /invoices/store)
        • health → {healthProfile:HealthProfile, healthEntries:[HealthEntry], healthFasts:[HealthFast]}
        • explore → ExploreStoreModel {tracks:[ExploreTrack], couplings:{photoId→ExploreCoupling}(OBJECT MAP, not an array — remove a coupling by DELETING its key, never by nulling it), settings:ExploreSettings}
        • sharing → SharingStoreModel {knownFingerprints:{userId→hex}} (TOFU, shared by passwords+files)
        • files → {v:3, files:[FileRecord], fileFolders:[FileFolder]} (sharded /files/store)
        • gallery → {v:3, photos:[GalleryPhoto], people:[GalleryPerson], albums:[GalleryAlbum]} (sharded /gallery/store)
        • shared vaults → SharedVaultManifest (GET/PUT /vaults/{vault}/store)

      409 MERGE (per the StoreVersionConflict contract): each TOP-LEVEL value is one of
      three shapes and MUST merge exactly as documented there — keyed record ARRAYS
      (key precedence: id → credentialId → photoId+idx; `seq` is NEVER a key), STRING
      SCALAR arrays (set-union), or OBJECT MAPS (key-by-key, delete keys absent from
      ours). A native client that whole-value last-writer-wins any of these on a 409
      diverges from web/extension and loses the co-writer's records. After a background
      merge, an open editor MUST re-resolve the record it holds BY ID (the merge replaces
      element objects with fresh clones), or an edit made after the merge is lost.
  - name: Files
    description: Personal encrypted file blobs and multipart upload pipeline
  - name: SharedFolders
    description: Member-scoped blob store for shared vault folders (blobs at shared-folders/{blob})
  - name: Gallery
    description: Gallery blobs, multipart upload, and ML processing pipeline
  - name: Contacts
    description: >
      Optional encrypted contact avatar blobs. The contact RECORDS themselves
      (names, vCard fields, etc.) live in the sealed sharded contacts store (see
      Store, GET/PUT /contacts/store) — these endpoints hold the optional avatar
      image bytes a contact record references AND the content-addressed record-shard
      blobs (both share the contact_blobs ledger + /contacts/{upload,raw,raw-batch,
      blobs/reconcile}; refs never collide). Notes and todos are store-only.
  - name: Explore
    description: >
      Optional encrypted Explore track blobs. The Explore RECORDS themselves
      (tracks, couplings, tolerances) live in the sealed explore module store
      (see Store, GET/PUT /store/explore, shape = ExploreStoreModel) — these
      endpoints only hold the optional raw track file bytes a record references.


      MOBILE PARITY (incl. live tracking): every Explore capability is reachable
      with the endpoints already listed — no per-record or "tracking" endpoint
      exists (that would break zero-knowledge; GPS points never reach the server
      as plaintext). The client does ALL of it and persists results into the
      sealed store:

        * Browse: read gallery photos (GET /gallery/store + /gallery/raw) for map
          pins; read tracks from GET /store/explore.
        * Import: parse GPX/KML/KMZ/TCX/FIT on-device, add a track to
          ExploreStoreModel.tracks (sourceFormat = gpx|kml|kmz|tcx|fit), PUT
          /store/explore. Optionally seal the original file via POST
          /explore/upload and store its blob id as track.rawBlobId.
        * Live tracking (mobile): record device GPS on-device, build a track with
          sourceFormat = "recorded" (points carry lat/lng/ele/t), compute stats
          client-side, PUT /store/explore. Nothing GPS-related is sent to the
          server except the sealed ciphertext.
        * Plan a tour: sourceFormat = "planned"; optionally snap waypoints to
          paths via GET /maps/route (opt-in) before saving.
        * Photo↔track coupling + tolerances: computed on-device, stored in
          ExploreStoreModel.couplings / .settings.

      Writes use the standard optimistic-concurrency PUT /store/explore
      (read → mutate the decrypted object → write with the version; 409 → re-read).
  - name: Maps
    description: >
      Explore tour-planner auto-routing. Server-side proxy to an OSRM-compatible
      router that snaps clicked waypoints onto real paths/roads. A user-initiated,
      opt-in boundary crossing (same class as gallery geocoding); coordinates are
      never logged or persisted.
  - name: Passwords
    description: Password-manager enrichment endpoints (favicon, HIBP, 2FA directory)
  - name: Vaults
    description: Shared password vault container management, ZK key wrapping, and membership lifecycle
  - name: Devices
    description: Connected device listing, revocation, and remote-wipe management
  - name: Notifications
    description: In-app notification bell — list recent items, mark read
  - name: Account
    description: GDPR data export, account deletion, and session revocation
  - name: Preferences
    description: User preferences — locale and colour-scheme
  - name: Groups
    description: >
      Admin group management (requires the admin role on top of the device token).
      A group is a reusable limit template (files/gallery quota + device cap) plus a
      shareable flag; membership is many-to-many. Limits and membership are non-secret
      metadata — zero-knowledge is unaffected.
  - name: Company
    description: >
      Per-user company profile and invoice defaults (the Finance module's business
      identity + numbering/appearance settings). This is the user's OWN business
      identity that prints on every invoice — non-secret, served in the clear like the
      avatar (never customer data, which stays zero-knowledge in the invoices store).
      The invoice records, payment methods and imported bank transactions themselves
      live sealed in the sharded invoices store (GET/PUT /invoices/store, tag Store).
  - name: Mail
    description: >
      Zero-knowledge mail archive. The server runs a per-account IMAP
      sync and archives fetched messages, but is NEVER able to read them: each
      raw RFC822 message is sealed server-side to the OWNER'S PUBLIC identity
      keys (X25519 + ML-KEM-768, the same Store v3 §6.3 PQ-hybrid primitive
      used for cross-user vault sharing) the instant it is fetched, before
      anything is written to disk. Account CRUD (host/credentials/folders) and
      the archived-message LEDGER (metadata only — never subject/from/body)
      are plain per-user resources over `/api/v1/mail`; the sealed message
      BYTES live as opaque blobs at `GET /mail/raw/{id}` (a MailMessage's own
      `id` doubles as the blob's primary key — no separate lookup needed).


      CLIENT DECRYPT CONTRACT (there is deliberately NO server-decrypt
      endpoint — that would break zero-knowledge):
        1. GET /mail/messages to list the ledger for one or all accounts.
        2. For a message, hybrid-UNWRAP `sealed_key` (a Store v3 §6.3
           HybridEnvelope, JSON-encoded) with the caller's OWN identity
           SECRET keys (the same `hybridUnwrap` used to open a shared vault's
           `wrapped_vault_key`) to recover the random per-message symmetric key.
        3. GET /mail/raw/{id} for the sealed bytes and open them with that key
           via libsodium secretstream (crypto_secretstream_xchacha20poly1305) —
           byte-identical framing to vault.js's own content blobs: a
           secretstream header followed by length-prefixed 4 MiB chunks,
           TAG_FINAL on the last chunk.


      The account's IMAP PASSWORD is the one plaintext secret the server must
      hold to run the sync (`encrypted` at rest via APP_KEY) — it is NEVER
      returned in any response from this API; a blank `password` on PUT keeps
      the stored one unchanged (KeepBlankSecrets). `host` is validated against
      the same SSRF guard used for Paperless/NTFY targets (refuses link-local /
      cloud-metadata addresses).
  - name: Status
    description: Application availability / health check (the site-root /up up-check).
  - name: TwoFactor
    description: >
      Self-service TOTP two-factor + app-password management for a paired device
      (Sanctum bearer). Mirrors the web Fortify flow, which is browser-only.
  - name: DevicePairings
    description: >
      Owner-side device pairing: an already-paired device generates a code, polls
      it, and approves/rejects the new device's claim. Owner-scoped.
  - name: Users
    description: >
      Admin user management (requires the admin role on top of the device token —
      `can:manage-global-settings`). No credentials (password hashes, 2FA secrets)
      are ever returned. Non-admins get 403.
  - name: Backup
    description: >
      Admin backup management (admin role + device token). Credential hygiene is
      enforced: destination `config` (cloud credentials) and job `passphrase` are
      NEVER present in any response. A database job MAY be created with encrypt=false
      (operator opt-out) — the UI warns that the dump carries wrapped vault keys off-box.
  - name: SecurityLog
    description: >
      Admin, read-only, metadata-only audit trail (admin role + device token). Rows
      never contain tokens/keys/ciphertext.
  - name: Paperless
    description: >
      Per-user Paperless-ngx integration: cached term quick-picks, live term
      creation, cache sync, and document forwarding. `POST /paperless/documents` is
      a transient-cleartext boundary (like /gallery/process + /invoices/ocr): the
      client posts decrypted bytes, the server forwards them to the user's own
      Paperless and stores/logs nothing.
  - name: PublicShare
    description: >
      Public consumption of a `/s/{token}` share link (unauthenticated — the share
      key lives only in the URL fragment, never sent to the server). Password-gated
      shares issue a short-lived stateless HMAC grant on /unlock.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >
        First-party Sanctum token with ability `device`. Obtained via the
        pairing exchange. Include as `Authorization: Bearer <token>`.

  schemas:
    CompanyProfile:
      type: object
      description: >
        Per-user company profile + invoice defaults (the business identity that prints
        on invoices). Non-secret. All fields are optional; on PUT, only the fields sent
        are updated. `has_logo` is read-only (response only).
      properties:
        company_name: { type: string, nullable: true, maxLength: 200 }
        company_address: { type: string, nullable: true, maxLength: 1000 }
        company_email: { type: string, format: email, nullable: true, maxLength: 200 }
        company_phone: { type: string, nullable: true, maxLength: 100 }
        company_tax_id: { type: string, nullable: true, maxLength: 100 }
        company_vat_id: { type: string, nullable: true, maxLength: 100 }
        company_iban: { type: string, nullable: true, maxLength: 60 }
        company_bic: { type: string, nullable: true, maxLength: 20 }
        company_bank_name: { type: string, nullable: true, maxLength: 200 }
        invoice_number_format: { type: string, nullable: true, maxLength: 40, description: "e.g. YYYY-NNNN. Locked client-side once the current year has invoices (GoBD)." }
        invoice_next_number: { type: integer, nullable: true, minimum: 1, maximum: 100000000, description: "Numbering floor; the actual next number is derived per year from the invoices." }
        invoice_default_vat_rate: { type: number, nullable: true, minimum: 0, maximum: 100 }
        invoice_payment_terms_days: { type: integer, nullable: true, minimum: 0, maximum: 365 }
        invoice_footer_text: { type: string, nullable: true, maxLength: 2000 }
        invoice_accent_color: { type: string, nullable: true, pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_heading_color: { type: string, nullable: true, pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_template: { type: string, nullable: true, enum: [editorial, modern, elegant, klassisch] }
        invoice_payment_methods: { type: string, nullable: true, maxLength: 500 }
        invoice_payment_terms_text: { type: string, nullable: true, maxLength: 1000 }
        invoice_vat_ist: { type: boolean, description: "VAT taxation scheme for the Umsatzsteuer-Voranmeldung. true = Ist-Versteuerung (cash-basis, VAT due on payment — only paid invoices count, booked to payment date). false = Soll (accrual, VAT on issue). Default true." }
        has_logo: { type: boolean, readOnly: true, description: "Whether a company logo is stored (GET /company/logo)." }

    Group:
      type: object
      description: >
        A user group: a reusable limit template plus a shareable flag. Limits are
        nullable (null = the group sets no cap for that dimension). Non-secret
        metadata — zero-knowledge is unaffected.
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        files_quota_mb: { type: integer, nullable: true, description: "Files quota in MB (null = no group cap)." }
        gallery_quota_mb: { type: integer, nullable: true, description: "Gallery quota in MB (null = no group cap)." }
        max_connected_devices: { type: integer, nullable: true, description: "Device cap (null = no group cap)." }
        shareable: { type: boolean, description: "Members may offer this group as a share target." }
        modules:
          type: array
          nullable: true
          description: >
            Allow-list of enabled module keys for members of this group (null = all
            modules). A member's effective modules are the union across their groups
            (a group with null grants all); a per-user allow-list overrides. Enforced
            server-side and surfaced at /me as user.modules.
          items: { type: string, enum: [dashboard, files, gallery, passwords, notes, todos, bookmarks, contacts, finance, health, explore] }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              email: { type: string }

    MailAccount:
      type: object
      description: >
        A configured IMAP mail account for the archive sync (metadata only).
        NEVER carries a password — see the Mail tag description for why, and
        POST/PUT /mail/accounts for how a password is written without ever
        being read back.
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 200 }
        host: { type: string, maxLength: 255, description: "IMAP host. SSRF-guarded: link-local / cloud-metadata addresses are rejected (422)." }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, maxLength: 255 }
        encryption: { type: string, enum: [ssl, tls, starttls, none] }
        folders:
          type: array
          nullable: true
          items: { type: string, maxLength: 255 }
          description: "Which IMAP folders to sync (null = server default set)."
        backfill_since: { type: string, format: date, nullable: true, description: "Earliest arrival date to ARCHIVE (Option B). mbsync has no server-side date filter, so a sync still DOWNLOADS the whole mailbox — but only messages that arrived on/after this date are sealed + ledgered; older ones are dropped from the local scratch (origin mailbox untouched). Empty = archive everything." }
        delete_after_import: { type: boolean, description: "When true, each freshly archived message is deleted from the ORIGIN IMAP mailbox immediately after it is durably archived (UID STORE \\Deleted + EXPUNGE, one session per ingest chunk). Off by default — a destructive write-to-origin. Only newly archived (not previously-imported) messages are removed by this; use the manual bulk delete for already-archived mail still on the server." }
        enabled: { type: boolean }
        status: { type: string, enum: [idle, syncing, error], readOnly: true }
        last_error: { type: string, nullable: true, readOnly: true }
        last_synced_at: { type: string, format: date-time, nullable: true, readOnly: true }
        message_count: { type: integer, readOnly: true, description: "Count of this account's rows in the message ledger." }

    MailMessage:
      type: object
      description: >
        One archived message's LEDGER row — metadata only, never content (no
        subject/from/to/body). See the Mail tag description for the full
        client decrypt contract.
      properties:
        id:
          type: string
          format: uuid
          description: >
            Also the primary key of the sealed blob at GET /mail/raw/{id} —
            the message and its ciphertext bytes share one uuid, so no
            separate blob reference is ever needed.
        account_id: { type: integer, description: "The owning MailAccount's id." }
        folder: { type: string, description: "IMAP folder the message was archived from (e.g. INBOX)." }
        size: { type: integer, description: "Plaintext byte size of the original RFC822 message (metadata only — the server never stores or re-derives this from ciphertext)." }
        created_at: { type: string, format: date-time, description: "Hour-snapped archival time (never the exact arrival instant — same padding discipline as every other sealed module)." }
        sealed_key:
          type: string
          description: >
            JSON-encoded Store v3 §6.3 HybridEnvelope (X25519+ML-KEM-768,
            suite:1) wrapping the random per-message secretstream key to the
            OWNER's public identity keys. Opaque to the server; unwrap with
            hybridUnwrap using the caller's own identity secret keys.

    DisplayPreferences:
      type: object
      description: >
        Global, non-secret DISPLAY preferences — measurement units + 12/24h clock.
        Presentation only; the underlying data stays zero-knowledge. Returned in
        GET /me and set via POST /preferences; the client applies them to its own
        rendering (distances/elevations convert from canonical metres, times honour
        the clock format). Canonical storage is unchanged (metres, kg, °C, mg/dL).
      properties:
        distance: { type: string, enum: [km, mi] }
        elevation: { type: string, enum: [m, ft] }
        weight: { type: string, enum: [kg, lb] }
        temp: { type: string, enum: [c, f] }
        glucose: { type: string, enum: [mgdl, mmoll] }
        time_format: { type: string, enum: [24h, 12h] }
        mail_remote: { type: boolean, description: "Load remote content (external images/resources) in archived mail. Default false (blocks tracking pixels)." }
        mail_scripts: { type: boolean, description: "Run scripts in archived mail (in an isolated sandbox iframe, no app-origin access). Default false." }

    MeUser:
      type: object
      description: >
        The authenticated user's profile. Returned as the `user` object by GET /me
        and by POST /auth/pair/collect (when `status: approved`). All fields are
        non-secret metadata — zero-knowledge vault data is never included.
      required: [id, name, email, locale, groups, modules, has_avatar, preferences]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        locale:
          type: string
          description: "The user's UI locale (one of the configured languages, e.g. en, de, ru)."
        groups:
          type: array
          description: >
            Derived from the first-party role: `["admin"]` for admins, `[]` otherwise.
            The historical claim shape is kept so existing mobile clients need no
            change — there is no separate `role` field.
          items: { type: string }
        modules:
          type: array
          description: >
            The application module keys this account may use (per-user / per-group
            toggles). A native client should hide the tabs for modules NOT listed
            here; the API also enforces it — a disabled module's store endpoints
            return 403.
          items: { type: string, enum: [dashboard, files, gallery, passwords, notes, todos, bookmarks, contacts, finance, health, explore] }
        has_avatar:
          type: boolean
          description: "Whether a non-secret avatar is stored. True → fetch it via GET /api/v1/avatar (Bearer)."
        preferences:
          allOf:
            - $ref: "#/components/schemas/DisplayPreferences"
          description: "Non-secret display preferences (units + 12/24h clock); set via POST /api/v1/preferences."
        theme:
          type: string
          enum: [light, dark, system]
          description: "Current UI theme (set via POST /api/v1/theme)."

    HealthFast:
      type: object
      description: >
        One intermittent-fasting record inside the `health` module store, under the
        key `healthFasts` (array). DECRYPTED shape — the server never sees it. The
        ACTIVE fast is the one with `end: null`; only ONE fast may be active at a
        time. This is a cross-client invariant: web AND mobile MUST refuse to start a
        second fast while one is active, and MUST always show the running fast. The
        constraint is enforced client-side (the server can't read the sealed store)
        plus by the store's optimistic version — before starting, re-read the store
        (GET /store/health) to observe a fast started on another device, and never
        write a second `end: null` record. targetHours is the fasting window (the
        "X" in X:Y, e.g. 16 for 16:8); goal reached when elapsed ≥ targetHours.
      required: [id, start, targetHours]
      properties:
        id:
          type: string
          description: Client-generated UUID v4.
        start:
          type: string
          format: date-time
          description: ISO-8601 fast start.
        end:
          type: [string, "null"]
          format: date-time
          description: ISO-8601 end, or null while the fast is running (the active fast).
        targetHours:
          type: number
          description: Target fasting hours (e.g. 12, 14, 16, 18, 20). Goal met at elapsed ≥ this.
          example: 16
        note:
          type: string

    ExploreStoreModel:
      type: object
      description: >
        DECRYPTED shape of the `explore` module store (GET/PUT /store/explore).
        The server NEVER sees this — it stores only the sealed ciphertext in
        StoreResponse.ciphertext. This schema is the cross-client contract so the
        mobile app (and any client) reads/writes the same structure the web client
        does. Seal with the vault key using canonical JSON + Padmé + the suite
        envelope, exactly like the other module stores.
      properties:
        v:
          type: integer
          description: Schema version (currently 3).
          example: 3
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/ExploreTrack"
        couplings:
          type: object
          description: >
            Map of gallery-photo id → coupling. A photo is placed on the map by
            its own sealed EXIF lat/lng or, lacking that, by this coupling's
            interpolated position along a track.
          additionalProperties:
            $ref: "#/components/schemas/ExploreCoupling"
        settings:
          $ref: "#/components/schemas/ExploreSettings"

    ExploreTrack:
      type: object
      description: One GPS track (imported, planned, or mobile-recorded).
      required: [id, name, sourceFormat, points]
      properties:
        id:
          type: string
          description: Client-generated UUID.
        name:
          type: string
        note:
          type: string
          nullable: true
          description: Optional free-text note.
        sourceFormat:
          type: string
          description: >
            How the track originated. `recorded` = live on-device GPS recording
            (mobile); `planned` = hand-drawn/auto-routed in the planner; the rest
            are imported file formats.
          enum: [gpx, kml, kmz, tcx, fit, planned, recorded]
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        points:
          type: array
          description: Ordered track points.
          items:
            type: object
            required: [lat, lng]
            properties:
              lat:
                type: number
              lng:
                type: number
              ele:
                type: number
                nullable: true
                description: Elevation in metres (null for planned routes).
              t:
                type: integer
                nullable: true
                description: Epoch-ms timestamp (null for planned routes).
        importedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 set client-side when a track file was imported.
        surfaces:
          type: array
          nullable: true
          description: >
            OSM surface breakdown persisted from GraphHopper routing (planned
            tracks); null for imported/recorded. Same shape as /maps/route surfaces.
          items:
            type: object
            properties:
              surface: { type: string }
              distM: { type: number }
        stats:
          type: object
          nullable: true
          description: "Client-computed metrics from shared/track-parse.js computeStats."
          properties:
            distanceM: { type: number }
            durationTotalS: { type: number }
            durationMovingS: { type: number }
            ascentM: { type: number, nullable: true }
            descentM: { type: number, nullable: true }
            minEleM: { type: number, nullable: true }
            maxEleM: { type: number, nullable: true }
            avgSpeedMps: { type: number, nullable: true }
            maxSpeedMps: { type: number, nullable: true }
            pointCount: { type: integer }
            elevationProfile:
              type: array
              nullable: true
              items: { type: object, properties: { distM: { type: number }, eleM: { type: number } } }
        bbox:
          type: object
          nullable: true
          properties:
            minLat: { type: number }
            minLng: { type: number }
            maxLat: { type: number }
            maxLng: { type: number }
        rawBlobId:
          type: string
          nullable: true
          description: >
            Optional id of the sealed original file uploaded via POST
            /explore/upload (for later re-export). Null if not kept.
        rawBlobKey:
          type: string
          nullable: true
          description: Per-blob content key for rawBlobId (sealed in this record).
        createdAt:
          type: string
          format: date-time

    ExploreCoupling:
      type: object
      required: [trackId, source]
      properties:
        trackId:
          type: string
        source:
          type: string
          enum: [exif, interpolated, manual, none]
        lat:
          type: number
          nullable: true
          description: Interpolated position (present when source ≠ exif).
        lng:
          type: number
          nullable: true

    ExploreSettings:
      type: object
      description: Photo↔track coupling tolerances (client-side matching).
      properties:
        couplingTimeToleranceS:
          type: integer
          example: 3600
        couplingDistanceToleranceM:
          type: integer
          example: 100

    IdResponse:
      type: object
      description: Response containing the newly created resource id.
      required: [id]
      properties:
        id:
          type: string
          description: UUID of the new resource.
          example: 018f4b2e-1234-7abc-9def-000000000001

    OkResponse:
      type: object
      description: Acknowledgement response.
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    UsageResponse:
      type: object
      description: Current storage usage vs quota for the caller's scope.
      required: [used, quota]
      properties:
        used:
          type: integer
          description: Bytes currently stored.
          example: 104857600
        quota:
          type: integer
          description: >
            Maximum bytes allowed. `0` means unlimited (the server returns the
            integer 0, never null, for an uncapped module). Note this differs from
            GET /me `usage.quota`, which uses null for unlimited.
          minimum: 0
          example: 10737418240

    StoreVersionConflict:
      type: object
      description: >
        409 Conflict from a sealed manifest store (files/gallery/notes/passwords/
        invoices, /store/{module}, and the shared-vault store PUT /vaults/{vault}/store).
        The server is blind last-writer-wins on the opaque blob and CANNOT merge
        ciphertext, so avoiding data loss is 100% the client's responsibility:

        MANDATORY REBASE-MERGE — on 409 the client MUST (1) fetch the winning manifest,
        (2) compute ITS OWN delta between the base it loaded and its current copy, and
        (3) replay ONLY that delta onto the winner, then retry at the winner's version.
        It must NEVER re-PUT its whole stale copy — doing so silently drops every record
        the other writer (another tab / device / user of a shared vault) added, and
        orphans those records' sealed blobs (reclaimed after the grace window).

        The three value shapes MUST each merge exactly as below, or two clients diverge:

        (1) KEYED RECORD ARRAYS — key each element by this precedence: `id`, else
        `credentialId` (embedded passkeys), else `photoId`+`idx` composite (gallery
        person.faces). `seq` is NOT a key (it is a per-invoice counter, not unique —
        invoice versions carry their own `id`). Merge: keep the server's list, DROP the
        records you deleted (in base, absent from ours), UPSERT the records you
        added/changed. For a record BOTH sides changed since the base, DEEP-MERGE it
        field by field (recurse into its nested arrays/objects) — do NOT replace the
        whole record with your copy.

        (2) SCALAR ARRAYS (fields.urls[], album.photoIds[], tags[]) — merge as a
        SET-UNION: keep server members, drop the ones you deleted (base minus ours), add
        the ones you introduced (ours minus base). Both writers' additions survive.

        (3) OBJECT MAPS / ID-MAPS (sharing.knownFingerprints, explore.couplings,
        explore.settings, health.healthProfile) — merge KEY BY KEY: keep the server's
        value for keys you did not touch, take yours for keys you added or changed,
        DELETE keys present in base but absent in ours, and recurse with (1)/(3) when
        both sides changed a key whose value is a keyed array / nested object. Do NOT do
        whole-map last-writer-wins — that drops the other side's concurrently-added key.
        (SECURITY: dropping a sharing.knownFingerprints[user] entry silently disables the
        TOFU key-swap guard for that user — treat this merge as security-critical.)

        RECOVERY — if a record is nonetheless lost, GET /{store}/history to pull an
        earlier sealed root and re-merge it (see the history endpoints).
      required: [error]
      properties:
        error:
          type: string
          enum: [version_conflict]

    MissingShardResponse:
      type: object
      description: >
        422 from a sharded store save (files/gallery/notes/passwords/invoices) when a
        referenced shard blob has no ledger row — the server refuses to persist a root
        pointing at a shard that was never durably uploaded.
      required: [error]
      properties:
        error:
          type: string
          enum: [missing_shard]

    ShareVersionConflict:
      type: object
      description: >
        409 Conflict on a public-share update — the share record was modified
        concurrently. Carries the current version so the caller can retry with a
        fresh expected_version.
      required: [error, version]
      properties:
        error:
          type: string
          enum: [version_conflict]
        version:
          type: integer
          description: Current server-side share version.

    ChunkInitRequest:
      type: object
      description: Begin a chunked (S3 multipart) upload.
      required: [size]
      properties:
        size:
          type: integer
          minimum: 1
          maximum: 83886080000
          description: Total ciphertext size in bytes; checked against the quota before the upload starts.

    ChunkInitResponse:
      type: object
      required: [token, id, partSize]
      properties:
        token:
          type: string
          description: >
            Opaque upload-session token; pass it to every part/complete/abort call.
            The session lives in an evictable cache and EXPIRES ~12h after init (and may
            be evicted earlier). A part/complete/abort call for an unknown/expired session
            returns 404 — the client must then DISCARD this token and restart from
            /upload/init (already-uploaded parts are orphaned + grace-reclaimed). Complete
            promptly; do not span the upload across >12h.
        id:
          type: string
          format: uuid
          description: The blob id the completed upload will be stored under.
        partSize:
          type: integer
          description: Byte size each part (except the last) MUST be. Split the file on this boundary.
          example: 8388608

    ChunkPartResponse:
      type: object
      required: [part, etag]
      properties:
        part:
          type: integer
          description: Echoed 1-based part number.
        etag:
          type: string
          description: S3 ETag for this part; collect all of them and pass them back in the complete call.

    ChunkCompleteRequest:
      type: object
      description: >
        Finalise a chunked upload from the collected per-part ETags. `parts` MUST cover
        the FULL contiguous range 1..N with the exact ETag returned by every /upload/part
        call. The server does NOT validate completeness against the init `size` — an
        omitted or duplicated part yields a shorter, SILENTLY CORRUPT blob that fails to
        decrypt on download (permanent, undetectable loss). complete is idempotent + safe
        to retry with the same token+parts (e.g. after a lost response); do NOT call
        /upload/abort to "clean up" after a possibly-succeeded complete — abort is a no-op
        once the session is gone and does NOT remove an already-registered blob.
      required: [token, parts]
      properties:
        token:
          type: string
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [part, etag]
            properties:
              part:
                type: integer
                minimum: 1
              etag:
                type: string

    ClipEmbedding:
      type: array
      nullable: true
      description: >
        Raw CLIP embedding as a JSON array of floats (NOT base64). Null when ML was
        skipped or unavailable. The client re-encrypts it before storing.
      items:
        type: number

    FaceItem:
      type: object
      description: One detected face.
      required: [score, box]
      properties:
        score:
          type: number
          description: Detection confidence.
        box:
          type: array
          minItems: 4
          maxItems: 4
          description: Bounding box [x, y, w, h].
          items:
            type: number
        embedding:
          allOf:
            - $ref: "#/components/schemas/ClipEmbedding"
          description: Raw face embedding (JSON float array, not base64).
        crop:
          type: string
          nullable: true
          description: Base64-encoded face crop image.

    PlaceInfo:
      type: object
      description: >
        Reverse-geocoded place. Always an object (possibly empty `{}` when geocoding
        did not run); never a bare string.
      properties:
        display:
          type: string
          nullable: true
          description: Human-readable place label.
        address:
          type: object
          description: Structured address components (key→value strings).

    StoreResponse:
      type: object
      description: Opaque sealed manifest + optimistic-concurrency version counter.
      required: [version]
      properties:
        ciphertext:
          type: string
          nullable: true
          description: >
            Opaque sealed ciphertext (XChaCha20-Poly1305, Padme-padded). The server
            never reads this value. Null on first access before any write.
        version:
          type: integer
          description: Monotone version counter used for optimistic concurrency.
          example: 42

    SharedStoreResponse:
      type: object
      description: Sealed manifest for a shared vault, with optimistic-concurrency version.
      required: [version]
      properties:
        sealed_manifest:
          type: string
          nullable: true
          description: >
            Opaque sealed ciphertext encrypted under the vault's VK_vault.
            The server never reads this value. Null before the first write.
        version:
          type: integer
          description: Monotone version counter for optimistic concurrency.
          example: 7

    VersionResponse:
      type: object
      description: New version counter returned after a successful store write.
      required: [version]
      properties:
        version:
          type: integer
          description: Updated version counter.
          example: 43

    ConflictResponse:
      type: object
      description: >
        409 Conflict — another client wrote the store concurrently. Carries the current
        server state (version + sealed_manifest) so the caller can rebase.

        MANDATORY REBASE-MERGE (shared-vault store): two DIFFERENT members may edit the
        same shared vault manifest {name, items[]} concurrently. On 409 the client MUST
        decrypt sealed_manifest, replay ONLY its own delta (base→ours) onto it by record
        id, deep-merging a record both sides changed, and re-seal at the returned
        version — it must NEVER re-PUT its whole decrypted copy, which silently clobbers
        the other member's committed items and orphans their sealed blobs. Same merge
        rules as StoreVersionConflict. There is no shared-vault history recovery net, so
        a clobber here is unrecoverable.
      required: [version]
      properties:
        version:
          type: integer
          description: Current server-side version.
          example: 43
        ciphertext:
          type: string
          nullable: true
          description: Current sealed ciphertext (personal store conflict).
        sealed_manifest:
          type: string
          nullable: true
          description: Current sealed manifest (shared vault store conflict).

    TokenResponse:
      type: object
      description: Public share link token.
      required: [token, version]
      properties:
        token:
          type: string
          description: URL-safe token that identifies the share link.
          example: a1b2c3d4e5f6
        version:
          type: integer
          description: >
            Optimistic-concurrency version of the share record. Echo it as
            expected_version on the next update to avoid clobbering a concurrent edit.

    VaultResponse:
      type: object
      description: KDF parameters and wrapped vault key material for vault unlock.
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether the caller has set up a vault.
        version:
          type: integer
          description: >
            Optimistic-concurrency version. Echo it as expected_version when
            rotating (PUT /vault) so a stale passphrase change is rejected (409)
            instead of clobbering a concurrent rotate on another device.
        salt:
          type: string
          nullable: true
          description: Argon2id salt (base64). Null when not configured.
        kdf_ops:
          type: integer
          nullable: true
          description: Argon2id opslimit parameter.
          example: 4
        kdf_mem:
          type: integer
          nullable: true
          description: Argon2id memlimit parameter (bytes).
          example: 268435456
        wrapped_vault_key:
          type: string
          nullable: true
          description: >
            Opaque vault-key wrap ciphertext. Server never reads this value.
        wrap_nonce:
          type: string
          nullable: true
          description: Nonce used for the wrapped vault key (base64).
        has_recovery:
          type: boolean
          nullable: true
          description: Whether a recovery key wrap is present.
        wrapped_vault_key_recovery:
          type: string
          nullable: true
          description: >
            Optional recovery-wrap of the vault key. Opaque ciphertext.
        recovery_nonce:
          type: string
          nullable: true
          description: Nonce used for the recovery-key wrap (base64).

    # ======================================================================
    # DECRYPTED store data models (ZERO-KNOWLEDGE)
    # ----------------------------------------------------------------------
    # The server NEVER sees these — it stores only the opaque sealed ciphertext
    # of each store. They are documented so native clients (iOS/Android/Go) can
    # build the modules against a precise contract (like HealthFast/ExploreTrack).
    # RULE: a client writing a store back MUST preserve every unknown key it did
    # not author (passthrough) — a dropped key is silent data loss for other
    # clients. `trashed` is a shared convention: false = active, ISO-8601 string
    # = trashed-at timestamp.
    # ======================================================================

    NoteRecord:
      type: object
      description: >
        One note inside the sharded notes store (root {v:3, notes:[NoteRecord]},
        GET/PUT /notes/store + record shards via /notes/raw). No content-attachment
        blobs — `content` is inline markdown in the shard ciphertext.
      required: [id, title, content, tags, pinned, trashed, updated]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string, description: "Markdown body (rendered client-side)." }
        tags: { type: array, items: { type: string } }
        pinned: { type: boolean }
        trashed: { type: [boolean, string], description: "false, or ISO-8601 trashed-at timestamp." }
        updated: { type: string, format: date-time, description: "Set on every mutation; sort is pinned-first then updated desc." }

    TodoRecord:
      type: object
      description: >
        One task in the todos module store (GET/PUT /store/todos; sealed shape
        {v:3, todos:[TodoRecord], todoLists:[TodoList]}). Client sort: done asc →
        marked desc → priority(high,normal,low) → due asc.
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        url: { type: string, description: "http(s) only (sanitized client-side); empty when absent." }
        tags: { type: array, items: { type: string } }
        priority: { type: string, enum: [high, normal, low] }
        marked: { type: boolean, description: "Starred/flagged." }
        due: { type: string, description: "ISO-8601 datetime or empty string." }
        done: { type: boolean }
        listId: { type: [string, "null"], format: uuid, description: "TodoList.id, or null = inbox." }
        trashed: { type: [boolean, string] }

    TodoList:
      type: object
      description: "A named list in the todos store (key todoLists). Deleting a list sets member tasks' listId=null (tasks are not deleted)."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    BookmarkRecord:
      type: object
      description: "One bookmark in the bookmarks module store (GET/PUT /store/bookmarks; keys bookmarks[] + folders[])."
      required: [id, title, url]
      properties:
        id: { type: string, format: uuid }
        folderId: { type: [string, "null"], format: uuid, description: "Parent BookmarkFolder.id, or null = root." }
        title: { type: string }
        url: { type: string, format: uri }
        description: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        favorite: { type: boolean, default: false }
        readLater: { type: boolean, default: false }
        read: { type: boolean, default: false }
        trashed: { type: [boolean, string] }

    BookmarkFolder:
      type: object
      description: "Nestable bookmark folder (key folders). `icon` is an opaque icon-name string (web maps it to an SVG; native may ignore)."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: [string, "null"], format: uuid }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }

    ContactRecord:
      type: object
      description: >
        One contact in the sharded contacts store (GET/PUT /contacts/store, key
        contacts[] — one shard blob per record). Avatar: `avatarRef` is a contact-blob UUID (GET /contacts/raw/{avatarRef});
        decrypt the bytes with `avatarKey` (a sealed content key, unwrapped under the vault
        key like a file blob). `personId` links to a Gallery person (written into BOTH stores).
        `_x` round-trips unknown vCard X-properties. `bdayNotified`/`annivNotified` are
        client dedup guards (last year notified) — persist them to avoid double-firing.
      required: [id]
      properties:
        id: { type: string, format: uuid }
        uid: { type: string, description: "vCard UID." }
        fn: { type: string, description: "Formatted full name." }
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        middle: { type: string, nullable: true }
        prefix: { type: string, nullable: true }
        suffix: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        org: { type: string, nullable: true }
        department: { type: string, nullable: true }
        title: { type: string, nullable: true }
        role: { type: string, nullable: true }
        vatId: { type: string, nullable: true }
        emails: { type: array, items: { type: object, properties: { value: { type: string }, type: { type: string, enum: [home, work, other] } } } }
        phones: { type: array, items: { type: object, properties: { value: { type: string }, type: { type: string, enum: [cell, work, home, other] } } } }
        impp: { type: array, description: "Instant messaging (vCard IMPP).", items: { type: object, properties: { value: { type: string }, type: { type: string } } } }
        addresses: { type: array, items: { type: object, properties: { street: { type: string }, city: { type: string }, region: { type: string }, zip: { type: string }, country: { type: string }, type: { type: string, enum: [home, work, other] } } } }
        urls: { type: array, items: { type: object, properties: { value: { type: string }, type: { type: string } } } }
        bday: { type: string, nullable: true, description: "yyyy-mm-dd." }
        anniversary: { type: string, nullable: true, description: "yyyy-mm-dd." }
        note: { type: string, nullable: true }
        categories: { type: array, items: { type: string }, description: "Tags / vCard CATEGORIES." }
        favorite: { type: boolean, default: false }
        avatarRef: { type: [string, "null"], format: uuid, description: "Contact-blob UUID for the encrypted avatar." }
        avatarKey: { type: [string, "null"], description: "Sealed content key for the avatar blob (null = no avatar)." }
        personId: { type: [string, "null"], format: uuid, description: "Linked Gallery person id (cross-manifest)." }
        personName: { type: [string, "null"] }
        _x: { type: array, items: { type: string }, description: "Passthrough unknown vCard X-properties — round-trip unchanged." }
        trashed: { type: [boolean, string] }
        updated: { type: string, format: date-time }
        bdayNotified: { type: [integer, "null"], description: "Last year a birthday notification was sent." }
        annivNotified: { type: [integer, "null"] }

    CustomField:
      type: object
      description: "User-defined field on a SecretItem."
      required: [label, value, kind]
      properties:
        label: { type: string }
        value: { type: string }
        kind: { type: string, enum: [text, secret, multiline, url] }

    PasskeyCredential:
      type: object
      description: "A WebAuthn passkey — standalone (type=passkey) or embedded in a login/password item's fields.passkeys[]."
      required: [credentialId, privateKey, rpId]
      properties:
        credentialId: { type: string, description: "base64url." }
        privateKey: { type: string, description: "P-256 private JWK (JSON). SECRET — masked in history, never rendered." }
        publicKey: { type: string, description: "P-256 public JWK (JSON)." }
        rpId: { type: string }
        rpName: { type: string }
        userHandle: { type: string }
        userName: { type: string }
        userDisplayName: { type: string }
        alg: { type: integer, description: "COSE alg, -7 (ES256)." }
        signCount: { type: integer, default: 0 }
        createdAt: { type: string, format: date-time }

    VersionEntry:
      type: object
      description: "One prior revision in a SecretItem's versions[] (cap 100). Secret fields are masked as '(changed)' in history."
      required: [at]
      properties:
        at: { type: string, format: date-time }
        title: { type: string }
        fields: { type: object, description: "Snapshot of fields (secret keys masked)." }
        custom: { type: array, items: { $ref: "#/components/schemas/CustomField" } }

    SecretItem:
      type: object
      description: >
        One vault item in the passwords store. `fields` is keyed by `type`:
        login {username,password*,urls[],totp*,note, passkeys?[]};
        password {password*,note, passkeys?[]};
        card {cardholder,number,expiry "MM/YY",cvv*,pin*,note};
        wifi {ssid,password*,security(enum nopass|WEP|WPA|WPA2|WPA3|WPA2-Enterprise|WPA3-Enterprise),hidden,note};
        license {product,licensekey*,owner,email,note};
        server {host,port,username,password*,note};
        passkey {see PasskeyCredential fields};
        identity {firstName,lastName,email,phone,company,street,city,state,zip,country,note};
        secure_note {note}.
        SECRET fields (*): password,totp,cvv,pin,licensekey,privateKey (+passkeys,publicKey masked in history).
        `fields.totp` may be an otpauth:// URI OR a raw base64 HMAC-SHA1 secret.
        `fields.urls` is a string[] (multi-URL logins). `icon` is a data: URI (from
        /passwords/icon) stored sealed — never re-upload it raw.
      required: [id, type, title]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [login, password, card, wifi, license, server, passkey, identity, secure_note] }
        title: { type: string }
        favorite: { type: boolean }
        folder: { type: [string, "null"], format: uuid, description: "PersonalVault.id (personal items). Shared-vault items omit this / set null." }
        tags: { type: array, items: { type: string } }
        custom: { type: array, items: { $ref: "#/components/schemas/CustomField" } }
        icon: { type: [string, "null"], description: "data: URI favicon (stored sealed)." }
        fields: { type: object, description: "Per-type field dictionary (see description); may contain passkeys[] on login/password." }
        versions: { type: array, items: { $ref: "#/components/schemas/VersionEntry" }, description: "Cap 100." }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        trashed: { type: [string, "null"], format: date-time, description: "null = active; ISO string = trashed-at." }

    PersonalVault:
      type: object
      description: "A personal password vault (secretFolders[] in the passwords manifest). role is always 'manage' for the owner."
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [read, edit, manage] }

    PasswordsStoreModel:
      type: object
      description: "Decrypted root of the sharded passwords store. Preserve pwVaultMigrated (and any unknown keys) on write."
      properties:
        secrets: { type: array, items: { $ref: "#/components/schemas/SecretItem" } }
        secretFolders: { type: array, items: { $ref: "#/components/schemas/PersonalVault" } }
        pwVaultMigrated: { type: boolean, description: "Durable one-time migration flag — MUST be preserved on PUT." }

    SharingStoreModel:
      type: object
      description: >
        Decrypted `sharing` module store (GET/PUT /store/sharing), shared by Passwords
        + Files. `knownFingerprints` is the TOFU map read before every invite to detect
        a recipient key-swap.
      properties:
        knownFingerprints:
          type: object
          description: "Map userId(string) → public-key fingerprint (hex)."
          additionalProperties: { type: string }

    HealthProfile:
      type: object
      description: "Personal health profile (health store key healthProfile). Canonical storage; units drive display only."
      properties:
        birthdate: { type: string, nullable: true, description: "YYYY-MM-DD; empty = unset." }
        heightCm: { type: number, nullable: true }
        sex: { type: string, nullable: true, description: "'m' | 'f' | ''." }
        weightGoalKg: { type: number, nullable: true }
        units:
          type: object
          properties:
            weight: { type: string, enum: [kg, lb] }
            glucose: { type: string, enum: [mgdl, mmoll] }
            temp: { type: string, enum: [c, f] }

    HealthEntry:
      type: object
      description: "One measurement (health store key healthEntries[]). Values are canonical (kg/mmHg/bpm/%/°C/mg-dL); display conversion is client-only."
      required: [id, metric, v, ts]
      properties:
        id: { type: string, format: uuid }
        metric: { type: string, enum: [weight, bp, pulse, spo2, temp, glucose] }
        v: { type: number, description: "Primary value (canonical unit)." }
        v2: { type: number, nullable: true, description: "Diastolic mmHg for metric=bp; null otherwise." }
        ts: { type: string, format: date-time }
        note: { type: string, nullable: true }

    InvoiceRecord:
      type: object
      description: >
        One invoice in the sharded invoices store. Numbering (number/seq) is GoBD per-year,
        derived client-side. `pdf` present for imported invoices (original sealed PDF).
        A finalized (sent/paid) or imported invoice is a fixed record: editing it appends a
        versioned correction to `versions[]` (see InvoiceVersion) with `versionSeq` counting
        up — clients MUST carry `versions[]`/`versionSeq` through unchanged (ZK passthrough)
        or history is lost.

        NUMBERING IS A CROSS-CLIENT INVARIANT (GoBD unique + gapless): before assigning a
        number on finalize/mark-sent/import, the client MUST first re-read (refresh+merge)
        the store to observe invoices numbered on another device, then take
        next = max(seq for that year) + 1 (>= the company floor). The server cannot enforce
        this on the sealed store, and the id-keyed 409 rebase keeps BOTH invoices when two
        devices mint the same number — so the client MUST also surface a warning if a
        duplicate per-year number ever results (it cannot be silently deduped).
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: [string, "null"], description: "GoBD number, e.g. 2026-0007." }
        seq: { type: integer, description: "Per-year sequence." }
        status:
          type: string
          enum: [draft, final, sent, paid]
          description: >
            draft (Entwurf, no number, not counted) → final (Offen: numbered + GoBD-frozen,
            counts as revenue, NOT yet sent) → sent (Gesendet) → paid (Bezahlt). SET IT VIA
            THE STORE, NOT A DEDICATED ENDPOINT (zero-knowledge — the server can't read the
            status): mutate this field on the record and PUT the whole sharded store
            (PUT /api/v1/invoices/store). The finalize/mark-sent/mark-paid flows and the
            manual status override are all just this field write. Rules the client MUST honour:
            (a) moving to any non-draft state assigns the GoBD number first if missing
            (see the numbering invariant above); (b) a NUMBERED invoice must NEVER go back to
            'draft' (breaks the gapless series); (c) set `paidAt` when → paid, clear it when
            leaving paid (drives VAT/statistics); (d) append a `versions[]` entry for the
            change (GoBD audit trail) like any edit to a numbered invoice.
        issueDate: { type: string, description: "YYYY-MM-DD." }
        dueDate: { type: string }
        currency: { type: string }
        lang: { type: string }
        customer: { type: object, description: "May carry additional passthrough keys — preserve unknown keys on write.", properties: { name: { type: string }, attn: { type: string }, address: { type: string }, email: { type: string }, vatId: { type: string }, contactId: { type: string, format: uuid }, partnerId: { type: [string, "null"], format: uuid, description: "Linked FinancePartner.id — preserve it or the invoice loses its business-partner link." } } }
        lines: { type: array, items: { type: object, properties: { desc: { type: string }, qty: { type: number }, unit: { type: string }, unitPrice: { type: number }, vatRate: { type: number } } } }
        note: { type: string }
        footer: { type: string }
        totals: { type: object, description: "Frozen on finalize.", properties: { net: { type: number }, vat: { type: number }, gross: { type: number }, vatByRate: { type: object } } }
        paidAt: { type: string, nullable: true }
        paymentAccount: { type: [string, "null"], format: uuid, description: "PaymentMethod.id." }
        paymentTxId: { type: [string, "null"], format: uuid, description: "InvoiceTransaction.id." }
        imported: { type: boolean }
        pdf: { type: object, nullable: true, description: "Sealed original PDF blob ref (imported invoices).", properties: { blob: { type: string, format: uuid }, key: { type: string }, name: { type: string }, mime: { type: string } } }
        versionSeq: { type: integer, description: "Running version counter (last assigned). Increments per versioned correction." }
        versions: { type: array, items: { $ref: "#/components/schemas/InvoiceVersion" }, description: "GoBD correction trail — one entry per save of a locked invoice." }
        gross: { type: [number, "null"], description: "IMPORTED invoices only: the exact printed gross. computeTotals/invoiceTotals TRUST it verbatim (derive net/vat from it) — a client must preserve it or the imported invoice's totals change. Online-created invoices derive totals from lines[] and omit it." }
        vatRate: { type: [number, "null"], description: "IMPORTED invoices only: the VAT rate paired with `gross`. Preserve alongside gross." }
        minimal: { type: boolean, description: "IMPORTED invoices only: rendered in the minimal imported-invoice view (fields-only, no line editor). Passthrough." }
        trashed: { type: [boolean, string] }
        updated: { type: string, format: date-time }

    InvoiceVersion:
      type: object
      description: >
        One versioned correction of a locked invoice (versions[]). Created on each save of an
        imported or finalized invoice, plus automatically at the finalize/sent/paid lock
        points. `reason` is mandatory (stored). `snapshot` is the invoice's editable fields at
        that version. Imported invoices keep field data only (the original `pdf` stays
        authoritative); online-created invoices additionally seal a generated PDF of the sheet
        (rastered client-side — never server-rendered). Label counts up as
        `<invoice number>-NNN` (e.g. 2026-0007-001, -002).
      required: [id, seq, label, reason, at, snapshot]
      properties:
        id: { type: string, format: uuid, description: "Stable random id — the 409 rebase merge key for versions[]. MANDATORY: `seq` is a per-invoice counter (NOT globally unique), so keying the merge on seq would let two devices versioning the same invoice concurrently overwrite each other's committed version + orphan its sealed PDF. Always mint a fresh id per version." }
        seq: { type: integer, description: "1-based version index (= InvoiceRecord.versionSeq at creation). Display/label only — NOT a merge key." }
        label: { type: string, description: "`<number>-NNN`, e.g. 2026-0007-001." }
        reason: { type: string, description: "Mandatory change reason (auto for lock-point commits: Finalized/Sent/Marked paid)." }
        at: { type: string, format: date-time }
        snapshot: { type: object, description: "Frozen editable fields at this version (number/status/dates/currency/lang/customer/lines/note/footer + totals)." }
        pdf: { type: object, nullable: true, description: "Sealed generated PDF of this version (online-created invoices only). Fetch via /invoices/raw/{blob}, decrypt with key.", properties: { blob: { type: string, format: uuid }, key: { type: string }, name: { type: string }, mime: { type: string } } }

    InvoiceTransaction:
      type: object
      description: "A bank booking (transactions[] collection) bound to a PaymentMethod via `account`. amount is signed (negative = out)."
      required: [id, account, date, amount]
      properties:
        id: { type: string, format: uuid }
        account: { type: string, format: uuid, description: "PaymentMethod.id." }
        date: { type: string, description: "YYYY-MM-DD." }
        valueDate: { type: string }
        amount: { type: number, description: "Signed." }
        currency: { type: string }
        purpose: { type: string }
        counterparty: { type: string }
        iban: { type: string }
        bic: { type: string }
        bookingText: { type: string }
        eref: { type: string, description: "SEPA end-to-end reference." }
        sig: { type: string, description: "Dedup signature (date+amount+counterparty+purpose / EREF)." }
        type: { type: string, enum: [card, debit, credit, standingorder, fee, transfer, other] }
        vatCat: { type: string, enum: ["19", "16", "7", "0", "private", ""], description: "VAT category; 'private' = drawing/deposit, excluded from VAT." }
        category: { type: string, description: "From CSV import." }
        projectId: { type: [string, "null"], format: uuid }
        invoiceId: { type: [string, "null"], format: uuid }
        invoiceNumber: { type: [string, "null"] }
        receipts: { type: array, items: { $ref: "#/components/schemas/InvoiceReceipt" } }

    InvoiceReceipt:
      type: object
      description: "A document attached to a booking (receipts[] on InvoiceTransaction). Bytes are a sealed blob (/invoices/raw/{blob}, decrypt with key). OCR/recognition fields are filled client-side."
      required: [id]
      properties:
        id: { type: string, format: uuid }
        blob: { type: string, format: uuid }
        key: { type: string, description: "Sealed content key for the blob." }
        name: { type: string }
        trashed: { type: [boolean, string, "null"], description: "Soft-trash marker (truthy = in the receipt trash). Preserve as passthrough — dropping it un-trashes a soft-deleted receipt on the next write." }
        mime: { type: string }
        sig: { type: string, description: "{size}:{sha256(head‖tail)} dedup signature." }
        ocr: { type: string, description: "Extracted text (client-side; up to 200k chars)." }
        categories: { type: array, items: { type: string }, description: "One or more categories for this receipt (multi-category). The web client migrates the legacy single `category` string into this array on load." }
        category: { type: string, description: "DEPRECATED — legacy single category; migrated into categories[0]. Prefer `categories[]`." }
        tags: { type: array, items: { type: string } }
        merchant: { type: string }
        date: { type: string }
        total: { type: number }
        number: { type: string }
        vat: { type: string, enum: ["19", "16", "7", "0"] }
        currency: { type: string }
        contactId: { type: [string, "null"], format: uuid }
        contactName: { type: string }
        partnerId: { type: [string, "null"], format: uuid }
        partnerName: { type: string }
        note: { type: string }
        locked: { type: boolean, description: "Auto-attached from a matched invoice — not user-deletable." }
        kind: { type: string, enum: [invoice, eigenbeleg], description: "'invoice' = auto-attached invoice receipt; 'eigenbeleg' = self-issued voucher (see eigenbeleg)." }
        projectId: { type: [string, "null"], format: uuid }
        eigenbeleg:
          type: object
          description: "Present when kind='eigenbeleg'. The self-receipt's fields (client-generated PDF blob is on blob/key). Mirrors the German paper Eigenbeleg. recipient/address/net/vat/reason are only meaningful for a lost-receipt business expense (grund='betriebsausgabe'); no input-VAT deduction."
          properties:
            grund: { type: string, enum: [privatentnahme, privateinlage, trinkgeld, betriebsausgabe, sachgeschenk, sonstiges], description: "Beleggrund (reason type)." }
            grundOther: { type: string, description: "Free text when grund='sonstiges'." }
            recipient: { type: string, description: "Payee (business expense only)." }
            address: { type: string }
            ort: { type: string, description: "Place (Ort) for the signature block." }
            buchungstext: { type: string, description: "Note / remark." }
            date: { type: string, description: "Date of expense (YYYY-MM-DD)." }
            createdAt: { type: string, description: "Date the voucher was issued." }
            gross: { type: number }
            vatRate: { type: number }
            net: { type: number }
            vat: { type: number }
            reason: { type: string, description: "Why no original receipt exists (business expense)." }
            issuer: { type: string }
            signature: { type: string, description: "Simple electronic signature drawn on-device (PNG data URL), embedded into the sealed PDF. Empty = not yet signed. A simple e-signature is legally sufficient for an Eigenbeleg (no statutory written form); the sealed immutable blob satisfies GoBD. SIGN QUEUE (ZK): there is deliberately NO server endpoint listing unsigned vouchers (the server cannot read the sealed store). A client builds the 'to sign' queue itself from GET /api/v1/invoices/store — every transactions[].receipts[] with kind='eigenbeleg' and an empty signature — lets the user sign each on the phone, then writes signature back (and re-uploads the regenerated PDF blob) via PUT /api/v1/invoices/store + POST /api/v1/invoices/upload." }

    PaymentMethod:
      type: object
      description: "A payment means (paymentMethods[] collection). Sensitive (IBAN/card) — sealed. Exactly one may be the business account."
      required: [id, type, label]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        label: { type: string }
        holder: { type: string }
        iban: { type: string }
        bic: { type: string }
        bankName: { type: string }
        accountNumber: { type: string }
        url: { type: string, description: "Bank website (used to fetch icon)." }
        icon: { type: string, description: "data: URI logo/favicon (sealed)." }
        cardNetwork: { type: string, enum: [visa, mastercard, amex, other] }
        cardNumber: { type: string }
        cardExpiry: { type: string, description: "MM/YY." }
        email: { type: string, description: "PayPal address." }
        business: { type: boolean, description: "The single business account (reconciled with invoices)." }
        note: { type: string }
        trashed: { type: boolean }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }

    FinanceProject:
      type: object
      description: "A nestable cost project (projects[] collection). Totals roll up the tree; `kind` splits statistics business vs private (a sub-project inherits its root's kind)."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [business, private] }
        note: { type: string }
        expenses:
          type: array
          description: "Manual (hand) expenses not tied to a bank booking."
          items: { type: object, properties: { id: { type: string, format: uuid }, amount: { type: number }, date: { type: string }, account: { type: string, format: uuid }, category: { type: string }, note: { type: string } } }

    FinancePartner:
      type: object
      description: "A business partner (partners[] collection); doubles as a learned merchant→category rule via `category`. Contact details are optional; `logo` is a data: URI fetched from `url` via the SSRF-guarded favicon proxy (non-secret, sealed with the store). A partner may hold multiple contact persons in `contacts[]`; the legacy single `contact` string is migrated into `contacts[0]` client-side (kept for back-compat)."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contact: { type: string, description: "DEPRECATED — legacy single contact person; migrated into contacts[0]. Prefer `contacts[]`." }
        contacts:
          type: array
          description: "Contact persons (Ansprechpartner) for this partner. On invoice import the chosen contact person is written to the invoice's customer.attn."
          items:
            type: object
            required: [name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              phone: { type: string }
              role: { type: string, description: "Function/position." }
        url: { type: string, description: "Website; the logo is fetched from its host." }
        logo: { type: string, description: "data: URI logo/favicon (sealed)." }
        address: { type: string }
        email: { type: string }
        invoiceEmail: { type: string, description: "Billing email — used as the invoice customer's email when this partner is picked for an invoice (prefers over `email`)." }
        hourlyRate: { type: [number, "null"], description: "Default hourly rate; on picking this partner it seeds new invoice lines and back-fills existing lines whose unit price is still 0." }
        currency: { type: string, description: "Default currency (ISO 4217); on picking this partner it sets the invoice currency." }
        phone: { type: string }
        vatId: { type: string, description: "VAT identification number (USt-IdNr.)." }
        category: { type: string, description: "Learned default category for this merchant." }
        note: { type: string }

    FinanceCategory:
      type: object
      description: "A custom expense category (financeCategories[] collection)."
      required: [name]
      properties:
        name: { type: string }

    GalleryPhoto:
      type: object
      description: >
        One photo/video hot-record in the sharded gallery manifest. Rendition refs are
        FLAT fields ({rendition}Ref = sealed blob id at /gallery/raw/{ref}; {rendition}Key
        = its sealed content key). Heavy EXIF/GPS live in the sealed meta blob; the
        hot-record carries the fields the grid needs.
      required: [id]
      properties:
        id: { type: string, format: uuid }
        originalRef: { type: string, format: uuid, description: "Original blob id." }
        originalKey: { type: string, description: "Sealed content key for the original." }
        thumbRef: { type: string, format: uuid }
        thumbKey: { type: string }
        mediumRef: { type: string, format: uuid }
        mediumKey: { type: string }
        motionRef: { type: [string, "null"], format: uuid, description: "Motion-photo / Live-Photo clip blob (null if none)." }
        motionKey: { type: [string, "null"], description: "Sealed content key for motionRef — MUST be round-tripped as passthrough alongside motionRef, or the motion clip is undecryptable." }
        faceCropRefs: { type: array, items: { type: string, format: uuid }, description: "Per-face crop blob refs. This is the SOLE field driving the crop-blob reconcile live-set — a client that drops it on write orphans the crop blobs (swept after grace). Passthrough." }
        duration: { type: [number, "null"], description: "Video duration seconds (null for stills). Hot-record passthrough." }
        content_id: { type: [string, "null"], description: "Stable content identifier (dedup/motion pairing). Hot-record passthrough." }
        metaRef: { type: [string, "null"], format: uuid, description: "Sealed EXIF/GPS meta blob." }
        metaKey: { type: [string, "null"] }
        taken_at: { type: [string, "null"], description: "EXIF capture time (falls back to created)." }
        created: { type: string, description: "Upload time." }
        lat: { type: [string, "null"], description: "dec6 decimal string." }
        lng: { type: [string, "null"] }
        camera: { type: [string, "null"] }
        exifEdited: { type: boolean, description: "MANDATORY write-side guard. A client that lets the user change the capture date MUST set this true when writing taken_at. Otherwise another client's viewer self-heal re-reads the original date from the sealed EXIF meta blob and silently reverts the user's edit." }
        geoEdited: { type: boolean, description: "MANDATORY write-side guard. A client that sets OR clears the location MUST set this true. Otherwise the viewer self-heal re-fills the deliberately-cleared coordinates from the EXIF meta blob and reverts the edit." }
        geoChecked: { type: boolean, description: "Coordinates have been resolved (or known-absent); passthrough hot field." }
        caption: { type: string, description: "Free-text caption." }
        media_type: { type: string }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        phash: { type: [integer, "null"] }
        album: { type: [string, "null"], format: uuid }
        favorite: { type: boolean }
        trashed: { type: [boolean, string] }

    GalleryPerson:
      type: object
      description: "A face cluster (People). Bidirectionally linked to a ContactRecord (personId there, contact fields cached here). Preserve cached fields on passthrough."
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hidden: { type: boolean, description: "User hid this cluster from the People view. Passthrough." }
        pinned: { type: boolean, description: "Manually anchored — seeds every future face rescan by id + centroid (a rescan does NOT reassign a pinned id). Passthrough." }
        centroid: { type: array, items: { type: number }, description: "Face-embedding vector (positional; ~512 floats). On a 409 rebase this is last-writer-wins, NOT set-unioned — it is a vector, not a set. Passthrough." }
        contactId: { type: [string, "null"], format: uuid }
        contactName: { type: string }
        contactAvatarRef: { type: [string, "null"] }
        contactAvatarKey: { type: [string, "null"] }
        faces: { type: array, items: { type: object, properties: { photoId: { type: string, format: uuid }, idx: { type: integer }, cropRef: { type: string }, cropKey: { type: string }, manual: { type: boolean } } } }

    GalleryAlbum:
      type: object
      description: "A user album in the gallery manifest."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photoIds: { type: array, items: { type: string, format: uuid }, description: "Album membership — GalleryPhoto.id list. On a 409 rebase this array merges as a SET-UNION honouring deletions (both devices' concurrent additions survive); do NOT last-writer-wins it." }
        cover: { type: [string, "null"], format: uuid, description: "GalleryPhoto.id used as cover." }
        created: { type: string, format: date-time }

    FileRecord:
      type: object
      description: >
        One file in the sharded files store. Content is a sealed blob (/files/raw/{blob},
        decrypt with encFileKey). Shared-folder files instead live in the SharedVault
        folder manifest and use /vaults/{vault}/blobs/*.
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parent: { type: [string, "null"], format: uuid, description: "FileFolder.id, or null = root." }
        blob: { type: string, format: uuid }
        encFileKey: { type: string, description: "Sealed per-file content key." }
        size: { type: integer }
        mime: { type: string }
        versions: { type: array, items: { $ref: "#/components/schemas/FileVersion" } }
        created: { type: string, format: date-time }
        trashed: { type: [boolean, string] }

    FileVersion:
      type: object
      description: "A prior file version (versions[]). Capped by the user's file_max_versions setting."
      required: [id, blob]
      properties:
        id: { type: string, format: uuid }
        blob: { type: string, format: uuid }
        encFileKey: { type: string }
        size: { type: integer }
        mime: { type: string }
        name: { type: string }
        created: { type: string, format: date-time }

    FileFolder:
      type: object
      description: "A folder in the files store (fileFolders collection)."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parent: { type: [string, "null"], format: uuid }
        created: { type: string, format: date-time }

    HybridEnvelope:
      type: object
      description: "Store v3 §6.3 PQ-hybrid wrap (X25519+ML-KEM-768). Used for wrapped_vault_key and shared-vault key material. Opaque to the server."
      required: [suite, epk, kem_ct, c, n]
      properties:
        suite: { type: integer, enum: [1] }
        epk: { type: string, description: "Ephemeral X25519 public key (base64)." }
        kem_ct: { type: string, description: "ML-KEM-768 ciphertext (base64)." }
        c: { type: string, description: "XChaCha20-Poly1305 ciphertext (base64)." }
        n: { type: string, description: "Nonce (base64)." }

    ShareCryptoEnvelope:
      type: object
      description: >
        Symmetric per-blob key wrap for PUBLIC share links (separate from the PQ-hybrid
        vault format). The share key lives ONLY in the URL fragment (#, never sent to the
        server). Each per-file key is wrapped as this {c,n} XChaCha20-Poly1305 envelope.
      required: [c, n]
      properties:
        c: { type: string, description: "Ciphertext (base64)." }
        n: { type: string, description: "Nonce (base64)." }

    SharedVaultManifest:
      type: object
      description: >
        Decrypted content of a shared vault (GET/PUT /vaults/{vault}/store), sealed under
        VK_vault. Shape depends on the vault's kind: kind=password → {name, items:[SecretItem]};
        kind=folder → {name, folders:[FileFolder], files:[{ref, key, name, mime, path?}]}
        where each file `key` is the per-file content key wrapped under VK_folder.
      required: [name]
      properties:
        name: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/SecretItem" }, description: "Password vaults only." }
        folders: { type: array, items: { $ref: "#/components/schemas/FileFolder" }, description: "Folder vaults only." }
        files:
          type: array
          description: "Folder vaults only."
          items: { type: object, properties: { ref: { type: string, format: uuid }, key: { type: string }, name: { type: string }, mime: { type: string }, path: { type: string } } }

    # ── Request/response schemas for the batch 1–5 API surface ──
    VaultWrite:
      type: object
      description: "Vault provisioning/rotation body — only wrapped key material + KDF params (never the plaintext vault key)."
      required: [salt, kdf_ops, kdf_mem, wrapped_vault_key, wrap_nonce]
      properties:
        salt: { type: string, maxLength: 255, description: "Argon2id salt (base64)." }
        kdf_ops: { type: integer, minimum: 3, description: "Argon2id ops (client uses 4 = SENSITIVE)." }
        kdf_mem: { type: integer, minimum: 67108864, description: "Argon2id memory bytes (client uses 268435456)." }
        wrapped_vault_key: { type: string, maxLength: 1024, description: "VK wrapped under the passphrase-KEK (base64). Opaque." }
        wrap_nonce: { type: string, maxLength: 255 }
        wrapped_vault_key_recovery: { type: string, maxLength: 1024, nullable: true, description: "Recovery wrap of the same VK (required on provision)." }
        recovery_nonce: { type: string, maxLength: 255, nullable: true }

    UserSettings:
      type: object
      description: "Per-user non-display settings (contact notify channels + file version cap)."
      properties:
        contact_birthday_channels: { type: array, items: { type: string, enum: [desktop, ntfy, mail, webhook] } }
        contact_anniversary_channels: { type: array, items: { type: string, enum: [desktop, ntfy, mail, webhook] } }
        file_max_versions: { type: integer, minimum: 1, maximum: 200 }

    AdminUser:
      type: object
      description: "Admin view of a user. Never includes password hashes or 2FA secrets."
      required: [id, name, email, role, verified, two_factor, usage]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        files_quota_mb: { type: integer, nullable: true }
        gallery_quota_mb: { type: integer, nullable: true }
        max_connected_devices: { type: integer, nullable: true }
        modules: { type: array, nullable: true, items: { type: string } }
        groups: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        verified: { type: boolean }
        two_factor: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        usage: { type: object, required: [used], properties: { used: { type: integer }, quota: { type: integer, nullable: true } } }

    AdminUserWrite:
      type: object
      description: >
        User create/update body. role/quotas/modules are privilege fields (never
        mass-assigned server-side — set via forceFill/privilegedFields).

        FULL REPLACE on PUT /users/{user}: the update is NOT a partial patch. An OMITTED
        limit field (files_quota_mb / gallery_quota_mb / max_connected_devices) resets to
        null = UNLIMITED; an omitted `groups` removes ALL group memberships; an omitted
        `modules` (without modules_marker=set) resets to null = ALL modules enabled. A
        client MUST send the user's COMPLETE current state on every update, or it will
        silently widen quotas/modules and drop group memberships.
      required: [name, email, role]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, user] }
        password: { type: string, minLength: 12, description: "Create only (prohibited on update); omit to trigger a reset mail." }
        files_quota_mb: { type: integer, minimum: 0, maximum: 100000000, nullable: true }
        gallery_quota_mb: { type: integer, minimum: 0, maximum: 100000000, nullable: true }
        max_connected_devices: { type: integer, minimum: 1, maximum: 50, nullable: true }
        modules: { type: array, nullable: true, items: { type: string, enum: [dashboard, files, gallery, passwords, notes, todos, bookmarks, contacts, finance, health, explore] } }
        modules_marker: { type: string, enum: ['set'], description: "Disambiguates an empty modules[] from an omitted one. Send modules_marker='set' together with modules[] (even empty) to persist that EXACT list. Omitting BOTH modules and modules_marker resets modules to null = ALL modules enabled (see the full-replace note above) — it is NOT 'no change'." }
        groups: { type: array, nullable: true, items: { type: integer } }

    PaperlessTerm:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: "Paperless numeric id." }
        name: { type: string }
        color: { type: string, nullable: true }

    SecurityLogEntry:
      type: object
      description: "One append-only audit entry. Metadata only — never tokens/keys/ciphertext."
      properties:
        at: { type: string, format: date-time, nullable: true }
        user_id: { type: integer, nullable: true }
        actor: { type: string, nullable: true, description: "Display name at query time." }
        action: { type: string, example: device.evicted, description: "Dot-namespaced event id." }
        ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        meta: { type: object, nullable: true, additionalProperties: true }

    BackupDestinationSummary:
      type: object
      description: "Safe public shape — credentials (`config`) intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }

    BackupDestinationWrite:
      type: object
      required: [name, driver]
      description: "Blank secret fields (secret/password/private_key) keep the stored value on update."
      properties:
        name: { type: string }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }
        bucket: { type: string }
        region: { type: string }
        key: { type: string }
        secret: { type: string }
        endpoint: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        private_key: { type: string }
        path: { type: string }
        url: { type: string }

    BackupJobSummary:
      type: object
      description: "Safe public shape — `passphrase` intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        source: { type: string, enum: [all, database, files, gallery, notes, passwords, invoices, mail, contacts, explore, shared-folders] }
        mode: { type: string }
        destination_id: { type: integer }
        cron: { type: string }
        retention: { type: integer }
        encrypt: { type: boolean }
        notify_channels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_status: { type: string, nullable: true }
        statistics: { type: object, additionalProperties: true }

    BackupJobWrite:
      type: object
      required: [name, source, backup_destination_id, cron, retention]
      description: "source=database MAY use encrypt=false (operator opt-out; unencrypted DB dump exposes wrapped vault keys off-box). Blank/omitted passphrase keeps the stored value on update. cron must be a valid crontab expression (422 otherwise)."
      properties:
        name: { type: string, maxLength: 120 }
        source: { type: string, enum: [all, database, files, gallery, notes, passwords, invoices, mail, contacts, explore, shared-folders] }
        mode: { type: string, enum: [mirror, archive], description: "Optional; mirror = incremental blob mirror, archive = full tarball. Ignored for source=database (always a full dump) and source=all (each source uses its natural mode)." }
        backup_destination_id: { type: integer, description: "Must reference an existing backup_destinations row." }
        cron: { type: string, maxLength: 64, description: "Valid crontab expression." }
        retention: { type: integer, minimum: 1, maximum: 9999 }
        encrypt: { type: boolean }
        passphrase: { type: [string, "null"], minLength: 12, maxLength: 255, description: "Required when encrypt=true on create; min 12 chars. Blank/omitted on update keeps the stored passphrase. NEVER returned in any response." }
        notify_channels: { type: array, nullable: true, items: { type: string, enum: [desktop, mail, ntfy, webhook] } }
        enabled: { type: boolean }

    BackupRunSummary:
      type: object
      properties:
        id: { type: integer }
        job: { type: string }
        status: { type: string }
        startedIso: { type: string, format: date-time, nullable: true }
        finishedIso: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: number, nullable: true }
        size: { type: string, nullable: true }
        filename: { type: string, nullable: true }
        downloadable: { type: boolean }
        encrypted: { type: boolean }
        cancellable: { type: boolean }
        verifiable: { type: boolean }
        cancelRequested: { type: boolean }
        error: { type: string, nullable: true }

paths:

  # --------------------------------------------------------------------------
  # Health check (app up-check) — NOT under /api/v1; served at the site root.
  # --------------------------------------------------------------------------

  /up:
    servers:
      - url: /
        description: Site root (this endpoint lives above the /api/v1 base path).
    get:
      tags: [Status]
      operationId: healthUp
      summary: Application health check (up-check)
      description: >
        Laravel's framework health endpoint at the site ROOT (`/up`, not
        `/api/v1/up`). Unauthenticated, unthrottled. Returns HTTP 200 while the
        application booted cleanly (runs the framework health checks) and a 500
        otherwise. Apps poll it to confirm the server is reachable and healthy
        before/independently of API calls. The body is a small HTML page — clients
        should treat the STATUS CODE as the signal, not the body.
      security: []
      responses:
        "200":
          description: Application is up and healthy.
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Application is unhealthy (a health check threw).

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------

  /auth/pair:
    post:
      tags: [Auth]
      operationId: authPair
      summary: Claim a pairing code (public)
      description: >
        The mobile app scans a QR code from the user's web profile and claims the
        one-time code here. Moves the pairing to pending-approval status. No bearer
        token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_name]
              properties:
                code:
                  type: string
                  description: One-time pairing code from the QR.
                device_name:
                  type: string
                  maxLength: 60
                  description: Human-readable device name shown in the web UI.
      responses:
        "200":
          description: Code claimed; waiting for owner approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
        "410":
          description: Code not found, expired, or in the wrong state (Gone).
        "422":
          description: Validation error (missing/invalid fields).
        "429":
          description: Rate limit exceeded.

  /auth/pair/collect:
    post:
      tags: [Auth]
      operationId: authCollect
      summary: Poll for pairing approval (public)
      description: >
        Poll with the same code. Returns `status: pending` until the owner approves
        the device in the web UI, then returns the Sanctum bearer token exactly once.
        No bearer token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The same one-time pairing code.
                install_id:
                  type: string
                  maxLength: 64
                  description: >
                    Optional device-local random id (NOT a secret) that lets the
                    server audit trail be correlated with the client's own
                    diagnostic log. Stored on the token; echoed in device audit meta.
                app_version:
                  type: string
                  maxLength: 32
                  description: Optional client app version reported at pairing (non-secret).
                os_version:
                  type: string
                  maxLength: 32
                  description: Optional client OS version reported at pairing (non-secret).
      responses:
        "200":
          description: Pending or approved.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [pending]
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [approved]
                      token:
                        type: string
                        description: Sanctum bearer token for subsequent API calls.
                      user:
                        $ref: "#/components/schemas/MeUser"
        "410":
          description: Code not found, expired, rejected, or already consumed (Gone).
        "429":
          description: Rate limit exceeded.

  /auth/session:
    delete:
      tags: [Auth]
      operationId: authDestroy
      summary: Revoke the current bearer token
      description: >
        Deletes the Sanctum token authenticating this request (logout / remote wipe
        acknowledgement). Throttle: none (uses general API throttle).
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Me / Device
  # --------------------------------------------------------------------------

  /me:
    get:
      tags: [Me/Device]
      operationId: meShow
      summary: Authenticated user info and storage usage
      description: >
        Returns the authenticated user's profile, aggregate storage usage (files +
        gallery bytes), and a `wipe` flag that signals the owner has requested a
        remote wipe of this token. No throttle beyond the default API rate.
      responses:
        "200":
          description: User payload.
          content:
            application/json:
              schema:
                type: object
                required: [user, usage, wipe]
                properties:
                  user:
                    $ref: "#/components/schemas/MeUser"
                  usage:
                    type: object
                    required: [files, gallery, quota]
                    properties:
                      files:
                        type: integer
                        description: Total file blob bytes used by this account.
                      gallery:
                        type: integer
                        description: Total gallery blob bytes used by this account.
                      quota:
                        type: integer
                        nullable: true
                        description: >
                          Combined storage limit in bytes (effective files quota +
                          gallery quota). Null = unlimited — returned whenever either
                          dimension is unlimited (0), since the pool then has no finite
                          cap. Lets a client render a used/limit ring against files+gallery.
                  wipe:
                    type: boolean
                    description: >
                      Kill switch. If true, the owner has requested a remote wipe of
                      this token — the client should erase local vault data and log out.
        "401":
          description: Unauthenticated.

  /avatar:
    get:
      tags: [Me/Device]
      operationId: avatarShow
      summary: Stream the authenticated user's avatar
      description: >
        Streams the user's stored avatar image. Not zero-knowledge (a non-secret
        profile image). Returns 404 if no avatar is stored. Throttle: 120 req/min.
      responses:
        "200":
          description: Avatar image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated.
        "404":
          description: No avatar stored.
        "429":
          description: Rate limit exceeded.

  /device/heartbeat:
    post:
      tags: [Me/Device]
      operationId: deviceHeartbeat
      summary: Record device sync activity
      description: >
        CLI/background clients call this to record whether they are currently syncing.
        Returns the remote-wipe flag so any heartbeat also delivers the kill switch.
        Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [idle, syncing]
                  description: Current sync state of the client.
                detail:
                  type: string
                  maxLength: 160
                  nullable: true
                  description: Optional human-readable detail string shown in the devices list.
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [wipe]
                properties:
                  wipe:
                    type: boolean
                    description: >
                      If true the owner has requested a remote wipe of this token.
                      The client should erase local vault data and log out.
        "422":
          description: Validation error (state not in allowed enum).
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Vault (KDF material + wrapped vault key)
  # --------------------------------------------------------------------------

  /vault:
    get:
      tags: [Vaults]
      operationId: vaultShow
      summary: Retrieve vault KDF parameters and wrapped vault key
      description: >
        Returns the Argon2id KDF parameters and the wrapped vault key so the
        browser can derive the KEK from the passphrase and unwrap the vault key.
        All returned values are opaque to the server. No throttle beyond default.
      responses:
        "200":
          description: Vault configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultResponse"
        "401":
          description: Unauthenticated.
    post:
      tags: [Vaults]
      operationId: vaultStore
      summary: Provision the vault (first-time setup)
      description: >
        First-time zero-knowledge vault setup for a native client that never used
        the web app. Carries only the passphrase-wrapped vault key + KDF params +
        the recovery wrap — NEVER the plaintext vault key. Refuses to overwrite an
        existing vault (409 — that is a passphrase change → PUT /vault). Throttle 10/min.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultWrite" }
      responses:
        "201": { description: "Vault provisioned.", content: { application/json: { schema: { type: object, properties: { configured: { type: boolean, enum: [true] } } } } } }
        "401": { description: Unauthenticated. }
        "409":
          description: >
            A vault already exists — this is a passphrase change, use PUT /vault.
            CRITICAL: on 409 the client MUST DISCARD the vault key it just generated for
            this failed provision (the server never stored it) and instead GET /vault +
            unwrap the EXISTING wrapped_vault_key with the passphrase. Adopting the
            freshly-generated key would seal all subsequent data under a phantom key no
            stored passphrase/recovery wrap can reproduce — permanently undecryptable.
            RECOMMENDED: GET /vault first (configured true/false) to choose unlock vs
            provision, avoiding this race entirely.
        "422": { description: Validation error. }
        "429": { description: Rate limit exceeded. }
    put:
      tags: [Vaults]
      operationId: vaultRotate
      summary: Rotate the vault passphrase
      description: >
        Re-wraps the SAME vault key under a new passphrase-derived key (fresh salt +
        nonce). The vault key is unchanged, so no blob re-encryption is needed.

        RECOVERY WRAP: the server is zero-knowledge and does NOT mint recovery material.
        If the request OMITS wrapped_vault_key_recovery / recovery_nonce, the server
        PRESERVES the existing stored recovery wrap (so a client can rotate the
        passphrase even without the offline recovery code to hand). To refresh recovery,
        send a fresh wrap of the SAME (unchanged) vault key. Never send an empty/blank
        string expecting deletion.

        CONCURRENCY: send `expected_version` (from GET /vault). OMITTING it performs a
        BLIND last-writer-wins rotate that can silently overwrite a concurrent passphrase
        change from another device — leaving that device's new passphrase non-functional
        with no error. Native clients SHOULD always echo the version and handle the 409.
        Throttle 10/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VaultWrite"
                - type: object
                  properties:
                    expected_version: { type: integer, minimum: 0, description: "Optimistic-concurrency guard (from GET /vault)." }
      responses:
        "200": { description: "Rotated.", content: { application/json: { schema: { type: object, required: [configured, version], properties: { configured: { type: boolean }, version: { type: integer } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Vault not yet configured (POST /vault first). }
        "409": { description: "Version conflict.", content: { application/json: { schema: { $ref: "#/components/schemas/ShareVersionConflict" } } } }
        "422": { description: Validation error. }
        "429": { description: Rate limit exceeded. }

  # --------------------------------------------------------------------------
  # Store (personal workspace manifest)
  # --------------------------------------------------------------------------

  /store/{module}:
    parameters:
      - name: module
        in: path
        required: true
        description: >
          Module key. One of: notes, todos, bookmarks, contacts, invoices,
          passwords, health, sharing, explore, mailkeys. Any other value is a 404.
          (mailkeys holds the sealed PGP private/public keys for the mail archive.)
        schema:
          type: string
          enum: [notes, todos, bookmarks, contacts, invoices, passwords, health, sharing, explore]
    get:
      tags: [Store]
      operationId: moduleStoreShow
      summary: Read one module's sealed store
      description: >
        Store v3 per-module split: every module owns its OWN opaque sealed row, so
        a write to one module never re-seals the others. Returns the current sealed
        ciphertext and version for {module}. Mobile CRUD for a module is:
        GET /store/{module} → decrypt+mutate the object client-side →
        PUT /store/{module}. There is no per-record endpoint (zero-knowledge).
        The server never reads the ciphertext. A weak ETag (W/"{uid}-{module}-{ver}")
        supports 304. No per-route throttle beyond the default API rate.
      responses:
        "200":
          description: Current sealed module store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "304":
          description: Not modified (ETag matched If-None-Match).
        "401":
          description: Unauthenticated.
        "403":
          description: Module disabled for this account.
        "404":
          description: Unknown module key.
    put:
      tags: [Store]
      operationId: moduleStoreSave
      summary: Write one module's sealed store
      description: >
        Optimistic-concurrency write for a single module. The caller sends the
        ciphertext and the version it last read; if another client wrote in the
        meantime the server returns 409 so the client can re-read, re-apply, retry.
        Throttle: 240 req/min. For module=health, the decrypted object may carry
        `healthFasts[]` (intermittent fasting, see schema HealthFast): only ONE fast
        may be active (end=null) across ALL clients — re-read before starting and
        never write a second active fast; web and mobile must always show the
        running fast.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciphertext, version]
              properties:
                ciphertext:
                  type: string
                  description: >
                    Opaque sealed module ciphertext. The server stores this
                    without reading it.
                version:
                  type: integer
                  minimum: 0
                  description: Version the client last read (optimistic concurrency token).
                counts:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                  description: >
                    Optional non-secret per-slice record counts (cardinality only,
                    never content) recorded in the root_write forensic trail so
                    store:anomaly-scan can flag a version where a record count
                    regressed — the primary silent-data-loss signal.
                shards:
                  type: array
                  maxItems: 200000
                  items: { type: string, format: uuid }
                  description: >
                    Accepted but unused for the plain module store (no shard ledger);
                    validated as UUIDs. Sharded stores (files/gallery/notes/passwords/
                    invoices) enforce it referentially.
      responses:
        "200":
          description: Write successful; new version counter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "403":
          description: Module disabled for this account.
        "409":
          description: >
            Concurrent write conflict. The client MUST rebase-merge its delta onto the
            winning manifest and retry — never re-PUT its stale copy (see StoreVersionConflict).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreVersionConflict" }
        "404":
          description: Unknown module key.
        "422":
          description: Validation error.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Files (personal encrypted blobs)
  # --------------------------------------------------------------------------

  /files/store:
    get:
      tags: [Files]
      operationId: filesStoreShow
      summary: Read the sealed files index
      description: >
        Store v3 (§4.2): Files has its OWN sharded sealed store, out of the
        monolith. The root is a small pointer table; the file/folder records live
        in content-addressed, id-bucketed shard blobs (see /files/raw + the Store
        model). Returns the current sealed root ciphertext + version. ETag/304 as
        for the other sealed stores. The server never reads the ciphertext.
      responses:
        "200":
          description: Current sealed files index root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "304":
          description: Not modified (ETag matched If-None-Match).
        "401":
          description: Unauthenticated.
        "403":
          description: Module disabled for this account.
    put:
      tags: [Files]
      operationId: filesStoreSave
      summary: Write the sealed files index
      description: >
        Optimistic-concurrency write of the files index root. Same 409 protocol as
        the other sealed stores. Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciphertext, version]
              properties:
                ciphertext:
                  type: string
                  description: Opaque sealed files-index root ciphertext.
                version:
                  type: integer
                  minimum: 0
                  description: Version the client last read (optimistic concurrency token).
                counts:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                  description: >
                    Optional non-secret per-slice record counts (cardinality only,
                    never content) recorded in the root_write forensic trail so
                    store:anomaly-scan can flag a version where a record count
                    regressed — the primary silent-data-loss signal.
                shards:
                  type: array
                  maxItems: 200000
                  items:
                    type: string
                    format: uuid
                  description: >
                    STRONGLY RECOMMENDED for sharded stores — a client SHOULD always send
                    the COMPLETE set of blob refs (every record-shard blob AND every
                    collection blob) the new sealed root points at. When present, the
                    server rejects the write (422 missing_shard) if any ref has no blob
                    ledger row — preventing a root that dangles at a shard whose upload
                    never durably landed (the sharded-store data-loss failure mode).
                    OMITTING this array DISABLES the guard, so a partial/racy save can
                    persist a corrupt dangling-shard root that 404s on load and loses
                    those records — always send it. An INCOMPLETE set (missing a live
                    shard ref) is also unsafe: the omitted shard becomes reclaimable.
                    The refs are non-secret UUIDs, so this preserves zero-knowledge.
      responses:
        "200":
          description: Write successful; new version counter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "403":
          description: Module disabled for this account.
        "409":
          description: >
            Concurrent write conflict. The client MUST rebase-merge its delta onto the
            winning manifest and retry — never re-PUT its stale copy (see StoreVersionConflict).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreVersionConflict" }
        "422":
          description: >
            Validation error, or `missing_shard` — the root references a blob with no
            ledger row (rejected to prevent a dangling-shard save).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [missing_shard]
        "429":
          description: Rate limit exceeded.

  /files/usage:
    get:
      tags: [Files]
      operationId: filesUsage
      summary: Personal file storage usage
      description: >
        Returns bytes used vs quota for the caller's personal file blobs.
        No per-route throttle beyond default.
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "401":
          description: Unauthenticated.

  /files/upload:
    post:
      tags: [Files]
      operationId: filesUpload
      summary: Upload a single encrypted file blob
      description: >
        Stores one opaque ciphertext blob (client-encrypted). Returns the new blob
        UUID. Enforces per-user quota. Use multipart upload for files > ~100 MB.
        Throttle: 1200 req/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    Opaque ciphertext bytes (client-encrypted). The server stores
                    without reading.
      responses:
        "201":
          description: Blob stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "413":
          description: Quota exceeded.
        "422":
          description: Validation error.
        "429":
          description: Rate limit exceeded.

  /files/upload/init:
    post:
      tags: [Files]
      operationId: filesUploadInit
      summary: Initiate S3 multipart upload
      description: >
        Begins an S3 multipart upload session for a large file blob. Returns an
        opaque session token, the blob UUID, and the part size to split on.
        Throttle: 600 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkInitRequest"
      responses:
        "200":
          description: Session initialised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkInitResponse"
        "413":
          description: Quota would be exceeded.
        "429":
          description: Rate limit exceeded.

  /files/upload/part:
    post:
      tags: [Files]
      operationId: filesUploadPart
      summary: Upload one part of a multipart upload
      description: >
        Uploads a single part (chunk) of an in-progress multipart upload session.
        Requires the opaque session token from init. Throttle: 6000 req/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, part, chunk]
              properties:
                token:
                  type: string
                  description: Session token from the init call.
                part:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 1-based part number (upload order).
                chunk:
                  type: string
                  format: binary
                  description: Part bytes (partSize from init per part except the last).
      responses:
        "200":
          description: Part accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkPartResponse"
        "429":
          description: Rate limit exceeded.

  /files/upload/complete:
    post:
      tags: [Files]
      operationId: filesUploadComplete
      summary: Complete a multipart upload and register the blob
      description: >
        Finalises the S3 multipart upload and registers the blob in the ownership
        ledger. Returns the blob id (same as from init). Throttle: 600 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkCompleteRequest"
      responses:
        "201":
          description: Blob registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "429":
          description: Rate limit exceeded.

  /files/upload/abort:
    post:
      tags: [Files]
      operationId: filesUploadAbort
      summary: Abort a multipart upload and clean up staged parts
      description: >
        Cancels an in-progress multipart upload and discards all uploaded parts.
        Throttle: 600 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Session token from the init call.
      responses:
        "200":
          description: Upload aborted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "429":
          description: Rate limit exceeded.

  /files/raw/{blob}:
    get:
      tags: [Files]
      operationId: filesRaw
      summary: Stream a file blob (ciphertext)
      description: >
        Streams the raw ciphertext bytes for the given blob UUID. Owner-scoped;
        foreign or missing blob returns 404 to avoid ownership oracle. Bytes are
        served with immutable cache headers — the client decrypts in memory.
        Throttle: 600 req/min.
      parameters:
        - name: blob
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Blob UUID returned by the upload endpoint.
      responses:
        "200":
          description: Blob ciphertext stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Opaque ciphertext bytes. Client decrypts with the vault key.
        "404":
          description: Blob not found or not owned by caller.
        "429":
          description: Rate limit exceeded.

  /files/raw-batch:
    post:
      tags: [Files]
      operationId: filesRawBatch
      summary: Stream many file blobs in one response (Store v3 §10.4)
      description: >
        Owner-scoped batch fetch (mirror of gallery/raw-batch) to cut round-trips on
        a cold sharded-files load. Returns the concatenated framed ciphertext of the
        requested blobs; only owned+present ids are emitted, others silently skipped.
        Wire format per blob in request order: `[u32le idLen][id utf8][u32le dataLen][ciphertext]`.
        Max 512 ids. Throttle: 600 req/min. Never returns plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobs]
              properties:
                blobs:
                  type: array
                  maxItems: 512
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Concatenated framed blob ciphertext.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "422":
          description: Invalid or oversized blobs array.
        "429":
          description: Rate limit exceeded.

  /files/blob/{blob}:
    delete:
      tags: [Files]
      operationId: filesBlobDestroy
      summary: Delete a file blob
      description: >
        Deletes the blob bytes and its ledger row. Idempotent — a missing or
        foreign blob answers the same as a successful delete (no ownership oracle).
        Throttle: 3000 req/min.
      parameters:
        - name: blob
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted (or already absent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "429":
          description: Rate limit exceeded.

  /files/blobs/reconcile:
    post:
      tags: [Files]
      operationId: filesReconcile
      summary: Reclaim unreferenced file blobs
      description: >
        Client sends the set of blob UUIDs its sealed index still references. The
        server deletes any of the caller's blobs NOT in that set that are older
        than the orphan grace window (24 h). Returns updated usage. Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobs]
              properties:
                allow_empty:
                  type: boolean
                  description: >
                    Explicit acknowledgement that an EMPTY blobs list (prune
                    everything) is intended. A client with a degraded/failed index
                    must NOT send it; without it the server refuses (422) to prune a
                    non-empty ledger from an empty live-set. DEGRADED/PARTIAL INDEX: a client whose store load was degraded or incomplete (any record
                    shard failed to load / 404'd) MUST NOT reconcile at all — a non-empty but PARTIAL live-set bypasses this empty-set guard and permanently
                    prunes the missing records' blobs after the grace window. Freeze reconcile until a clean full load. For a shared folder,
                    reconcile additionally requires the manage role.
                blobs:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 100000
                  description: Full list of blob UUIDs the sealed index currently references.
      responses:
        "422":
          description: Refused — empty live-set against a non-empty ledger without allow_empty.
        "200":
          description: Reconcile complete; updated usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "429":
          description: Rate limit exceeded.

  /files/shares:
    post:
      tags: [Files]
      operationId: filesSharesStore
      summary: Create a public share link for a file or folder
      description: >
        Creates a public share link. The `kind` field determines whether a single
        file or a folder subtree is shared. The `sealed_manifest` is an opaque
        ciphertext blob containing the re-wrapped per-file keys encrypted under the
        share link's fragment key — the server never reads it. Throttle: 60 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, sealed_manifest, blob_refs]
              properties:
                kind:
                  type: string
                  enum: [file, folder]
                  description: Whether this share covers a single file or a folder tree.
                sealed_manifest:
                  type: string
                  description: >
                    Opaque sealed share manifest (per-file keys re-wrapped under the
                    share fragment key). The server stores this without reading it.
                blob_refs:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: UUIDs of blobs included in the share (access-control list).
                allow_download:
                  type: boolean
                  default: false
                  description: Whether recipients may download the raw files.
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional expiry timestamp. Null = no expiry.
                password:
                  type: string
                  minLength: 4
                  maxLength: 200
                  nullable: true
                  description: Optional password that recipients must enter to view the share.
      responses:
        "200":
          description: Share link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Validation error.
        "429":
          description: Rate limit exceeded.

  /files/shares/{token}:
    put:
      tags: [Files]
      operationId: filesSharesUpdate
      summary: Update an existing public share link
      description: >
        Replaces the sealed manifest, blob refs, and access settings of an existing
        share. Owner-scoped. Throttle: 60 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Share link token returned by the create endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sealed_manifest, blob_refs]
              properties:
                sealed_manifest:
                  type: string
                  description: Updated opaque sealed share manifest.
                blob_refs:
                  type: array
                  items:
                    type: string
                    format: uuid
                allow_download:
                  type: boolean
                  default: false
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                password:
                  type: string
                  minLength: 4
                  maxLength: 200
                  nullable: true
                  description: New password (omit to keep existing; use clear_password to remove).
                clear_password:
                  type: boolean
                  default: false
                  description: If true, removes the current password protection.
                expected_version:
                  type: integer
                  description: >
                    Optional optimistic-concurrency guard (see the create/update
                    response version). On mismatch the update is rejected (409)
                    instead of clobbering a concurrent edit. Omit for the legacy
                    blind (version-bumping) behaviour.
      responses:
        "200":
          description: Share updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "404":
          description: Share not found or not owned by caller.
        "409":
          description: Version conflict — the share was updated elsewhere; re-read and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareVersionConflict"
        "422":
          description: Validation error.
        "429":
          description: Rate limit exceeded.

    delete:
      tags: [Files]
      operationId: filesSharesDestroy
      summary: Delete a public share link
      description: >
        Permanently removes the share link. Owner-scoped. Throttle: 60 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Share link token.
      responses:
        "200":
          description: Share deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Share not found or not owned by caller.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # SharedFolders (member-scoped blobs for shared vaults)
  # --------------------------------------------------------------------------

  /vaults/{vault}/blobs/usage:
    get:
      tags: [SharedFolders]
      operationId: vaultBlobsUsage
      summary: Shared folder blob storage usage
      description: >
        Returns bytes used vs quota for blobs in the shared folder vault. Quota is
        attributed to the folder owner. Requires vault membership (viewer+).
        No per-route throttle beyond default.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Shared vault UUID.
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "401":
          description: Unauthenticated.
        "404":
          description: Vault not found or caller is not a member.

  /vaults/{vault}/blobs/upload:
    post:
      tags: [SharedFolders]
      operationId: vaultBlobsUpload
      summary: Upload a blob to a shared folder vault
      description: >
        Stores one opaque ciphertext blob encrypted under the vault's VK_vault.
        Requires editor+ membership. Quota is attributed to the vault owner.
        Throttle: 1200 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Opaque ciphertext bytes (client-encrypted under VK_vault).
      responses:
        "201":
          description: Blob stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "404":
          description: Vault not found or insufficient membership role.
        "413":
          description: Quota exceeded.
        "429":
          description: Rate limit exceeded.

  /vaults/{vault}/blobs/upload/init:
    post:
      tags: [SharedFolders]
      operationId: vaultBlobsUploadInit
      summary: Initiate S3 multipart upload for a shared folder blob
      description: >
        Begins an S3 multipart upload session. Requires editor+ membership.
        Throttle: 600 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkInitRequest"
      responses:
        "200":
          description: Session initialised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkInitResponse"
        "413":
          description: Owner quota would be exceeded.
        "404":
          description: Vault not found or insufficient role.
        "429":
          description: Rate limit exceeded.

  /vaults/{vault}/blobs/upload/part:
    post:
      tags: [SharedFolders]
      operationId: vaultBlobsUploadPart
      summary: Upload one part of a shared folder multipart upload
      description: >
        Uploads a single part of an in-progress multipart upload. Throttle: 6000 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, part, chunk]
              properties:
                token:
                  type: string
                part:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 1-based part number (upload order).
                chunk:
                  type: string
                  format: binary
      responses:
        "200":
          description: Part accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkPartResponse"
        "429":
          description: Rate limit exceeded.

  /vaults/{vault}/blobs/upload/complete:
    post:
      tags: [SharedFolders]
      operationId: vaultBlobsUploadComplete
      summary: Complete a shared folder multipart upload
      description: >
        Finalises the multipart upload and registers the blob. Throttle: 600 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkCompleteRequest"
      responses:
        "201":
          description: Blob registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "429":
          description: Rate limit exceeded.

  /vaults/{vault}/blobs/upload/abort:
    post:
      tags: [SharedFolders]
      operationId: vaultBlobsUploadAbort
      summary: Abort a shared folder multipart upload
      description: >
        Cancels an in-progress multipart upload and discards staged parts.
        Throttle: 600 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Aborted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "429":
          description: Rate limit exceeded.

  /vaults/{vault}/blobs/raw/{blob}:
    get:
      tags: [SharedFolders]
      operationId: vaultBlobsRaw
      summary: Stream a shared folder blob (ciphertext)
      description: >
        Streams the raw ciphertext bytes of a shared folder blob. Requires viewer+
        membership. Served with immutable cache headers. Throttle: 600 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: blob
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Blob ciphertext stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Vault or blob not found, or insufficient membership.
        "429":
          description: Rate limit exceeded.

  /vaults/{vault}/blobs/{blob}:
    delete:
      tags: [SharedFolders]
      operationId: vaultBlobsDestroy
      summary: Delete a shared folder blob
      description: >
        Deletes a blob from the shared folder. Requires editor+ membership.
        Idempotent. Throttle: 3000 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: blob
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "404":
          description: Vault not found or insufficient role.
        "429":
          description: Rate limit exceeded.

  /vaults/{vault}/blobs/reconcile:
    post:
      tags: [SharedFolders]
      operationId: vaultBlobsReconcile
      summary: Reclaim unreferenced blobs from a shared folder vault
      description: >
        Same orphan-reclaim protocol as the personal files reconcile. Requires the
        MANAGER role — reconcile is destructive (it prunes the whole vault ledger), so
        an editor is denied (404). Serialised per vault owner. Send the COMPLETE live
        ref set (record-shard + collection + content blobs); a partial set prunes live
        blobs after the grace window. Throttle: 120 req/min.
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobs]
              properties:
                allow_empty:
                  type: boolean
                  description: >
                    Explicit acknowledgement that an EMPTY blobs list (prune
                    everything) is intended. A client with a degraded/failed index
                    must NOT send it; without it the server refuses (422) to prune a
                    non-empty ledger from an empty live-set. DEGRADED/PARTIAL INDEX: a client whose store load was degraded or incomplete (any record
                    shard failed to load / 404'd) MUST NOT reconcile at all — a non-empty but PARTIAL live-set bypasses this empty-set guard and permanently
                    prunes the missing records' blobs after the grace window. Freeze reconcile until a clean full load. For a shared folder,
                    reconcile additionally requires the manage role.
                blobs:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 100000
      responses:
        "422":
          description: Refused — empty live-set against a non-empty ledger without allow_empty.
        "200":
          description: Reconciled; updated usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "404":
          description: Vault not found or not a member.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Gallery
  # --------------------------------------------------------------------------

  /gallery/store:
    get:
      tags: [Gallery]
      operationId: galleryStoreShow
      summary: Read the gallery sealed index
      description: >
        Returns the user's sealed gallery manifest (ciphertext + version).
        Same optimistic-concurrency protocol as the workspace store.
        Store v3 (§10.4): responds with a weak, version-derived `ETag`
        (`W/"{userId}-{version}"`); send it back as `If-None-Match` to get a
        bodyless 304 when the sealed root is unchanged (avoids re-transferring a
        large root on repeat opens). `Cache-Control: private, must-revalidate`.
        No per-route throttle beyond default.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Weak ETag from a prior read; a match yields 304.
      responses:
        "200":
          description: Sealed gallery manifest.
          headers:
            ETag:
              schema:
                type: string
              description: Weak version-derived ETag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "304":
          description: Sealed root unchanged since the supplied ETag (no body).
        "403":
          description: Module disabled for this account.
    put:
      tags: [Gallery]
      operationId: galleryStoreSave
      summary: Write the gallery sealed index
      description: >
        Saves the sealed gallery manifest. Optimistic concurrency — see /store for
        the protocol. Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciphertext, version]
              properties:
                ciphertext:
                  type: string
                  description: Opaque sealed gallery manifest ciphertext.
                version:
                  type: integer
                  minimum: 0
                counts:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                  description: >
                    Optional non-secret per-slice record counts (cardinality only,
                    never content) recorded in the root_write forensic trail so
                    store:anomaly-scan can flag a version where a record count
                    regressed — the primary silent-data-loss signal.
                shards:
                  type: array
                  maxItems: 200000
                  items:
                    type: string
                    format: uuid
                  description: >
                    STRONGLY RECOMMENDED. A client SHOULD always send the COMPLETE set of
                    blob refs (every record-shard AND collection blob) the new root points
                    at; OMITTING or sending an INCOMPLETE set disables/weakens the guard and
                    can persist a corrupt dangling-shard root that loses records. When present, the
                    server rejects the write (422 missing_shard) if any ref has no blob
                    ledger row — preventing a root that dangles at a shard whose upload
                    never durably landed. Non-secret UUIDs; zero-knowledge preserved.
      responses:
        "200":
          description: Write successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "403":
          description: Module disabled for this account.
        "409":
          description: >
            Concurrent write conflict. The client MUST rebase-merge its delta onto the
            winning manifest and retry — never re-PUT its stale copy (see StoreVersionConflict).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreVersionConflict" }
        "422":
          description: >
            `missing_shard` — the root references a blob with no ledger row (rejected to
            prevent a dangling-shard save).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [missing_shard]
        "429":
          description: Rate limit exceeded.

  /gallery/usage:
    get:
      tags: [Gallery]
      operationId: galleryUsage
      summary: Gallery blob storage usage
      description: Returns bytes used vs quota for gallery blobs. No per-route throttle.
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"

  /gallery/upload:
    post:
      tags: [Gallery]
      operationId: galleryUpload
      summary: Upload a gallery blob (ciphertext)
      description: >
        Stores one opaque ciphertext gallery blob. Created_at is snapped to the
        hour to avoid upload-burst timing side-channel. Throttle: 1200 req/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Opaque ciphertext bytes.
      responses:
        "201":
          description: Blob stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "413":
          description: Quota exceeded.
        "429":
          description: Rate limit exceeded.

  /gallery/upload/init:
    post:
      tags: [Gallery]
      operationId: galleryUploadInit
      summary: Initiate S3 multipart upload for gallery
      description: "Throttle: 600 req/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkInitRequest"
      responses:
        "200":
          description: Session initialised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkInitResponse"
        "413":
          description: Quota would be exceeded.
        "429":
          description: Rate limit exceeded.

  /gallery/upload/part:
    post:
      tags: [Gallery]
      operationId: galleryUploadPart
      summary: Upload one part of a gallery multipart upload
      description: "Throttle: 6000 req/min."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, part, chunk]
              properties:
                token:
                  type: string
                part:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 1-based part number (upload order).
                chunk:
                  type: string
                  format: binary
      responses:
        "200":
          description: Part accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkPartResponse"
        "429":
          description: Rate limit exceeded.

  /gallery/upload/complete:
    post:
      tags: [Gallery]
      operationId: galleryUploadComplete
      summary: Complete a gallery multipart upload
      description: "Throttle: 600 req/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkCompleteRequest"
      responses:
        "201":
          description: Blob registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "429":
          description: Rate limit exceeded.

  /gallery/upload/abort:
    post:
      tags: [Gallery]
      operationId: galleryUploadAbort
      summary: Abort a gallery multipart upload
      description: "Throttle: 600 req/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Aborted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "429":
          description: Rate limit exceeded.

  /gallery/raw/{blob}:
    get:
      tags: [Gallery]
      operationId: galleryRaw
      summary: Stream a gallery blob (ciphertext)
      description: >
        Owner-scoped; served with immutable cache headers. Throttle: 600 req/min.
      parameters:
        - name: blob
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Blob ciphertext stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Blob not found or not owned by caller.
        "429":
          description: Rate limit exceeded.

  /gallery/raw-batch:
    post:
      tags: [Gallery]
      operationId: galleryRawBatch
      summary: Stream many gallery blobs in one response (Store v3 §10.4)
      description: >
        Owner-scoped batch fetch to cut round-trips on a cold shard/thumbnail load.
        Returns the concatenated framed ciphertext of the requested blobs (only
        those owned AND present are emitted; unknown/foreign/missing ids are
        silently skipped — 404-hiding). Wire format, per returned blob in request
        order: `[u32le idLen][id utf8][u32le dataLen][ciphertext]`. Max 512 ids.
        Throttle: 600 req/min. Never returns plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobs]
              properties:
                blobs:
                  type: array
                  maxItems: 512
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Concatenated framed blob ciphertext.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "422":
          description: Invalid or oversized blobs array.
        "429":
          description: Rate limit exceeded.

  /gallery/blob/{blob}:
    delete:
      tags: [Gallery]
      operationId: galleryBlobDestroy
      summary: Delete a gallery blob
      description: "Idempotent. Throttle: 3000 req/min."
      parameters:
        - name: blob
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "429":
          description: Rate limit exceeded.

  /gallery/blobs/reconcile:
    post:
      tags: [Gallery]
      operationId: galleryReconcile
      summary: Reclaim unreferenced gallery blobs
      description: >
        Same orphan-reclaim protocol as files/blobs/reconcile. Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobs]
              properties:
                allow_empty:
                  type: boolean
                  description: >
                    Explicit acknowledgement that an EMPTY blobs list (prune
                    everything) is intended. A client with a degraded/failed index
                    must NOT send it; without it the server refuses (422) to prune a
                    non-empty ledger from an empty live-set. DEGRADED/PARTIAL INDEX: a client whose store load was degraded or incomplete (any record
                    shard failed to load / 404'd) MUST NOT reconcile at all — a non-empty but PARTIAL live-set bypasses this empty-set guard and permanently
                    prunes the missing records' blobs after the grace window. Freeze reconcile until a clean full load. For a shared folder,
                    reconcile additionally requires the manage role.
                blobs:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 100000
      responses:
        "422":
          description: Refused — empty live-set against a non-empty ledger without allow_empty.
        "200":
          description: Reconciled; updated usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "429":
          description: Rate limit exceeded.

  /gallery/process:
    post:
      tags: [Gallery]
      operationId: galleryProcess
      summary: Process a photo/video to derive thumbnails and metadata (transient plaintext)
      description: >
        **Accepted transient zero-knowledge window:** the browser decrypts the
        original and POSTs plaintext bytes here. The server derives thumbnails,
        EXIF, place, CLIP embedding, face crops and returns them; the plaintext is
        discarded at request end — nothing is persisted. The client re-encrypts all
        outputs before storing them as blobs. Throttle: 600 req/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Plaintext photo or video bytes (decrypted by the client).
                ml:
                  type: boolean
                  default: true
                  description: >
                    If false, skip heavy ML (CLIP + face detection) — the client
                    will call /gallery/analyze later.
      responses:
        "200":
          description: Derived data to be re-encrypted and stored by the client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  media_type:
                    type: string
                  width:
                    type: integer
                    nullable: true
                    description: Null when the source could not be decoded.
                  height:
                    type: integer
                    nullable: true
                    description: Null when the source could not be decoded.
                  duration:
                    type: number
                    nullable: true
                  content_id:
                    type: string
                    nullable: true
                  exif:
                    type: object
                    description: >
                      Always present. Sub-keys: taken_at (string|null), lat
                      (number|null), lon (number|null — note `lon`, not `lng`),
                      camera (string|null).
                    properties:
                      taken_at: { type: string, nullable: true }
                      lat: { type: number, nullable: true }
                      lon: { type: number, nullable: true }
                      camera: { type: string, nullable: true }
                  place:
                    $ref: "#/components/schemas/PlaceInfo"
                  embedding:
                    $ref: "#/components/schemas/ClipEmbedding"
                  model:
                    type: string
                    nullable: true
                    description: >
                      CLIP model the embedding was produced with (server config
                      gallery.ml_clip_model). Clients tag the record's embModel
                      with this so semantic search only compares embeddings from
                      one model (spec §8.5). Native clients read it here.
                  phash:
                    type: integer
                    nullable: true
                    description: Perceptual hash as an integer (not a string).
                  faces:
                    type: array
                    items:
                      $ref: "#/components/schemas/FaceItem"
                  thumb:
                    type: string
                    nullable: true
                    description: Base64-encoded WebP thumbnail.
                  medium:
                    type: string
                    nullable: true
                    description: Base64-encoded WebP medium rendition.
                  motion:
                    type: string
                    nullable: true
                    description: Base64-encoded motion photo clip.
        "422":
          description: Image too large or invalid.
        "429":
          description: Rate limit exceeded.

  /gallery/analyze:
    post:
      tags: [Gallery]
      operationId: galleryAnalyze
      summary: Deferred ML pass — CLIP embedding and face detection only
      description: >
        Accepts a medium rendition (plaintext, discarded after). Returns only CLIP
        embedding + faces for deferred integration into the sealed metadata.
        Same transient ZK window as /gallery/process. Throttle: 600 req/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ML outputs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedding:
                    $ref: "#/components/schemas/ClipEmbedding"
                  model:
                    type: string
                    nullable: true
                    description: >
                      CLIP model the embedding was produced with (spec §8.5);
                      clients tag embModel with it so semantic search compares
                      only same-model embeddings. Native clients read it here.
                  faces:
                    type: array
                    items:
                      $ref: "#/components/schemas/FaceItem"
        "422":
          description: Image too large, invalid, or pixel budget exceeded.
        "429":
          description: Rate limit exceeded.

  /gallery/embed-text:
    post:
      tags: [Gallery]
      operationId: galleryEmbedText
      summary: Embed a text query in CLIP space for client-side semantic search
      description: >
        Returns a CLIP text embedding for the given query string so the client can
        perform a vector similarity search in its sealed gallery index without the
        server seeing the query text. The query is discarded after embedding.
        Throttle: 300 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q:
                  type: string
                  maxLength: 1024
                  description: Search query in natural language.
      responses:
        "200":
          description: CLIP text embedding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedding:
                    $ref: "#/components/schemas/ClipEmbedding"
        "422":
          description: Missing or invalid query parameter.
        "429":
          description: Rate limit exceeded.

  /gallery/reverse:
    get:
      tags: [Gallery]
      operationId: galleryReverse
      summary: Reverse-geocode coordinates to a place name
      description: >
        Looks up a human-readable place name for the given latitude/longitude. The
        query passes through the server only (client CSP forbids third-party calls)
        and is not persisted. Throttle: 60 req/min.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Latitude in decimal degrees.
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Longitude in decimal degrees.
      responses:
        "200":
          description: Reverse-geocoded place.
          content:
            application/json:
              schema:
                type: object
                properties:
                  place:
                    type: string
                    nullable: true
                  address:
                    type: object
                    description: >
                      Structured address components (key→value strings). ALWAYS a JSON
                      object — empty ({}) when nothing resolved, never a [] array.
                    additionalProperties: { type: string }
        "422":
          description: Coordinates out of range.
        "429":
          description: Rate limit exceeded.

