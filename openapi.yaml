        "403": { description: Module disabled for this account. }
        "404": { description: Not found or not owned by caller. }
        "409":
          description: Version conflict — re-read and retry with a fresh version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordVersionConflict" }
        "422":
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
