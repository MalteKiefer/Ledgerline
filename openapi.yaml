        "200": { description: "Restored.", content: { application/json: { schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/FinanceProject" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/projects/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeProjectForce
      summary: Permanently delete a project
      description: "Permanently delete a trashed project. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/projects/{project}/move:
    post:
      tags: [Finance]
      operationId: financeProjectMove
      summary: Reparent a project (cycle-guarded)
      description: "Set/clear the project's parent_id. parent_id must be an existing owned, non-deleted project; a move that would create a cycle is rejected 422. Throttle 1200/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: project, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { parent_id: { type: [integer, "null"], description: "New parent (null = make it a root)." } } } } } }
      responses:
        "200": { description: "Moved.", content: { application/json: { schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/FinanceProject" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Validation failed (unknown/unowned parent_id) OR the move would create a cycle (body { error: cycle })."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - allOf:
                      - $ref: "#/components/schemas/FinanceError"
                      - properties: { error: { enum: [cycle] } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/products:
    post:
      tags: [Finance]
      operationId: financeProductStore
      summary: Create a catalogue article (service or hardware)
      description: "One catalogue holds both kinds: a quote line does not care whether it sells an hour or a switch. `stock_qty`/`stock_min` are NOT settable here — stock only moves through `/finance/products/{product}/stock`, which writes a ledger movement, so the figure always has a history that explains it. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceProductInput" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [product], properties: { product: { $ref: "#/components/schemas/FinanceProduct" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/products/{product}:
    put:
      tags: [Finance]
      operationId: financeProductUpdate
      summary: Update an article
      description: "Partial: a field the request omits keeps its stored value. Optimistic — send `version` to be refused with 409 instead of overwriting a concurrent change. A `stock_qty`/`stock_min` in the body is ignored by design. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: product, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceProductInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, required: [product], properties: { product: { $ref: "#/components/schemas/FinanceProduct" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeProductDestroy
      summary: Move an article to the bin
      description: "Soft delete. Its article number is free again while it sits in the bin. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: product, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/products/{id}/restore:
    post:
      tags: [Finance]
      operationId: financeProductRestore
      summary: Restore an article from the bin
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Restored.", content: { application/json: { schema: { type: object, required: [product], properties: { product: { $ref: "#/components/schemas/FinanceProduct" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/products/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeProductForceDelete
      summary: Delete an article for good
      description: "Removes the article and its stock movements. This is the one case where stock history disappears, and it takes the article it described with it. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/products/{product}/stock:
    post:
      tags: [Finance]
      operationId: financeProductStock
      summary: Book a stock movement
      description: "The only way stock changes. `qty` is signed by the caller — positive is goods in, negative is goods out — because a correction can go either way and deriving the direction from the reason would be wrong exactly when it matters. The article's figure is carried in the same transaction, so ledger and figure cannot drift. An article with `track_stock=false` still records the movement (switching tracking on later then has a history) but keeps its figure at zero. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: product, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: number, description: "Signed. In positive, out negative. Zero is refused: it states nothing." }
                reason: { type: string, enum: [purchase, sale, correction, return, initial], default: correction }
                note: { type: [string, "null"], maxLength: 1000 }
                occurred_at: { type: [string, "null"], format: date-time, description: "Defaults to now." }
      responses:
        "201": { description: "Booked.", content: { application/json: { schema: { type: object, required: [movement, product], properties: { movement: { $ref: "#/components/schemas/FinanceStockMovement" }, product: { $ref: "#/components/schemas/FinanceProduct" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/products/{product}/movements:
    get:
      tags: [Finance]
      operationId: financeProductMovements
      summary: Stock movement history of one article
      description: "Newest first, capped at 500. Append-only: there is no update or delete for a movement — a mistake is corrected by booking the opposite one, which leaves both visible. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: product, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "History.", content: { application/json: { schema: { type: object, required: [movements], properties: { movements: { type: array, items: { $ref: "#/components/schemas/FinanceStockMovement" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes:
    post:
      tags: [Finance]
      operationId: financeQuoteStore
      summary: Create a quote (Angebot)
      description: "Starts as a draft with no number. `lines` share the invoice line shape plus `productId` + `kind`, which is what makes accepting a quote a copy rather than a translation and keeps one totals implementation. `valid_until` defaults from the company profile. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceQuoteInput" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [quote], properties: { quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}:
    put:
      tags: [Finance]
      operationId: financeQuoteUpdate
      summary: Update a draft quote
      description: "Only a draft is editable. A sent quote answers 422 `quote_locked`: the customer holds a document with that number on it, and changing what it says under the same number would make the two disagree — use duplicate instead. Optimistic via `version`. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceQuoteInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, required: [quote], properties: { quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { description: "Locked (`{error: quote_locked}`) or invalid.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [quote_locked] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeQuoteDestroy
      summary: Move a quote to the bin
      description: "Soft delete. Its number stays out of circulation: a customer holding AN-2026-0007 must never receive a different one. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}/send:
    post:
      tags: [Finance]
      operationId: financeQuoteSend
      summary: Give the quote its number and mark it as out
      description: "Assigns the next number from the `quote_number_format` template (same machinery as an invoice number, so a configured format behaves identically) and sets the status to `sent`. Idempotent: a second call does not mint a second number. Not a GoBD-gapless sequence — but binned rows still count, so a number that has been seen is never reused. Answers 409 `number_taken` if the number raced; simply send again. Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Sent.", content: { application/json: { schema: { type: object, required: [quote], properties: { quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Number raced; retriable.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [number_taken] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}/decide:
    post:
      tags: [Finance]
      operationId: financeQuoteDecide
      summary: Record the customer's answer
      description: "Sets `accepted` or `declined` with its timestamp. Requires a sent quote (422 `quote_not_sent`): nothing was sent, so there is nothing to answer. Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [accepted, declined] } } } } } }
      responses:
        "200": { description: "Recorded.", content: { application/json: { schema: { type: object, required: [quote], properties: { quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Not sent, or invalid decision.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [quote_not_sent] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}/convert:
    post:
      tags: [Finance]
      operationId: financeQuoteConvert
      summary: Turn a quote into a draft invoice
      description: "Copies customer, lines (including `productId`), discount and currency into a NEW draft invoice, and marks the quote accepted. The invoice takes its own number when finalised — a quote number is not an invoice number. Idempotent: a second call returns the invoice it already made (`already: true`, 200) instead of billing the work twice. Hardware does NOT move stock here; goods leave when the invoice is finalised, not when someone accepts a price. Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      responses:
        "201": { description: "Invoice created.", content: { application/json: { schema: { type: object, required: [invoice, quote], properties: { invoice: { $ref: "#/components/schemas/Invoice" }, quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "200": { description: "Already converted; the existing invoice is returned.", content: { application/json: { schema: { type: object, required: [invoice, quote], properties: { invoice: { $ref: "#/components/schemas/Invoice" }, quote: { $ref: "#/components/schemas/FinanceQuote" }, already: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Not sent yet.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [quote_not_sent] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}/duplicate:
    post:
      tags: [Finance]
      operationId: financeQuoteDuplicate
      summary: Copy a quote into a fresh draft
      description: "The way to change a sent quote: the original stays as it was sent, the copy is editable and takes its own number when it goes out. Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      responses:
        "201": { description: "Copied.", content: { application/json: { schema: { type: object, required: [quote], properties: { quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}/pdf:
    post:
      tags: [Finance]
      operationId: financeQuotePdfStore
      summary: Store the rendered quote PDF
      description: "The sheet is rasterised in the browser from the same print templates the invoice uses, then kept here so it can be reopened and mailed without re-rendering. The path is server-generated (`invoices/{uuid}`) — a client cannot point this at a file it does not own; a previous PDF is deleted after the new one is stored. Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "PDF only." }
      responses:
        "200": { description: "Stored.", content: { application/json: { schema: { type: object, required: [quote], properties: { quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [Finance]
      operationId: financeQuotePdf
      summary: Stream the quote PDF
      description: "Inline for a preview, `?download=1` as an attachment. Served with `nosniff` and a `default-src 'none'; sandbox` CSP like every other blob this app serves. 404 while no PDF has been rendered. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: quote, in: path, required: true, schema: { type: integer } }
        - { name: download, in: query, required: false, schema: { type: boolean }, description: "Force an attachment instead of inline." }
      responses:
        "200": { description: "The PDF.", content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}/email:
    post:
      tags: [Finance]
      operationId: financeQuoteEmail
      summary: Mail the quote to the customer
      description: "Goes out over the user's OWN company SMTP, deliberately independent of the workspace notification mailer. Requires an issued quote (422 `quote_not_sent`) and a stored PDF (422 `no_pdf`) — a mail that arrives without its quote is worse than one that fails to send. Falls back to the customer's address when `to` is omitted (422 `no_recipient` if there is none), and 422 `no_smtp` when no company mailer is configured. Audited with the recipient DOMAIN only, never the address. Throttle 10/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { to: { type: [string, "null"], format: email } } } } } }
      responses:
        "200": { description: "Sent.", content: { application/json: { schema: { type: object, required: [ok, sent_at], properties: { ok: { type: boolean }, sent_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Not issued, no PDF, no recipient, or no company mailer.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [quote_not_sent, no_pdf, no_recipient, no_smtp] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{id}/restore:
    post:
      tags: [Finance]
      operationId: financeQuoteRestore
      summary: Restore a quote from the bin
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Restored.", content: { application/json: { schema: { type: object, required: [quote], properties: { quote: { $ref: "#/components/schemas/FinanceQuote" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeQuoteForceDelete
      summary: Delete a quote for good
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/products/{product}/line:
    get:
      tags: [Finance]
      operationId: financeProductLine
      summary: The catalogue article as a document line
      description: "One place decides how an article becomes a line, so a line added by the picker and one added by a future import cannot differ in shape. `vatRate` is null when the article follows the company default. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: product, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Line.", content: { application/json: { schema: { type: object, required: [line], properties: { line: { $ref: "#/components/schemas/FinanceDocumentLine" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/projects/{project}/plan:
    get:
      tags: [Finance]
      operationId: financeProjectPlan
      summary: A project's tasks, hours and derived figures
      description: "Everything hanging off one project, plus the figures that only make sense together: estimated against worked, and billable hours still waiting. Progress is derived from the tasks, never stored — a stored percentage is wrong the moment a task changes. Capped at 1000 rows each. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: project, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Plan.
          content:
            application/json:
              schema:
                type: object
                required: [tasks, entries, totals]
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/FinanceProjectTask" } }
                  entries: { type: array, items: { $ref: "#/components/schemas/FinanceTimeEntry" } }
                  totals:
                    type: object
                    properties:
                      tasks: { type: integer }
                      tasks_done: { type: integer }
                      estimate_hours: { type: number }
                      worked_hours: { type: number }
                      unbilled_hours: { type: number, description: "Billable and not yet on an invoice." }
                      unbilled_value: { type: number, description: "Those hours at their frozen rates." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/projects/{project}/tasks:
    post:
      tags: [Finance]
      operationId: financeProjectTaskStore
      summary: Add a task to a project
      description: "Appended at the end unless `sort` is given. A milestone is the same row with `is_milestone` — a date that matters with no work in it. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: project, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceProjectTaskInput" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [task], properties: { task: { $ref: "#/components/schemas/FinanceProjectTask" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/projects/{project}/tasks/reorder:
    post:
      tags: [Finance]
      operationId: financeProjectTaskReorder
      summary: Reorder a project's tasks
      description: "One call rather than one per task: a drag reorders many rows at once and half an applied order is worse than none. Ids from another project are ignored rather than pulled in. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: project, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, maxItems: 1000, items: { type: integer } } } } } } }
      responses:
        "200": { description: "Reordered.", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/project-tasks/{task}:
    put:
      tags: [Finance]
      operationId: financeProjectTaskUpdate
      summary: Update a task
      description: "Partial; optimistic via `version`. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: task, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceProjectTaskInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, required: [task], properties: { task: { $ref: "#/components/schemas/FinanceProjectTask" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeProjectTaskDestroy
      summary: Delete a task
      description: "The hours worked on it survive and are detached: work that was done stays logged, it simply loses the task it was filed under. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: task, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/projects/{project}/time:
    post:
      tags: [Finance]
      operationId: financeTimeStore
      summary: Log hours on a project
      description: "The task is optional: not everything worth logging was planned. `hourly_rate` is FROZEN on the entry — taken from the customer's rate if not given — because a rate change next year must not rewrite what last year's work was worth. `billable` defaults to true, since the usual case for tracked time is that someone pays for it. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: project, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTimeEntryInput" } } } }
      responses:
        "201": { description: "Logged.", content: { application/json: { schema: { type: object, required: [entry], properties: { entry: { $ref: "#/components/schemas/FinanceTimeEntry" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/time-entries/{entry}:
    put:
      tags: [Finance]
      operationId: financeTimeUpdate
      summary: Correct a logged hour
      description: "Refused with 422 `time_invoiced` once the entry is on an invoice: editing the hours behind a document someone has been sent would make the two disagree. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: entry, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTimeEntryInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, required: [entry], properties: { entry: { $ref: "#/components/schemas/FinanceTimeEntry" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { description: "Already invoiced, or invalid.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [time_invoiced] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeTimeDestroy
      summary: Delete a logged hour
      description: "Refused with 422 `time_invoiced` once it is on an invoice. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: entry, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Already invoiced.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [time_invoiced] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/projects/{project}/invoice-time:
    post:
      tags: [Finance]
      operationId: financeInvoiceTime
      summary: Bill the hours worked on a project
      description: "Creates a draft invoice with ONE line per rate — a customer wants \"18.5 hours at 120\", not eleven identical lines. Every entry taken is stamped with the invoice inside the same transaction, which is what stops the same hour going out twice; entries with no rate are grouped as a zero-rate line rather than dropped, because silently leaving work off an invoice is the worse failure. Optional `until` bills up to a cut-off date. Answers 422 `nothing_to_invoice` when there is nothing waiting. Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: project, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { until: { type: [string, "null"], format: date } } } } } }
      responses:
        "201": { description: "Invoice created.", content: { application/json: { schema: { type: object, required: [invoice, entries], properties: { invoice: { $ref: "#/components/schemas/Invoice" }, entries: { type: integer, description: "How many entries went onto it." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Nothing waiting to be billed.", content: { application/json: { schema: { type: object, properties: { error: { type: string, enum: [nothing_to_invoice] } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/quotes/{quote}/project:
    post:
      tags: [Finance]
      operationId: financeQuoteToProject
      summary: Turn a quote into a project
      description: "Only the SERVICE lines become tasks, each carrying the hours it was quoted at — hardware is something you deliver, not something you plan a day around, and it is already accounted for on the invoice. The first line of a line's description becomes the task title, the rest its detail. Idempotent: a second call returns the project it already made (`already: true`, 200). Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: quote, in: path, required: true, schema: { type: integer } } ]
      responses:
        "201": { description: "Project created.", content: { application/json: { schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/FinanceProject" } } } } } }
        "200": { description: "Already converted; the existing project is returned.", content: { application/json: { schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/FinanceProject" }, already: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/categories:
    post:
      tags: [Finance]
      operationId: financeCategoryStore
      summary: Create a receipt category
      description: "`name` (unique per user) is required; optional `color` + `icon`. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [category], properties: { category: { $ref: "#/components/schemas/FinanceCategory" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/categories/{category}:
    put:
      tags: [Finance]
      operationId: financeCategoryUpdate
      summary: Update a category (name, colour, icon, account_no)
      description: "Full replace of name/colour/icon/account_no (not just a rename). Name uniqueness ignores the current id. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: category, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, required: [category], properties: { category: { $ref: "#/components/schemas/FinanceCategory" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeCategoryDestroy
      summary: Delete a category
      description: "Hard-delete a receipt category (no soft-delete/trash for categories). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: category, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions:
    post:
      tags: [Finance]
      operationId: financeTxStore
      summary: Create a bank transaction
      description: "`payment_method_id` + `date` + `amount` are required. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionInput" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [transaction], properties: { transaction: { $ref: "#/components/schemas/BankTransaction" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions/bulk:
    post:
      tags: [Finance]
      operationId: financeTxBulk
      summary: Import parsed bank-statement transactions (server dedups by sig)
      description: "Bulk-inserts parsed statement lines for one account, deduplicating by `sig` (against existing rows AND within the batch). Parsing stays client-side. Throttle 120/min."
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_id, transactions]
              properties:
                payment_method_id: { type: integer, description: "Target account (must be an existing, owned, non-deleted payment method)." }
                transactions: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/TransactionBulkRow" } }
      responses:
        "201": { description: "Import result.", content: { application/json: { schema: { type: object, required: [created, skipped], properties: { created: { type: integer }, skipped: { type: integer, description: "Rows skipped as duplicates (by sig) or malformed." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions/{transaction}:
    put:
      tags: [Finance]
      operationId: financeTxUpdate
      summary: Update a bank transaction (optimistic concurrency)
      description: "Send `version` for optimistic concurrency (409 on mismatch). A client-supplied receipt blob_path is always dropped. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: transaction, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, required: [transaction], properties: { transaction: { $ref: "#/components/schemas/BankTransaction" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeTxDestroy
      summary: Soft-delete a bank transaction
      description: "Move the transaction to trash. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: transaction, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions/{id}/restore:
    post:
      tags: [Finance]
      operationId: financeTxRestore
      summary: Restore a bank transaction
      description: "Restore a soft-deleted transaction. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Restored.", content: { application/json: { schema: { type: object, required: [transaction], properties: { transaction: { $ref: "#/components/schemas/BankTransaction" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeTxForce
      summary: Permanently delete a bank transaction
      description: "Permanently delete a trashed transaction and its receipt blobs. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions/{transaction}/receipts:
    post:
      tags: [Finance]
      operationId: financeReceiptAttach
      summary: Attach a receipt file to a transaction (multipart)
      description: "Upload a receipt file (max files.max_upload_mb) and append it to the transaction's receipts[]. The server assigns id + blob_path. Throttle 1200/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: transaction, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, maxLength: 500 }
                kind: { type: string, maxLength: 24, description: "Defaults to 'receipt'." }
                category: { type: string, maxLength: 160 }
                tags: { type: array, maxItems: 100, items: { type: string, maxLength: 100 } }
                contact_id: { type: string, maxLength: 64 }
                partner_id: { type: integer }
                vat: { type: string, maxLength: 16 }
                sig: { type: string, maxLength: 80, description: "Content signature for upload dedup (see TransactionReceipt.sig)." }
      responses:
        "201": { description: "Receipt attached; returns the updated transaction.", content: { application/json: { schema: { type: object, required: [transaction], properties: { transaction: { $ref: "#/components/schemas/BankTransaction" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions/{transaction}/receipts/{receipt}:
    delete:
      tags: [Finance]
      operationId: financeReceiptDelete
      summary: Remove a receipt from a transaction
      description: "Removes the receipt by id (and deletes its blob). Deleting an unknown receipt id is a no-op that still returns the transaction. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: transaction, in: path, required: true, schema: { type: integer } }, { name: receipt, in: path, required: true, schema: { type: string, description: "Receipt entry UUID." } } ]
      responses:
        "200": { description: "Updated transaction.", content: { application/json: { schema: { type: object, required: [transaction], properties: { transaction: { $ref: "#/components/schemas/BankTransaction" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/transactions/{transaction}/receipts/{receipt}/raw:
    get:
      tags: [Finance]
      operationId: financeReceiptRaw
      summary: Stream a receipt file
      description: "Streams the receipt's stored bytes inline (sandboxed). Throttle 3000/min."
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: transaction, in: path, required: true, schema: { type: integer } }
        - { name: receipt, in: path, required: true, schema: { type: string, description: "Receipt entry UUID." } }
        - { name: download, in: query, required: false, schema: { type: boolean }, description: "true → Content-Disposition: attachment; default inline." }
      responses:
        "200": { description: "Receipt bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts:
    post:
      tags: [Finance]
      operationId: financeStandaloneReceiptStore
      summary: Upload a standalone receipt ("Fremdbeleg") without a bank transaction
      description: >
        Files a receipt document that is NOT tied to a bank booking (documentation
        that must be kept even with no imported statement). Multipart; the file is
        stored plaintext on the files disk (blob_path/size/sig server-set). An
        optional bank_transaction_id links it to a booking. If a client-computed
        sig (sha256 of the file) matches an already-stored receipt, no new row/blob
        is created — the existing receipt is returned with duplicate:true instead
        (200, not 201). Throttle 1200/min.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, maxLength: 500 }
                scope: { type: string, enum: [business, private], description: "Omit to follow the linked booking (a loose receipt is business)." }
                kind: { type: string, maxLength: 24 }
                category: { type: string, maxLength: 160 }
                tags: { type: array, items: { type: string, maxLength: 100 } }
                vat: { type: string, maxLength: 16 }
                amount: { type: number, format: double }
                currency: { type: string, maxLength: 8, description: "Uppercased server-side." }
                date: { type: string, format: date }
                order_ref: { type: string, maxLength: 64 }
                doc_number: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 2000 }
                ocr: { type: string, maxLength: 200000 }
                sig: { type: string, maxLength: 128, description: "Client-computed content-dedup signature (sha256 of the file). Omit to skip dedup." }
                partner_id: { type: integer }
                bank_transaction_id: { type: integer }
                finance_project_id: { type: integer }
      responses:
        "200": { description: "A receipt with the same sig already exists — that existing receipt is returned unchanged, no new row/blob created.", content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" }, duplicate: { type: boolean, enum: [true] } } } } } }
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{receipt}:
    put:
      tags: [Finance]
      operationId: financeStandaloneReceiptUpdate
      summary: Update a standalone receipt (optimistic version)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: receipt, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 500 }
                category: { type: string, nullable: true }
                tags: { type: array, items: { type: string } }
                vat: { type: string, nullable: true }
                amount: { type: number, format: double, nullable: true }
                currency: { type: string, nullable: true, description: "Uppercased server-side." }
                date: { type: string, format: date, nullable: true }
                order_ref: { type: string, nullable: true }
                doc_number: { type: string, nullable: true }
                note: { type: string, nullable: true }
                partner_id: { type: integer, nullable: true }
                bank_transaction_id: { type: integer, nullable: true, description: "Link/unlink this receipt to a single bank transaction (null unlinks). Setting this server-side clears linked_transaction_ids — the two are mutually exclusive." }
                linked_transaction_ids: { type: array, items: { type: integer }, maxItems: 8, nullable: true, description: "Split-payment link: link/unlink this receipt to SEVERAL bank transactions whose amounts sum to it (null unlinks). Setting a non-empty array server-side clears bank_transaction_id." }
                finance_project_id: { type: integer, nullable: true }
                version: { type: integer, minimum: 0 }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeStandaloneReceiptDestroy
      summary: Soft-delete a standalone receipt
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: receipt, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Trashed.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{id}/restore:
    post:
      tags: [Finance]
      operationId: financeStandaloneReceiptRestore
      summary: Restore a soft-deleted standalone receipt
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Restored.", content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeStandaloneReceiptForce
      summary: Permanently delete a standalone receipt (removes the stored file)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{receipt}/raw:
    get:
      tags: [Finance]
      operationId: financeStandaloneReceiptRaw
      summary: Stream a standalone receipt file (sandboxed)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: receipt, in: path, required: true, schema: { type: integer } }
        - { name: download, in: query, required: false, schema: { type: boolean } }
      responses:
        "200": { description: "Receipt bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers:
    get:
      tags: [Servers]
      operationId: serversIndex
      summary: Monitored servers with their latest snapshot
      description: "Owner-scoped. Credentials are never returned. `facts` is the snapshot of the last SUCCESSFUL run; `status` describes the last run whether it succeeded or not."
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Servers.", content: { application/json: { schema: { type: object, properties: { servers: { type: array, items: { $ref: "#/components/schemas/Server" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Servers]
      operationId: serversStore
      summary: Add a server (requires a confirmed host key)
      description: "Re-reads the target's host key and requires it to match the fingerprint the user confirmed at /servers/test — the whole key is stored, because the pin is enforced by handing OpenSSH a known_hosts entry. Does not authenticate: the first snapshot is queued, so the response returns immediately."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServerInput" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { server: { $ref: "#/components/schemas/Server" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Validation error, or host_key_unconfirmed when the host could not be re-read or answered with a different key.", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
  /servers/keypair:
    post:
      tags: [Servers]
      operationId: serversKeypair
      summary: Generate an Ed25519 keypair for a server about to be added
      description: "Returns ONLY the public key, which the user installs on the target. The private half waits in the cache for 30 minutes under an opaque token, scoped to the caller, and is redeemed by /servers/test and /servers via `keypair_token` — so a key this host generated never reaches the browser."
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Keypair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Pass as `keypair_token` to /servers/test and /servers." }
                  public_key: { type: string, description: "OpenSSH one-line form, ready for authorized_keys." }
                  expires_in_minutes: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /servers/probe-script:
    get:
      tags: [Servers]
      operationId: serversProbeScript
      summary: The probe script to install as a forced command on the target
      description: "Served from the same constant the collector executes, so the two cannot drift. Install at /usr/local/bin/ll-facts and restrict the key in authorized_keys with a forced command plus no-port-forwarding, no-agent-forwarding and no-pty — a stolen key can then only print the snapshot."
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Script.", content: { application/json: { schema: { type: object, properties: { script: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /servers/test:
    post:
      tags: [Servers]
      operationId: serversTest
      summary: Test unsaved connection parameters and read the host key
      description: "The only endpoint that opens an SSH session inline (tight interactive timeouts: 5s connect, 10s exec). Omit host_fingerprint to learn it; the response carries what was seen so the user can confirm it before /servers pins it."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServerInput" } } } }
      responses:
        "200": { description: "Reachable.", content: { application/json: { schema: { $ref: "#/components/schemas/ServerProbeResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Unreachable, rejected or a fingerprint mismatch.", content: { application/json: { schema: { $ref: "#/components/schemas/ServerProbeResult" } } } }
  /servers/refresh:
    post:
      tags: [Servers]
      operationId: serversRefreshAll
      summary: Queue a probe for every enabled server of this user
      security: [ { bearerAuth: [] } ]
      responses:
        "202": { description: "Queued.", content: { application/json: { schema: { type: object, properties: { queued: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /servers/{server}:
    get:
      tags: [Servers]
      operationId: serversShow
      summary: One server with its snapshot history
      description: >
        `history` carries only the series a trend chart draws (load, memory,
        fullest filesystem) for the newest 50 runs, not the whole snapshot for
        each. The server object additionally carries `public_key`, derived from
        the stored key, so a client can print removal instructions naming the
        exact authorized_keys line to delete. `forecast` projects when each
        filesystem runs out, computed here because the client only ever holds a
        window of the history while the slope needs all of it.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: server, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    allOf:
                      - $ref: "#/components/schemas/Server"
                      - type: object
                        properties:
                          public_key: { type: [string, "null"], description: "Public half of the stored key, OpenSSH one-line form. Derived on demand; the private key is never returned." }
                  forecast:
                    type: object
                    description: >
                      Least squares over the stored samples. `ready` is false
                      until there is enough history for a slope to mean
                      anything, and `days_to_full` is null for a filesystem
                      that is flat, shrinking, or merely noisy — a disk that
                      has sat at 91 percent for months is not the emergency,
                      and inventing a date from noise would be worse than
                      saying nothing.
                    properties:
                      ready: { type: boolean }
                      hours_of_history: { type: number }
                      samples: { type: integer }
                      disks:
                        type: array
                        items:
                          type: object
                          properties:
                            mount: { type: string }
                            used_pct: { type: number }
                            per_day: { type: number, description: "Percentage points per day; negative when the filesystem is shrinking." }
                            days_to_full: { type: [number, "null"] }
                            fit: { type: number, description: "R squared. Below 0.5 no date is quoted." }
                      memory:
                        type: [object, "null"]
                        properties:
                          used_pct: { type: number }
                          per_day: { type: number }
                          days_to_full: { type: [number, "null"] }
                          fit: { type: number }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        ok: { type: boolean }
                        error: { type: [string, "null"] }
                        collected_at: { type: string, format: date-time }
                        duration_ms: { type: integer }
                        load: { type: array, items: { type: number } }
                        mem_used_pct: { type: [number, "null"] }
                        cpu_used_pct: { type: [number, "null"], description: "Busy share of the CPU (everything except idle and iowait), from two /proc/stat samples a second apart." }
                        disk_max_pct: { type: [number, "null"] }
                        gpu_used_pct: { type: [number, "null"], description: "Busiest GPU of the host, or null when it has none that reports a load — the client draws no GPU series in that case rather than a flat zero." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Servers]
      operationId: serversUpdate
      summary: Update a server (a blank secret keeps the stored one)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: server, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServerInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { server: { $ref: "#/components/schemas/Server" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Servers]
      operationId: serversDestroy
      summary: Stop monitoring a server (the server itself is untouched)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: server, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Removed.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /servers/{server}/refresh:
    post:
      tags: [Servers]
      operationId: serversRefresh
      summary: Queue a fresh probe for one server
      description: "202: the request never opens the SSH session. Poll index/show for the result."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: server, in: path, required: true, schema: { type: integer } } ]
      responses:
        "202": { description: "Queued.", content: { application/json: { schema: { type: object, properties: { queued: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /servers/{server}/test:
    post:
      tags: [Servers]
      operationId: serversTestStored
      summary: Re-test a stored server with its stored credentials
      description: "Also re-reads the host key, so a mismatch against the pin surfaces here."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: server, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Reachable.", content: { application/json: { schema: { $ref: "#/components/schemas/ServerProbeResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Unreachable or rejected.", content: { application/json: { schema: { $ref: "#/components/schemas/ServerProbeResult" } } } }
  /servers/{server}/checks:
    get:
      tags: [Servers]
      operationId: serversChecks
      summary: Reachability history for one server
      description: >
        Ping and port-check results, grouped by what is being checked. Bounded by
        hours rather than by row count so the answer does not shift with how many
        ports the owner happens to watch. Throttled 120/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: hours
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 168, default: 24 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hours: { type: integer }
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/ServerCheckSeries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/log-sources:
    get:
      tags: [Servers]
      operationId: serversLogSources
      summary: What logs this host can offer
      description: >
        Asks the host which log systems exist and which units, containers and
        files are actually present. This is also the security boundary for the
        read below: a selection must be something this endpoint reported, so the
        browser chooses from the host's own answer rather than naming a target of
        its own. Opens an SSH session inline with the interactive timeouts, like
        the connection test, and is throttled 20/min accordingly.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { type: boolean, description: "journalctl is present and runnable as the monitoring account." }
                  units: { type: array, items: { type: string }, description: "Running systemd services." }
                  containers: { type: array, items: { type: string } }
                  files: { type: array, items: { type: string }, description: "Readable files under /var/log." }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/logs:
    post:
      tags: [Servers]
      operationId: serversLogs
      summary: Read the tail of one log
      description: >
        Returns a bounded slice of one log. Nothing from the request becomes a
        command: the source is one of a fixed set, the line count is an integer
        capped at 2000, and unit, container and path are matched against strict
        patterns and quoted for POSIX sh before being assembled into a fixed
        command shape. A file path must lie under /var/log. Throttled 30/min;
        the response carries Cache-Control no-store.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, enum: [journal, docker, file] }
                unit: { type: [string, "null"], maxLength: 128, description: "systemd unit; journal source only." }
                container: { type: [string, "null"], maxLength: 128, description: "Container name or id; docker source only." }
                path: { type: [string, "null"], maxLength: 200, description: "Absolute path under /var/log; file source only." }
                lines: { type: integer, minimum: 1, maximum: 2000, default: 200 }
                errors_only: { type: boolean, default: false, description: "journalctl -p err; journal source only." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The selection was refused, or the host was unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [invalid_selection, unreachable] }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/unlock:
    post:
      tags: [Servers]
      operationId: serversFilesUnlock
      summary: Unlock the file browser
      description: >
        Exchanges the account password for a short-lived grant. Unconditional -
        no "recently confirmed" shortcut and no exemption for a native device
        token, because with the root access this module requires the browser
        reads and overwrites any file on the target. A terminal announces what
        it is; a file listing looks harmless and is not. The grant lasts fifteen
        minutes and is bound to one account and one server, so the value alone
        is not a capability. It travels back in the X-File-Grant header on every
        subsequent call, never in a URL. Audited. Throttled 10/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: The grant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Wrong password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [bad_password] }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/lock:
    post:
      tags: [Servers]
      operationId: serversFilesLock
      summary: Give the grant back
      description: Leaving the browser should not leave it unlocked. Throttled 60/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Locked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files:
    get:
      tags: [Servers]
      operationId: serversFilesIndex
      summary: List a directory
      description: >
        Over SFTP rather than the shell path the rest of the module uses,
        because ls output cannot be parsed unambiguously and this needs typed
        entries. Paths are absolute, resolved here (so a parent reference cannot
        walk past a later check) and refused if they carry a control character,
        because the batch input is line-based and a newline could never be sent.
        The timestamp is left as the host printed it - sftp gives no year for a
        recent file, so an exact time would be invented. Needs an unlock grant.
        Throttled 300/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  path: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
                        type: { type: string, enum: [file, dir, link, special] }
                        perms: { type: string }
                        owner: { type: string }
                        group: { type: string }
                        size: { type: integer }
                        modified: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: No unlock grant, or the module is off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [locked] }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/read:
    get:
      tags: [Servers]
      operationId: serversFilesRead
      summary: Read a file as text
      description: >
        For preview and the editor. Refuses anything that is not text rather
        than handing back a mangled string: a binary opened in an editor and
        saved back is a destroyed file. That refusal answers 200 with binary
        set, because it is not a mistake the caller made. Capped at 2 MiB.
        Needs an unlock grant. Throttled 120/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The contents, or why not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  content: { type: string }
                  binary: { type: boolean }
                  size: { type: integer }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/download:
    get:
      tags: [Servers]
      operationId: serversFilesDownload
      summary: Download a file
      description: >
        Fetched to a temporary file and streamed from there, so a large file
        never sits in memory. Served as an attachment with nosniff and a
        sandbox CSP, like every other byte stream in this application. Needs an
        unlock grant. Throttled 60/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/download-dir:
    get:
      tags: [Servers]
      operationId: serversFilesDownloadDir
      summary: Download a directory as an archive
      description: >
        Tarred on the host and fetched as one transfer, because there is no
        sensible way to hand a browser a tree and one archive beats one request
        per file. The archive is written to a temporary name on the target and
        removed afterwards whatever happens, so a failure does not leave a copy
        of somebody's directory in /tmp. The filesystem root is refused: tarring
        it over a web request is a way to take the machine down, not a feature.
        Needs an unlock grant. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The archive.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/archive-tools:
    get:
      tags: [Servers]
      operationId: serversFilesArchiveTools
      summary: Which archive formats the host can handle
      description: >
        Asked rather than assumed. A minimal host often has tar and gzip and
        nothing else, and offering a zip button that always fails is worse than
        not offering it. Packing and unpacking are reported separately because
        they are not the same capability: gzip unpacks a .gz, but only tar turns
        a directory into a single file. Needs an unlock grant. Throttled 60/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Supported formats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: { type: array, items: { type: string } }
                  extract: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/archive:
    post:
      tags: [Servers]
      operationId: serversFilesArchive
      summary: Pack a selection into one archive and download it
      description: >
        Packed on the host, not here. Pulling a directory across to tar it
        locally would be one transfer per file and would arrive without any of
        the permissions a tar preserves. Paths are stored relative to their
        common parent, so unpacking the result somewhere else does not recreate
        the machine's entire directory layout around the files. The temporary
        archive on the target is removed whatever happens. Needs an unlock
        grant. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
                format:
                  type: string
                  enum: [tar, tar.gz, tar.xz, tar.bz2, tar.zst, zip, 7z]
      responses:
        "200":
          description: The archive.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/extract:
    post:
      tags: [Servers]
      operationId: serversFilesExtract
      summary: Unpack an archive on the host
      description: >
        Into a directory named after the archive, beside it, never straight into
        the current one: an archive that turns out to hold two hundred loose
        files should not scatter them across somebody's working directory. The
        format is taken from the file name and must be one the host can actually
        unpack, which is what archive-tools is for. Audited. Needs an unlock
        grant. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                destination: { type: string, nullable: true }
      responses:
        "200":
          description: Result, including the directory it landed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  dest: { type: string, nullable: true }
                  error: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/permissions:
    get:
      tags: [Servers]
      operationId: serversFilesPermissions
      summary: Read ownership, mode and ACLs
      description: >
        Over the shell path rather than SFTP, which can set a numeric owner but
        knows nothing about names, groups or POSIX ACLs. Also returns the
        account and group names the host knows, so the interface can offer them
        rather than ask an operator to remember them. When the acl tools are
        missing, acl_supported is false and the list is empty - that means the
        ACLs could not be read, not that there are none, and the interface says
        so. Needs an unlock grant. Throttled 120/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: What governs access to the path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mode: { type: string, description: "Four octal digits, special bits first." }
                  owner: { type: string }
                  group: { type: string }
                  uid: { type: integer }
                  gid: { type: integer }
                  type: { type: string }
                  acl: { type: array, items: { type: string } }
                  acl_supported: { type: boolean }
                  users: { type: array, items: { type: string } }
                  groups: { type: array, items: { type: string } }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Servers]
      operationId: serversFilesSetPermissions
      summary: Change mode, ownership or ACLs
      description: >
        The mode is validated as three or four octal digits and account names
        against a narrow pattern, because both reach a command line. Recursion
        is opt-in and named: chmod -R on the wrong directory ends an afternoon.
        ACL entries are applied only after mode and ownership landed, so a
        half-applied change is never reported as a success. Audited with the
        path named. Needs an unlock grant. Throttled 60/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                mode: { type: [string, "null"], description: "Octal, three or four digits." }
                owner: { type: [string, "null"] }
                group: { type: [string, "null"] }
                recursive: { type: boolean }
                acl:
                  type: array
                  items: { type: string, example: "u:alice:rwx" }
                acl_remove: { type: boolean, description: "Remove the given entries instead of adding them." }
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/write:
    post:
      tags: [Servers]
      operationId: serversFilesWrite
      summary: Save a file
      description: >
        Uploaded beside the target and renamed into place, because a transfer
        cut short halfway is otherwise a half-written configuration file; the
        rename is atomic on the same filesystem, so the file is either the old
        one or the new one and never a fragment. If it fails, the staging name
        is cleaned up rather than left as litter. Audited with the path named.
        Needs an unlock grant. Throttled 60/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path: { type: string }
                content: { type: string }
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/upload:
    post:
      tags: [Servers]
      operationId: serversFilesUpload
      summary: Upload a file into a directory
      description: >
        Same staging-then-rename as a save. Audited with the path named. Needs
        an unlock grant. Throttled 30/min.


        The destination name comes from the client, so it is confined to `path`
        here: the resolved target must sit under that directory or the upload is
        refused. A relative path climbing upwards still resolves to something
        valid, just not to where the browser says it went, and a file quietly
        written to /etc instead of /tmp is the problem worth refusing.


        Directories are not created implicitly. A folder upload issues the
        mkdir calls first (shallowest first) through
        `/servers/{server}/files/mutate`, so each one is audited like any other
        change.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [path, file]
              properties:
                path: { type: string, description: "The directory to place it in." }
                file: { type: string, format: binary }
                relative_path:
                  type: string
                  description: >
                    Set when a folder was dropped: the file's position inside
                    that folder ("conf/nginx/site.conf"), so the tree is rebuilt
                    on the host rather than every file landing flat in one
                    directory. Confined under `path`; omitted for a plain file
                    upload, where the uploaded name is used.
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Invalid input, or a destination that resolves outside `path` (`invalid_path`)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/files/mutate:
    post:
      tags: [Servers]
      operationId: serversFilesMutate
      summary: Create, delete, rename or chmod
      description: >
        The mode is validated as three or four octal digits rather than quoted
        around, because it reaches a command line. Audited with the path named.
        Needs an unlock grant. Throttled 60/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, path]
              properties:
                action: { type: string, enum: [mkdir, rmdir, rm, rename, chmod] }
                path: { type: string }
                target: { type: [string, "null"], description: "New path, for rename." }
                mode: { type: [string, "null"], description: "Octal, for chmod." }
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/power:
    post:
      tags: [Servers]
      operationId: serversPower
      summary: Reboot or shut the machine down
      description: >
        The most consequential endpoint in the module. `reboot_force` is
        deliberately separate from `reboot`: the ordinary one asks systemd to
        stop units in order, the forced one skips that, and they read alike
        while behaving nothing alike. Audited before the command is sent as
        well as after, so a machine that never comes back still leaves a record
        of who asked. A dropped connection is reported as success for the three
        destructive verbs, because the link going away is what a reboot does;
        for `cancel` it is reported as unreachable. Needs root on the target.
        Throttled 10/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [reboot, reboot_force, poweroff, cancel] }
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/sessions/kill:
    post:
      tags: [Servers]
      operationId: serversKillSession
      summary: End a login session
      description: >
        Signals everything attached to the terminal, which is what logging a
        user out means — killing only the shell leaves whatever it started
        running. The terminal name is matched against a strict pattern, so
        anything that is not a tty never reaches the host. Audited. Needs root
        unless the session belongs to the same account. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tty]
              properties:
                tty: { type: string, example: "pts/3" }
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/bans:
    get:
      tags: [Servers]
      operationId: serversBans
      summary: List banned addresses
      description: >
        fail2ban and CrowdSec side by side rather than one treated as "the" ban
        list: a host often runs fail2ban for sshd and CrowdSec for the web tier,
        and an address banned by one is unknown to the other. fail2ban groups by
        jail; CrowdSec keeps one flat list of decisions. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The ban lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  fail2ban:
                    type: array
                    items:
                      type: object
                      properties:
                        jail: { type: string }
                        ips: { type: array, items: { type: string } }
                  crowdsec:
                    type: array
                    items:
                      type: object
                      properties:
                        ip: { type: string }
                        reason: { type: string }
                        expires: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Servers]
      operationId: serversBanAction
      summary: Unban, ban or allow-list an address
      description: >
        The address is parsed as an address before anything is assembled, so a
        value that only looks right is refused rather than quoted. fail2ban acts
        per jail and has no runtime allow-list, so `allow` there only unbans and
        answers with `f2b_allow_is_manual` — the permanent entry belongs in
        jail.local, and claiming otherwise would be a lie the next restart
        exposes. Audited with the address named. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [daemon, action, ip]
              properties:
                daemon: { type: string, enum: [fail2ban, crowdsec] }
                action: { type: string, enum: [unban, ban, allow] }
                ip: { type: string }
                jail: { type: [string, "null"], description: "Required for fail2ban." }
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/disk-usage:
    get:
      tags: [Servers]
      operationId: serversDiskUsage
      summary: What is using the space under a path
      description: >
        "94 percent full" is half an answer; the other half is which directory
        to look in, and without it somebody runs du by hand over ssh anyway. On
        demand rather than in the probe, because du walks the whole tree and has
        no business doing that every five minutes. Bounded three ways - depth,
        a hard timeout on both ends, and one filesystem only, since an unbounded
        du on a host with a network mount is a way to make the machine unhappy
        while you watch. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 3, default: 1 }
      responses:
        "200":
          description: The largest directories, biggest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  path: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        size_kb: { type: integer }
                  truncated:
                    type: boolean
                    description: "du ran out of time and these figures cover only part of the tree. A partial answer that looks like a complete one is the worst kind, so it is labelled."
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/backup:
    get:
      tags: [Servers]
      operationId: serversBackup
      summary: How this host is backed up, and whether it happened
      description: >
        Written after looking at real machines, none of which is backed up the
        way a tool-detector would expect: one runs an Acronis agent, two are
        protected by a cron line calling a shell script, and a panel host adds
        hand-written database dumps on top. So `schedules` is the centre of this
        -- systemd timers and cron jobs that look like backups, including
        hand-written scripts no tool list would ever find.


        `last_run` is evidence rather than intent: where a job redirects into a
        log, that file's age answers "did it run last night" in a way a schedule
        cannot. `tools` is inventory only and labelled as such -- a tool that is
        installed and never run protects nothing.


        Commands and repository paths are redacted before they leave the host: a
        cron line commonly carries `-pPASSWORD`, and a repository URL can carry
        credentials in front of the hostname. Read-only. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Schedules, agents, recent runs, destinations and installed tools.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        version: { type: [string, "null"] }
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        unit: { type: string }
                        active: { type: boolean }
                        state: { type: string }
                  schedules:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [timer, cron] }
                        name: { type: string }
                        runs: { type: string, description: "The command, with secrets redacted."}
                        schedule: { type: string }
                        log: { type: [string, "null"] }
                        last_run:
                          type: [integer, "null"]
                          description: Unix time the job's log was last written, when there is one.
                        log_size: { type: [integer, "null"] }
                  activities:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        state: { type: string }
                        started: { type: string }
                        elapsed: { type: string }
                        result:
                          type: [string, "null"]
                          description: Absent while a run is still going, which is not a failure.
                  repositories: { type: array, items: { type: string } }
                  error: { type: [string, "null"] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /servers/{server}/panels:
    get:
      tags: [Servers]
      operationId: serversPanels
      summary: Which hosting control panel owns this machine, if any
      description: >
        Plesk, cPanel/WHM, DirectAdmin, ISPConfig, Webmin/Virtualmin, CyberPanel,
        HestiaCP, VestaCP, aaPanel, CloudPanel, Froxlor, KeyHelp, Cockpit, the
        RunCloud and ServerPilot agents, plus Portainer, Coolify, CapRover and
        friends when they run as containers. Named panels are recognised by their
        own binary or install path and asked for a version; container panels are
        recognised by image rather than container name, because the name is
        whatever somebody typed.


        `candidates` is deliberately separate and deliberately not a detection:
        something is listening on a port panels commonly use and nothing here
        claimed it. Port 8080 is a panel on one host and a staging app on the
        next, so it is reported as a lead, never as an identity.


        `running` is three-valued: `true` and `false` describe a unit that exists,
        `null` means there is no unit to ask -- not the same as stopped. A count
        is omitted entirely rather than reported as 0 when its directory could not
        be read.


        No credential is ever printed. `bt default` and
        `plesk bin admin --get-login-link` both hand out working access and are
        deliberately not run. Read-only; acting on a panel goes through the
        ordinary service endpoint with the unit named here. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Every panel found on the host, plus what merely looks like one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  panels:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        installed: { type: boolean }
                        version: { type: [string, "null"] }
                        unit: { type: [string, "null"] }
                        unit_state: { type: [string, "null"] }
                        running:
                          type: [boolean, "null"]
                          description: null means there is no unit to ask, not "stopped".
                        ports:
                          type: array
                          items: { type: integer }
                          description: Only ports genuinely listening, never documented defaults.
                        path: { type: [string, "null"] }
                        container: { type: [string, "null"] }
                        image: { type: [string, "null"] }
                        facts: { type: object, additionalProperties: { type: string } }
                        counts: { type: object, additionalProperties: { type: integer } }
                        note: { type: [string, "null"] }
                        details:
                          type: object
                          description: >
                            Panel-specific detail, empty for panels that have
                            none. Plesk answers from its own database in tens of
                            milliseconds, so this rides along in the same round
                            trip: the PHP handler in use per site (the figure
                            that turns into work -- a version out of support is
                            not a detail), the largest domains with their TLS
                            and status, the customers, and the installed
                            extensions. A domain counts as active only on
                            Plesk's status 0; the rest of that bitmask is
                            reported as "not active" rather than guessed at.
                          properties:
                            php:
                              type: array
                              items:
                                type: object
                                properties:
                                  handler: { type: string }
                                  version: { type: [string, "null"] }
                                  count: { type: integer }
                            domains:
                              type: array
                              items:
                                type: object
                                properties:
                                  name: { type: string }
                                  active: { type: boolean }
                                  ssl: { type: boolean }
                                  php: { type: [string, "null"] }
                                  size_mb: { type: [integer, "null"] }
                            clients:
                              type: array
                              items:
                                type: object
                                properties:
                                  name: { type: string }
                                  active: { type: boolean }
                                  domains: { type: integer }
                            extensions: { type: array, items: { type: string } }
                            disk_gb: { type: number }
                            ips:
                              type: array
                              items:
                                type: object
                                properties:
                                  address: { type: string }
                                  mask: { type: string }
                                  interface: { type: string }
                                  public: { type: [string, "null"] }
                                  main: { type: boolean }
                            databases:
                              type: array
                              items:
                                type: object
                                properties:
                                  name: { type: string }
                                  type: { type: string }
                                  domain: { type: [string, "null"] }
                            settings:
                              type: object
                              additionalProperties: { type: string }
                              description: >
                                A named allow-list of panel settings. `misc` also
                                holds the admin password hash, so the query asks
                                for the keys it wants rather than for whatever is
                                there.
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        port: { type: integer }
                        address: { type: string }
                        process: { type: [string, "null"] }
                        hint: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /servers/{server}/panels/site:
    post:
      tags: [Servers]
      operationId: serversPanelSiteAction
      summary: Activate, suspend or disable a website on a hosting panel
      description: >
        Plesk only, through `plesk bin site`. The verb is one of `on`,
        `suspend`, `off` and the domain is validated before anything is sent, so
        nothing from a request is concatenated into the command untested. A
        well-formed but unknown domain is passed on and refused by Plesk itself;
        this is not an allow-list of the sites that exist.


        `suspend` and `off` stay separate because they are: Plesk shows a
        suspension notice for the first and simply stops answering for the
        second. Every call is audited with the server, the domain, the verb and
        the outcome. A host without the panel answers `not_installed` rather
        than failing obscurely. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, action]
              properties:
                domain: { type: string, maxLength: 255 }
                action: { type: string, enum: [on, suspend, off] }
      responses:
        "200":
          description: What the panel said, and whether it worked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error:
                    type: [string, "null"]
                    enum: [invalid_selection, not_installed, unreachable, no_host_key, null]
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /servers/{server}/vpn:
    get:
      tags: [Servers]
      operationId: serversVpn
      summary: Which overlay network this host is on, and how it is doing
      description: >
        NetBird, Tailscale, ZeroTier, WireGuard and OpenVPN. Four of the five are
        read from a machine format -- three speak JSON, WireGuard has a stable
        tab-separated dump -- rather than from the text meant for a person, so a
        field containing a space is not a parsing problem. OpenVPN has no status
        command at all and is reported from its units, its configuration files
        and its tunnel interfaces instead.


        A provider missing from the answer means it was not found. A provider
        present with `installed: true` and `facts.access = denied` means the tool
        is there but reading it needs privilege this account does not have --
        which is the opposite of "no tunnels", and never shown as such.
        Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Every provider found on the host.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: [string, "null"] }
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [netbird, tailscale, zerotier, wireguard, openvpn] }
                        name: { type: string }
                        installed: { type: boolean }
                        connected: { type: boolean }
                        address: { type: [string, "null"] }
                        hostname: { type: [string, "null"] }
                        version: { type: [string, "null"] }
                        unit:
                          type: [object, "null"]
                          properties:
                            load: { type: string }
                            active: { type: string }
                            sub: { type: string }
                        facts: { type: object, additionalProperties: { type: string } }
                        peers_connected: { type: integer }
                        peers_total: { type: integer }
                        peers:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: [string, "null"] }
                              address: { type: [string, "null"] }
                              status: { type: [string, "null"] }
                              route: { type: [string, "null"], description: "P2P or Relayed: a direct link, or a hop through someone else's server." }
                              relay: { type: [string, "null"] }
                              last_handshake: { type: [string, "null"] }
                              rx: { type: [integer, "null"] }
                              tx: { type: [integer, "null"] }
                              latency_ns: { type: [integer, "null"] }
                        dns:
                          type: array
                          description: "Which resolver serves which domains over the overlay; a failed one carries its own error."
                          items:
                            type: object
                            properties:
                              servers: { type: [string, "null"] }
                              domains: { type: string }
                              enabled: { type: boolean }
                              error: { type: [string, "null"] }
                        events:
                          type: array
                          description: "What the daemon says happened, newest first. Tailscale contributes its health warnings here."
                          items:
                            type: object
                            properties:
                              at: { type: [string, "null"], format: date-time }
                              severity: { type: [string, "null"] }
                              category: { type: [string, "null"] }
                              message: { type: [string, "null"] }
                        networks: { type: array, description: "ZeroTier and NetBird: joined or routed networks.", items: { type: object } }
                        interfaces: { type: array, description: "WireGuard only.", items: { type: object } }
                        units: { type: array, description: "OpenVPN only.", items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/vpn/action:
    post:
      tags: [Servers]
      operationId: serversVpnAction
      summary: Bring an overlay network up, down or round again
      description: >
        The verb comes from a fixed set and the command from a fixed table in
        source; nothing from the request becomes part of it. A per-tunnel
        provider (WireGuard, OpenVPN) additionally names its unit, validated
        against the same pattern as any other service.


        Audited BEFORE the command is sent: taking down the network this app
        reaches the host through means the answer may never arrive, and an
        action that leaves no trace when it works is worse than none. For that
        reason a dropped connection counts as success for `down` and `restart` --
        the drop is the effect -- while `up` reports it as unreachable.
        Throttled 10/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, action]
              properties:
                provider: { type: string, enum: [netbird, tailscale, zerotier, wireguard, openvpn] }
                action: { type: string, enum: [up, down, restart] }
                unit: { type: string, description: "Required for wireguard and openvpn: the systemd unit of the tunnel." }
      responses:
        "200":
          description: What the host said.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Unknown provider or verb; nothing reached the host.", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/role-details:
    get:
      tags: [Servers]
      operationId: serversRoleDetails
      summary: The figures that only matter for what this machine is
      description: >
        A mail server is judged by its queue and how much of its post is spam, a
        Proxmox host by its guests, a database server by its connections.
        Showing all of that on every server would bury each of them, so only the
        sections for the roles this host actually has are collected - and the
        roles come from the stored snapshot, never from the request. One round
        trip regardless of how many apply, because each one costs a full SSH
        handshake. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Whatever applies; every section is null where the role does not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mail:
                    type: [object, "null"]
                    properties:
                      queued: { type: [integer, "null"], description: "Zero is an answer; null means the queue could not be read." }
                      queue_raw: { type: [string, "null"] }
                      rspamd: { type: [object, "null"], additionalProperties: { type: integer } }
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            user: { type: string }
                            service: { type: string }
                  guests:
                    type: [array, "null"]
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        id: { type: string }
                        name: { type: string }
                        status: { type: string }
                  databases:
                    type: [array, "null"]
                    items:
                      type: object
                      properties:
                        engine: { type: string }
                        name: { type: string }
                        size_b: { type: [integer, "null"] }
                        connections: { type: [integer, "null"] }
                  sites: { type: [array, "null"], items: { type: string } }
                  unreadable:
                    type: array
                    items: { type: string }
                    description: >
                      Roles whose tools are not installed on the host, so nobody
                      could look. On a Docker host, Postgres and Caddy run inside
                      containers and psql is absent - an empty list there would
                      claim there are no databases. Those sections come back null
                      and are named here instead.
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/updates:
    get:
      tags: [Servers]
      operationId: serversUpdates
      summary: Which updates are waiting
      description: >
        The snapshot counts them; a count decides nothing. Fourteen pending
        updates might be a kernel and thirteen fonts, or thirteen fonts and one
        remote hole. The security-relevant ones are separated out and listed
        first. That flag comes from the origin apt reports in brackets, never
        from the package name - a package called "security-tools" from an
        ordinary repository is not a security update. Alpine's output does not
        say, so nothing there is marked as one rather than guessed at.
        Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Pending updates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  kind: { type: string, enum: [apt, apk, none, unknown] }
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        current: { type: string }
                        version: { type: string }
                        security: { type: boolean }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Servers]
      operationId: serversUpdatesApply
      summary: Install the pending updates
      description: >
        Queued, never inline: an upgrade takes minutes, and a request that holds
        a worker for minutes is a mistake this application has already made
        twice. Answers 202; the outcome arrives as a notification carrying the
        tail of the host's own output. The command is fixed per package manager
        and nothing from the request becomes part of it; it never adds a
        repository, changes a source, or removes a package to satisfy a
        dependency. Audited before dispatch, so a machine that does not come
        back still leaves a record that an upgrade was started. Throttled 6/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/docker:
    get:
      tags: [Servers]
      operationId: serversDocker
      summary: Containers, images, volumes, networks and disk use
      description: >
        One round trip that collects everything rather than a call per panel:
        each one costs a full SSH handshake, and a page that opens five
        connections to draw itself is slow for no reason. Distinguishes an
        engine that is not installed from one the monitoring account is not
        allowed to talk to - those are opposite answers, and reporting "no
        containers" for a permission problem would be a lie. Throttled 60/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Docker state, or why it could not be read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  error: { type: string, nullable: true }
                  version: { type: string, nullable: true }
                  containers: { type: array, items: { type: object, additionalProperties: true } }
                  images: { type: array, items: { type: object, additionalProperties: true } }
                  volumes: { type: array, items: { type: object, additionalProperties: true } }
                  networks: { type: array, items: { type: object, additionalProperties: true } }
                  disk: { type: array, items: { type: object, additionalProperties: true } }
                  compose: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/docker/storage:
    get:
      tags: [Servers]
      operationId: serversDockerStorage
      summary: Images and reclaimable space on the host's Docker engine
      description: >
        Asked for separately from the container sweep. On a host with a real
        image collection `docker images` and `docker system df` take tens of
        seconds each -- measured at 14 s and 23 s on a 23-container host -- and
        holding the tab for them left it empty. Everything somebody opens the
        Docker tab for is in `GET /servers/{server}/docker`; this call fills in
        the images list and the reclaimable figures when that section is opened.


        `error` distinguishes `timeout` from `unreachable`: a call that outlived
        its budget is not a host that cannot be reached, and the engine usually
        finishes the work anyway. Read-only. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Images and disk usage, or the reason neither could be read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        repo: { type: string }
                        tag: { type: string }
                        size: { type: string }
                        created: { type: string }
                  disk:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        total: { type: string }
                        active: { type: string }
                        size: { type: string }
                        reclaimable: { type: string }
                  error:
                    type: [string, "null"]
                    enum: [timeout, unreachable, no_host_key, null]
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /servers/{server}/docker/action:
    post:
      tags: [Servers]
      operationId: serversDockerAction
      summary: Start, stop, restart, pause or remove a container
      description: >
        The verb comes from a fixed set and the container name must match a
        strict pattern, so nothing typed into a request is ever parsed as part
        of a command line. A well-formed name the host does not know is passed
        through and refused by Docker itself. Every action
        is audited with the container and the result. Same boundary as the
        terminal: everything here could be typed into a shell. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [container, action]
              properties:
                container: { type: string }
                action:
                  type: string
                  enum: [start, stop, restart, pause, unpause, kill, remove]
      responses:
        "200":
          description: Result and the host's own output.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/docker/prune:
    post:
      tags: [Servers]
      operationId: serversDockerPrune
      summary: Reclaim space from unused images, containers, volumes or networks
      description: >
        Deliberately one target per call rather than a single sweep: pruning
        volumes throws data away, pruning dangling images does not, and putting
        both behind one button would hide that difference at exactly the moment
        it matters. Audited with the target and the reclaimed size. Throttled
        10/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  enum: [images, containers, volumes, networks, builder]
      responses:
        "200":
          description: Result and the host's own output.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/security:
    get:
      tags: [Servers]
      operationId: serversSecurity
      summary: Read the security posture
      description: >
        Firewalls, ban daemons, the resolved sshd configuration and update
        hygiene, in one SSH round trip. Reports every packet filter found, not
        the first one: a real host often runs nftables underneath with
        iptables-nft on top and ufw or firewalld driving either. Listing rules
        needs root on most systems, so a firewall an unprivileged account
        cannot read comes back as readable=false, which means "cannot tell",
        not "no rules". Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The audit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  firewalls:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        present: { type: boolean }
                        readable: { type: boolean, description: "False means the rules could not be read, not that there are none." }
                        active: { type: [boolean, "null"] }
                        summary: { type: string }
                        detail: { type: string }
                  bans:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        present: { type: boolean }
                        readable: { type: boolean }
                        summary: { type: string }
                        detail: { type: string }
                  ssh:
                    type: object
                    additionalProperties: { type: string }
                  updates:
                    type: object
                    properties:
                      unattended: { type: boolean }
                      reboot_required: { type: boolean }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/services:
    get:
      tags: [Servers]
      operationId: serversServices
      summary: List services
      description: >
        Every systemd service the host knows about, stopped ones included — a
        service you cannot see is a service you cannot start. Opens an SSH
        session inline with the interactive timeouts; throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  units:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        load: { type: string }
                        active: { type: string, description: "active, inactive, failed …" }
                        sub: { type: string, description: "running, dead, exited …" }
                        description: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Servers]
      operationId: serversServiceAction
      summary: Start, stop, restart or reload a service
      description: >
        Changes the target, so it is audited with the server and unit named. The
        verb comes from a fixed set and the unit is matched against a strict
        pattern before anything is assembled.

        These actions need privilege the module otherwise avoids: a monitoring
        account set up as documented cannot control services, and the host's own
        refusal is returned in `output` rather than swallowed. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit, action]
              properties:
                unit: { type: string, maxLength: 128 }
                action: { type: string, enum: [start, stop, restart, reload] }
      responses:
        "200":
          description: The command ran; ok says whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string, description: "Whatever the host said, verbatim." }
                  error: { type: [string, "null"], enum: [command_failed, unreachable, null] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/processes:
    get:
      tags: [Servers]
      operationId: serversProcesses
      summary: List processes
      description: >
        The hundred largest processes by resident memory. Sorted by memory
        rather than CPU: a snapshot cannot say anything honest about
        instantaneous CPU load. Throttled 30/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  processes:
                    type: array
                    items:
                      type: object
                      properties:
                        pid: { type: integer }
                        user: { type: string }
                        cpu: { type: number }
                        mem: { type: number }
                        rss_kb: { type: integer }
                        command: { type: string }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/processes/signal:
    post:
      tags: [Servers]
      operationId: serversProcessSignal
      summary: Signal a process
      description: >
        TERM asks, KILL insists. Audited with the server and pid named. pid 1 is
        refused outright — signalling init takes the machine down, and no
        interface should put that one mis-click away. Throttled 20/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pid, signal]
              properties:
                pid: { type: integer, minimum: 2, maximum: 4194304 }
                signal: { type: string, enum: [TERM, KILL] }
      responses:
        "200":
          description: The signal was sent; ok says whether it was accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
                  error: { type: [string, "null"], enum: [command_failed, unreachable, null] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Refused before reaching the host.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [invalid_selection, refused_pid1] }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/terminal:
    post:
      tags: [Servers]
      operationId: serversTerminalOpen
      summary: Open an interactive shell
      description: >
        Starts a shell session on the host. The account password is required
        EVERY time and is never remembered — a device token alone cannot obtain
        a shell. Opening is recorded in the audit log with the server named.

        This is the one endpoint in the module where what runs on the remote
        machine is decided by whoever is typing, rather than by a fixed script.
        A key restricted with a forced command cannot open a shell at all, which
        is the recommended posture and deliberately incompatible with this
        feature. See the security register.

        The session runs on a dedicated queue; without a worker for it a session
        never becomes ready and the client says so. Sessions are capped at two
        per account, thirty minutes of life and two minutes of idle. Throttled
        10/min.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string }
                cols: { type: integer, minimum: 20, maximum: 500, default: 80 }
                rows: { type: integer, minimum: 5, maximum: 200, default: 24 }
      responses:
        "201":
          description: Session opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string, description: "48 alphanumeric characters. Bound to this account and this server; both are checked on every subsequent call." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The password did not match.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [password_invalid] }
        "429":
          description: Rate limited, or two sessions are already open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [too_many_sessions] }
  /servers/{server}/terminal/{session}:
    get:
      tags: [Servers]
      operationId: serversTerminalPoll
      summary: Read terminal output
      description: >
        Returns everything produced since the cursor. Polling rather than a
        stream: this runtime serves requests from a fixed worker pool and a
        long-lived connection pins one for the session's duration. Each poll
        also signals that somebody is still watching, which is what keeps the
        shell open. Throttled 1200/min, because a live terminal polls often.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: session
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean, description: "A worker has the shell open. False means it is still starting, or no terminal worker is running." }
                  data: { type: string, description: "Base64. Terminal output is arbitrary bytes and need not be valid UTF-8, which a JSON string cannot carry." }
                  cursor: { type: integer, description: "Pass back on the next poll; the same bytes are never delivered twice." }
                  closed: { type: [string, "null"], description: "closed, exited, idle, expired, gone, failed, unsafe_host, no_host_key or no_credentials." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Servers]
      operationId: serversTerminalClose
      summary: End the session
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: session
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "Closed"}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /servers/{server}/terminal/{session}/input:
    post:
      tags: [Servers]
      operationId: serversTerminalInput
      summary: Send keystrokes
      description: >
        Base64-encoded bytes. A terminal carries control characters — Ctrl-C is
        0x03, arrow keys are escape sequences — and encoding also keeps the
        payload clear of the global input-trimming middleware, which would
        otherwise eat the newline that submits every command.
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: integer }
        - name: session
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, maxLength: 8192, description: "Base64." }
      responses:
        "200": { description: "Accepted"}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The body was not valid base64.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [bad_input] }
        "429": { $ref: "#/components/responses/RateLimited" }
  /invoices/ocr:
    post:
      tags: [Finance]
      operationId: invoicesOcr
      summary: OCR a receipt to line-structured text (transient plaintext)
      description: >
        Transient server-side OCR. The client POSTs the raw document bytes ONLY for
        text extraction; the server processes them in a shredded temp file, returns
        line-structured text, and stores/logs NOTHING (Cache-Control: no-store). The
        receipt file itself is stored separately as a plaintext blob via
        POST /finance/transactions/{transaction}/receipts (and invoice PDFs via
        POST /finance/invoices/{invoice}/pdf). The server returns ONLY text — it does
        NOT parse total/merchant/date/VAT (that recognition stays client-side and is
        identical across web/iOS/Android). PDFs use the embedded text layer when
        present (fast path, `source: pdf-text`), otherwise rasterise+OCR
        (`source: ocr`, ≤30 pages); images are OCR'd directly. `text` preserves visual
        line breaks (`\n`). Best-effort: a 501/timeout leaves manual entry intact.
        Requires the `finance` module. Throttle: 120 req/min (the receipt inbox
        fires one call per file sequentially for a batch upload).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The raw document bytes. Allowed: image/jpeg,png,gif,webp,bmp,tiff,avif
                    or application/pdf. Max 25 MiB.
                lang:
                  type: string
                  pattern: "^[a-z]{3}(\\+[a-z]{3})*$"
                  description: "Tesseract language string; default deu+eng."
                force_ocr:
                  type: boolean
                  description: >
                    Force rasterise+OCR of a PDF, skipping the embedded text layer.
                    Use when that layer is justified-mangled (spaces baked mid-word,
                    e.g. "Softw are"). Ignored for images. Default false.
      responses:
        "200":
          description: Extracted text.
          content:
            application/json:
              schema:
                type: object
                required: [text, source, pages]
                properties:
                  text:
                    type: string
                    description: Line-structured plain text (one visual line per newline).
                  source:
                    type: string
                    enum: [pdf-text, ocr]
                    description: "pdf-text = PDF embedded text layer; ocr = rasterised/scanned."
                  pages:
                    type: integer
                    description: Informational page count.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: File exceeds the 25 MiB OCR size limit.
        "415":
          description: Unsupported document type.
        "422":
          description: >
            Either the request failed validation (missing/invalid `file`, a `lang`
            not matching ^[a-z]{3}(\+[a-z]{3})*$, or a non-boolean `force_ocr`) →
            standard Laravel body { message, errors }; OR OCR ran but produced no
            usable text → { error: "no_text" }.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - type: object
                    required: [error]
                    properties:
                      error: { type: string, enum: [no_text] }
        "429":
          description: Rate limit exceeded (Retry-After header).
        "501":
          description: OCR toolchain not available on this server (client falls back to manual entry).

  /company:
    get:
      tags: [Company]
      operationId: companyShow
      summary: Read the caller's company profile + invoice defaults
      description: >
        The user's own business identity and invoice settings (name, address, tax/VAT
        ids, bank details, number format + next number, default VAT rate, payment terms,
        template, accent/heading colours). Non-secret — served in the clear. `has_logo`
        indicates whether a company logo is stored (fetch it at /company/logo).
      responses:
        "200":
          description: The company profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: "#/components/schemas/CompanyProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Company]
      operationId: companyUpdate
      summary: Update the caller's company profile
      description: >
        Update any subset of the company/invoice fields. Send JSON, or multipart to
        also set a raster `logo` (png/jpg/gif/webp, ≤2 MB; inline SVG is rejected as a
        stored-XSS vector) or `remove_logo=true`. Throttle 60/min.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyProfile" }
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/CompanyProfile"
                - type: object
                  properties:
                    logo: { type: string, format: binary }
                    remove_logo: { type: boolean }
      responses:
        "200":
          description: Saved profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: "#/components/schemas/CompanyProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Rate limit exceeded."}

  /company/logo:
    get:
      tags: [Company]
      operationId: companyLogo
      summary: Stream the caller's company logo
      description: >
        Returns the stored raster logo inline (sandboxed, nosniff). 404 if none is set.
        Throttle 120/min.
      responses:
        "200":
          description: The logo image bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "No logo stored."}

  # ── Per-user non-display settings (notify channels + file version cap) ──
  /settings:
    get:
      tags: [Preferences]
      operationId: settingsShow
      summary: Read the caller's per-user settings
      description: >
        Non-secret per-user settings a mobile client needs beyond display prefs:
        the personal file version cap.
      responses:
        "200": { description: "Settings.", content: { application/json: { schema: { $ref: "#/components/schemas/UserSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: settingsUpdate
      summary: Update per-user settings (partial)
      description: "Updates any subset; unspecified keys are left unchanged. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSettings" }
      responses:
        "200": { description: "Updated settings.", content: { application/json: { schema: { $ref: "#/components/schemas/UserSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Rate limit exceeded."}

  # ── Owner-side device pairing ──
  /device-pairings:
    post:
      tags: [DevicePairings]
      operationId: devicePairingStore
      summary: Generate a pairing code + QR (owner)
      description: "The owner (already paired) starts pairing a NEW device: returns a pairing id + QR data-URI carrying a short-lived one-time code (never a token). Throttle 20/min."
      responses:
        "200": { description: "Pairing started.", content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: integer, format: int64 }, qr: { type: string, description: "SVG data-URI." }, expires_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "Rate limit exceeded."}
  /device-pairings/cli:
    post:
      tags: [DevicePairings]
      operationId: devicePairingStoreCli
      summary: Generate a CLI pairing code (owner)
      description: "Like /device-pairings but returns a copyable text code (60s TTL) for a CLI client. Throttle 20/min."
      responses:
        "200": { description: "Pairing started.", content: { application/json: { schema: { type: object, required: [id, code], properties: { id: { type: integer, format: int64 }, code: { type: string }, expires_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "Rate limit exceeded."}
  /device-pairings/{devicePairing}:
    get:
      tags: [DevicePairings]
      operationId: devicePairingShow
      summary: Poll a pairing's state (owner)
      description: "Owner-scoped (foreign pairing → 404). Returns the current status + the claiming device name."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "State.", content: { application/json: { schema: { type: [object, "null"], properties: { status: { type: string, enum: [pending, pending_approval, approved, rejected, consumed, expired] }, device_name: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /device-pairings/{devicePairing}/approve:
    post:
      tags: [DevicePairings]
      operationId: devicePairingApprove
      summary: Approve the claimed device (owner)
      description: "Owner-scoped. After approval the new device's POST /auth/pair/collect returns its token. Throttle 20/min."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "Approved.", content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Pairing is not awaiting approval (wrong state or expired)." }
        "429": { description: "Rate limit exceeded."}
  /device-pairings/{devicePairing}/reject:
    post:
      tags: [DevicePairings]
      operationId: devicePairingReject
      summary: Reject the claimed device (owner)
      description: "Owner-scoped. Throttle 20/min."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "Rejected.", content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: "Pairing code expired (Gone)." }

  # ── 2FA + app password (self-service) ──
  /user/two-factor/enable:
    post:
      tags: [TwoFactor]
      operationId: twoFactorEnable
      summary: Enable TOTP (generate secret + recovery codes)
      description: "Generates a new TOTP secret + recovery codes (stored encrypted). NOT yet active — call /confirm with a live code. Idempotent. Requires `current_password` (guard-agnostic Hash::check) on EVERY path — web and native alike; native device tokens no longer bypass it (max-security, internet-facing). Throttle 10/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  format: password
                  description: "Required on every path (web + native). 422 {errors:{current_password}} if missing/wrong."
      responses:
        "200": { description: "Secret generated.", content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, enum: [true] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Rate limit exceeded."}
  /user/two-factor/qr:
    get:
      tags: [TwoFactor]
      operationId: twoFactorQr
      summary: Get the TOTP QR + secret + otpauth URI
      description: "ENROLLMENT-ONLY: available only in the window between enable and confirm. Once 2FA is confirmed the secret is never handed out again (a stolen device token must not be able to reproduce the second factor). 404 if 2FA not enabled OR already confirmed. Throttle 60/min."
      responses:
        "200": { description: "QR data.", content: { application/json: { schema: { type: object, required: [svg, secret, uri], properties: { svg: { type: string }, secret: { type: string }, uri: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "2FA not enabled, or already confirmed."}
  /user/two-factor/confirm:
    post:
      tags: [TwoFactor]
      operationId: twoFactorConfirm
      summary: Confirm 2FA with a live TOTP code
      description: "Validates the code and activates 2FA (sets two_factor_confirmed_at). 422 on wrong/expired code. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: "Confirmed.", content: { application/json: { schema: { type: object, properties: { confirmed: { type: boolean, enum: [true] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Invalid/expired code."}
        "429": { description: "Rate limit exceeded."}
  /user/two-factor/recovery-codes:
    post:
      tags: [TwoFactor]
      operationId: twoFactorRecoveryCodes
      summary: List recovery codes
      description: "POST (not GET): the `current_password` step-up travels in the JSON body, never a query string — a password in a URL leaks into access/request logs, history and proxies (and OkHttp forbids a GET body). Only after 2FA is confirmed (else 404). Throttle 60/min."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password, description: "Required on every path (web + native); native device tokens no longer bypass it. 422 if missing/wrong." } } } } }
      responses:
        "200": { description: "Codes.", content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "2FA not active."}
        "422": { $ref: "#/components/responses/ValidationError" }
  /user/two-factor/recovery-codes/regenerate:
    post:
      tags: [TwoFactor]
      operationId: twoFactorRegenerateRecoveryCodes
      summary: Regenerate recovery codes
      description: "Invalidates the old set and returns a fresh one. Requires a fresh `current_password` step-up. Throttle 10/min."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password, description: "Required on every path (web + native); native device tokens no longer bypass it. 422 if missing/wrong." } } } } }
      responses:
        "200": { description: "New codes.", content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Rate limit exceeded."}
  /user/two-factor:
    delete:
      tags: [TwoFactor]
      operationId: twoFactorDisable
      summary: Disable 2FA
      description: "Clears the TOTP secret, recovery codes, and confirmed flag. Idempotent. Requires a fresh `current_password` step-up so a stolen device token cannot disable 2FA. Throttle 10/min."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password, description: "Required on every path (web + native); native device tokens no longer bypass it. 422 if missing/wrong." } } } } }
      responses:
        "200": { description: "Disabled.", content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, enum: [false] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /user/passkeys:
    get:
      tags: [Passkeys]
      operationId: passkeysIndex
      summary: List the current user's passkeys
      responses:
        "200":
          description: Owner-scoped passkeys + whether WebAuthn is configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys: { type: array, items: { $ref: '#/components/schemas/WebauthnCredential' } }
                  enabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Passkeys]
      operationId: passkeysRegister
      summary: Register a new passkey (verify attestation)
      description: >
        Verifies the attestation from navigator.credentials.create() against the
        cached challenge and stores the credential (public-key only). Requires a
        fresh `current_password` step-up. Throttle 20/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, current_password]
              properties:
                credential: { type: object, additionalProperties: true, description: "Serialized PublicKeyCredential (attestation)." }
                name: { type: [string, "null"], maxLength: 120 }
                current_password: { type: string, format: password }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnCredential' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: '#/components/responses/RateLimited' }
  /user/passkeys/options:
    post:
      tags: [Passkeys]
      operationId: passkeysRegisterOptions
      summary: WebAuthn attestation (creation) options for the current user
      description: "Standard PublicKeyCredentialCreationOptionsJSON; feed to navigator.credentials.create(). Challenge cached per user. Throttle 30/min."
      responses:
        "200": { description: "Creation options JSON.", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: '#/components/responses/RateLimited' }
  /user/passkeys/{credential}:
    put:
      tags: [Passkeys]
      operationId: passkeysRename
      summary: Rename a passkey
      parameters:
        - { name: credential, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 120 } } } } }
      responses:
        "200": { description: "OK."}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Passkeys]
      operationId: passkeysDestroy
      summary: Remove a passkey
      parameters:
        - { name: credential, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Removed."}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /user/password:
    put:
      tags: [TwoFactor]
      operationId: userPasswordUpdate
      summary: Change the app login password
      description: >
        Validates `current_password` (guard-agnostic Hash::check — Fortify's
        current_password:web rule would fail for a bearer token) and sets a new
        password (min 12, confirmed).
        Throttle 10/min.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [current_password, password, password_confirmation], properties: { current_password: { type: string }, password: { type: string, minLength: 12 }, password_confirmation: { type: string } } }
      responses:
        "200": { description: "Changed.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Wrong current password or invalid new password."}
        "429": { description: "Rate limit exceeded."}
  /user/email/verify/resend:
    post:
      tags: [TwoFactor]
      operationId: emailVerifyResend
      summary: Re-send the e-mail verification link
      description: "No-op (ok:true) when already verified. Needs SMTP configured. Throttle 60/min."
      responses:
        "200": { description: "Queued (or already verified).", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "Rate limit exceeded."}

  # ── Admin: users ──
  /users:
    get:
      tags: [Users]
      operationId: usersIndex
      summary: List users (admin)
      description: "All users with effective limits, groups, 2FA/verified state, and last login. No credentials. Admin-gated (403 otherwise)."
      responses:
        "200": { description: "Users.", content: { application/json: { schema: { type: object, required: [users], properties: { users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: usersStore
      summary: Create a user (admin)
      description: "role/quotas/modules are privilege fields (set server-side, never mass-assigned). Omit password to send a reset mail (if SMTP on). Throttle 60/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/AdminUser" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Rate limit exceeded."}
  /users/{user}:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Users]
      operationId: usersUpdate
      summary: Update a user (admin)
      description: "Password prohibited (use reset-password). Guards: cannot demote the last admin. Throttle 60/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/AdminUser" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Validation failed, or the last-admin guard tripped." }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Users]
      operationId: usersDestroy
      summary: Delete a user (admin, GDPR crypto-shred)
      description: "Purges the user + all owned data. Cannot delete self or the last admin. Throttle 10/min."
      responses:
        "204": { description: "Deleted (no content)."}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Self-delete or last-admin guard." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /users/{user}/reset-password:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersResetPassword
      summary: Send a password-reset mail (admin)
      description: "422 when SMTP is not configured (use invite-link instead). Throttle 10/min."
      responses:
        "200": { description: "Sent.", content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "SMTP not configured."}
        "429": { $ref: "#/components/responses/RateLimited" }
  /users/{user}/reset-2fa:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersResetTwoFactor
      summary: Clear a user's 2FA (admin recovery)
      description: "Nulls the TOTP secret/codes/confirmed flag. Throttle 10/min."
      responses:
        "200": { description: "Cleared.", content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /users/{user}/avatar:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Users]
      operationId: usersAvatar
      summary: Stream a user's avatar (admin)
      description: "Non-secret. 404 if none stored."
      responses:
        "200": { description: "Image.", content: { image/*: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "No avatar stored (or user not found)."}
  /users/{user}/invite-link:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersInviteLink
      summary: Generate a one-time login/password-set link (admin)
      description: "Single-use, time-limited link; the plaintext token appears only in `url` (never stored/logged — only its SHA-256). Optionally emails it. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ttl_hours], properties: { ttl_hours: { type: integer, enum: [1, 24, 168, 720] }, send: { type: boolean, default: false } } } } } }
      responses:
        "200": { description: "Link.", content: { application/json: { schema: { type: object, required: [url, sent], properties: { url: { type: string, format: uri }, expires_at: { type: string, format: date-time }, sent: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Rate limit exceeded."}

  # ── Admin: security log ──
  /security-log:
    get:
      tags: [SecurityLog]
      operationId: securityLogIndex
      summary: List audit-log entries (admin, read-only)
      description: "Paginated, filterable audit trail. Metadata-only. Admin-gated. Throttle 60/min."
      parameters:
        - { name: action, in: query, schema: { type: string }, description: "Exact action, or a `prefix.*` group match." }
        - { name: user, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string }, description: "ISO-8601 or -24h/-7d." }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200": { description: "Entries.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/SecurityLogEntry" } }, meta: { type: object, properties: { total: { type: integer }, per_page: { type: integer }, current_page: { type: integer }, last_page: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /security-log/export:
    get:
      tags: [SecurityLog]
      operationId: securityLogExport
      summary: Export the audit log (admin, CSV/NDJSON)
      description: "Streamed, capped 10000, same filters as index. CSV cells are formula-injection-neutralised. Throttle 10/min."
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: limit, in: query, schema: { type: integer, default: 10000, maximum: 10000 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: user, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string } }
      responses:
        "200": { description: "Stream.", content: { text/csv: { schema: { type: string, format: binary } }, application/x-ndjson: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ── Per-user Paperless ──
  /paperless/terms:
    get:
      tags: [Paperless]
      operationId: paperlessTerms
      summary: Cached Paperless term quick-picks
      description: "{configured, tags, document_types, correspondents} from the local cache (no live call). Throttle 60/min."
      responses:
        "200": { description: "Terms.", content: { application/json: { schema: { type: object, required: [configured, tags, document_types, correspondents], properties: { configured: { type: boolean }, tags: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } }, document_types: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } }, correspondents: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Paperless]
      operationId: paperlessCreateTerm
      summary: Create a Paperless tag / document type / correspondent
      description: "Creates it in the live Paperless + caches. 422 if not configured or the call fails. Throttle 60/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, name], properties: { kind: { type: string, enum: [tag, document_type, correspondent] }, name: { type: string, maxLength: 255 } } } } } }
      responses:
        "200": { description: "Created/found.", content: { application/json: { schema: { type: object, required: [ok, id, name], properties: { ok: { type: boolean }, id: { type: integer }, name: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Not configured / validation / Paperless error."}
        "429": { $ref: "#/components/responses/RateLimited" }
  /paperless/documents:
    post:
      tags: [Paperless]
      operationId: paperlessSubmit
      summary: Forward a decrypted document to Paperless (transient cleartext)
      description: >
        **Transient-cleartext boundary** (like POST /invoices/ocr):
        the client posts the already-decrypted bytes; the server forwards them to
        the user's own Paperless and stores/logs nothing (`Cache-Control: no-store`).
        Returns the Paperless async task id. Throttle 20/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: "Decrypted PDF/image, max 50 MB." }, title: { type: string, maxLength: 255 }, created: { type: string, format: date }, correspondent: { type: integer }, document_type: { type: integer }, tags: { type: array, items: { type: integer } } } }
      responses:
        "200": { description: "Accepted.", content: { application/json: { schema: { type: object, required: [ok, task], properties: { ok: { type: boolean }, task: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: "File exceeds 50 MB."}
        "422": { description: "Not configured / validation / Paperless error."}
        "429": { $ref: "#/components/responses/RateLimited" }
  /paperless/sync:
    post:
      tags: [Paperless]
      operationId: paperlessSync
      summary: Refresh the cached Paperless terms from the live instance
      description: "Pulls all tags/document types/correspondents into the cache. {ok, counts}. Empty counts when unconfigured (no error). Throttle 20/min."
      responses:
        "200": { description: "Synced.", content: { application/json: { schema: { type: object, required: [ok, counts], properties: { ok: { type: boolean }, counts: { type: object, properties: { tag: { type: integer }, document_type: { type: integer }, correspondent: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Paperless error."}
        "429": { $ref: "#/components/responses/RateLimited" }

  /paperless/config:
    get:
      tags: [Paperless]
      operationId: paperlessConfigShow
      summary: Per-user Paperless connection config
      description: "Instance URL + enabled flag + has_token (the API token is never returned) + cached term counts. Throttle 60/min."
      responses:
        "200": { description: "Config.", content: { application/json: { schema: { $ref: "#/components/schemas/PaperlessConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Paperless]
      operationId: paperlessConfigUpdate
      summary: Update the per-user Paperless config
      description: "Sets URL / enabled / token. A blank/omitted token preserves the stored one; the token is never returned. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paperless_enabled: { type: boolean }
                paperless_url: { type: [string, "null"], format: uri, maxLength: 255 }
                paperless_token: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored token." }
      responses:
        "200": { description: "Updated config.", content: { application/json: { schema: { $ref: "#/components/schemas/PaperlessConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /paperless/config/test:
    post:
      tags: [Paperless]
      operationId: paperlessConfigTest
      summary: Test the Paperless connection
      description: "Pings Paperless using the posted URL+token (falling back to the stored ones). SSRF-guarded. Throttle 20/min."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paperless_url: { type: [string, "null"], format: uri }
                paperless_token: { type: [string, "null"] }
      responses:
        "200": { description: "Result (200 even on failure; check `ok`).", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean }, detail: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ── Admin: settings ──
  /admin/notifications:
    get:
      tags: [Settings]
      operationId: adminNotificationsShow
      summary: Notification config (admin)
      description: "SMTP/NTFY/webhook config. Secret values are NEVER returned — has_smtp_password / has_ntfy_token / has_webhook_secret booleans instead."
      responses:
        "200": { description: "Config.", content: { application/json: { schema: { $ref: "#/components/schemas/NotificationConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminNotificationsUpdate
      summary: Update notification config (admin)
      description: "Only submitted fields are persisted. A blank secret field preserves the stored value. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationConfigWrite" }
      responses:
        "200": { description: "Updated config (secrets masked).", content: { application/json: { schema: { $ref: "#/components/schemas/NotificationConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/notifications/test:
    post:
      tags: [Settings]
      operationId: adminNotificationsTest
      summary: Send a test notification (admin)
      description: "Sends a test message over one channel using the saved settings. A connection/send FAILURE returns 200 {ok:false, detail} (unified test-endpoint convention, matches backup/destinations/test); only request validation is 422. Throttle 20/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [mail, ntfy, webhook] }
      responses:
        "200": { description: "{ ok: boolean, detail?: string } — ok:false means the test send failed.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, detail: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Request validation failed (bad channel)." }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/security:
    get:
      tags: [Settings]
      operationId: adminSecurityShow
      summary: Security policy (admin)
      description: "Workspace paired-device cap, password policy (min length + required classes + breach check) and the force-2FA toggle."
      responses:
        "200": { description: "Policy.", content: { application/json: { schema: { $ref: "#/components/schemas/SecurityPolicy" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminSecurityUpdate
      summary: Update security policy (admin)
      description: "Sets the device cap (1–100) plus the password policy + force-2FA. Audits the diff. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_connected_devices]
              properties:
                max_connected_devices: { type: integer, minimum: 1, maximum: 100 }
                pw_min_length: { type: [integer, "null"], minimum: 8, maximum: 128 }
                pw_require_mixed_case: { type: boolean }
                pw_require_numbers: { type: boolean }
                pw_require_symbols: { type: boolean }
                pw_check_breaches: { type: boolean }
                force_2fa: { type: boolean }
      responses:
        "200": { description: "Updated policy.", content: { application/json: { schema: { $ref: "#/components/schemas/SecurityPolicy" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/limits:
    get:
      tags: [Settings]
      operationId: adminLimitsShow
      summary: Session/auth lifetimes and retention windows (admin)
      description: "Admin-editable workspace limits; each overlays a config('...') key at boot. NULL inherits the env/config default. Returns stored overrides + effective values."
      responses:
        "200": { description: "Limits.", content: { application/json: { schema: { type: object, properties: { settings: { type: object }, effective: { type: object } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminLimitsUpdate
      summary: Update workspace limits (admin)
      description: "Set any of: sanctum_expiration_minutes, session_lifetime_minutes, device_wipe_grace_minutes, device_idle_days, audit/access_log/request_log retention days, backup_stale_hours. null clears an override. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: [integer, "null"] }
      responses:
        "200": { description: "Saved.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/dashboard:
    get:
      tags: [Settings]
      operationId: adminDashboard
      summary: Admin overview dashboard (admin)
      description: "Read-only aggregate for the admin dashboard: app/PHP/Laravel versions, DB+cache health, disk + per-module storage + growth trend, worker queue depth/failed, scheduled-task liveness, error + backup status, and fleet counts (users/sessions/devices/blocked). Container CPU/mem come from /admin/docker/containers."
      responses:
        "200":
          description: "Dashboard snapshot."
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: object, properties: { app: { type: string }, php: { type: string }, laravel: { type: string } } }
                  health: { type: object, properties: { database: { type: string }, cache: { type: string }, queue_driver: { type: string } } }
                  resources: { type: object }
                  queue: { type: object, properties: { pending: { type: integer }, failed: { type: integer } } }
                  scheduler: { type: object }
                  errors: { type: object }
                  backup: { type: object }
                  counts: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/docker/containers:
    get:
      tags: [Settings]
      operationId: adminDockerContainers
      summary: List compose services + state (admin)
      description: "Proxies the bounded docker-control agent sidecar. When the agent is not configured (no token) or unreachable, returns configured/reachable flags + operator commands instead. The app never touches the docker socket."
      responses:
        "200":
          description: "Services (or a not-configured / not-reachable payload)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  reachable: { type: boolean }
                  services: { type: array, items: { type: object, properties: { service: { type: string }, state: { type: string }, status: { type: string }, image: { type: string }, cpu: { type: string, description: "Live CPU%, e.g. 0.50%." }, mem: { type: string, description: "Live memory usage, e.g. 120MiB / 8GiB." }, mem_perc: { type: string } } } }
                  operator: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/docker/action:
    post:
      tags: [Settings]
      operationId: adminDockerAction
      summary: Run an allowlisted action on a compose service (admin)
      description: "Bounded control via the agent sidecar: restart/stop/start/recreate/pull/logs on a validated project service. Not arbitrary docker. 503 when the agent is unconfigured/unreachable. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, action]
              properties:
                service: { type: string, maxLength: 64 }
                action: { type: string, enum: [restart, stop, start, recreate, pull, logs] }
      responses:
        "200": { description: "Result (ok + output).", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, action: { type: string }, service: { type: string }, output: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "Agent unconfigured or unreachable." }

  /admin/system:
    get:
      tags: [Settings]
      operationId: adminSystemShow
      summary: System / maintenance overview (admin, read-only)
      description: "Operational status snapshot (queue/storage/backup/scheduler/disk), scheduled-task liveness, the in-app error log and recent audit trail. Metadata only. Throttle 60/min."
      responses:
        "200": { description: "Overview.", content: { application/json: { schema: { $ref: "#/components/schemas/SystemOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/system/errors/{error}/resolve:
    post:
      tags: [Settings]
      operationId: adminSystemResolveError
      summary: Resolve an error event (admin)
      description: "Marks a recorded error as resolved (it reappears if it recurs). Throttle 60/min."
      parameters: [{ name: error, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Resolved.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ── Admin: backup ──
  /backup/destinations:
    get:
      tags: [Backup]
      operationId: backupDestinationsIndex
      summary: List backup destinations (admin)
      description: "Credentials (`config`) are NEVER returned — only {id, name, driver}."
      responses:
        "200": { description: "Destinations.", content: { application/json: { schema: { type: object, properties: { destinations: { type: array, items: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Backup]
      operationId: backupDestinationsStore
      summary: Create a backup destination (admin)
      description: "Runs a reachability gate before saving. Credentials never echoed back. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { destination: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Validation failed, or the destination is unreachable (the reachability gate surfaces as a 422 on `name`)." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/destinations/{destination}:
    parameters: [{ name: destination, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Backup]
      operationId: backupDestinationsUpdate
      summary: Update a backup destination (admin)
      description: "Blank secret/password fields keep the stored value. Runs the reachability gate. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { destination: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Validation failed, or the destination is unreachable." }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Backup]
      operationId: backupDestinationsDestroy
      summary: Delete a backup destination (admin)
      description: "Throttle 20/min."
      responses:
        "204": { description: "Deleted (no content)."}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/destinations/test:
    post:
      tags: [Backup]
      operationId: backupDestinationsTest
      summary: Test destination reachability (admin)
      description: "Tests a config (from the body, or an existing destination via destination_id) without saving. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "200": { description: "Result — {ok:true} or {ok:false, detail:<error chain>}.", content: { application/json: { schema: { type: [object, "null"], properties: { ok: { type: boolean }, detail: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/jobs:
    get:
      tags: [Backup]
      operationId: backupJobsIndex
      summary: List backup jobs + statistics (admin)
      description: "`passphrase` is NEVER returned."
      responses:
        "200": { description: "Jobs.", content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { $ref: "#/components/schemas/BackupJobSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Backup]
      operationId: backupJobsStore
      summary: Create a backup job (admin)
      description: "422 only when encrypt=true and no passphrase is available (job passphrase blank + no BACKUP_PASSPHRASE env). DB-dump encryption is recommended (cleartext PII) but not forced. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupJobWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { job: { $ref: "#/components/schemas/BackupJobSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Validation failed, or encrypt=true without an available passphrase (job passphrase blank and no BACKUP_PASSPHRASE env)." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/jobs/{job}:
    parameters: [{ name: job, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Backup]
      operationId: backupJobsUpdate
      summary: Update a backup job (admin)
      description: "Blank passphrase keeps the stored value. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupJobWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { job: { $ref: "#/components/schemas/BackupJobSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Backup]
      operationId: backupJobsDestroy
      summary: Delete a backup job (admin)
      description: "Throttle 20/min."
      responses:
        "204": { description: "Deleted (no content)."}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/jobs/{job}/run:
    parameters: [{ name: job, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupJobsRun
      summary: Trigger a backup run now (admin)
      description: "Dispatches the job to the queue. Throttle 10/min."
      responses:
        "200": { description: "Dispatched.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs:
    get:
      tags: [Backup]
      operationId: backupRunsIndex
      summary: List recent backup runs (admin)
      description: "The 20 most recent runs (reaps stale running rows first)."
      responses:
        "200": { description: "Runs.", content: { application/json: { schema: { type: object, properties: { runs: { type: array, items: { $ref: "#/components/schemas/BackupRunSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /backup/runs/{run}/download:
    parameters:
      - { name: run, in: path, required: true, schema: { type: integer } }
      - { name: source, in: query, required: true, schema: { type: string, enum: [database, invoices, avatars] }, description: "Which source's archive in the run's batch to download." }
    get:
      tags: [Backup]
      operationId: backupRunsDownload
      summary: Download one source's archive from a run's batch (admin)
      description: "Streams the raw archive bytes for the given source (may be encrypted)."
      responses:
        "200": { description: "Archive bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Not found — run missing, not successful, no such source archive, or the destination/file is gone." }
  /backup/runs/{run}/verify:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsVerify
      summary: Verify one source's archive integrity (admin)
      description: "Read-only integrity check of one source's archive in the batch. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source], properties: { source: { type: string, enum: [database, invoices, avatars] }, passphrase: { type: [string, "null"], maxLength: 255, description: "Required for encrypted (.enc) archives." } } } } } }
      responses:
        "200": { description: "Result.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, message: { type: string }, verifiedHuman: { type: [string, "null"] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Run missing or no such source archive." }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs/{run}/restore:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsRestore
      summary: Restore a blob source onto live data (admin)
      description: "Restores a blob source (invoices/avatars) in-place from its mirror back onto the live disk (additive overwrite, decrypting per-file when encrypted). DESTRUCTIVE. The database is NOT restorable via API — download the dump and run `php artisan backup:restore-db`. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source], properties: { source: { type: string, enum: [invoices, avatars] } } } } } }
      responses:
        "200": { description: "Restored.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, files: { type: integer, description: "Number of files written." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Run missing or not a successful batch." }
        "422": { description: "Restore failed, or an invalid/non-blob source (validation)." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs/{run}/cancel:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsCancel
      summary: Cancel a running backup (admin)
      description: "First call requests a graceful cancel; a second (while pending) force-finalises. Throttle 20/min."
      responses:
        "200": { description: "Result.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, forced: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs/{run}/decrypt:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsDecrypt
      summary: Stream a decrypted archive (admin/CLI)
      description: "Fetches an encrypted (.enc) archive for the given source, decrypts it with the passphrase, and streams the plaintext archive. Nothing is written to live data. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [passphrase, source], properties: { source: { type: string, enum: [database, invoices, avatars] }, passphrase: { type: string, maxLength: 255 } } } } } }
      responses:
        "200": { description: "Decrypted bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Run missing, not a successful .enc archive, or the file is gone." }
        "422": { description: "Wrong passphrase or corrupt archive, or a missing `passphrase` (validation)." }
        "429": { $ref: "#/components/responses/RateLimited" }


  # --------------------------------------------------------------------------
  # Public account lifecycle (no auth) — mirrors the web Fortify pipeline.
  # --------------------------------------------------------------------------
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: authForgotPassword
      summary: Request a password-reset link (public)
      description: >
        Sends a password-reset email via the Fortify broker. Always responds with a
        generic 200 regardless of whether the email exists — the endpoint cannot be
        used to enumerate accounts. Mirrors the web forgot-password POST.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic acknowledgement (sent iff the email exists).
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: reset-link-sent } } }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: authResetPassword
      summary: Consume a password-reset token (public)
      description: >
        Resets the password using an emailed reset token. Reuses the Fortify
        ResetUserPassword action, so it applies the same password rules and acts as a
        kill switch (revokes every device token + persisted session). Returns 200 on
        success. Every non-success case (unknown email, bad/expired token, weak
        password) collapses to ONE neutral 422 `{status:"reset-failed", message}`
        (v1.562.0) — the response no longer signals account existence, so do NOT
        branch on distinct broker error codes. Mirrors the web reset-password POST.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: password-reset } } }
        "422":
          description: >
            Any failure — unknown email, invalid/expired token, or a password that
            failed the rules. The body is always the same neutral shape (no
            account-existence oracle).
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: reset-failed }, message: { type: string } } }
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: Self-register a new account (public, gated)
      description: >
        Creates a new account via the Fortify CreateNewUser action. Gated by the
        workspace `allow_registration` flag — 403 when self-registration is disabled.
        The privileged `role` is never taken from input (always `user`). Because email
        verification is required, no bearer is minted until the address is verified:
        responds {status: "verify-email"} and sends the verification email. Mirrors
        the web register POST.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                device_name: { type: [string, "null"], maxLength: 64 }
      responses:
        "201":
          description: >
            Created. When email verification is pending, {status:"verify-email"} (no
            token). If verification is ever disabled, returns {token, user} instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: verify-email }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "403":
          description: Self-registration is disabled workspace-wide.
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Public file-share consumption (no auth) — the share token in the path is the
  # credential. Same controller as the web /file-share routes; a password-gated
  # share issues a stateless HMAC grant on unlock, carried on manifest/raw.
  # --------------------------------------------------------------------------
  /invite/{invite}/{token}:
    get:
      tags: [Users]
      operationId: inviteShow
      summary: Check an invite / reset link (public)
      description: >
        Reports whether the (hashed, single-use, expiring) invite token is still
        valid, plus the target email. JSON only — never a redirect.
      security: []
      parameters:
        - { name: invite, in: path, required: true, schema: { type: integer } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Valid link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
                  email: { type: string, format: email }
                  expiresAt: { type: [string, "null"], format: date-time }
        "404": { description: "Invalid, consumed, or expired link (valid:false)." }
        "429": { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Users]
      operationId: inviteConsume
      summary: Consume an invite / reset link — set password, get a bearer (public)
      description: >
        Sets the target user's password (constant-time token check + single-use +
        expiry) and mints a device-scoped bearer token (rather than a session login).
        Consuming the link is a kill switch (v1.562.0): it REVOKES every pre-existing
        device token + web session for the account BEFORE minting the fresh bearer —
        a client holding an older token must re-authenticate.
      security: []
      parameters:
        - { name: invite, in: path, required: true, schema: { type: integer } }
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                device_name: { type: [string, "null"], maxLength: 64 }
      responses:
        "200":
          description: Password set — bearer + user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "404": { description: "Invalid, consumed, or expired link."}
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # CardDAV Apple configuration profile download (device auth + module:contacts).
  # --------------------------------------------------------------------------
  /admin/registration:
    get:
      tags: [Users]
      operationId: adminRegistrationShow
      summary: Read the workspace self-registration toggle (admin)
      responses:
        "200":
          description: Current toggle state.
          content:
            application/json:
              schema: { type: object, properties: { allow_registration: { type: boolean } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Users]
      operationId: adminRegistrationUpdate
      summary: Set the workspace self-registration toggle (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_registration]
              properties:
                allow_registration: { type: boolean }
      responses:
        "200":
          description: Updated toggle state.
          content:
            application/json:
              schema: { type: object, properties: { allow_registration: { type: boolean } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }

  # ── Security portal (admin) ──
  /admin/request-log:
    get:
      tags: [SecurityPortal]
      operationId: adminRequestLog
      summary: List HTTP request-trail rows (admin)
      description: "Paginated, filterable verbose request log. Metadata only. Admin-gated. Throttle 120/min."
      parameters:
        - { name: ip, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: method, in: query, schema: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string }, description: "Substring match." }
        - { name: since, in: query, schema: { type: string }, description: "ISO-8601 or -24h/-7d." }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200": { description: "Rows.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/RequestLogEntry" } }, meta: { type: object, properties: { total: { type: integer }, current_page: { type: integer }, last_page: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/request-log/export:
    get:
      tags: [SecurityPortal]
      operationId: adminRequestLogExport
      summary: Export the request log (admin, CSV/JSON)
      description: "Streamed download, same filters as the index. Throttle 10/min."
      parameters:
        - { name: export, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: method, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string } }
      responses:
        "200": { description: "Stream.", content: { text/csv: { schema: { type: string, format: binary } }, application/json: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/blocked-ips:
    get:
      tags: [SecurityPortal]
      operationId: adminBlockedIpsIndex
      summary: List blocked IPs/CIDRs (admin)
      responses:
        "200": { description: "Block-list.", content: { application/json: { schema: { type: object, properties: { blocks: { type: array, items: { $ref: "#/components/schemas/BlockedIp" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [SecurityPortal]
      operationId: adminBlockIp
      summary: Add an IP/CIDR to the block-list (admin)
      description: "Throttle 60/min. 422 on malformed CIDR or duplicate."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [cidr], properties: { cidr: { type: string, maxLength: 64, example: 203.0.113.0/24 }, reason: { type: [string, "null"] } } } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/blocked-ips/{blockedIp}:
    delete:
      tags: [SecurityPortal]
      operationId: adminUnblockIp
      summary: Remove an IP/CIDR from the block-list (admin)
      description: "Throttle 60/min."
      parameters:
        - { name: blockedIp, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Removed.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/block:
    post:
      tags: [SecurityPortal]
      operationId: adminBlockUser
      summary: Block a user (admin)
      description: "Signs the user out and prevents sign-in. Throttle 60/min."
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Blocked.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, blocked_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "You cannot block yourself." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/unblock:
    post:
      tags: [SecurityPortal]
      operationId: adminUnblockUser
      summary: Unblock a user (admin)
      description: "Throttle 60/min."
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Unblocked.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/sessions:
    get:
      tags: [SecurityPortal]
      operationId: adminSessions
      summary: Cross-user session/device overview (admin)
      description: "Active web sessions + device tokens across all users. Throttle 60/min."
      responses:
        "200": { description: "Overview.", content: { application/json: { schema: { $ref: "#/components/schemas/SessionsOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
