openapi: 3.1.0
info:
  title: Ledgerline API
  version: 1.743.0
  license:
    name: Proprietary
  description: >
    Plaintext-relational personal cloud API for the Ledgerline mobile client.

    **Architecture:** every module is a relational table exposed over per-record
    REST (soft-delete trash + optimistic-concurrency `version`). ALL user content is
    plaintext at rest since v1.516.0 — confidentiality at rest is an infrastructure
    concern (LUKS full-disk encryption + encrypted backups). Only OPERATIONAL SECRETS
    (SMTP / backup / Paperless credentials, backup passphrases) remain encrypted at
    rest via the Laravel `encrypted` cast (APP_KEY) and are never serialised into any
    response. The client sends and receives plaintext over TLS. Binary files (invoice
    PDFs, receipts) are stored as plaintext bytes and streamed by id. (The former
    zero-knowledge / vault / sealed-store model was fully removed in the v1.5xx pivot.)

    **Authentication:** obtain a Sanctum bearer token via the device pairing
    exchange (QR code scan + owner approval in the web UI), then include it as
    `Authorization: Bearer <token>` on every request. All routes except the two
    pairing endpoints require the `device` Sanctum ability. Sanctum's absolute
    token lifetime is shortened to 60 days for the internet-facing deployment
    (v1.562.0); re-pair / re-login to renew (idle + remote-wipe revocation apply
    on top). Login also requires a verified email address before a bearer is
    minted (403 `{status:"verify-email"}`), and a blocked account fails auth
    generically (no enumeration).

    **Rate limiting (enforced, v1.562.0):** since the app is served publicly via
    the NetBird proxy (`https://home.pinlo.me`), the former LAN-only no-op
    throttling was reversed — every throttled route now genuinely returns
    **429** with a `Retry-After` header. Named web limiters: login 5/min,
    two-factor challenge 5/min (TOTP is no longer online-brute-forceable),
    fortify 20/min, auth-pair 30/min, dav 120/min, share-unlock 10/min, invite
    10/min. The `/api/v1` endpoints carry inline per-minute throttles (e.g.
    `/auth/login` 10/min, the `/auth/{reset,forgot,register}` broker routes
    6/min, `/invite/*` 20/min, `/backup/jobs/{job}/run` 10/min,
    `/finance/transactions/bulk` 120/min); handle 429 by backing off for
    `Retry-After` seconds.

    **Web-only surfaces (intentionally no /api/v1 twin):** per-user Paperless
    CONFIGURATION (URL/token/enabled + connection test) and the workspace-admin
    settings — notification channels (mail/ntfy/webhook) edit/update/test, system
    settings + error resolution, the `max_connected_devices` security setting, and
    the self-registration toggle — are managed in the web UI only. (Backup, users,
    groups, security-log and the company profile ARE mirrored on the API.)

    **Forced 2FA (workspace policy):** when an admin enables `force_2fa`, EVERY
    authenticated `/api/v1` request from an account without a confirmed second
    factor returns **403** `{status:"two_factor_required"}` (see the
    `TwoFactorRequired` response), except the enrollment/escape endpoints
    (`/me`, `/auth/logout`, `/preferences`, `/locale`, `/theme`,
    `/user/two-factor*`). Clients should route the user to 2FA enrollment on
    that status. This is a workspace-wide gate applied by middleware, not a
    per-operation flag.

    **Response security headers (v1.562.0):** responses carry a tightened header
    set for the internet-facing deployment — `Content-Security-Policy` with
    `frame-ancestors 'self'` + `X-Frame-Options: SAMEORIGIN` (framing default
    reversed from `*`), a broadened `Permissions-Policy` denylist, and stripped
    `Server`/`X-Powered-By`. These are transport headers, not JSON — clients need
    no changes.

servers:
  - url: /api/v1
    description: Current stable API base path

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Device pairing exchange and session management
  - name: Passkeys
    description: >
      WebAuthn passkeys / hardware security keys (YubiKey, Nitrokey, platform
      authenticators) via web-auth/webauthn-lib. Public login pair mints a
      device bearer token; management endpoints require the authenticated user
      plus a current-password step-up to register. Public-key only at rest
      (none-attestation).
  - name: Me/Device
    description: Authenticated user info, avatar, and device heartbeat
  - name: Finance
  - name: Devices
    description: Connected device listing, revocation, and remote-wipe management
  - name: Notifications
    description: In-app notification bell — list recent items, mark read
  - name: Account
    description: GDPR data export, account deletion, and session revocation
  - name: Preferences
    description: User preferences — locale and colour-scheme
  - name: Groups
    description: >
      Admin group management (requires the admin role on top of the device token).
      A group is a reusable limit template (device cap + module allow-list) plus a
      shareable flag; membership is many-to-many. Limits and membership are non-secret
      metadata.
  - name: Company
    description: >
      Per-user company profile and invoice defaults (the Finance module's business
      identity + numbering/appearance settings). This is the user's OWN business
      identity that prints on every invoice — non-secret, served in the clear like the
      avatar (it is the business's own identity, never customer data).
      The invoice records, payment methods and imported bank transactions themselves
      live in the relational finance tables (see the Finance tag).
  - name: Status
    description: Application availability / health check (the site-root /up up-check).
  - name: TwoFactor
    description: >
      Self-service TOTP two-factor + app-password management for a paired device
      (Sanctum bearer). Mirrors the web Fortify flow, which is browser-only.
  - name: DevicePairings
    description: >
      Owner-side device pairing: an already-paired device generates a code, polls
      it, and approves/rejects the new device's claim. Owner-scoped.
  - name: Users
    description: >
      Admin user management (requires the admin role on top of the device token —
      `can:manage-global-settings`). No credentials (password hashes, 2FA secrets)
      are ever returned. Non-admins get 403.
  - name: Backup
    description: >
      Admin backup management (admin role + device token). Credential hygiene is
      enforced: destination `config` (cloud credentials) and job `passphrase` are
      NEVER present in any response. A database job with encrypt=false is refused
      (422) — a DB dump contains all data (plaintext) plus the encrypted operational
      secrets, and must never leave the box unencrypted.
  - name: SecurityLog
    description: >
      Admin, read-only, metadata-only audit trail (admin role + device token). Rows
      never contain tokens/keys/ciphertext.
  - name: SecurityPortal
    description: >
      Admin security portal (admin role + device token): verbose HTTP request log
      with CSV/JSON export, IP block-list CRUD, per-user block toggle, and a
      cross-user session/device overview.
  - name: Paperless
    description: >
      Per-user Paperless-ngx integration: cached term quick-picks, live term
      creation, cache sync, and document forwarding. `POST /paperless/documents` is
      a transient-cleartext boundary (like POST /invoices/ocr): the client posts the
      raw document bytes, the server forwards them to the user's own Paperless
      instance and stores/logs nothing. Per-user Paperless CONFIGURATION (URL / token
      / enabled flag) is managed via GET/PUT /paperless/config + POST
      /paperless/config/test; the API token is never returned (has_token bool).
  - name: Settings
    description: >
      Admin workspace settings (requires the admin role on top of the device token —
      `can:manage-global-settings`): outgoing notifications (SMTP/NTFY/webhook) with a
      test send, the paired-device cap, the Files upload/orphan-grace limits, and the
      read-only System/maintenance overview. Operative secrets (SMTP password, ntfy
      token, webhook secret) are NEVER returned — a GET reports has_* booleans and a
      blank submission preserves the stored secret. Non-admins get 403.
  - name: Servers
    description: >
      Agentless server monitoring over plain SSH. A server row holds the
      connection (host/port/user) plus the credential, which is encrypted at rest
      and never serialised. The target's host key is pinned: `POST /servers/test`
      reports the fingerprint it saw, the user confirms it, and `POST /servers`
      requires that value — trust-on-first-use is an explicit step, not something
      the server does silently. Collection runs in the queue (`POST
      /servers/{id}/refresh` returns 202 and the snapshot appears in a later
      index/show); the only endpoint that opens an SSH session inline is the
      connection test, which uses tight interactive timeouts. The transport is
      the OpenSSH client, not a PHP SSH library: a hardened sshd may offer only
      post-quantum key exchange (mlkem768x25519-sha256,
      sntrup761x25519-sha512@openssh.com), which no pure-PHP implementation
      speaks. Consequently authentication is key-only — OpenSSH takes no password
      without a terminal — and `POST /servers/keypair` generates one for the user.
      Gated by `module:servers` on top of device auth and owner-scoped.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >
        First-party Sanctum token with ability `device`. Obtained via the
        pairing exchange. Include as `Authorization: Bearer <token>`.

  responses:
    Unauthorized:
      description: Unauthenticated — missing, invalid, or expired bearer token.
    Forbidden:
      description: >
        Forbidden — the Sanctum token lacks the required `device` ability, the
        Finance module is disabled for this account (module:finance gate), or (on
        admin routes) the caller is not an admin (manage-global-settings).
    TwoFactorRequired:
      description: >
        Two-factor enrollment required. When the workspace has `force_2fa`
        enabled (admin security policy), EVERY authenticated `/api/v1` request
        from an account without a confirmed second factor returns this, EXCEPT
        the enrollment/escape endpoints (`/me`, `/auth/logout`, `/preferences`,
        `/locale`, `/theme`, `/user/two-factor*`). Enroll a second factor to
        clear it. Body `status` is `two_factor_required` (distinct from the
        generic Forbidden). Enforced by the EnsureTwoFactorEnrolled middleware.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [two_factor_required] }
              message: { type: string }
    NotFound:
      description: Not found, or not owned by the caller (owner-scoped; existence is not leaked).
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    FinanceV2QuoteUnprocessable:
      description: Quote input validation or a stable quote-domain rejection.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinanceV2QuoteUnprocessable" }
    VersionConflict:
      description: >
        Optimistic-concurrency conflict — the stored `version` no longer matches the
        `version` sent. Re-fetch the row, merge, and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VersionConflict" }
    RateLimited:
      description: >
        Too many requests — the route's per-minute rate limit was exceeded.
        Rate limiting is genuinely enforced again on the internet-facing
        deployment (v1.562.0); it was inert under the former LAN-only build.
        Back off and retry after the `Retry-After` interval.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (standard throttle header).
          schema: { type: integer }

  schemas:
    WebauthnCredential:
      type: object
      description: A registered passkey / hardware key (public-key only, owner-scoped).
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
    ValidationError:
      type: object
      description: >
        Laravel validation-failure body (HTTP 422). `errors` maps each failed field
        to its messages.
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    VersionConflict:
      type: object
      description: >
        Optimistic-concurrency conflict body. `version` is the current stored
        version the client should rebase onto.
      required: [error, version]
      properties:
        error: { type: string, enum: [version_conflict] }
        version: { type: integer }
    FinanceError:
      type: object
      description: "Business-rule rejection body: a machine-readable `error` code (HTTP 422)."
      required: [error]
      properties:
        error: { type: string }
    TransactionReceipt:
      type: object
      description: >
        A receipt entry embedded in a bank transaction's `receipts[]`. File receipts
        are created only via POST /finance/transactions/{transaction}/receipts;
        `blob_path` is the SERVER-owned on-disk path (never accepted from the client).
        Fileless entries (invoice links / Eigenbeleg metadata) may be added via the
        transaction PUT.
      required: [id, name, kind, tags, locked, trashed]
      properties:
        id: { type: string, description: "UUID assigned server-side." }
        blob_path: { type: [string, "null"], description: "Server-owned storage path under invoices/ (read-only; response only)." }
        name: { type: string }
        mime: { type: [string, "null"] }
        kind: { type: string, example: receipt, description: "e.g. receipt | invoice | eigenbeleg." }
        category: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        contactId: { type: [string, "null"] }
        partnerId: { type: [integer, "null"] }
        sig: { type: [string, "null"], description: "Content signature ({size}:{sha256 of head+tail}), the same one finance_receipts.sig carries. Lets the receipt inbox recognise a document that is already filed at a booking instead of uploading a second copy." }
        vat: { type: [string, "null"] }
        locked: { type: boolean, description: "A locked receipt (e.g. an auto-linked invoice) cannot be deleted." }
        trashed: { type: boolean }
        removed_from_server: { type: boolean, description: "The origin copy has been deleted; the archived copy is the only one left." }

    PaperlessConfig:
      type: object
      description: >
        Per-user Paperless connection config. The API token is never returned;
        `has_token` reports whether one is stored.
      required: [paperless_enabled, paperless_url, has_token, counts]
      properties:
        paperless_enabled: { type: boolean }
        paperless_url: { type: [string, "null"], format: uri }
        has_token: { type: boolean }
        counts:
          type: object
          required: [tag, document_type, correspondent]
          properties:
            tag: { type: integer }
            document_type: { type: integer }
            correspondent: { type: integer }

    NotificationConfig:
      type: object
      description: >
        Workspace notification config with secrets masked. Secret values
        (smtp_password / ntfy_token / webhook_secret) are represented only by
        has_* booleans and are never returned.
      required:
        [mail_enabled, has_smtp_password, ntfy_enabled, has_ntfy_token, webhook_enabled, has_webhook_secret]
      properties:
        mail_enabled: { type: boolean }
        smtp_host: { type: [string, "null"] }
        smtp_port: { type: [integer, "null"] }
        smtp_encryption: { type: [string, "null"], enum: [tls, ssl, null] }
        smtp_username: { type: [string, "null"] }
        smtp_from_address: { type: [string, "null"], format: email }
        smtp_from_name: { type: [string, "null"] }
        has_smtp_password: { type: boolean }
        ntfy_enabled: { type: boolean }
        ntfy_url: { type: [string, "null"], format: uri }
        ntfy_topic: { type: [string, "null"] }
        has_ntfy_token: { type: boolean }
        webhook_enabled: { type: boolean }
        webhook_url: { type: [string, "null"], format: uri }
        has_webhook_secret: { type: boolean }
    NotificationConfigWrite:
      type: object
      description: >
        Notification config update. Only submitted fields are persisted. Secret
        fields (smtp_password/ntfy_token/webhook_secret) preserve the stored value
        when omitted or blank.
      properties:
        mail_enabled: { type: boolean }
        smtp_host: { type: [string, "null"], maxLength: 255, description: "SSRF-guarded (v1.562.0): a host resolving to a link-local / cloud-metadata / internal range is rejected with 422 (parity with ntfy_url/webhook_url)." }
        smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        smtp_encryption: { type: [string, "null"], enum: [tls, ssl, null] }
        smtp_username: { type: [string, "null"], maxLength: 255 }
        smtp_password: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }
        smtp_from_address: { type: [string, "null"], format: email, maxLength: 255 }
        smtp_from_name: { type: [string, "null"], maxLength: 255 }
        ntfy_enabled: { type: boolean }
        ntfy_url: { type: [string, "null"], format: uri, maxLength: 255 }
        ntfy_topic: { type: [string, "null"], maxLength: 255 }
        ntfy_token: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }
        webhook_enabled: { type: boolean }
        webhook_url: { type: [string, "null"], format: uri, maxLength: 255 }
        webhook_secret: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }

    SecurityPolicy:
      type: object
      description: "Workspace security policy: device cap, password policy and force-2FA."
      properties:
        max_connected_devices: { type: integer }
        pw_min_length: { type: [integer, "null"] }
        pw_require_mixed_case: { type: boolean }
        pw_require_numbers: { type: boolean }
        pw_require_symbols: { type: boolean }
        pw_check_breaches: { type: boolean }
        force_2fa: { type: boolean }

    SystemOverview:
      type: object
      description: "Read-only operational overview (metadata only — no secrets)."
      required: [tasks, status, trend, errors, audit]
      properties:
        tasks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              expression: { type: string }
              lastAt: { type: [string, "null"] }
              lastOk: { type: [boolean, "null"] }
        status:
          type: object
          description: "SystemStatus snapshot (version/queue/storage/errors/backup/scheduler/disk)."
          additionalProperties: true
        trend:
          type: object
          description: "Storage trend over ~30 days ({points, deltaBytes, deltaDays})."
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              level: { type: [string, "null"] }
              exception: { type: [string, "null"] }
              message: { type: [string, "null"] }
              file: { type: [string, "null"] }
              line: { type: [integer, "null"] }
              count: { type: integer }
              first_seen_at: { type: [string, "null"] }
              last_seen_at: { type: [string, "null"] }
              resolved_at: { type: [string, "null"] }
        audit:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              action: { type: string }
              actor: { type: [string, "null"] }
              ip: { type: [string, "null"] }
              meta: { type: [object, "null"], additionalProperties: true }
              created_at: { type: [string, "null"] }

    CompanyProfile:
      type: object
      description: >
        Per-user company profile + invoice defaults (the business identity that prints
        on invoices). Non-secret. All fields are optional; on PUT, only the fields sent
        are updated. `has_logo` is read-only (response only).
      properties:
        company_name: { type: [string, "null"], maxLength: 200 }
        company_address: { type: [string, "null"], maxLength: 1000 }
        company_email: { type: [string, "null"], format: email, maxLength: 200 }
        company_phone: { type: [string, "null"], maxLength: 100 }
        company_tax_id: { type: [string, "null"], maxLength: 100 }
        company_vat_id: { type: [string, "null"], maxLength: 100 }
        company_iban: { type: [string, "null"], maxLength: 60 }
        company_bic: { type: [string, "null"], maxLength: 20 }
        company_bank_name: { type: [string, "null"], maxLength: 200 }
        invoice_number_format: { type: [string, "null"], maxLength: 40, description: "e.g. YYYY-NNNN. Locked client-side once the current year has invoices (GoBD)." }
        invoice_next_number: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "Numbering floor; the actual next number is derived per year from the invoices." }
        invoice_default_vat_rate: { type: [number, "null"], minimum: 0, maximum: 100 }
        small_business: { type: boolean, description: "§19 Kleinunternehmer — when true, invoices show no VAT and the VAT return reports zero output VAT." }
        invoice_payment_terms_days: { type: [integer, "null"], minimum: 0, maximum: 365 }
        invoice_footer_text: { type: [string, "null"], maxLength: 2000 }
        invoice_accent_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_heading_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_template: { type: [string, "null"], enum: [editorial, modern, elegant, klassisch, schlicht] }
        invoice_payment_methods: { type: [string, "null"], maxLength: 500 }
        invoice_payment_terms_text: { type: [string, "null"], maxLength: 1000 }
        company_website: { type: [string, "null"], maxLength: 255 }
        company_contacts: { type: array, maxItems: 20, items: { type: object, properties: { name: { type: [string, "null"] }, role: { type: [string, "null"] }, email: { type: [string, "null"] }, phone: { type: [string, "null"] } } } }
        invoice_font: { type: [string, "null"], maxLength: 80 }
        invoice_vat_ist: { type: boolean, description: "Ist-Versteuerung (cash-basis VAT) toggle." }
        has_logo: { type: boolean, readOnly: true, description: "Whether a company logo is stored (GET /company/logo)." }

    Group:
      type: object
      description: >
        A user group: a reusable limit template plus a shareable flag. Limits are
        nullable (null = the group sets no cap for that dimension). Non-secret
        metadata.
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        max_connected_devices: { type: [integer, "null"], description: "Device cap (null = no group cap)." }
        shareable: { type: boolean, description: "Members may offer this group as a share target." }
        modules:
          type: [array, "null"]
          description: >
            Allow-list of enabled module keys for members of this group (null = all
            modules). A member's effective modules are the union across their groups
            (a group with null grants all); a per-user allow-list overrides. Enforced
            server-side and surfaced at /me as user.modules.
          items: { type: string, enum: [finance, servers] }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              email: { type: string }

    DisplayPreferences:
      type: object
      description: >
        Global, non-secret DISPLAY preferences — 12/24h clock, date format and a
        timezone override. Presentation only. Returned in GET /me and set via
        POST /preferences; the client applies them to its own rendering.
      properties:
        time_format: { type: string, enum: [24h, 12h] }
        timezone: { type: [string, "null"], description: "Hard IANA timezone override (e.g. Europe/Berlin); null follows the browser/system zone." }
        date_format: { type: string, enum: [system, dmy, dmy_dot, mdy, ymd], description: "Date-format preset; 'system' uses the locale's regional format." }
        notifications:
          type: object
          description: "Per-category push prefs, keyed by notification category (e.g. server/finance_bank_csv/reminder). Absent category = push enabled."
          additionalProperties:
            type: object
            properties:
              push: { type: boolean, description: "false suppresses push for this category (the centre row is still created)." }

    MeUser:
      type: object
      description: >
        The authenticated user's profile. Returned as the `user` object by GET /me
        and by POST /auth/pair/collect (when `status: approved`). All fields are
        non-secret metadata — no credentials (password hash, 2FA secret) are included.
      required: [id, name, email, locale, groups, modules, has_avatar, two_factor, preferences, theme]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        locale:
          type: string
          description: "The user's UI locale (one of the configured languages, e.g. en, de, ru)."
        groups:
          type: array
          description: >
            Derived from the first-party role: `["admin"]` for admins, `[]` otherwise.
            The historical claim shape is kept so existing mobile clients need no
            change — there is no separate `role` field.
          items: { type: string }
        modules:
          type: array
          description: >
            The application module keys this account may use (per-user / per-group
            toggles). A native client should hide the tabs for modules NOT listed
            here; the API also enforces it — a disabled module's store endpoints
            return 403.
          items: { type: string, enum: [finance, servers] }
        has_avatar:
          type: boolean
          description: "Whether a non-secret avatar is stored. True → fetch it via GET /api/v1/avatar (Bearer)."
        two_factor:
          type: boolean
          description: "Whether TOTP two-factor authentication is confirmed for the account."
        preferences:
          allOf:
            - $ref: "#/components/schemas/DisplayPreferences"
          description: "Non-secret display preferences (units + 12/24h clock); set via POST /api/v1/preferences."
        theme:
          type: string
          enum: [light, dark, system]
          description: "Current UI theme (set via POST /api/v1/theme)."

    OkResponse:
      type: object
      description: Acknowledgement response.
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    Invoice:
      type: object
      description: >
        Invoice (relational table invoices). All columns are plaintext at rest since
        v1.516.0 (confidentiality is an infra concern: LUKS + encrypted backups).
        customer/lines/versions are JSON columns; money + number/date drive stats +
        GoBD numbering. number/seq/year/type=credit_note/cancels_invoice_id/pdf_path/
        version/version_seq are server-managed and never mass-assigned via CRUD.
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        number: { type: [string, "null"] }
        seq: { type: [integer, "null"] }
        year: { type: [integer, "null"] }
        status: { type: string, enum: [draft, final, sent, paid] }
        type: { type: string, enum: [invoice, credit_note], description: "Document kind. A credit note (Storno/Gutschrift) reverses a finalized invoice and carries its own GoBD number." }
        cancels_invoice_id: { type: [integer, "null"], description: "For a credit note, the id of the invoice it cancels (server-set, never mass-assigned)." }
        issue_date: { type: [string, "null"] }
        due_date: { type: [string, "null"] }
        currency: { type: string }
        vat_rate: { type: [string, "null"] }
        gross: { type: [string, "null"] }
        net: { type: [string, "null"] }
        vat: { type: [string, "null"] }
        discount_type: { type: [string, "null"], enum: [percent, amount, null], description: "Global invoice-level discount kind (Rabatt) on the net taxable base." }
        discount_value: { type: [string, "null"], description: "Discount value: a percentage when discount_type=percent, else an absolute amount." }
        skonto_percent: { type: [string, "null"], description: "Early-payment Skonto percentage printed on the invoice." }
        skonto_days: { type: [integer, "null"], description: "Early-payment Skonto window in days from the issue date." }
        imported: { type: boolean }
        paid_at: { type: [string, "null"], format: date-time }
        sent_at: { type: [string, "null"], format: date-time, description: "When the invoice PDF was emailed to the customer." }
        reminded_at: { type: [string, "null"], format: date-time, description: "When a payment reminder (dunning) was last sent." }
        reminder_count: { type: integer, description: "Dunning level (Mahnstufe) — how many customer reminders have gone out." }
        payment_account: { type: [string, "null"] }
        partner_id: { type: [integer, "null"] }
        pdf_path: { type: [string, "null"] }
        customer: { type: [object, "null"], additionalProperties: true, description: "Denormalised customer snapshot (nullable). May carry `invoiceEmail` (dedicated Rechnungs-E-Mail, preferred over `email` when emailing/dunning) alongside name/attn/address/email/vatId/partnerId." }
        lines: { type: [array, "null"], items: { type: object, additionalProperties: true } }
        note: { type: [string, "null"] }
        versions:
          type: [array, "null"]
          description: "GoBD correction trail. Pass a version's `seq` as `version_seq` to the PDF ops to read/attach that version's own PDF."
          items:
            type: object
            properties:
              seq: { type: integer, description: "Version sequence — pass as version_seq to the PDF ops." }
              label: { type: [string, "null"] }
              pdf: { type: [string, "null"], description: "Stored blob path of this version's own PDF (read-only)." }
            additionalProperties: true
        version_seq: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinancePartner:
      type: object
      description: "Geschäftspartner (relational finance_partners). All columns plaintext at rest since v1.516.0."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        name: { type: string }
        category: { type: [string, "null"] }
        url: { type: [string, "null"] }
        logo: { type: [string, "null"] }
        note: { type: [string, "null"] }
        address: { type: [string, "null"] }
        email: { type: [string, "null"] }
        invoice_email: { type: [string, "null"], description: "Dedicated invoice email (Rechnungs-E-Mail); invoices are sent here when set, else the general email." }
        phone: { type: [string, "null"] }
        vat_id: { type: [string, "null"] }
        hourly_rate: { type: [string, "null"], description: "Default hourly rate as a decimal string (decimal:2 cast); prefills invoice line items for this partner." }
        customer_number: { type: [string, "null"], description: "Assigned by the server on create from the `customer_number_format` template, unless the caller supplies one (migrating from another system). Only for a party we sell to — a supplier has no use for ours. Binned partners keep their number out of circulation." }
        kind: { type: [string, "null"], enum: [customer, supplier, both, lead, null], description: "What the partner is to us. The column existed unused since the pivot and carries this meaning from v1.782.0." }
        payment_terms_days: { type: [integer, "null"], description: "Prefills a new document's due date." }
        discount_percent: { type: [string, "null"], description: "Standing discount; prefills a new document." }
        delivery_address: { type: [string, "null"], description: "Where goods go, when that is not where the invoice goes." }
        archived_at: { type: [string, "null"], format: date-time, description: "Hidden from the pickers but not gone; its documents still point at it." }
        currency: { type: [string, "null"], description: "ISO 4217 code used when invoicing this partner." }
        contacts: { type: array, items: { type: object, additionalProperties: true } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    PaymentMethod:
      type: object
      description: "Payment method (relational payment_methods; all columns plaintext since v1.516.0)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        name: { type: string }
        scope: { type: string, enum: [business, private], description: "Business or private. An account always states its scope; its bookings inherit it. Existing accounts read as business." }
        holder: { type: [string, "null"] }
        note: { type: [string, "null"] }
        business: { type: boolean }
        url: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        bank: { type: [string, "null"] }
        account_no: { type: [string, "null"] }
        card_number: { type: [string, "null"] }
        card_network: { type: [string, "null"] }
        card_expiry: { type: [string, "null"] }
        paypal_email: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinanceProject:
      type: object
      description: "Cost project (relational finance_projects, nestable via parent_id) and the unit of planning: tasks and logged hours hang off it."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        parent_id: { type: [integer, "null"] }
        name: { type: string }
        kind: { type: string, enum: [business, private] }
        note: { type: [string, "null"] }
        expenses: { type: [array, "null"], items: { $ref: "#/components/schemas/ProjectExpense" }, description: "Hand-typed ledger rows (nullable). Stored verbatim as JSON — the server validates only that it is an array of at most 5000 items." }
        status: { type: string, enum: [planned, active, on_hold, done, cancelled], description: "on_hold and cancelled are the two states that are neither progress nor completion." }
        starts_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        budget_net: { type: [string, "null"], description: "What it may cost, net. Compared against the ledger; nothing is enforced — a project over budget is information, not an error." }
        partner_id: { type: [integer, "null"], description: "Whose project it is. Also supplies the hourly rate frozen onto new time entries." }
        quote_id: { type: [integer, "null"], description: "The quote it came from, when it came from one. Server-owned." }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    ProjectExpense:
      type: object
      description: |
        One hand-typed row of a project's ledger, stored inside
        `finance_projects.expenses`. The column is free-form JSON: the server
        persists it as sent and only reads `date`, `amount`, `direction` and
        `category` for the EÜR, so a client MUST round-trip unknown keys rather
        than dropping them.

        `direction: 'in'` is a Zubuchung (a refund/credit booked on the project)
        and REDUCES the expense total in `GET /finance/reports/euer`;
        `direction: 'out'` (and a legacy row that carries no `direction` at all)
        is a Abbuchung and adds to it. `amount` is unsigned — the sign lives in
        `direction`.
      properties:
        id: { type: string, description: "Client-generated row id (stable across edits; used to update/delete a single row)." }
        direction: { type: string, enum: [out, in], default: out, description: "out = spend (Abbuchung), in = credit (Zubuchung)." }
        amount: { type: number, description: "Unsigned amount, gross." }
        date: { type: [string, "null"], format: date, description: "Booking date (YYYY-MM-DD); the EÜR buckets by its year." }
        title: { type: [string, "null"], description: "Short label shown in the ledger (Bezeichnung), e.g. \"Excavator rental\"." }
        note: { type: [string, "null"], description: "Longer free-text description (Beschreibung)." }
        category: { type: [string, "null"], description: "Free-text expense category — matched by name against the managed finance categories (for the Sachkonto) and used as the EÜR grouping label." }
        payment_method_id: { type: [integer, "null"], description: "Which account the money moved through (informational; not validated server-side)." }

    FinancePartnerNote:
      type: object
      description: "One entry in a partner's contact log. `occurred_at` is when it happened; `created_at` is when it was typed, which can be days later."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        finance_partner_id: { type: integer }
        kind: { type: string, enum: [call, meeting, mail, note] }
        body: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    FinanceProduct:
      type: object
      description: "A sellable article. `stock_qty` is a denormalised read of the movement ledger, written only alongside a movement; treat it as reporting, not as an input."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        kind: { type: string, enum: [service, hardware] }
        sku: { type: [string, "null"], description: "Article number. Unique among an owner's live articles; a binned one frees it." }
        name: { type: string }
        description: { type: [string, "null"] }
        unit: { type: [string, "null"], description: "Free text — hour, piece, day, flat rate. Every trade names its units differently." }
        price_net: { type: string, description: "Decimal as string (decimal:2 cast)." }
        purchase_price: { type: [string, "null"], description: "What it cost us. Used to show a margin; never printed on a document that leaves the house." }
        vat_rate: { type: [string, "null"], description: "null = fall back to the company default rate." }
        supplier_id: { type: [integer, "null"] }
        category: { type: [string, "null"] }
        active: { type: boolean }
        track_stock: { type: boolean }
        stock_qty: { type: string, description: "Decimal as string (decimal:3). Fractional on purpose: 2.5 hours, 0.5 metres." }
        stock_min: { type: [string, "null"], description: "Reorder level. null = never warn." }
        note: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
    FinanceProductInput:
      type: object
      description: "Create/update body. Stock fields are absent on purpose — see the stock endpoint."
      properties:
        kind: { type: string, enum: [service, hardware] }
        sku: { type: [string, "null"], maxLength: 64 }
        name: { type: string, maxLength: 300 }
        description: { type: [string, "null"], maxLength: 5000 }
        unit: { type: [string, "null"], maxLength: 32 }
        price_net: { type: [number, "null"] }
        purchase_price: { type: [number, "null"] }
        vat_rate: { type: [number, "null"], minimum: 0, maximum: 100 }
        supplier_id: { type: [integer, "null"], description: "Must be one of the caller's own partners." }
        category: { type: [string, "null"], maxLength: 160 }
        active: { type: [boolean, "null"] }
        track_stock: { type: [boolean, "null"] }
        note: { type: [string, "null"], maxLength: 5000 }
        version: { type: [integer, "null"], description: "Send it to get a 409 instead of a blind overwrite." }
    FinanceStockMovement:
      type: object
      description: "One movement of goods. Append-only: no update, no delete, no soft delete — a stock figure is only trustworthy if the steps behind it cannot be rewritten."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        finance_product_id: { type: integer }
        qty: { type: string, description: "Signed decimal as string. In positive, out negative." }
        reason: { type: string, enum: [purchase, sale, correction, return, initial] }
        ref_type: { type: [string, "null"], enum: [invoice, quote, manual, null], description: "What caused it. A loose reference, not a foreign key, so deleting a document cannot erase the fact that goods moved." }
        ref_id: { type: [string, "null"] }
        note: { type: [string, "null"] }
        occurred_at: { type: string, format: date-time }
        created_at: { type: [string, "null"], format: date-time }
    FinanceDocumentLine:
      type: object
      description: "One line of a quote or invoice. The SAME shape on both, which is what makes converting a quote a copy rather than a translation, and lets the cent-exact totals mathematics stay one implementation."
      properties:
        desc: { type: string }
        qty: { type: number }
        unit: { type: [string, "null"] }
        unitPrice: { type: number }
        vatRate: { type: [number, "null"] }
        kind: { type: [string, "null"], enum: [service, hardware, null] }
        productId: { type: [integer, "null"], description: "The catalogue article this line came from. What lets a finalised invoice move stock." }
    FinanceProjectTask:
      type: object
      description: "A piece of work under a project. A milestone is the same row with `is_milestone` set — a date that matters with no work in it."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        finance_project_id: { type: integer }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [open, in_progress, done] }
        starts_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        estimate_hours: { type: [string, "null"], description: "Hours quoted for this piece of work, decimal as string." }
        is_milestone: { type: boolean }
        sort: { type: integer, description: "Hand-ordered: task order is a judgement, not a date." }
        finance_product_id: { type: [integer, "null"], description: "The catalogue article the quote line came from, when it came from one." }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
    FinanceProjectTaskInput:
      type: object
      properties:
        title: { type: string, maxLength: 300 }
        description: { type: [string, "null"], maxLength: 20000 }
        status: { type: [string, "null"], enum: [open, in_progress, done, null] }
        starts_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        estimate_hours: { type: [number, "null"] }
        is_milestone: { type: [boolean, "null"] }
        sort: { type: [integer, "null"] }
        version: { type: [integer, "null"] }
    FinanceTimeEntry:
      type: object
      description: "Hours worked. `hourly_rate` is frozen here rather than read from the partner at invoicing time, so a later rate change cannot rewrite what past work was worth. `invoiced_invoice_id` is set once and never cleared — that is the protection against billing the same hour twice."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        finance_project_id: { type: integer }
        finance_project_task_id: { type: [integer, "null"], description: "Optional: not everything worth logging was planned." }
        date: { type: string, format: date }
        hours: { type: string }
        description: { type: [string, "null"] }
        billable: { type: boolean }
        hourly_rate: { type: [string, "null"] }
        invoiced_invoice_id: { type: [integer, "null"] }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
    FinanceTimeEntryInput:
      type: object
      properties:
        finance_project_task_id: { type: [integer, "null"], description: "Must belong to the same project." }
        date: { type: [string, "null"], format: date, description: "Defaults to today." }
        hours: { type: number, minimum: -24, maximum: 24, description: "Zero is refused: it states nothing." }
        description: { type: [string, "null"], maxLength: 20000 }
        billable: { type: [boolean, "null"], default: true }
        hourly_rate: { type: [number, "null"], description: "Defaults to the customer's rate at the time of logging." }
        version: { type: [integer, "null"] }
    FinanceQuote:
      type: object
      description: "A quote (Angebot). Editable only while `status` is draft. `expired` is derived from `valid_until`, never stored — a date does not need a nightly job to become true."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        number: { type: [string, "null"], description: "Assigned by the server on send. Never settable by a client." }
        seq: { type: [integer, "null"] }
        year: { type: [integer, "null"] }
        status: { type: string, enum: [draft, sent, accepted, declined] }
        partner_id: { type: [integer, "null"] }
        customer: { type: [object, "null"], additionalProperties: true, description: "Snapshot of the addressee, kept alongside partner_id so editing the partner cannot rewrite a quote already sent." }
        title: { type: [string, "null"] }
        issue_date: { type: [string, "null"], format: date }
        valid_until: { type: [string, "null"], format: date }
        currency: { type: string }
        lines: { type: [array, "null"], items: { $ref: "#/components/schemas/FinanceDocumentLine" } }
        discount_type: { type: [string, "null"], enum: [percent, amount, null] }
        discount_value: { type: [string, "null"] }
        net: { type: [string, "null"] }
        vat: { type: [string, "null"] }
        gross: { type: [string, "null"] }
        intro_text: { type: [string, "null"] }
        outro_text: { type: [string, "null"] }
        note: { type: [string, "null"] }
        sent_at: { type: [string, "null"], format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        declined_at: { type: [string, "null"], format: date-time }
        converted_invoice_id: { type: [integer, "null"] }
        converted_project_id: { type: [integer, "null"] }
        pdf_path: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
    FinanceQuoteInput:
      type: object
      description: "Create/update body. `number`/`seq`/`year`/`status` are absent on purpose: the server owns them, so a client cannot mint or reuse a number."
      properties:
        title: { type: [string, "null"], maxLength: 300 }
        partner_id: { type: [integer, "null"], description: "Must be one of the caller's own partners." }
        customer: { type: [object, "null"], additionalProperties: true }
        issue_date: { type: [string, "null"], format: date }
        valid_until: { type: [string, "null"], format: date }
        currency: { type: [string, "null"], maxLength: 8 }
        lines: { type: [array, "null"], maxItems: 200, items: { $ref: "#/components/schemas/FinanceDocumentLine" } }
        discount_type: { type: [string, "null"], enum: [percent, amount, null] }
        discount_value: { type: [number, "null"] }
        net: { type: [number, "null"] }
        vat: { type: [number, "null"] }
        gross: { type: [number, "null"] }
        intro_text: { type: [string, "null"], maxLength: 5000 }
        outro_text: { type: [string, "null"], maxLength: 5000 }
        note: { type: [string, "null"], maxLength: 5000 }
        version: { type: [integer, "null"] }
    FinanceCategory:
      type: object
      description: "Receipt category (relational finance_categories, unique per user; no soft deletes)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        name: { type: string }
        color: { type: [string, "null"], description: "Hex colour #RRGGBB, or null.", example: "#7066f5" }
        icon: { type: [string, "null"], description: "Monochrome icon name (heroicons-outline), or null.", example: "hashtag" }
        account_no: { type: [string, "null"], description: "Owner-entered Sachkonto/chart-of-accounts code (e.g. SKR03/04) for this category, or null. Free text — the server never assigns or validates a specific number.", example: "4930" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    VatReturn:
      type: object
      description: "VAT advance return (Umsatzsteuer-Voranmeldung) figures for a year."
      required: [year, net, vat, gross, count, byRate, quarters]
      properties:
        year: { type: integer }
        net: { type: number }
        vat: { type: number }
        gross: { type: number }
        count: { type: integer }
        byRate:
          type: array
          items:
            type: object
            properties: { rate: { type: number }, net: { type: number }, vat: { type: number } }
        quarters:
          type: array
          items:
            type: object
            properties: { q: { type: integer }, net: { type: number }, vat: { type: number } }

    FinanceKpis:
      type: object
      description: "Headline revenue KPIs for a year incl. year-over-year net growth."
      required: [year, net, count, avg, customers, prevNet]
      properties:
        year: { type: integer }
        net: { type: number }
        count: { type: integer }
        avg: { type: number }
        customers: { type: integer }
        prevNet: { type: number }
        growthPct: { type: [number, "null"] }

    RevenueByCustomer:
      type: object
      description: "Net/gross revenue for one customer in a year."
      properties:
        name: { type: string }
        net: { type: number }
        gross: { type: number }
        count: { type: integer }

    InvoiceAging:
      type: object
      description: >
        Aging of OPEN invoices (status='sent', not trashed) bucketed by days past
        the due date vs today: current (not yet due / no due date), 1-30, 31-60,
        60+. Read-only; each bucket carries count + gross sum + the invoice list.
      required: [buckets, openCount, openGross]
      properties:
        openCount: { type: integer }
        openGross: { type: number }
        buckets:
          type: object
          properties:
            current: { $ref: "#/components/schemas/AgingBucket" }
            "1_30": { $ref: "#/components/schemas/AgingBucket" }
            "31_60": { $ref: "#/components/schemas/AgingBucket" }
            "60_plus": { $ref: "#/components/schemas/AgingBucket" }

    AgingBucket:
      type: object
      required: [count, gross, invoices]
      properties:
        count: { type: integer }
        gross: { type: number }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              number: { type: [string, "null"] }
              customer: { type: string }
              gross: { type: number }
              due_date: { type: [string, "null"] }
              days_overdue: { type: integer }

    AccountVatSummary:
      type: object
      description: "VAT summary of one account's transactions: output/input VAT + payable, by rate."
      required: [income, expense, outputVat, inputVat, payable, privateSum, undecided]
      properties:
        income: { type: array, items: { type: object, properties: { rate: { type: string }, net: { type: number }, vat: { type: number } } } }
        expense: { type: array, items: { type: object, properties: { rate: { type: string }, net: { type: number }, vat: { type: number } } } }
        outputVat: { type: number }
        inputVat: { type: number }
        payable: { type: number }
        privateSum: { type: number }
        undecided: { type: integer }

    VatAdvanceReturn:
      type: object
      description: >
        Unified USt-Voranmeldung: output VAT (from realized invoices) minus input
        VAT / Vorsteuer (from ALL of the user's bank transactions) = payable
        (Zahllast), for a year and optional quarter. For a §19 Kleinunternehmer
        outputVat is 0 (turnover reported as net = gross) and payable = −inputVat.
      required: [year, quarter, net, outputVat, inputVat, payable, byRate, small_business]
      properties:
        year: { type: integer }
        quarter: { type: [integer, "null"], minimum: 1, maximum: 4, description: "1–4, or null for the full year." }
        net: { type: number, description: "Net turnover for the period (output side)." }
        outputVat: { type: number, description: "VAT collected on sales." }
        inputVat: { type: number, description: "Vorsteuer paid on expenses." }
        payable: { type: number, description: "outputVat − inputVat (Zahllast)." }
        byRate:
          type: array
          items:
            type: object
            properties:
              rate: { type: number }
              outputNet: { type: number }
              outputVat: { type: number }
              inputNet: { type: number }
              inputVat: { type: number }
        small_business: { type: boolean }

    EuerReport:
      type: object
      description: >
        Simplified EÜR (Einnahmenüberschussrechnung): income − expenses = profit
        for a year. Income = realized invoices by issue_date (net, or gross for a
        §19 KU) grouped by customer; expenses = that year's expense bank
        transactions (excluding private movements) + FinanceProject manual
        expenses, grouped by VAT/expense category. Not the full Anlage-EÜR form.
      required: [year, income, expenses, profit, small_business]
      properties:
        year: { type: integer }
        income:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items:
                type: object
                properties: { name: { type: string }, amount: { type: number } }
        expenses:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items:
                type: object
                properties: { name: { type: string }, amount: { type: number } }
        profit: { type: number }
        small_business: { type: boolean }

    RecurringCharge:
      type: object
      description: >
        One detected recurring charge (subscription, standing order), from
        GET /finance/recurring. Read-only: the detector reports, it never writes a
        row. Conservative by design — at least three charges and a stable interval,
        because a false "you have a subscription" is worse than a miss.
      properties:
        merchant: { type: string, description: "Counterparty as booked (grouping normalises legal forms, so 'NETCUP GmbH' and 'netcup Deutschland' are one)." }
        scope: { type: string, enum: [business, private] }
        cadence: { type: string, enum: [weekly, monthly, quarterly, semiannual, annual] }
        interval_days: { type: integer, description: "Median days between charges." }
        charges: { type: integer }
        amount: { type: number, format: double, description: "Most recent charge." }
        yearly: { type: number, format: double, description: "Annualised from the cadence (not the measured gap), so a leap year does not move it and a monthly line compares with an annual one." }
        first_at: { type: string, format: date }
        last_at: { type: string, format: date }
        next_at: { type: string, format: date, description: "Expected next charge (last + interval)." }
        stale: { type: boolean, description: "The next charge is well overdue — cancelled, or silently stopped." }
        price_change:
          type: [object, "null"]
          description: "Set when the most recent charge differs from the one before it."
          properties:
            from: { type: number, format: double }
            to: { type: number, format: double }
            at: { type: string, format: date }
        transaction_ids: { type: array, items: { type: integer } }

    DuplicateGroup:
      type: object
      description: "A suspected-duplicate group (read-only). `ids` are the row ids sharing `key` for `reason`."
      required: [reason, key, ids]
      properties:
        reason: { type: string }
        key: { type: string }
        ids: { type: array, items: { type: integer } }

    NumberGapGroup:
      type: object
      description: "A run of missing invoice numbers within one numbering regime (read-only, never mutates a row). `group` is `year:YYYY` for YYYY-NNNN numbers (reset per calendar year) or the literal `sequence` for every other format (bare integers, R-NNNNN, …), which is treated as one continuous ordinal sequence across all years."
      required: [group, missing, min, max, count]
      properties:
        group: { type: string, example: "year:2025" }
        missing: { type: array, items: { type: string }, description: "The missing numbers, formatted like the group's highest-numbered sample." }
        min: { type: string, description: "Lowest number observed in this group." }
        max: { type: string, description: "Highest number observed in this group." }
        count: { type: integer }

    FinanceReceipt:
      type: object
      description: "Standalone receipt (relational finance_receipts) — a receipt document WITHOUT a bank transaction (\"Fremdbeleg\"). Bytes plaintext on the files disk; blob_path/size/sig server-owned. Optional bank_transaction_id links it to a booking, or — for a split payment (one receipt settled by several separate charges) — linked_transaction_ids links it to all of them instead; the two are mutually exclusive."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        bank_transaction_id: { type: integer, nullable: true, description: "Optional link to a bank booking (the common single-charge case)." }
        linked_transaction_ids: { type: array, items: { type: integer }, nullable: true, description: "Split-payment link: this receipt's total was debited as several separate bank transactions, e.g. one INWX invoice settled by two charges a week apart. Mutually exclusive with bank_transaction_id — setting one server-side clears the other." }
        finance_project_id: { type: integer, nullable: true }
        blob_path: { type: string, description: "Server-owned storage path (files disk)." }
        name: { type: string }
        mime: { type: string, nullable: true }
        size: { type: integer }
        sig: { type: string, nullable: true, description: "Content dedup signature." }
        kind: { type: string }
        scope: { type: [string, "null"], enum: [business, private, null], description: "null = follow the linked booking (which follows its account); a loose receipt is business." }
        effective_scope: { type: string, enum: [business, private], description: "Resolved server-side. Read-only." }
        category: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        vat: { type: string, nullable: true }
        amount: { type: [string, "null"], description: "Gross total as a decimal string (decimal:2 cast — Laravel serialises it as a string), editable, prefilled by OCR recognition." }
        currency: { type: string, nullable: true, description: "ISO 4217 code (EUR/USD/GBP/CHF), uppercased server-side; editable, prefilled by OCR recognition. Display/reference only — amount is never converted." }
        date: { type: [string, "null"], description: "Document date (editable, prefilled by OCR recognition). Carries a time part: a `date` cast serialises exactly like `datetime`, so this is `2026-07-31T00:00:00.000000Z`, not a plain date." }
        order_ref: { type: string, nullable: true, description: "Merchant-printed payment/order reference (e.g. Amazon's \"Zahlungsreferenznummer\") — the strongest signal for grouping several receipts that settle as one charge." }
        doc_number: { type: string, nullable: true, description: "Recognised invoice/receipt number — display + de-dup signal for accidental re-uploads." }
        note: { type: string, nullable: true }
        partner_id: { type: integer, nullable: true }
        ocr: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }

    ReceiptMatchGroup:
      type: object
      description: "A suggested link between one or more unlinked standalone receipts and one unlinked bank transaction (read-only, never mutates a row) — covers the case a single charge is settled by several receipts (e.g. Amazon splitting an order into multiple shipment invoices). The client applies an accepted group by PUTing bank_transaction_id on each listed receipt."
      required: [transaction_id, receipt_ids, reason, total]
      properties:
        transaction_id: { type: integer }
        receipt_ids: { type: array, items: { type: integer }, description: "One or more receipts summing to `total`." }
        reason: { type: string, enum: [order_ref, exact, sum], description: "order_ref = receipts share a merchant-printed payment reference; exact = one receipt matches the amount to the cent; sum = a bounded subset-sum of nearby receipts matches the amount." }
        total: { type: number, format: double }
    ReceiptDuplicate:
      type: object
      description: "An accidental re-upload of the same receipt document (same order_ref/doc_number + amount as an earlier upload), excluded from ReceiptMatchGroup sums so it is never double-counted."
      required: [receipt_id, duplicate_of]
      properties:
        receipt_id: { type: integer }
        duplicate_of: { type: integer, description: "The earlier-uploaded receipt this one duplicates." }
    SplitPaymentGroup:
      type: object
      description: "The inverse of ReceiptMatchGroup: one unlinked standalone receipt whose amount matches no SINGLE unlinked transaction, but a bounded subset-sum of several does (e.g. one INWX invoice billed as one document but debited as two separate charges a week apart). Read-only, never mutates a row. The client applies an accepted group by PUTing linked_transaction_ids on the receipt."
      required: [receipt_id, transaction_ids, reason, total]
      properties:
        receipt_id: { type: integer }
        transaction_ids: { type: array, items: { type: integer }, description: "Two or more transactions summing to `total`." }
        reason: { type: string, enum: [sum], description: "Always sum — a single matching transaction is already handled elsewhere (the client's own auto-pick on upload), so this only ever fires for a combination." }
        total: { type: number, format: double }

    Server:
      type: object
      description: "A monitored server. Credentials are never serialised — neither the password nor the private key appears in any response."
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        auth_type: { type: string, enum: [key] }
        group: { type: [string, "null"] }
        note: { type: [string, "null"] }
        enabled: { type: boolean }
        restricted_key: { type: boolean, description: "The key on the target is limited to a forced command." }
        account_created: { type: [boolean, "null"], description: "Whether the guided setup created the account on the target. Drives which removal instructions are shown. Null for rows created before the field existed — the answer is genuinely unknown, not false." }
        monitor_ports:
          type: array
          description: "Extra TCP ports checked every few minutes. The SSH port is always checked and is deliberately not listed here."
          items:
            type: object
            properties:
              port: { type: integer, minimum: 1, maximum: 65535 }
              label: { type: [string, "null"] }
        disk_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99, description: "Filesystem share that triggers a notification. Null uses the built-in 90. Adjustable because 90 is right for a system disk and nonsense for an archive that lives at 95 — and a threshold nobody can move is one people learn to ignore." }
        mem_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99, description: "Memory share that triggers a notification. Null uses the built-in 95." }
        temp_alert_c: { type: [integer, "null"], minimum: 40, maximum: 120, description: "Hottest-sensor temperature that triggers a notification. Null uses the built-in 85." }
        poll_interval_s: { type: [integer, "null"], minimum: 30, maximum: 1800, description: "Seconds between usage snapshots for THIS server. Null = the 300s default. The sweep ticks every 30s and only queues a server once its own interval has elapsed." }
        host_fingerprint: { type: [string, "null"], description: "Pinned host key fingerprint, OpenSSH form: SHA256 plus 43 base64 characters." }
        status:
          type: [object, "null"]
          description: "The newest collection run, successful or not. Null until the first probe."
          properties:
            ok: { type: boolean }
            error: { type: [string, "null"], description: "Machine-readable reason (unsafe_host, ssh_missing, no_host_key, fingerprint_mismatch, no_credentials, auth_failed, connection_refused, timeout, unreachable, no_common_algorithms, unexpected_output) or a short quote of ssh's own stderr." }
            collected_at: { type: string, format: date-time }
            duration_ms: { type: integer }
        facts: { $ref: "#/components/schemas/ServerFacts" }
    ServerFacts:
      type: [object, "null"]
      description: "The parsed snapshot from the last successful probe. Every section is optional: a host without systemd or docker simply omits it."
      properties:
        role:
          type: object
          description: >
            What the machine is for, derived from installed services and running
            container images. Both sources on purpose: on a modern host the
            services are containers, and reading only systemd units would call a
            machine running Postfix, Dovecot and Rspamd in containers "just a
            Docker host" - true, and useless. A container is judged by its
            image, never its name: one called "mail" running nginx is a web
            server. `services` lists only what is installed, and carries
            `installed` separately from `active`, because "installed but
            stopped" and "not installed" are different answers that
            `systemctl is-active` reports identically.
          properties:
            roles:
              type: array
              items: { type: string, enum: [mail, web, database, virtualisation, containers, storage, dns, media, identity, monitoring] }
            platform:
              type: [string, "null"]
              description: "A distribution that is a role in itself: proxmox, truenas, opnsense, openmediavault."
            services:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  installed: { type: boolean }
                  active: { type: boolean }
                  source: { type: string }
        storage:
          type: array
          description: >
            The physical disks, as opposed to the filesystems on them. `health`
            is three-valued: `unknown` means the host could not tell us -
            smartmontools absent, or a RAID controller hiding the members behind
            one volume - and that is not the same as healthy. Reallocated and
            pending sectors are the two figures that actually predict a failure.
          items:
            type: object
            properties:
              name: { type: string }
              size_b: { type: integer }
              rotational: { type: boolean }
              model: { type: string }
              health:
                type: string
                enum: [ok, failing, unreadable, unsupported, virtual, unknown]
                description: >
                  "unknown" means smartmontools is absent; "unreadable" means a
                  controller would not pass SMART through; "virtual" means there
                  is no drive to ask, because the guest is looking at a disk the
                  hypervisor made up. Only the middle one is worth chasing.
              temp_c: { type: [number, "null"] }
              hours: { type: [integer, "null"] }
              reallocated: { type: [integer, "null"] }
              pending: { type: [integer, "null"] }
        arrays:
          type: array
          description: "Software RAID and ZFS pools. A degraded array keeps working right up until the second disk goes, which is why it carries its own flag."
          items:
            type: object
            properties:
              kind: { type: string }
              name: { type: string }
              state: { type: string }
              detail: { type: string }
              degraded: { type: boolean }
        sensors:
          type: array
          description: "Temperatures read from /sys/class/hwmon rather than through lm-sensors, which is missing more often than it is present."
          items:
            type: object
            properties:
              chip: { type: string }
              label: { type: string }
              temp_c: { type: number }
        timers:
          type: object
          description: "Scheduled work. Failed services are reported elsewhere; a failed timer is invisible, and that is where backups and certificate renewal live."
          properties:
            units:
              type: array
              items:
                type: object
                properties:
                  unit: { type: string }
                  next: { type: string, description: "Empty when the timer is not scheduled to run again, which is a real state." }
                  last: { type: string }
                  activates: { type: string }
            failed:
              type: array
              items: { type: string }
        backup_tools:
          type: array
          description: "Backup tools present on the host. Only that: the probe can see a binary, and claiming when it last ran would be a guess about somebody's data."
          items: { type: string }
        logins:
          type: array
          items:
            type: object
            properties:
              user: { type: string }
              from: { type: string, description: "Empty for a console login, which has no origin address." }
              when: { type: string }
        failed_logins:
          type: [integer, "null"]
          description: "Null where lastb is unavailable. \"Could not look\" and \"nobody tried\" are opposite answers."
        hostname: { type: [string, "null"] }
        os:
          type: object
          properties:
            name: { type: [string, "null"] }
            id: { type: [string, "null"] }
            version: { type: [string, "null"] }
        kernel: { type: [string, "null"] }
        arch: { type: [string, "null"] }
        uptime_s: { type: [integer, "null"] }
        load: { type: array, items: { type: number }, description: "1/5/15-minute averages." }
        cpu:
          type: object
          properties:
            cores: { type: [integer, "null"] }
            model: { type: [string, "null"] }
            used_pct: { type: [number, "null"], description: "Busy time as a percentage, from two /proc/stat samples one second apart. Null when only one sample arrived — a single read gives the average since boot, which never moves. Not the same thing as load, which is queue length." }
        mem:
          type: object
          properties:
            total_kb: { type: [integer, "null"] }
            available_kb: { type: [integer, "null"] }
            used_pct: { type: [number, "null"] }
            swap_total_kb: { type: [integer, "null"] }
            swap_used_kb: { type: [integer, "null"] }
        disks:
          type: array
          items:
            type: object
            properties:
              fs: { type: string }
              mount: { type: string }
              size_kb: { type: integer }
              used_kb: { type: integer }
              avail_kb: { type: integer }
              used_pct: { type: number }
        disk_max_pct: { type: [number, "null"], description: "The fullest filesystem — what the list view's status dot uses." }
        reboot_required: { type: boolean }
        failed_units: { type: array, items: { type: string } }
        ports: { type: array, items: { type: string } }
        containers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string }
        updates: { type: [integer, "null"], description: "Pending package updates. Null where no supported package manager answered — NOT zero, which would read as fully patched." }
        addresses:
          type: array
          description: "Global IPv4 addresses, one entry per interface, formatted as interface then CIDR, e.g. eth0 192.168.3.200/24."
          items: { type: string }
        virt: { type: [string, "null"], description: "Hypervisor or container runtime as systemd-detect-virt names it. Null on bare metal, where it reports none." }
        boot_at: { type: [string, "null"], format: date-time, description: "Boot time from /proc/stat btime. Absolute, so it stays correct between two collection runs, unlike an uptime span." }
        sessions:
          type: array
          description: "Lines from who(1): who is logged in, from where, since when."
          items: { type: string }
        processes:
          type: array
          description: "The largest processes by resident memory. Deliberately not CPU: a quarter-hourly snapshot cannot say anything honest about instantaneous CPU load."
          items:
            type: object
            properties:
              name: { type: string }
              rss_kb: { type: integer }
        temp_c: { type: [number, "null"], description: "First thermal zone in degrees Celsius. Absent on most virtual machines." }
    ServerInput:
      type: object
      description: "Connection parameters. A blank secret on update keeps the stored one. host_fingerprint is required on create and must be the value a prior /servers/test reported."
      required: [name, host, username, host_fingerprint]
      properties:
        name: { type: string, maxLength: 255 }
        host: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        username: { type: string, maxLength: 64, description: "Preferably an unprivileged account — the probe needs no privilege. `root` is accepted (some hosts have no other account) but the UI warns that such a key hands over the whole machine if stolen." }
        auth_type: { type: string, enum: [key], description: "Key only; password authentication is not offered." }
        private_key: { type: string, maxLength: 16384 }
        passphrase: { type: string, maxLength: 1024 }
        host_fingerprint: { type: string, pattern: "^SHA256:[A-Za-z0-9+/]{43}$" }
        keypair_token: { type: string, maxLength: 64, description: "Redeems a key generated by /servers/keypair instead of sending a private key. A pasted private_key wins over it; both blank keeps the stored secret on update." }
        group: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
        restricted_key: { type: boolean }
        account_created: { type: boolean, description: "Set by the create dialog: true when the setup commands created the account, false when an existing account was reused." }
        monitor_ports:
          type: array
          maxItems: 20
          description: "Extra TCP ports to watch. Capped because the list is checked every few minutes; duplicates are dropped server-side."
          items:
            type: object
            required: [port]
            properties:
              port: { type: integer, minimum: 1, maximum: 65535 }
              label: { type: [string, "null"], maxLength: 40 }
        disk_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99, description: "Send null or omit to fall back to the default." }
        mem_alert_pct: { type: [integer, "null"], minimum: 50, maximum: 99 }
        temp_alert_c: { type: [integer, "null"], minimum: 40, maximum: 120 }
        poll_interval_s: { type: [integer, "null"], minimum: 30, maximum: 1800, description: "Seconds between usage snapshots for this server; null restores the 300s default. Outside 30..1800 is rejected (422)." }
    ServerCheckSeries:
      type: object
      description: "Reachability history for one thing being checked: the ping, or one TCP port."
      properties:
        kind: { type: string, enum: [icmp, tcp] }
        port: { type: [integer, "null"], description: "Null for ICMP." }
        label: { type: [string, "null"], description: "'SSH' for the port that is always checked, the owner's label otherwise." }
        uptime_pct: { type: number, description: "Successful checks over the requested window, not since forever. Always present: a series exists only because at least one check produced it." }
        samples: { type: integer }
        last:
          type: [object, "null"]
          properties:
            ok: { type: boolean }
            ms: { type: [integer, "null"] }
            error: { type: [string, "null"], description: "refused, timeout, unreachable, no_reply, unsafe_host or failed." }
            t: { type: string, format: date-time }
        points:
          type: array
          items:
            type: object
            properties:
              t: { type: string, format: date-time }
              ms: { type: [integer, "null"] }
              ok: { type: boolean }
    ServerProbeResult:
      type: object
      description: "Outcome of an inline connection test. The fingerprint is reported even on failure, so a mismatch can be inspected."
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"] }
        fingerprint: { type: [string, "null"] }
        key_fingerprint:
          type: [string, "null"]
          description: SHA256 of the offered key, in the form `ssh-keygen -lf` prints.
        public_key:
          type: [string, "null"]
          description: >
            The OpenSSH public line of the key that was tried, derived from the
            private half rather than stored so the two cannot drift; the private
            half is never returned. This is what makes `auth_failed` actionable:
            it means the host does not carry this line in that account's
            authorized_keys, and there was previously no way to see which line
            the app would offer when the key was pasted rather than generated.
        facts: { $ref: "#/components/schemas/ServerFacts" }
        duration_ms: { type: integer }
    BankTransaction:
      type: object
      description: "Bank-statement line (relational bank_transactions). All columns plaintext at rest since v1.516.0. Amount/date/vat_cat drive stats + VAT."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        payment_method_id: { type: integer }
        date: { type: string }
        amount: { type: string }
        vat_cat: { type: [string, "null"] }
        scope: { type: [string, "null"], enum: [business, private, null], description: "null = follow the account; an explicit value overrides it. Distinct from vat_cat='private' (an owner withdrawal that stays in the books)." }
        effective_scope: { type: string, enum: [business, private], description: "Resolved server-side (booking -> account) so no client re-derives the rule. Read-only." }
        sig: { type: [string, "null"] }
        invoice_id: { type: [integer, "null"] }
        invoice_number: { type: [string, "null"] }
        finance_project_id: { type: [integer, "null"] }
        counterparty: { type: [string, "null"] }
        counterparty_iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        purpose: { type: [string, "null"] }
        booking_text: { type: [string, "null"] }
        eref: { type: [string, "null"] }
        receipts: { type: [array, "null"], items: { $ref: "#/components/schemas/TransactionReceipt" } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    InvoiceInput:
      type: object
      description: >
        Invoice create/update body. On create `name` defaults apply
        (status=draft, type=invoice, currency=EUR); `number` is optional (self-issued
        invoices are numbered server-side via /finalize). On update every field is
        optional (send only what changes) and `version` drives optimistic concurrency.
        Server-managed fields (seq/year/cancels_invoice_id/pdf_path/version) are never
        accepted here.
      properties:
        number: { type: [string, "null"], maxLength: 64 }
        status: { type: string, enum: [draft, final, sent, paid] }
        type: { type: string, enum: [invoice, credit_note] }
        issue_date: { type: [string, "null"], format: date }
        due_date: { type: [string, "null"], format: date }
        currency: { type: string, maxLength: 8 }
        vat_rate: { type: [number, "null"] }
        gross: { type: [number, "null"] }
        net: { type: [number, "null"] }
        vat: { type: [number, "null"] }
        discount_type: { type: [string, "null"], enum: [percent, amount, null] }
        discount_value: { type: [number, "null"], minimum: 0 }
        skonto_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        skonto_days: { type: [integer, "null"], minimum: 0, maximum: 3650 }
        imported: { type: boolean }
        paid_at: { type: [string, "null"], format: date }
        payment_account: { type: [string, "null"], maxLength: 200 }
        partner_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted partner." }
        customer: { type: [object, "null"], additionalProperties: true }
        lines: { type: [array, "null"], maxItems: 1000, items: { type: object, additionalProperties: true } }
        note: { type: [string, "null"], maxLength: 100000 }
        versions: { type: [array, "null"], maxItems: 1000, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: expected row version for optimistic concurrency (409 on mismatch)." }

    PartnerInput:
      type: object
      description: "Business-partner create/update body. `name` is required on create. `version` (update only) drives optimistic concurrency."
      properties:
        name: { type: string, maxLength: 300 }
        category: { type: [string, "null"], maxLength: 120 }
        kind: { type: [string, "null"], maxLength: 16 }
        url: { type: [string, "null"], maxLength: 2000 }
        logo: { type: [string, "null"], maxLength: 2000 }
        note: { type: [string, "null"], maxLength: 100000 }
        address: { type: [string, "null"], maxLength: 2000 }
        email: { type: [string, "null"], maxLength: 320 }
        invoice_email: { type: [string, "null"], format: email, maxLength: 320 }
        phone: { type: [string, "null"], maxLength: 100 }
        vat_id: { type: [string, "null"], maxLength: 64 }
        contacts: { type: [array, "null"], maxItems: 200, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    PaymentMethodInput:
      type: object
      description: "Payment-method create/update body. `type` + `name` are required on create. `version` (update only) drives optimistic concurrency."
      properties:
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        name: { type: string, maxLength: 200 }
        holder: { type: [string, "null"], maxLength: 200 }
        note: { type: [string, "null"], maxLength: 20000 }
        business: { type: boolean }
        scope: { type: string, enum: [business, private], description: "Defaults to business; its bookings inherit it." }
        url: { type: [string, "null"], maxLength: 2000 }
        icon: { type: [string, "null"], maxLength: 200000, description: "Data-URI or URL of a small bank/brand icon." }
        iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        bank: { type: [string, "null"], maxLength: 200 }
        account_no: { type: [string, "null"], maxLength: 64 }
        card_number: { type: [string, "null"], maxLength: 40 }
        card_network: { type: [string, "null"], maxLength: 40 }
        card_expiry: { type: [string, "null"], maxLength: 16 }
        paypal_email: { type: [string, "null"], maxLength: 320 }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    ProjectInput:
      type: object
      description: "Cost-project create/update body. `name` is required on create. `version` (update only) drives optimistic concurrency."
      properties:
        name: { type: string, maxLength: 300 }
        parent_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted project." }
        kind: { type: string, enum: [business, private] }
        note: { type: [string, "null"], maxLength: 100000 }
        expenses: { type: [array, "null"], maxItems: 5000, items: { $ref: "#/components/schemas/ProjectExpense" }, description: "Replaces the whole ledger — there is no per-row endpoint. Send the full array." }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    CategoryInput:
      type: object
      required: [name]
      description: "Receipt-category create/update body (name/colour/icon/account_no — a full replace, not just a rename)."
      properties:
        name: { type: string, maxLength: 160, description: "Unique per user (the current category id is ignored on update)." }
        color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$", example: "#7066f5" }
        icon: { type: [string, "null"], maxLength: 40, description: "Monochrome heroicons-outline name from the fixed allowlist (FinanceController::CATEGORY_ICONS), e.g. hashtag/tag/banknotes." }
        account_no: { type: [string, "null"], maxLength: 40, description: "Owner-entered Sachkonto/chart-of-accounts code, free text.", example: "4930" }

    TransactionInput:
      type: object
      description: "Bank-transaction create/update body. `payment_method_id` + `date` + `amount` are required on create. `version` (update only) drives optimistic concurrency."
      properties:
        payment_method_id: { type: integer, description: "Must be an existing, owned, non-deleted payment method." }
        date: { type: string, format: date }
        amount: { type: number }
        vat_cat: { type: [string, "null"], maxLength: 16 }
        scope: { type: [string, "null"], enum: [business, private, null], description: "null/absent = follow the account." }
        sig: { type: [string, "null"], maxLength: 80, description: "Dedup signature." }
        invoice_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted invoice." }
        invoice_number: { type: [string, "null"], maxLength: 64 }
        finance_project_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted project." }
        counterparty: { type: [string, "null"], maxLength: 2000 }
        counterparty_iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        purpose: { type: [string, "null"], maxLength: 4000 }
        booking_text: { type: [string, "null"], maxLength: 2000 }
        eref: { type: [string, "null"], maxLength: 200 }
        receipts:
          type: [array, "null"]
          maxItems: 200
          description: "Metadata + fileless (invoice-link/Eigenbeleg) entries only; a client-supplied blob_path is always dropped — real file receipts are created via the receipts endpoint."
          items: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    TransactionBulkRow:
      type: object
      required: [date, amount]
      description: "One parsed bank-statement line for POST /finance/transactions/bulk. Deduplicated by `sig`."
      properties:
        date: { type: string, format: date }
        amount: { type: number }
        sig: { type: [string, "null"], maxLength: 80 }
        vat_cat: { type: [string, "null"], maxLength: 16 }
        counterparty: { type: [string, "null"], maxLength: 2000 }
        counterparty_iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        purpose: { type: [string, "null"], maxLength: 4000 }
        booking_text: { type: [string, "null"], maxLength: 2000 }
        eref: { type: [string, "null"], maxLength: 200 }

    UserSettings:
      type: object
      description: "Per-user non-display settings (file version cap)."
      properties:
        file_max_versions: { type: integer, minimum: 1, maximum: 200 }

    AdminUser:
      type: object
      description: "Admin view of a user. Never includes password hashes or 2FA secrets."
      required: [id, name, email, role, verified, two_factor]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        max_connected_devices: { type: [integer, "null"] }
        modules: { type: [array, "null"], items: { type: string } }
        groups: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        verified: { type: boolean }
        two_factor: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        blocked_at: { type: [string, "null"], format: date-time, description: "Set while the account is blocked (see POST /admin/users/{user}/block); null when active." }

    AdminUserWrite:
      type: object
      description: "User create/update body. role/quotas/modules are privilege fields (never mass-assigned server-side)."
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, user] }
        password: { type: string, minLength: 12, description: "Create only (prohibited on update); omit to trigger a reset mail." }
        max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
        modules: { type: [array, "null"], items: { type: string, enum: [finance, servers] } }
        modules_marker: { type: string, enum: ['set'], description: "Send with an (empty) modules[] to set an explicit list rather than 'no change'." }
        groups: { type: [array, "null"], items: { type: integer } }

    PaperlessTerm:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: "Paperless numeric id." }
        name: { type: string }
        color: { type: [string, "null"] }

    SecurityLogEntry:
      type: object
      description: "One append-only audit entry. Metadata only — never tokens/keys/ciphertext."
      properties:
        at: { type: [string, "null"], format: date-time }
        user_id: { type: [integer, "null"] }
        actor: { type: [string, "null"], description: "Display name at query time." }
        action: { type: string, example: device.evicted, description: "Dot-namespaced event id." }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        meta: { type: [object, "null"], additionalProperties: true }

    RequestLogEntry:
      type: object
      description: "One HTTP request-trail row (admin, metadata only)."
      required: [id, method, path, status]
      properties:
        id: { type: integer }
        time: { type: [string, "null"], format: date-time }
        ip: { type: [string, "null"] }
        method: { type: string, example: GET }
        path: { type: string, example: /api/v1/files }
        status: { type: integer, example: 200 }
        user:
          type: [object, "null"]
          properties: { id: { type: integer }, name: { type: string } }
        user_agent: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"] }

    BlockedIp:
      type: object
      description: "One entry in the IP/CIDR block-list."
      required: [id, cidr]
      properties:
        id: { type: integer }
        cidr: { type: string, example: 203.0.113.0/24 }
        reason: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }

    SessionsOverview:
      type: object
      description: "Cross-user active web sessions + device tokens (admin)."
      properties:
        web:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [web] }
              user_id: { type: integer }
              ip: { type: [string, "null"] }
              user_agent: { type: [string, "null"] }
              last_activity: { type: [string, "null"], format: date-time }
        devices:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [device] }
              user_id: { type: integer }
              name: { type: [string, "null"] }
              ip: { type: [string, "null"] }
              last_used_at: { type: [string, "null"], description: "Raw DB timestamp string (Y-m-d H:i:s), not strict ISO-8601." }

    BackupDestinationSummary:
      type: object
      description: "Safe public shape — credentials (`config`) intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }

    BackupDestinationWrite:
      type: object
      required: [name, driver]
      description: >
        Create/update body for a backup destination. Only the keys relevant to the
        chosen `driver` are stored: s3/b2 → bucket/region/key/secret/endpoint/
        use_path_style/path; sftp → host/port/username/password/host_fingerprint/path;
        webdav → base_uri/username/password/path. On update, a blank `secret` or
        `password` keeps the stored value. Credentials are stored encrypted (config
        cast) and are NEVER returned in any response.
      properties:
        name: { type: string, maxLength: 120 }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }
        bucket: { type: string, maxLength: 255, description: "s3/b2." }
        region: { type: string, maxLength: 64, description: "s3/b2." }
        key: { type: string, maxLength: 255, description: "s3/b2 access key id." }
        secret: { type: string, maxLength: 255, description: "s3/b2 secret (blank on update keeps stored)." }
        endpoint: { type: string, maxLength: 255, format: uri, description: "s3/b2 custom endpoint. SSRF-guarded (SafeUrl)." }
        use_path_style: { type: boolean, description: "s3/b2 path-style addressing." }
        host: { type: string, maxLength: 255, description: "sftp host. SSRF-guarded (SafeHost); link-local/metadata rejected (422)." }
        port: { type: integer, minimum: 1, maximum: 65535, description: "sftp port." }
        username: { type: string, maxLength: 255, description: "sftp/webdav." }
        password: { type: string, maxLength: 255, description: "sftp/webdav (blank on update keeps stored)." }
        host_fingerprint: { type: string, maxLength: 255, description: "sftp host key fingerprint." }
        base_uri: { type: string, maxLength: 255, format: uri, description: "webdav base URL. SSRF-guarded (SafeUrl); link-local/metadata rejected (422)." }
        path: { type: string, maxLength: 255, description: "Optional sub-path prefix at the destination." }

    BackupJobSummary:
      type: object
      description: "Safe public shape — `passphrase` intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        source: { type: string, enum: [database, invoices, avatars], description: "Legacy single-source column (= sources[0])." }
        sources: { type: array, items: { type: string, enum: [database, invoices, avatars] }, description: "All sources this job backs up." }
        mode: { type: string, enum: [full, incremental] }
        destination_id: { type: integer }
        cron: { type: string }
        retention: { type: integer }
        keep_daily: { type: integer }
        keep_weekly: { type: integer }
        keep_monthly: { type: integer }
        encrypt: { type: boolean }
        notify_channels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"] }
        statistics: { type: object, additionalProperties: true }

    BackupJobWrite:
      type: object
      required: [name, sources, backup_destination_id, cron, keep_daily]
      description: "A job backs up one or more sources at once into a timestamped batch, in full or incremental mode, rotated with grandfather-father-son retention. Encryption is recommended (a DB dump is cleartext PII) but optional; 422 only if encrypt=true without an available passphrase. Blank passphrase keeps the stored value on update."
      properties:
        name: { type: string, maxLength: 120 }
        sources: { type: array, minItems: 1, items: { type: string, enum: [database, invoices, avatars] }, description: "What to back up. database = full DB dump; invoices = invoice PDFs + receipts; avatars = user avatar images." }
        source: { type: [string, "null"], enum: [database, invoices, avatars], description: "Legacy single-source column, kept in sync with sources[0]. Optional." }
        mode: { type: string, enum: [full, incremental], description: "incremental only re-uploads blob sources (invoices/avatars) changed since the last run; the DB dump is always full." }
        backup_destination_id: { type: integer, description: "Must reference an existing backup destination." }
        cron: { type: string, maxLength: 64, description: "A valid cron expression." }
        retention: { type: [integer, "null"], minimum: 1, maximum: 9999, description: "Legacy flat retention; superseded by keep_daily. Kept in sync." }
        keep_daily: { type: integer, minimum: 0, maximum: 9999, description: "GFS son tier: keep the newest N batches." }
        keep_weekly: { type: [integer, "null"], minimum: 0, maximum: 9999, description: "GFS father tier: keep one batch per week for N weeks." }
        keep_monthly: { type: [integer, "null"], minimum: 0, maximum: 9999, description: "GFS grandfather tier: keep one batch per month for N months." }
        encrypt: { type: boolean }
        passphrase: { type: [string, "null"], minLength: 12, maxLength: 255, description: "Encryption passphrase. Required when encrypt=true and no env passphrase is set. Blank on update keeps stored. Never returned." }
        notify_channels: { type: array, items: { type: string, enum: [desktop, mail, ntfy, webhook] } }
        enabled: { type: boolean }

    BackupRunSummary:
      type: object
      description: "A recent backup run (the exact shape returned by GET /backup/runs)."
      properties:
        id: { type: integer }
        job: { type: [string, "null"], description: "Job name, or null if the job was deleted." }
        status: { type: string, description: "e.g. running | success | failed | cancelled." }
        message: { type: [string, "null"] }
        log: { type: [string, "null"] }
        startedIso: { type: [string, "null"], format: date-time }
        startedHuman: { type: [string, "null"], description: "Relative start time (e.g. '3 hours ago')." }
        size: { type: [string, "null"], description: "Human-readable total batch size (e.g. '4.2 MB'), or null." }
        archives:
          type: array
          description: "One entry per source backed up in this run. The database is a point-in-time dump (downloadable/verifiable/decryptable/restorable via `?source=database`); blob sources are a living MIRROR (delta-synced, no single archive) — restorable in-place but not downloadable/verifiable individually."
          items:
            type: object
            properties:
              source: { type: string, enum: [database, invoices, avatars] }
              encrypted: { type: boolean, description: "Bytes are encrypted (.enc / per-file) — verify/decrypt/restore need the passphrase." }
              mirror: { type: boolean, description: "Blob source stored as a living mirror (true) vs. a DB point-in-time dump (false)." }
              downloadable: { type: boolean, description: "Only the DB dump is a downloadable/verifiable archive; mirror sources are not." }
              restorable: { type: boolean, description: "Blob sources restore in-place from the mirror; the database cannot (use artisan backup:restore-db)." }
        cancellable: { type: boolean }
        cancelling: { type: boolean, description: "A graceful cancel has been requested and is pending." }
        verifyStatus: { type: [string, "null"] }
        verifyMessage: { type: [string, "null"] }
        verifiedHuman: { type: [string, "null"], description: "Relative time of the last verification." }

    FinanceV2Money:
      type: object
      additionalProperties: false
      required: [net_minor, vat_minor, gross_minor, currency]
      properties:
        net_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "9007199254740993", description: "Exact signed minor-unit integer string; JSON numbers are rejected." }
        vat_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "1711367858400789", description: "Exact signed minor-unit integer string; JSON numbers are rejected." }
        gross_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "10718567113141782", description: "Exact signed minor-unit integer string; JSON numbers are rejected." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }

    FinanceV2QuoteLineInput:
      type: object
      additionalProperties: false
      required: [description, quantity, unit, unit_price, tax_rate, kind]
      properties:
        description: { type: string, maxLength: 1000 }
        quantity: { type: string, pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,4})?$", description: "Exact scale-4 decimal string; JSON numbers are rejected." }
        unit: { type: string, maxLength: 50 }
        unit_price: { type: string, pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$", description: "Exact currency decimal string; JSON numbers are rejected." }
        tax_rate: { type: string, pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$", description: "Exact percentage decimal string; JSON numbers are rejected." }
        kind: { type: string, enum: [service, hardware] }
        product_id: { type: [integer, "null"], minimum: 1 }

    FinanceV2QuoteDraftInput:
      type: object
      additionalProperties: false
      required: [title, customer, currency, lines, discount_type]
      properties:
        title: { type: string, maxLength: 255 }
        partner_id: { type: [integer, "null"], minimum: 1 }
        customer:
          type: object
          required: [name]
          properties:
            name: { type: string, maxLength: 255 }
            email: { type: [string, "null"], format: email }
          additionalProperties: true
        issue_date: { type: [string, "null"], format: date }
        valid_until: { type: [string, "null"], format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/FinanceV2QuoteLineInput' } }
        discount_type: { type: string, enum: [none, percent, fixed] }
        discount_value: { type: [string, "null"], pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$" }
        intro_text: { type: [string, "null"] }
        outro_text: { type: [string, "null"] }
        internal_note: { type: [string, "null"] }
        version: { type: integer, minimum: 0, description: "Required only for draft update." }
        control_net_minor: { type: [string, "null"], pattern: '^(?:0|-?[1-9][0-9]*)$', example: "9007199254740993", description: "Optional exact signed minor-unit assertion within the server integer range; JSON numbers are rejected and the value is never authoritative." }
        control_vat_minor: { type: [string, "null"], pattern: '^(?:0|-?[1-9][0-9]*)$', example: "1711367858400789", description: "Optional exact signed minor-unit assertion within the server integer range; JSON numbers are rejected and the value is never authoritative." }
        control_gross_minor: { type: [string, "null"], pattern: '^(?:0|-?[1-9][0-9]*)$', example: "10718567113141782", description: "Optional exact signed minor-unit assertion within the server integer range; JSON numbers are rejected and the value is never authoritative." }

    FinanceV2QuotePreview:
      type: object
      additionalProperties: false
      required: [net_minor, vat_minor, gross_minor, discount_minor, currency, tax_breakdowns, issue_date, valid_until]
      properties:
        net_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "9007199254740993" }
        vat_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "1711367858400789" }
        gross_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "10718567113141782" }
        discount_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "1000000000000000" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        tax_breakdowns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tax_rate_basis_points, net_minor, vat_minor, gross_minor]
            properties:
              tax_rate_basis_points: { type: string, pattern: '^(?:0|[1-9][0-9]*)$', example: "1900" }
              net_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "9007199254740993" }
              vat_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "1711367858400789" }
              gross_minor: { type: string, pattern: '^(?:0|-?[1-9][0-9]*)$', example: "10718567113141782" }
        issue_date: { type: string, format: date }
        valid_until: { type: string, format: date }

    FinanceV2QuoteLine:
      type: object
      additionalProperties: false
