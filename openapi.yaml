        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version, idempotency, or workflow conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2QuoteConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2QuoteUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

