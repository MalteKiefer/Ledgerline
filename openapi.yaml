      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, pdf]
              properties:
                to: { type: string, format: email, description: "Recipient (defaults client-side to the partner's invoiceEmail)." }
                subject: { type: string, maxLength: 255 }
                body: { type: string, maxLength: 20000 }
                pdf: { type: string, format: binary, description: "The invoice PDF (application/pdf, ≤20 MiB)." }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] } } }
        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
        "422":
          description: Validation failed, or the SMTP send failed (no internals leaked).
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, enum: [send_failed] } } }
        "429": { description: Rate limit exceeded (Retry-After header). }
        "501":
          description: Invoice mail is not configured/enabled for this user.
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, enum: [not_configured] } } }

