  /finance/receipts:
    post:
      tags: [Finance]
      operationId: financeStandaloneReceiptStore
      summary: Upload a standalone receipt ("Fremdbeleg") without a bank transaction
      description: >
        Files a receipt document that is NOT tied to a bank booking (documentation
        that must be kept even with no imported statement). Multipart; the file is
        stored plaintext on the files disk (blob_path/size/sig server-set). An
        optional bank_transaction_id links it to a booking. If a client-computed
        sig (sha256 of the file) matches an already-stored receipt, no new row/blob
        is created — the existing receipt is returned with duplicate:true instead
        (200, not 201). Throttle 1200/min.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, maxLength: 500 }
                kind: { type: string, maxLength: 24 }
                category: { type: string, maxLength: 160 }
                tags: { type: array, items: { type: string, maxLength: 100 } }
                vat: { type: string, maxLength: 16 }
                amount: { type: number, format: double }
                currency: { type: string, maxLength: 8, description: "Uppercased server-side." }
                date: { type: string, format: date }
                order_ref: { type: string, maxLength: 64 }
                doc_number: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 2000 }
                ocr: { type: string, maxLength: 200000 }
                sig: { type: string, maxLength: 128, description: "Client-computed content-dedup signature (sha256 of the file). Omit to skip dedup." }
                partner_id: { type: integer }
                bank_transaction_id: { type: integer }
                finance_project_id: { type: integer }
      responses:
        "200": { description: "A receipt with the same sig already exists — that existing receipt is returned unchanged, no new row/blob created.", content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" }, duplicate: { type: boolean, enum: [true] } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{receipt}:
    put:
      tags: [Finance]
      operationId: financeStandaloneReceiptUpdate
      summary: Update a standalone receipt (optimistic version)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: receipt, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 500 }
                category: { type: string, nullable: true }
                tags: { type: array, items: { type: string } }
                vat: { type: string, nullable: true }
                amount: { type: number, format: double, nullable: true }
                currency: { type: string, nullable: true, description: "Uppercased server-side." }
                date: { type: string, format: date, nullable: true }
                order_ref: { type: string, nullable: true }
                doc_number: { type: string, nullable: true }
                note: { type: string, nullable: true }
                partner_id: { type: integer, nullable: true }
                bank_transaction_id: { type: integer, nullable: true, description: "Link/unlink this receipt to a single bank transaction (null unlinks). Setting this server-side clears linked_transaction_ids — the two are mutually exclusive." }
                linked_transaction_ids: { type: array, items: { type: integer }, maxItems: 8, nullable: true, description: "Split-payment link: link/unlink this receipt to SEVERAL bank transactions whose amounts sum to it (null unlinks). Setting a non-empty array server-side clears bank_transaction_id." }
                finance_project_id: { type: integer, nullable: true }
                version: { type: integer, minimum: 0 }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeStandaloneReceiptDestroy
      summary: Soft-delete a standalone receipt
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: receipt, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Trashed., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{id}/restore:
    post:
      tags: [Finance]
      operationId: financeStandaloneReceiptRestore
      summary: Restore a soft-deleted standalone receipt
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Restored., content: { application/json: { schema: { type: object, properties: { receipt: { $ref: "#/components/schemas/FinanceReceipt" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeStandaloneReceiptForce
      summary: Permanently delete a standalone receipt (removes the stored file)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipts/{receipt}/raw:
    get:
      tags: [Finance]
      operationId: financeStandaloneReceiptRaw
      summary: Stream a standalone receipt file (sandboxed)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: receipt, in: path, required: true, schema: { type: integer } }
        - { name: download, in: query, required: false, schema: { type: boolean } }
      responses:
        "200": { description: Receipt bytes., content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/data:
    get:
      tags: [Gallery]
      operationId: galleryData
      summary: Photos for the current user (by capture date, newest first, keyset-paginated)
      description: "Ordered by COALESCE(taken_at, created_at) DESC, id DESC. Keyset (cursor) pagination: pass `limit` (default 200, max 500) and `cursor` (the previous response's `next_cursor`). `next_cursor` is null when exhausted. With no `cursor`/`limit` a client still gets a usable first page (the default limit) — the old un-paged 'everything at once' response is gone because it timed out on large libraries. `cursor_ym` jumps the first page to a month (scrubber). album_id/person_id/archived filters compose with pagination. Rendition readiness (thumb/preview) is read from the DB (worker-set) — the timeline never stats storage."
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 }, description: "Page size (clamped to 1..500)." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "Opaque keyset cursor from the previous response's next_cursor." }
        - { name: cursor_ym, in: query, required: false, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }, description: "Jump the first page to this YYYY-MM month (date scrubber). Ignored if a cursor is given." }
        - { name: album_id, in: query, required: false, schema: { type: integer } }
        - { name: person_id, in: query, required: false, schema: { type: integer }, description: "Filter to photos containing a visible face of this person." }
        - { name: archived, in: query, required: false, schema: { type: boolean }, description: "1 = only archived photos (Archive view); default hides archived from the timeline. Ignored when album_id/person_id is set." }
      responses:
        "200": { description: "One page of photos (without bytes) plus the next cursor.", content: { application/json: { schema: { type: object, required: [photos], properties: { photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } }, next_cursor: { type: [string, "null"], description: "Pass as ?cursor= for the next page; null when the timeline is exhausted." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /gallery/dates:
    get:
      tags: [Gallery]
      operationId: galleryDates
      summary: Month histogram for the date scrubber
      description: "One bucket per month (YYYY-MM) with a photo count, newest-first, honouring the same album_id/person_id/archived filters as /gallery/data. Lets the scrubber show the full date range and jump into the right page (via ?cursor_ym=) without loading every row."
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: album_id, in: query, required: false, schema: { type: integer } }
        - { name: person_id, in: query, required: false, schema: { type: integer } }
        - { name: archived, in: query, required: false, schema: { type: boolean } }
      responses:
        "200": { description: "Month buckets, newest-first.", content: { application/json: { schema: { type: object, required: [months], properties: { months: { type: array, items: { type: object, required: [ym, count], properties: { ym: { type: string, example: "2026-08" }, count: { type: integer } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /gallery/memories:
    get:
      tags: [Gallery]
      operationId: galleryMemories
      summary: Memories / auto-curation (on-this-day, trips, CLIP themes)
      description: "on_this_day = photos taken on today's month/day in past years; trips = auto-detected multi-day photo clusters; themes = CLIP theme cards (empty unless ML + pgvector). Archived/trashed excluded."
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Memories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  on_this_day: { type: array, items: { type: object, properties: { year: { type: integer }, years_ago: { type: integer }, photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } }
                  trips: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string }, place: { type: [string, "null"] }, cover: { type: [integer, "null"] }, count: { type: integer }, photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } }
                  themes: { type: array, items: { type: object, properties: { key: { type: string }, cover: { type: [integer, "null"] }, count: { type: integer }, photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /gallery/search:
    get:
      tags: [Gallery]
      operationId: gallerySearch
      summary: Semantic photo search (CLIP)
      description: "Embeds the query into CLIP space and returns the nearest photos by cosine distance (pgvector). Requires the ML sidecar + pgvector; otherwise returns an empty list and the client falls back to a name filter."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: q, in: query, required: true, schema: { type: string } } ]
      responses:
        "200": { description: "Matching photos (nearest first; empty when ML is off).", content: { application/json: { schema: { type: object, properties: { photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/duplicates:
    get:
      tags: [Gallery]
      operationId: galleryDuplicates
      summary: Near-duplicate photo groups (CLIP embedding cosine)
      description: "Groups of visually near-identical photos (bursts, re-saves, crops) by CLIP-embedding cosine distance — exact byte duplicates are already blocked at upload. Requires the ML sidecar + pgvector; otherwise returns empty."
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Duplicate groups (each with ≥2 photos; the first is the suggested keep).", content: { application/json: { schema: { type: object, properties: { groups: { type: array, items: { type: object, properties: { photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/people:
    get:
      tags: [Gallery]
      operationId: galleryPeople
      summary: Face-recognition people (auto-grouped face clusters)
      description: "People whose faces were detected + greedily grouped by face-embedding cosine similarity on the worker. Named clusters first, then by visible-face count. Requires face ML (ML_FACE_ENABLED) + the ML sidecar + pgvector; otherwise empty. Biometric data — owner-scoped, opt-in."
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "People with ≥1 visible face.", content: { application/json: { schema: { type: object, properties: { people: { type: array, items: { $ref: "#/components/schemas/GalleryPerson" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /gallery/people/merge:
    post:
      tags: [Gallery]
      operationId: galleryPeopleMerge
      summary: Merge two people
      description: "Reassign every face of from_id to into_id and delete from_id. If into_id is unnamed and from_id was named, the name is inherited."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from_id, into_id], properties: { from_id: { type: integer }, into_id: { type: integer } } } } } }
      responses:
        "200": { description: "Merged.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/people/{person}:
    get:
      tags: [Gallery]
      operationId: galleryPersonPhotos
      summary: Photos of a person
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: person, in: path, required: true, schema: { type: integer } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc }, description: "Sort the person's photos by capture date." }
      responses:
        "200": { description: "The person's photos.", content: { application/json: { schema: { type: object, properties: { person: { $ref: "#/components/schemas/GalleryPerson" }, photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Gallery]
      operationId: galleryPersonUpdate
      summary: Update a person (name, contact link, cover face)
      description: "Rename (name, null clears it), link to an address-book contact (contact_id — sets the name from the contact when no explicit name is given; null unlinks), and set the cover face (cover_face_id must belong to the person)."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: person, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: [string, "null"], maxLength: 191 }, contact_id: { type: [string, "null"] }, cover_face_id: { type: [integer, "null"] } } } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { $ref: "#/components/schemas/GalleryPerson" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Gallery]
      operationId: galleryPersonDestroy
      summary: Delete a person (its faces are unassigned, not deleted)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: person, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/{photo}/faces:
    get:
      tags: [Gallery]
      operationId: galleryPhotoFaces
      summary: Detected faces in a photo (with their person)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Faces (normalised boxes) for the photo.", content: { application/json: { schema: { type: object, properties: { faces: { type: array, items: { $ref: "#/components/schemas/GalleryFace" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/faces/{face}/crop:
    get:
      tags: [Gallery]
      operationId: galleryFaceCrop
      summary: Face crop thumbnail (sandboxed JPEG)
      description: "The square face crop, served immutably with default-src 'none'; sandbox + nosniff. Owner-scoped."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: face, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "JPEG crop.", content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/faces/{face}/assign:
    post:
      tags: [Gallery]
      operationId: galleryFaceAssign
      summary: Move a face to a person (by id, contact, or new name)
      description: "Assign the face to an existing person (person_id), a person linked to an address-book contact (contact_id — reuses the linked person or creates one), or a new named person (name)."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: face, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { person_id: { type: integer }, contact_id: { type: string }, name: { type: string, maxLength: 191 } } } } } }
      responses:
        "200": { description: "Assigned.", content: { application/json: { schema: { $ref: "#/components/schemas/GalleryFace" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/faces/{face}/hide:
    post:
      tags: [Gallery]
      operationId: galleryFaceHide
      summary: Hide a face (false positive / not a person)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: face, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Hidden.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/contacts/{contact}/photos:
    get:
      tags: [Gallery]
      operationId: galleryContactPhotos
      summary: Photos of the person(s) linked to a contact
      description: "Gallery photos containing a face grouped under a person linked to this address-book contact (see personUpdate contact_id). Empty when no person is linked. Owner-scoped."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: contact, in: path, required: true, schema: { type: string }, description: "Contact UUID." } ]
      responses:
        "200": { description: "The contact's photos.", content: { application/json: { schema: { type: object, properties: { photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/reprocess:
    post:
      tags: [Gallery]
      operationId: galleryReprocess
      summary: Re-queue ML processing over all photos
      description: "Re-queue face detection + grouping and/or CLIP embeddings for every photo (processed on the worker one at a time). Use after enabling ML, changing models, or to improve recognition."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { scope: { type: string, enum: [faces, embeddings, exif, all], default: all } } } } } }
      responses:
        "200": { description: "Queued.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, queued: { type: integer }, scope: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/ml-status:
    get:
      tags: [Gallery]
      operationId: galleryMlStatus
      summary: Gallery & ML status (feature flags, worker queue depth, counts)
      description: "Non-secret aggregates for the gallery settings page: ML feature flags + models, pending worker-job count (driver-agnostic), and library counts (photos/videos/embedded/dated/located/faces/people)."
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: "Status."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ml:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      face_enabled: { type: boolean }
                      vector: { type: boolean }
                      clip_model: { type: [string, "null"] }
                      face_model: { type: [string, "null"] }
                  queue: { type: object, properties: { pending: { type: integer } } }
                  counts:
                    type: object
                    properties:
                      photos: { type: integer }
                      videos: { type: integer }
                      embedded: { type: integer }
                      with_date: { type: integer }
                      located: { type: integer }
                      faces: { type: integer }
                      people: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /gallery/trash:
    get:
      tags: [Gallery]
      operationId: galleryTrash
      summary: Soft-deleted photos
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Trashed photos.", content: { application/json: { schema: { type: object, properties: { photos: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /gallery:
    post:
      tags: [Gallery]
      operationId: galleryUpload
      summary: Upload a photo or video (whole; multipart)
      description: "Images (jpg/jpeg/png/webp/gif/heic/heif) OR videos (any format — detected by MIME/extension). Bytes stored plaintext under gallery/{uuid}; size/sha256 server-computed. A video is stored with media_type=video, status=processing, and processed on the worker (ffprobe + poster + a web-friendly MP4 rendition when needed) — the client shows a gray 'processing' tile until ready. An Android/Samsung Motion Photo (JPEG with an appended MP4) has its clip extracted (motion=true). De-duplicated by sha256: identical bytes return 200 with the existing photo and duplicate=true (no new row). 413 when over the combined files+gallery quota."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { photo: { $ref: "#/components/schemas/GalleryPhoto" } } } } } }
        "200": { description: "Duplicate — existing photo returned.", content: { application/json: { schema: { type: object, properties: { photo: { $ref: "#/components/schemas/GalleryPhoto" }, duplicate: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: "Over storage quota (error=quota)." }
        "415": { description: "Not an image." }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /gallery/{photo}/play:
    get:
      tags: [Gallery]
      operationId: galleryPlay
      summary: Stream a video for playback (web MP4 rendition or original)
      description: "Serves the web-friendly MP4 rendition when one was produced, else the original. Range requests are honored (seeking). sandbox CSP + nosniff."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "video bytes (Range supported)." }
        "206": { description: "Partial content (Range)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/{photo}/motion:
    get:
      tags: [Gallery]
      operationId: galleryMotion
      summary: Stream a Live Photo's motion clip (sandboxed, best-effort)
      description: "The clip is stored as received (no transcode; ffmpeg is not in the image), so a QuickTime .MOV plays in Safari but may not in every browser."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "video/mp4 clip (nosniff + sandbox CSP)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Gallery]
      operationId: galleryAttachMotion
      summary: Attach a Live Photo motion clip (.MOV/.MP4) to a still
      description: "Merges the pair into ONE entry: the client resolves the matching still (by base name / already in the library) and posts the clip here. Video-only; quota-counted; replaces any prior clip."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        "200": { description: Attached., content: { application/json: { schema: { type: object, properties: { photo: { $ref: "#/components/schemas/GalleryPhoto" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "Over storage quota (error=quota)." }
        "415": { description: "Not a video." }
        "422": { $ref: "#/components/responses/ValidationError" }
  /gallery/chunk/init:
    post:
      tags: [Gallery]
      operationId: galleryChunkInit
      summary: Begin a chunked upload
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, size], properties: { name: { type: string }, size: { type: integer, minimum: 0 } } } } } }
      responses:
        "201": { description: "Session opened.", content: { application/json: { schema: { type: object, properties: { id: { type: string }, partSize: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: "Over storage quota (error=quota)." }
        "422": { $ref: "#/components/responses/ValidationError" }
  /gallery/chunk/part:
    post:
      tags: [Gallery]
      operationId: galleryChunkPart
      summary: Upload one chunk part (multipart)
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [id, index, file], properties: { id: { type: string }, index: { type: integer, minimum: 0 }, file: { type: string, format: binary } } } } } }
      responses:
        "200": { description: "Part stored.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, index: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "Over storage quota (error=quota)." }
        "422": { $ref: "#/components/responses/ValidationError" }
  /gallery/chunk/complete:
    post:
      tags: [Gallery]
      operationId: galleryChunkComplete
      summary: Assemble chunk parts into a photo
      description: "The assembled MIME is sniffed from bytes; non-image content is rejected (415)."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { photo: { $ref: "#/components/schemas/GalleryPhoto" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "Over storage quota (error=quota)." }
        "415": { description: "Not an image." }
  /gallery/chunk/abort:
    post:
      tags: [Gallery]
      operationId: galleryChunkAbort
      summary: Discard a chunked upload session
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
      responses:
        "200": { description: Aborted., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /gallery/{photo}/raw:
    get:
      tags: [Gallery]
      operationId: galleryRaw
      summary: Original bytes (sandboxed, immutable)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Original image bytes (Content-Disposition inline, sandbox CSP, ETag)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/{photo}/thumb:
    get:
      tags: [Gallery]
      operationId: galleryThumb
      summary: Square 400px WebP thumbnail (cache-only, sandboxed)
      description: "Serves the cached WebP only — never decodes inline (a HEIC decode is ~20s; inline generation would stampede the pool). On a cache miss it re-queues generation and returns 404; the client shows a spinner (photo.thumb=false) and reloads when ready."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "image/webp thumbnail (nosniff + sandbox CSP)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not an image, or thumbnail not generated yet (generation re-queued)." }
  /gallery/{photo}/preview:
    get:
      tags: [Gallery]
      operationId: galleryPreview
      summary: Browser-viewable full-size WebP preview (cache-only, sandboxed)
      description: "The lightbox image. The original may be HEIC/HEIF, which browsers cannot render in an <img>; this is a decoded, orientation-baked WebP (max 2048px), produced alongside the thumbnail. Cache-only; a miss re-queues generation and 404s (photo.preview=false)."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "image/webp preview (nosniff + sandbox CSP)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not ready yet (generation re-queued)." }
  /gallery/{photo}/exif:
    get:
      tags: [Gallery]
      operationId: galleryExif
      summary: Full section-grouped EXIF for the lightbox info sidebar
      description: "All readable EXIF for one photo, grouped by section (IFD0/EXIF/GPS/COMPUTED/…); values sanitized to short printable strings. Populated at upload (and by the `exif`/`all` reprocess scope — HEIC via Imagick fallback). Owner-scoped (404 for others). Not included in the list endpoint (fetched lazily on open)."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Photo overview + grouped EXIF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  mime: { type: [string, "null"] }
                  size: { type: integer }
                  width: { type: [integer, "null"] }
                  height: { type: [integer, "null"] }
                  taken_at: { type: [string, "null"], format: date-time }
                  camera: { type: [string, "null"] }
                  place: { type: [string, "null"] }
                  lat: { type: [number, "null"] }
                  lng: { type: [number, "null"] }
                  exif:
                    type: object
                    additionalProperties: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/shares:
    get:
      tags: [GallerySharing]
      operationId: galleryShares
      summary: List the current user's gallery shares (public links + internal grants)
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Owner's shares.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public: { type: array, items: { $ref: '#/components/schemas/GalleryPublicShare' } }
                  internal: { type: array, items: { $ref: '#/components/schemas/GalleryInternalShare' } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /gallery/shares/public:
    post:
      tags: [GallerySharing]
      operationId: galleryShareCreatePublic
      summary: Create a public album link (optional password/expiry, download gate)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [album_id]
              properties:
                album_id: { type: integer }
                allow_download: { type: boolean }
                password: { type: [string, "null"], minLength: 4 }
                expires_at: { type: [string, "null"], format: date-time }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/GalleryPublicShare' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /gallery/shares/public/{share}:
    put:
      tags: [GallerySharing]
      operationId: galleryShareUpdatePublic
      summary: Update a public album link (download/password/expiry)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_download: { type: boolean }
                password: { type: [string, "null"], minLength: 4 }
                clear_password: { type: boolean }
                expires_at: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/GalleryPublicShare' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [GallerySharing]
      operationId: galleryShareDeletePublic
      summary: Revoke a public album link
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/shares/internal:
    post:
      tags: [GallerySharing]
      operationId: galleryShareInternal
      summary: Share an album (or the whole gallery) with a registered user (viewer/editor)
      description: "Recipient resolved by exact email. album_id null = whole gallery. role=editor (album shares only) makes it a collaborative album — the recipient may contribute photos. Unified 422 for unknown user AND self-share (no enumeration)."
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                album_id: { type: [integer, "null"] }
                role: { type: string, enum: [viewer, editor], description: "editor is honored only for a specific album; a whole-gallery share is always viewer." }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, id: { type: integer } } } } } }
        "200": { description: Already shared (idempotent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Unknown recipient or self-share. }
  /gallery/shares/internal/{share}:
    delete:
      tags: [GallerySharing]
      operationId: galleryShareDeleteInternal
      summary: Revoke an internal share
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: share, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/{photo}/comments:
    get:
      tags: [Gallery]
      operationId: galleryComments
      summary: Comments + reaction summary for a photo (owner or share recipient)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Comments., content: { application/json: { schema: { type: object, properties: { comments: { type: array, items: { type: object, properties: { id: { type: integer }, body: { type: string }, author: { type: [string,"null"] }, mine: { type: boolean }, created_at: { type: string } } } }, reactions: { type: object, additionalProperties: { type: integer } }, my_reaction: { type: [string,"null"] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Gallery]
      operationId: galleryCommentStore
      summary: Add a comment to a photo
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } } }
      responses:
        "201": { description: Added., content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/comments/{comment}:
    delete:
      tags: [Gallery]
      operationId: galleryCommentDestroy
      summary: Delete a comment (author, or photo owner)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: comment, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/{photo}/react:
    post:
      tags: [Gallery]
      operationId: galleryReact
      summary: Set/toggle/clear the caller's single emoji reaction
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: photo, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { emoji: { type: [string,"null"], description: "Empty/same emoji clears the reaction." } } } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, my_reaction: { type: [string,"null"] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/upload-links:
    post:
      tags: [GallerySharing]
      operationId: galleryUploadLinkStore
      summary: Create a public guest-upload link for an album
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [album_id], properties: { album_id: { type: integer }, label: { type: [string,"null"] }, password: { type: [string,"null"] }, expires_at: { type: [string,"null"] } } } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: integer }, token: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery/upload-links/{link}:
    delete:
      tags: [GallerySharing]
      operationId: galleryUploadLinkDestroy
      summary: Revoke a guest-upload link
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: link, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery-upload/{token}:
    get:
      tags: [GallerySharing]
      operationId: publicGalleryUploadMeta
      summary: "Public: guest-upload link metadata (unauthenticated)"
      parameters: [ { name: token, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: "Meta. When the link is password-gated, label and album are null until the password is proven on upload — the token alone must not reveal the album.", content: { application/json: { schema: { type: object, properties: { label: { type: [string,"null"] }, album: { type: [string,"null"] }, needs_password: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [GallerySharing]
      operationId: publicGalleryUploadStore
      summary: "Public: contribute a photo to an album via a guest link (write-only)"
      description: "The token is the credential; optional password gates it. The photo lands under the album OWNER and counts against the owner quota. 403 wrong password, 413 over quota, 415 unsupported."
      parameters: [ { name: token, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, password: { type: string } } } } } }
      responses:
        "201": { description: Contributed. }
        "403": { description: Wrong password. }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Over the owner quota. }
        "415": { description: Unsupported media type. }
  /gallery/shared-with-me:
    get:
      tags: [GallerySharing]
      operationId: gallerySharedWithMe
      summary: Gallery shares granted TO the current user
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Shares with me.
          content:
            application/json:
              schema: { type: object, properties: { shares: { type: array, items: { $ref: '#/components/schemas/GallerySharedWithMe' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /gallery/shared-with-me/{share}:
