  /bookmarks/{bookmark}:
    put:
      tags: [Bookmarks]
      operationId: bookmarksUpdate
      summary: Update a bookmark
      description: >
        Optimistic concurrency: if `version` is sent and does not match the current
        server version, the update is rejected (409). Owner-scoped.
      security:
        - bearerAuth: []
      parameters:
        - name: bookmark
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
