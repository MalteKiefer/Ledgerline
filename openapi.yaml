        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 0 }, recipient: { type: [string, "null"], format: email }, change_reason: { type: [string, "null"], maxLength: 1000 } } } } } }
      responses:
        "200": { description: "Existing idempotent result replayed.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Quote' } } } }
        "202": { description: "Immutable revision delivery queued.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Quote' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version, idempotency, or workflow conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2QuoteConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2QuoteUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance-v2/quotes/{quote}/accept:
