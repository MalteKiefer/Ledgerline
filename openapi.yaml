openapi: 3.1.0
info:
  title: Ledgerline API
  version: 1.560.1
  license:
    name: Proprietary
  description: >
    Plaintext-relational personal cloud API for the Ledgerline mobile client.

    **Architecture:** every module is a relational table exposed over per-record
    REST (soft-delete trash + optimistic-concurrency `version`). ALL user content is
    plaintext at rest since v1.516.0 — confidentiality at rest is an infrastructure
    concern (LUKS full-disk encryption + encrypted backups). Only OPERATIONAL SECRETS
    (SMTP / backup / Paperless credentials, backup passphrases) remain encrypted at
    rest via the Laravel `encrypted` cast (APP_KEY) and are never serialised into any
    response. The client sends and receives plaintext over TLS. Binary files (invoice
    PDFs, receipts) are stored as plaintext bytes and streamed by id. (The former
    zero-knowledge / vault / sealed-store model was fully removed in the v1.5xx pivot.)

    **Authentication:** obtain a Sanctum bearer token via the device pairing
    exchange (QR code scan + owner approval in the web UI), then include it as
    `Authorization: Bearer <token>` on every request. All routes except the two
    pairing endpoints require the `device` Sanctum ability.

    **Web-only surfaces (intentionally no /api/v1 twin):** per-user Paperless
    CONFIGURATION (URL/token/enabled + connection test) and the workspace-admin
    settings — notification channels (mail/ntfy/webhook) edit/update/test, system
    settings + error resolution, the `max_connected_devices` security setting, and
    the self-registration toggle — are managed in the web UI only. (Backup, users,
    groups, security-log and the company profile ARE mirrored on the API.)

servers:
  - url: /api/v1
    description: Current stable API base path

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Device pairing exchange and session management
  - name: Me/Device
    description: Authenticated user info, avatar, and device heartbeat
  - name: Finance
  - name: Files
    description: >
      Plaintext-relational finance (pivot). Invoices, bank transactions, payment
      methods, business partners, cost projects and receipt categories as
      owner-scoped rows. ALL finance columns are plaintext at rest since v1.516.0
      (only operational secrets — SMTP/backup/Paperless credentials — remain
      encrypted); confidentiality at rest is an infrastructure concern (LUKS +
      encrypted backups). Amounts/dates/numbers drive stats + GoBD. Invoice numbering
      is server-authoritative (POST /finance/invoices/{invoice}/finalize, atomic
      per-year). PDF + receipt files are plaintext blobs on disk. Every mutating
      route is owner-scoped and gated by the finance module (403 when disabled); the
      per-record update routes use optimistic `version` concurrency (409 on
      conflict). OCR (POST /invoices/ocr) and the company profile (/company) sit
      alongside.
  - name: Devices
    description: Connected device listing, revocation, and remote-wipe management
  - name: Notifications
    description: In-app notification bell — list recent items, mark read
  - name: Account
    description: GDPR data export, account deletion, and session revocation
  - name: Preferences
    description: User preferences — locale and colour-scheme
  - name: Groups
    description: >
      Admin group management (requires the admin role on top of the device token).
      A group is a reusable limit template (files/gallery quota + device cap) plus a
      shareable flag; membership is many-to-many. Limits and membership are non-secret
      metadata.
  - name: Company
    description: >
      Per-user company profile and invoice defaults (the Finance module's business
      identity + numbering/appearance settings). This is the user's OWN business
      identity that prints on every invoice — non-secret, served in the clear like the
      avatar (it is the business's own identity, never customer data).
      The invoice records, payment methods and imported bank transactions themselves
      live in the relational finance tables (see the Finance tag).
  - name: Status
    description: Application availability / health check (the site-root /up up-check).
  - name: TwoFactor
    description: >
      Self-service TOTP two-factor + app-password management for a paired device
      (Sanctum bearer). Mirrors the web Fortify flow, which is browser-only.
  - name: DevicePairings
    description: >
      Owner-side device pairing: an already-paired device generates a code, polls
      it, and approves/rejects the new device's claim. Owner-scoped.
  - name: Users
    description: >
      Admin user management (requires the admin role on top of the device token —
      `can:manage-global-settings`). No credentials (password hashes, 2FA secrets)
      are ever returned. Non-admins get 403.
  - name: Backup
    description: >
      Admin backup management (admin role + device token). Credential hygiene is
      enforced: destination `config` (cloud credentials) and job `passphrase` are
      NEVER present in any response. A database job with encrypt=false is refused
      (422) — a DB dump contains all data (plaintext) plus the encrypted operational
      secrets, and must never leave the box unencrypted.
  - name: SecurityLog
    description: >
      Admin, read-only, metadata-only audit trail (admin role + device token). Rows
      never contain tokens/keys/ciphertext.
  - name: SecurityPortal
    description: >
      Admin security portal (admin role + device token): verbose HTTP request log
      with CSV/JSON export, IP block-list CRUD, per-user block toggle, and a
      cross-user session/device overview.
  - name: Paperless
    description: >
      Per-user Paperless-ngx integration: cached term quick-picks, live term
      creation, cache sync, and document forwarding. `POST /paperless/documents` is
      a transient-cleartext boundary (like POST /invoices/ocr): the client posts the
      raw document bytes, the server forwards them to the user's own Paperless
      instance and stores/logs nothing. Per-user Paperless CONFIGURATION (URL / token
      / enabled flag) is managed via GET/PUT /paperless/config + POST
      /paperless/config/test; the API token is never returned (has_token bool).
  - name: Settings
    description: >
      Admin workspace settings (requires the admin role on top of the device token —
      `can:manage-global-settings`): outgoing notifications (SMTP/NTFY/webhook) with a
      test send, the paired-device cap, the Files upload/orphan-grace limits, and the
      read-only System/maintenance overview. Operative secrets (SMTP password, ntfy
      token, webhook secret) are NEVER returned — a GET reports has_* booleans and a
      blank submission preserves the stored secret. Non-admins get 403.
  - name: Contacts
    description: >
      CardDAV-backed contacts module (address books + contacts + groups +
      duplicate detection), plaintext-relational. The same guard-agnostic
      controllers back the web routes; these `/api/v1` mirrors are gated by
      `module:contacts` on top of device auth. Blade-only screens
      (index/create/edit/view) are not exposed. `GET /contacts/data` returns
      `{contacts, books, groups}`; `GET /contacts/{id}` returns the full parsed
      vCard (fn, org, emails/phones/urls/addresses, note, group_ids). Owner-scope
      is enforced controller-side; avatar bytes stream from `/contacts/{id}/avatar`.
  - name: Calendar
    description: >
      CalDAV-backed calendar module (calendars + events), plaintext-relational.
      The same guard-agnostic controllers back the web routes; these `/api/v1`
      mirrors are gated by `module:calendar` on top of device auth. The Blade/SPA
      entry (index) is not exposed. `GET /calendar/data` returns
      `{calendars, settings}`; `GET /calendar/events?from=&to=` returns
      recurrence-expanded occurrences; `GET /calendar/events/{id}` returns the
      full parsed VEVENT editor shape + etag. Optimistic concurrency is the
      DAV-native etag (409 on mismatch). Owner-scope is enforced controller-side.
      CalDAV itself is served over the unified `/dav` Sabre endpoint (HTTP Basic,
      not `/api/v1`) — the same surface as CardDAV, absent from this document.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >
        First-party Sanctum token with ability `device`. Obtained via the
        pairing exchange. Include as `Authorization: Bearer <token>`.

  responses:
    Unauthorized:
      description: Unauthenticated — missing, invalid, or expired bearer token.
    Forbidden:
      description: >
        Forbidden — the Sanctum token lacks the required `device` ability, the
        Finance module is disabled for this account (module:finance gate), or (on
        admin routes) the caller is not an admin (manage-global-settings).
    NotFound:
      description: Not found, or not owned by the caller (owner-scoped; existence is not leaked).
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    VersionConflict:
      description: >
        Optimistic-concurrency conflict — the stored `version` no longer matches the
        `version` sent. Re-fetch the row, merge, and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VersionConflict" }
    RateLimited:
      description: Too many requests — the route's per-minute rate limit was exceeded.

  schemas:
    ValidationError:
      type: object
      description: >
        Laravel validation-failure body (HTTP 422). `errors` maps each failed field
        to its messages.
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    VersionConflict:
      type: object
      description: >
        Optimistic-concurrency conflict body. `version` is the current stored
        version the client should rebase onto.
      required: [error, version]
      properties:
        error: { type: string, enum: [version_conflict] }
        version: { type: integer }
    FinanceError:
      type: object
      description: "Business-rule rejection body: a machine-readable `error` code (HTTP 422)."
      required: [error]
      properties:
        error: { type: string }
    FinanceReceipt:
      type: object
      description: >
        A receipt entry embedded in a bank transaction's `receipts[]`. File receipts
        are created only via POST /finance/transactions/{transaction}/receipts;
        `blob_path` is the SERVER-owned on-disk path (never accepted from the client).
        Fileless entries (invoice links / Eigenbeleg metadata) may be added via the
        transaction PUT.
      required: [id, name, kind, tags, locked, trashed]
      properties:
        id: { type: string, description: "UUID assigned server-side." }
        blob_path: { type: [string, "null"], description: "Server-owned storage path under invoices/ (read-only; response only)." }
        name: { type: string }
        mime: { type: [string, "null"] }
        kind: { type: string, example: receipt, description: "e.g. receipt | invoice | eigenbeleg." }
        category: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        contactId: { type: [string, "null"] }
        partnerId: { type: [integer, "null"] }
        vat: { type: [string, "null"] }
        locked: { type: boolean, description: "A locked receipt (e.g. an auto-linked invoice) cannot be deleted." }
        trashed: { type: boolean }

    WebDavAccess:
      type: object
      description: >
        WebDAV mount access status. The password is stored hashed and never returned.
      required: [enabled, username, url]
      properties:
        enabled: { type: boolean, description: "Whether an app-specific WebDAV password is set." }
        username: { type: string, description: "The username to authenticate with (the account email)." }
        url: { type: string, format: uri, description: "The WebDAV mount URL (…/dav/)." }

    PaperlessConfig:
      type: object
      description: >
        Per-user Paperless connection config. The API token is never returned;
        `has_token` reports whether one is stored.
      required: [paperless_enabled, paperless_url, has_token, counts]
      properties:
        paperless_enabled: { type: boolean }
        paperless_url: { type: [string, "null"], format: uri }
        has_token: { type: boolean }
        counts:
          type: object
          required: [tag, document_type, correspondent]
          properties:
            tag: { type: integer }
            document_type: { type: integer }
            correspondent: { type: integer }

    NotificationConfig:
      type: object
      description: >
        Workspace notification config with secrets masked. Secret values
        (smtp_password / ntfy_token / webhook_secret) are represented only by
        has_* booleans and are never returned.
      required:
        [mail_enabled, has_smtp_password, ntfy_enabled, has_ntfy_token, webhook_enabled, has_webhook_secret]
      properties:
        mail_enabled: { type: boolean }
        smtp_host: { type: [string, "null"] }
        smtp_port: { type: [integer, "null"] }
        smtp_encryption: { type: [string, "null"], enum: [tls, ssl, null] }
        smtp_username: { type: [string, "null"] }
        smtp_from_address: { type: [string, "null"], format: email }
        smtp_from_name: { type: [string, "null"] }
        has_smtp_password: { type: boolean }
        ntfy_enabled: { type: boolean }
        ntfy_url: { type: [string, "null"], format: uri }
        ntfy_topic: { type: [string, "null"] }
        has_ntfy_token: { type: boolean }
        webhook_enabled: { type: boolean }
        webhook_url: { type: [string, "null"], format: uri }
        has_webhook_secret: { type: boolean }
    NotificationConfigWrite:
      type: object
      description: >
        Notification config update. Only submitted fields are persisted. Secret
        fields (smtp_password/ntfy_token/webhook_secret) preserve the stored value
        when omitted or blank.
      properties:
        mail_enabled: { type: boolean }
        smtp_host: { type: [string, "null"], maxLength: 255 }
        smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        smtp_encryption: { type: [string, "null"], enum: [tls, ssl, null] }
        smtp_username: { type: [string, "null"], maxLength: 255 }
        smtp_password: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }
        smtp_from_address: { type: [string, "null"], format: email, maxLength: 255 }
        smtp_from_name: { type: [string, "null"], maxLength: 255 }
        ntfy_enabled: { type: boolean }
        ntfy_url: { type: [string, "null"], format: uri, maxLength: 255 }
        ntfy_topic: { type: [string, "null"], maxLength: 255 }
        ntfy_token: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }
        webhook_enabled: { type: boolean }
        webhook_url: { type: [string, "null"], format: uri, maxLength: 255 }
        webhook_secret: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored secret." }

    FilesLimits:
      type: object
      description: "Workspace Files limits (admin override, or the config default)."
      required: [files_max_upload_mb, files_blob_orphan_grace_hours]
      properties:
        files_max_upload_mb: { type: integer }
        files_blob_orphan_grace_hours: { type: integer }

    SystemOverview:
      type: object
      description: "Read-only operational overview (metadata only — no secrets)."
      required: [tasks, status, trend, errors, audit]
      properties:
        tasks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              expression: { type: string }
              lastAt: { type: [string, "null"] }
              lastOk: { type: [boolean, "null"] }
        status:
          type: object
          description: "SystemStatus snapshot (version/queue/storage/errors/backup/scheduler/disk)."
          additionalProperties: true
        trend:
          type: object
          description: "Storage trend over ~30 days ({points, deltaBytes, deltaDays})."
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              level: { type: [string, "null"] }
              exception: { type: [string, "null"] }
              message: { type: [string, "null"] }
              file: { type: [string, "null"] }
              line: { type: [integer, "null"] }
              count: { type: integer }
              first_seen_at: { type: [string, "null"] }
              last_seen_at: { type: [string, "null"] }
              resolved_at: { type: [string, "null"] }
        audit:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              action: { type: string }
              actor: { type: [string, "null"] }
              ip: { type: [string, "null"] }
              meta: { type: [object, "null"], additionalProperties: true }
              created_at: { type: [string, "null"] }

    CompanyProfile:
      type: object
      description: >
        Per-user company profile + invoice defaults (the business identity that prints
        on invoices). Non-secret. All fields are optional; on PUT, only the fields sent
        are updated. `has_logo` is read-only (response only).
      properties:
        company_name: { type: [string, "null"], maxLength: 200 }
        company_address: { type: [string, "null"], maxLength: 1000 }
        company_email: { type: [string, "null"], format: email, maxLength: 200 }
        company_phone: { type: [string, "null"], maxLength: 100 }
        company_tax_id: { type: [string, "null"], maxLength: 100 }
        company_vat_id: { type: [string, "null"], maxLength: 100 }
        company_iban: { type: [string, "null"], maxLength: 60 }
        company_bic: { type: [string, "null"], maxLength: 20 }
        company_bank_name: { type: [string, "null"], maxLength: 200 }
        invoice_number_format: { type: [string, "null"], maxLength: 40, description: "e.g. YYYY-NNNN. Locked client-side once the current year has invoices (GoBD)." }
        invoice_next_number: { type: [integer, "null"], minimum: 1, maximum: 100000000, description: "Numbering floor; the actual next number is derived per year from the invoices." }
        invoice_default_vat_rate: { type: [number, "null"], minimum: 0, maximum: 100 }
        small_business: { type: boolean, description: "§19 Kleinunternehmer — when true, invoices show no VAT and the VAT return reports zero output VAT." }
        invoice_payment_terms_days: { type: [integer, "null"], minimum: 0, maximum: 365 }
        invoice_footer_text: { type: [string, "null"], maxLength: 2000 }
        invoice_accent_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_heading_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        invoice_template: { type: [string, "null"], enum: [editorial, modern, elegant, klassisch, schlicht] }
        invoice_payment_methods: { type: [string, "null"], maxLength: 500 }
        invoice_payment_terms_text: { type: [string, "null"], maxLength: 1000 }
        company_website: { type: [string, "null"], maxLength: 255 }
        company_contacts: { type: array, maxItems: 20, items: { type: object, properties: { name: { type: [string, "null"] }, role: { type: [string, "null"] }, email: { type: [string, "null"] }, phone: { type: [string, "null"] } } } }
        invoice_font: { type: [string, "null"], maxLength: 80 }
        invoice_vat_ist: { type: boolean, description: "Ist-Versteuerung (cash-basis VAT) toggle." }
        has_logo: { type: boolean, readOnly: true, description: "Whether a company logo is stored (GET /company/logo)." }

    Calendar:
      type: object
      description: A CalDAV calendar collection, owner-scoped.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        uri: { type: string }
        color: { type: [string, "null"], description: "#RRGGBB or #RRGGBBAA (Apple CALENDAR-COLOR)." }
        kind: { type: string, enum: [normal, holidays, school_holidays, birthdays], description: "normal = editable; holidays/school_holidays/birthdays = generated + read-only." }
        country: { type: [string, "null"], description: "ISO 3166-1 alpha-2 (holiday kinds), remembered for regenerate. e.g. DE." }
        subdivision: { type: [string, "null"], description: "OpenHolidays subdivision code (holiday kinds), e.g. DE-BY; null = national." }
        owned: { type: boolean }

    CalendarOccurrence:
      type: object
      description: >
        A concrete occurrence of an event within the queried [from,to] window
        (recurring masters emit one per occurrence). id/uid identify the master
        for edit; color echoes the parent calendar for rendering. Times are UTC.
      properties:
        id: { type: string, format: uuid }
        calendar: { type: string, format: uuid }
        uid: { type: string }
        summary: { type: [string, "null"] }
        location: { type: [string, "null"] }
        description: { type: [string, "null"] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        all_day: { type: boolean }
        status: { type: [string, "null"], enum: [CONFIRMED, TENTATIVE, CANCELLED, null] }
        recurring: { type: boolean }
        color: { type: [string, "null"] }

    CalendarEvent:
      type: object
      description: The full parsed VEVENT editor shape plus ids + etag.
      properties:
        id: { type: string, format: uuid }
        calendar: { type: string, format: uuid }
        uid: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        description: { type: [string, "null"] }
        location: { type: [string, "null"] }
        dtstart: { type: [string, "null"], format: date-time }
        dtend: { type: [string, "null"], format: date-time }
        all_day: { type: boolean }
        rrule: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [CONFIRMED, TENTATIVE, CANCELLED, null] }
        sequence: { type: integer }
        etag: { type: string }

    CalendarEventInput:
      type: object
      required: [dtstart]
      properties:
        calendar_id: { type: string, format: uuid, description: "Required on create." }
        summary: { type: [string, "null"], maxLength: 255 }
        description: { type: [string, "null"], maxLength: 5000 }
        location: { type: [string, "null"], maxLength: 255 }
        dtstart: { type: string, format: date-time }
        dtend: { type: [string, "null"], format: date-time, description: "after_or_equal dtstart." }
        all_day: { type: boolean }
        rrule: { type: [string, "null"], maxLength: 255, description: "iCalendar RRULE; validated by parsing." }
        status: { type: [string, "null"], enum: [CONFIRMED, TENTATIVE, CANCELLED, null] }
        etag: { type: [string, "null"], description: "Optional optimistic-concurrency token on update (409 on mismatch)." }

    CalendarSettings:
      type: object
      properties:
        default_view: { type: string, enum: [month, week, agenda] }
        week_start: { type: integer, enum: [0, 1], description: "0=Sunday, 1=Monday." }

    CalendarImportResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }

    EtagConflict:
      type: object
      description: DAV-native optimistic-concurrency conflict; re-fetch and retry.
      properties:
        error: { type: string, enum: [etag_conflict] }
        etag: { type: string, description: "The current stored etag." }

    Group:
      type: object
      description: >
        A user group: a reusable limit template plus a shareable flag. Limits are
        nullable (null = the group sets no cap for that dimension). Non-secret
        metadata.
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        max_connected_devices: { type: [integer, "null"], description: "Device cap (null = no group cap)." }
        shareable: { type: boolean, description: "Members may offer this group as a share target." }
        modules:
          type: [array, "null"]
          description: >
            Allow-list of enabled module keys for members of this group (null = all
            modules). A member's effective modules are the union across their groups
            (a group with null grants all); a per-user allow-list overrides. Enforced
            server-side and surfaced at /me as user.modules.
          items: { type: string, enum: [finance] }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              email: { type: string }

    DisplayPreferences:
      type: object
      description: >
        Global, non-secret DISPLAY preferences — measurement units + 12/24h clock.
        Presentation only; the stored data is unchanged (canonical metres/kg/°C/mg-dL). Returned in
        GET /me and set via POST /preferences; the client applies them to its own
        rendering (distances/elevations convert from canonical metres, times honour
        the clock format). Canonical storage is unchanged (metres, kg, °C, mg/dL).
      properties:
        distance: { type: string, enum: [km, mi] }
        elevation: { type: string, enum: [m, ft] }
        weight: { type: string, enum: [kg, lb] }
        temp: { type: string, enum: [c, f] }
        glucose: { type: string, enum: [mgdl, mmoll] }
        time_format: { type: string, enum: [24h, 12h] }

    MeUser:
      type: object
      description: >
        The authenticated user's profile. Returned as the `user` object by GET /me
        and by POST /auth/pair/collect (when `status: approved`). All fields are
        non-secret metadata — no credentials (password hash, 2FA secret) are included.
      required: [id, name, email, locale, groups, modules, has_avatar, preferences]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        locale:
          type: string
          description: "The user's UI locale (one of the configured languages, e.g. en, de, ru)."
        groups:
          type: array
          description: >
            Derived from the first-party role: `["admin"]` for admins, `[]` otherwise.
            The historical claim shape is kept so existing mobile clients need no
            change — there is no separate `role` field.
          items: { type: string }
        modules:
          type: array
          description: >
            The application module keys this account may use (per-user / per-group
            toggles). A native client should hide the tabs for modules NOT listed
            here; the API also enforces it — a disabled module's store endpoints
            return 403.
          items: { type: string, enum: [finance] }
        has_avatar:
          type: boolean
          description: "Whether a non-secret avatar is stored. True → fetch it via GET /api/v1/avatar (Bearer)."
        two_factor:
          type: boolean
          description: "Whether TOTP two-factor authentication is confirmed for the account."
        preferences:
          allOf:
            - $ref: "#/components/schemas/DisplayPreferences"
          description: "Non-secret display preferences (units + 12/24h clock); set via POST /api/v1/preferences."
        theme:
          type: string
          enum: [light, dark, system]
          description: "Current UI theme (set via POST /api/v1/theme)."

    OkResponse:
      type: object
      description: Acknowledgement response.
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    Invoice:
      type: object
      description: >
        Invoice (relational table invoices). All columns are plaintext at rest since
        v1.516.0 (confidentiality is an infra concern: LUKS + encrypted backups).
        customer/lines/versions are JSON columns; money + number/date drive stats +
        GoBD numbering. number/seq/year/type=credit_note/cancels_invoice_id/pdf_path/
        version/version_seq are server-managed and never mass-assigned via CRUD.
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        number: { type: [string, "null"] }
        seq: { type: [integer, "null"] }
        year: { type: [integer, "null"] }
        status: { type: string, enum: [draft, sent, paid] }
        type: { type: string, enum: [invoice, credit_note], description: "Document kind. A credit note (Storno/Gutschrift) reverses a finalized invoice and carries its own GoBD number." }
        cancels_invoice_id: { type: [integer, "null"], description: "For a credit note, the id of the invoice it cancels (server-set, never mass-assigned)." }
        issue_date: { type: [string, "null"] }
        due_date: { type: [string, "null"] }
        currency: { type: string }
        vat_rate: { type: [string, "null"] }
        gross: { type: [string, "null"] }
        net: { type: [string, "null"] }
        vat: { type: [string, "null"] }
        discount_type: { type: [string, "null"], enum: [percent, amount, null], description: "Global invoice-level discount kind (Rabatt) on the net taxable base." }
        discount_value: { type: [string, "null"], description: "Discount value: a percentage when discount_type=percent, else an absolute amount." }
        skonto_percent: { type: [string, "null"], description: "Early-payment Skonto percentage printed on the invoice." }
        skonto_days: { type: [integer, "null"], description: "Early-payment Skonto window in days from the issue date." }
        imported: { type: boolean }
        paid_at: { type: [string, "null"], format: date-time }
        sent_at: { type: [string, "null"], format: date-time, description: "When the invoice PDF was emailed to the customer." }
        reminded_at: { type: [string, "null"], format: date-time, description: "When a payment reminder (dunning) was last sent." }
        reminder_count: { type: integer, description: "Dunning level (Mahnstufe) — how many customer reminders have gone out." }
        payment_account: { type: [string, "null"] }
        partner_id: { type: [integer, "null"] }
        pdf_path: { type: [string, "null"] }
        customer: { type: [object, "null"], additionalProperties: true, description: "Denormalised customer snapshot (nullable). May carry `invoiceEmail` (dedicated Rechnungs-E-Mail, preferred over `email` when emailing/dunning) alongside name/attn/address/email/vatId/partnerId." }
        lines: { type: [array, "null"], items: { type: object, additionalProperties: true } }
        note: { type: [string, "null"] }
        versions:
          type: [array, "null"]
          description: "GoBD correction trail. Pass a version's `seq` as `version_seq` to the PDF ops to read/attach that version's own PDF."
          items:
            type: object
            properties:
              seq: { type: integer, description: "Version sequence — pass as version_seq to the PDF ops." }
              label: { type: [string, "null"] }
              pdf: { type: [string, "null"], description: "Stored blob path of this version's own PDF (read-only)." }
            additionalProperties: true
        version_seq: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinancePartner:
      type: object
      description: "Geschäftspartner (relational finance_partners). All columns plaintext at rest since v1.516.0."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        name: { type: string }
        category: { type: [string, "null"] }
        kind: { type: [string, "null"] }
        url: { type: [string, "null"] }
        logo: { type: [string, "null"] }
        note: { type: [string, "null"] }
        address: { type: [string, "null"] }
        email: { type: [string, "null"] }
        invoice_email: { type: [string, "null"], description: "Dedicated invoice email (Rechnungs-E-Mail); invoices are sent here when set, else the general email." }
        phone: { type: [string, "null"] }
        vat_id: { type: [string, "null"] }
        contacts: { type: array, items: { type: object, additionalProperties: true } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    PaymentMethod:
      type: object
      description: "Payment method (relational payment_methods; all columns plaintext since v1.516.0)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        name: { type: string }
        holder: { type: [string, "null"] }
        note: { type: [string, "null"] }
        business: { type: boolean }
        url: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        bank: { type: [string, "null"] }
        account_no: { type: [string, "null"] }
        card_number: { type: [string, "null"] }
        card_network: { type: [string, "null"] }
        card_expiry: { type: [string, "null"] }
        paypal_email: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinanceProject:
      type: object
      description: "Cost project (relational finance_projects, nestable via parent_id)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        parent_id: { type: [integer, "null"] }
        name: { type: string }
        kind: { type: string, enum: [business, private] }
        note: { type: [string, "null"] }
        expenses: { type: [array, "null"], items: { type: object, additionalProperties: true }, description: "Manual hand-entered spend rows (nullable)." }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    FinanceCategory:
      type: object
      description: "Receipt category (relational finance_categories, unique per user; no soft deletes)."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        name: { type: string }
        color: { type: [string, "null"], description: "Hex colour #RRGGBB, or null.", example: "#7066f5" }
        icon: { type: [string, "null"], description: "Monochrome icon name (heroicons-outline), or null.", example: "hashtag" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    VatReturn:
      type: object
      description: "VAT advance return (Umsatzsteuer-Voranmeldung) figures for a year."
      required: [year, net, vat, gross, count, byRate, quarters]
      properties:
        year: { type: integer }
        net: { type: number }
        vat: { type: number }
        gross: { type: number }
        count: { type: integer }
        byRate:
          type: array
          items:
            type: object
            properties: { rate: { type: number }, net: { type: number }, vat: { type: number } }
        quarters:
          type: array
          items:
            type: object
            properties: { q: { type: integer }, net: { type: number }, vat: { type: number } }

    FinanceKpis:
      type: object
      description: "Headline revenue KPIs for a year incl. year-over-year net growth."
      required: [year, net, count, avg, customers, prevNet]
      properties:
        year: { type: integer }
        net: { type: number }
        count: { type: integer }
        avg: { type: number }
        customers: { type: integer }
        prevNet: { type: number }
        growthPct: { type: [number, "null"] }

    RevenueByCustomer:
      type: object
      description: "Net/gross revenue for one customer in a year."
      properties:
        name: { type: string }
        net: { type: number }
        gross: { type: number }
        count: { type: integer }

    InvoiceAging:
      type: object
      description: >
        Aging of OPEN invoices (status='sent', not trashed) bucketed by days past
        the due date vs today: current (not yet due / no due date), 1-30, 31-60,
        60+. Read-only; each bucket carries count + gross sum + the invoice list.
      required: [buckets, openCount, openGross]
      properties:
        openCount: { type: integer }
        openGross: { type: number }
        buckets:
          type: object
          properties:
            current: { $ref: "#/components/schemas/AgingBucket" }
            "1_30": { $ref: "#/components/schemas/AgingBucket" }
            "31_60": { $ref: "#/components/schemas/AgingBucket" }
            "60_plus": { $ref: "#/components/schemas/AgingBucket" }

    AgingBucket:
      type: object
      required: [count, gross, invoices]
      properties:
        count: { type: integer }
        gross: { type: number }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              number: { type: [string, "null"] }
              customer: { type: string }
              gross: { type: number }
              due_date: { type: [string, "null"] }
              days_overdue: { type: integer }

    AccountVatSummary:
      type: object
      description: "VAT summary of one account's transactions: output/input VAT + payable, by rate."
      required: [income, expense, outputVat, inputVat, payable, privateSum, undecided]
      properties:
        income: { type: array, items: { type: object, properties: { rate: { type: string }, net: { type: number }, vat: { type: number } } } }
        expense: { type: array, items: { type: object, properties: { rate: { type: string }, net: { type: number }, vat: { type: number } } } }
        outputVat: { type: number }
        inputVat: { type: number }
        payable: { type: number }
        privateSum: { type: number }
        undecided: { type: integer }

    VatAdvanceReturn:
      type: object
      description: >
        Unified USt-Voranmeldung: output VAT (from realized invoices) minus input
        VAT / Vorsteuer (from ALL of the user's bank transactions) = payable
        (Zahllast), for a year and optional quarter. For a §19 Kleinunternehmer
        outputVat is 0 (turnover reported as net = gross) and payable = −inputVat.
      required: [year, quarter, net, outputVat, inputVat, payable, byRate, small_business]
      properties:
        year: { type: integer }
        quarter: { type: [integer, "null"], minimum: 1, maximum: 4, description: "1–4, or null for the full year." }
        net: { type: number, description: "Net turnover for the period (output side)." }
        outputVat: { type: number, description: "VAT collected on sales." }
        inputVat: { type: number, description: "Vorsteuer paid on expenses." }
        payable: { type: number, description: "outputVat − inputVat (Zahllast)." }
        byRate:
          type: array
          items:
            type: object
            properties:
              rate: { type: number }
              outputNet: { type: number }
              outputVat: { type: number }
              inputNet: { type: number }
              inputVat: { type: number }
        small_business: { type: boolean }

    EuerReport:
      type: object
      description: >
        Simplified EÜR (Einnahmenüberschussrechnung): income − expenses = profit
        for a year. Income = realized invoices by issue_date (net, or gross for a
        §19 KU) grouped by customer; expenses = that year's expense bank
        transactions (excluding private movements) + FinanceProject manual
        expenses, grouped by VAT/expense category. Not the full Anlage-EÜR form.
      required: [year, income, expenses, profit, small_business]
      properties:
        year: { type: integer }
        income:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items:
                type: object
                properties: { name: { type: string }, amount: { type: number } }
        expenses:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items:
                type: object
                properties: { name: { type: string }, amount: { type: number } }
        profit: { type: number }
        small_business: { type: boolean }

    DuplicateGroup:
      type: object
      description: "A suspected-duplicate group (read-only). `ids` are the row ids sharing `key` for `reason`."
      required: [reason, key, ids]
      properties:
        reason: { type: string }
        key: { type: string }
        ids: { type: array, items: { type: integer } }

    FinanceReceipt:
      type: object
      description: "Standalone receipt (relational finance_receipts) — a receipt document WITHOUT a bank transaction (\"Fremdbeleg\"). Bytes plaintext on the files disk; blob_path/size/sig server-owned. Optional bank_transaction_id links it to a booking."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        bank_transaction_id: { type: integer, nullable: true, description: "Optional link to a bank booking." }
        finance_project_id: { type: integer, nullable: true }
        blob_path: { type: string, description: "Server-owned storage path (files disk)." }
        name: { type: string }
        mime: { type: string, nullable: true }
        size: { type: integer }
        sig: { type: string, nullable: true, description: "Content dedup signature." }
        kind: { type: string }
        category: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        vat: { type: string, nullable: true }
        note: { type: string, nullable: true }
        partner_id: { type: integer, nullable: true }
        ocr: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
    FileFolder:
      type: object
      description: "A folder in the plaintext file tree (file_folders). Owner-scoped; parent_id forms the nested tree."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        parent_id: { type: integer, nullable: true }
        name: { type: string }
        version: { type: integer }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    FileEntry:
      type: object
      description: "A file (files table). Bytes live plaintext on the files disk at storage_path; this row holds metadata. search_text is never serialized."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        file_folder_id: { type: integer, nullable: true }
        name: { type: string }
        mime: { type: string, nullable: true }
        size: { type: integer }
        storage_path: { type: string }
        sha256: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        note: { type: string, nullable: true }
        favorite: { type: boolean }
        version: { type: integer }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    FileShare:
      type: object
      description: "A public share link (file_shares) to a file or folder subtree; optional password gate + expiry. Never serializes the password hash."
      properties:
        id: { type: integer }
        kind: { type: string, enum: [file, folder] }
        token: { type: string }
        url: { type: string }
        needs_password: { type: boolean }
        allow_download: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
    FileLabel:
      type: object
      description: "A coloured, user-defined label (file_labels). Many-to-many with files."
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        color: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    FileVersion:
      type: object
      description: "A previous revision of a file (file_versions). Bytes at storage_path; kept up to the per-user cap."
      properties:
        id: { type: integer }
        file_id: { type: integer }
        storage_path: { type: string }
        size: { type: integer }
        mime: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    FilesUsage:
      type: object
      description: "Combined storage usage (current files + version history) vs. the effective quota."
      properties:
        used: { type: integer, description: "Bytes occupied." }
        quota: { type: integer, nullable: true, description: "Byte cap, or null when unlimited." }
    BankTransaction:
      type: object
      description: "Bank-statement line (relational bank_transactions). All columns plaintext at rest since v1.516.0. Amount/date/vat_cat drive stats + VAT."
      properties:
        id: { type: integer }
        user_id: { type: integer, description: "Owner (stamped server-side; read-only)." }
        payment_method_id: { type: integer }
        date: { type: string }
        amount: { type: string }
        vat_cat: { type: [string, "null"] }
        sig: { type: [string, "null"] }
        invoice_id: { type: [integer, "null"] }
        invoice_number: { type: [string, "null"] }
        finance_project_id: { type: [integer, "null"] }
        counterparty: { type: [string, "null"] }
        counterparty_iban: { type: [string, "null"] }
        bic: { type: [string, "null"] }
        purpose: { type: [string, "null"] }
        booking_text: { type: [string, "null"] }
        eref: { type: [string, "null"] }
        receipts: { type: [array, "null"], items: { $ref: "#/components/schemas/FinanceReceipt" } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    InvoiceInput:
      type: object
      description: >
        Invoice create/update body. On create `name` defaults apply
        (status=draft, type=invoice, currency=EUR); `number` is optional (self-issued
        invoices are numbered server-side via /finalize). On update every field is
        optional (send only what changes) and `version` drives optimistic concurrency.
        Server-managed fields (seq/year/cancels_invoice_id/pdf_path/version) are never
        accepted here.
      properties:
        number: { type: [string, "null"], maxLength: 64 }
        status: { type: string, enum: [draft, sent, paid] }
        type: { type: string, enum: [invoice, credit_note] }
        issue_date: { type: [string, "null"], format: date }
        due_date: { type: [string, "null"], format: date }
        currency: { type: string, maxLength: 8 }
        vat_rate: { type: [number, "null"] }
        gross: { type: [number, "null"] }
        net: { type: [number, "null"] }
        vat: { type: [number, "null"] }
        discount_type: { type: [string, "null"], enum: [percent, amount, null] }
        discount_value: { type: [number, "null"], minimum: 0 }
        skonto_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        skonto_days: { type: [integer, "null"], minimum: 0, maximum: 3650 }
        imported: { type: boolean }
        paid_at: { type: [string, "null"], format: date }
        payment_account: { type: [string, "null"], maxLength: 200 }
        partner_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted partner." }
        customer: { type: [object, "null"], additionalProperties: true }
        lines: { type: [array, "null"], maxItems: 1000, items: { type: object, additionalProperties: true } }
        note: { type: [string, "null"], maxLength: 100000 }
        versions: { type: [array, "null"], maxItems: 1000, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: expected row version for optimistic concurrency (409 on mismatch)." }

    PartnerInput:
      type: object
      description: "Business-partner create/update body. `name` is required on create. `version` (update only) drives optimistic concurrency."
      properties:
        name: { type: string, maxLength: 300 }
        category: { type: [string, "null"], maxLength: 120 }
        kind: { type: [string, "null"], maxLength: 16 }
        url: { type: [string, "null"], maxLength: 2000 }
        logo: { type: [string, "null"], maxLength: 2000 }
        note: { type: [string, "null"], maxLength: 100000 }
        address: { type: [string, "null"], maxLength: 2000 }
        email: { type: [string, "null"], maxLength: 320 }
        invoice_email: { type: [string, "null"], format: email, maxLength: 320 }
        phone: { type: [string, "null"], maxLength: 100 }
        vat_id: { type: [string, "null"], maxLength: 64 }
        contacts: { type: [array, "null"], maxItems: 200, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    PaymentMethodInput:
      type: object
      description: "Payment-method create/update body. `type` + `name` are required on create. `version` (update only) drives optimistic concurrency."
      properties:
        type: { type: string, enum: [bank, card, paypal, cash, other] }
        name: { type: string, maxLength: 200 }
        holder: { type: [string, "null"], maxLength: 200 }
        note: { type: [string, "null"], maxLength: 20000 }
        business: { type: boolean }
        url: { type: [string, "null"], maxLength: 2000 }
        icon: { type: [string, "null"], maxLength: 200000, description: "Data-URI or URL of a small bank/brand icon." }
        iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        bank: { type: [string, "null"], maxLength: 200 }
        account_no: { type: [string, "null"], maxLength: 64 }
        card_number: { type: [string, "null"], maxLength: 40 }
        card_network: { type: [string, "null"], maxLength: 40 }
        card_expiry: { type: [string, "null"], maxLength: 16 }
        paypal_email: { type: [string, "null"], maxLength: 320 }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    ProjectInput:
      type: object
      description: "Cost-project create/update body. `name` is required on create. `version` (update only) drives optimistic concurrency."
      properties:
        name: { type: string, maxLength: 300 }
        parent_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted project." }
        kind: { type: string, enum: [business, private] }
        note: { type: [string, "null"], maxLength: 100000 }
        expenses: { type: [array, "null"], maxItems: 5000, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    CategoryInput:
      type: object
      required: [name]
      description: "Receipt-category create/update body (name/colour/icon — a full replace, not just a rename)."
      properties:
        name: { type: string, maxLength: 160, description: "Unique per user (the current category id is ignored on update)." }
        color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$", example: "#7066f5" }
        icon: { type: [string, "null"], maxLength: 40, description: "Monochrome heroicons-outline name from the fixed allowlist (FinanceController::CATEGORY_ICONS), e.g. hashtag/tag/banknotes." }

    TransactionInput:
      type: object
      description: "Bank-transaction create/update body. `payment_method_id` + `date` + `amount` are required on create. `version` (update only) drives optimistic concurrency."
      properties:
        payment_method_id: { type: integer, description: "Must be an existing, owned, non-deleted payment method." }
        date: { type: string, format: date }
        amount: { type: number }
        vat_cat: { type: [string, "null"], maxLength: 16 }
        sig: { type: [string, "null"], maxLength: 80, description: "Dedup signature." }
        invoice_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted invoice." }
        invoice_number: { type: [string, "null"], maxLength: 64 }
        finance_project_id: { type: [integer, "null"], description: "Must be an existing, owned, non-deleted project." }
        counterparty: { type: [string, "null"], maxLength: 2000 }
        counterparty_iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        purpose: { type: [string, "null"], maxLength: 4000 }
        booking_text: { type: [string, "null"], maxLength: 2000 }
        eref: { type: [string, "null"], maxLength: 200 }
        receipts:
          type: [array, "null"]
          maxItems: 200
          description: "Metadata + fileless (invoice-link/Eigenbeleg) entries only; a client-supplied blob_path is always dropped — real file receipts are created via the receipts endpoint."
          items: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 0, description: "Update only: optimistic concurrency (409 on mismatch)." }

    TransactionBulkRow:
      type: object
      required: [date, amount]
      description: "One parsed bank-statement line for POST /finance/transactions/bulk. Deduplicated by `sig`."
      properties:
        date: { type: string, format: date }
        amount: { type: number }
        sig: { type: [string, "null"], maxLength: 80 }
        vat_cat: { type: [string, "null"], maxLength: 16 }
        counterparty: { type: [string, "null"], maxLength: 2000 }
        counterparty_iban: { type: [string, "null"], maxLength: 64 }
        bic: { type: [string, "null"], maxLength: 32 }
        purpose: { type: [string, "null"], maxLength: 4000 }
        booking_text: { type: [string, "null"], maxLength: 2000 }
        eref: { type: [string, "null"], maxLength: 200 }

    UserSettings:
      type: object
      description: "Per-user non-display settings (file version cap)."
      properties:
        file_max_versions: { type: integer, minimum: 1, maximum: 200 }

    AdminUser:
      type: object
      description: "Admin view of a user. Never includes password hashes or 2FA secrets."
      required: [id, name, email, role, verified, two_factor]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        max_connected_devices: { type: [integer, "null"] }
        modules: { type: [array, "null"], items: { type: string } }
        groups: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        verified: { type: boolean }
        two_factor: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }

    AdminUserWrite:
      type: object
      description: "User create/update body. role/quotas/modules are privilege fields (never mass-assigned server-side)."
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, user] }
        password: { type: string, minLength: 12, description: "Create only (prohibited on update); omit to trigger a reset mail." }
        max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
        modules: { type: [array, "null"], items: { type: string, enum: [finance] } }
        modules_marker: { type: string, enum: ['set'], description: "Send with an (empty) modules[] to set an explicit list rather than 'no change'." }
        groups: { type: [array, "null"], items: { type: integer } }

    PaperlessTerm:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: "Paperless numeric id." }
        name: { type: string }
        color: { type: [string, "null"] }

    SecurityLogEntry:
      type: object
      description: "One append-only audit entry. Metadata only — never tokens/keys/ciphertext."
      properties:
        at: { type: [string, "null"], format: date-time }
        user_id: { type: [integer, "null"] }
        actor: { type: [string, "null"], description: "Display name at query time." }
        action: { type: string, example: device.evicted, description: "Dot-namespaced event id." }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        meta: { type: [object, "null"], additionalProperties: true }

    RequestLogEntry:
      type: object
      description: "One HTTP request-trail row (admin, metadata only)."
      required: [id, method, path, status]
      properties:
        id: { type: integer }
        time: { type: [string, "null"], format: date-time }
        ip: { type: [string, "null"] }
        method: { type: string, example: GET }
        path: { type: string, example: /api/v1/files }
        status: { type: integer, example: 200 }
        user:
          type: [object, "null"]
          properties: { id: { type: integer }, name: { type: string } }
        user_agent: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"] }

    BlockedIp:
      type: object
      description: "One entry in the IP/CIDR block-list."
      required: [id, cidr]
      properties:
        id: { type: integer }
        cidr: { type: string, example: 203.0.113.0/24 }
        reason: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }

    SessionsOverview:
      type: object
      description: "Cross-user active web sessions + device tokens (admin)."
      properties:
        web:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [web] }
              user_id: { type: integer }
              ip: { type: [string, "null"] }
              user_agent: { type: [string, "null"] }
              last_activity: { type: [string, "null"], format: date-time }
        devices:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [device] }
              user_id: { type: integer }
              name: { type: [string, "null"] }
              ip: { type: [string, "null"] }
              last_used_at: { type: [string, "null"], format: date-time }

    BackupDestinationSummary:
      type: object
      description: "Safe public shape — credentials (`config`) intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }

    BackupDestinationWrite:
      type: object
      required: [name, driver]
      description: >
        Create/update body for a backup destination. Only the keys relevant to the
        chosen `driver` are stored: s3/b2 → bucket/region/key/secret/endpoint/
        use_path_style/path; sftp → host/port/username/password/host_fingerprint/path;
        webdav → base_uri/username/password/path. On update, a blank `secret` or
        `password` keeps the stored value. Credentials are stored encrypted (config
        cast) and are NEVER returned in any response.
      properties:
        name: { type: string, maxLength: 120 }
        driver: { type: string, enum: [s3, b2, sftp, webdav] }
        bucket: { type: string, maxLength: 255, description: "s3/b2." }
        region: { type: string, maxLength: 64, description: "s3/b2." }
        key: { type: string, maxLength: 255, description: "s3/b2 access key id." }
        secret: { type: string, maxLength: 255, description: "s3/b2 secret (blank on update keeps stored)." }
        endpoint: { type: string, maxLength: 255, format: uri, description: "s3/b2 custom endpoint. SSRF-guarded (SafeUrl)." }
        use_path_style: { type: boolean, description: "s3/b2 path-style addressing." }
        host: { type: string, maxLength: 255, description: "sftp host. SSRF-guarded (SafeHost); link-local/metadata rejected (422)." }
        port: { type: integer, minimum: 1, maximum: 65535, description: "sftp port." }
        username: { type: string, maxLength: 255, description: "sftp/webdav." }
        password: { type: string, maxLength: 255, description: "sftp/webdav (blank on update keeps stored)." }
        host_fingerprint: { type: string, maxLength: 255, description: "sftp host key fingerprint." }
        base_uri: { type: string, maxLength: 255, format: uri, description: "webdav base URL. SSRF-guarded (SafeUrl); link-local/metadata rejected (422)." }
        path: { type: string, maxLength: 255, description: "Optional sub-path prefix at the destination." }

    BackupJobSummary:
      type: object
      description: "Safe public shape — `passphrase` intentionally omitted."
      properties:
        id: { type: integer }
        name: { type: string }
        source: { type: string, enum: [database, invoices, files], description: "Legacy single-source column (= sources[0])." }
        sources: { type: array, items: { type: string, enum: [database, invoices, files] }, description: "All sources this job backs up." }
        mode: { type: string, enum: [full, incremental] }
        destination_id: { type: integer }
        cron: { type: string }
        retention: { type: integer }
        keep_daily: { type: integer }
        keep_weekly: { type: integer }
        keep_monthly: { type: integer }
        encrypt: { type: boolean }
        notify_channels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"] }
        statistics: { type: object, additionalProperties: true }

    BackupJobWrite:
      type: object
      required: [name, sources, backup_destination_id, cron, keep_daily]
      description: "A job backs up one or more sources at once into a timestamped batch, in full or incremental mode, rotated with grandfather-father-son retention. Encryption is recommended (a DB dump is cleartext PII) but optional; 422 only if encrypt=true without an available passphrase. Blank passphrase keeps the stored value on update."
      properties:
        name: { type: string, maxLength: 120 }
        sources: { type: array, minItems: 1, items: { type: string, enum: [database, invoices, files] }, description: "What to back up. database = full DB dump; invoices = invoice PDFs + receipts; files = the Files module blobs." }
        source: { type: [string, "null"], enum: [database, invoices, files], description: "Legacy single-source column, kept in sync with sources[0]. Optional." }
        mode: { type: string, enum: [full, incremental], description: "incremental only re-uploads blob sources (files/invoices) changed since the last run; the DB dump is always full." }
        backup_destination_id: { type: integer, description: "Must reference an existing backup destination." }
        cron: { type: string, maxLength: 64, description: "A valid cron expression." }
        retention: { type: [integer, "null"], minimum: 1, maximum: 9999, description: "Legacy flat retention; superseded by keep_daily. Kept in sync." }
        keep_daily: { type: integer, minimum: 0, maximum: 9999, description: "GFS son tier: keep the newest N batches." }
        keep_weekly: { type: [integer, "null"], minimum: 0, maximum: 9999, description: "GFS father tier: keep one batch per week for N weeks." }
        keep_monthly: { type: [integer, "null"], minimum: 0, maximum: 9999, description: "GFS grandfather tier: keep one batch per month for N months." }
        encrypt: { type: boolean }
        passphrase: { type: [string, "null"], minLength: 12, maxLength: 255, description: "Encryption passphrase. Required when encrypt=true and no env passphrase is set. Blank on update keeps stored. Never returned." }
        notify_channels: { type: array, items: { type: string, enum: [desktop, mail, ntfy, webhook] } }
        enabled: { type: boolean }

    BackupRunSummary:
      type: object
      description: "A recent backup run (the exact shape returned by GET /backup/runs)."
      properties:
        id: { type: integer }
        job: { type: [string, "null"], description: "Job name, or null if the job was deleted." }
        status: { type: string, description: "e.g. running | success | failed | cancelled." }
        message: { type: [string, "null"] }
        log: { type: [string, "null"] }
        startedIso: { type: [string, "null"], format: date-time }
        startedHuman: { type: [string, "null"], description: "Relative start time (e.g. '3 hours ago')." }
        size: { type: [string, "null"], description: "Human-readable total batch size (e.g. '4.2 MB'), or null." }
        archives:
          type: array
          description: "One entry per source backed up in this run's batch. Each is downloadable/verifiable/decryptable/restorable individually via ?source=<source>."
          items:
            type: object
            properties:
              source: { type: string, enum: [database, invoices, files] }
              encrypted: { type: boolean, description: "The archive is a .enc — verify/decrypt need the passphrase." }
              restorable: { type: boolean, description: "Blob sources (files/invoices) can be restored in-place; the database cannot (use artisan backup:restore-db)." }
        cancellable: { type: boolean }
        cancelling: { type: boolean, description: "A graceful cancel has been requested and is pending." }
        verifyStatus: { type: [string, "null"] }
        verifyMessage: { type: [string, "null"] }
        verifiedHuman: { type: [string, "null"], description: "Relative time of the last verification." }

paths:

  /auth/login:
    post:
      tags: [Auth]
      operationId: spaLogin
      summary: Browser login (email+password+optional 2FA) to a bearer token
      description: >
        Backend-agnostic login: validates credentials (and TOTP/recovery code
        when 2FA is confirmed) and returns a device-scoped Sanctum bearer token.
        On a 2FA-required account with no/invalid code, returns 422 with
        {two_factor: true}. Native clients that send `install_id` (+ device_name/
        app_version/os_version) are registered as a real device — same as QR
        pairing — so they appear under "Connected devices" (revoke/wipe/heartbeat)
        and re-login on the same install_id replaces the previous device row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                code: { type: [string, "null"] }
                recovery_code: { type: [string, "null"] }
                device_name: { type: [string, "null"], description: "Device label (native) or 'web' default." }
                install_id: { type: [string, "null"], description: "Stable app install id — presence marks a native device; enables device registration + dedup." }
                app_version: { type: [string, "null"] }
                os_version: { type: [string, "null"] }
      responses:
        "200":
          description: Token + user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "422":
          description: Invalid credentials, or {two_factor:true} when a 2FA code is required.
  /auth/logout:
    post:
      tags: [Auth]
      operationId: spaLogout
      summary: Revoke the current bearer token
      responses:
        "200": { description: OK. }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------------------
  # Contacts module (module:contacts + device auth). Mirrors the web routes.
  # --------------------------------------------------------------------------
  /contacts/data:
    get:
      tags: [Contacts]
      operationId: contactsData
      summary: List contacts + address books + groups
      parameters:
        - { name: book_id, in: query, required: false, schema: { type: string } }
        - { name: group_id, in: query, required: false, schema: { type: integer } }
        - { name: favorites, in: query, required: false, schema: { type: boolean } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Contacts snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts: { type: array, items: { type: object } }
                  books: { type: array, items: { type: object } }
                  groups: { type: array, items: { type: object } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /contacts:
    post:
      tags: [Contacts]
      operationId: contactsStore
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [book_id], properties: { book_id: { type: string }, fn: { type: string }, first_name: { type: string }, last_name: { type: string }, org: { type: string }, emails: { type: array, items: { type: object } }, phones: { type: array, items: { type: object } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/{contact}:
    get:
      tags: [Contacts]
      operationId: contactsShow
      summary: Full parsed vCard detail
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Contact detail (parsed vCard + id/book/group_ids)., content: { application/json: { schema: { type: object } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Contacts]
      operationId: contactsUpdate
      summary: Update a contact
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Contacts]
      operationId: contactsDestroy
      summary: Delete a contact
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /contacts/{contact}/favorite:
    patch:
      tags: [Contacts]
      operationId: contactsFavorite
      summary: Toggle the favorite star
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [favorite], properties: { favorite: { type: boolean } } } } } }
      responses:
        "200": { description: OK. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /contacts/{contact}/avatar:
    get:
      tags: [Contacts]
      operationId: contactsAvatar
      summary: Stream the contact avatar (sandboxed)
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Image bytes., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Contacts]
      operationId: contactsAvatarUpload
      summary: Upload/replace the contact avatar
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { avatar: { type: string, format: binary } } } } } }
      responses:
        "200": { description: Stored. }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/bulk-destroy:
    delete:
      tags: [Contacts]
      operationId: contactsBulkDestroy
      summary: Delete multiple contacts
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /contacts/import:
    post:
      tags: [Contacts]
      operationId: contactsImport
      summary: Import a VCF file
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary }, book_id: { type: string } } } } } }
      responses:
        "200": { description: Import summary. }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contacts/export:
    get:
      tags: [Contacts]
      operationId: contactsExport
      summary: Export contacts as VCF
      responses:
        "200": { description: VCF file., content: { text/vcard: { schema: { type: string } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /contacts/suggest:
    get:
      tags: [Contacts]
      operationId: contactsSuggest
      summary: Autocomplete suggestions
      parameters: [{ name: q, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Suggestions. }
  /contacts/{contact}/geo:
    get:
      tags: [Contacts]
      operationId: contactsGeo
      summary: Geocode a contact address for the map preview
      parameters: [{ name: contact, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Coordinates., content: { application/json: { schema: { type: object, properties: { lat: { type: number }, lng: { type: number } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
  /contacts/settings:
    post:
      tags: [Contacts]
      operationId: contactsSettings
      summary: Update contacts view settings (sort/display)
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Saved. }
  /contacts/duplicates/data:
    get:
      tags: [Contacts]
      operationId: contactsDuplicatesData
      summary: Duplicate candidate groups
      responses:
        "200": { description: Duplicate groups. }
  /contacts/duplicates/merge:
    post:
      tags: [Contacts]
      operationId: contactsDuplicatesMerge
      summary: Merge a duplicate set
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Merged. }
  /contacts/duplicates/dismiss:
    post:
      tags: [Contacts]
      operationId: contactsDuplicatesDismiss
      summary: Dismiss a duplicate suggestion
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Dismissed. }
  /address-books:
    post:
      tags: [Contacts]
      operationId: addressBooksStore
      summary: Create an address book
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        "201": { description: Created. }
        "422": { $ref: '#/components/responses/ValidationError' }
  /address-books/{addressBook}:
    put:
      tags: [Contacts]
      operationId: addressBooksUpdate
      summary: Rename an address book
      parameters: [{ name: addressBook, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses:
        "200": { description: Updated. }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contacts]
      operationId: addressBooksDestroy
      summary: Delete an address book
      parameters: [{ name: addressBook, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "404": { $ref: '#/components/responses/NotFound' }
  /contact-groups:
    post:
      tags: [Contacts]
      operationId: contactGroupsStore
      summary: Create a contact group
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        "201": { description: Created. }
        "422": { $ref: '#/components/responses/ValidationError' }
  /contact-groups/{group}:
    delete:
      tags: [Contacts]
      operationId: contactGroupsDestroy
      summary: Delete a contact group
      parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Deleted. }
        "404": { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------------------
  # Calendar (CalDAV-backed, module:calendar)
  # --------------------------------------------------------------------------

  /calendar/data:
    get:
      tags: [Calendar]
      operationId: calendarData
      summary: List calendars + view settings
      responses:
        "200":
          description: Calendar snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendars: { type: array, items: { $ref: '#/components/schemas/Calendar' } }
                  settings: { $ref: '#/components/schemas/CalendarSettings' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /calendar/holiday-countries:
    get:
      tags: [Calendar]
      operationId: calendarHolidayCountries
      summary: OpenHolidays country list (proxied + cached) for the special-calendar dialog
      description: >
        Server-proxied OpenHolidays `/Countries` (SSRF-guarded, cached ~1 day) so
        the SPA can populate the country select under CSP connect-src 'self'. Names
        are in the current UI language. An upstream failure degrades to an empty list.
      responses:
        "200":
          description: Country list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        isoCode: { type: string, description: "ISO 3166-1 alpha-2, e.g. DE." }
                        name: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/holiday-subdivisions:
    get:
      tags: [Calendar]
      operationId: calendarHolidaySubdivisions
      summary: OpenHolidays subdivisions (regions / Bundesländer) for a country
      description: >
        Server-proxied OpenHolidays `/Subdivisions?countryIsoCode=..` (SSRF-guarded,
        cached ~1 day). German Bundesländer come back as DE-BW, DE-BY, … An upstream
        failure degrades to an empty list.
      parameters:
        - { name: country, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z-]{2,8}$' }, description: "ISO 3166-1 alpha-2, e.g. DE." }
      responses:
        "200":
          description: Subdivision list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subdivisions:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, description: "OpenHolidays subdivision code, e.g. DE-BY." }
                        name: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/events:
    get:
      tags: [Calendar]
      operationId: calendarEvents
      summary: Recurrence-expanded occurrences in a date range
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: calendar, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Occurrences overlapping [from,to].
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/CalendarOccurrence' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Calendar]
      operationId: calendarEventsStore
      summary: Create an event
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEventInput' } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/events/{event}:
    get:
      tags: [Calendar]
      operationId: calendarEventsShow
      summary: Full parsed VEVENT detail
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Event detail., content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEvent' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Calendar]
      operationId: calendarEventsUpdate
      summary: Update an event (etag optimistic concurrency)
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEventInput' } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, etag: { type: string } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Etag conflict., content: { application/json: { schema: { $ref: '#/components/schemas/EtagConflict' } } } }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Calendar]
      operationId: calendarEventsDestroy
      summary: Delete an event
      parameters: [{ name: event, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/import:
    post:
      tags: [Calendar]
      operationId: calendarImport
      summary: Import an ICS file (dedupe by UID)
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary }, calendar_id: { type: string } } } } } }
      responses:
        "200": { description: Import summary., content: { application/json: { schema: { $ref: '#/components/schemas/CalendarImportResult' } } } }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendar/export:
    get:
      tags: [Calendar]
      operationId: calendarExport
      summary: Export events as one ICS
      parameters: [{ name: calendar, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: ICS file., content: { text/calendar: { schema: { type: string } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /calendar/settings:
    post:
      tags: [Calendar]
      operationId: calendarSettings
      summary: Update calendar view settings (default view / week start)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSettings' } } } }
      responses:
        "200": { description: Saved. }
        "422": { $ref: '#/components/responses/ValidationError' }
  /calendars:
    post:
      tags: [Calendar]
      operationId: calendarsStore
      summary: Create a calendar
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, color: { type: string } } } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "422": { $ref: '#/components/responses/ValidationError' }
  /calendars/{calendar}:
    put:
      tags: [Calendar]
      operationId: calendarsUpdate
      summary: Update a calendar (name/color/description/timezone)
      parameters: [{ name: calendar, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, color: { type: string }, description: { type: string }, timezone: { type: string } } } } } }
      responses:
        "200": { description: Updated. }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Calendar]
      operationId: calendarsDestroy
      summary: Delete a calendar (422 on the last one)
      parameters: [{ name: calendar, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { description: Cannot delete the last calendar. }
  /calendars/special:
    post:
      tags: [Calendar]
      operationId: calendarsStoreSpecial
      summary: Create a special (generated, read-only) calendar and populate it
      description: >
        Creates a calendar of kind `holidays` (public holidays for a country +
        optional region), `school_holidays` (Ferien, multi-day ranges) or
        `birthdays` (from the owner's contacts) and generates its events. The
        holiday kinds pull from the OpenHolidays API for the given `country`
        (default DE) + optional `subdivision`, falling back to locally-computed
        German national holidays if the API is unreachable and the calendar is DE
        with no subdivision. `country`/`subdivision` are ignored for `birthdays`
        and are persisted so a later regenerate re-queries the same region. Events
        are server-generated and not user-editable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                name: { type: [string, "null"], maxLength: 255, description: "Optional; the SPA sends a predefined name. If omitted/empty the server derives a default from kind (+ country/subdivision)." }
                color: { type: [string, "null"], maxLength: 9 }
                kind: { type: string, enum: [holidays, school_holidays, birthdays] }
                country: { type: [string, "null"], description: "ISO 3166-1 alpha-2 (holiday kinds). Default DE.", pattern: '^[A-Za-z-]{2,8}$' }
                subdivision: { type: [string, "null"], description: "OpenHolidays subdivision code (holiday kinds), e.g. DE-BY; omit for national.", pattern: '^[A-Za-z0-9-]{2,16}$' }
      responses:
        "201": { description: Created + populated., content: { application/json: { schema: { type: object, properties: { id: { type: string }, created: { type: integer, description: "Number of events generated." } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /calendars/{calendar}/regenerate:
    post:
      tags: [Calendar]
      operationId: calendarsRegenerate
      summary: Rebuild a special calendar's generated events from the current source
      parameters: [{ name: calendar, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Regenerated., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, created: { type: integer } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { description: Not a special calendar. }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Health check (app up-check) — NOT under /api/v1; served at the site root.
  # --------------------------------------------------------------------------

  /up:
    servers:
      - url: /
        description: Site root (this endpoint lives above the /api/v1 base path).
    get:
      tags: [Status]
      operationId: healthUp
      summary: Application health check (up-check)
      description: >
        Laravel's framework health endpoint at the site ROOT (`/up`, not
        `/api/v1/up`). Unauthenticated, unthrottled. Returns HTTP 200 while the
        application booted cleanly (runs the framework health checks) and a 500
        otherwise. Apps poll it to confirm the server is reachable and healthy
        before/independently of API calls. The body is a small HTML page — clients
        should treat the STATUS CODE as the signal, not the body.
      security: []
      responses:
        "200":
          description: Application is up and healthy.
          content:
            text/html:
              schema:
                type: string
        "429":
          description: Too Many Requests — a fronting reverse proxy may throttle excessive polling.
        "500":
          description: Application is unhealthy (a health check threw).

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------

  /auth/pair:
    post:
      tags: [Auth]
      operationId: authPair
      summary: Claim a pairing code (public)
      description: >
        The mobile app scans a QR code from the user's web profile and claims the
        one-time code here. Moves the pairing to pending-approval status. No bearer
        token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_name]
              properties:
                code:
                  type: string
                  description: One-time pairing code from the QR.
                device_name:
                  type: string
                  maxLength: 60
                  description: Human-readable device name shown in the web UI.
      responses:
        "200":
          description: Code claimed; waiting for owner approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
        "410":
          description: Code not found, expired, or in the wrong state (Gone).
        "422":
          description: Validation error (missing/invalid fields).
        "429":
          description: Rate limit exceeded.

  /auth/pair/collect:
    post:
      tags: [Auth]
      operationId: authCollect
      summary: Poll for pairing approval (public)
      description: >
        Poll with the same code. Returns `status: pending` until the owner approves
        the device in the web UI, then returns the Sanctum bearer token exactly once.
        No bearer token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The same one-time pairing code.
                install_id:
                  type: string
                  maxLength: 64
                  description: >
                    Optional device-local random id (NOT a secret) that lets the
                    server audit trail be correlated with the client's own
                    diagnostic log. Stored on the token; echoed in device audit meta.
                app_version:
                  type: string
                  maxLength: 32
                  description: Optional client app version reported at pairing (non-secret).
                os_version:
                  type: string
                  maxLength: 32
                  description: Optional client OS version reported at pairing (non-secret).
      responses:
        "200":
          description: Pending or approved.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [pending]
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [approved]
                      token:
                        type: string
                        description: Sanctum bearer token for subsequent API calls.
                      user:
                        $ref: "#/components/schemas/MeUser"
        "410":
          description: Code not found, expired, rejected, or already consumed (Gone).
        "429":
          description: Rate limit exceeded.

  /auth/session:
    delete:
      tags: [Auth]
      operationId: authDestroy
      summary: Revoke the current bearer token
      description: >
        Deletes the Sanctum token authenticating this request (logout / remote wipe
        acknowledgement). Throttle: none (uses general API throttle).
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Me / Device
  # --------------------------------------------------------------------------

  /me:
    get:
      tags: [Me/Device]
      operationId: meShow
      summary: Authenticated user info
      description: >
        Returns the authenticated user's profile and a `wipe` flag that signals the
        owner has requested a remote wipe of this token. No throttle beyond the
        default API rate.
      responses:
        "200":
          description: User payload.
          content:
            application/json:
              schema:
                type: object
                required: [user, wipe]
                properties:
                  user:
                    $ref: "#/components/schemas/MeUser"
                  wipe:
                    type: boolean
                    description: >
                      Kill switch. If true, the owner has requested a remote wipe of
                      this token — the client should erase its local data and log out.
        "401":
          description: Unauthenticated.

  /avatar:
    get:
      tags: [Me/Device]
      operationId: avatarShow
      summary: Stream the authenticated user's avatar
      description: >
        Streams the user's stored avatar image (a non-secret profile image).
        Returns 404 if no avatar is stored. Throttle: 120 req/min.
      responses:
        "200":
          description: Avatar image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated.
        "404":
          description: No avatar stored.
        "429":
          description: Rate limit exceeded.
    post:
      tags: [Me/Device]
      operationId: avatarStore
      summary: Upload / replace the authenticated user's avatar
      description: >
        Uploads an avatar image (multipart, field `avatar`; jpeg/png/webp/gif,
        max 10 MiB). Re-encoded server-side to a square 512×512 JPEG (metadata
        stripped); the previous avatar is deleted. Non-secret profile image.
        Throttle 30/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  has_avatar: { type: boolean }
        "422": { description: Not a valid image / too large. }
        "429": { description: Rate limit exceeded. }
    delete:
      tags: [Me/Device]
      operationId: avatarDestroy
      summary: Remove the authenticated user's avatar
      description: Deletes the stored avatar. Throttle 30/min.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  has_avatar: { type: boolean }
        "429": { description: Rate limit exceeded. }

  /device/heartbeat:
    post:
      tags: [Me/Device]
      operationId: deviceHeartbeat
      summary: Record device sync activity
      description: >
        CLI/background clients call this to record whether they are currently syncing.
        Returns the remote-wipe flag so any heartbeat also delivers the kill switch.
        Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [idle, syncing]
                  description: Current sync state of the client.
                detail:
                  type: [string, "null"]
                  maxLength: 160
                  description: Optional human-readable detail string shown in the devices list.
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [wipe]
                properties:
                  wipe:
                    type: boolean
                    description: >
                      If true the owner has requested a remote wipe of this token.
                      The client should erase its local data and log out.
        "422":
          description: Validation error (state not in allowed enum).
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Site-icon proxy (bank logos / partner favicons for the Finance module)
  # --------------------------------------------------------------------------

  /passwords/icon:
    get:
      tags: [Company]
      operationId: passwordsIcon
      summary: Fetch favicon/BIMI for a domain
      description: >
        Returns a data URI (base64-encoded image) for the best available icon for
        the given domain (favicon → BIMI). The fetch goes through the server's SSRF
        guard; the result is returned as a data URI. The domain is not persisted.
        Throttle: 1200 req/min.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          description: Domain to look up (e.g. "github.com").
      responses:
        "200":
          description: Icon data URI or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  icon:
                    type: [string, "null"]
                    description: Data URI (e.g. "data:image/png;base64,...") or null if none found.
        "429":
          description: Rate limit exceeded.
  # --------------------------------------------------------------------------
  # Devices
  # --------------------------------------------------------------------------

  /devices:
    get:
      tags: [Devices]
      operationId: devicesIndex
      summary: List the caller's connected devices
      description: >
        Returns all Sanctum tokens (connected devices) for the authenticated user,
        most-recently-used first. Includes live sync state, last-used time, the app/OS
        build + a short install id (non-secret client correlation), and whether a
        remote wipe has been requested. No per-route throttle beyond default.
      responses:
        "200":
          description: List of connected devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Sanctum token ID.
                        current:
                          type: boolean
                          description: >
                            True for the token making this request, so a client can
                            refuse to revoke or wipe itself. Always false for
                            session-auth (web) callers.
                        name:
                          type: string
                          description: Human-readable device name.
                        meta:
                          type: string
                          description: >
                            Formatted string combining IP address and last-used time
                            (e.g. "192.168.1.1 · last used 3 hours ago").
                        version:
                          type: [string, "null"]
                          description: Non-secret app/OS build (e.g. "iOS 18.2 · 1.5.0"), when reported.
                        installId:
                          type: [string, "null"]
                          description: >
                            Last 6 chars of the device's non-secret install id — helps the
                            owner distinguish devices. Re-pairing the same install id
                            supersedes the previous token (device.superseded) rather than
                            stacking a duplicate row.
                        syncing:
                          type: boolean
                          description: >
                            True when the device reported syncing state within the last
                            3 minutes.
                        syncDetail:
                          type: [string, "null"]
                          description: Short detail string from the last heartbeat (syncing only).
                        syncSeen:
                          type: [string, "null"]
                          description: Human-readable time since the last heartbeat was received.
                        wipeRequested:
                          type: boolean
                          description: True when the owner has flagged this device for remote wipe.
        "401":
          description: Unauthenticated.

  /devices/{token}:
    delete:
      tags: [Devices]
      operationId: devicesRevoke
      summary: Revoke a paired device
      description: >
        Deletes the Sanctum token for the given device, immediately revoking its
        access. Owner-scoped (can only revoke own tokens). Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to revoke.
      responses:
        "200":
          description: Device revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /devices/{token}/wipe:
    post:
      tags: [Devices]
      operationId: devicesWipe
      summary: Request a remote wipe for a device
      description: >
        Flags the device's Sanctum token with a wipe request. The token remains
        valid so the device can fetch the flag on its next heartbeat and self-erase.
        Owner-scoped. Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to wipe.
      responses:
        "200":
          description: Wipe flag set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Notifications
  # --------------------------------------------------------------------------

  /notifications:
    get:
      tags: [Notifications]
      operationId: notificationsIndex
      summary: List recent notifications
      description: >
        Returns up to 30 recent in-app notifications for the authenticated user,
        with an unread count. Supports ETag-based conditional requests — if the
        client sends If-None-Match matching the current ETag the server returns
        304 Not Modified with no body, skipping the row fetch entirely.
        No per-route throttle beyond default.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag value from a previous response. Returns 304 if unchanged.
      responses:
        "200":
          description: Notification list with unread count.
          headers:
            ETag:
              description: >
                Opaque change-signature derived from the newest id, total count,
                latest update time, and unread count. Send back as If-None-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [unread, items]
                properties:
                  unread:
                    type: integer
                    description: Count of unread notifications.
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, level, category, title, read, at]
                      properties:
                        id:
                          type: integer
                        level:
                          type: string
                          description: Severity level (e.g. info, warning, error).
                        category:
                          type: string
                          description: Category (non-null; defaults to "general").
                        title:
                          type: string
                        body:
                          type: [string, "null"]
                        read:
                          type: boolean
                        at:
                          type: [string, "null"]
                          format: date-time
        "304":
          description: Not Modified — ETag matched, no payload.
        "401":
          description: Unauthenticated.

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      operationId: notificationsMarkRead
      summary: Mark a single notification as read
      description: >
        Sets read_at to now for the given notification. Owner-scoped (403 if the
        notification belongs to another user). No per-route throttle.
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: integer
          description: Notification ID.
      responses:
        "200":
          description: Marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Notification does not belong to the caller.
        "404":
          description: Notification not found.

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: notificationsMarkAllRead
      summary: Mark all notifications as read
      description: >
        Sets read_at to now on all unread notifications for the authenticated
        user. Idempotent. No per-route throttle.
      responses:
        "200":
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Account (GDPR export, deletion, web-session revocation)
  # --------------------------------------------------------------------------

  /account/export:
    get:
      tags: [Account]
      operationId: accountExport
      summary: GDPR data export (streamed zip)
      description: >
        Streams a zip file containing the user's data as JSON (finance data + account
        info + settings). Data only — no blob bytes. The zip is generated on the fly
        and not stored server-side. Throttle: 6 req/min.
      responses:
        "200":
          description: Zip archive streamed to the client.
          content:
            application/zip:
              schema:
                type: string
                format: binary
                description: >
                  ledgerline-export-{timestamp}.zip containing one JSON file per
                  data module.
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /account:
    delete:
      tags: [Account]
      operationId: accountDestroy
      summary: Permanently delete the account (GDPR erasure)
      description: >
        Permanently purges the account and all owned data (all rows deleted, all
        stored files removed). The presented bearer token is revoked after deletion.
        Requires the user's email as a confirmation
        string to prevent accidental deletion. No per-route throttle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: >
                    Must equal the authenticated user's email address exactly.
                    Returns 422 on mismatch.
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    example: true
        "422":
          description: Confirmation string does not match the user's email.
        "401":
          description: Unauthenticated.

  /account/sessions/{id}:
    delete:
      tags: [Account]
      operationId: accountSessionsRevoke
      summary: Revoke another active web session
      description: >
        Deletes the given web session row for the authenticated user. Cannot revoke
        the caller's own current session. Idempotent (missing or already-deleted
        session is a no-op). No per-route throttle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Session ID to revoke.
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  /account/sessions:
    get:
      tags: [Account]
      operationId: accountSessionsIndex
      summary: List active web sessions
      description: >
        The caller's active web (browser) sessions, newest first. Only populated when
        the server uses the database session driver (empty array otherwise). `current`
        flags the caller's own session and is never true on a token request. No secret
        values.
      responses:
        "200":
          description: Session list.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, ip, user_agent, last_active, current]
                      properties:
                        id: { type: string }
                        ip: { type: [string, "null"] }
                        user_agent: { type: [string, "null"] }
                        last_active: { type: integer, description: "Unix timestamp of last activity." }
                        current: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/webdav:
    get:
      tags: [Account]
      operationId: accountWebdavShow
      summary: WebDAV mount access status
      description: >
        Whether an app-specific WebDAV password is set, plus the mount URL and the
        username (the account email) to use. The password itself is stored hashed and
        is never returned.
      responses:
        "200":
          description: WebDAV access status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDavAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      operationId: accountWebdavUpdate
      summary: Set the WebDAV mount password
      description: >
        Sets the caller's app-specific WebDAV password (min 12 chars), stored hashed.
        Distinct from the login password; revocable. Throttle: 20 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webdav_password]
              properties:
                webdav_password: { type: string, minLength: 12, maxLength: 255 }
      responses:
        "200":
          description: Password set — returns the updated access status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDavAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Account]
      operationId: accountWebdavDestroy
      summary: Clear the WebDAV mount password
      description: "Removes the app-specific WebDAV password (disables WebDAV access). Throttle: 20 req/min."
      responses:
        "200":
          description: Password cleared — returns the updated access status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDavAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --------------------------------------------------------------------------
  # Preferences
  # --------------------------------------------------------------------------

  /locale:
    post:
      tags: [Preferences]
      operationId: localeUpdate
      summary: Update the UI language
      description: >
        Persists the chosen locale on the user's profile and (for web requests) in
        the session. The locale must be one of the values configured in
        config/locales.php. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  description: BCP 47 locale code (e.g. "en", "de"). Must be in the supported list.
      responses:
        "200":
          description: Locale updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, locale]
                properties:
                  ok:
                    type: boolean
                    example: true
                  locale:
                    type: string
                    description: The locale that was set.
        "422":
          description: Unsupported locale value.
        "401":
          description: Unauthenticated.

  /theme:
    post:
      tags: [Preferences]
      operationId: themeUpdate
      summary: Update the colour scheme preference
      description: >
        Persists the user's chosen colour scheme. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme:
                  type: string
                  enum: [light, dark, system]
                  description: Colour scheme preference.
      responses:
        "200":
          description: Theme updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, theme]
                properties:
                  ok:
                    type: boolean
                    example: true
                  theme:
                    type: string
                    enum: [light, dark, system]
        "422":
          description: Invalid theme value.
        "401":
          description: Unauthenticated.

  /preferences:
    post:
      tags: [Preferences]
      operationId: preferencesUpdate
      summary: Update global display preferences (units + clock format)
      description: >
        Persists the user's non-secret DISPLAY preferences — measurement units and
        12/24h clock. These are presentation choices only (the underlying data stays
        stored data is unchanged); the client applies them to its own rendering. Every field is
        optional; only the sent fields change. Mirrored in GET /me.preferences. No
        per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                distance:
                  type: string
                  enum: [km, mi]
                elevation:
                  type: string
                  enum: [m, ft]
                weight:
                  type: string
                  enum: [kg, lb]
                temp:
                  type: string
                  enum: [c, f]
                glucose:
                  type: string
                  enum: [mgdl, mmoll]
                time_format:
                  type: string
                  enum: [24h, 12h]
      responses:
        "200":
          description: Preferences updated; returns the full preference set.
          content:
            application/json:
              schema:
                type: object
                required: [ok, preferences]
                properties:
                  ok:
                    type: boolean
                    example: true
                  preferences:
                    $ref: "#/components/schemas/DisplayPreferences"
        "422":
          description: Invalid preference value.
        "401":
          description: Unauthenticated.

  /groups:
    get:
      tags: [Groups]
      operationId: groupsIndex
      summary: List all groups (admin)
      description: >
        Returns every group with its limits, shareable flag and members. Requires the
        admin role (manage-global-settings) on top of the device token.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Groups]
      operationId: groupsStore
      summary: Create a group (admin)
      description: "Throttle: 60 req/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [finance] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
                  description: User ids to set as members.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /groups/{group}:
    put:
      tags: [Groups]
      operationId: groupsUpdate
      summary: Update a group and sync its members (admin)
      description: "Members is the full set — an omitted/empty array clears membership. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [finance] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Groups]
      operationId: groupsDestroy
      summary: Delete a group (admin)
      description: "Members keep their accounts; the group's limits stop applying. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/data:
    get:
      tags: [Finance]
      operationId: financeData
      summary: All finance data (invoices, partners, payment methods, projects, categories, transactions)
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Finance snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
                  partners: { type: array, items: { $ref: "#/components/schemas/FinancePartner" } }
                  paymentMethods: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } }
                  projects: { type: array, items: { $ref: "#/components/schemas/FinanceProject" } }
                  financeCategories: { type: array, items: { $ref: "#/components/schemas/FinanceCategory" } }
                  transactions: { type: array, items: { $ref: "#/components/schemas/BankTransaction" } }
                  standaloneReceipts: { type: array, items: { $ref: "#/components/schemas/FinanceReceipt" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/reports:
    get:
      tags: [Finance]
      operationId: financeReports
      summary: Server-side VAT return + revenue statistics for a year (read-only)
      description: >
        Authoritative server-computed finance analytics (the client consumes
        these instead of computing in-browser): VAT advance return, revenue
        KPIs, revenue by customer, and monthly revenue for the requested year,
        plus the current-year VAT for the dashboard and the list of years with
        realized invoices. Read-only; never mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: Analytics for the year.
          content:
            application/json:
              schema:
                type: object
                required: [year, years, currentVat, vat, kpis, customers, months, aging]
                properties:
                  year: { type: integer }
                  years: { type: array, items: { type: integer } }
                  currentVat: { $ref: "#/components/schemas/VatReturn" }
                  vat: { $ref: "#/components/schemas/VatReturn" }
                  kpis: { $ref: "#/components/schemas/FinanceKpis" }
                  customers: { type: array, items: { $ref: "#/components/schemas/RevenueByCustomer" } }
                  months:
                    type: array
                    items:
                      type: object
                      properties: { month: { type: integer }, net: { type: number } }
                  aging: { $ref: "#/components/schemas/InvoiceAging" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/account-vat:
    get:
      tags: [Finance]
      operationId: financeAccountVat
      summary: VAT summary of one payment account's transactions for a year (read-only)
      description: >
        Summarises output VAT, input VAT (Vorsteuer) and the resulting payable for a
        single payment account's transactions in a year, broken down by rate.
        Read-only; never mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer }, description: "Payment-method (account) id." }
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: Account VAT summary (output/input VAT, payable, by rate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountVatSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/vat-advance:
    get:
      tags: [Finance]
      operationId: financeVatAdvance
      summary: Unified USt-Voranmeldung — output − input VAT = payable (read-only)
      description: >
        Server-authoritative combined VAT advance return: output VAT from realized
        invoices minus input VAT (Vorsteuer) from all of the user's bank
        transactions, for a year and optional quarter, yielding a single payable
        (Zahllast). §19 Kleinunternehmer → output VAT is zero. Read-only; never
        mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
        - { name: quarter, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 4 }, description: "Optional quarter 1–4; omit for the full year." }
      responses:
        "200":
          description: The unified VAT advance return.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatAdvanceReturn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/euer:
    get:
      tags: [Finance]
      operationId: financeEuer
      summary: Simplified EÜR — income − expenses = profit (read-only)
      description: >
        Server-computed simplified Einnahmenüberschussrechnung for a year: income
        (realized invoices) minus expenses (expense bank transactions + project
        manual expenses) = profit, grouped by category. Read-only; never mutates a
        finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: The EÜR report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EuerReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/duplicates:
    get:
      tags: [Finance]
      operationId: financeDuplicates
      summary: Suspected duplicate invoices + transactions (read-only)
      description: >
        Read-only duplicate detection. Reports suspect groups only (same
        number, or same date+amount+customer for invoices; same EREF, or same
        date+amount+counterparty+purpose for transactions) — never deletes or
        merges anything. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suspect groups.
          content:
            application/json:
              schema:
                type: object
                required: [invoices, transactions]
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/DuplicateGroup" } }
                  transactions: { type: array, items: { $ref: "#/components/schemas/DuplicateGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/category-suggestions:
    get:
      tags: [Finance]
      operationId: financeCategorySuggestions
      summary: Merchant-based category suggestions for uncategorised transactions (read-only)
      description: >
        Read-only merchant->category suggestions derived from the taught
        category on each business partner (the partner list doubles as the rule
        store). Suggests only — the client decides whether to apply; the server
        never writes a category onto a transaction. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suggestions for transactions with no category yet.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [tx_id, merchant, suggested_category]
                      properties:
                        tx_id: { type: integer }
                        merchant: { type: string }
                        suggested_category: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/trash:
    get:
      tags: [Finance]
      operationId: financeTrash
      summary: Trashed finance rows
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Trashed sets — same keys as /finance/data EXCEPT financeCategories (categories are hard-deleted, not trashable), each an array of soft-deleted rows.", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/invoices:
    post:
      tags: [Finance]
      operationId: financeInvoiceStore
      summary: Create an invoice
      description: "Create an owner-scoped invoice row. On create status/type/currency default (draft/invoice/EUR); self-issued invoices are numbered server-side later via /finalize. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceInput" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}:
    put:
      tags: [Finance]
      operationId: financeInvoiceUpdate
      summary: Update an invoice (optimistic concurrency)
      description: "Per-row update; send `version` for optimistic concurrency (409 on mismatch). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceInput" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeInvoiceDestroy
      summary: Soft-delete an invoice
      description: "Move the invoice to trash (soft delete). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{id}/restore:
    post:
      tags: [Finance]
      operationId: financeInvoiceRestore
      summary: Restore a trashed invoice
      description: "Restore a soft-deleted invoice (404 if no trashed invoice with that id is owned by the caller). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Restored., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{id}/force:
    delete:
      tags: [Finance]
      operationId: financeInvoiceForce
      summary: Permanently delete a trashed invoice
      description: "Permanently delete a trashed invoice and its stored PDF blobs. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/finalize:
    post:
      tags: [Finance]
      operationId: financeInvoiceFinalize
      summary: Assign the GoBD invoice number (atomic, per-year, idempotent)
      description: "Server-authoritative GoBD numbering: locks the year's numbered rows, takes max(seq)+1 (never below the configured floor), writes it atomically. Idempotent — an already-numbered invoice is returned unchanged. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Numbered invoice., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/email:
    post:
      tags: [Finance]
      operationId: financeInvoiceEmail
      summary: Email a finalized invoice's stored PDF to the customer
      description: >
        Sends the invoice's stored PDF (pdf_path) to the customer over the user's OWN
        company SMTP (settings.company company_smtp_*), deliberately independent of
        the workspace notification SMTP. Only finalized invoices (status sent|paid or
        already numbered) may be sent. Stamps sent_at without bumping the optimistic
        version. Throttled 10/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email, description: "Recipient email; falls back to the customer snapshot email." }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sent_at]
                properties:
                  ok: { type: boolean }
                  sent_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Business rejection with a machine-readable `error` code (one of
            not_finalized, no_pdf, no_recipient, no_smtp) — OR, for an invalid `to`
            address, the standard Laravel validation body { message, errors }.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - $ref: "#/components/schemas/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/storno:
    post:
      tags: [Finance]
      operationId: financeInvoiceStorno
      summary: Cancel a finalized invoice with a credit note (Storno / Gutschrift)
      description: >
        Creates a NEW invoice with type=credit_note, cancels_invoice_id set to the
        original, the same customer/partner, the original lines with NEGATED
        amounts and the same discount terms — so it exactly reverses the original's
        net/VAT/gross. The credit note runs the same GoBD numbering path (its own
        number). The original invoice is never edited or deleted (its cancelled
        state is derived). Only a finalized (sent|paid or numbered), non-credit-note,
        not-already-cancelled invoice can be cancelled. Throttled 30/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      responses:
        "201":
          description: The created credit note.
          content:
            application/json:
              schema:
                type: object
                required: [invoice]
                properties:
                  invoice: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Cannot cancel — `error` is one of not_finalized, already_cancelled, already_credit_note."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - properties: { error: { enum: [not_finalized, already_cancelled, already_credit_note] } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/dun:
    post:
      tags: [Finance]
      operationId: financeInvoiceDun
      summary: Send the customer a payment reminder (Mahnung) for an overdue invoice
      description: >
        Sends a dunning email (with the stored PDF attached) to the customer over
        the user's OWN company SMTP. Only overdue invoices (status=sent AND
        due_date < today) with a recipient + PDF may be dunned. Increments the
        dunning level (reminder_count) and stamps reminded_at (does not bump the
        optimistic version). Distinct from the owner-facing invoices:remind command.
        Throttled 10/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email, description: "Recipient email; falls back to the customer snapshot email." }
      responses:
        "200":
          description: Reminder sent.
          content:
            application/json:
              schema:
                type: object
                required: [ok, level, reminded_at]
                properties:
                  ok: { type: boolean }
                  level: { type: integer, description: "The new dunning level (Mahnstufe)." }
                  reminded_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Business rejection with a machine-readable `error` code (one of
            not_overdue, no_pdf, no_recipient, no_smtp) — OR, for an invalid `to`
            address, the standard Laravel validation body { message, errors }.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FinanceError"
                  - $ref: "#/components/schemas/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/invoices/{invoice}/pdf:
    post:
      tags: [Finance]
      operationId: financeInvoicePdfUpload
      summary: Attach/replace the invoice PDF (multipart)
      description: >
        Upload a PDF blob (max files.max_upload_mb). Without `version_seq` it becomes
        the invoice's current pdf_path. With `version_seq` it is attached to that
        versions[] entry's own PDF (GoBD per-version correction trail) and pdf_path is
        left untouched; if no such version exists the upload is discarded and the
        invoice is returned unchanged. Throttle 1200/min.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "PDF blob (max files.max_upload_mb)." }
                version_seq: { type: integer, minimum: 1, description: "Attach to this versions[].seq entry instead of the main pdf_path." }
      responses:
        "200": { description: Updated invoice., content: { application/json: { schema: { type: object, required: [invoice], properties: { invoice: { $ref: "#/components/schemas/Invoice" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [Finance]
      operationId: financeInvoicePdf
      summary: Stream the invoice PDF
      description: >
        Streams the invoice's PDF inline (sandboxed). With `version_seq` it streams
        that GoBD version's own stored PDF instead of the current one (404 if that
        version has no PDF). Throttle 3000/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: integer } }
        - { name: version_seq, in: query, required: false, schema: { type: integer, minimum: 1 }, description: "Stream this versions[].seq entry's own PDF instead of the current invoice PDF." }
        - { name: download, in: query, required: false, schema: { type: boolean }, description: "true → Content-Disposition: attachment; default inline." }
      responses:
        "200": { description: PDF bytes., content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
