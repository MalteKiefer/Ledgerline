      summary: Create an idempotent versioned recurring invoice template
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceTemplateInput' } } }
      responses:
        "201": { description: "Template created or idempotently replayed.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceTemplate' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Idempotency conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2RecurringUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/recurring-invoice-templates/{template}:
    get:
      tags: [Finance]
      operationId: financeV2RecurringInvoiceTemplatesShow
      summary: Read one owner-scoped recurring invoice template
      parameters:
        - { name: template, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Template.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceTemplate' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/recurring-invoice-templates/{template}/versions:
    post:
      tags: [Finance]
      operationId: financeV2RecurringInvoiceTemplateVersionsCreate
      summary: Add a later effective-dated content version using optimistic version CAS
      parameters:
        - { name: template, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceTemplateVersionInput' } } }
      responses:
        "201": { description: "Version added or idempotently replayed.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceTemplate' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version, idempotency, or effective-date conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2RecurringUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/recurring-invoice-templates/{template}/pause:
    post:
      tags: [Finance]
      operationId: financeV2RecurringInvoiceTemplatesPause
      summary: Pause a template using optimistic version CAS, preserving its next due occurrence
      parameters:
        - { name: template, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expected_version], properties: { expected_version: { type: integer, minimum: 0 } } } } } }
      responses:
        "200": { description: "Paused or idempotently replayed.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceTemplate' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version or idempotency conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2RecurringUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/recurring-invoice-templates/{template}/resume:
    post:
      tags: [Finance]
      operationId: financeV2RecurringInvoiceTemplatesResume
      summary: Resume a paused template using optimistic version CAS without skipping overdue occurrences
      parameters:
        - { name: template, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expected_version], properties: { expected_version: { type: integer, minimum: 0 } } } } } }
      responses:
        "200": { description: "Resumed or idempotently replayed.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceTemplate' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version or idempotency conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringConflict' } } } }
        "422": { $ref: "#/components/responses/FinanceV2RecurringUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/recurring-invoice-templates/{template}/runs:
    get:
      tags: [Finance]
      operationId: financeV2RecurringInvoiceTemplateRunsIndex
      summary: List one template's scheduler runs with stable pagination
      parameters:
        - { name: template, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, creating_draft, draft_created, finalizing, finalized, sending, sent, failed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: "Run page.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceRunPage' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/recurring-invoice-runs/{run}/retry:
    post:
      tags: [Finance]
      operationId: financeV2RecurringInvoiceRunsRetry
      summary: Retry a failed run from its persisted safe step, never repeating a completed step
      parameters:
        - { name: run, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: "Retry accepted; run resumes from its safe step.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2RecurringInvoiceRun' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Invalid run-state transition.", content: { application/json: { schema: { type: object, additionalProperties: false, required: [error], properties: { error: { type: string } } } } } }
        "422": { description: "Invalid run-state transition.", content: { application/json: { schema: { type: object, additionalProperties: false, required: [error], properties: { error: { type: string } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance/data:
    get:
      tags: [Finance]
      operationId: financeData
      summary: All finance data (invoices, partners, payment methods, projects, categories, transactions)
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Finance snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
                  partners: { type: array, items: { $ref: "#/components/schemas/FinancePartner" } }
                  paymentMethods: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } }
                  projects: { type: array, items: { $ref: "#/components/schemas/FinanceProject" } }
                  financeCategories: { type: array, items: { $ref: "#/components/schemas/FinanceCategory" } }
                  transactions: { type: array, items: { $ref: "#/components/schemas/BankTransaction" } }
                  standaloneReceipts: { type: array, items: { $ref: "#/components/schemas/FinanceReceipt" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/reports:
    get:
      tags: [Finance]
      operationId: financeReports
      summary: Server-side VAT return + revenue statistics for a year (read-only)
      description: >
        Authoritative server-computed finance analytics (the client consumes
        these instead of computing in-browser): VAT advance return, revenue
        KPIs, revenue by customer, and monthly revenue for the requested year,
        plus the current-year VAT for the dashboard and the list of years with
        realized invoices. Read-only; never mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: Analytics for the year.
          content:
            application/json:
              schema:
                type: object
                required: [year, years, currentVat, vat, kpis, customers, months, aging]
                properties:
                  year: { type: integer }
                  years: { type: array, items: { type: integer } }
                  currentVat: { $ref: "#/components/schemas/VatReturn" }
                  vat: { $ref: "#/components/schemas/VatReturn" }
                  kpis: { $ref: "#/components/schemas/FinanceKpis" }
                  customers: { type: array, items: { $ref: "#/components/schemas/RevenueByCustomer" } }
                  months:
                    type: array
                    items:
                      type: object
                      properties: { month: { type: integer }, net: { type: number } }
                  aging: { $ref: "#/components/schemas/InvoiceAging" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/account-vat:
    get:
      tags: [Finance]
      operationId: financeAccountVat
      summary: VAT summary of one payment account's transactions for a year (read-only)
      description: >
        Summarises output VAT, input VAT (Vorsteuer) and the resulting payable for a
        single payment account's transactions in a year, broken down by rate.
        Read-only; never mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer }, description: "Payment-method (account) id." }
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: Account VAT summary (output/input VAT, payable, by rate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountVatSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/vat-advance:
    get:
      tags: [Finance]
      operationId: financeVatAdvance
      summary: Unified USt-Voranmeldung — output − input VAT = payable (read-only)
      description: >
        Server-authoritative combined VAT advance return: output VAT from realized
        invoices minus input VAT (Vorsteuer) from all of the user's bank
        transactions, for a year and optional quarter, yielding a single payable
        (Zahllast). §19 Kleinunternehmer → output VAT is zero. Read-only; never
        mutates a finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
        - { name: quarter, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 4 }, description: "Optional quarter 1–4; omit for the full year." }
      responses:
        "200":
          description: The unified VAT advance return.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatAdvanceReturn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/reports/euer:
    get:
      tags: [Finance]
      operationId: financeEuer
      summary: Simplified EÜR — income − expenses = profit (read-only)
      description: >
        Server-computed simplified Einnahmenüberschussrechnung for a year: income
        (realized invoices) minus expenses (expense bank transactions + project
        manual expenses) = profit, grouped by category. Read-only; never mutates a
        finance row. Throttle 120/min.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: "Target year (defaults to the current year)." }
      responses:
        "200":
          description: The EÜR report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EuerReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/duplicates:
    get:
      tags: [Finance]
      operationId: financeDuplicates
      summary: Suspected duplicate invoices + transactions (read-only)
      description: >
        Read-only duplicate detection. Reports suspect groups only (same
        number, or same date+amount+customer for invoices; same EREF, or same
        date+amount+counterparty+purpose for transactions) — never deletes or
        merges anything. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suspect groups.
          content:
            application/json:
              schema:
                type: object
                required: [invoices, transactions]
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/DuplicateGroup" } }
                  transactions: { type: array, items: { $ref: "#/components/schemas/DuplicateGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/recurring:
    get:
      tags: [Finance]
      operationId: financeRecurring
      summary: Recurring charges (subscriptions, standing orders)
      description: >
        Read-only detection over the owner's expense bookings: groups them by
        normalised counterparty and reads the intervals. Reports the annualised
        cost, a price change against the previous charge, and whether the charge
        has stopped coming. Never mutates a row. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recurring: { type: array, items: { $ref: "#/components/schemas/RecurringCharge" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/number-gaps:
    get:
      tags: [Finance]
      operationId: financeNumberGaps
      summary: GoBD invoice-numbering gap report (read-only)
      description: >
        Read-only report of missing invoice numbers, grouped by numbering
        regime (YYYY-NNNN resets per year; every other format is one
        continuous ordinal sequence across all years). Reports only — never
        deletes, merges, or renumbers anything; the owner decides whether a
        gap is a still-unimported historical invoice or a real numbering
        problem. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Groups with missing numbers (empty array when the numbering is gapless).
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/NumberGapGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/receipt-matches:
    get:
      tags: [Finance]
      operationId: financeReceiptMatches
      summary: Suggested receipt<->transaction links (read-only)
      description: >
        Read-only suggestions for linking unlinked standalone receipts to
        unlinked bank transactions, in both directions. groups: one charge
        settled by SEVERAL receipts (e.g. Amazon splitting an order into
        multiple shipment invoices that are charged together) — deterministic
        and cent-exact: receipts sharing a merchant-printed payment/order
        reference are summed first, then a single exact-amount receipt, then
        a bounded subset-sum (<=4 receipts) within a date window of the
        transaction. splitPayments: the inverse — one receipt whose total was
        actually debited as SEVERAL separate charges (e.g. one INWX invoice
        billed as one document but settled by two transactions a week apart)
        — a bounded subset-sum (<=4 transactions) within a date window of the
        receipt. Accidental re-uploads of the same document are de-duplicated
        before matching and reported separately. Never mutates a row — the
        client applies an accepted `groups` entry by PUTing
        bank_transaction_id on each listed receipt, and an accepted
        `splitPayments` entry by PUTing linked_transaction_ids on the receipt
        (both via PUT /finance/receipts/{receipt}). Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suggested groups (both directions) + de-duplicated receipts (all empty arrays when there is nothing to suggest).
          content:
            application/json:
              schema:
                type: object
                required: [groups, duplicates, splitPayments]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/ReceiptMatchGroup" } }
                  duplicates: { type: array, items: { $ref: "#/components/schemas/ReceiptDuplicate" } }
                  splitPayments: { type: array, items: { $ref: "#/components/schemas/SplitPaymentGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/category-suggestions:
    get:
      tags: [Finance]
      operationId: financeCategorySuggestions
      summary: Merchant-based category suggestions for uncategorised transactions (read-only)
      description: >
        Read-only merchant->category suggestions derived from the taught
        category on each business partner (the partner list doubles as the rule
        store). Suggests only — the client decides whether to apply; the server
        never writes a category onto a transaction. Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Suggestions for transactions with no category yet.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [tx_id, merchant, suggested_category]
                      properties:
                        tx_id: { type: integer }
                        merchant: { type: string }
                        suggested_category: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/trash:
    get:
      tags: [Finance]
      operationId: financeTrash
      summary: Trashed finance rows
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Trashed sets — same keys as /finance/data EXCEPT financeCategories (hard-deleted, not trashable) and standaloneReceipts (not surfaced in trash), each an array of soft-deleted rows.", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finance/partners:
    post:
      tags: [Finance]
      operationId: financePartnerStore
      summary: Create a business partner
      description: "`name` is required. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerInput" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [partner], properties: { partner: { $ref: "#/components/schemas/FinancePartner" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners/{partner}:
    put:
      tags: [Finance]
      operationId: financePartnerUpdate
      summary: Update a partner (optimistic concurrency)
      description: "Send `version` for optimistic concurrency (409 on mismatch). Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: partner, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, required: [partner], properties: { partner: { $ref: "#/components/schemas/FinancePartner" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financePartnerDestroy
      summary: Soft-delete a partner
      description: "Move the partner to trash. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: partner, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners/{id}/restore:
    post:
      tags: [Finance]
      operationId: financePartnerRestore
      summary: Restore a partner
      description: "Restore a soft-deleted partner. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Restored.", content: { application/json: { schema: { type: object, required: [partner], properties: { partner: { $ref: "#/components/schemas/FinancePartner" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners/{id}/force:
    delete:
      tags: [Finance]
      operationId: financePartnerForce
      summary: Permanently delete a partner
      description: "Permanently delete a trashed partner. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Deleted.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/partners/{partner}/archive:
    post:
      tags: [Finance]
      operationId: financePartnerArchive
      summary: Hide a partner from the pickers without deleting it
      description: "An old customer's documents keep pointing at their partner, so the useful state is \"do not offer this any more\", not deletion. The row stays listed by `/finance/data`; the client filters on `archived_at`. Throttle 600/min."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: partner, in: path, required: true, schema: { type: integer } } ]
