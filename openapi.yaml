        "401": { description: Unauthenticated. }
        "403": { description: Module disabled for this account. }
        "422": { description: "No recipient, or the SMTP send failed." }
        "429": { description: Rate limit exceeded. }
        "501": { description: Invoice mail is not configured/enabled. }

