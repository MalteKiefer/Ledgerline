      security: [ { bearerAuth: [] } ]
      parameters: [ { name: invoice, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }, "401": { description: Unauthenticated. } }
