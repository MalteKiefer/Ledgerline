        current: { type: [object, "null"] }
        availability: { type: string, enum: [available, deleted, missing] }
        attached_at: { type: string, format: date-time }
        detached: { type: boolean }
        detached_at: { type: [string, "null"], format: date-time }

    FinanceV2HistoryItem:
      type: object
      additionalProperties: false
      required: [id, source_kind, type, visibility, body, supersedes_note_id, payload, author_id, occurred_at, series_id, revision_id]
      properties:
        id: { type: integer, minimum: 1 }
        source_kind: { type: string, enum: [project_note, document_note, project_activity, document_activity] }
        type: { type: string }
        visibility: { type: [string, "null"], enum: [internal, customer, null] }
        body: { type: [string, "null"] }
        supersedes_note_id: { type: [integer, "null"], minimum: 1 }
        subject_type: { type: [string, "null"] }
        subject_reference: { type: [string, "null"] }
        payload: { type: object, description: "Allowlisted audit payload; secrets and raw errors are scrubbed."}
        author_id: { type: [integer, "null"], minimum: 1 }
        occurred_at: { type: string, format: date-time }
        series_id: { type: [string, "null"], format: uuid }
        revision_id: { type: [integer, "null"], minimum: 1 }

    FinanceV2ProjectConflict:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, enum: [project_archived, time_invoiced, document_already_attached, document_not_attached, idempotency_key_reused, version_conflict, operation_in_progress] }
        current: { $ref: '#/components/schemas/FinanceV2Project' }

    FinanceV2ProjectDomainError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, enum: [invalid_transition, invalid_project_input] }

paths:

  /auth/login:
    post:
      tags: [Auth]
      operationId: spaLogin
      summary: Browser login (email+password+optional 2FA) to a bearer token
      security: []
      description: >
        Backend-agnostic login: validates credentials (and TOTP/recovery code
        when 2FA is confirmed) and returns a device-scoped Sanctum bearer token.
        On a 2FA-required account with no/invalid code, returns 422 with
        {two_factor: true}. Native clients that send `install_id` (+ device_name/
        app_version/os_version) are registered as a real device — same as QR
        pairing — so they appear under "Connected devices" (revoke/wipe/heartbeat)
        and re-login on the same install_id replaces the previous device row.
        The account must have a verified email before a bearer is minted — an
        unverified account returns 403 {status:"verify-email"} (v1.562.0). A
        blocked account fails with the same generic 422 as bad credentials (no
        enumeration). Throttled at 10 req/min → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                code: { type: [string, "null"] }
                recovery_code: { type: [string, "null"] }
                device_name: { type: [string, "null"], description: "Device label (native) or 'web' default." }
                install_id: { type: [string, "null"], description: "Stable app install id — presence marks a native device; enables device registration + dedup." }
                app_version: { type: [string, "null"] }
                os_version: { type: [string, "null"] }
      responses:
        "200":
          description: Token + user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "403":
          description: >
            Email not verified — no bearer is minted until the address is verified.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: verify-email } } }
        "422":
          description: >
            Invalid credentials (also returned generically for a blocked account,
            no enumeration), or {two_factor:true} when a 2FA code is required.
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: spaLogout
      summary: Revoke the current bearer token
      responses:
        "200": { description: "OK."}
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/passkey/options:
    post:
      tags: [Passkeys]
      operationId: passkeyLoginOptions
      summary: Passwordless sign-in — WebAuthn assertion options
      security: []
      description: >
        Public. Returns a one-time challenge (`options`, standard WebAuthn
        PublicKeyCredentialRequestOptionsJSON) plus an opaque `handle` that binds
        the challenge for /auth/passkey/verify. Feed `options` to
        navigator.credentials.get(). Throttled 30/min.
      responses:
        "200":
          description: Request options + handle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle: { type: string }
                  options: { type: object, additionalProperties: true }
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/passkey/verify:
    post:
      tags: [Passkeys]
      operationId: passkeyLoginVerify
      summary: Passwordless sign-in — verify assertion, mint a bearer token
      security: []
      description: >
        Public. Verifies the authenticator assertion against the cached
        challenge and mints a device-scoped Sanctum bearer token. 422
        {message:"passkey_failed"} on any invalid/expired assertion; 403
        {status:"verify-email"} for an unverified account; 403
        {message:"blocked"} for a blocked account. Throttled 30/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, credential]
              properties:
                handle: { type: string }
                credential: { type: object, additionalProperties: true, description: "Serialized PublicKeyCredential (assertion) as returned by the webauthn browser helper." }
      responses:
        "200":
          description: Token + user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "403": { description: "Email not verified or account blocked." }
        "422": { description: "Assertion invalid/expired." }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Contacts module (module:contacts + device auth). Mirrors the web routes.
  # --------------------------------------------------------------------------
  /up:
    servers:
      - url: /
        description: Site root (this endpoint lives above the /api/v1 base path).
    get:
      tags: [Status]
      operationId: healthUp
      summary: Application health check (up-check)
      description: >
        Laravel's framework health endpoint at the site ROOT (`/up`, not
        `/api/v1/up`). Unauthenticated, unthrottled. Returns HTTP 200 while the
        application booted cleanly (runs the framework health checks) and a 500
        otherwise. Apps poll it to confirm the server is reachable and healthy
        before/independently of API calls. The body is a small HTML page — clients
        should treat the STATUS CODE as the signal, not the body.
      security: []
      responses:
        "200":
          description: Application is up and healthy.
          content:
            text/html:
              schema:
                type: string
        "429":
          description: Too Many Requests — a fronting reverse proxy may throttle excessive polling.
        "500":
          description: Application is unhealthy (a health check threw).

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------

  /auth/pair:
    post:
      tags: [Auth]
      operationId: authPair
      summary: Claim a pairing code (public)
      description: >
        The mobile app scans a QR code from the user's web profile and claims the
        one-time code here. Moves the pairing to pending-approval status. No bearer
        token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_name]
              properties:
                code:
                  type: string
                  description: One-time pairing code from the QR.
                device_name:
                  type: string
                  maxLength: 60
                  description: Human-readable device name shown in the web UI.
      responses:
        "200":
          description: Code claimed; waiting for owner approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
        "410":
          description: Code not found, expired, or in the wrong state (Gone).
        "422":
          description: Validation error (missing/invalid fields).
        "429":
          description: Rate limit exceeded.

  /auth/pair/collect:
    post:
      tags: [Auth]
      operationId: authCollect
      summary: Poll for pairing approval (public)
      description: >
        Poll with the same code. Returns `status: pending` until the owner approves
        the device in the web UI, then returns the Sanctum bearer token exactly once.
        No bearer token required. Throttle: 30 req/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The same one-time pairing code.
                install_id:
                  type: string
                  maxLength: 64
                  description: >
                    Optional device-local random id (NOT a secret) that lets the
                    server audit trail be correlated with the client's own
                    diagnostic log. Stored on the token; echoed in device audit meta.
                app_version:
                  type: string
                  maxLength: 32
                  description: Optional client app version reported at pairing (non-secret).
                os_version:
                  type: string
                  maxLength: 32
                  description: Optional client OS version reported at pairing (non-secret).
      responses:
        "200":
          description: Pending or approved.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [pending]
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [approved]
                      token:
                        type: string
                        description: Sanctum bearer token for subsequent API calls.
                      user:
                        $ref: "#/components/schemas/MeUser"
        "410":
          description: Code not found, expired, rejected, or already consumed (Gone).
        "429":
          description: Rate limit exceeded.

  /auth/session:
    delete:
      tags: [Auth]
      operationId: authDestroy
      summary: Revoke the current bearer token
      description: >
        Deletes the Sanctum token authenticating this request (logout / remote wipe
        acknowledgement). Throttle: none (uses general API throttle).
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Me / Device
  # --------------------------------------------------------------------------

  /me:
    get:
      tags: [Me/Device]
      operationId: meShow
      summary: Authenticated user info
      description: >
        Returns the authenticated user's profile and a `wipe` flag that signals
        the owner has requested a remote wipe of this token. No throttle beyond
        the default API rate.
      responses:
        "200":
          description: User payload.
          content:
            application/json:
              schema:
                type: object
                required: [user, wipe]
                properties:
                  user:
                    $ref: "#/components/schemas/MeUser"
                  wipe:
                    type: boolean
                    description: >
                      Kill switch. If true, the owner has requested a remote wipe of
                      this token — the client should erase its local data and log out.
        "401":
          description: Unauthenticated.

  /avatar:
    get:
      tags: [Me/Device]
      operationId: avatarShow
      summary: Stream the authenticated user's avatar
      description: >
        Streams the user's stored avatar image (a non-secret profile image).
        Returns 404 if no avatar is stored. Throttle: 120 req/min.
      responses:
        "200":
          description: Avatar image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated.
        "404":
          description: No avatar stored.
        "429":
          description: Rate limit exceeded.
    post:
      tags: [Me/Device]
      operationId: avatarStore
      summary: Upload / replace the authenticated user's avatar
      description: >
        Uploads an avatar image (multipart, field `avatar`; jpeg/png/webp/gif,
        max 10 MiB). Re-encoded server-side to a square 512×512 JPEG (metadata
        stripped); the previous avatar is deleted. Non-secret profile image.
        Throttle 60/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  has_avatar: { type: boolean }
        "422": { description: "Not a valid image / too large."}
        "429": { description: "Rate limit exceeded."}
    delete:
      tags: [Me/Device]
      operationId: avatarDestroy
      summary: Remove the authenticated user's avatar
      description: Deletes the stored avatar. Throttle 60/min.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  has_avatar: { type: boolean }
        "429": { description: "Rate limit exceeded."}

  /device/push-endpoint:
    post:
      tags: [Me/Device]
      operationId: devicePushEndpointStore
      summary: Register the per-device UnifiedPush endpoint
      description: >
        Stores an HTTPS push endpoint (a UnifiedPush/ntfy topic URL) on the calling
        device token; SendPushJob POSTs notification payloads there. Stored encrypted.
        Validated as https + a resolvable, non-link-local/metadata host (SSRF guard).
        Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri, maxLength: 2048, description: "https URL of the push endpoint." }
      responses:
        "200": { description: "Registered.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { description: "Invalid or disallowed endpoint (not https / blocked host)." }
        "429": { description: "Rate limit exceeded."}
    delete:
      tags: [Me/Device]
      operationId: devicePushEndpointDestroy
      summary: Clear the per-device push endpoint
      description: Removes the push endpoint from the calling device token (push disabled). Throttle 60/min.
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Cleared.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { description: "Rate limit exceeded."}

  /device/heartbeat:
    post:
      tags: [Me/Device]
      operationId: deviceHeartbeat
      summary: Record device sync activity
      description: >
        CLI/background clients call this to record whether they are currently syncing.
        Returns the remote-wipe flag so any heartbeat also delivers the kill switch.
        Throttle: 120 req/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [idle, syncing]
                  description: Current sync state of the client.
                detail:
                  type: [string, "null"]
                  maxLength: 160
                  description: Optional human-readable detail string shown in the devices list.
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [wipe]
                properties:
                  wipe:
                    type: boolean
                    description: >
                      If true the owner has requested a remote wipe of this token.
                      The client should erase its local data and log out.
        "422":
          description: Validation error (state not in allowed enum).
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Site-icon proxy (bank logos / partner favicons for the Finance module)
  # --------------------------------------------------------------------------

  /passwords/icon:
    get:
      tags: [Company]
      operationId: passwordsIcon
      summary: Fetch favicon/BIMI for a domain
      description: >
        Returns a data URI (base64-encoded image) for the best available icon for
        the given domain (favicon → BIMI). The fetch goes through the server's SSRF
        guard; the result is returned as a data URI. The domain is not persisted.
        Throttle: 1200 req/min.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          description: Domain to look up (e.g. "github.com").
      responses:
        "200":
          description: Icon data URI or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  icon:
                    type: [string, "null"]
                    description: Data URI (e.g. "data:image/png;base64,...") or null if none found.
        "429":
          description: Rate limit exceeded.
  # --------------------------------------------------------------------------
  # Devices
  # --------------------------------------------------------------------------

  /devices:
    get:
      tags: [Devices]
      operationId: devicesIndex
      summary: List the caller's connected devices
      description: >
        Returns all Sanctum tokens (connected devices) for the authenticated user,
        most-recently-used first. Includes live sync state, last-used time, the app/OS
        build + a short install id (non-secret client correlation), and whether a
        remote wipe has been requested. No per-route throttle beyond default.
      responses:
        "200":
          description: List of connected devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Sanctum token ID.
                        current:
                          type: boolean
                          description: >
                            True for the token making this request, so a client can
                            refuse to revoke or wipe itself. Always false for
                            session-auth (web) callers.
                        name:
                          type: string
                          description: Human-readable device name.
                        meta:
                          type: string
                          description: >
                            Formatted string combining IP address and last-used time
                            (e.g. "192.168.1.1 · last used 3 hours ago").
                        ip:
                          type: [string, "null"]
                          description: Last-seen IP address of the device (non-secret; owner-only).
                        last_used_at:
                          type: [string, "null"]
                          format: date-time
                          description: ISO-8601 timestamp of the device's last API request.
                        created_at:
                          type: [string, "null"]
                          format: date-time
                          description: ISO-8601 timestamp when this device token was minted (connected).
                        expires_at:
                          type: [string, "null"]
                          format: date-time
                          description: ISO-8601 absolute expiry of the token (Sanctum lifetime), or null.
                        os_version:
                          type: [string, "null"]
                          description: Reported OS version (structured; also folded into `version`).
                        app_version:
                          type: [string, "null"]
                          description: Reported app build (structured; also folded into `version`).
                        abilities:
                          type: array
                          items: { type: string }
                          description: Sanctum abilities granted to this token (e.g. ["device"]).
                        version:
                          type: [string, "null"]
                          description: Non-secret app/OS build (e.g. "iOS 18.2 · 1.5.0"), when reported.
                        installId:
                          type: [string, "null"]
                          description: >
                            Last 6 chars of the device's non-secret install id — helps the
                            owner distinguish devices. Re-pairing the same install id
                            supersedes the previous token (device.superseded) rather than
                            stacking a duplicate row.
                        syncing:
                          type: boolean
                          description: >
                            True when the device reported syncing state within the last
                            3 minutes.
                        syncDetail:
                          type: [string, "null"]
                          description: Short detail string from the last heartbeat (syncing only).
                        syncSeen:
                          type: [string, "null"]
                          description: Human-readable time since the last heartbeat was received.
                        wipeRequested:
                          type: boolean
                          description: True when the owner has flagged this device for remote wipe.
                        pushHost:
                          type: [string, "null"]
                          description: >
                            Scheme+host of this device's registered push endpoint
                            (e.g. https://ntfy.sh), or null if none. The topic path is
                            never emitted (it is the push capability).
        "401":
          description: Unauthenticated.

  /devices/{token}/push:
    delete:
      tags: [Devices]
      operationId: devicesRevokePush
      summary: Clear a device's push endpoint
      description: >
        Removes the stored push endpoint from the given device token so the server
        stops POSTing notifications there. Owner-scoped. Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device whose push endpoint to clear.
      responses:
        "200":
          description: Push endpoint cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /devices/{token}:
    delete:
      tags: [Devices]
      operationId: devicesRevoke
      summary: Revoke a paired device
      description: >
        Deletes the Sanctum token for the given device, immediately revoking its
        access. Owner-scoped (can only revoke own tokens). Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to revoke.
      responses:
        "200":
          description: Device revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /devices/{token}/wipe:
    post:
      tags: [Devices]
      operationId: devicesWipe
      summary: Request a remote wipe for a device
      description: >
        Flags the device's Sanctum token with a wipe request. The token remains
        valid so the device can fetch the flag on its next heartbeat and self-erase.
        Owner-scoped. Throttle: 20 req/min.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Sanctum token ID of the device to wipe.
      responses:
        "200":
          description: Wipe flag set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  # --------------------------------------------------------------------------
  # Notifications
  # --------------------------------------------------------------------------

  /notifications:
    get:
      tags: [Notifications]
      operationId: notificationsIndex
      summary: List recent notifications
      description: >
        Returns up to 30 recent in-app notifications for the authenticated user,
        with an unread count. Supports ETag-based conditional requests — if the
        client sends If-None-Match matching the current ETag the server returns
        304 Not Modified with no body, skipping the row fetch entirely.
        No per-route throttle beyond default.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag value from a previous response. Returns 304 if unchanged.
      responses:
        "200":
          description: Notification list with unread count.
          headers:
            ETag:
              description: >
                Opaque change-signature derived from the newest id, total count,
                latest update time, and unread count. Send back as If-None-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [unread, items]
                properties:
                  unread:
                    type: integer
                    description: Count of unread notifications.
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, level, category, title, read, at]
                      properties:
                        id:
                          type: integer
                        level:
                          type: string
                          description: Severity level (e.g. info, warning, error).
                        category:
                          type: string
                          description: Category (non-null; defaults to "general").
                        title:
                          type: string
                        body:
                          type: [string, "null"]
                        read:
                          type: boolean
                        at:
                          type: [string, "null"]
                          format: date-time
        "304":
          description: Not Modified — ETag matched, no payload.
        "401":
          description: Unauthenticated.

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      operationId: notificationsMarkRead
      summary: Mark a single notification as read
      description: >
        Sets read_at to now for the given notification. Owner-scoped (403 if the
        notification belongs to another user). No per-route throttle.
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: integer
          description: Notification ID.
      responses:
        "200":
          description: Marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Notification does not belong to the caller.
        "404":
          description: Notification not found.

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: notificationsMarkAllRead
      summary: Mark all notifications as read
      description: >
        Sets read_at to now on all unread notifications for the authenticated
        user. Idempotent. No per-route throttle.
      responses:
        "200":
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  # --------------------------------------------------------------------------
  # Account (GDPR export, deletion, web-session revocation)
  # --------------------------------------------------------------------------

  /account/export:
    get:
      tags: [Account]
      operationId: accountExport
      summary: GDPR data export (streamed zip)
      description: >
        Streams a zip file containing the user's data as JSON, one file per data
        module: finance (invoices, bank transactions, receipts, payment methods,
        partners, projects), the Paperless-ngx integration settings, and the
        account/display settings. Data only — no blob bytes. The zip is generated
        on the fly and not stored server-side. Throttle: 6 req/min.
      responses:
        "200":
          description: Zip archive streamed to the client.
          content:
            application/zip:
              schema:
                type: string
                format: binary
                description: >
                  ledgerline-export-{timestamp}.zip containing one JSON file per
                  data module.
        "401":
          description: Unauthenticated.
        "429":
          description: Rate limit exceeded.

  /account:
    delete:
      tags: [Account]
      operationId: accountDestroy
      summary: Permanently delete the account (GDPR erasure)
      description: >
        Permanently purges the account and all owned data (all rows deleted, all
        stored files removed). The presented bearer token is revoked after deletion.
        Requires the user's email as a confirmation
        string to prevent accidental deletion. No per-route throttle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: >
                    Must equal the authenticated user's email address exactly.
                    Returns 422 on mismatch.
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    example: true
        "422":
          description: Confirmation string does not match the user's email.
        "401":
          description: Unauthenticated.

  /account/sessions/{id}:
    delete:
      tags: [Account]
      operationId: accountSessionsRevoke
      summary: Revoke another active web session
      description: >
        Deletes the given web session row for the authenticated user. Cannot revoke
        the caller's own current session. Idempotent (missing or already-deleted
        session is a no-op). No per-route throttle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Session ID to revoke.
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthenticated.

  /account/sessions:
    get:
      tags: [Account]
      operationId: accountSessionsIndex
      summary: List active web sessions
      description: >
        The caller's active web (browser) sessions, newest first. Only populated when
        the server uses the database session driver (empty array otherwise). `current`
        flags the caller's own session and is never true on a token request. No secret
        values.
      responses:
        "200":
          description: Session list.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, ip, user_agent, last_active, current]
                      properties:
                        id: { type: string }
                        ip: { type: [string, "null"] }
                        user_agent: { type: [string, "null"] }
                        last_active: { type: integer, description: "Unix timestamp of last activity." }
                        current: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /locale:
    post:
      tags: [Preferences]
      operationId: localeUpdate
      summary: Update the UI language
      description: >
        Persists the chosen locale on the user's profile and (for web requests) in
        the session. The locale must be one of the values configured in
        config/locales.php. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  description: BCP 47 locale code (e.g. "en", "de"). Must be in the supported list.
      responses:
        "200":
          description: Locale updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, locale]
                properties:
                  ok:
                    type: boolean
                    example: true
                  locale:
                    type: string
                    description: The locale that was set.
        "422":
          description: Unsupported locale value.
        "401":
          description: Unauthenticated.

  /theme:
    post:
      tags: [Preferences]
      operationId: themeUpdate
      summary: Update the colour scheme preference
      description: >
        Persists the user's chosen colour scheme. No per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme:
                  type: string
                  enum: [light, dark, system]
                  description: Colour scheme preference.
      responses:
        "200":
          description: Theme updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, theme]
                properties:
                  ok:
                    type: boolean
                    example: true
                  theme:
                    type: string
                    enum: [light, dark, system]
        "422":
          description: Invalid theme value.
        "401":
          description: Unauthenticated.

  /preferences:
    post:
      tags: [Preferences]
      operationId: preferencesUpdate
      summary: Update global display preferences (units + clock format)
      description: >
        Persists the user's non-secret DISPLAY preferences — measurement units and
        12/24h clock. These are presentation choices only (the underlying data stays
        stored data is unchanged); the client applies them to its own rendering. Every field is
        optional; only the sent fields change. Mirrored in GET /me.preferences. No
        per-route throttle beyond default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                distance:
                  type: string
                  enum: [km, mi]
                elevation:
                  type: string
                  enum: [m, ft]
                weight:
                  type: string
                  enum: [kg, lb]
                temp:
                  type: string
                  enum: [c, f]
                glucose:
                  type: string
                  enum: [mgdl, mmoll]
                time_format:
                  type: string
                  enum: [24h, 12h]
                timezone:
                  type: [string, "null"]
                  description: "IANA timezone override; empty string clears it (follow the browser)."
                date_format:
                  type: string
                  enum: [system, dmy, dmy_dot, mdy, ymd]
                mail_load_remote:
                  type: boolean
                  deprecated: true
                  description: "Deprecated and ignored: remote mail content is controlled per message."
                mail_signature:
                  type: [string, "null"]
                  maxLength: 5000
                notifications:
                  type: object
                  description: "Per-category push prefs (merged): { \"<category>\": { \"push\": bool } }."
                  additionalProperties:
                    type: object
                    properties:
                      push: { type: boolean }
      responses:
        "200":
          description: Preferences updated; returns the full preference set.
          content:
            application/json:
              schema:
                type: object
                required: [ok, preferences]
                properties:
                  ok:
                    type: boolean
                    example: true
                  preferences:
                    $ref: "#/components/schemas/DisplayPreferences"
        "422":
          description: Invalid preference value.
        "401":
          description: Unauthenticated.

  /groups:
    get:
      tags: [Groups]
      operationId: groupsIndex
      summary: List all groups (admin)
      description: >
        Returns every group with its limits, shareable flag and members. Requires the
        admin role (manage-global-settings) on top of the device token.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Groups]
      operationId: groupsStore
      summary: Create a group (admin)
      description: "Throttle: 60 req/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [finance] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
                  description: User ids to set as members.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /groups/{group}:
    put:
      tags: [Groups]
      operationId: groupsUpdate
      summary: Update a group and sync its members (admin)
      description: "Members is the full set — an omitted/empty array clears membership. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                max_connected_devices: { type: [integer, "null"], minimum: 1, maximum: 50 }
                shareable: { type: boolean }
                modules: { type: [array, "null"], items: { type: string, enum: [finance] }, description: "Enabled module keys (null = all)." }
                members:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Groups]
      operationId: groupsDestroy
      summary: Delete a group (admin)
      description: "Members keep their accounts; the group's limits stop applying. Throttle: 60 req/min."
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance-v2/health:
    get:
      tags: [Finance]
      operationId: financeV2Health
      summary: Finance v2 module contract and schema version
      description: >
        Authenticated readiness contract for the isolated finance-v2 module.
        Requires a Sanctum bearer with the `device` ability, completed mandatory
        2FA enrollment, and the Finance module enabled for the account. Throttle:
        120 requests/minute.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Finance v2 is enabled and reports its schema contract.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [module, schemaVersion]
                properties:
                  module: { type: string, enum: [finance] }
                  schemaVersion: { type: integer, enum: [1] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance-v2/projects:
    get:
      tags: [Finance]
      operationId: financeV2ProjectsIndex
      summary: List owner-scoped projects
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 255 } }
        - { name: status, in: query, schema: { type: string, enum: [planned, active, on_hold, done, cancelled] } }
        - { name: kind, in: query, schema: { type: string, enum: [business, private] } }
        - { name: partner_reference, in: query, schema: { type: string } }
        - { name: parent_id, in: query, schema: { type: string, format: uuid } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: starts_from, in: query, schema: { type: string, format: date } }
        - { name: starts_to, in: query, schema: { type: string, format: date } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [updated_at, name, starts_on, due_on, status] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: "Project page.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectPage' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Finance]
      operationId: financeV2ProjectsCreate
      summary: Create a project
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectInput' } } } }
      responses:
        "201": { description: "Project created.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Project' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /finance-v2/projects/{project}:
    get:
      tags: [Finance]
      operationId: financeV2ProjectsShow
      summary: Read an owned project
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "Project.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Project' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Finance]
      operationId: financeV2ProjectsUpdate
      summary: Update an owned project with optimistic versioning
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectInput' } } } }
      responses:
        "200": { description: "Updated project.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Project' } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version or workflow conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectConflict' } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Finance]
      operationId: financeV2ProjectsArchive
      summary: Archive an owned project
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectActionInput' } } } }
      responses:
        "200": { description: "Archived project.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Project' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectConflict' } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /finance-v2/projects/{project}/status:
    post:
      tags: [Finance]
      operationId: financeV2ProjectsStatus
      summary: Change project status
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectActionInput' } } } }
      responses:
        "200": { description: "Updated project.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Project' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectConflict' } } } }
        "422": { description: "Invalid transition.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectDomainError' } } } }

  /finance-v2/projects/{project}/move:
    post:
      tags: [Finance]
      operationId: financeV2ProjectsMove
      summary: Move project in the owned hierarchy
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectActionInput' } } } }
      responses:
        "200": { description: "Moved project.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Project' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectConflict' } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /finance-v2/projects/{project}/restore:
    post:
      tags: [Finance]
      operationId: financeV2ProjectsRestore
      summary: Restore an archived project
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectActionInput' } } } }
      responses:
        "200": { description: "Restored project.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2Project' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectConflict' } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /finance-v2/projects/{project}/work-items:
    get:
      tags: [Finance]
      operationId: financeV2ProjectWorkItemsIndex
      summary: List project work items
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }, { name: page, in: query, schema: { type: integer, minimum: 1 } }, { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses:
        "200": { description: "Work item page.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/FinanceV2WorkItem' } }, meta: { type: object } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Finance]
      operationId: financeV2ProjectWorkItemsCreate
      summary: Create a work item
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2WorkItemInput' } } } }
      responses:
        "201": { description: "Work item created.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2WorkItem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Project archived.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectConflict' } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /finance-v2/projects/{project}/work-items/{workItem}:
    put:
      tags: [Finance]
      operationId: financeV2ProjectWorkItemsUpdate
      summary: Update a project work item
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }, { name: workItem, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2WorkItemInput' } } } }
      responses:
        "200": { description: "Work item updated.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2WorkItem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Version or workflow conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2ProjectConflict' } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Finance]
      operationId: financeV2ProjectWorkItemsDelete
      summary: Delete a project work item
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }, { name: workItem, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 0 } } } } } }
      responses: { "204": { description: "Deleted."}, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: "Version conflict."}, "422": { $ref: "#/components/responses/ValidationError" } }

  /finance-v2/projects/{project}/work-items/reorder:
    post:
      tags: [Finance]
      operationId: financeV2ProjectWorkItemsReorder
      summary: Reorder all project work items
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { "200": { description: "Reordered work items."}, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: "Project archived."}, "422": { $ref: "#/components/responses/ValidationError" } }

  /finance-v2/projects/{project}/time-entries:
    get:
      tags: [Finance]
      operationId: financeV2ProjectTimeEntriesIndex
      summary: List project time entries
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }, { name: page, in: query, schema: { type: integer, minimum: 1 } }, { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses: { "200": { description: "Time entry page."}, "404": { $ref: "#/components/responses/NotFound" }, "422": { $ref: "#/components/responses/ValidationError" } }
    post:
      tags: [Finance]
      operationId: financeV2ProjectTimeEntriesCreate
      summary: Log project time
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2TimeEntryInput' } } } }
      responses: { "201": { description: "Time entry created.", content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2TimeEntry' } } } }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: "Project archived."}, "422": { $ref: "#/components/responses/ValidationError" } }

  /finance-v2/projects/{project}/time-entries/{entry}:
    put:
      tags: [Finance]
      operationId: financeV2ProjectTimeEntriesUpdate
      summary: Update uninvoiced project time
      parameters: [{ name: project, in: path, required: true, schema: { type: string, format: uuid } }, { name: entry, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceV2TimeEntryInput' } } } }
