  /mail/accounts:
    get:
      tags: [Mail]
      operationId: mailAccountsIndex
      summary: List the caller's mail accounts
      description: >
        Owner-scoped; each account includes its archived-message count. Never
        includes the account password (see the Mail tag description).
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/MailAccount" }
        "403": { description: Module disabled for this account. }
    post:
      tags: [Mail]
      operationId: mailAccountsStore
      summary: Create a mail account
      description: "user_id is stamped server-side from the authenticated caller, never from the request body. Throttle 30/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, host, port, username, password, encryption]
              properties:
                name: { type: string, maxLength: 200 }
                host: { type: string, maxLength: 255, description: "SSRF-guarded — a link-local / cloud-metadata host is rejected (422)." }
                port: { type: integer, minimum: 1, maximum: 65535 }
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 2000, description: "Stored `encrypted` at rest; never returned by any endpoint." }
                encryption: { type: string, enum: [ssl, tls, starttls, none] }
                folders: { type: array, nullable: true, items: { type: string, maxLength: 255 } }
                backfill_since: { type: string, format: date, nullable: true }
                delete_after_import: { type: boolean, description: "Auto-delete newly archived messages from the origin server (destructive)." }
                enabled: { type: boolean, description: "Default true when omitted." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/MailAccount" }
        "403": { description: Module disabled for this account. }
        "422": { description: "Validation error, including an unsafe host (SafeHost rule)." }

  /mail/accounts/{account}:
    put:
      tags: [Mail]
      operationId: mailAccountsUpdate
      summary: Update a mail account
      description: >
        Owner-scoped (404 for a foreign account — no existence leak). Every
        field except `password` is a full replace; an omitted `folders` /
        `backfill_since` / `enabled` key leaves the stored value unchanged. A
        BLANK or omitted `password` keeps the stored one (KeepBlankSecrets) —
        the current password is never round-tripped to the client to prove
        "unchanged". Throttle 30/min.
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, host, port, username, encryption]
              properties:
                name: { type: string, maxLength: 200 }
                host: { type: string, maxLength: 255, description: "SSRF-guarded — a link-local / cloud-metadata host is rejected (422)." }
                port: { type: integer, minimum: 1, maximum: 65535 }
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 2000, nullable: true, description: "Omit or send blank to keep the stored password." }
                encryption: { type: string, enum: [ssl, tls, starttls, none] }
                folders: { type: array, nullable: true, items: { type: string, maxLength: 255 } }
                backfill_since: { type: string, format: date, nullable: true }
                delete_after_import: { type: boolean, description: "Auto-delete newly archived messages from the origin server (destructive)." }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/MailAccount" }
        "403": { description: Module disabled for this account. }
        "404": { description: Not the caller's account. }
        "422": { description: "Validation error, including an unsafe host (SafeHost rule)." }
    delete:
      tags: [Mail]
      operationId: mailAccountsDestroy
      summary: Delete a mail account
      description: >
        Owner-scoped (404 for a foreign account). Cascades the account's sync
        cursors and message-ledger rows (FK cascadeOnDelete). The sealed
        message blobs those rows referenced are NOT unlinked here — mail_blobs
        cascades with the user, not the account, so the ledger row (and its
        disk bytes) survives with nothing referencing it anymore; the daily
        `mail:sweep-orphans` job reclaims it after the grace window (or the
        GDPR account-erasure contributor, promptly, on full account deletion).
        Throttle 30/min.
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted. }
        "403": { description: Module disabled for this account. }
        "404": { description: Not the caller's account. }

  /mail/accounts/{account}/sync:
    post:
      tags: [Mail]
      operationId: mailAccountsSync
      summary: Trigger an on-demand sync for the account
      description: >
        Dispatches the same SyncMailAccount producer job the scheduler uses
        for this one account (fetch + seal + archive; async — the response
        does not wait for it). Owner-scoped (404 for a foreign account).
        Throttle 30/min.
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sync dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispatched: { type: boolean }
        "403": { description: Module disabled for this account. }
        "404": { description: Not the caller's account. }
        "429": { description: Rate limit exceeded. }

  /mail/accounts/{account}/sync/cancel:
    post:
      tags: [Mail]
      operationId: mailAccountsSyncCancel
      summary: Cancel an in-flight sync
      description: >
        Cancels the running ingest batch (each IngestMailChunk checks the
        batch's cancelled flag and stops) and settles the account to idle.
        Already-archived messages are kept; un-ingested Maildir files remain and
        a LATER scheduled sync resumes them — disable the account to prevent
        that. Idempotent (no-op when nothing is running). Owner-scoped. Throttle
        30/min.
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sync cancelled (or nothing was running).
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
        "403": { description: Module disabled for this account. }
        "404": { description: Not the caller's account. }
        "429": { description: Rate limit exceeded. }

  /mail/accounts/{account}/status:
    get:
      tags: [Mail]
      operationId: mailAccountsStatus
      summary: Current sync status + message count for the account
      description: "Owner-scoped (404 for a foreign account)."
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [idle, syncing, error] }
                  last_error: { type: string, nullable: true }
                  last_synced_at: { type: string, format: date-time, nullable: true }
                  message_count: { type: integer }
        "403": { description: Module disabled for this account. }
        "404": { description: Not the caller's account. }

  /mail/messages:
    get:
      tags: [Mail]
      operationId: mailMessagesIndex
      summary: The archived-message ledger — metadata only, never content
      description: >
        Owner-scoped, paginated. This is the client's list source for the
        archive: for each row, unwrap `sealed_key` with the caller's own
        identity secret keys, then GET /mail/raw/{id} for the sealed bytes —
        see the Mail tag description for the full decrypt contract. No
        subject/from/to/body field exists anywhere on this response; the
        server never sees message content.
      parameters:
        - name: account_id
          in: query
          schema: { type: integer }
          description: Restrict to one of the caller's own mail accounts.
        - name: folder
          in: query
          schema: { type: string }
          description: "Exact folder match, e.g. INBOX."
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Ledger page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MailMessage" }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      per_page: { type: integer }
                      current_page: { type: integer }
                      last_page: { type: integer }
        "403": { description: Module disabled for this account. }

  /mail/messages/{message}/pushback:
    post:
      tags: [Mail]
      operationId: mailMessagesPushback
      summary: Push an archived message back to its origin IMAP mailbox (IMAP APPEND)
      description: >
        The one deliberate write-to-origin action: APPENDs the message to its
        origin IMAP mailbox. Zero-knowledge — the server cannot read the sealed
        archive, so the CLIENT decrypts the message and posts the plaintext
        RFC822 (base64) here purely so the server can hand it to IMAP; nothing is
        persisted/cached/logged (Cache-Control: no-store). Owner-scoped; the IMAP
        host is SSRF-guarded. Throttle 30/min. Max 50 MiB.
      parameters:
        - name: message
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_b64]
              properties:
                raw_b64: { type: string, description: "base64 of the full decrypted RFC822 message." }
                folder: { type: string, description: "Target IMAP folder; defaults to the message's archived folder." }
      responses:
        "200":
          description: Appended to the origin mailbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pushed: { type: boolean }
        "403": { description: Module disabled. }
        "404": { description: Not the caller's message/account. }
        "413": { description: Message too large. }
        "422": { description: Invalid message. }
        "502": { description: IMAP append failed (no internals leaked). }
        "429": { description: Rate limit exceeded. }

  /mail/messages/{message}/delete-origin:
    post:
      tags: [Mail]
      operationId: mailMessagesDeleteOrigin
      summary: Delete an archived message from its origin IMAP mailbox (UID STORE \Deleted + EXPUNGE)
      description: >
        A deliberate, destructive write-to-origin action (like push-back):
        removes the message from its ORIGIN IMAP mailbox by RFC822 Message-Id
        (UID SEARCH HEADER Message-Id → UID STORE +FLAGS (\Deleted) → UID EXPUNGE,
        fallback EXPUNGE). Frees space upstream AFTER archiving; works for any
        archived message regardless of when it was imported. Zero-knowledge — the
        server cannot read the sealed archive, so the CLIENT decrypts the message
        and posts only its (non-secret) Message-Id here so the server can locate +
        delete it; nothing is persisted/cached/logged (Cache-Control: no-store).
        The IMMUTABLE local archive copy is NOT touched. Owner-scoped; the IMAP
        host is SSRF-guarded. Runs behind an explicit user confirmation.
        Throttle 30/min.
      parameters:
        - name: message
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { type: string, description: "The RFC822 Message-Id header value (e.g. <abc@host>) used to locate the message on the origin." }
                folder: { type: string, description: "IMAP folder to search; defaults to the message's archived folder." }
      responses:
        "200":
          description: Deleted from the origin mailbox (0 if no match).
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer, description: "Number of messages expunged on the origin." }
        "403": { description: Module disabled. }
        "404": { description: Not the caller's message/account. }
        "422": { description: Missing/invalid Message-Id. }
        "502": { description: IMAP delete failed (no internals leaked). }
        "429": { description: Rate limit exceeded. }

  /mail/messages/trash:
    post:
      tags: [Mail]
      operationId: mailMessagesTrash
      summary: Soft-hide (trash) archived messages
      description: >
        Marks the given messages trashed_at (hidden from the default list). Archived
        mail is IMMUTABLE — this NEVER deletes a message or its sealed blob; there
        is no hard-delete endpoint. Bulk + owner-scoped (ignores ids the caller does
        not own). Throttle 60/min. Max 1000 ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Number of messages hidden.
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        "403": { description: Module disabled. }
        "429": { description: Rate limit exceeded. }

  /mail/messages/restore:
    post:
      tags: [Mail]
      operationId: mailMessagesRestore
      summary: Un-hide (restore) trashed messages
      description: "Clears trashed_at on the given owned messages. Bulk + owner-scoped. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Number of messages restored.
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        "403": { description: Module disabled. }
        "429": { description: Rate limit exceeded. }

  /mail/messages/{message}/envelope:
    post:
      tags: [Mail]
      operationId: mailMessagesEnvelope
      summary: Store the client-built sealed envelope (list/search index)
      description: >
        Zero-knowledge list index. The server cannot read the sealed body, so the
        CLIENT decrypts the body once, parses the headers, and uploads a tiny
        sealed ENVELOPE (from/to/subject/date/attachment, sealed to the owner's
        identity keys in the same format as the body). The server stores it opaque
        so future list-loads / other devices decrypt only this envelope, never the
        body. Owner-scoped, idempotent. Throttle 1200/min (bulk backfill).
      parameters:
        - name: message
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope, envelope_key]
              properties:
                envelope: { type: string, description: "base64 framed secretstream blob (<=64 KiB)." }
                envelope_key: { type: string, description: "hybrid-wrap suite envelope (JSON) of the per-envelope key." }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { type: object, properties: { stored: { type: boolean } } }
        "403": { description: Module disabled. }
        "404": { description: Not the caller's message. }
        "429": { description: Rate limit exceeded. }

  /mail/raw/{blob}:
    get:
      tags: [Mail]
      operationId: mailRaw
      summary: Stream a sealed mail-message blob (ciphertext)
      description: >
        Streams the raw secretstream-sealed bytes for the given uuid — which
        is a MailMessage's own `id` (see the MailMessage schema; the message
        row and its blob share one primary key, so no separate lookup is
        needed). Owner-scoped; foreign or missing blob returns 404 to avoid an
        ownership oracle. Served with immutable cache headers — the client
        decrypts in memory after unwrapping `sealed_key`. Throttle 600/min.
      parameters:
        - name: blob
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Blob ciphertext stream.
          content:
            application/octet-stream:
              schema: { type: string, format: binary, description: "Opaque secretstream-sealed bytes. The client unwraps sealed_key first, then opens this with that key." }
        "404": { description: Blob not found or not owned by caller. }
        "429": { description: Rate limit exceeded. }

  /passwords/store:
    get:
      tags: [Store]
      operationId: passwordsStoreShow
      summary: Read the sealed sharded passwords root
      description: >
        Sharded passwords store (merge-safety spec §3b): the sealed root pointer table
        (shard descriptors), mirroring /files/store. ETag/304 supported. The password
        records (`secrets`) + the `secretFolders` collection live in the passwords
        shard blobs (see /passwords/raw). Decrypted shape: PasswordsStoreModel.
      responses:
        "200":
          description: Sealed root + version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ciphertext: { type: string, nullable: true }
                  version: { type: integer }
        "304": { description: Not modified (ETag match). }
        "403": { description: Module disabled for this account. }
    put:
      tags: [Store]
      operationId: passwordsStoreSave
      summary: Write the sealed sharded passwords root
      description: >
        Optimistic concurrency (409 on stale version) + shard-reference integrity
        guard: send the full shard-ref list; the server rejects (422 missing_shard)
        a root pointing at a shard blob with no ledger row. Throttle 120/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciphertext, version]
              properties:
                ciphertext: { type: string }
                version: { type: integer, minimum: 0 }
                counts:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                  description: >
                    Optional non-secret per-slice record counts (cardinality only,
                    never content) recorded in the root_write forensic trail so
                    store:anomaly-scan can flag a version where a record count
                    regressed — the primary silent-data-loss signal.
                shards:
                  type: array
                  maxItems: 200000
                  items: { type: string, format: uuid }
                  description: >
                    STRONGLY RECOMMENDED: the COMPLETE set of blob refs (every record-shard
                    AND collection blob) the new sealed root points at. The server rejects
                    the write (422 missing_shard) if any ref lacks a ledger row. OMITTING or
                    sending an INCOMPLETE set disables/weakens this guard and can persist a
                    corrupt dangling-shard root that 404s on load and loses those records —
                    always send the full set. Non-secret UUIDs (zero-knowledge preserved).
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties: { version: { type: integer } }
        "403": { description: Module disabled for this account. }
        "409":
          description: Version conflict — re-read, rebase, retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreVersionConflict" }
        "422":
          description: A referenced shard blob has no ledger row (missing_shard).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingShardResponse" }

  /passwords/upload:
    post:
      tags: [Store]
      operationId: passwordsUpload
      summary: Upload a passwords shard blob
      description: "Stores an opaque record-shard ciphertext blob at passwords/{id}. Throttle 1200/min."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }

  /passwords/raw/{blob}:
    get:
      tags: [Store]
      operationId: passwordsRaw
      summary: Download a passwords shard blob (owner-scoped)
      parameters:
        - name: blob
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Opaque ciphertext bytes. }
        "404": { description: Not found or not owned by caller. }

  /passwords/raw-batch:
    post:
      tags: [Store]
      operationId: passwordsRawBatch
      summary: Batch-download passwords shard blobs (framed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobs]
              properties:
                blobs:
                  type: array
                  maxItems: 512
                  items: { type: string, format: uuid }
      responses:
        "200": { description: Framed concatenated ciphertext blobs. }

  /passwords/blobs/reconcile:
    post:
      tags: [Store]
      operationId: passwordsReconcile
      summary: Reconcile the passwords shard live-set
      description: >
        The client sends the full set of blob refs its root still points at; the
        server frees grace-expired shard blobs no longer referenced. Throttle 120/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobs]
              properties:
                allow_empty:
                  type: boolean
                  description: >
                    Explicit acknowledgement that an EMPTY blobs list (prune
                    everything) is intended. A client with a degraded/failed index
                    must NOT send it; without it the server refuses (422) to prune a
                    non-empty ledger from an empty live-set. DEGRADED/PARTIAL INDEX: a client whose store load was degraded or incomplete (any record
                    shard failed to load / 404'd) MUST NOT reconcile at all — a non-empty but PARTIAL live-set bypasses this empty-set guard and permanently
                    prunes the missing records' blobs after the grace window. Freeze reconcile until a clean full load. For a shared folder,
                    reconcile additionally requires the manage role.
                blobs:
                  type: array
                  maxItems: 100000
                  items: { type: string, format: uuid }
      responses:
        "422":
          description: Refused — empty live-set against a non-empty ledger without allow_empty.
        "200":
          description: Reconciled; returns updated usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageResponse" }

  # ── Vault lifecycle (native provisioning + passphrase rotation) ──
  # ── Per-user non-display settings (contact notify channels + file version cap) ──
  /settings:
    get:
      tags: [Preferences]
      operationId: settingsShow
      summary: Read the caller's per-user settings
      description: >
        Non-secret per-user settings a mobile client needs beyond display prefs:
        the birthday/anniversary notification channels (on the ZK critical path —
        the client detects a due date and relays via POST /contacts/notify, which
        the server intersects with these channels) and the personal file version cap.
      responses:
        "200": { description: "Settings.", content: { application/json: { schema: { $ref: "#/components/schemas/UserSettings" } } } }
        "401": { description: Unauthenticated. }
    put:
      tags: [Preferences]
      operationId: settingsUpdate
      summary: Update per-user settings (partial)
      description: "Updates any subset; unspecified keys are left unchanged. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSettings" }
      responses:
        "200": { description: "Updated settings.", content: { application/json: { schema: { $ref: "#/components/schemas/UserSettings" } } } }
        "401": { description: Unauthenticated. }
        "422": { description: Validation error. }
        "429": { description: Rate limit exceeded. }

  # ── Owner-side device pairing ──
  /device-pairings:
    post:
      tags: [DevicePairings]
      operationId: devicePairingStore
      summary: Generate a pairing code + QR (owner)
      description: "The owner (already paired) starts pairing a NEW device: returns a pairing id + QR data-URI carrying a short-lived one-time code (never a token). Throttle 20/min."
      responses:
        "200": { description: "Pairing started.", content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string }, qr: { type: string, description: "SVG data-URI." }, expires_at: { type: string, format: date-time, nullable: true } } } } } }
        "401": { description: Unauthenticated. }
        "429": { description: Rate limit exceeded. }
  /device-pairings/cli:
    post:
      tags: [DevicePairings]
      operationId: devicePairingStoreCli
      summary: Generate a CLI pairing code (owner)
      description: "Like /device-pairings but returns a copyable text code (60s TTL) for a CLI client. Throttle 20/min."
      responses:
        "200": { description: "Pairing started.", content: { application/json: { schema: { type: object, required: [id, code], properties: { id: { type: string }, code: { type: string }, expires_at: { type: string, format: date-time, nullable: true } } } } } }
        "401": { description: Unauthenticated. }
  /device-pairings/{devicePairing}:
    get:
      tags: [DevicePairings]
      operationId: devicePairingShow
      summary: Poll a pairing's state (owner)
      description: "Owner-scoped (foreign pairing → 404). Returns the current status + the claiming device name."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "State.", content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [pending, pending_approval, approved, rejected, consumed, expired] }, device_name: { type: string, nullable: true } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found / not owned by caller. }
  /device-pairings/{devicePairing}/approve:
    post:
      tags: [DevicePairings]
      operationId: devicePairingApprove
      summary: Approve the claimed device (owner)
      description: "Owner-scoped. After approval the new device's POST /auth/pair/collect returns its token. Throttle 20/min."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Approved.", content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found / not owned by caller. }
        "429": { description: Rate limit exceeded. }
  /device-pairings/{devicePairing}/reject:
    post:
      tags: [DevicePairings]
      operationId: devicePairingReject
      summary: Reject the claimed device (owner)
      description: "Owner-scoped. Throttle 20/min."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Rejected.", content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: Not found / not owned by caller. }

  # ── 2FA + app password (self-service) ──
  /user/two-factor/enable:
    post:
      tags: [TwoFactor]
      operationId: twoFactorEnable
      summary: Enable TOTP (generate secret + recovery codes)
      description: "Generates a new TOTP secret + recovery codes (stored encrypted). NOT yet active — call /confirm with a live code. Idempotent. Throttle 10/min."
      responses:
        "200": { description: "Secret generated.", content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, enum: [true] } } } } } }
        "401": { description: Unauthenticated. }
        "429": { description: Rate limit exceeded. }
  /user/two-factor/qr:
    get:
      tags: [TwoFactor]
      operationId: twoFactorQr
      summary: Get the TOTP QR + secret + otpauth URI
      description: "For the window between enable and confirm. 404 if 2FA not enabled. Throttle 30/min."
      responses:
        "200": { description: "QR data.", content: { application/json: { schema: { type: object, required: [svg, secret, uri], properties: { svg: { type: string }, secret: { type: string }, uri: { type: string } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: 2FA not enabled. }
  /user/two-factor/confirm:
    post:
      tags: [TwoFactor]
      operationId: twoFactorConfirm
      summary: Confirm 2FA with a live TOTP code
      description: "Validates the code and activates 2FA (sets two_factor_confirmed_at). 422 on wrong/expired code. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: "Confirmed.", content: { application/json: { schema: { type: object, properties: { confirmed: { type: boolean, enum: [true] } } } } } }
        "401": { description: Unauthenticated. }
        "422": { description: Invalid/expired code. }
        "429": { description: Rate limit exceeded. }
  /user/two-factor/recovery-codes:
    get:
      tags: [TwoFactor]
      operationId: twoFactorRecoveryCodes
      summary: List recovery codes
      description: "Only after 2FA is confirmed (else 404). Throttle 30/min."
      responses:
        "200": { description: "Codes.", content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        "401": { description: Unauthenticated. }
        "404": { description: 2FA not active. }
  /user/two-factor/recovery-codes/regenerate:
    post:
      tags: [TwoFactor]
      operationId: twoFactorRegenerateRecoveryCodes
      summary: Regenerate recovery codes
      description: "Invalidates the old set and returns a fresh one. Throttle 10/min."
      responses:
        "200": { description: "New codes.", content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        "401": { description: Unauthenticated. }
        "429": { description: Rate limit exceeded. }
  /user/two-factor:
    delete:
      tags: [TwoFactor]
      operationId: twoFactorDisable
      summary: Disable 2FA
      description: "Clears the TOTP secret, recovery codes, and confirmed flag. Idempotent. Throttle 10/min."
      responses:
        "200": { description: "Disabled.", content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, enum: [false] } } } } } }
        "401": { description: Unauthenticated. }
  /user/password:
    put:
      tags: [TwoFactor]
      operationId: userPasswordUpdate
      summary: Change the app login password
      description: >
        Validates `current_password` (guard-agnostic Hash::check — Fortify's
        current_password:web rule would fail for a bearer token) and sets a new
        password (min 12, confirmed). Orthogonal to the ZK vault passphrase.
        Throttle 10/min.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [current_password, password, password_confirmation], properties: { current_password: { type: string }, password: { type: string, minLength: 12 }, password_confirmation: { type: string } } }
      responses:
        "200": { description: "Changed.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
        "422": { description: Wrong current password or invalid new password. }
        "429": { description: Rate limit exceeded. }
  /user/email/verify/resend:
    post:
      tags: [TwoFactor]
      operationId: emailVerifyResend
      summary: Re-send the e-mail verification link
      description: "No-op (ok:true) when already verified. Needs SMTP configured. Throttle 6/min."
      responses:
        "200": { description: "Queued (or already verified).", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthenticated. }
        "429": { description: Rate limit exceeded. }

  # ── Admin: users ──
  /users:
    get:
      tags: [Users]
      operationId: usersIndex
      summary: List users (admin)
      description: "All users with effective limits, groups, 2FA/verified state, last login, and storage usage. No credentials. Admin-gated (403 otherwise)."
      responses:
        "200": { description: "Users.", content: { application/json: { schema: { type: object, required: [users], properties: { users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } } } }
        "401": { description: Unauthenticated. }
        "403": { description: Not an admin. }
    post:
      tags: [Users]
      operationId: usersStore
      summary: Create a user (admin)
      description: "role/quotas/modules are privilege fields (set server-side, never mass-assigned). Omit password to send a reset mail (if SMTP on). Throttle 30/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/AdminUser" } } } } } }
        "403": { description: Not an admin. }
        "422": { description: Validation error. }
        "429": { description: Rate limit exceeded. }
  /users/{user}:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Users]
      operationId: usersUpdate
      summary: Update a user (admin)
      description: "Password prohibited (use reset-password). Guards: cannot demote the last admin. Throttle 60/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/AdminUser" } } } } } }
        "403": { description: Not an admin. }
        "422": { description: Validation / last-admin guard. }
    delete:
      tags: [Users]
      operationId: usersDestroy
      summary: Delete a user (admin, GDPR crypto-shred)
      description: "Purges the user + all owned data. Cannot delete self or the last admin. Throttle 10/min."
      responses:
        "204": { description: Deleted. }
        "403": { description: Not an admin. }
        "422": { description: Self-delete / last-admin guard. }
  /users/{user}/reset-password:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersResetPassword
      summary: Send a password-reset mail (admin)
      description: "422 when SMTP is not configured (use invite-link instead). Throttle 10/min."
      responses:
        "200": { description: "Sent.", content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "403": { description: Not an admin. }
        "422": { description: SMTP not configured. }
  /users/{user}/reset-2fa:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersResetTwoFactor
      summary: Clear a user's 2FA (admin recovery)
      description: "Nulls the TOTP secret/codes/confirmed flag. Throttle 10/min."
      responses:
        "200": { description: "Cleared.", content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "403": { description: Not an admin. }
  /users/{user}/avatar:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Users]
      operationId: usersAvatar
      summary: Stream a user's avatar (admin)
      description: "Non-secret. 404 if none stored."
      responses:
        "200": { description: "Image.", content: { image/*: { schema: { type: string, format: binary } } } }
        "403": { description: Not an admin. }
        "404": { description: No avatar. }
  /users/{user}/invite-link:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersInviteLink
      summary: Generate a one-time login/password-set link (admin)
      description: "Single-use, time-limited link; the plaintext token appears only in `url` (never stored/logged — only its SHA-256). Optionally emails it. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ttl_hours], properties: { ttl_hours: { type: integer, enum: [1, 24, 168, 720] }, send: { type: boolean, default: false } } } } } }
      responses:
        "200": { description: "Link.", content: { application/json: { schema: { type: object, required: [url, sent], properties: { url: { type: string, format: uri }, expires_at: { type: string, format: date-time, nullable: true }, sent: { type: boolean } } } } } }
        "403": { description: Not an admin. }
        "422": { description: Validation error. }
        "429": { description: Rate limit exceeded. }

  # ── Admin: security log ──
  /security-log:
    get:
      tags: [SecurityLog]
      operationId: securityLogIndex
      summary: List audit-log entries (admin, read-only)
      description: "Paginated, filterable audit trail. Metadata-only. Admin-gated. Throttle 60/min."
      parameters:
        - { name: action, in: query, schema: { type: string }, description: "Exact action, or a `prefix.*` group match." }
        - { name: user, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string }, description: "ISO-8601 or -24h/-7d." }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200": { description: "Entries.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/SecurityLogEntry" } }, meta: { type: object, properties: { total: { type: integer }, per_page: { type: integer }, current_page: { type: integer }, last_page: { type: integer } } } } } } } }
        "403": { description: Not an admin. }
  /security-log/export:
    get:
      tags: [SecurityLog]
      operationId: securityLogExport
      summary: Export the audit log (admin, CSV/NDJSON)
      description: "Streamed, capped 10000, same filters as index. CSV cells are formula-injection-neutralised. Throttle 10/min."
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: limit, in: query, schema: { type: integer, default: 10000, maximum: 10000 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: user, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string } }
      responses:
        "200": { description: "Stream.", content: { text/csv: { schema: { type: string, format: binary } }, application/x-ndjson: { schema: { type: string, format: binary } } } }
        "403": { description: Not an admin. }

  # ── Per-user Paperless ──
  /paperless/terms:
    get:
      tags: [Paperless]
      operationId: paperlessTerms
      summary: Cached Paperless term quick-picks
      description: "{configured, tags, document_types, correspondents} from the local cache (no live call). Throttle 60/min."
      responses:
        "200": { description: "Terms.", content: { application/json: { schema: { type: object, required: [configured, tags, document_types, correspondents], properties: { configured: { type: boolean }, tags: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } }, document_types: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } }, correspondents: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } } } } } } }
        "401": { description: Unauthenticated. }
    post:
      tags: [Paperless]
      operationId: paperlessCreateTerm
      summary: Create a Paperless tag / document type / correspondent
      description: "Creates it in the live Paperless + caches. 422 if not configured or the call fails. Throttle 30/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, name], properties: { kind: { type: string, enum: [tag, document_type, correspondent] }, name: { type: string, maxLength: 255 } } } } } }
      responses:
        "200": { description: "Created/found.", content: { application/json: { schema: { type: object, required: [ok, id, name], properties: { ok: { type: boolean }, id: { type: integer }, name: { type: string } } } } } }
        "401": { description: Unauthenticated. }
        "422": { description: Not configured / validation / Paperless error. }
  /paperless/documents:
    post:
      tags: [Paperless]
      operationId: paperlessSubmit
      summary: Forward a decrypted document to Paperless (transient cleartext)
      description: >
        **Transient-cleartext boundary** (like /gallery/process + /invoices/ocr):
        the client posts the already-decrypted bytes; the server forwards them to
        the user's own Paperless and stores/logs nothing (`Cache-Control: no-store`).
        Returns the Paperless async task id. Throttle 20/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: "Decrypted PDF/image, max 50 MB." }, title: { type: string, maxLength: 255 }, created: { type: string, format: date }, correspondent: { type: integer }, document_type: { type: integer }, tags: { type: array, items: { type: integer } } } }
      responses:
        "200": { description: "Accepted.", content: { application/json: { schema: { type: object, required: [ok, task], properties: { ok: { type: boolean }, task: { type: string } } } } } }
        "401": { description: Unauthenticated. }
        "413": { description: File exceeds 50 MB. }
        "422": { description: Not configured / validation / Paperless error. }
  /paperless/sync:
    post:
      tags: [Paperless]
      operationId: paperlessSync
      summary: Refresh the cached Paperless terms from the live instance
      description: "Pulls all tags/document types/correspondents into the cache. {ok, counts}. Empty counts when unconfigured (no error). Throttle 20/min."
      responses:
        "200": { description: "Synced.", content: { application/json: { schema: { type: object, required: [ok, counts], properties: { ok: { type: boolean }, counts: { type: object, properties: { tag: { type: integer }, document_type: { type: integer }, correspondent: { type: integer } } } } } } } }
        "401": { description: Unauthenticated. }
        "422": { description: Paperless error. }

  # ── Admin: backup ──
  /backup/destinations:
    get:
      tags: [Backup]
      operationId: backupDestinationsIndex
      summary: List backup destinations (admin)
      description: "Credentials (`config`) are NEVER returned — only {id, name, driver}."
      responses:
        "200": { description: "Destinations.", content: { application/json: { schema: { type: object, properties: { destinations: { type: array, items: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } } }
        "403": { description: Not an admin. }
    post:
      tags: [Backup]
      operationId: backupDestinationsStore
      summary: Create a backup destination (admin)
      description: "Runs a reachability gate before saving. Credentials never echoed back. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { destination: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } }
        "403": { description: Not an admin. }
        "422": { description: Validation / unreachable. }
  /backup/destinations/{destination}:
    parameters: [{ name: destination, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Backup]
      operationId: backupDestinationsUpdate
      summary: Update a backup destination (admin)
      description: "Blank secret fields keep the stored value. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { destination: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } }
        "403": { description: Not an admin. }
        "404": { description: Not found. }
        "422": { description: Validation error. }
    delete:
      tags: [Backup]
      operationId: backupDestinationsDestroy
      summary: Delete a backup destination (admin)
      responses:
        "204": { description: Deleted. }
        "403": { description: Not an admin. }
        "404": { description: Not found. }
  /backup/destinations/test:
    post:
      tags: [Backup]
      operationId: backupDestinationsTest
      summary: Test destination reachability (admin)
      description: "Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "200": { description: "Result.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, detail: { type: string, nullable: true } } } } } }
        "403": { description: Not an admin. }
  /backup/jobs:
    get:
      tags: [Backup]
      operationId: backupJobsIndex
      summary: List backup jobs + statistics (admin)
      description: "`passphrase` is NEVER returned."
      responses:
        "200": { description: "Jobs.", content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { $ref: "#/components/schemas/BackupJobSummary" } } } } } } }
        "403": { description: Not an admin. }
    post:
      tags: [Backup]
      operationId: backupJobsStore
      summary: Create a backup job (admin)
      description: "source=database + encrypt=false is allowed (operator opt-out; DB dump carries wrapped vault keys off-box). Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupJobWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { job: { $ref: "#/components/schemas/BackupJobSummary" } } } } } }
        "403": { description: Not an admin. }
        "422": { description: Validation / db-must-encrypt. }
  /backup/jobs/{job}:
    parameters: [{ name: job, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Backup]
      operationId: backupJobsUpdate
      summary: Update a backup job (admin)
      description: "Blank passphrase keeps the stored value. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupJobWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { job: { $ref: "#/components/schemas/BackupJobSummary" } } } } } }
        "403": { description: Not an admin. }
        "404": { description: Not found. }
        "422": { description: Validation error. }
    delete:
      tags: [Backup]
      operationId: backupJobsDestroy
      summary: Delete a backup job (admin)
      responses:
        "204": { description: Deleted. }
        "403": { description: Not an admin. }
        "404": { description: Not found. }
  /backup/jobs/{job}/run:
    parameters: [{ name: job, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupJobsRun
      summary: Trigger a backup run now (admin)
      description: "Throttle 10/min."
      responses:
        "200": { description: "Dispatched.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "403": { description: Not an admin. }
        "404": { description: Not found. }
  /backup/runs:
    get:
      tags: [Backup]
      operationId: backupRunsIndex
      summary: List recent backup runs (admin)
      responses:
        "200": { description: "Runs.", content: { application/json: { schema: { type: object, properties: { runs: { type: array, items: { $ref: "#/components/schemas/BackupRunSummary" } } } } } } }
        "403": { description: Not an admin. }
  /backup/runs/{run}/download:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Backup]
      operationId: backupRunsDownload
      summary: Download a finished archive (admin)
      description: "Streams the raw archive bytes (may be encrypted)."
      responses:
        "200": { description: "Archive bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "403": { description: Not an admin. }
        "404": { description: Not found / not downloadable. }
  /backup/runs/{run}/verify:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsVerify
      summary: Verify archive integrity (admin)
      description: "Throttle 10/min."
      requestBody: { content: { application/json: { schema: { type: object, properties: { passphrase: { type: string, description: "Required for encrypted archives." } } } } } }
      responses:
        "200": { description: "Result.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, message: { type: string }, verifiedHuman: { type: string } } } } } }
        "403": { description: Not an admin. }
  /backup/runs/{run}/cancel:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsCancel
      summary: Cancel a running backup (admin)
      description: "First call requests cancel; a second force-finalises. Throttle 20/min."
      responses:
        "200": { description: "Result.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, forced: { type: boolean } } } } } }
        "403": { description: Not an admin. }
  /backup/runs/{run}/decrypt:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsDecrypt
      summary: Stream a decrypted archive (admin/CLI)
      description: "Streams the plaintext archive (for a headless/desktop admin). Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [passphrase], properties: { passphrase: { type: string } } } } } }
      responses:
        "200": { description: "Decrypted bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "403": { description: Not an admin. }
        "422": { description: Wrong passphrase / not encrypted. }

  # ── Public share consumption (unauthenticated) ──
  /s/{token}/meta:
    get:
      tags: [PublicShare]
      operationId: publicShareMeta
      summary: Public share metadata (no auth)
      description: "Non-secret: whether a password is needed + validity. The share key lives in the URL fragment (never sent to the server)."
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Meta.", content: { application/json: { schema: { type: object, required: [found, expired, kind, needs_password, allow_download], properties: { found: { type: boolean }, expired: { type: boolean }, kind: { type: string }, needs_password: { type: boolean }, allow_download: { type: boolean }, name: { type: string, nullable: true } } } } } }
        "404": { description: Not found. }
        "410": { description: Expired. }
  /s/{token}/unlock:
    post:
      tags: [PublicShare]
      operationId: publicShareUnlock
      summary: Unlock a password-protected share (stateless HMAC grant)
      description: "On success returns a short-lived (1h) HMAC grant token to pass on /manifest + /blob via `?grant=` or the `X-Share-Grant` header. Hard-throttled 10/min."
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, maxLength: 200 } } } } } }
      responses:
        "200": { description: "Grant.", content: { application/json: { schema: { type: object, required: [ok, grant], properties: { ok: { type: boolean }, grant: { type: string } } } } } }
        "404": { description: Not found / expired. }
        "422": { description: Wrong password. }
  /s/{token}/manifest:
    get:
      tags: [PublicShare]
      operationId: publicShareManifest
      summary: Sealed share manifest (no auth)
      description: "Returns the opaque sealed manifest (client decrypts with the fragment key). Password shares require the grant."
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: grant, in: query, required: false, schema: { type: string }, description: "HMAC grant from /unlock (or X-Share-Grant header)." }
      responses:
        "200": { description: "Sealed manifest.", content: { application/json: { schema: { type: object, required: [sealed, allow_download], properties: { sealed: { type: string }, allow_download: { type: boolean } } } } } }
        "403": { description: Grant missing/invalid. }
        "404": { description: Not found / expired. }
  /s/{token}/blob/{ref}:
    get:
      tags: [PublicShare]
      operationId: publicShareBlob
      summary: Stream a sealed share blob (no auth)
      description: "Raw ciphertext (client decrypts with the per-blob key from the manifest). Requires allow_download + (for password shares) the grant."
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: ref, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: grant, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Sealed bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "403": { description: Download disabled / grant invalid. }
        "404": { description: Not found / expired / ref not in share. }

  /store/{module}/history:
    get:
      operationId: moduleStoreHistory
      tags: [Store]
      summary: List retained sealed-root versions (recovery net).
      description: >
        Newest-first index of retained previous sealed roots (version + byte size +
        timestamp, NO ciphertext) so the client can pick a version to recover a
        dropped record from. Owner-scoped, read-only; retention is the last 20
        versions (STORE_HISTORY_VERSIONS), pruned PER SAVE (not time-based) — an
        active multiclient store can exhaust the window in minutes, so recover
        promptly. Zero-knowledge: the stored roots are opaque ciphertext.
      parameters:
        - { name: module, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Retained versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        bytes: { type: integer }
                        created_at: { type: string, format: date-time, nullable: true }
        "403": { description: Module disabled. }
        "404": { description: Unknown module. }
  /store/{module}/history/{version}:
    get:
      operationId: moduleStoreHistoryVersion
      tags: [Store]
      summary: Fetch one retained sealed-root ciphertext to re-merge a lost record.
      description: >
        Returns a single retained sealed root ciphertext by version. The client
        decrypts it and re-merges the dropped record(s). Owner-scoped; 404 if that
        version is no longer retained. For the SINGLE-BLOB module store the whole
        content is in the root, so recovery is complete. For a SHARDED store
        (files/gallery/notes/passwords/invoices) the root is only a shard-pointer
        table: recovery is best-effort and time-bounded by the ~24h blob orphan
