        the request is refused with 413 (the folder-subtree branch is now capped too).
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: integer }, maxItems: 5000 }, folder_id: { type: integer } } } } } }
      responses:
        "200": { description: ZIP archive., content: { application/zip: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "Over the ZIP export cap (>5000 files or >2 GiB total)." }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /files/archive:
    post:
      tags: [Files]
      operationId: filesCreateArchive
      summary: Create an archive from a selection or folder subtree
      description: >
        Archives the selected files (`ids`) or a folder subtree (`folder_id`) and
        SAVES the result as a new file in `target_folder_id` (default: root or the
        source folder), returning it (download via its normal raw URL). Runs inline
        on trusted input with the same caps as /files/zip (≤5000 files, ≤2 GiB).
        `format` ∈ {zip, tar.gz, tar.xz, 7z}; `level` 0..9 (0 = store). A `password`
        is only accepted for zip (AES-256) and 7z (header-encrypted) — 422 otherwise.
        Entries are stored flat (deduped names).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                ids: { type: array, items: { type: integer }, maxItems: 5000 }
                folder_id: { type: integer, description: "Archive this folder's subtree instead of ids." }
                target_folder_id: { type: [integer, "null"], description: "Where to save the archive file (default: root or the source folder)." }
                format: { type: string, enum: [zip, tar.gz, tar.xz, 7z] }
                level: { type: integer, minimum: 0, maximum: 9, description: "Compression level (0 = store, 9 = max)." }
                password: { type: [string, "null"], maxLength: 200, description: "Encrypts the archive; only zip/7z." }
                name: { type: [string, "null"], maxLength: 200 }
      responses:
        "200": { description: "The created archive file.", content: { application/json: { schema: { type: object, properties: { file: { $ref: "#/components/schemas/FileEntry" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Nothing to archive." }
        "413": { description: "Over the cap (>5000 files or >2 GiB total) or the archive exceeds the storage quota." }
        "422": { description: "Validation error, or a password on a format that can't hold one." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /files/entries/{file}/extract:
    post:
      tags: [Files]
      operationId: filesExtractArchive
      summary: Extract an archive file into a new folder
      description: >
        Creates a new folder (named after the archive) and queues a WORKER job to
        extract the archive into it — the untrusted decode never runs in the web
        request (bomb defence). Supports zip/7z/rar/tar(.gz/.xz/.bz2/.zst)/gz/bz2/xz/zst.
        Hardened against zip-slip (entries confined to the folder), entry-count/size
        caps and a per-process timeout, and enforces the owner's storage quota; the
        outcome (done / wrong-password / quota) arrives as a notification. Returns the
        destination folder immediately. 422 if the file isn't a recognised archive.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: file, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: [string, "null"], maxLength: 200, description: "For an encrypted archive." }
                target_folder_id: { type: [integer, "null"], description: "Parent folder (default: the archive's own folder)." }
                into_new_folder: { type: boolean, default: true, description: "true (default) = extract into a fresh folder named after the archive; false = extract straight into the target folder." }
      responses:
        "200": { description: "The destination folder (fills as the worker extracts); folder is null when into_new_folder=false (extracted into the target/root).", content: { application/json: { schema: { type: object, properties: { folder: { type: [object, "null"], properties: { id: { type: integer }, name: { type: string }, parent_id: { type: [integer, "null"] } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Not a recognised archive, or validation error." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /files/entries/{file}/encrypt:
    post:
      tags: [Files]
      operationId: filesEncryptEntry
      summary: Encrypt a file to a key (+ recipients)
      description: >
        Public-key encrypts the file to one of the user's own keys (from the keyring)
        plus any chosen recipients — always including the own key so it stays
        decryptable. PGP → name.gpg, S/MIME → name.p7m, saved beside the original.
        recipient_ids must be the same type (pgp/smime) as key_id.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: file, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key_id], properties: { key_id: { type: integer, description: "An own key id (mail_pgp_keys)." }, recipient_ids: { type: array, items: { type: integer }, maxItems: 50 } } } } } }
      responses:
        "200": { description: "The encrypted file.", content: { application/json: { schema: { type: object, properties: { file: { $ref: "#/components/schemas/FileEntry" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "Encrypted output exceeds the storage quota." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /files/entries/{file}/decrypt:
    post:
      tags: [Files]
      operationId: filesDecryptEntry
      summary: Decrypt an encrypted file
      description: >
        Decrypts an encrypted file (name.gpg / name.p7m) back to plaintext with one of
        the user's own keys (private material). Saves the result (extension stripped)
        beside the ciphertext. 422 if the file isn't encrypted or decryption fails.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: file, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key_id], properties: { key_id: { type: integer }, passphrase: { type: [string, "null"], maxLength: 400 } } } } } }
      responses:
        "200": { description: "The decrypted file.", content: { application/json: { schema: { type: object, properties: { file: { $ref: "#/components/schemas/FileEntry" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Not an encrypted file, or wrong key/passphrase." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /files/folders/{folder}/encrypt:
    post:
      tags: [Files]
      operationId: filesEncryptFolder
      summary: Encrypt a folder (bundled tar.gz) to a key
      description: >
        Bundles the folder's subtree into a tar.gz and encrypts it to the chosen
        key(s) → folder.tar.gz.gpg (or .p7m), saved beside the folder. Same caps as
        the zip download.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: folder, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key_id], properties: { key_id: { type: integer }, recipient_ids: { type: array, items: { type: integer }, maxItems: 50 } } } } } }
      responses:
        "200": { description: "The encrypted archive file.", content: { application/json: { schema: { type: object, properties: { file: { $ref: "#/components/schemas/FileEntry" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Folder empty or missing." }
        "413": { description: "Over the cap or storage quota." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/keys:
    get:
      tags: [Crypto]
      operationId: cryptoKeysIndex
      summary: List own encryption keys
      description: "Identical to GET /mail/keys (same MailKeyController) — the user's own PGP/S-MIME keys (public info; private material never returned). Exposed here as the profile-level keyring, not mail-gated."
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Own keys.", content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Crypto]
      operationId: cryptoKeysStore
      summary: Import an own key (armored PGP private / S-MIME PKCS#12)
      description: "Identical to POST /mail/keys — see that operation for the full request body (type, label, armored_private_key / p12_base64, passphrase)."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [type, label], properties: { type: { type: string, enum: [pgp, smime] }, label: { type: string, maxLength: 200 }, armored_private_key: { type: [string, "null"] }, p12_base64: { type: [string, "null"] }, passphrase: { type: [string, "null"], maxLength: 2000 } } } } } }
      responses:
        "201": { description: "Imported key." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Invalid or missing key material." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/keys/generate:
    post:
      tags: [Crypto]
      operationId: cryptoKeysGenerate
      summary: Generate a new own keypair (server-side)
      description: "Identical to POST /mail/keys/generate — see that operation for the full request body (type, label, identities[], algorithm, etc.)."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [type, label, identities], properties: { type: { type: string, enum: [pgp, smime] }, label: { type: string }, identities: { type: array, items: { type: object, properties: { name: { type: [string, "null"] }, email: { type: string } } } }, passphrase: { type: [string, "null"] } } } } } }
      responses:
        "201": { description: "Generated key." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Validation error." }
        "501": { description: "Toolchain unavailable." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/keys/{key}:
    delete:
      tags: [Crypto]
      operationId: cryptoKeysDestroy
      summary: Delete an own key
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: integer } } ]
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /crypto/keyring:
    get:
      tags: [Crypto]
      operationId: cryptoKeyring
      summary: Encryption keyring (own keys + recipients)
      description: "The user's own PGP/S-MIME keys (public info only) plus saved recipients — the 'encrypt to' picker for the Files module. Own-key management is /crypto/keys; recipients are /crypto/recipients; keyservers are /crypto/key-servers."
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Keyring.", content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { type: object, properties: { id: { type: integer }, type: { type: string }, label: { type: string }, fingerprint: { type: [string, "null"] }, public_key: { type: [string, "null"] }, cert_pem: { type: [string, "null"] }, has_private: { type: boolean }, is_own: { type: boolean } } } }, recipients: { type: array, items: { $ref: '#/components/schemas/CryptoRecipient' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /crypto/keys/{key}/export:
    post:
      tags: [Crypto]
      operationId: cryptoKeysExport
      summary: Export an own key's private material (password-gated)
      description: >
        Returns the private key in the clear — the caller's current login
        password must be re-confirmed (step-up), and the export is audited
        (crypto.key.exported). PGP returns the armored private key (still
        gpg-passphrase-protected if one was set at import/generation time);
        S/MIME additionally returns the certificate PEM.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string } } } } } }
      responses:
        "200": { description: "Private key material.", content: { application/json: { schema: { type: object, properties: { private_key: { type: [string, "null"] }, cert_pem: { type: [string, "null"], description: "S/MIME only." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Wrong current password." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/key-servers:
    get:
      tags: [Crypto]
      operationId: cryptoKeyServersIndex
      summary: List configured keyservers
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: "Keyservers.", content: { application/json: { schema: { type: object, properties: { servers: { type: array, items: { $ref: '#/components/schemas/KeyServer' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Crypto]
      operationId: cryptoKeyServersStore
      summary: Add a keyserver
      description: "The URL is validated + SSRF-guarded (App\\Rules\\SafeUrl) before being saved; every subsequent request to it goes through the same outbound guard."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, url], properties: { name: { type: string, maxLength: 100 }, url: { type: string, format: uri, maxLength: 500 }, enabled: { type: [boolean, "null"] } } } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { server: { $ref: '#/components/schemas/KeyServer' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/key-servers/{keyServer}:
    put:
      tags: [Crypto]
      operationId: cryptoKeyServersUpdate
      summary: Update a keyserver
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: keyServer, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: [string, "null"], maxLength: 100 }, url: { type: [string, "null"], format: uri, maxLength: 500 }, enabled: { type: [boolean, "null"] } } } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { server: { $ref: '#/components/schemas/KeyServer' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Crypto]
      operationId: cryptoKeyServersDestroy
      summary: Remove a keyserver
      description: "Any recipients previously imported from this server are kept — only their key_server_id link is cleared (nullOnDelete)."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: keyServer, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Removed." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /crypto/key-servers/search:
    post:
      tags: [Crypto]
      operationId: cryptoKeyServersSearch
      summary: Search for public PGP keys on one or all enabled keyservers
      description: >
        HKP `op=index` search (name/email/key ID) against server_id, or every
        enabled keyserver when server_id is omitted (results merged, capped).
        PGP only — S/MIME has no keyserver protocol. Outbound requests are
        SSRF-guarded (App\Support\OutboundUrl).
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [query], properties: { query: { type: string, minLength: 1, maxLength: 200 }, server_id: { type: [integer, "null"], description: "Search only this server; omit to search all enabled servers." } } } } } }
      responses:
        "200": { description: "Matching keys.", content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { $ref: '#/components/schemas/KeyserverCandidate' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "No enabled keyservers, or an invalid server_id." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/key-servers/{keyServer}/import:
    post:
      tags: [Crypto]
      operationId: cryptoKeyServersImport
      summary: Fetch a key from a keyserver and save it as a recipient
      description: >
        Fetches the full key by key_id (HKP `op=get`), verifies the returned
        material's own re-derived fingerprint actually matches key_id/the
        search result before saving — a keyserver's self-reported metadata is
        never trusted at face value. Saved as a normal CryptoRecipient with
        key_server_id set, so it can later be refreshed.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: keyServer, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key_id, label], properties: { key_id: { type: string }, label: { type: string, maxLength: 200 } } } } } }
      responses:
        "200": { description: "The saved recipient.", content: { application/json: { schema: { type: object, properties: { recipient: { $ref: '#/components/schemas/CryptoRecipient' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Keyserver not found, or the key could not be fetched." }
        "422": { description: "The fetched material is not a valid PGP key." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/recipients:
    post:
      tags: [Crypto]
      operationId: cryptoRecipientStore
      summary: Import a recipient (public key / certificate)
      description: "Save someone else's armored PGP public key or S/MIME certificate (PEM) as a recipient you can encrypt to. Public material only."
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [type, label, material], properties: { type: { type: string, enum: [pgp, smime] }, label: { type: string, maxLength: 200 }, material: { type: string, maxLength: 100000, description: "Armored PGP public key or PEM certificate." } } } } } }
      responses:
        "200": { description: "The saved recipient.", content: { application/json: { schema: { type: object, properties: { recipient: { $ref: '#/components/schemas/CryptoRecipient' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Invalid key/certificate." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/recipients/{recipient}:
    delete:
      tags: [Crypto]
      operationId: cryptoRecipientDestroy
      summary: Remove a recipient
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: recipient, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Removed." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /crypto/recipients/{recipient}/refresh:
    post:
      tags: [Crypto]
      operationId: cryptoRecipientRefresh
      summary: Re-fetch a PGP recipient's key by fingerprint
      description: >
        PGP recipients with a fingerprint only (S/MIME has no keyserver
        equivalent → 422 no_origin_server). A recipient with key_server_id
        set (imported via a keyserver search) is re-fetched from exactly
        that server; the freshly-fetched key's own re-derived fingerprint
        must match the one already stored — a mismatch (a compromised/
        misbehaving server serving different key material under the same
        id) is rejected, not applied. A recipient with no known origin
        (key_server_id null — e.g. manually pasted before any keyserver was
        configured) is instead searched across every enabled keyserver on
        the account; the first one that verifiably has this exact
        fingerprint is adopted as its key_server_id going forward.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: recipient, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "The refreshed recipient (key_server_id may now be set, if it previously wasn't).", content: { application/json: { schema: { type: object, properties: { recipient: { $ref: '#/components/schemas/CryptoRecipient' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "not_found — the key is not (or no longer) available on the recipient's origin server, or on any enabled server when it had none." }
        "422": { description: "no_origin_server (not PGP, or no fingerprint to search with), no_servers (no enabled keyservers configured), or fingerprint_mismatch (only on the known-origin path — the server answered with a different key)." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/keys/{key}/publish:
    post:
      tags: [Crypto]
      operationId: cryptoKeysPublish
      summary: Publish an own PGP key's public part to a keyserver
      description: "PGP only (S/MIME has no keyserver protocol → 422 not_pgp). POSTs the armored public key to the server's HKP /pks/add. Best-effort — some servers (e.g. keys.openpgp.org) require out-of-band email verification and may silently ignore a classic /pks/add submission."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [server_id], properties: { server_id: { type: integer } } } } } }
      responses:
        "200": { description: "Upload attempted.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "not_pgp, or the key has no public material." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /crypto/keys/{key}/check-presence:
    post:
      tags: [Crypto]
      operationId: cryptoKeysCheckPresence
      summary: Check whether an own PGP key is already on each configured keyserver
      description: >
        Fetches the key by its own fingerprint from every enabled keyserver
        and re-derives the fetched material's fingerprint locally to confirm
        an exact match — never trusts a server's self-reported presence.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: "Per-server presence.", content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { $ref: '#/components/schemas/KeyserverPresenceResult' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "not_pgp." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /files/stats:
    get:
      tags: [Files]
      operationId: filesStats
      summary: Storage stats — size by type + suspected duplicates (by sha256)
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: Stats., content: { application/json: { schema: { type: object, properties: { used: { type: integer }, by_type: { type: object, additionalProperties: { type: integer } }, duplicates: { type: array, items: { type: array, items: { type: object } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /invoices/ocr:
    post:
      tags: [Finance]
      operationId: invoicesOcr
      summary: OCR a receipt to line-structured text (transient plaintext)
      description: >
        Transient server-side OCR. The client POSTs the raw document bytes ONLY for
        text extraction; the server processes them in a shredded temp file, returns
        line-structured text, and stores/logs NOTHING (Cache-Control: no-store). The
        receipt file itself is stored separately as a plaintext blob via
        POST /finance/transactions/{transaction}/receipts (and invoice PDFs via
        POST /finance/invoices/{invoice}/pdf). The server returns ONLY text — it does
        NOT parse total/merchant/date/VAT (that recognition stays client-side and is
        identical across web/iOS/Android). PDFs use the embedded text layer when
        present (fast path, `source: pdf-text`), otherwise rasterise+OCR
        (`source: ocr`, ≤30 pages); images are OCR'd directly. `text` preserves visual
        line breaks (`\n`). Best-effort: a 501/timeout leaves manual entry intact.
        Requires the `finance` module. Throttle: 120 req/min (the receipt inbox
        fires one call per file sequentially for a batch upload).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The raw document bytes. Allowed: image/jpeg,png,gif,webp,bmp,tiff,avif
                    or application/pdf. Max 25 MiB.
                lang:
                  type: string
                  pattern: "^[a-z]{3}(\\+[a-z]{3})*$"
                  description: "Tesseract language string; default deu+eng."
                force_ocr:
                  type: boolean
                  description: >
                    Force rasterise+OCR of a PDF, skipping the embedded text layer.
                    Use when that layer is justified-mangled (spaces baked mid-word,
                    e.g. "Softw are"). Ignored for images. Default false.
      responses:
        "200":
          description: Extracted text.
          content:
            application/json:
              schema:
                type: object
                required: [text, source, pages]
                properties:
                  text:
                    type: string
                    description: Line-structured plain text (one visual line per newline).
                  source:
                    type: string
                    enum: [pdf-text, ocr]
                    description: "pdf-text = PDF embedded text layer; ocr = rasterised/scanned."
                  pages:
                    type: integer
                    description: Informational page count.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: File exceeds the 25 MiB OCR size limit.
        "415":
          description: Unsupported document type.
        "422":
          description: >
            Either the request failed validation (missing/invalid `file`, a `lang`
            not matching ^[a-z]{3}(\+[a-z]{3})*$, or a non-boolean `force_ocr`) →
            standard Laravel body { message, errors }; OR OCR ran but produced no
            usable text → { error: "no_text" }.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - type: object
                    required: [error]
                    properties:
                      error: { type: string, enum: [no_text] }
        "429":
          description: Rate limit exceeded (Retry-After header).
        "501":
          description: OCR toolchain not available on this server (client falls back to manual entry).

  /company:
    get:
      tags: [Company]
      operationId: companyShow
      summary: Read the caller's company profile + invoice defaults
      description: >
        The user's own business identity and invoice settings (name, address, tax/VAT
        ids, bank details, number format + next number, default VAT rate, payment terms,
        template, accent/heading colours). Non-secret — served in the clear. `has_logo`
        indicates whether a company logo is stored (fetch it at /company/logo).
      responses:
        "200":
          description: The company profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: "#/components/schemas/CompanyProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Company]
      operationId: companyUpdate
      summary: Update the caller's company profile
      description: >
        Update any subset of the company/invoice fields. Send JSON, or multipart to
        also set a raster `logo` (png/jpg/gif/webp, ≤2 MB; inline SVG is rejected as a
        stored-XSS vector) or `remove_logo=true`. Throttle 60/min.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyProfile" }
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/CompanyProfile"
                - type: object
                  properties:
                    logo: { type: string, format: binary }
                    remove_logo: { type: boolean }
      responses:
        "200":
          description: Saved profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: "#/components/schemas/CompanyProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Rate limit exceeded. }

  /company/logo:
    get:
      tags: [Company]
      operationId: companyLogo
      summary: Stream the caller's company logo
      description: >
        Returns the stored raster logo inline (sandboxed, nosniff). 404 if none is set.
        Throttle 120/min.
      responses:
        "200":
          description: The logo image bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No logo stored. }

  # ── Per-user non-display settings (notify channels + file version cap) ──
  /settings:
    get:
      tags: [Preferences]
      operationId: settingsShow
      summary: Read the caller's per-user settings
      description: >
        Non-secret per-user settings a mobile client needs beyond display prefs:
        the personal file version cap.
      responses:
        "200": { description: "Settings.", content: { application/json: { schema: { $ref: "#/components/schemas/UserSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: settingsUpdate
      summary: Update per-user settings (partial)
      description: "Updates any subset; unspecified keys are left unchanged. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSettings" }
      responses:
        "200": { description: "Updated settings.", content: { application/json: { schema: { $ref: "#/components/schemas/UserSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Rate limit exceeded. }

  # ── Owner-side device pairing ──
  /device-pairings:
    post:
      tags: [DevicePairings]
      operationId: devicePairingStore
      summary: Generate a pairing code + QR (owner)
      description: "The owner (already paired) starts pairing a NEW device: returns a pairing id + QR data-URI carrying a short-lived one-time code (never a token). Throttle 20/min."
      responses:
        "200": { description: "Pairing started.", content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: integer, format: int64 }, qr: { type: string, description: "SVG data-URI." }, expires_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Rate limit exceeded. }
  /device-pairings/cli:
    post:
      tags: [DevicePairings]
      operationId: devicePairingStoreCli
      summary: Generate a CLI pairing code (owner)
      description: "Like /device-pairings but returns a copyable text code (60s TTL) for a CLI client. Throttle 20/min."
      responses:
        "200": { description: "Pairing started.", content: { application/json: { schema: { type: object, required: [id, code], properties: { id: { type: integer, format: int64 }, code: { type: string }, expires_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Rate limit exceeded. }
  /device-pairings/{devicePairing}:
    get:
      tags: [DevicePairings]
      operationId: devicePairingShow
      summary: Poll a pairing's state (owner)
      description: "Owner-scoped (foreign pairing → 404). Returns the current status + the claiming device name."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "State.", content: { application/json: { schema: { type: [object, "null"], properties: { status: { type: string, enum: [pending, pending_approval, approved, rejected, consumed, expired] }, device_name: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /device-pairings/{devicePairing}/approve:
    post:
      tags: [DevicePairings]
      operationId: devicePairingApprove
      summary: Approve the claimed device (owner)
      description: "Owner-scoped. After approval the new device's POST /auth/pair/collect returns its token. Throttle 20/min."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "Approved.", content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Pairing is not awaiting approval (wrong state or expired)." }
        "429": { description: Rate limit exceeded. }
  /device-pairings/{devicePairing}/reject:
    post:
      tags: [DevicePairings]
      operationId: devicePairingReject
      summary: Reject the claimed device (owner)
      description: "Owner-scoped. Throttle 20/min."
      parameters: [{ name: devicePairing, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "Rejected.", content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: "Pairing code expired (Gone)." }

  # ── 2FA + app password (self-service) ──
  /user/two-factor/enable:
    post:
      tags: [TwoFactor]
      operationId: twoFactorEnable
      summary: Enable TOTP (generate secret + recovery codes)
      description: "Generates a new TOTP secret + recovery codes (stored encrypted). NOT yet active — call /confirm with a live code. Idempotent. Requires `current_password` (guard-agnostic Hash::check) on EVERY path — web and native alike; native device tokens no longer bypass it (max-security, internet-facing). Throttle 10/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  format: password
                  description: "Required on every path (web + native). 422 {errors:{current_password}} if missing/wrong."
      responses:
        "200": { description: "Secret generated.", content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, enum: [true] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Rate limit exceeded. }
  /user/two-factor/qr:
    get:
      tags: [TwoFactor]
      operationId: twoFactorQr
      summary: Get the TOTP QR + secret + otpauth URI
      description: "ENROLLMENT-ONLY: available only in the window between enable and confirm. Once 2FA is confirmed the secret is never handed out again (a stolen device token must not be able to reproduce the second factor). 404 if 2FA not enabled OR already confirmed. Throttle 60/min."
      responses:
        "200": { description: "QR data.", content: { application/json: { schema: { type: object, required: [svg, secret, uri], properties: { svg: { type: string }, secret: { type: string }, uri: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 2FA not enabled, or already confirmed. }
  /user/two-factor/confirm:
    post:
      tags: [TwoFactor]
      operationId: twoFactorConfirm
      summary: Confirm 2FA with a live TOTP code
      description: "Validates the code and activates 2FA (sets two_factor_confirmed_at). 422 on wrong/expired code. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: "Confirmed.", content: { application/json: { schema: { type: object, properties: { confirmed: { type: boolean, enum: [true] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Invalid/expired code. }
        "429": { description: Rate limit exceeded. }
  /user/two-factor/recovery-codes:
    post:
      tags: [TwoFactor]
      operationId: twoFactorRecoveryCodes
      summary: List recovery codes
      description: "POST (not GET): the `current_password` step-up travels in the JSON body, never a query string — a password in a URL leaks into access/request logs, history and proxies (and OkHttp forbids a GET body). Only after 2FA is confirmed (else 404). Throttle 60/min."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password, description: "Required on every path (web + native); native device tokens no longer bypass it. 422 if missing/wrong." } } } } }
      responses:
        "200": { description: "Codes.", content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 2FA not active. }
        "422": { $ref: "#/components/responses/ValidationError" }
  /user/two-factor/recovery-codes/regenerate:
    post:
      tags: [TwoFactor]
      operationId: twoFactorRegenerateRecoveryCodes
      summary: Regenerate recovery codes
      description: "Invalidates the old set and returns a fresh one. Requires a fresh `current_password` step-up. Throttle 10/min."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password, description: "Required on every path (web + native); native device tokens no longer bypass it. 422 if missing/wrong." } } } } }
      responses:
        "200": { description: "New codes.", content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Rate limit exceeded. }
  /user/two-factor:
    delete:
      tags: [TwoFactor]
      operationId: twoFactorDisable
      summary: Disable 2FA
      description: "Clears the TOTP secret, recovery codes, and confirmed flag. Idempotent. Requires a fresh `current_password` step-up so a stolen device token cannot disable 2FA. Throttle 10/min."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password, description: "Required on every path (web + native); native device tokens no longer bypass it. 422 if missing/wrong." } } } } }
      responses:
        "200": { description: "Disabled.", content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, enum: [false] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /user/passkeys:
    get:
      tags: [Passkeys]
      operationId: passkeysIndex
      summary: List the current user's passkeys
      responses:
        "200":
          description: Owner-scoped passkeys + whether WebAuthn is configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys: { type: array, items: { $ref: '#/components/schemas/WebauthnCredential' } }
                  enabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Passkeys]
      operationId: passkeysRegister
      summary: Register a new passkey (verify attestation)
      description: >
        Verifies the attestation from navigator.credentials.create() against the
        cached challenge and stores the credential (public-key only). Requires a
        fresh `current_password` step-up. Throttle 20/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, current_password]
              properties:
                credential: { type: object, additionalProperties: true, description: "Serialized PublicKeyCredential (attestation)." }
                name: { type: [string, "null"], maxLength: 120 }
                current_password: { type: string, format: password }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnCredential' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: '#/components/responses/RateLimited' }
  /user/passkeys/options:
    post:
      tags: [Passkeys]
      operationId: passkeysRegisterOptions
      summary: WebAuthn attestation (creation) options for the current user
      description: "Standard PublicKeyCredentialCreationOptionsJSON; feed to navigator.credentials.create(). Challenge cached per user. Throttle 30/min."
      responses:
        "200": { description: "Creation options JSON.", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: '#/components/responses/RateLimited' }
  /user/passkeys/{credential}:
    put:
      tags: [Passkeys]
      operationId: passkeysRename
      summary: Rename a passkey
      parameters:
        - { name: credential, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 120 } } } } }
      responses:
        "200": { description: OK. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Passkeys]
      operationId: passkeysDestroy
      summary: Remove a passkey
      parameters:
        - { name: credential, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /user/password:
    put:
      tags: [TwoFactor]
      operationId: userPasswordUpdate
      summary: Change the app login password
      description: >
        Validates `current_password` (guard-agnostic Hash::check — Fortify's
        current_password:web rule would fail for a bearer token) and sets a new
        password (min 12, confirmed).
        Throttle 10/min.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [current_password, password, password_confirmation], properties: { current_password: { type: string }, password: { type: string, minLength: 12 }, password_confirmation: { type: string } } }
      responses:
        "200": { description: "Changed.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Wrong current password or invalid new password. }
        "429": { description: Rate limit exceeded. }
  /user/email/verify/resend:
    post:
      tags: [TwoFactor]
      operationId: emailVerifyResend
      summary: Re-send the e-mail verification link
      description: "No-op (ok:true) when already verified. Needs SMTP configured. Throttle 60/min."
      responses:
        "200": { description: "Queued (or already verified).", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Rate limit exceeded. }

  # ── Admin: users ──
  /users:
    get:
      tags: [Users]
      operationId: usersIndex
      summary: List users (admin)
      description: "All users with effective limits, groups, 2FA/verified state, and last login. No credentials. Admin-gated (403 otherwise)."
      responses:
        "200": { description: "Users.", content: { application/json: { schema: { type: object, required: [users], properties: { users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: usersStore
      summary: Create a user (admin)
      description: "role/quotas/modules are privilege fields (set server-side, never mass-assigned). Omit password to send a reset mail (if SMTP on). Throttle 60/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/AdminUser" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Rate limit exceeded. }
  /users/{user}:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Users]
      operationId: usersUpdate
      summary: Update a user (admin)
      description: "Password prohibited (use reset-password). Guards: cannot demote the last admin. Throttle 60/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/AdminUser" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Validation failed, or the last-admin guard tripped." }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Users]
      operationId: usersDestroy
      summary: Delete a user (admin, GDPR crypto-shred)
      description: "Purges the user + all owned data. Cannot delete self or the last admin. Throttle 10/min."
      responses:
        "204": { description: Deleted (no content). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Self-delete or last-admin guard." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /users/{user}/reset-password:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersResetPassword
      summary: Send a password-reset mail (admin)
      description: "422 when SMTP is not configured (use invite-link instead). Throttle 10/min."
      responses:
        "200": { description: "Sent.", content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: SMTP not configured. }
        "429": { $ref: "#/components/responses/RateLimited" }
  /users/{user}/reset-2fa:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersResetTwoFactor
      summary: Clear a user's 2FA (admin recovery)
      description: "Nulls the TOTP secret/codes/confirmed flag. Throttle 10/min."
      responses:
        "200": { description: "Cleared.", content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /users/{user}/avatar:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Users]
      operationId: usersAvatar
      summary: Stream a user's avatar (admin)
      description: "Non-secret. 404 if none stored."
      responses:
        "200": { description: "Image.", content: { image/*: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No avatar stored (or user not found). }
  /users/{user}/invite-link:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Users]
      operationId: usersInviteLink
      summary: Generate a one-time login/password-set link (admin)
      description: "Single-use, time-limited link; the plaintext token appears only in `url` (never stored/logged — only its SHA-256). Optionally emails it. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ttl_hours], properties: { ttl_hours: { type: integer, enum: [1, 24, 168, 720] }, send: { type: boolean, default: false } } } } } }
      responses:
        "200": { description: "Link.", content: { application/json: { schema: { type: object, required: [url, sent], properties: { url: { type: string, format: uri }, expires_at: { type: string, format: date-time }, sent: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Rate limit exceeded. }

  # ── Admin: security log ──
  /security-log:
    get:
      tags: [SecurityLog]
      operationId: securityLogIndex
      summary: List audit-log entries (admin, read-only)
      description: "Paginated, filterable audit trail. Metadata-only. Admin-gated. Throttle 60/min."
      parameters:
        - { name: action, in: query, schema: { type: string }, description: "Exact action, or a `prefix.*` group match." }
        - { name: user, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string }, description: "ISO-8601 or -24h/-7d." }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200": { description: "Entries.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/SecurityLogEntry" } }, meta: { type: object, properties: { total: { type: integer }, per_page: { type: integer }, current_page: { type: integer }, last_page: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /security-log/export:
    get:
      tags: [SecurityLog]
      operationId: securityLogExport
      summary: Export the audit log (admin, CSV/NDJSON)
      description: "Streamed, capped 10000, same filters as index. CSV cells are formula-injection-neutralised. Throttle 10/min."
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: limit, in: query, schema: { type: integer, default: 10000, maximum: 10000 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: user, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string } }
      responses:
        "200": { description: "Stream.", content: { text/csv: { schema: { type: string, format: binary } }, application/x-ndjson: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ── Per-user Paperless ──
  /paperless/terms:
    get:
      tags: [Paperless]
      operationId: paperlessTerms
      summary: Cached Paperless term quick-picks
      description: "{configured, tags, document_types, correspondents} from the local cache (no live call). Throttle 60/min."
      responses:
        "200": { description: "Terms.", content: { application/json: { schema: { type: object, required: [configured, tags, document_types, correspondents], properties: { configured: { type: boolean }, tags: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } }, document_types: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } }, correspondents: { type: array, items: { $ref: "#/components/schemas/PaperlessTerm" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Paperless]
      operationId: paperlessCreateTerm
      summary: Create a Paperless tag / document type / correspondent
      description: "Creates it in the live Paperless + caches. 422 if not configured or the call fails. Throttle 60/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, name], properties: { kind: { type: string, enum: [tag, document_type, correspondent] }, name: { type: string, maxLength: 255 } } } } } }
      responses:
        "200": { description: "Created/found.", content: { application/json: { schema: { type: object, required: [ok, id, name], properties: { ok: { type: boolean }, id: { type: integer }, name: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Not configured / validation / Paperless error. }
        "429": { $ref: "#/components/responses/RateLimited" }
  /paperless/documents:
    post:
      tags: [Paperless]
      operationId: paperlessSubmit
      summary: Forward a decrypted document to Paperless (transient cleartext)
      description: >
        **Transient-cleartext boundary** (like POST /invoices/ocr):
        the client posts the already-decrypted bytes; the server forwards them to
        the user's own Paperless and stores/logs nothing (`Cache-Control: no-store`).
        Returns the Paperless async task id. Throttle 20/min.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: "Decrypted PDF/image, max 50 MB." }, title: { type: string, maxLength: 255 }, created: { type: string, format: date }, correspondent: { type: integer }, document_type: { type: integer }, tags: { type: array, items: { type: integer } } } }
      responses:
        "200": { description: "Accepted.", content: { application/json: { schema: { type: object, required: [ok, task], properties: { ok: { type: boolean }, task: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: File exceeds 50 MB. }
        "422": { description: Not configured / validation / Paperless error. }
        "429": { $ref: "#/components/responses/RateLimited" }
  /paperless/sync:
    post:
      tags: [Paperless]
      operationId: paperlessSync
      summary: Refresh the cached Paperless terms from the live instance
      description: "Pulls all tags/document types/correspondents into the cache. {ok, counts}. Empty counts when unconfigured (no error). Throttle 20/min."
      responses:
        "200": { description: "Synced.", content: { application/json: { schema: { type: object, required: [ok, counts], properties: { ok: { type: boolean }, counts: { type: object, properties: { tag: { type: integer }, document_type: { type: integer }, correspondent: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Paperless error. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /paperless/config:
    get:
      tags: [Paperless]
      operationId: paperlessConfigShow
      summary: Per-user Paperless connection config
      description: "Instance URL + enabled flag + has_token (the API token is never returned) + cached term counts. Throttle 60/min."
      responses:
        "200": { description: "Config.", content: { application/json: { schema: { $ref: "#/components/schemas/PaperlessConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Paperless]
      operationId: paperlessConfigUpdate
      summary: Update the per-user Paperless config
      description: "Sets URL / enabled / token. A blank/omitted token preserves the stored one; the token is never returned. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paperless_enabled: { type: boolean }
                paperless_url: { type: [string, "null"], format: uri, maxLength: 255 }
                paperless_token: { type: [string, "null"], maxLength: 255, description: "Blank/omitted keeps the stored token." }
      responses:
        "200": { description: "Updated config.", content: { application/json: { schema: { $ref: "#/components/schemas/PaperlessConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /paperless/config/test:
    post:
      tags: [Paperless]
      operationId: paperlessConfigTest
      summary: Test the Paperless connection
      description: "Pings Paperless using the posted URL+token (falling back to the stored ones). SSRF-guarded. Throttle 20/min."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paperless_url: { type: [string, "null"], format: uri }
                paperless_token: { type: [string, "null"] }
      responses:
        "200": { description: "Result (200 even on failure; check `ok`).", content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean }, detail: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ── Admin: settings ──
  /admin/notifications:
    get:
      tags: [Settings]
      operationId: adminNotificationsShow
      summary: Notification config (admin)
      description: "SMTP/NTFY/webhook config. Secret values are NEVER returned — has_smtp_password / has_ntfy_token / has_webhook_secret booleans instead."
      responses:
        "200": { description: "Config.", content: { application/json: { schema: { $ref: "#/components/schemas/NotificationConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminNotificationsUpdate
      summary: Update notification config (admin)
      description: "Only submitted fields are persisted. A blank secret field preserves the stored value. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationConfigWrite" }
      responses:
        "200": { description: "Updated config (secrets masked).", content: { application/json: { schema: { $ref: "#/components/schemas/NotificationConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/notifications/test:
    post:
      tags: [Settings]
      operationId: adminNotificationsTest
      summary: Send a test notification (admin)
      description: "Sends a test message over one channel using the saved settings. A connection/send FAILURE returns 200 {ok:false, detail} (unified test-endpoint convention, matches backup/destinations/test); only request validation is 422. Throttle 20/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [mail, ntfy, webhook] }
      responses:
        "200": { description: "{ ok: boolean, detail?: string } — ok:false means the test send failed.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, detail: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Request validation failed (bad channel)." }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/security:
    get:
      tags: [Settings]
      operationId: adminSecurityShow
      summary: Security policy (admin)
      description: "Workspace paired-device cap, password policy (min length + required classes + breach check) and the force-2FA toggle."
      responses:
        "200": { description: "Policy.", content: { application/json: { schema: { $ref: "#/components/schemas/SecurityPolicy" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminSecurityUpdate
      summary: Update security policy (admin)
      description: "Sets the device cap (1–100) plus the password policy + force-2FA. Audits the diff. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_connected_devices]
              properties:
                max_connected_devices: { type: integer, minimum: 1, maximum: 100 }
                pw_min_length: { type: [integer, "null"], minimum: 8, maximum: 128 }
                pw_require_mixed_case: { type: boolean }
                pw_require_numbers: { type: boolean }
                pw_require_symbols: { type: boolean }
                pw_check_breaches: { type: boolean }
                force_2fa: { type: boolean }
      responses:
        "200": { description: "Updated policy.", content: { application/json: { schema: { $ref: "#/components/schemas/SecurityPolicy" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/limits:
    get:
      tags: [Settings]
      operationId: adminLimitsShow
      summary: Session/auth lifetimes, retention windows, Files quota (admin)
      description: "Admin-editable workspace limits; each overlays a config('...') key at boot. NULL inherits the env/config default. Returns stored overrides + effective values."
      responses:
        "200": { description: "Limits.", content: { application/json: { schema: { type: object, properties: { settings: { type: object }, effective: { type: object } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminLimitsUpdate
      summary: Update workspace limits (admin)
      description: "Set any of: sanctum_expiration_minutes, session_lifetime_minutes, device_wipe_grace_minutes, device_idle_days, audit/access_log/request_log retention days, backup_stale_hours, mail_log_retention_days, mail_blob_orphan_grace_hours, files_quota_mb. null clears an override. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: [integer, "null"] }
      responses:
        "200": { description: "Saved.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/files-limits:
    get:
      tags: [Settings]
      operationId: adminFilesLimitsShow
      summary: Workspace Files limits (admin)
      description: "Effective max upload size (MB) and orphan-blob grace window (hours) — the admin override, or the config default."
      responses:
        "200": { description: "Limits.", content: { application/json: { schema: { $ref: "#/components/schemas/FilesLimits" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminFilesLimitsUpdate
      summary: Update workspace Files limits (admin)
      description: "Sets either/both limits; unspecified keys are unchanged. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files_max_upload_mb: { type: integer, minimum: 1, maximum: 1048576 }
                files_blob_orphan_grace_hours: { type: integer, minimum: 0, maximum: 8760 }
      responses:
        "200": { description: "Updated limits.", content: { application/json: { schema: { $ref: "#/components/schemas/FilesLimits" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/virustotal:
    get:
      tags: [Settings]
      operationId: adminVirusTotalShow
      summary: VirusTotal integration status (admin)
      description: "Returns only whether an encrypted API key is configured; the key is never returned."
      responses:
        "200": { description: "Configuration status." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminVirusTotalUpdate
      summary: Verify and save the encrypted VirusTotal API key (admin)
      description: "Validates the key against VirusTotal before saving it. The fixed public EICAR hash is queried; no user file bytes are sent. The key is not changed when validation fails."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: "Verified and saved." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "The key is missing or was rejected by VirusTotal." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "VirusTotal could not be reached; the key was not saved." }
  /admin/dashboard:
    get:
      tags: [Settings]
      operationId: adminDashboard
      summary: Admin overview dashboard (admin)
      description: "Read-only aggregate for the admin dashboard: app/PHP/Laravel versions, DB+cache health, disk + per-module storage + growth trend, worker queue depth/failed, scheduled-task liveness, error + backup status, and fleet counts (users/sessions/devices/blocked). Container CPU/mem come from /admin/docker/containers."
      responses:
        "200":
          description: "Dashboard snapshot."
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: object, properties: { app: { type: string }, php: { type: string }, laravel: { type: string } } }
                  health: { type: object, properties: { database: { type: string }, cache: { type: string }, queue_driver: { type: string } } }
                  resources: { type: object }
                  queue: { type: object, properties: { pending: { type: integer }, failed: { type: integer } } }
                  scheduler: { type: object }
                  errors: { type: object }
                  backup: { type: object }
                  counts: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/gallery:
    get:
      tags: [Settings]
      operationId: adminGalleryShow
      summary: Gallery & ML settings + status (admin)
      description: "ML feature flags/models/thresholds (stored overrides + effective values), sidecar reachability, worker queue depth + failed count, library counts, and the operator commands for restarting/updating the ML container (the app never runs docker itself)."
      responses:
        "200":
          description: "Settings + status."
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { type: object, description: "Stored overrides; null = inherit env/config." }
                  effective: { type: object, description: "Values actually in effect." }
                  status: { type: object, properties: { sidecar: { type: string, enum: [up, down, disabled, unconfigured] }, queue: { type: object, properties: { pending: { type: integer }, failed: { type: integer } } }, counts: { type: object } } }
                  operator: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: adminGalleryUpdate
      summary: Update Gallery & ML settings (admin)
      description: "Override ML flags/models/thresholds. null clears an override (inherit the env/config default). Applies to config('ml.*') at the next boot (cache busted immediately). Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ml_enabled: { type: [boolean, "null"] }
                ml_face_enabled: { type: [boolean, "null"] }
                ml_url: { type: [string, "null"] }
                ml_clip_model: { type: [string, "null"] }
                ml_face_model: { type: [string, "null"] }
                ml_search_distance: { type: [number, "null"] }
                ml_dup_distance: { type: [number, "null"] }
                ml_face_min_score: { type: [number, "null"] }
                ml_face_match_distance: { type: [number, "null"] }
      responses:
        "200": { description: "Saved.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/gallery/queue/clear:
    post:
      tags: [Settings]
      operationId: adminGalleryQueueClear
      summary: Clear pending worker jobs (admin)
      description: "Removes the pending backlog for the default queue (does not kill the job currently running). Throttle 20/min."
      responses:
        "200": { description: "Cleared.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, pending: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/gallery/queue/retry:
    post:
      tags: [Settings]
      operationId: adminGalleryQueueRetry
      summary: Retry failed jobs (admin)
      responses:
        "200": { description: "Requeued.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/gallery/queue/flush:
    post:
      tags: [Settings]
      operationId: adminGalleryQueueFlush
      summary: Delete failed jobs (admin)
      responses:
        "200": { description: "Flushed.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/gallery/reprocess:
    post:
      tags: [Settings]
      operationId: adminGalleryReprocess
      summary: Re-queue ML processing site-wide (admin)
      description: "Re-queue face detection / CLIP embeddings / EXIF re-read across the whole library. Throttle 60/min."
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { scope: { type: string, enum: [faces, embeddings, exif, all], default: all } } } } } }
      responses:
        "200": { description: "Queued.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, queued: { type: integer }, scope: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/docker/containers:
    get:
      tags: [Settings]
      operationId: adminDockerContainers
      summary: List compose services + state (admin)
      description: "Proxies the bounded docker-control agent sidecar. When the agent is not configured (no token) or unreachable, returns configured/reachable flags + operator commands instead. The app never touches the docker socket."
      responses:
        "200":
          description: "Services (or a not-configured / not-reachable payload)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  reachable: { type: boolean }
                  services: { type: array, items: { type: object, properties: { service: { type: string }, state: { type: string }, status: { type: string }, image: { type: string }, cpu: { type: string, description: "Live CPU%, e.g. 0.50%." }, mem: { type: string, description: "Live memory usage, e.g. 120MiB / 8GiB." }, mem_perc: { type: string } } } }
                  operator: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/docker/action:
    post:
      tags: [Settings]
      operationId: adminDockerAction
      summary: Run an allowlisted action on a compose service (admin)
      description: "Bounded control via the agent sidecar: restart/stop/start/recreate/pull/logs on a validated project service. Not arbitrary docker. 503 when the agent is unconfigured/unreachable. Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, action]
              properties:
                service: { type: string, maxLength: 64 }
                action: { type: string, enum: [restart, stop, start, recreate, pull, logs] }
      responses:
        "200": { description: "Result (ok + output).", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, action: { type: string }, service: { type: string }, output: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "Agent unconfigured or unreachable." }

  /admin/system:
    get:
      tags: [Settings]
      operationId: adminSystemShow
      summary: System / maintenance overview (admin, read-only)
      description: "Operational status snapshot (queue/storage/backup/scheduler/disk), scheduled-task liveness, the in-app error log and recent audit trail. Metadata only. Throttle 60/min."
      responses:
        "200": { description: "Overview.", content: { application/json: { schema: { $ref: "#/components/schemas/SystemOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/system/errors/{error}/resolve:
    post:
      tags: [Settings]
      operationId: adminSystemResolveError
      summary: Resolve an error event (admin)
      description: "Marks a recorded error as resolved (it reappears if it recurs). Throttle 60/min."
      parameters: [{ name: error, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Resolved.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ── Admin: backup ──
  /backup/destinations:
    get:
      tags: [Backup]
      operationId: backupDestinationsIndex
      summary: List backup destinations (admin)
      description: "Credentials (`config`) are NEVER returned — only {id, name, driver}."
      responses:
        "200": { description: "Destinations.", content: { application/json: { schema: { type: object, properties: { destinations: { type: array, items: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Backup]
      operationId: backupDestinationsStore
      summary: Create a backup destination (admin)
      description: "Runs a reachability gate before saving. Credentials never echoed back. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { destination: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Validation failed, or the destination is unreachable (the reachability gate surfaces as a 422 on `name`)." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/destinations/{destination}:
    parameters: [{ name: destination, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Backup]
      operationId: backupDestinationsUpdate
      summary: Update a backup destination (admin)
      description: "Blank secret/password fields keep the stored value. Runs the reachability gate. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { destination: { $ref: "#/components/schemas/BackupDestinationSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Validation failed, or the destination is unreachable." }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Backup]
      operationId: backupDestinationsDestroy
      summary: Delete a backup destination (admin)
      description: "Throttle 20/min."
      responses:
        "204": { description: Deleted (no content). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/destinations/test:
    post:
      tags: [Backup]
      operationId: backupDestinationsTest
      summary: Test destination reachability (admin)
      description: "Tests a config (from the body, or an existing destination via destination_id) without saving. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupDestinationWrite" } } } }
      responses:
        "200": { description: "Result — {ok:true} or {ok:false, detail:<error chain>}.", content: { application/json: { schema: { type: [object, "null"], properties: { ok: { type: boolean }, detail: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/jobs:
    get:
      tags: [Backup]
      operationId: backupJobsIndex
      summary: List backup jobs + statistics (admin)
      description: "`passphrase` is NEVER returned."
      responses:
        "200": { description: "Jobs.", content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { $ref: "#/components/schemas/BackupJobSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Backup]
      operationId: backupJobsStore
      summary: Create a backup job (admin)
      description: "422 only when encrypt=true and no passphrase is available (job passphrase blank + no BACKUP_PASSPHRASE env). DB-dump encryption is recommended (cleartext PII) but not forced. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupJobWrite" } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, properties: { job: { $ref: "#/components/schemas/BackupJobSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "Validation failed, or encrypt=true without an available passphrase (job passphrase blank and no BACKUP_PASSPHRASE env)." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/jobs/{job}:
    parameters: [{ name: job, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Backup]
      operationId: backupJobsUpdate
      summary: Update a backup job (admin)
      description: "Blank passphrase keeps the stored value. Throttle 20/min."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BackupJobWrite" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { type: object, properties: { job: { $ref: "#/components/schemas/BackupJobSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Backup]
      operationId: backupJobsDestroy
      summary: Delete a backup job (admin)
      description: "Throttle 20/min."
      responses:
        "204": { description: Deleted (no content). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/jobs/{job}/run:
    parameters: [{ name: job, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupJobsRun
      summary: Trigger a backup run now (admin)
      description: "Dispatches the job to the queue. Throttle 10/min."
      responses:
        "200": { description: "Dispatched.", content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs:
    get:
      tags: [Backup]
      operationId: backupRunsIndex
      summary: List recent backup runs (admin)
      description: "The 20 most recent runs (reaps stale running rows first)."
      responses:
        "200": { description: "Runs.", content: { application/json: { schema: { type: object, properties: { runs: { type: array, items: { $ref: "#/components/schemas/BackupRunSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /backup/runs/{run}/download:
    parameters:
      - { name: run, in: path, required: true, schema: { type: integer } }
      - { name: source, in: query, required: true, schema: { type: string, enum: [database, invoices, files, gallery, mail, notes, avatars] }, description: "Which source's archive in the run's batch to download." }
    get:
      tags: [Backup]
      operationId: backupRunsDownload
      summary: Download one source's archive from a run's batch (admin)
      description: "Streams the raw archive bytes for the given source (may be encrypted)."
      responses:
        "200": { description: "Archive bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Not found — run missing, not successful, no such source archive, or the destination/file is gone." }
  /backup/runs/{run}/verify:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsVerify
      summary: Verify one source's archive integrity (admin)
      description: "Read-only integrity check of one source's archive in the batch. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source], properties: { source: { type: string, enum: [database, invoices, files, gallery, mail, notes, avatars] }, passphrase: { type: [string, "null"], maxLength: 255, description: "Required for encrypted (.enc) archives." } } } } } }
      responses:
        "200": { description: "Result.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, message: { type: string }, verifiedHuman: { type: [string, "null"] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Run missing or no such source archive." }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs/{run}/restore:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsRestore
      summary: Restore a blob source onto live data (admin)
      description: "Restores a blob source (files/invoices/gallery/mail/notes/avatars) in-place from its mirror back onto the live disk (additive overwrite, decrypting per-file when encrypted). DESTRUCTIVE. The database is NOT restorable via API — download the dump and run `php artisan backup:restore-db`. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source], properties: { source: { type: string, enum: [invoices, files, gallery, mail, notes, avatars] } } } } } }
      responses:
        "200": { description: "Restored.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, files: { type: integer, description: "Number of files written." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Run missing or not a successful batch." }
        "422": { description: "Restore failed, or an invalid/non-blob source (validation)." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs/{run}/cancel:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsCancel
      summary: Cancel a running backup (admin)
      description: "First call requests a graceful cancel; a second (while pending) force-finalises. Throttle 20/min."
      responses:
        "200": { description: "Result.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, forced: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /backup/runs/{run}/decrypt:
    parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Backup]
      operationId: backupRunsDecrypt
      summary: Stream a decrypted archive (admin/CLI)
      description: "Fetches an encrypted (.enc) archive for the given source, decrypts it with the passphrase, and streams the plaintext archive. Nothing is written to live data. Throttle 10/min."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [passphrase, source], properties: { source: { type: string, enum: [database, invoices, files, gallery, mail, notes, avatars] }, passphrase: { type: string, maxLength: 255 } } } } } }
      responses:
        "200": { description: "Decrypted bytes.", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Run missing, not a successful .enc archive, or the file is gone." }
        "422": { description: "Wrong passphrase or corrupt archive, or a missing `passphrase` (validation)." }
        "429": { $ref: "#/components/responses/RateLimited" }


  # --------------------------------------------------------------------------
  # Public account lifecycle (no auth) — mirrors the web Fortify pipeline.
  # --------------------------------------------------------------------------
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: authForgotPassword
      summary: Request a password-reset link (public)
      description: >
        Sends a password-reset email via the Fortify broker. Always responds with a
        generic 200 regardless of whether the email exists — the endpoint cannot be
        used to enumerate accounts. Mirrors the web forgot-password POST.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic acknowledgement (sent iff the email exists).
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: reset-link-sent } } }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: authResetPassword
      summary: Consume a password-reset token (public)
      description: >
        Resets the password using an emailed reset token. Reuses the Fortify
        ResetUserPassword action, so it applies the same password rules and acts as a
        kill switch (revokes every device token + persisted session). Returns 200 on
        success. Every non-success case (unknown email, bad/expired token, weak
        password) collapses to ONE neutral 422 `{status:"reset-failed", message}`
        (v1.562.0) — the response no longer signals account existence, so do NOT
        branch on distinct broker error codes. Mirrors the web reset-password POST.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: password-reset } } }
        "422":
          description: >
            Any failure — unknown email, invalid/expired token, or a password that
            failed the rules. The body is always the same neutral shape (no
            account-existence oracle).
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: reset-failed }, message: { type: string } } }
        "429": { $ref: '#/components/responses/RateLimited' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: Self-register a new account (public, gated)
      description: >
        Creates a new account via the Fortify CreateNewUser action. Gated by the
        workspace `allow_registration` flag — 403 when self-registration is disabled.
        The privileged `role` is never taken from input (always `user`). Because email
        verification is required, no bearer is minted until the address is verified:
        responds {status: "verify-email"} and sends the verification email. Mirrors
        the web register POST.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                device_name: { type: [string, "null"], maxLength: 64 }
      responses:
        "201":
          description: >
            Created. When email verification is pending, {status:"verify-email"} (no
            token). If verification is ever disabled, returns {token, user} instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: verify-email }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "403":
          description: Self-registration is disabled workspace-wide.
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Public file-share consumption (no auth) — the share token in the path is the
  # credential. Same controller as the web /file-share routes; a password-gated
  # share issues a stateless HMAC grant on unlock, carried on manifest/raw.
  # --------------------------------------------------------------------------
  /file-share/{token}:
    get:
      tags: [Files]
      operationId: publicFileShareMeta
      summary: Public file-share metadata (no auth)
      description: >
        Resolves a share link by its opaque token (owner scope removed; the token
        is now matched against a stored sha256 hash). Reports the target name/kind,
        whether a password is required, and the download policy. Trashing (soft-
        deleting) the shared file/folder now revokes the link — a previously-valid
        share returns 404 once its target is trashed (v1.562.0). PRIVACY: on a
        password-protected share, `name` is withheld (null) until the share is
        unlocked (valid X-Share-Grant / ?grant / session); a no-password share and
        an unlocked share return the real name.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Share metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  found: { type: boolean }
                  kind: { type: string, enum: [file, folder] }
                  name: { type: [string, "null"], description: "Null until unlocked on a password-protected share." }
                  needsPassword: { type: boolean }
                  unlocked: { type: boolean }
                  allowDownload: { type: boolean }
                  expiresAt: { type: [string, "null"], format: date-time }
        "404": { description: Unknown, expired, or trashed share (existence not leaked). }
        "429": { $ref: '#/components/responses/RateLimited' }
  /file-share/{token}/unlock:
    post:
      tags: [Files]
      operationId: publicFileShareUnlock
      summary: Unlock a password-gated public share (no auth)
      description: >
        Verifies the share password. On success returns a short-lived stateless HMAC
        `grant` (bound to this share) that a tokenless client presents on manifest/raw
        via the `X-Share-Grant` header or a `grant` query parameter. (Web clients also
        get a session grant.)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Unlocked.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, grant: { type: string } } }
        "404": { description: Unknown or expired share. }
        "422": { description: Wrong password (or the share is not password-gated). }
        "429": { $ref: '#/components/responses/RateLimited' }
  /file-share/{token}/manifest:
    get:
      tags: [Files]
      operationId: publicFileShareManifest
      summary: Public file-share manifest — the shared subtree (no auth)
      description: >
        Lists the folders + files the share exposes (a shared folder → its whole
        descendant subtree; a shared file → just it). Requires a prior unlock for a
        password-gated share (grant via `X-Share-Grant` header or `grant` query).
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: grant, in: query, required: false, schema: { type: string }, description: Stateless unlock grant (alternative to the X-Share-Grant header). }
        - { name: X-Share-Grant, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Manifest tree.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [file, folder] }
                  name: { type: string }
                  allowDownload: { type: boolean }
                  folders: { type: array, items: { type: object } }
                  files: { type: array, items: { type: object } }
        "403": { description: Locked — a valid unlock grant is required. }
        "404": { description: Unknown, expired, or trashed share. }
        "429": { $ref: '#/components/responses/RateLimited' }
  /file-share/{token}/file/{file}/raw:
    get:
      tags: [Files]
      operationId: publicFileShareRaw
      summary: Stream a shared file's bytes (no auth)
      description: >
        Streams a single file from the shared set (sandboxed CSP + nosniff). Requires
        a prior unlock for a password-gated share. `?download=1` forces an attachment
        and is refused (403) unless the owner enabled downloads.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: integer } }
        - { name: grant, in: query, required: false, schema: { type: string } }
        - { name: X-Share-Grant, in: header, required: false, schema: { type: string } }
        - { name: download, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: File bytes.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "403": { description: Locked, or a download was requested on a download-disabled share. }
        "404": { description: Unknown share or file not in the shared set (also once the file is trashed). }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # Public invite / password-reset link consumption (no auth). The admin CREATE
  # side is POST /users/{user}/invite-link.
  # --------------------------------------------------------------------------
  /invite/{invite}/{token}:
    get:
      tags: [Users]
      operationId: inviteShow
      summary: Check an invite / reset link (public)
      description: >
        Reports whether the (hashed, single-use, expiring) invite token is still
        valid, plus the target email. JSON only — never a redirect.
      security: []
      parameters:
        - { name: invite, in: path, required: true, schema: { type: integer } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Valid link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
                  email: { type: string, format: email }
                  expiresAt: { type: [string, "null"], format: date-time }
        "404": { description: "Invalid, consumed, or expired link (valid:false)." }
        "429": { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Users]
      operationId: inviteConsume
      summary: Consume an invite / reset link — set password, get a bearer (public)
      description: >
        Sets the target user's password (constant-time token check + single-use +
        expiry) and mints a device-scoped bearer token (rather than a session login).
        Consuming the link is a kill switch (v1.562.0): it REVOKES every pre-existing
        device token + web session for the account BEFORE minting the fresh bearer —
        a client holding an older token must re-authenticate.
      security: []
      parameters:
        - { name: invite, in: path, required: true, schema: { type: integer } }
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                device_name: { type: [string, "null"], maxLength: 64 }
      responses:
        "200":
          description: Password set — bearer + user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/MeUser' }
        "404": { description: Invalid, consumed, or expired link. }
        "422": { $ref: '#/components/responses/ValidationError' }
        "429": { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------
  # CardDAV Apple configuration profile download (device auth + module:contacts).
  # --------------------------------------------------------------------------
  /account/carddav-profile:
    get:
      tags: [Contacts]
      operationId: accountCarddavProfile
      summary: Download the Apple CardDAV + CalDAV .mobileconfig profile
      description: >
        Returns a downloadable Apple configuration profile provisioning BOTH a CardDAV
        account (contacts) and a CalDAV account (calendar) against the unified /dav
        server, so one install syncs contacts + calendars. Carries the username (the
        user's email) but never a password — sync uses the app-specific WebDAV password,
        of which only the hash is stored.
      responses:
        "200":
          description: Apple configuration profile.
          content:
            application/x-apple-aspen-config:
              schema: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /account/caldav-profile:
    get:
      tags: [Calendar]
      operationId: accountCaldavProfile
      summary: Download a standalone Apple CalDAV .mobileconfig profile
      description: >
        Returns a downloadable Apple configuration profile provisioning a CalDAV account
        against the unified /dav server. Standalone (CalDAV only) so it works without the
        contacts module; the combined CardDAV+CalDAV profile is on /account/carddav-profile.
        Carries the username (email) but never a password; SSL/port are derived from the
        request. Gated by device auth + module:calendar.
      responses:
        "200":
          description: Apple configuration profile.
          content:
            application/x-apple-aspen-config:
              schema: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  # --------------------------------------------------------------------------
  # Admin self-registration toggle (admin role + device token).
  # --------------------------------------------------------------------------
  /admin/registration:
    get:
      tags: [Users]
      operationId: adminRegistrationShow
      summary: Read the workspace self-registration toggle (admin)
      responses:
        "200":
          description: Current toggle state.
          content:
            application/json:
              schema: { type: object, properties: { allow_registration: { type: boolean } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Users]
      operationId: adminRegistrationUpdate
      summary: Set the workspace self-registration toggle (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_registration]
              properties:
                allow_registration: { type: boolean }
      responses:
        "200":
          description: Updated toggle state.
          content:
            application/json:
              schema: { type: object, properties: { allow_registration: { type: boolean } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }

  # ── Security portal (admin) ──
  /admin/request-log:
    get:
      tags: [SecurityPortal]
      operationId: adminRequestLog
      summary: List HTTP request-trail rows (admin)
      description: "Paginated, filterable verbose request log. Metadata only. Admin-gated. Throttle 120/min."
      parameters:
        - { name: ip, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: method, in: query, schema: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string }, description: "Substring match." }
        - { name: since, in: query, schema: { type: string }, description: "ISO-8601 or -24h/-7d." }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200": { description: "Rows.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/RequestLogEntry" } }, meta: { type: object, properties: { total: { type: integer }, current_page: { type: integer }, last_page: { type: integer } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/request-log/export:
    get:
      tags: [SecurityPortal]
      operationId: adminRequestLogExport
      summary: Export the request log (admin, CSV/JSON)
      description: "Streamed download, same filters as the index. Throttle 10/min."
      parameters:
        - { name: export, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: method, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string } }
      responses:
        "200": { description: "Stream.", content: { text/csv: { schema: { type: string, format: binary } }, application/json: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/blocked-ips:
    get:
      tags: [SecurityPortal]
      operationId: adminBlockedIpsIndex
      summary: List blocked IPs/CIDRs (admin)
      responses:
        "200": { description: "Block-list.", content: { application/json: { schema: { type: object, properties: { blocks: { type: array, items: { $ref: "#/components/schemas/BlockedIp" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [SecurityPortal]
      operationId: adminBlockIp
      summary: Add an IP/CIDR to the block-list (admin)
      description: "Throttle 60/min. 422 on malformed CIDR or duplicate."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [cidr], properties: { cidr: { type: string, maxLength: 64, example: 203.0.113.0/24 }, reason: { type: [string, "null"] } } } } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/blocked-ips/{blockedIp}:
    delete:
      tags: [SecurityPortal]
      operationId: adminUnblockIp
      summary: Remove an IP/CIDR from the block-list (admin)
      description: "Throttle 60/min."
      parameters:
        - { name: blockedIp, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Removed.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/block:
    post:
      tags: [SecurityPortal]
      operationId: adminBlockUser
      summary: Block a user (admin)
      description: "Signs the user out and prevents sign-in. Throttle 60/min."
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Blocked.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, blocked_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "You cannot block yourself." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/unblock:
    post:
      tags: [SecurityPortal]
      operationId: adminUnblockUser
      summary: Unblock a user (admin)
      description: "Throttle 60/min."
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Unblocked.", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/sessions:
    get:
      tags: [SecurityPortal]
      operationId: adminSessions
      summary: Cross-user session/device overview (admin)
      description: "Active web sessions + device tokens across all users. Throttle 60/min."
      responses:
        "200": { description: "Overview.", content: { application/json: { schema: { $ref: "#/components/schemas/SessionsOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/accounts/autoconfig:
    post:
      tags: [Mail]
      operationId: mailAccountsAutoconfig
      summary: Discover non-secret IMAP and SMTP settings from an email address
      description: "Throttle 10/min. Uses bounded DNS SRV and HTTPS autoconfig checks; credentials are neither accepted nor returned. All discovered hosts are SSRF-guarded."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        "200":
          description: Discovery result; candidates remain user-reviewable before saving.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configuration:
                    type: object
                    properties:
                      email: { type: string, format: email }
                      domain: { type: string }
                      domain_resolves: { type: boolean }
                      imap: { type: [object, "null"], properties: { host: { type: string }, port: { type: integer }, encryption: { type: string, enum: [ssl, tls, starttls, none] }, username: { type: [string, "null"] } } }
                      smtp: { type: [object, "null"], properties: { host: { type: string }, port: { type: integer }, encryption: { type: string, enum: [ssl, tls, starttls, none] }, username: { type: [string, "null"] } } }
                      sources: { type: array, items: { type: string, enum: [autoconfig, srv, dns] } }
                      outlook_autodiscover: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/accounts:
    get:
      tags: [Mail]
      operationId: mailAccountsIndex
      summary: List the caller's mail accounts (with message counts)
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { type: array, items: { $ref: '#/components/schemas/MailAccount' } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Mail]
      operationId: mailAccountsStore
      summary: Create a mail account
      description: "Throttle 60/min. AssignsOwner stamps user_id; the password is write-only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                host: { type: string, maxLength: 255, description: "SSRF-guarded (SafeHost)." }
                port: { type: integer, minimum: 1, maximum: 65535 }
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 2000, description: "Write-only; never returned." }
                encryption: { type: string, enum: [ssl, tls, starttls, none] }
                folders: { type: [array, "null"], items: { type: string } }
                backfill_since: { type: [string, "null"], format: date }
                delete_after_import: { type: [boolean, "null"] }
                skip_spam: { type: [boolean, "null"] }
                enabled: { type: [boolean, "null"] }
                sync_interval_minutes: { type: [integer, "null"], minimum: 1, maximum: 1440 }
                smtp_host: { type: [string, "null"], maxLength: 255, description: "SSRF-guarded (SafeHost). Enables compose/reply/forward." }
                smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
                smtp_username: { type: [string, "null"], maxLength: 255 }
                smtp_password: { type: [string, "null"], maxLength: 2000, description: "Write-only; never returned." }
                smtp_encryption: { type: [string, "null"], enum: [ssl, tls, starttls, none, null] }
                from_name: { type: [string, "null"], maxLength: 255 }
                from_email: { type: [string, "null"], format: email, maxLength: 255 }
              required: [name, host, port, username, password, encryption]
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, properties: { account: { $ref: '#/components/schemas/MailAccount' } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/accounts/{account}:
    put:
      tags: [Mail]
      operationId: mailAccountsUpdate
      summary: Update a mail account
      description: "Throttle 60/min. A blank password keeps the stored one."
      parameters:
        - { name: account, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                host: { type: string, maxLength: 255 }
                port: { type: integer, minimum: 1, maximum: 65535 }
                username: { type: string, maxLength: 255 }
                password: { type: [string, "null"], maxLength: 2000, description: "Blank keeps the current password." }
                encryption: { type: string, enum: [ssl, tls, starttls, none] }
                folders: { type: [array, "null"], items: { type: string } }
                backfill_since: { type: [string, "null"], format: date }
                delete_after_import: { type: [boolean, "null"] }
                skip_spam: { type: [boolean, "null"] }
                enabled: { type: [boolean, "null"] }
                sync_interval_minutes: { type: [integer, "null"], minimum: 1, maximum: 1440 }
                smtp_host: { type: [string, "null"], maxLength: 255 }
                smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
                smtp_username: { type: [string, "null"], maxLength: 255 }
                smtp_password: { type: [string, "null"], maxLength: 2000, description: "Blank keeps the current SMTP password." }
                smtp_encryption: { type: [string, "null"], enum: [ssl, tls, starttls, none, null] }
                from_name: { type: [string, "null"], maxLength: 255 }
                from_email: { type: [string, "null"], format: email, maxLength: 255 }
              required: [name, host, port, username, encryption]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { account: { $ref: '#/components/schemas/MailAccount' } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Mail]
      operationId: mailAccountsDestroy
      summary: Delete a mail account (archived mail is kept)
      description: "Throttle 60/min. account_id nullOnDelete — archived messages survive."
      parameters:
        - { name: account, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/accounts/{account}/sync:
    post:
      tags: [Mail]
      operationId: mailAccountsSync
      summary: Trigger an on-demand sync
      description: "Throttle 60/min. Dispatches the pull-only sync producer."
      parameters:
        - { name: account, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Dispatched.
          content:
            application/json:
              schema: { type: object, properties: { dispatched: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/accounts/{account}/sync/cancel:
    post:
      tags: [Mail]
      operationId: mailAccountsCancelSync
      summary: Cancel an in-flight sync
      description: "Throttle 60/min. Cancels the ingest batch + settles to idle. Idempotent."
      parameters:
        - { name: account, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { type: object, properties: { cancelled: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/accounts/{account}/test:
    post:
      tags: [Mail]
      operationId: mailAccountsTest
      summary: Test the account's IMAP login (no changes)
      description: "Throttle 60/min. SSRF-guarded probe with the stored credentials; the detail is redacted."
      parameters:
        - { name: account, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                required: [ok, detail]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/accounts/{account}/status:
    get:
      tags: [Mail]
      operationId: mailAccountsStatus
      summary: Current sync status + message count
      parameters:
        - { name: account, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [idle, syncing, error] }
                  last_error: { type: [string, "null"] }
                  last_synced_at: { type: [string, "null"], format: date-time }
                  message_count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mail/accounts/{account}/logs:
    get:
      tags: [Mail]
      operationId: mailAccountsLogs
      summary: Read the account's sync/ingest diagnostic log
      description: "Throttle 600/min. Newest first; ?level filter; per_page 10..200. Cache-Control no-store."
      parameters:
        - { name: account, in: path, required: true, schema: { type: integer } }
        - { name: level, in: query, required: false, schema: { type: string, enum: [info, warn, error] } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 10, maximum: 200 } }
      responses:
        "200":
          description: Log page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MailLog' } }
                  meta: { type: object, properties: { current_page: { type: integer }, last_page: { type: integer }, total: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/folders:
    get:
      tags: [Mail]
      operationId: mailFolders
      summary: Folder tree with total + unread counts
      description: >
        Throttle 600/min. Owner-scoped. The distinct (account_id, folder) pairs
        with archived mail, each with its total + unread (unseen) counts;
        trashed messages excluded. Omit account_id for a unified view across
        every account.
      parameters:
        - { name: account_id, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Folder counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id: { type: [integer, "null"] }
                        folder: { type: string }
                        total: { type: integer }
                        unread: { type: integer }
                  total: { type: integer }
                  unread: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/messages:
    get:
      tags: [Mail]
      operationId: mailMessagesIndex
      summary: List archived messages (envelope rows)
      description: >
        Throttle 1200/min. Owner-scoped, paginated envelope listing. Omit
        account_id for a unified inbox. Full-text search (?q) runs server-side
        (pgsql tsvector / sqlite LIKE) over the search column + subject + sender.
      parameters:
        - { name: account_id, in: query, required: false, schema: { type: integer } }
        - { name: folder, in: query, required: false, schema: { type: string } }
        - { name: trashed, in: query, required: false, schema: { type: boolean }, description: "true = only trashed; default only non-trashed." }
        - { name: seen, in: query, required: false, schema: { type: boolean } }
        - { name: spam, in: query, required: false, schema: { type: boolean } }
        - { name: thread_id, in: query, required: false, schema: { type: string } }
        - { name: label, in: query, required: false, schema: { type: integer }, description: "Filter by label id." }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Full-text query." }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: "Date-range start (message Date)." }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: page, in: query, required: false, schema: { type: integer } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Message page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MailMessage' } }
                  meta: { type: object, properties: { total: { type: integer }, per_page: { type: integer }, current_page: { type: integer }, last_page: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/messages/{message}:
    get:
      tags: [Mail]
      operationId: mailMessagesShow
      summary: Read one archived message (full reader payload)
      description: "Throttle 1200/min. Adds text_body/html/headers_raw/references/attachments to the envelope."
      parameters:
        - { name: message, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Message.
          content:
            application/json:
              schema: { type: object, properties: { message: { $ref: '#/components/schemas/MailMessage' } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/messages/{message}/body:
    get:
      tags: [Mail]
      operationId: mailMessagesBody
      summary: Sandboxed HTML body document for a reader iframe
      description: >
        Throttle 3000/min. Returns the message's HTML body as a standalone
        document (text/html) for embedding in a sandboxed reader iframe. Served
        with `default-src 'none'; sandbox; style-src 'unsafe-inline'; img-src
        data:` by default. Safe embedded styling is preserved; scripts, fonts and
        CSS imports are always blocked. `?remote=1` explicitly permits remote
        images for this one message view. cid: inline images are rewritten to data:
        URIs.
      parameters:
        - { name: message, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: remote, in: query, required: false, schema: { type: boolean }, description: "Explicitly load remote images for this one message view." }
      responses:
        "200":
          description: HTML body document.
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/attachments/{attachment}/raw:
    get:
      tags: [Mail]
      operationId: mailAttachmentRaw
      summary: Stream an attachment's bytes (sandboxed)
      description: >
        Throttle 3000/min. Owner-scoped; streams the decoded attachment bytes
        with nosniff + `default-src 'none'; sandbox`. A small safe allowlist
        (png/jpeg/gif/webp/pdf/text-plain) renders inline; everything else is a
        forced download. Pass `download=1` to force attachment disposition and
        an octet-stream content type for every MIME type.
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: download, in: query, required: false, schema: { type: boolean, default: false }, description: "Force a browser download instead of an inline preview." }
      responses:
        "200":
          description: Attachment bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/attachments/{attachment}/save:
    post:
      tags: [Mail]
      operationId: mailAttachmentSave
      summary: Save an attachment into another module (Files / Paperless)
      description: >
        Throttle 60/min. Copies the server-held attachment bytes into a target
        module — no client upload. target=files creates a FileEntry (owner quota
        enforced, 413); target=paperless posts to the user's Paperless via their
        own credentials. (Gallery is not a module in this deployment.)
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, enum: [files, paperless] }
                folder_id: { type: [integer, "null"], description: "Owner-scoped Files folder (target=files only)." }
              required: [target]
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  target: { type: string }
                  file_id: { type: integer, description: "target=files." }
                  task: { type: string, description: "target=paperless task id." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "Files quota exceeded." }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/attachments/{attachment}/virustotal:
    post:
      tags: [Mail]
      operationId: mailAttachmentVirusTotal
      summary: Look up an attachment by SHA-256 at VirusTotal
      description: "Throttle 30/min. Owner-scoped. Only the locally computed SHA-256 is sent to VirusTotal; attachment bytes are never uploaded."
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: VirusTotal hash lookup result. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "VirusTotal is not configured, the stored API key was rejected, or the attachment is unavailable." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/signatures:
    get:
      tags: [Mail]
      operationId: mailSignaturesIndex
      summary: List account-assigned rich mail signatures
      responses:
        "200": { description: Signatures. }
    post:
      tags: [Mail]
      operationId: mailSignaturesStore
      summary: Create a rich signature and assign it to mail accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailSignatureInput"
      responses:
        "201": { description: Created. }
  /mail/signatures/{signature}:
    put:
      tags: [Mail]
      operationId: mailSignaturesUpdate
      summary: Update a signature, its account assignments and defaults
      parameters:
        - { name: signature, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailSignatureInput"
      responses:
        "200": { description: Updated. }
    delete:
      tags: [Mail]
      operationId: mailSignaturesDelete
      summary: Delete a signature
      parameters:
        - { name: signature, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted. }
  /mail/messages/seen:
    post:
      tags: [Mail]
      operationId: mailMessagesSeen
      summary: Mark messages read/unread (bulk)
      description: "Throttle 120/min. Owner-scoped; metadata only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
                seen: { type: boolean }
              required: [ids, seen]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/messages/trash:
    post:
      tags: [Mail]
      operationId: mailMessagesTrash
      summary: Move messages to trash (bulk soft-hide)
      description: "Throttle 60/min. Immutable archive — soft-hide only, never a hard delete."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
              required: [ids]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/messages/restore:
    post:
      tags: [Mail]
      operationId: mailMessagesRestore
      summary: Restore messages from trash (bulk)
      description: "Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
              required: [ids]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/messages/{message}/pushback:
    post:
      tags: [Mail]
      operationId: mailPushback
      summary: Push a message back to its origin mailbox (APPEND)
      description: >
        Throttle 60/min. Owner-scoped, deliberate write-to-origin (SSRF-guarded,
        no-store). APPENDs the server-held raw .eml to the origin IMAP mailbox
        (optionally a different folder), restoring \Seen. 502 on IMAP failure.
      parameters:
        - { name: message, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folder: { type: [string, "null"], description: "Target folder; defaults to the archived folder." }
      responses:
        "200":
          description: Appended.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Source account deleted or raw bytes unavailable." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "Origin IMAP APPEND failed." }
  /mail/messages/{message}/delete-origin:
    post:
      tags: [Mail]
      operationId: mailDeleteOrigin
      summary: Delete a message from its origin mailbox
      description: >
        Throttle 60/min. Owner-scoped, deliberate destructive write-to-origin
        (SSRF-guarded, no-store). Locates the message on the origin by its stored
        Message-Id and expunges it; the archived copy is kept. 502 on IMAP
        failure.
      parameters:
        - { name: message, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folder: { type: [string, "null"], description: "Folder to search; defaults to the archived folder." }
      responses:
        "200":
          description: Expunged.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, expunged: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Source account deleted or no Message-Id." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "Origin IMAP delete failed." }
  /mail/drafts:
    get:
      tags: [Mail]
      operationId: mailDraftIndex
      summary: List the caller's server-saved compose drafts
      responses:
        "200": { description: Drafts., content: { application/json: { schema: { type: object, properties: { drafts: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Mail]
      operationId: mailDraftStore
      summary: Create a server-saved compose draft
      description: >
        Every referenced id (account, signature, signing key, recipient keys,
        files, gallery photos) must belong to the caller. At most 200 drafts are
        kept per account; beyond that the call returns 422 draft_limit_reached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [compose, reply, forward] }, mail_account_id: { type: [integer, "null"] }, source_message_id: { type: [string, "null"], format: uuid }, to: { type: array, items: { type: string, format: email } }, cc: { type: array, items: { type: string, format: email } }, bcc: { type: array, items: { type: string, format: email } }, subject: { type: [string, "null"] }, text_body: { type: [string, "null"] }, html_body: { type: [string, "null"] }, file_ids: { type: array, items: { type: integer } }, gallery_photo_ids: { type: array, items: { type: integer } }, read_receipt: { type: boolean }, high_priority: { type: boolean } } }
      responses:
        "201": { description: Created. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Validation failure. }
  /mail/drafts/{draft}:
    put:
      tags: [Mail]
      operationId: mailDraftUpdate
      summary: Update an owner-scoped compose draft
      parameters: [{ name: draft, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [compose, reply, forward] } } } } } }
      responses: { "200": { description: Updated. }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "422": { description: Validation failure. } }
    delete:
      tags: [Mail]
      operationId: mailDraftDestroy
      summary: Delete an owner-scoped compose draft
      parameters: [{ name: draft, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Deleted. }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /mail/messages/compose:
    post:
      tags: [Mail]
      operationId: mailCompose
      summary: Compose and send a new message over the account's SMTP
      description: >
        Throttle 60/min. Owner-scoped. Sends over the account's OWN encrypted
        SMTP credentials (SSRF-guarded) and appends the sent copy to the origin
        Sent folder. Opt-in — an account with no SMTP configured returns
        `no_smtp` (422). Attachments may be uploaded (multipart) and/or referenced
        by the caller's own archived attachment ids, Files ids and Gallery media
        ids. `read_receipt` adds a standards-based MDN request; `high_priority`
        adds normal SMTP priority headers. `crypto_*` IDs are resolved owner-scoped
        on the server; the browser never receives private key material. A crypto
        failure aborts delivery rather than falling back to plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id: { type: integer }
                to: { type: array, items: { type: string, format: email } }
                cc: { type: array, items: { type: string, format: email } }
                bcc: { type: array, items: { type: string, format: email } }
                subject: { type: [string, "null"] }
                text: { type: [string, "null"] }
                html: { type: [string, "null"] }
                signature_id: { type: [integer, "null"], minimum: -1, description: "Assigned signature id; omit for account default, -1 for none." }
                attachment_ids: { type: array, items: { type: string, format: uuid } }
                file_ids: { type: array, items: { type: integer }, description: "Caller-owned Files entries to attach." }
                gallery_photo_ids: { type: array, items: { type: integer }, description: "Caller-owned Gallery media to attach." }
                read_receipt: { type: boolean }
                high_priority: { type: boolean }
                crypto_mode: { type: string, enum: [none, sign, encrypt, sign_encrypt] }
                crypto_type: { type: [string, "null"], enum: [pgp, smime, null] }
                signing_key_id: { type: [integer, "null"], description: "Caller-owned private key id." }
                recipient_key_ids: { type: array, items: { type: integer }, description: "Caller-owned public recipient key ids." }
                sent_folder: { type: [string, "null"] }
          multipart/form-data:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id: { type: integer }
                "to[]": { type: array, items: { type: string, format: email } }
                subject: { type: string }
                text: { type: string }
                html: { type: string }
                signature_id: { type: integer, minimum: -1 }
                "attachments[]": { type: array, items: { type: string, format: binary } }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, message_id: { type: [string, "null"] }, appended_to_sent: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Validation failure ({ ok:false, error:validation, errors }) OR a business
            rejection with a machine `error` code (no_recipient, empty_body, no_smtp,
            account_deleted).
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, error: { type: string }, errors: { type: object, additionalProperties: true } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "SMTP send failed." }
  /mail/messages/{message}/reply:
    post:
      tags: [Mail]
      operationId: mailReply
      summary: Reply to a message (quotes the original, threads via References)
      description: >
        Throttle 60/min. Owner-scoped. Recipient = the original Reply-To (else
        From); `all=true` adds the original To+Cc (minus self) as Cc. Quotes the
        original body, subject prefixed `Re:`. Sends over the account SMTP +
        appends to Sent. `no_smtp`/`account_deleted` → 422.
      parameters:
        - { name: message, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: [string, "null"] }
                html: { type: [string, "null"] }
                signature_id: { type: [integer, "null"], minimum: -1, description: "Assigned signature id; omit for account default, -1 for none." }
                all: { type: [boolean, "null"], description: "Reply-all." }
                sent_folder: { type: [string, "null"] }
                attachments: { type: array, maxItems: 20, items: { type: string, format: binary } }
                attachment_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
                file_ids: { type: array, maxItems: 20, items: { type: integer } }
                gallery_photo_ids: { type: array, maxItems: 20, items: { type: integer } }
                read_receipt: { type: [boolean, "null"] }
                high_priority: { type: [boolean, "null"] }
                crypto_mode: { type: string, enum: [none, sign, encrypt, sign_encrypt] }
                crypto_type: { type: [string, "null"], enum: [pgp, smime, null] }
                signing_key_id: { type: [integer, "null"] }
                recipient_key_ids: { type: array, items: { type: integer } }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, message_id: { type: [string, "null"] }, appended_to_sent: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Validation failure OR business rejection (no_smtp, account_deleted, no_recipient)."
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, error: { type: string }, errors: { type: object, additionalProperties: true } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "SMTP send failed." }
  /mail/messages/{message}/forward:
    post:
      tags: [Mail]
      operationId: mailForward
      summary: Forward a message (attaches the original .eml, subject Fwd:)
      description: >
        Throttle 60/min. Owner-scoped. Attaches the immutable original `.eml`
        (message/rfc822 — carrying its own attachments) and a forwarded-message
        header block; subject prefixed `Fwd:`. Sends over the account SMTP +
        appends to Sent. `no_smtp`/`account_deleted` → 422; missing `to` → 422.
      parameters:
        - { name: message, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: array, minItems: 1, items: { type: string, format: email } }
                cc: { type: array, items: { type: string, format: email } }
                text: { type: [string, "null"] }
                html: { type: [string, "null"] }
                signature_id: { type: [integer, "null"], minimum: -1, description: "Assigned signature id; omit for account default, -1 for none." }
                sent_folder: { type: [string, "null"] }
                attachments: { type: array, maxItems: 20, items: { type: string, format: binary } }
                attachment_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
                file_ids: { type: array, maxItems: 20, items: { type: integer } }
                gallery_photo_ids: { type: array, maxItems: 20, items: { type: integer } }
                read_receipt: { type: [boolean, "null"] }
                high_priority: { type: [boolean, "null"] }
                crypto_mode: { type: string, enum: [none, sign, encrypt, sign_encrypt] }
                crypto_type: { type: [string, "null"], enum: [pgp, smime, null] }
                signing_key_id: { type: [integer, "null"] }
                recipient_key_ids: { type: array, items: { type: integer } }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, message_id: { type: [string, "null"] }, appended_to_sent: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Validation failure ({ ok:false, error:validation, errors }) OR business rejection (no_smtp, account_deleted)."
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, error: { type: string }, errors: { type: object, additionalProperties: true } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "SMTP send failed." }
  /mail/keys:
    get:
      tags: [Mail]
      operationId: mailKeysIndex
      summary: List the user's PGP / S-MIME decryption keys
      description: >
        Owner-scoped. Returns PUBLIC material only — the private key and
        passphrase are stored encrypted + hidden and are NEVER returned.
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { $ref: '#/components/schemas/MailKey' } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Mail]
      operationId: mailKeysStore
      summary: Import a PGP secret key or an S-MIME PKCS#12 bundle
      description: >
        Throttle 60/min. Import only. type=pgp needs an armored secret key;
        type=smime needs a PKCS#12 bundle (converted to PEM server-side). The
        material comes from either an inline upload (source=upload, default:
        armored_private_key / p12_base64) OR a file already stored in the Files
        module (source=files + file_id — owner-scoped, a foreign/unknown id is
        404; the file's bytes are read as the armored key / raw PKCS#12). The
        private key + passphrase are stored encrypted and are NEVER returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [pgp, smime] }
                label: { type: string, maxLength: 200 }
                passphrase: { type: [string, "null"] }
                source:
                  type: [string, "null"]
                  enum: [upload, files, null]
                  description: "Key-material source. Default upload."
                file_id:
                  type: [integer, "null"]
                  description: "Files module FileEntry id (required when source=files; owner-scoped)."
                armored_private_key: { type: [string, "null"], description: "PGP inline upload: armored secret key." }
                p12_base64: { type: [string, "null"], description: "S-MIME inline upload: base64 PKCS#12 bundle." }
              required: [type, label]
      responses:
        "201":
          description: Imported.
          content:
            application/json:
              schema: { type: object, properties: { key: { $ref: '#/components/schemas/MailKey' } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/keys/generate:
    post:
      tags: [Mail]
      operationId: mailKeysGenerate
      summary: Generate a PGP keypair or a self-signed S-MIME cert+key server-side
      description: >
        Throttle 60/min. Generates a fresh key server-side and persists it —
        type=pgp via gpg (RSA or modern ECC), type=smime a self-signed X.509
        cert + RSA key via openssl. The private key + passphrase are stored
        encrypted and are NEVER returned (response is public material only).
        Returns 501 when the required toolchain (gpg / openssl) is unavailable so
        the client can fall back to import.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailKeyGenerateRequest' }
      responses:
        "201":
          description: Generated.
          content:
            application/json:
              schema: { type: object, properties: { key: { $ref: '#/components/schemas/MailKey' } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { description: "Key-generation toolchain (gpg / openssl) unavailable." }
  /mail/keys/{key}:
    delete:
      tags: [Mail]
      operationId: mailKeysDestroy
      summary: Delete a decryption key
      description: "Throttle 60/min. Owner-scoped."
      parameters:
        - { name: key, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/messages/labels:
    post:
      tags: [Mail]
      operationId: mailMessagesLabels
      summary: Bulk attach / detach labels across messages
      description: "Throttle 120/min. Owner-scoped; only the caller's messages + labels are touched."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
                add: { type: array, items: { type: integer } }
                remove: { type: array, items: { type: integer } }
              required: [ids]
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/labels:
    get:
      tags: [Mail]
      operationId: mailLabelsIndex
      summary: List labels (with message counts)
      responses:
        "200": { description: Labels., content: { application/json: { schema: { type: object, properties: { labels: { type: array, items: { $ref: '#/components/schemas/MailLabel' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Mail]
      operationId: mailLabelsStore
      summary: Create a label
      description: "Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                color: { type: [string, "null"], description: "Hex color." }
              required: [name]
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { label: { $ref: '#/components/schemas/MailLabel' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/labels/{label}:
    put:
      tags: [Mail]
      operationId: mailLabelsUpdate
      summary: Rename / recolor a label
      description: "Throttle 60/min."
      parameters: [{ name: label, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, color: { type: [string, "null"] } }, required: [name] }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { label: { $ref: '#/components/schemas/MailLabel' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Mail]
      operationId: mailLabelsDestroy
      summary: Delete a label
      description: "Throttle 60/min."
      parameters: [{ name: label, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/rules:
    get:
      tags: [Mail]
      operationId: mailRulesIndex
      summary: List ingest rules
      responses:
        "200": { description: Rules., content: { application/json: { schema: { type: object, properties: { rules: { type: array, items: { $ref: '#/components/schemas/MailRule' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Mail]
      operationId: mailRulesStore
      summary: Create an ingest rule
      description: "Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailRule' }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { rule: { $ref: '#/components/schemas/MailRule' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/rules/{rule}:
    put:
      tags: [Mail]
      operationId: mailRulesUpdate
      summary: Update an ingest rule
      description: "Throttle 60/min."
      parameters: [{ name: rule, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailRule' }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { rule: { $ref: '#/components/schemas/MailRule' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Mail]
      operationId: mailRulesDestroy
      summary: Delete an ingest rule
      description: "Throttle 60/min."
      parameters: [{ name: rule, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/saved-searches:
    get:
      tags: [Mail]
      operationId: mailSavedSearchesIndex
      summary: List saved searches
      responses:
        "200": { description: Saved searches., content: { application/json: { schema: { type: object, properties: { saved_searches: { type: array, items: { $ref: '#/components/schemas/MailSavedSearch' } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Mail]
      operationId: mailSavedSearchesStore
      summary: Create a saved search
      description: "Throttle 60/min."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, filters: { type: object, additionalProperties: true } }, required: [name, filters] }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { saved_search: { $ref: '#/components/schemas/MailSavedSearch' } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/saved-searches/{search}:
    delete:
      tags: [Mail]
      operationId: mailSavedSearchesDestroy
      summary: Delete a saved search
      description: "Throttle 60/min."
      parameters: [{ name: search, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/export:
    post:
      tags: [Mail]
      operationId: mailExport
      summary: Export messages as .mbox or a ZIP of .eml
      description: >
        Throttle 60/min. Owner-scoped. Selection = ids[] OR folder OR label.
        format=mbox streams an mboxrd file; format=zip a ZIP of .eml files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [mbox, zip] }
                ids: { type: array, items: { type: string, format: uuid } }
                folder: { type: [string, "null"] }
                label: { type: [integer, "null"] }
              required: [format]
      responses:
        "200":
          description: Export stream.
          content:
            application/mbox: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/stats:
    get:
      tags: [Mail]
      operationId: mailStats
      summary: Storage stats (totals + per account/folder)
      description: "Throttle 120/min. Owner-scoped."
      responses:
        "200":
          description: Stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_messages: { type: integer }
                  total_bytes: { type: integer }
                  per_account: { type: array, items: { type: object, properties: { account_id: { type: [integer, "null"] }, count: { type: integer }, bytes: { type: integer } } } }
                  per_folder: { type: array, items: { type: object, properties: { account_id: { type: [integer, "null"] }, folder: { type: string }, count: { type: integer }, bytes: { type: integer } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mail/raw/{blob}:
    get:
      tags: [Mail]
      operationId: mailRaw
      summary: Download the raw .eml bytes of a message
      description: >
        Throttle 600/min. Streams the immutable raw RFC822 (message/rfc822) with
        nosniff + `default-src 'none'; sandbox`. `?download=1` forces an
        attachment (the single-message export). The path param is the message id.
      parameters:
        - { name: blob, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: download, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Raw message.
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
