name: Security scan

# Dependency + filesystem vulnerability scanning and SBOM generation. Runs on
# pushes, PRs, and weekly so new CVEs against pinned versions surface promptly.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # Laravel lives in backend/ (repo split); composer/phpstan run there. The
    # container-action steps (trivy, gitleaks) use their own path inputs and are
    # unaffected by this default; the npm SBOM step overrides it to frontend/.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer audit
        run: composer audit --no-interaction

      - name: PHPStan (static analysis, blocking)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      # Rector runs as a non-blocking dry-run report: it surfaces dead code /
      # code-quality suggestions without failing the build. Sensitive crypto /
      # blob / backup / sharing paths must be hand-reviewed before any apply, so
      # nothing is auto-applied in CI. See rector.php.
      - name: Rector (dry-run report, non-blocking)
        run: composer rector || true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          # The SPA (and its yarn.lock) lives in frontend/ after the repo split;
          # setup-node's cache otherwise looks for a lock at the repo root.
          cache-dependency-path: frontend/yarn.lock

      - name: yarn audit (runtime deps)
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile --non-interactive
          # Blocking, like composer audit: a runtime advisory fails the build
          # (project canon — a red audit is a release blocker).
          yarn audit --level moderate --groups dependencies

      # CycloneDX SBOMs (one per build, uploaded as artifacts). Complements the
      # SPDX SBOM emitted by the trivy job. Composer plugin + npm tool pinned.
      - name: Generate SBOM (CycloneDX, Composer)
        if: always()
        run: composer CycloneDX:make-sbom --output-format=JSON --output-file=sbom.composer.cdx.json --spec-version=1.6

      - name: Generate SBOM (CycloneDX, JS deps)
        if: always()
        working-directory: frontend
        # cyclonedx-npm reads a package-lock; the project uses Yarn, so synthesize
        # a lock from package.json (no install) just for the SBOM. Artifact-only,
        # non-blocking.
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund || true
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-format JSON --output-file sbom.npm.cdx.json || true

      - name: Upload CycloneDX SBOM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: |
            backend/sbom.composer.cdx.json
            frontend/sbom.npm.cdx.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so a secret committed in any past commit is caught.
          fetch-depth: 0

      - name: gitleaks (secret scan, blocking)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --redact --no-banner

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan (lockfiles + IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (SPDX)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: sbom.spdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
