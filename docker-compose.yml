# Ledgerline — self-hosted stack. App in Docker; TLS + routing via Caddy on the
# host (reverse_proxy to 127.0.0.1:${APP_PORT}). See docker/caddy/ledgerline.caddy.
#
#   cp .env.docker.example .env   # then fill APP_KEY, passwords, DOMAIN
#   docker compose build
#   docker compose up -d
#
# Rolling release: scripts/deploy.sh <version>.

x-app-image: &app-image
  # Pull-deploy: LEDGERLINE_IMAGE points at the CI-built GHCR image
  # (ghcr.io/maltekiefer/ledgerline:<tag>) so the box PULLS instead of building
  # on-box (scripts/deploy-pull.sh). Falls back to the local build tag for
  # `docker compose build` (dev / scripts/deploy.sh).
  image: ${LEDGERLINE_IMAGE:-ledgerline:${IMAGE_TAG:-local}}
  build:
    context: .
    # Build on the host network: this host's Docker daemon has no external DNS
    # for bridge-network build containers (its resolver lives on a netbird
    # overlay reachable only in the host netns), so apt/composer/npm fetches
    # fail otherwise. Host-net build uses the host's working resolver.
    network: host
    args:
      # Keep this digest in lockstep with the ARG PHP_BASE default in Dockerfile —
      # this build arg overrides that default, so a PHP bump must change BOTH.
      PHP_BASE: serversideup/php:8.5-fpm-nginx-alpine@sha256:13af81f6fb5fbb9e26c6a7cd9e8c8bf22e32dd21842ae3c587b9ac4f24da4c6e
  env_file: .env
  environment:
    # This host has no route to the EC2 instance-metadata IP (169.254.169.254),
    # which is black-holed rather than refused. Without this, the AWS SDK's
    # credential provider probes IMDS on every S3 call and blocks until timeout,
    # hanging photo processing (renditions/metadata) for minutes. We always pass
    # explicit S3 keys, so IMDS is never needed — disable the probe outright.
    AWS_EC2_METADATA_DISABLED: "true"
    # Let nginx accept large uploads (the base image defaults to 100M, which
    # rejects big files with an HTTP/2 stream error). Keep in sync with the PHP
    # post/upload limits and Caddy's request_body max_size.
    NGINX_CLIENT_MAX_BODY_SIZE: "560M"
    # PHP memory_limit (serversideup honours PHP_MEMORY_LIMIT). The base default
    # (~256M) is too small for the backup worker, which streams blob archives via
    # PharData — a large fileset overruns it, and a PHP fatal "allowed memory
    # exhausted" is NOT catchable, so the worker process dies mid-job with no
    # recorded exception and the run is later reaped as "Interrupted (no
    # progress)". The worker service overrides this higher (see below).
    PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-512M}"
    # Image + PHP scratch on the roomy storage volume, NOT the small RAM /tmp
    # tmpfs below. A large HEIC decode makes ImageMagick disk-cache hundreds of
    # MB of scratch; on the 2 GB tmpfs that fills it and thumbnail writes fail
    # (404). The storage volume has terabytes free. AppServiceProvider ensures
    # the dir exists before the first tempnam/Imagick call.
    TMPDIR: /var/www/html/storage/app/imgtmp
    TMP: /var/www/html/storage/app/imgtmp
    MAGICK_TMPDIR: /var/www/html/storage/app/imgtmp
    MAGICK_TEMPORARY_PATH: /var/www/html/storage/app/imgtmp
  restart: unless-stopped
  # NOTE: a fully read-only root filesystem is NOT used — the serversideup base
  # renders /etc/nginx/nginx.conf from a template at boot (entrypoint
  # 10-init-webserver-config.sh), which fails on a read-only /etc; S6_READ_ONLY_
  # ROOT only redirects s6's own /run state, not that write. The container is
  # already hardened via non-root (www-data), cap_drop:[ALL] and no-new-privileges.
  security_opt:
    - no-new-privileges:true
  # Drop ALL Linux capabilities, then add back only what the serversideup base
  # needs to su-exec from root down to www-data and fix file ownership. Verified
  # to boot cleanly; blocks NET_RAW (ARP spoofing) and every other unused cap.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    - KILL
  depends_on:
    db:
      condition: service_healthy
    valkey:
      condition: service_healthy
  networks:
    - internal
  volumes:
    - app-storage:/var/www/html/storage/app
    # A size-capped RAM tmpfs for /tmp (legacy: the removed ZK gallery decrypted
    # originals here so plaintext never hit disk). Heavy image scratch now goes to
    # the storage volume via TMPDIR/MAGICK_TMPDIR above — this stays small for any
    # remaining incidental temp use.
    - type: tmpfs
      target: /tmp
      tmpfs:
        size: 2147483648

services:
  app:
    <<: *app-image
    # Only this service runs migrations + optimize on start (isolated lock
    # prevents races); worker/scheduler skip it.
    environment:
      # Repeated from the x-app-image anchor: an explicit `environment:` here
      # REPLACES (does not merge with) the anchor's, so anything the web app needs
      # from the anchor must be restated or it is lost. Verified with
      # `docker compose config`: without restating these the app service falls
      # back to serversideup's default nginx body size (which rejects big uploads)
      # and would hang on S3 without the IMDS opt-out.
      AWS_EC2_METADATA_DISABLED: "true"
      # Only this service runs nginx. Restate the upload ceiling (>= the app's
      # 550 MB max upload / PHP post_max_size / Caddy request_body) and turn off
      # nginx version disclosure in the Server header + its own error pages
      # (the app middleware strips Server/X-Powered-By on app responses, but nginx
      # emits its own error responses e.g. 413/400 before PHP is reached).
      NGINX_CLIENT_MAX_BODY_SIZE: "560M"
      NGINX_SERVER_TOKENS: "off"
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
      AUTORUN_LARAVEL_EVENT_CACHE: "true"
      # Image + PHP scratch on the roomy storage volume, NOT the small RAM /tmp
      # tmpfs (a large HEIC decode disk-caches hundreds of MB and would fill it →
      # thumbnail 404). An explicit environment: block REPLACES the anchor's, so
      # these must be restated here.
      TMPDIR: /var/www/html/storage/app/imgtmp
      TMP: /var/www/html/storage/app/imgtmp
      MAGICK_TMPDIR: /var/www/html/storage/app/imgtmp
      MAGICK_TEMPORARY_PATH: /var/www/html/storage/app/imgtmp
    ports:
      # Bind host is configurable: default 127.0.0.1 (prod sits behind Caddy on the
      # host loopback). A LAN-only preview box sets APP_BIND=0.0.0.0 in .env to
      # expose the port directly — no compose edit needed (a local edit would abort
      # every `git checkout` deploy).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8300}:8080"
    deploy:
      resources:
        limits:
          # Hard ceiling for the web app (nginx + php-fpm children). CPU is a
          # throttle (never OOM-kills) — a high, env-overridable default so it
          # only bites a runaway, keeping one service from starving the host.
          cpus: "${APP_CPU_LIMIT:-4}"
          memory: ${APP_MEMORY_LIMIT:-8g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Queue workers. Scale up to 10 processes:  docker compose up -d --scale worker=10
  # Each replica is capped at WORKER_MEMORY_LIMIT (default 768m) so 10 workers
  # stay within ~7.5g. queue:work also self-restarts past its own memory bound.
  worker:
    <<: *app-image
    # --timeout must be >= RunBackupJob::$timeout (3600s) so a long backup is
    # governed by the job's own timeout, not force-killed at 600s. --memory (the
    # Laravel soft bound) is aligned with the higher PHP memory_limit below.
    command: ["php", "/var/www/html/artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600", "--timeout=3660", "--memory=${WORKER_PHP_MEMORY:-2048}"]
    # Overrides the anchor environment (an explicit block replaces the merged-in
    # one), so repeat the anchor vars and raise PHP_MEMORY_LIMIT for the backup
    # worker (PharData blob-archive builds are memory-hungry).
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      NGINX_CLIENT_MAX_BODY_SIZE: "560M"
      PHP_MEMORY_LIMIT: "${WORKER_PHP_MEMORY_LIMIT:-2048M}"
      TMPDIR: /var/www/html/storage/app/imgtmp
      TMP: /var/www/html/storage/app/imgtmp
      MAGICK_TMPDIR: /var/www/html/storage/app/imgtmp
      MAGICK_TEMPORARY_PATH: /var/www/html/storage/app/imgtmp
    deploy:
      # replicas is only applied when you don't pass --scale; keep 1 by default.
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2}"
          memory: ${WORKER_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "grep -la queue:work /proc/*/cmdline >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app-image
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    deploy:
      resources:
        limits:
          cpus: "${SCHEDULER_CPU_LIMIT:-1}"
          memory: ${SCHEDULER_MEMORY_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "grep -la schedule:work /proc/*/cmdline >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    # pgvector image (Postgres 18 + the `vector` extension) for image-similarity
    # duplicate detection. PGDATA is pinned to the legacy /var/lib/postgresql/data
    # path: postgres:18 changed its default to a version-namespaced subdir under
    # /var/lib/postgresql, but we keep the old layout so the pgdata volume mount
    # (target /var/lib/postgresql/data) stays identical across the pg17→pg18 jump.
    image: pgvector/pgvector:pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ledgerline}
      POSTGRES_USER: ${DB_USERNAME:-ledgerline}
      # Keep PG18 on the pre-18 data-dir layout (matches the volume mount below).
      PGDATA: /var/lib/postgresql/data
      # Password read from a Docker secret file, not a process-visible env var.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    # NOTE: read_only rootfs is NOT used on Postgres — the official entrypoint
    # writes runtime state OUTSIDE the data volume (the /var/run/postgresql
    # socket dir + a postmaster PID/lock, and it can regenerate config on boot);
    # a read-only root reliably breaks the cluster start, and this is the
    # crown-jewel datastore. Hardened instead via non-root, cap_drop:[ALL],
    # no-new-privileges, a secret-file password, and the internal-only network.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          # Generous, env-overridable ceilings: a bound so a runaway query can't
          # exhaust host RAM/CPU and take the whole (internet-facing) box down,
          # while staying well above a personal instance's working set so it
          # never OOM-kills normal operation. Lower on a small box via env.
          cpus: "${DB_CPU_LIMIT:-2}"
          memory: ${DB_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ledgerline} -d ${DB_DATABASE:-ledgerline}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    # Build the config from the mounted secret at start so the password is never
    # on the command line (visible in `ps`/`docker inspect`) nor in an env var.
    command: ["sh", "-c", "printf 'requirepass %s\\ndir /data\\nappendonly yes\\n' \"$$(cat /run/secrets/redis_password)\" > /tmp/valkey.conf && exec valkey-server /tmp/valkey.conf"]
    secrets:
      - redis_password
    volumes:
      - valkey-data:/data
    # NOTE: read_only root is NOT set here — Docker Compose cannot mount the
    # `redis_password` secret into a read_only service ("cannot create secret in
    # read-only service valkey: `file` is the sole supported option"), which aborts
    # the whole `up`. Verified on deploy (v1.562.0). Compensated: non-root,
    # cap_drop:[ALL], no-new-privileges, internal-only network, secret-file password.
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # CHOWN + FOWNER so RDB/AOF rewrites can rename over data files left by a
      # prior (root-owned) run; without them the save fails with EPERM.
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          # Ceiling so a session/cache/queue-store blow-up can't take the host
          # down; generous vs a two-user working set. Lower via env on a small
          # box (ideally also set a valkey maxmemory + eviction policy).
          cpus: "${VALKEY_CPU_LIMIT:-1}"
          memory: ${VALKEY_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Machine-learning sidecar for image recognition: object/scene tagging + smart
  # search (CLIP) and facial recognition — the same engine Immich uses. The app
  # reaches it over the internal network at http://ml:3003 (ML_URL). Models are
  # downloaded on first use into the ml-cache volume. Enable with:
  #   docker compose --profile ml up -d
  ml:
    # Plain digest-pinned (no ${VAR:-default} wrapper) so Dependabot's docker
    # ecosystem can parse and bump it like the other services; tag + digest move
    # together on every bump.
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    profiles: ["ml"]
    environment:
      MACHINE_LEARNING_WORKERS: "1"
      MACHINE_LEARNING_MODEL_TTL: "300"
    volumes:
      - ml-cache:/cache
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    deploy:
      resources:
        limits:
          cpus: "${ML_CPU_LIMIT:-4}"
          memory: ${ML_MEMORY_LIMIT:-8g}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:3003/ping')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional self-hosted Photon reverse-geocoder, so photo coordinates for the
  # imported regions never leave the host. Enable with:
  #   docker compose --profile geocode up -d
  # then set PHOTON_URL=http://photon:2322 in .env (and, for automatic on-upload
  # geocoding, GALLERY_GEOCODE_ON_UPLOAD=true). PHOTON_REGION picks the coverage;
  # the default "germany" pulls a PREBUILT index (db mode: a light ~few-GB
  # download into photon-data, ~2 GB heap, no heavy build) to fit a modest box.
  # Points OUTSIDE the imported region
  # fall back to the public GEOCODER_URL (OSM) — the app queries Photon first and
  # Nominatim only on a miss. Reverse endpoint: /reverse (GeoJSON).
  photon:
    image: ghcr.io/rtuszik/photon-docker:2.3.1@sha256:729f883612bde3215c156111b421d8e0a27b1eb411b92ef4a24bd587b8259b04
    profiles: ["geocode"]
    environment:
      # db mode = prebuilt single-region index (light, ~2 GB heap, no build).
      # For wider coverage on a bigger box, set PHOTON_IMPORT_MODE=jsonl and
      # PHOTON_REGION to a comma list (e.g. europe,north-america).
      IMPORT_MODE: ${PHOTON_IMPORT_MODE:-db}
      REGION: ${PHOTON_REGION:-germany}
      UPDATE_STRATEGY: DISABLED
    volumes:
      - photon-data:/photon/data
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "${PHOTON_CPU_LIMIT:-2}"
          memory: ${PHOTON_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:2322/status' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Optional self-hosted GraphHopper router for Explore tour auto-routing, so the
  # planned-route geometry never leaves the host AND you get elevation + OSM
  # surface data (which OSRM does not provide). Opt-in; the default deploy stays
  # on OSRM/straight-line. Enable with:
  #   1. Drop an OSM region extract at ./data/graphhopper/region.osm.pbf
  #      (e.g. from https://download.geofabrik.de/, matching PHOTON_REGION), and a
  #      ./data/graphhopper/config.yml enabling the "foot"/"hike" profile with
  #      graph.elevation.provider: srtm (elevation) — see .env.docker.example.
  #   2. In .env:  MAPS_ROUTE_ENGINE=graphhopper
  #                MAPS_ROUTE_UPSTREAM=http://graphhopper:8989
  #                MAPS_ROUTE_PROFILE=hike   # (or foot — must match config.yml)
  #   3. docker compose --profile maps up -d
  # FIRST RUN imports the .pbf into a routing graph — this is slow (minutes for a
  # regional extract, longer for a country) and one-time; the built graph is cached
  # in the graphhopper-data volume, so subsequent starts are fast. Watch progress
  # with `docker compose logs -f graphhopper` and wait for the container to become
  # healthy before switching the engine. Internal-only (no host port).
  #
  # NOTE: this is the community-maintained image the official GraphHopper README
  # points to (hub.docker.com/r/israelhikingmap/graphhopper); the GraphHopper org
  # publishes no `graphhopper/graphhopper` image. Tag 11.0 == GraphHopper 11.0.
  # Plain digest-pinned (no ${VAR:-default} wrapper) so Dependabot's docker
  # ecosystem can parse and bump it; tag + digest move together on every bump.
  graphhopper:
    image: israelhikingmap/graphhopper:11.0@sha256:e77e14e48ea69ea7bb0eb71ddc9d583e5ce85dd295475572371f72ed4880a1ff
    profiles: ["maps"]
    # The image's ENTRYPOINT is `./graphhopper.sh -c config-example.yml`. That
    # wrapper drives graph.location + datareader.file from its OWN CLI flags
    # (-o / -i) via -D overrides — the config file alone can't set them (a bare
    # launch defaults the graph to /data/default-gh with no OSM input and dies).
    # So we append a command: its args are parsed after the entrypoint's, and the
    # later -c wins. The operator supplies, under ./data/graphhopper (mounted at
    # /data): region.osm.pbf (the OSM extract) + config-example.yml (profiles,
    # encoded_values, elevation/surface). The built graph persists in the
    # graphhopper-data volume (/graphhopper-graph-cache) — see .env.docker.example.
    command: ["-i", "/data/region.osm.pbf", "-o", "/graphhopper-graph-cache", "-c", "/data/config-example.yml"]
    environment:
      # Cap the JVM heap so a regional graph fits a modest box; raise on a bigger
      # host or for country/continent extracts.
      JAVA_OPTS: ${GRAPHHOPPER_JAVA_OPTS:--Xmx2g -Xms1g}
    volumes:
      # region.osm.pbf + config-example.yml supplied by the operator; graph persists.
      # Mounted read-only: GraphHopper only READS the .pbf + config here and writes
      # the built graph to the separate cache volume (-o /graphhopper-graph-cache).
      - ./data/graphhopper:/data:ro
      - graphhopper-data:/graphhopper-graph-cache
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "${GRAPHHOPPER_CPU_LIMIT:-2}"
          memory: ${GRAPHHOPPER_MEMORY_LIMIT:-3g}
    healthcheck:
      # GraphHopper (Dropwizard) serves the routing API on 8989; the /info
      # endpoint returns once the graph is loaded and routing is ready. (The
      # Dropwizard /healthcheck lives on the separate admin connector, so /info
      # on the app port is the reliable "routing is up" signal here.)
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8989/info' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Bounded Docker control agent (profile-gated, opt-in). Holds the docker
  # socket so the main app never has to; exposes ONLY a fixed allowlist of
  # actions on this project's own compose services, gated by a shared token,
  # reachable only on the internal network. See docker/agent/agent.py + the
  # security register. The app talks to it at http://agent:9000.
  agent:
    image: docker:28-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
    profiles: ["agent"]
    command: ["sh", "-c", "apk add --no-cache python3 >/dev/null 2>&1 && exec python3 /agent/agent.py"]
    environment:
      AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:-}
      AGENT_PROJECT_DIR: /project
      COMPOSE_PROFILES: ml,agent,geocode,maps,backup
      # The project dir is mounted at /project, so compose would otherwise infer
      # the project name "project" and not see/act on the real "ledgerline-*"
      # containers. Pin it to the host project name.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-ledgerline}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/agent:/agent:ro
      - .:/project:ro
    working_dir: /project
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  internal:

# Datastore passwords sourced from the existing .env vars but delivered to the
# containers as mounted secret FILES (/run/secrets/*), never as a process env
# var or on the command line — so they don't show in `docker inspect` env or
# `/proc/<pid>/environ`. No operator file management needed; the value still
# comes from DB_PASSWORD / REDIS_PASSWORD in .env.
secrets:
  db_password:
    environment: DB_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD

volumes:
  pgdata:
  valkey-data:
  app-storage:
  ml-cache:
  photon-data:
  graphhopper-data:

